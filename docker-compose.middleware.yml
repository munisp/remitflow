version: "3.9"
# ── RemitFlow — Enterprise Middleware Stack ───────────────────────────────────
# Includes: Kafka, Redis, Keycloak, Dapr, OpenSearch, APISIX, TigerBeetle,
#           Temporal, Permify, Fluvio, MinIO (Lakehouse), Mojaloop, Prometheus,
#           Grafana, Jaeger
#
# Usage:
#   docker compose -f docker-compose.middleware.yml up -d
#   docker compose -f docker-compose.middleware.yml down -v

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Zookeeper (Kafka dependency) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: remitflow_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: remitflow_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Kafka Schema Registry ─────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: remitflow_schema_registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Kafka UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: remitflow_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: remitflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: remitflow_redis
    restart: unless-stopped
    command: redis-server --requirepass remitflow_redis_secret --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "remitflow_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── RedisInsight ──────────────────────────────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: remitflow_redis_insight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Keycloak 24 ───────────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: remitflow_keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: remitflow_keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: remitflow_admin_secret
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── OpenSearch ────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: remitflow_opensearch
    restart: unless-stopped
    environment:
      cluster.name: remitflow-cluster
      node.name: remitflow-node1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── OpenSearch Dashboards ─────────────────────────────────────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: remitflow_opensearch_dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── APISIX API Gateway ────────────────────────────────────────────────────
  apisix-etcd:
    image: bitnami/etcd:3.5
    container_name: remitflow_apisix_etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://apisix-etcd:2379
    volumes:
      - apisix_etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  apisix:
    image: apache/apisix:3.9.0-debian
    container_name: remitflow_apisix
    restart: unless-stopped
    depends_on:
      apisix-etcd:
        condition: service_healthy
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9091:9091"
      - "9092:9092"
    volumes:
      - ./config/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./config/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/apisix/admin/routes"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── APISIX Dashboard ──────────────────────────────────────────────────────
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: remitflow_apisix_dashboard
    restart: unless-stopped
    depends_on:
      apisix-etcd:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./config/apisix/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Temporal ──────────────────────────────────────────────────────────────
  temporal-db:
    image: postgres:16-alpine
    container_name: remitflow_temporal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_secret
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  temporal:
    image: temporalio/auto-setup:1.23.0
    container_name: remitflow_temporal
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_secret
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    volumes:
      - ./config/temporal:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - remitflow_middleware
    logging: *default-logging

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: remitflow_temporal_ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Permify ───────────────────────────────────────────────────────────────
  permify-db:
    image: postgres:16-alpine
    container_name: remitflow_permify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: permify
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: permify_secret
    volumes:
      - permify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permify"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  permify:
    image: ghcr.io/permify/permify:v0.10.0
    container_name: remitflow_permify
    restart: unless-stopped
    depends_on:
      permify-db:
        condition: service_healthy
    ports:
      - "3476:3476"
      - "3478:3478"
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://permify:permify_secret@permify-db:5432/permify
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
      PERMIFY_GRPC_PORT: 3476
      PERMIFY_HTTP_PORT: 3478
    volumes:
      - ./config/permify:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3478/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Fluvio ────────────────────────────────────────────────────────────────
  fluvio:
    image: infinyon/fluvio:latest
    container_name: remitflow_fluvio
    restart: unless-stopped
    ports:
      - "9003:9003"
      - "9010:9010"
    command: run
    volumes:
      - fluvio_data:/var/lib/fluvio
    healthcheck:
      test: ["CMD", "fluvio", "cluster", "status"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── MinIO (Lakehouse / Iceberg) ───────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-06T05-26-02Z
    container_name: remitflow_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9004:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: remitflow_minio
      MINIO_ROOT_PASSWORD: remitflow_minio_secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: remitflow_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: remitflow_grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: remitflow_grafana_secret
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Jaeger (Distributed Tracing) ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: remitflow_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Mojaloop (Simplified — Central Ledger) ────────────────────────────────
  mojaloop-central-ledger:
    image: mojaloop/central-ledger:v17.3.3
    container_name: remitflow_mojaloop_central_ledger
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      KAFKA_HOST: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: remitflow_redis_secret
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── TigerBeetle ─────────────────────────────────────────────────────────
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.6
    container_name: remitflow_tigerbeetle
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - tigerbeetle_data:/var/lib/tigerbeetle
    entrypoint: >
      sh -c '
        if [ ! -f /var/lib/tigerbeetle/0_0.tigerbeetle ]; then
          tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /var/lib/tigerbeetle/0_0.tigerbeetle;
        fi;
        tigerbeetle start --addresses=0.0.0.0:3001 /var/lib/tigerbeetle/0_0.tigerbeetle
      '
    healthcheck:
      test: ["CMD", "sh", "-c", "echo | nc localhost 3001"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── OpenAppSec WAF Agent ───────────────────────────────────────────────
  openappsec-agent:
    image: openappsec/agent:latest
    container_name: remitflow_openappsec_agent
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      OPENAPPSEC_MODE: prevent
      OPENAPPSEC_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Dapr Placement Service ────────────────────────────────────────────────
  dapr-placement:
    image: daprio/dapr:1.13.0
    container_name: remitflow_dapr_placement
    restart: unless-stopped
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"
    networks:
      - remitflow_middleware
    logging: *default-logging

  # ── Dapr Sidecar (RemitFlow App) ───────────────────────────────────────
  dapr-sidecar:
    image: daprio/daprd:1.13.0
    container_name: remitflow_dapr_sidecar
    restart: unless-stopped
    depends_on:
      - dapr-placement
      - redis
      - kafka
    command:
      - "./daprd"
      - "-app-id"
      - "remitflow"
      - "-app-port"
      - "3000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "dapr-placement:50006"
      - "-components-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
    ports:
      - "3500:3500"
      - "50001:50001"
    volumes:
      - ./config/dapr/components:/components:ro
    network_mode: host
    logging: *default-logging

volumes:
  tigerbeetle_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  redis_data:
  keycloak_db_data:
  opensearch_data:
  apisix_etcd_data:
  temporal_db_data:
  permify_db_data:
  fluvio_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  remitflow_middleware:
    driver: bridge
    name: remitflow_middleware
