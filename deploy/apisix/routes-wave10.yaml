# APISIX Wave-10 Routes — RemitFlow (SPEC-wave10 C5)
# ─────────────────────────────────────────────────────────────────────────────
# Every route below targets a REAL backend path (V2-R4). The Wave-10 business
# APIs are tRPC routers on the Node backend — there are NO standalone
# /partner/v1/* or /pl/* handlers. tRPC-over-HTTP mapping convention:
#
#   mutation  →  POST /api/trpc/<router>.<procedure>     (JSON body)
#   query     →  GET  /api/trpc/<router>.<procedure>?input=<urlencoded JSON>
#
# Public partner/link paths are mapped onto those canonical tRPC paths with
# the stock APISIX proxy-rewrite plugin (regex_uri). Query strings are
# preserved across the rewrite, so tRPC GET queries keep their ?input= param.
#
# Surfaces:
#   /partner/v1/*                → embeddedPayouts tRPC router (C5):
#                                    createPayout (mutation), getPayout (query),
#                                    corridors (query)
#   /pl/*                        → paymentLinks tRPC router (C2):
#                                    resolve (query), payCard / payBank /
#                                    payWallet (mutations)
#   /api/trpc/billCapture.inboundEmail
#                                → bill-capture inbound-email webhook (C3)
#   /services/bill-capture       → Python bill-capture OCR service (internal-only)
#   /services/accounting-sync    → Go accounting-sync service (internal-only)
#
# Only plugins shipped with apache/apisix:3.9 are used (proxy-rewrite,
# limit-count, limit-req, api-breaker, key-auth, consumer-restriction) — same
# discipline as infra/apisix/stablecoin-routes.yaml. WAF inspection is
# performed by the open-appsec agent at the container/ingress layer — it is
# NOT an APISIX plugin (see deploy/openappsec/profile-wave10.yaml and
# docker-compose.security.yml).
# Applied idempotently alongside services/gateway-config/apply-stablecoin-routes.py
# (requires infra/apisix/stablecoin-routes.yaml applied first — mutation routes
# here reference its `remitflow-backend` upstream).
#
# wave14 (SPEC-wave14 §7) performance tuning:
#   - Upstreams carry keepalive_pool (connection reuse) and an explicit
#     connect/send/read timeout budget. `remitflow-backend` itself is defined
#     in infra/apisix/stablecoin-routes.yaml (keepalive/timeout added there).
#   - Retry policy: APISIX has NO route-level `retries` field — retries are an
#     upstream attribute. To give idempotent GET queries one retry WITHOUT
#     enabling gateway replay of mutations, the three GET query routes below
#     use `remitflow-backend-read` (defined at the bottom of this file): SAME
#     backend nodes as `remitflow-backend`, different retry policy
#     (retries: 1). Every POST/mutation route stays on `remitflow-backend`
#     (retries: 0) — a payout or payment must never be re-sent by the gateway.
#     (Even where retries exist, nginx/openresty never passes an already-sent
#     non-idempotent request to the next server; the split upstream makes the
#     intent explicit instead of relying on that default.)
#   - limit-count policy: left at the default `local` (per-worker counter).
#     `policy: redis` was evaluated and NOT applied — the `redis` service
#     (docker-compose.yml:34, redis:6379, ACL user remitflow_app) is on the
#     compose default network while the apisix container
#     (docker-compose.yml:1075) is only on remitflow-internal/-external, and
#     REDIS_APP_PASSWORD is not provisioned to the apisix container or the
#     route-render path. Effective limits are (count × worker count) until a
#     redis network link + credential path exist; these are DoS guardrails,
#     not exact quotas.

routes:
  # ─── PARTNER: Embedded Payouts (/partner/v1/* → embeddedPayouts tRPC) ─────
  # key-auth identifies the partner consumer; the tRPC router additionally
  # verifies the partner API key + HMAC-SHA256 body signature
  # (x-payout-signature, PAYOUTS_API_HMAC_SECRET) — fail closed when either is
  # missing/invalid. Rate limits are per partner consumer.

  # Create payout: POST /partner/v1/payouts → embeddedPayouts.createPayout
  - id: wave10-partner-payout-create
    uri: /partner/v1/payouts
    methods: [POST]
    upstream_id: remitflow-backend   # mutation (POST): upstream retries: 0 — never replayed
    plugins:
      proxy-rewrite:
        regex_uri: ["^/partner/v1/payouts$", "/api/trpc/embeddedPayouts.createPayout"]
      key-auth:
        header: x-api-key
        hide_credentials: true
      limit-count:
        count: 120
        time_window: 60
        key: consumer_name
        rejected_code: 429
      limit-req:
        rate: 10
        burst: 20
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # Payout status: GET /partner/v1/payouts/get?input={...} → embeddedPayouts.getPayout
  - id: wave10-partner-payout-get
    uri: /partner/v1/payouts/get
    methods: [GET]
    # Idempotent GET query: retries: 1 via remitflow-backend-read (see header).
    upstream_id: remitflow-backend-read
    plugins:
      proxy-rewrite:
        regex_uri: ["^/partner/v1/payouts/get$", "/api/trpc/embeddedPayouts.getPayout"]
      key-auth:
        header: x-api-key
        hide_credentials: true
      limit-count:
        count: 120
        time_window: 60
        key: consumer_name
        rejected_code: 429
      limit-req:
        rate: 10
        burst: 20
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # Corridor quote: GET /partner/v1/corridors → embeddedPayouts.corridors
  - id: wave10-partner-corridors
    uri: /partner/v1/corridors
    methods: [GET]
    # Idempotent GET query: retries: 1 via remitflow-backend-read (see header).
    upstream_id: remitflow-backend-read
    plugins:
      proxy-rewrite:
        regex_uri: ["^/partner/v1/corridors$", "/api/trpc/embeddedPayouts.corridors"]
      key-auth:
        header: x-api-key
        hide_credentials: true
      limit-count:
        count: 120
        time_window: 60
        key: consumer_name
        rejected_code: 429
      limit-req:
        rate: 10
        burst: 20
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── PUBLIC: Payment Links (/pl/* → paymentLinks tRPC) ────────────────────
  # Tokenized public endpoints — no gateway consumer. Aggressive per-IP rate
  # limits: token guessing must be uneconomic. OpenAppSec profile
  # wave10-public applies SQLi/XSS inspection at the ingress layer.

  # Resolve a link token: GET /pl/resolve?input={"token":"..."} → paymentLinks.resolve
  - id: wave10-payment-link-resolve
    uri: /pl/resolve
    methods: [GET]
    # Idempotent GET query: retries: 1 via remitflow-backend-read (see header).
    upstream_id: remitflow-backend-read
    plugins:
      proxy-rewrite:
        regex_uri: ["^/pl/resolve$", "/api/trpc/paymentLinks.resolve"]
      limit-count:
        count: 30
        time_window: 60
        key: remote_addr
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 5
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # Pay by card (creates a cardFunding intent): POST /pl/pay/card → paymentLinks.payCard
  - id: wave10-payment-link-pay-card
    uri: /pl/pay/card
    methods: [POST]
    upstream_id: remitflow-backend   # mutation (POST): upstream retries: 0 — never replayed
    plugins:
      proxy-rewrite:
        regex_uri: ["^/pl/pay/card$", "/api/trpc/paymentLinks.payCard"]
      limit-count:
        count: 30
        time_window: 60
        key: remote_addr
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 5
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # Pay by bank: POST /pl/pay/bank → paymentLinks.payBank
  - id: wave10-payment-link-pay-bank
    uri: /pl/pay/bank
    methods: [POST]
    upstream_id: remitflow-backend   # mutation (POST): upstream retries: 0 — never replayed
    plugins:
      proxy-rewrite:
        regex_uri: ["^/pl/pay/bank$", "/api/trpc/paymentLinks.payBank"]
      limit-count:
        count: 30
        time_window: 60
        key: remote_addr
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 5
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # Pay from RemitFlow wallet (session-auth'd tRPC): POST /pl/pay/wallet → paymentLinks.payWallet
  - id: wave10-payment-link-pay-wallet
    uri: /pl/pay/wallet
    methods: [POST]
    upstream_id: remitflow-backend   # mutation (POST): upstream retries: 0 — never replayed
    plugins:
      proxy-rewrite:
        regex_uri: ["^/pl/pay/wallet$", "/api/trpc/paymentLinks.payWallet"]
      limit-count:
        count: 30
        time_window: 60
        key: remote_addr
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 5
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── WEBHOOK: Bill-capture inbound email (billCapture.inboundEmail) ───────
  # Mailbox-provider → backend webhook. INBOUND-EMAIL SECURITY NOTES:
  #   - NO key-auth here: the mailbox provider is not an APISIX consumer and
  #     cannot hold gateway credentials. Authentication is enforced INSIDE the
  #     tRPC procedure: shared-secret header `x-inbound-email-secret` checked
  #     constant-time against INBOUND_EMAIL_SECRET — fail closed (503) when
  #     the secret is unset, 401 on mismatch.
  #   - Per-IP limit-req only: secret-guessing and attachment flooding must be
  #     uneconomic. The procedure additionally enforces a MIME/extension
  #     allowlist, a 20 MiB document cap, sha256 idempotency, and
  #     token-hash tenant resolution.
  #   - The route exposes ONLY this single procedure path — no /pl-style
  #     wildcard — so the gateway never broadens the public tRPC surface.
  - id: wave10-bill-capture-inbound-email
    uri: /api/trpc/billCapture.inboundEmail
    methods: [POST]
    upstream_id: remitflow-backend   # mutation (POST): upstream retries: 0 — never replayed
    plugins:
      limit-req:
        rate: 5
        burst: 10
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── INTERNAL: Bill Capture OCR service (:8112) ────────────────────────────
  # Internal-only: restricted to named consumers (service accounts). The
  # service itself also enforces INTERNAL_SERVICE_KEY constant-time compare.
  - id: wave10-bill-capture-internal
    uri: /services/bill-capture/*
    methods: [GET, POST]
    upstream:
      type: roundrobin
      nodes:
        "bill-capture:8112": 1
      # wave14: connection reuse + timeout budget (numeric seconds per schema).
      keepalive_pool:
        size: 32
        idle_timeout: 60
        requests: 1000
      timeout:
        connect: 2
        send: 10
        read: 10
      retries: 0   # mixed GET/POST service; never replay a mutation
    plugins:
      key-auth:
        header: x-api-key
        hide_credentials: true
      consumer-restriction:
        whitelist:
          - remitflow-backend
      limit-req:
        rate: 20
        burst: 20
        key: consumer_name
        rejected_code: 429

  # ─── INTERNAL: Accounting Sync service (:8113) ─────────────────────────────
  # Internal-only: restricted to named consumers (service accounts). OAuth
  # callback relays are proxied only through this route, never public.
  - id: wave10-accounting-sync-internal
    uri: /services/accounting-sync/*
    methods: [GET, POST]
    upstream:
      type: roundrobin
      nodes:
        "accounting-sync:8113": 1
      # wave14: connection reuse + timeout budget (numeric seconds per schema).
      keepalive_pool:
        size: 32
        idle_timeout: 60
        requests: 1000
      timeout:
        connect: 2
        send: 10
        read: 10
      retries: 0   # mixed GET/POST service; never replay a mutation
    plugins:
      key-auth:
        header: x-api-key
        hide_credentials: true
      consumer-restriction:
        whitelist:
          - remitflow-backend
      limit-req:
        rate: 20
        burst: 20
        key: consumer_name
        rejected_code: 429

# ─── UPSTREAMS ───────────────────────────────────────────────────────────────
# wave14: read-only twin of `remitflow-backend` (infra/apisix/stablecoin-routes.yaml).
# SAME backend nodes — this is a retry-policy split, not new infrastructure:
# APISIX carries retries on the upstream, so idempotent GET queries get one
# retry here while every mutation route stays on `remitflow-backend`
# (retries: 0). Keep nodes in lockstep with `remitflow-backend`.
upstreams:
  - id: remitflow-backend-read
    type: roundrobin
    nodes:
      - host: remitflow-server
        port: 3000
        weight: 1
    keepalive_pool:
      size: 32
      idle_timeout: 60   # seconds
      requests: 1000
    timeout:
      connect: 2         # seconds
      send: 10
      read: 10
    retries: 1           # idempotent GET routes only (see header)
    health_check:
      active:
        http_path: /api/health
        interval: 5
        timeout: 3
        healthy:
          http_statuses: [200]

# ─── PgBouncer note (wave14 C6 — guidance only, NO config change here) ──────
# A2 found a PgBouncer service defined but unused: docker-compose.yml:674
# (`pgbouncer`, edoburu/pgbouncer:1.22.0, pgbouncer:6432, POOL_MODE=transaction,
# profiles [full, monitoring], upstream postgres:5432). Several services take
# DATABASE_URL from the environment (docker-compose.yml — `${DATABASE_URL}`
# form); those deployments can be pointed at the pooler WITHOUT code changes by
# setting DATABASE_URL to the pgbouncer endpoint (host `pgbouncer`, port 6432)
# at deploy time. Do NOT hardcode DSNs in repo files. Caveats to verify before
# switching a service: transaction pooling breaks session-level state
# (SET/NOTIFY, session advisory locks, session GUCs) and multi-statement
# prepared transactions; pgbouncer is currently behind compose profiles, so it
# only exists in `full`/`monitoring` deployments.
# TODO(infra): no dedicated env hook (e.g. PG_DSN_HOST indirection) exists —
# the `api` service hardcodes postgres:5432 in docker-compose.yml:68, so
# pooler adoption there needs a compose/env change owned by the compose track.
#END
