# RemitFlow v90 — Prometheus Configuration
# Scrapes v90 service metrics endpoints

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: remitflow-v90
    env: production

scrape_configs:
  - job_name: sanctions-api
    static_configs:
      - targets: ['sanctions-api:9100']
    metrics_path: /metrics
    scheme: http

  - job_name: swift-simulator
    static_configs:
      - targets: ['swift-simulator:9110']
    metrics_path: /metrics
    scheme: http

  - job_name: sepa-simulator
    static_configs:
      - targets: ['sepa-simulator:9111']
    metrics_path: /metrics
    scheme: http

  - job_name: open-banking-hub
    static_configs:
      - targets: ['open-banking-hub:9200']
    metrics_path: /metrics
    scheme: http

  - job_name: regulatory-svc
    static_configs:
      - targets: ['regulatory-svc:9300']
    metrics_path: /metrics
    scheme: http

  - job_name: fraud-api-v2
    static_configs:
      - targets: ['fraud-api-v2:9400']
    metrics_path: /metrics
    scheme: http

  - job_name: redis-v90
    static_configs:
      - targets: ['redis-v90:9121']
    metrics_path: /metrics
    scheme: http

  - job_name: remitflow-app
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /api/metrics
    scheme: http
