groups:
  - name: remitflow_critical
    interval: 30s
    rules:
      - alert: HighTransferFailureRate
        expr: rate(remitflow_transfer_failures_total[5m]) / rate(remitflow_transfers_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Transfer failure rate above 5%"
          description: "Transfer failure rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API p95 latency above 2s"
          description: "95th percentile latency is {{ $value }}s on {{ $labels.route }}."

      - alert: DatabaseConnectionPoolExhausted
        expr: remitflow_db_pool_waiting > 10
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "DB connection pool exhausted"
          description: "{{ $value }} queries waiting for a DB connection."

      - alert: FXEngineDown
        expr: up{job="fx-engine"} == 0
        for: 1m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "FX Engine is down"
          description: "The FX rate engine has been unreachable for more than 1 minute."

      - alert: AMLEngineDown
        expr: up{job="aml-engine"} == 0
        for: 2m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "AML Engine is down"
          description: "The AML screening engine has been unreachable for more than 2 minutes."

      - alert: FraudMLDown
        expr: up{job="fraud-ml"} == 0
        for: 2m
        labels:
          severity: warning
          team: compliance
        annotations:
          summary: "Fraud ML service is down"
          description: "The fraud scoring service has been unreachable for more than 2 minutes."

      - alert: HighFraudScore
        expr: remitflow_fraud_score_avg > 0.8
        for: 5m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "Average fraud score critically high"
          description: "Average fraud score is {{ $value }} — possible attack in progress."

      - alert: KYCQueueBacklog
        expr: remitflow_kyc_pending_reviews > 100
        for: 10m
        labels:
          severity: warning
          team: compliance
        annotations:
          summary: "KYC review queue backlog"
          description: "{{ $value }} KYC documents pending review for more than 10 minutes."

      - alert: WalletBalanceAnomaly
        expr: remitflow_wallet_negative_balance_count > 0
        for: 1m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Negative wallet balance detected"
          description: "{{ $value }} wallets have negative balances — possible double-spend."

      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "SSL certificate expiring within 14 days"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Memory usage above 90%"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk space above 85%"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}."

  - name: remitflow_compliance
    interval: 60s
    rules:
      - alert: LargeTransactionUnscreened
        expr: remitflow_large_transactions_unscreened > 0
        for: 5m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "Large transactions not AML-screened"
          description: "{{ $value }} transactions above $10,000 have not been AML-screened."

      - alert: SARFilingOverdue
        expr: remitflow_sar_overdue_count > 0
        for: 1h
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "SAR filing overdue"
          description: "{{ $value }} Suspicious Activity Reports are overdue for filing."

      - alert: TravelRuleViolation
        expr: remitflow_travel_rule_violations_total > 0
        for: 1m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "FATF Travel Rule violation detected"
          description: "{{ $value }} transfers missing required originator/beneficiary information."
