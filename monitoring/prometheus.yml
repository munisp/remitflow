# RemitFlow Prometheus Configuration
# Scrapes the Node.js app metrics endpoint and all microservices

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: remitflow
    environment: production

# Alerting rules (optional — extend as needed)
rule_files:
  - "alerts/*.yml"

scrape_configs:
  # ── Main Node.js Application ─────────────────────────────────────────────────
  - job_name: remitflow-app
    static_configs:
      - targets: ["app:3000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Go FX Engine ─────────────────────────────────────────────────────────────
  - job_name: fx-engine
    static_configs:
      - targets: ["fx-engine:8081"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ── Go Transfer Engine ────────────────────────────────────────────────────────
  - job_name: transfer-engine
    static_configs:
      - targets: ["transfer-engine:50051"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ── Python Analytics ─────────────────────────────────────────────────────────
  - job_name: analytics
    static_configs:
      - targets: ["analytics:8085"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ── Rust AML Engine ───────────────────────────────────────────────────────────
  - job_name: aml-engine
    static_configs:
      - targets: ["aml-engine:8083"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ── Python Fraud ML ───────────────────────────────────────────────────────────
  - job_name: fraud-ml
    static_configs:
      - targets: ["fraud-ml:8082"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ── Prometheus self-monitoring ────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
