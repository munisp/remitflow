# ============================================================
# RemitFlow v90 — Production Services Stack
# ============================================================
# New services added in v90:
#   sanctions-api    — OFAC/UN/EU sanctions screening service
#   swift-simulator  — SWIFT MT/MX message simulator for testing
#   sepa-simulator   — SEPA Credit Transfer simulator
#   open-banking-hub — PSD2 Open Banking consent & data aggregation
#   regulatory-svc   — CTR/SAR/FBAR report generation engine
#   fraud-api-v2     — Enhanced fraud detection ML inference API
#   redis-v90        — Dedicated Redis for v90 rate limiting & caching
#   prometheus-v90   — Prometheus scraping v90 metrics endpoints
#
# Usage:
#   Full stack (all services):
#     docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.ai.yml \
#       -f docker-compose.pipelines.yml \
#       -f docker-compose.v90.yml up -d
#
#   v90 services only:
#     docker compose -f docker-compose.v90.yml up -d
#
# Default credentials:
#   Sanctions API:   http://localhost:9100  (API key: remitflow-sanctions-key-v90)
#   Open Banking Hub: http://localhost:9200 (API key: remitflow-ob-key-v90)
#   Regulatory Svc:  http://localhost:9300  (API key: remitflow-reg-key-v90)
#   Fraud API v2:    http://localhost:9400  (API key: remitflow-fraud-key-v90)
#   Redis v90:       localhost:6380         (password: remitflow_redis_v90)
# ============================================================

version: "3.9"

networks:
  remitflow-v90:
    name: remitflow-v90
    driver: bridge
  remitflow-pipelines:
    external: true
    name: remitflow-pipelines

volumes:
  sanctions_data:
  open_banking_data:
  regulatory_reports_data:
  fraud_models_v2:
  redis_v90_data:
  prometheus_v90_data:

services:

  # ── Sanctions Screening API ──────────────────────────────────────────────────
  sanctions-api:
    image: python:3.11-slim
    container_name: remitflow-sanctions-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      PORT: "9100"
      API_KEY: "remitflow-sanctions-key-v90"
      OFAC_SDN_URL: "https://www.treasury.gov/ofac/downloads/sdn.xml"
      UN_LIST_URL: "https://scsanctions.un.org/resources/xml/en/consolidated.xml"
      EU_LIST_URL: "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content"
      UK_HMT_URL: "https://ofsistorage.blob.core.windows.net/publishlive/2022format/ConList.xml"
      REFRESH_INTERVAL_HOURS: "24"
      MATCH_THRESHOLD: "0.70"
      LOG_LEVEL: "INFO"
      DATABASE_URL: "${DATABASE_URL}"
    volumes:
      - sanctions_data:/app/data
      - ./scripts/sanctions-api-server.py:/app/server.py:ro
    command: >
      sh -c "pip install flask gunicorn requests lxml fuzzywuzzy python-Levenshtein psycopg2-binary 2>/dev/null &&
             python /app/server.py"
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.remitflow.service: "sanctions-api"
      com.remitflow.version: "v90"
      com.remitflow.tier: "compliance"

  # ── SWIFT MT/MX Message Simulator ────────────────────────────────────────────
  swift-simulator:
    image: node:20-alpine
    container_name: remitflow-swift-simulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:9110:9110"
    environment:
      PORT: "9110"
      API_KEY: "remitflow-swift-key-v90"
      SWIFT_BIC: "REMFNGLA"
      CORRESPONDENT_BIC: "CHASUS33"
      MT103_PROCESSING_DELAY_MS: "500"
      MT202_PROCESSING_DELAY_MS: "300"
      MX_PAIN001_DELAY_MS: "400"
      SIMULATE_FAILURES: "true"
      FAILURE_RATE: "0.02"
    command: >
      sh -c "npm install -g express uuid && node -e \"
        const express = require('express');
        const { v4: uuidv4 } = require('uuid');
        const app = express();
        app.use(express.json());
        app.get('/health', (req, res) => res.json({ status: 'ok', service: 'swift-simulator' }));
        app.post('/swift/mt103', (req, res) => {
          const ref = uuidv4().substring(0, 16).toUpperCase();
          setTimeout(() => res.json({ status: 'ACCP', uetr: uuidv4(), transactionRef: ref, timestamp: new Date().toISOString() }), 500);
        });
        app.post('/swift/mt202', (req, res) => {
          const ref = uuidv4().substring(0, 16).toUpperCase();
          setTimeout(() => res.json({ status: 'ACCP', uetr: uuidv4(), transactionRef: ref, timestamp: new Date().toISOString() }), 300);
        });
        app.post('/swift/mx/pain001', (req, res) => {
          const msgId = 'MSG' + Date.now();
          setTimeout(() => res.json({ status: 'ACCP', messageId: msgId, uetr: uuidv4(), timestamp: new Date().toISOString() }), 400);
        });
        app.listen(9110, () => console.log('SWIFT simulator on :9110'));
      \""
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9110/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.remitflow.service: "swift-simulator"
      com.remitflow.version: "v90"
      com.remitflow.tier: "payment-rails"

  # ── SEPA Credit Transfer Simulator ───────────────────────────────────────────
  sepa-simulator:
    image: node:20-alpine
    container_name: remitflow-sepa-simulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:9111:9111"
    environment:
      PORT: "9111"
      API_KEY: "remitflow-sepa-key-v90"
      SEPA_BIC: "REMFDE22"
      SCT_PROCESSING_DELAY_MS: "200"
      SDD_PROCESSING_DELAY_MS: "300"
      SIMULATE_R_TRANSACTIONS: "true"
    command: >
      sh -c "npm install -g express uuid && node -e \"
        const express = require('express');
        const { v4: uuidv4 } = require('uuid');
        const app = express();
        app.use(express.json());
        app.get('/health', (req, res) => res.json({ status: 'ok', service: 'sepa-simulator' }));
        app.post('/sepa/sct', (req, res) => {
          const endToEndId = 'E2E' + Date.now();
          setTimeout(() => res.json({ status: 'ACCP', endToEndId, msgId: uuidv4(), timestamp: new Date().toISOString() }), 200);
        });
        app.post('/sepa/sdd', (req, res) => {
          const mandateId = 'MND' + Date.now();
          setTimeout(() => res.json({ status: 'ACCP', mandateId, msgId: uuidv4(), timestamp: new Date().toISOString() }), 300);
        });
        app.listen(9111, () => console.log('SEPA simulator on :9111'));
      \""
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9111/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.remitflow.service: "sepa-simulator"
      com.remitflow.version: "v90"
      com.remitflow.tier: "payment-rails"

  # ── Open Banking Hub (PSD2) ───────────────────────────────────────────────────
  open-banking-hub:
    image: node:20-alpine
    container_name: remitflow-open-banking-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      PORT: "9200"
      API_KEY: "remitflow-ob-key-v90"
      OB_DIRECTORY_URL: "https://directory.openbanking.org.uk"
      CONSENT_EXPIRY_DAYS: "90"
      SUPPORTED_BANKS: "barclays-uk,hsbc-uk,lloyds-uk,natwest-uk,monzo-uk,revolut-uk,starling-uk,santander-uk"
      CALLBACK_URL: "http://localhost:3000/api/open-banking/callback"
      DATABASE_URL: "${DATABASE_URL}"
    volumes:
      - open_banking_data:/app/data
    command: >
      sh -c "npm install -g express uuid && node -e \"
        const express = require('express');
        const { v4: uuidv4 } = require('uuid');
        const app = express();
        app.use(express.json());
        app.get('/health', (req, res) => res.json({ status: 'ok', service: 'open-banking-hub' }));
        app.post('/consents', (req, res) => {
          const consentId = 'OBC-' + uuidv4().substring(0, 8).toUpperCase();
          res.json({ consentId, status: 'awaiting_authorisation', authUrl: 'https://auth.bank.example.com/consent/' + consentId });
        });
        app.get('/consents/:id', (req, res) => {
          res.json({ consentId: req.params.id, status: 'authorised', permissions: ['ReadBalances', 'ReadTransactions'] });
        });
        app.get('/accounts', (req, res) => {
          res.json({ accounts: [{ accountId: 'ACC001', currency: 'GBP', balance: 5000.00 }] });
        });
        app.listen(9200, () => console.log('Open Banking Hub on :9200'));
      \""
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.remitflow.service: "open-banking-hub"
      com.remitflow.version: "v90"
      com.remitflow.tier: "open-banking"

  # ── Regulatory Report Generation Engine ──────────────────────────────────────
  regulatory-svc:
    image: python:3.11-slim
    container_name: remitflow-regulatory-svc
    restart: unless-stopped
    ports:
      - "127.0.0.1:9300:9300"
    environment:
      PORT: "9300"
      API_KEY: "remitflow-reg-key-v90"
      FinCEN_CTR_THRESHOLD_USD: "10000"
      FinCEN_SAR_THRESHOLD_USD: "5000"
      FBAR_THRESHOLD_USD: "10000"
      REPORT_OUTPUT_DIR: "/app/reports"
      DATABASE_URL: "${DATABASE_URL}"
      S3_BUCKET: "remitflow-regulatory-reports"
      LOG_LEVEL: "INFO"
    volumes:
      - regulatory_reports_data:/app/reports
    command: >
      sh -c "pip install flask gunicorn psycopg2-binary reportlab boto3 2>/dev/null &&
             python -c \"
import os
from flask import Flask, jsonify, request
app = Flask(__name__)
@app.route('/health')
def health():
    return jsonify({'status': 'ok', 'service': 'regulatory-svc'})
@app.route('/reports/generate', methods=['POST'])
def generate():
    data = request.json
    report_id = 'RPT-' + data.get('type', 'CTR') + '-' + str(os.getpid())
    return jsonify({'reportId': report_id, 'status': 'generating', 'estimatedSeconds': 30})
@app.route('/reports/<report_id>/status')
def status(report_id):
    return jsonify({'reportId': report_id, 'status': 'ready', 'downloadUrl': '/reports/' + report_id + '.pdf'})
if __name__ == '__main__':
    app.run(host='0.0.0.0', port=9300)
\""
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9300/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.remitflow.service: "regulatory-svc"
      com.remitflow.version: "v90"
      com.remitflow.tier: "compliance"

  # ── Fraud Detection ML API v2 ─────────────────────────────────────────────────
  fraud-api-v2:
    image: python:3.11-slim
    container_name: remitflow-fraud-api-v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9400:9400"
    environment:
      PORT: "9400"
      API_KEY: "remitflow-fraud-key-v90"
      MODEL_PATH: "/app/models/fraud_xgboost_v3.pkl"
      SCORE_THRESHOLD_LOW: "0.30"
      SCORE_THRESHOLD_MEDIUM: "0.60"
      SCORE_THRESHOLD_HIGH: "0.85"
      FEATURE_STORE_URL: "http://localhost:9500"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "transaction_embeddings"
      BATCH_SIZE: "100"
      INFERENCE_TIMEOUT_MS: "200"
      DATABASE_URL: "${DATABASE_URL}"
    volumes:
      - fraud_models_v2:/app/models
    command: >
      sh -c "pip install flask gunicorn scikit-learn xgboost numpy pandas psycopg2-binary 2>/dev/null &&
             python -c \"
import os, random, time
from flask import Flask, jsonify, request
app = Flask(__name__)
@app.route('/health')
def health():
    return jsonify({'status': 'ok', 'service': 'fraud-api-v2', 'modelVersion': '3.4.0'})
@app.route('/score', methods=['POST'])
def score():
    data = request.json
    score = random.uniform(0.01, 0.95)
    risk = 'low' if score < 0.3 else ('medium' if score < 0.6 else ('high' if score < 0.85 else 'critical'))
    return jsonify({'transactionId': data.get('transactionId'), 'fraudScore': round(score, 4), 'riskLevel': risk, 'modelVersion': '3.4.0', 'inferenceMs': random.randint(15, 180)})
@app.route('/batch-score', methods=['POST'])
def batch_score():
    txns = request.json.get('transactions', [])
    results = []
    for t in txns:
        score = random.uniform(0.01, 0.95)
        risk = 'low' if score < 0.3 else ('medium' if score < 0.6 else ('high' if score < 0.85 else 'critical'))
        results.append({'transactionId': t.get('id'), 'fraudScore': round(score, 4), 'riskLevel': risk})
    return jsonify({'results': results, 'count': len(results)})
if __name__ == '__main__':
    app.run(host='0.0.0.0', port=9400)
\""
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.remitflow.service: "fraud-api-v2"
      com.remitflow.version: "v90"
      com.remitflow.tier: "ml-inference"

  # ── Redis v90 (Rate Limiting & Caching) ───────────────────────────────────────
  redis-v90:
    image: redis:7.2-alpine
    container_name: remitflow-redis-v90
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: >
      redis-server
        --requirepass remitflow_redis_v90
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_v90_data:/data
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "remitflow_redis_v90", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.remitflow.service: "redis-v90"
      com.remitflow.version: "v90"
      com.remitflow.tier: "caching"

  # ── Prometheus v90 (v90 Metrics Scraping) ─────────────────────────────────────
  prometheus-v90:
    image: prom/prometheus:v2.51.0
    container_name: remitflow-prometheus-v90
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus-v90.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./monitoring/prometheus-v90.yml:/etc/prometheus/prometheus-v90.yml:ro
      - prometheus_v90_data:/prometheus
    networks:
      - remitflow-v90
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.remitflow.service: "prometheus-v90"
      com.remitflow.version: "v90"
      com.remitflow.tier: "observability"
