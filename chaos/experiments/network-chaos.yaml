# RemitFlow — Chaos Experiment: Network Failures
# ═══════════════════════════════════════════════════════════════════════════════
# Validates platform behavior under network partition, latency injection,
# and DNS failures. Critical for a multi-service financial platform.
#
# Hypothesis: 200ms network latency should degrade response times but
# not cause transaction failures. Network partition between services
# should trigger circuit breaker → graceful degradation.
---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: remitflow-network-latency
  namespace: remitflow
  labels:
    chaos.litmus.io/category: network
spec:
  engineState: active
  appinfo:
    appns: remitflow
    applabel: app=remitflow-api
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-network-latency
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: NETWORK_LATENCY
              value: "200"
            - name: JITTER
              value: "50"
            - name: DESTINATION_IPS
              value: ""
            - name: DESTINATION_HOSTS
              value: "pgbouncer.remitflow.svc,redis-cache.remitflow.svc"
        probe:
          - name: transfer-still-works
            type: httpProbe
            httpProbe/inputs:
              url: "http://remitflow-api:5000/api/trpc/systemHealth.getStatus"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            mode: Continuous
            runProperties:
              probeTimeout: 10
              interval: 5
---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: remitflow-network-partition
  namespace: remitflow
  labels:
    chaos.litmus.io/category: network
spec:
  engineState: active
  appinfo:
    appns: remitflow
    applabel: app=rust-escrow-ledger
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-network-partition
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: DESTINATION_IPS
              value: ""
            - name: DESTINATION_HOSTS
              value: "pgbouncer.remitflow.svc"
            - name: NETWORK_INTERFACE
              value: "eth0"
            - name: POLICY_TYPES
              value: '["Egress"]'
        probe:
          - name: escrow-circuit-breaker
            type: httpProbe
            httpProbe/inputs:
              url: "http://rust-escrow-ledger:8096/health"
              method:
                get:
                  criteria: "!="
                  responseCode: "200"
            mode: EOT
            runProperties:
              probeTimeout: 5
              interval: 3
---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: remitflow-dns-chaos
  namespace: remitflow
  labels:
    chaos.litmus.io/category: network
spec:
  engineState: active
  appinfo:
    appns: remitflow
    applabel: app=remitflow-api
    appkind: deployment
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-dns-error
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: TARGET_HOSTNAMES
              value: "external-fx-provider.com,payment-rail.example.com"
        probe:
          - name: internal-services-unaffected
            type: httpProbe
            httpProbe/inputs:
              url: "http://remitflow-api:5000/health"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            mode: Continuous
            runProperties:
              probeTimeout: 5
              interval: 3
