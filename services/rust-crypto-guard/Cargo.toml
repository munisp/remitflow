[package]
name = "crypto_guard"
version = "1.0.0"
edition = "2021"
description = "RemitFlow Rust Cryptographic Security Service"

[[bin]]
name = "crypto_guard"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json"] }
# HTTP server
actix-web = "4"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JWT validation
jsonwebtoken = "9"
# Cryptographic operations
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
base64 = "0.22"
# Async runtime
tokio = { version = "1", features = ["full"] }
# PostgreSQL
tokio-postgres = "0.7"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
anyhow = "1"
thiserror = "2"

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
