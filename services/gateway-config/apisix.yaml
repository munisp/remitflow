# RemitFlow APISIX Configuration
# Apache APISIX 3.9 — API Gateway for RemitFlow platform
#
# Routes are managed dynamically via go-apisix-manager service.
# This file provides the base configuration.

apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

deployment:
  admin:
    allow_admin:
      # Loopback only — the Admin API port is published on 127.0.0.1 in compose.
      - 127.0.0.1/32
      # go-apisix-manager static IP on remitflow-internal (set in
      # docker-compose.yml). The ONLY workload identity allowed to call the
      # Admin API. Never widen to a subnet or 0.0.0.0/0.
      - 172.20.0.10/32
      # remitflow-internal bridge gateway: host processes reaching the
      # loopback-published 127.0.0.1:9180 appear with this source IP (DNAT).
      - 172.20.0.1/32
    admin_key:
      # ROTATE IMMEDIATELY: the previous keys were committed in plaintext and
      # must be considered compromised.
      # These values are env-substitution placeholders. docker-compose.yml
      # mounts this file as config.yaml.template and renders it into
      # conf/config.yaml at container start (sed + fail-closed placeholder
      # check). APISIX_ADMIN_KEY must match the value supplied to
      # go-apisix-manager. Never commit a rendered file.
      - name: "admin"
        key: ${APISIX_ADMIN_KEY}
        role: admin
      - name: "viewer"
        key: ${APISIX_VIEWER_KEY}
        role: viewer
    admin_listen:
      ip: 0.0.0.0
      port: 9180

  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30
    # etcd auth is enabled in compose (INFRA-001); the password is rendered
    # from ETCD_ROOT_PASSWORD at container start (same render as admin keys).
    username: root
    password: ${ETCD_ROOT_PASSWORD}

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: "0.0.0.0"
      port: 9091
    enable_export_server: true

