# RemitFlow APISIX Configuration
# Apache APISIX 3.9 — API Gateway for RemitFlow platform
#
# Routes are managed dynamically via go-apisix-manager service.
# This file provides the base configuration.

apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

deployment:
  admin:
    allow_admin:
      # Loopback only — the Admin API port is published on 127.0.0.1 in compose.
      - 127.0.0.1/32
      # go-apisix-manager reaches the Admin API from the remitflow-internal
      # docker network (172.20.0.0/16). Tighten to the manager's static IP in
      # production; never use 0.0.0.0/0.
      - 172.20.0.0/16
    admin_key:
      # ROTATE IMMEDIATELY: the previous keys were committed in plaintext and
      # must be considered compromised.
      # These values are env-substitution placeholders — this file MUST be
      # rendered at deploy time (e.g. `envsubst < apisix.yaml > conf/config.yaml`
      # or your CD secret-rendering step) before APISIX starts, with
      # APISIX_ADMIN_KEY matching the value supplied to go-apisix-manager.
      - name: "admin"
        key: ${APISIX_ADMIN_KEY}
        role: admin
      - name: "viewer"
        key: ${APISIX_VIEWER_KEY}
        role: viewer
    admin_listen:
      ip: 0.0.0.0
      port: 9180

  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: "0.0.0.0"
      port: 9091
    enable_export_server: true

plugins:
  - real-ip
  - ai
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - ext-plugin-pre-req
  - fault-injection
  - mocking
