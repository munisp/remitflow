# Fluvio Topics — Platform Hardening
# Real-time streaming for all hardened operations

topics:
  # KYC/KYB Events
  - name: remitflow.kyc.verification.result
    partitions: 6
    replication: 3
    retention_hours: 8760  # 1 year
    compression: lz4
    smart_modules:
      - name: pii-redactor
        type: filter-map
        description: Redact PII fields before downstream consumption

  - name: remitflow.kyc.rescreen.trigger
    partitions: 3
    replication: 3
    retention_hours: 2160  # 90 days

  - name: remitflow.kyb.ubo.analysis
    partitions: 3
    replication: 3
    retention_hours: 8760

  - name: remitflow.kyc.document.expiry
    partitions: 3
    replication: 3
    retention_hours: 4380  # 6 months

  # Stablecoin Events
  - name: remitflow.stablecoin.onramp.webhook
    partitions: 6
    replication: 3
    retention_hours: 8760

  - name: remitflow.stablecoin.offramp.settlement
    partitions: 6
    replication: 3
    retention_hours: 8760

  - name: remitflow.stablecoin.bridge.status
    partitions: 3
    replication: 3
    retention_hours: 2160

  - name: remitflow.stablecoin.depeg.alert
    partitions: 3
    replication: 3
    retention_hours: 8760
    smart_modules:
      - name: depeg-severity-filter
        type: filter
        description: Only pass alerts with severity >= warning

  - name: remitflow.stablecoin.yield.position
    partitions: 3
    replication: 3
    retention_hours: 4380

  - name: remitflow.stablecoin.dca.execution
    partitions: 3
    replication: 3
    retention_hours: 2160

  # Fund Flow Events
  - name: remitflow.fund.coordinator.step
    partitions: 12
    replication: 3
    retention_hours: 8760

  - name: remitflow.fund.compensation.retry
    partitions: 6
    replication: 3
    retention_hours: 8760

  - name: remitflow.fund.settlement.batch
    partitions: 3
    replication: 3
    retention_hours: 8760

  - name: remitflow.fund.velocity.alert
    partitions: 3
    replication: 3
    retention_hours: 4380

  - name: remitflow.fund.rate.lock
    partitions: 6
    replication: 3
    retention_hours: 720  # 30 days

  # Security Events
  - name: remitflow.security.pad.result
    partitions: 3
    replication: 3
    retention_hours: 8760

  - name: remitflow.security.canary.trigger
    partitions: 1
    replication: 3
    retention_hours: 8760
    smart_modules:
      - name: canary-alert-enricher
        type: map
        description: Enrich canary triggers with accessor profile data

  - name: remitflow.security.admin.anomaly
    partitions: 3
    replication: 3
    retention_hours: 8760

  - name: remitflow.security.biometric.mismatch
    partitions: 3
    replication: 3
    retention_hours: 4380

  - name: remitflow.security.webauthn.clone
    partitions: 1
    replication: 3
    retention_hours: 8760

  - name: remitflow.security.document.fraud
    partitions: 3
    replication: 3
    retention_hours: 8760

smart_modules:
  - name: pii-redactor
    wasm_path: ./smart_modules/pii_redactor.wasm
    inputs:
      fields_to_redact: ["email", "phone", "ssn", "bvn", "nin", "date_of_birth", "address"]

  - name: depeg-severity-filter
    wasm_path: ./smart_modules/severity_filter.wasm
    inputs:
      min_severity: "warning"

  - name: canary-alert-enricher
    wasm_path: ./smart_modules/canary_enricher.wasm
