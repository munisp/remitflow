[package]
name    = "rust-qr-nfc-crypto"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rust-qr-nfc-crypto"
path = "src/main.rs"

[dependencies]
tokio      = { version = "1", features = ["full"] }
warp       = "0.3"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx       = { version = "0.8.1", features = ["runtime-tokio", "postgres", "json"] }
tracing    = "0.1"
hmac       = "0.12"
sha2       = "0.10"
hex        = "0.4"
rand       = "0.8"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
