[package]
name = "fluvio-consumer"
version = "1.0.0"
edition = "2021"
description = "RemitFlow Fluvio event consumer — real-time stream processing"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8.1", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.13", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
prometheus = { version = "0.13", features = ["process"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.12"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
