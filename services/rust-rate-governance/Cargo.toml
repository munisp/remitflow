[package]
name = "rate-governance"
version = "1.0.0"
edition = "2021"
description = "RemitFlow BDC rate governance — band validation and cross-rate computation with integer-exact math (no floats)"

[[bin]]
name = "rate-governance"
path = "src/main.rs"

# Dependency set/versions copied verbatim from the sibling
# services/rust-tigerbeetle-bridge/Cargo.toml (SPEC-bdc §0.2). Only the crates
# this pure-compute service actually needs are kept: no TigerBeetle client, no
# Postgres pool, no OTLP exporter stack (see README — trace ids are propagated
# and echoed via headers instead of exported spans).
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
prometheus = { version = "0.14", features = ["process"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
