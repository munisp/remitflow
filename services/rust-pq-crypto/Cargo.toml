[package]
name = "rust-pq-crypto"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rust-pq-crypto"
path = "src/main.rs"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
sha2 = "0.11"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
