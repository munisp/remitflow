[package]
name = "tigerbeetle-bridge"
version = "2.0.0"
edition = "2021"
description = "RemitFlow TigerBeetle ledger bridge — HTTP gateway to the TigerBeetle cluster (real wire-protocol client)"

[[bin]]
name = "tigerbeetle-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry — the whole family is pinned to the 0.27 line, which is the
# release tracing-opentelemetry 0.28 bridges to (it requires opentelemetry
# ^0.27). Mixing 0.28+ otel crates with tracing-opentelemetry 0.28 does NOT
# compile, so keep these versions in lockstep (see OTEL.md).
opentelemetry = { version = "0.27.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.27.1", default-features = false, features = ["trace", "rt-tokio"] }
# OTLP/HTTP+protobuf exporter (no tonic — the service has no gRPC stack, and
# http-proto keeps the dependency graph small). reqwest-client selects the
# reqwest transport implementation inside opentelemetry-http.
opentelemetry-otlp = { version = "0.27.0", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28.0"
# HTTP client used by the OTLP exporter. Must stay on ^0.12 — that is the
# version opentelemetry-http 0.27 implements its HttpClient trait for.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
anyhow = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
dotenvy = "0.15"
prometheus = { version = "0.14", features = ["process"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.12"
# The only real Rust client for the TigerBeetle binary wire protocol.
# The crate version format is <crate-version>+<tigerbeetle-version> where the
# TB component MUST exactly match the deployed server image
# ghcr.io/tigerbeetle/tigerbeetle:0.16.63 (clients are not backward compatible
# with older clusters). 0.14.13 is published ONLY as 0.14.13+0.16.63, so this
# exact pin selects it (Cargo ignores the +metadata in requirements).
tigerbeetle-unofficial = "=0.14.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
