[package]
name = "tigerbeetle-bridge"
version = "1.0.0"
edition = "2021"
description = "RemitFlow TigerBeetle ledger bridge — high-performance double-entry accounting"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "bigdecimal", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
dotenvy = "0.15"
prometheus = { version = "0.14", features = ["process"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
