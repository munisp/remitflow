[package]
name = "rust-hnw-fx-engine"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rust-hnw-fx-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
bytes = "1"
