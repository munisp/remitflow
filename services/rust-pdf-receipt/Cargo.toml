[package]
name = "rust-pdf-receipt"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rust-pdf-receipt"
path = "src/main.rs"

[dependencies]
tokio-postgres = "0.7"
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
