version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpu_engine
      POSTGRES_USER: gpu_engine
      POSTGRES_PASSWORD: gpu_engine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Backend (FastAPI) ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://gpu_engine:gpu_engine@postgres:5432/gpu_engine
      REDIS_URL: redis://redis:6379/0
      GPU_ENGINE_PORT: "8120"
      JWT_SECRET: "${JWT_SECRET:-gpu-engine-production-secret-change-me}"
      CORS_ORIGINS: "http://localhost,http://localhost:4200,http://localhost:80"
      PYTHONPATH: /app:/app/middleware
    ports:
      - "8120:8120"
    volumes:
      - models:/app/models
      - onnx_models:/app/onnx_models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # For NVIDIA GPU passthrough, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── Frontend (React PWA via nginx) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  models:
  onnx_models:
