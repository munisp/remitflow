# RemitFlow — APISix Gateway Routes for Payment Rails
# Registers all 9 payment rail microservices behind the APISix gateway
# with rate limiting, authentication, and observability plugins.
#
# Rails registered:
#   1. Mojaloop FSPIOP  — port 8085 (Go)
#   2. CIPS             — port 8091 (Go)
#   3. UPI              — port 8092 (Rust)
#   4. PIX              — port 8093 (Python)
#   5. BRICSPay         — port 8102 (Go)  [NEW]
#   6. mBridge          — port 8103 (Rust) [NEW]
#   7. GhIPSS           — port 8104 (Go)  [NEW]
#   8. AfriCBDC         — port 8105 (Python) [NEW]
#   9. PAPSS            — port 8106 (Go)  [NEW]

routes:
  # ── 1. Mojaloop FSPIOP ──────────────────────────────────────────────────────
  - id: mojaloop-transfers
    uri: /rails/mojaloop/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8085": 1
    plugins:
      limit-req:
        rate: 1000
        burst: 200
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      response-rewrite:
        headers:
          X-Rail: mojaloop
          X-Rail-Version: "2.0"

  # ── 2. CIPS ─────────────────────────────────────────────────────────────────
  - id: cips-transfers
    uri: /rails/cips/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8091": 1
    plugins:
      limit-req:
        rate: 500
        burst: 100
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      response-rewrite:
        headers:
          X-Rail: cips
          X-Rail-Version: "1.0"

  # ── 3. UPI ──────────────────────────────────────────────────────────────────
  - id: upi-transfers
    uri: /rails/upi/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8092": 1
    plugins:
      limit-req:
        rate: 2000
        burst: 500
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      response-rewrite:
        headers:
          X-Rail: upi
          X-Rail-Version: "2.0"

  # ── 4. PIX ──────────────────────────────────────────────────────────────────
  - id: pix-transfers
    uri: /rails/pix/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8093": 1
    plugins:
      limit-req:
        rate: 1500
        burst: 300
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      response-rewrite:
        headers:
          X-Rail: pix
          X-Rail-Version: "1.0"

  # ── 5. BRICSPay ─────────────────────────────────────────────────────────────
  - id: bricspay-transfers
    uri: /rails/bricspay/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8102": 1
    plugins:
      limit-req:
        rate: 300
        burst: 50
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      # BRICSPay requires JWT validation via Keycloak
      jwt-auth: {}
      response-rewrite:
        headers:
          X-Rail: bricspay
          X-Rail-Version: "1.0"
          X-Rail-Status: sandbox

  # ── 6. mBridge ──────────────────────────────────────────────────────────────
  - id: mbridge-transfers
    uri: /rails/mbridge/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8103": 1
    plugins:
      limit-req:
        rate: 100
        burst: 20
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      # mBridge is wholesale only — requires elevated JWT claims
      jwt-auth: {}
      response-rewrite:
        headers:
          X-Rail: mbridge
          X-Rail-Version: "1.0"
          X-Rail-Status: pilot

  # ── 7. GhIPSS ───────────────────────────────────────────────────────────────
  - id: ghipss-transfers
    uri: /rails/ghipss/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8104": 1
    plugins:
      limit-req:
        rate: 800
        burst: 150
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      response-rewrite:
        headers:
          X-Rail: ghipss
          X-Rail-Version: "2.0"

  # ── 8. AfriCBDC ─────────────────────────────────────────────────────────────
  - id: africbdc-transfers
    uri: /rails/africbdc/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8105": 1
    plugins:
      limit-req:
        rate: 500
        burst: 100
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      response-rewrite:
        headers:
          X-Rail: africbdc
          X-Rail-Version: "1.0"

  # ── 9. PAPSS ────────────────────────────────────────────────────────────────
  - id: papss-transfers
    uri: /rails/papss/*
    upstream:
      type: roundrobin
      nodes:
        "localhost:8106": 1
    plugins:
      limit-req:
        rate: 600
        burst: 120
        key: remote_addr
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
      response-rewrite:
        headers:
          X-Rail: papss
          X-Rail-Version: "1.0"

  # ── Rail Health Aggregator ───────────────────────────────────────────────────
  - id: rails-health
    uri: /rails/health
    script: |
      local http = require("resty.http")
      local cjson = require("cjson")
      local rails = {
        {name="mojaloop", port=8085},
        {name="cips",     port=8091},
        {name="upi",      port=8092},
        {name="pix",      port=8093},
        {name="bricspay", port=8102},
        {name="mbridge",  port=8103},
        {name="ghipss",   port=8104},
        {name="africbdc", port=8105},
        {name="papss",    port=8106},
      }
      local results = {}
      for _, rail in ipairs(rails) do
        local httpc = http.new()
        httpc:set_timeout(2000)
        local res, err = httpc:request_uri("http://localhost:" .. rail.port .. "/health")
        results[rail.name] = {
          status = (res and res.status == 200) and "healthy" or "unreachable",
          port = rail.port,
        }
      end
      ngx.header["Content-Type"] = "application/json"
      ngx.say(cjson.encode({rails=results, timestamp=ngx.time()}))
      return ngx.exit(200)
