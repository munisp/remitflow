# APISix Routes — Platform Hardening
# Circuit breaking, rate limiting, and WAF on all hardened endpoints

routes:
  # ── KYC/KYB Hardening ─────────────────────────────────────────────────────
  - uri: /api/kyc/webhook/onfido
    name: kyc_onfido_webhook
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:3000": 1
    plugins:
      limit-req:
        rate: 50
        burst: 20
        key: remote_addr
      openappsec:
        enabled: true
        mode: prevent
      circuit-breaker:
        failure_threshold: 3
        success_threshold: 2
        timeout: 30

  - uri: /api/kyc/webhook/smile
    name: kyc_smile_webhook
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:3000": 1
    plugins:
      limit-req:
        rate: 50
        burst: 20
        key: remote_addr
      openappsec:
        enabled: true
        mode: prevent

  - uri: /api/kyb/ubo/analyze
    name: kyb_ubo_analysis
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8250": 1
    plugins:
      limit-req:
        rate: 20
        burst: 5
        key: consumer_name
      circuit-breaker:
        failure_threshold: 3
        success_threshold: 2
        timeout: 30

  - uri: /api/kyc/rescreen
    name: kyc_re_screening
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8250": 1
    plugins:
      limit-req:
        rate: 100
        burst: 50

  # ── Stablecoin Hardening ───────────────────────────────────────────────────
  - uri: /api/stablecoin/onramp/webhook*
    name: stablecoin_onramp_webhook
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8250": 1
    plugins:
      limit-req:
        rate: 100
        burst: 50
        key: remote_addr
      openappsec:
        enabled: true
        mode: prevent
      circuit-breaker:
        failure_threshold: 5
        success_threshold: 3
        timeout: 60

  - uri: /api/stablecoin/bridge/quote
    name: stablecoin_bridge_quote
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:3000": 1
    plugins:
      limit-req:
        rate: 30
        burst: 10
        key: consumer_name
      circuit-breaker:
        failure_threshold: 3
        timeout: 15

  - uri: /api/stablecoin/yield/best
    name: stablecoin_yield_routing
    methods: [GET, POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:3000": 1
    plugins:
      limit-req:
        rate: 50
        burst: 20

  - uri: /api/stablecoin/depeg/status
    name: stablecoin_depeg_status
    methods: [GET]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8270": 1
    plugins:
      proxy-cache:
        cache_ttl: 15  # 15-second cache for price data

  # ── Flow of Funds ──────────────────────────────────────────────────────────
  - uri: /api/fund/coordinator/create
    name: fund_flow_coordinator
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8250": 1
    plugins:
      limit-req:
        rate: 50
        burst: 20
        key: consumer_name
      circuit-breaker:
        failure_threshold: 2
        success_threshold: 2
        timeout: 30

  - uri: /api/fund/settlement/net
    name: settlement_netting
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8250": 1
    plugins:
      limit-req:
        rate: 10
        burst: 5
        key: consumer_name

  - uri: /api/fund/compensation/retry
    name: compensation_retry
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8250": 1
    plugins:
      limit-req:
        rate: 100
        burst: 50

  # ── Security Services ──────────────────────────────────────────────────────
  - uri: /api/security/pad/check
    name: pad_liveness_check
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8260": 1
    plugins:
      limit-req:
        rate: 30
        burst: 10
      circuit-breaker:
        failure_threshold: 3
        timeout: 15

  - uri: /api/security/fencing/*
    name: fencing_tokens
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8260": 1
    plugins:
      limit-req:
        rate: 200
        burst: 100

  - uri: /api/security/yield/risk
    name: yield_risk_scoring
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8260": 1
    plugins:
      limit-req:
        rate: 50
        burst: 20

  - uri: /api/security/bridge/verify
    name: bridge_verification
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8260": 1
    plugins:
      limit-req:
        rate: 30
        burst: 10

  - uri: /api/security/webauthn/verify
    name: webauthn_verification
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8260": 1
    plugins:
      limit-req:
        rate: 50
        burst: 20

  # ── ML/Analytics Services ──────────────────────────────────────────────────
  - uri: /api/ml/liquidity/predict
    name: predictive_liquidity
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8270": 1
    plugins:
      limit-req:
        rate: 20
        burst: 10
      proxy-cache:
        cache_ttl: 300  # 5-minute cache for forecasts

  - uri: /api/ml/biometric/*
    name: behavioral_biometrics
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8270": 1
    plugins:
      limit-req:
        rate: 100
        burst: 50

  - uri: /api/ml/document/fraud
    name: document_fraud_detection
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8270": 1
    plugins:
      limit-req:
        rate: 30
        burst: 10
      circuit-breaker:
        failure_threshold: 3
        timeout: 30

  - uri: /api/ml/graph/fraud
    name: graph_fraud_detection
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8270": 1
    plugins:
      limit-req:
        rate: 10
        burst: 5

  - uri: /api/audit/chain
    name: immutable_audit_chain
    methods: [GET, POST]
    upstream:
      type: roundrobin
      nodes:
        "localhost:8250": 1
    plugins:
      limit-req:
        rate: 100
        burst: 50

# Global OpenAppSec WAF policy
global_rules:
  openappsec:
    enabled: true
    mode: detect  # detect globally, prevent on webhook endpoints
    policy: remitflow-hardened
