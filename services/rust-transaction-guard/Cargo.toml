[package]
name = "rust-transaction-guard"
version = "1.0.0"
edition = "2021"
description = "Cryptographic receipt chain, double-spend prevention, and balance assertions for RemitFlow fund flows"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
