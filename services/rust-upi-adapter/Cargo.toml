[package]
name = "rust-upi-adapter"
version = "110.0.0"
edition = "2021"
description = "RemitFlow UPI (Unified Payments Interface) adapter — India INR instant payments"
authors = ["RemitFlow Technologies Ltd"]

[[bin]]
name = "upi-adapter"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["json", "query", "tracing"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
hyper = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Crypto & security
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

# Validation
regex = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Config
dotenvy = "0.15"

[dev-dependencies]
axum-test = "14"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
