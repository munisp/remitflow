[package]
name = "rust-reserve-proof"
version = "0.1.0"
edition = "2021"
description = "RemitFlow Stablecoin Reserve Proof Service"

[[bin]]
name = "rust-reserve-proof"
path = "src/main.rs"

[dependencies]
actix-web    = "4"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1", features = ["v4"] }
tokio        = { version = "1", features = ["full"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"
