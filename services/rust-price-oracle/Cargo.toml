[package]
name = "rust-price-oracle"
version = "0.1.0"
edition = "2021"
description = "RemitFlow Real-Time Multi-Source Stablecoin Price Oracle with WebSocket Streaming"

[[bin]]
name = "rust-price-oracle"
path = "src/main.rs"

[dependencies]
actix-web  = "4"
actix-ws   = "0.3"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", features = ["json"] }
uuid       = { version = "1", features = ["v4"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"
