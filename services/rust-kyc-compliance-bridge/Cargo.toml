[package]
name    = "rust-kyc-compliance-bridge"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rust-kyc-compliance-bridge"
path = "main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
