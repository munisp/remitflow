[package]
name    = "rust-kyc-compliance-bridge"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rust-kyc-compliance-bridge"
path = "main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx       = { version = "0.8.1", features = ["runtime-tokio", "postgres", "json"] }

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
