[package]
name = "remitflow-idempotency"
version = "1.0.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.8.1", features = ["runtime-tokio", "postgres"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
