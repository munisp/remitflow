[package]
name = "rust-mbridge-adapter"
version = "171.0.0"
edition = "2021"
description = "RemitFlow mBridge adapter — BIS multi-CBDC platform for cross-border settlements"
authors = ["RemitFlow Technologies Ltd"]

[[bin]]
name = "mbridge-adapter"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.8.1", features = ["runtime-tokio", "postgres", "json"] }
axum = { version = "0.7", features = ["json", "query", "tracing"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
hyper = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
regex = "1"
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
governor = "0.6"
nonzero_ext = "0.3"
dotenvy = "0.15"

[dev-dependencies]
axum-test = "14"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
