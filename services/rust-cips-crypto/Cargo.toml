[package]
name = "rust-cips-crypto"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rust-cips-crypto"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["cors", "timeout", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
