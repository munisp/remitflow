###############################################################################
# RemitFlow — CBN Compliance Stack (v187)
#
# New services implementing CBN Circular March 24 2026:
#   - rust-bmatch-engine:      Bloomberg BMATCH FX rate engine (P0)
#   - go-settlement-registry:  Settlement account registry + CBN filing (P1)
#   - python-cbn-lakehouse:    OpenSearch audit lakehouse + compliance exports (P2)
#
# Depends on middleware stack in docker-compose.middleware.yml:
#   kafka, redis, opensearch, postgres, dapr-placement
#
# Usage:
#   docker compose -f docker-compose.middleware.yml \
#                  -f docker-compose.cbn-compliance.yml up -d
###############################################################################
version: "3.9"

networks:
  remitflow-net:
    external: true

volumes:
  bmatch-data:
  settlement-data:

services:

  # ── P0: Bloomberg BMATCH FX Rate Engine (Rust/Axum) ─────────────────────────
  rust-bmatch-engine:
    build:
      context: ./services/rust-bmatch-engine
      dockerfile: Dockerfile
    image: remitflow/rust-bmatch-engine:v187
    container_name: rust-bmatch-engine
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      PORT: "8097"
      RUST_LOG: "info"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      DATABASE_URL: "${DATABASE_URL}"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3000"
      RATE_REFRESH_SECS: "60"
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.remitflow.service: "rust-bmatch-engine"
      com.remitflow.cbn-compliance: "P0"
      com.remitflow.description: "Bloomberg BMATCH FX Rate Engine — CBN Circular Mar 24 2026"

  # ── P0: BMATCH Dapr Sidecar ──────────────────────────────────────────────────
  rust-bmatch-engine-dapr:
    image: "daprio/daprd:1.13.0"
    container_name: rust-bmatch-engine-dapr
    command:
      - "./daprd"
      - "--app-id=rust-bmatch-engine"
      - "--app-port=8097"
      - "--dapr-http-port=3500"
      - "--dapr-grpc-port=50001"
      - "--placement-host-address=dapr-placement:50006"
      - "--components-path=/components"
      - "--log-level=info"
    volumes:
      - ./infra/dapr/components:/components
    depends_on:
      - rust-bmatch-engine
      - dapr-placement
    network_mode: "service:rust-bmatch-engine"
    labels:
      com.remitflow.service: "rust-bmatch-engine-dapr"

  # ── P1: Settlement Account Registry (Go/Gin) ─────────────────────────────────
  go-settlement-registry:
    build:
      context: ./services/go-settlement-registry
      dockerfile: Dockerfile
    image: remitflow/go-settlement-registry:v187
    container_name: go-settlement-registry
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      PORT: "8098"
      GIN_MODE: "release"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      KEYCLOAK_URL: "http://keycloak:8080"
      PERMIFY_URL: "http://permify:3476"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3000"
      INTERNAL_KEY: "${CBN_REGISTRY_KEY:-settlement-registry-key-001}"
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.remitflow.service: "go-settlement-registry"
      com.remitflow.cbn-compliance: "P1"
      com.remitflow.description: "CBN Settlement Account Registry — Go/Gin"

  # ── P1: Settlement Registry Dapr Sidecar ─────────────────────────────────────
  go-settlement-registry-dapr:
    image: "daprio/daprd:1.13.0"
    container_name: go-settlement-registry-dapr
    command:
      - "./daprd"
      - "--app-id=go-settlement-registry"
      - "--app-port=8098"
      - "--dapr-http-port=3500"
      - "--dapr-grpc-port=50001"
      - "--placement-host-address=dapr-placement:50006"
      - "--components-path=/components"
      - "--log-level=info"
    volumes:
      - ./infra/dapr/components:/components
    depends_on:
      - go-settlement-registry
      - dapr-placement
    network_mode: "service:go-settlement-registry"
    labels:
      com.remitflow.service: "go-settlement-registry-dapr"

  # ── P2: CBN Audit Lakehouse (Python/FastAPI) ─────────────────────────────────
  python-cbn-lakehouse:
    build:
      context: ./services/python-cbn-lakehouse
      dockerfile: Dockerfile
    image: remitflow/python-cbn-lakehouse:v187
    container_name: python-cbn-lakehouse
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
      DATABASE_URL: "${DATABASE_URL}"
      OPENSEARCH_URL: "http://opensearch:9200"
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379"
      DAPR_HTTP_PORT: "3500"
      CBN_LAKEHOUSE_KEY: "${CBN_LAKEHOUSE_KEY:-cbn-lakehouse-key-001}"
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.remitflow.service: "python-cbn-lakehouse"
      com.remitflow.cbn-compliance: "P2"
      com.remitflow.description: "CBN Audit Lakehouse — OpenSearch + PostgreSQL"

  # ── P2: Lakehouse Dapr Sidecar ────────────────────────────────────────────────
  python-cbn-lakehouse-dapr:
    image: "daprio/daprd:1.13.0"
    container_name: python-cbn-lakehouse-dapr
    command:
      - "./daprd"
      - "--app-id=python-cbn-lakehouse"
      - "--app-port=8099"
      - "--dapr-http-port=3500"
      - "--dapr-grpc-port=50001"
      - "--placement-host-address=dapr-placement:50006"
      - "--components-path=/components"
      - "--log-level=info"
    volumes:
      - ./infra/dapr/components:/components
    depends_on:
      - python-cbn-lakehouse
      - dapr-placement
    network_mode: "service:python-cbn-lakehouse"
    labels:
      com.remitflow.service: "python-cbn-lakehouse-dapr"

  # ── P3: BDC Connector (Go/Gin) ─────────────────────────────────────────────────
  go-bdc-connector:
    build:
      context: ./services/go-bdc-connector
      dockerfile: Dockerfile
    image: remitflow/go-bdc-connector:v188
    container_name: go-bdc-connector
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      GIN_MODE: "release"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      TIGERBEETLE_ADDR: "tigerbeetle:3000"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:-remitflow-internal-2026}"
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.remitflow.service: "go-bdc-connector"
      com.remitflow.cbn-compliance: "P3"
      com.remitflow.description: "BDC FX Transfer Connector — ADB routing per CBN circular"

  # ── P3: BDC Connector Dapr Sidecar ───────────────────────────────────────────
  go-bdc-connector-dapr:
    image: "daprio/daprd:1.13.0"
    container_name: go-bdc-connector-dapr
    command:
      - "./daprd"
      - "--app-id=go-bdc-connector"
      - "--app-port=8087"
      - "--dapr-http-port=3502"
      - "--dapr-grpc-port=50003"
      - "--placement-host-address=dapr-placement:50006"
      - "--components-path=/components"
      - "--log-level=info"
    volumes:
      - ./infra/dapr/components:/components
    depends_on:
      - go-bdc-connector
      - dapr-placement
    network_mode: "service:go-bdc-connector"
    labels:
      com.remitflow.service: "go-bdc-connector-dapr"

  # ── Dapr Placement (shared, if not already in middleware stack) ───────────────
  dapr-placement:
    image: "daprio/dapr:1.13.0"
    container_name: dapr-placement
    command: ["./placement", "--port=50006", "--log-level=info"]
    ports:
      - "50006:50006"
    networks:
      - remitflow-net
    profiles:
      - standalone  # Only start if not already running from middleware stack
