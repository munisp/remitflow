apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitflow-us
  namespace: production
  labels:
    app: remitflow
    region: us
    compliance: fincen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: remitflow
      region: us
  template:
    metadata:
      labels:
        app: remitflow
        region: us
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-east-1", "us-west-2"]
      containers:
      - name: compliance-ml
        image: remitflow/compliance-ml:v2.0
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: us-db-credentials
              key: url
        - name: FINCEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: us-api-keys
              key: fincen
        - name: JURISDICTION
          value: "US"
        - name: BSA_AML_MODE
          value: "strict"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      - name: sar-filing
        image: remitflow/sar-filing:v2.0
        env:
        - name: JURISDICTION
          value: "US"
        - name: FINCEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: us-api-keys
              key: fincen
      - name: transaction-processor
        image: remitflow/rust-transaction-processor:v2.0
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: us-db-credentials
              key: url
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: remitflow-us-service
  namespace: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: remitflow
    region: us
  ports:
  - name: http
    port: 80
    targetPort: 8081
  - name: https
    port: 443
    targetPort: 8443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remitflow-us-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.us.remitflow.com
    secretName: us-tls-secret
  rules:
  - host: api.us.remitflow.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: remitflow-us-service
            port:
              number: 80
