# Redis credentials for the Dapr pubsub component.
# PLACEHOLDER ONLY — rotate immediately. In production, do NOT apply this
# manifest; sync the secret from a secrets manager instead, e.g.:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: redis-dapr-pubsub
#     namespace: 54remit
#   spec:
#     secretStoreRef: { name: <your-cluster-secret-store>, kind: ClusterSecretStore }
#     target: { name: redis-dapr-pubsub }
#     data:
#       - secretKey: redis-password
#         remoteRef: { key: remitflow/redis, property: password }
apiVersion: v1
kind: Secret
metadata:
  name: redis-dapr-pubsub
  namespace: 54remit
type: Opaque
stringData:
  # CHANGE_ME — replace with the real Redis password (or delete and use the
  # ExternalSecret sketched above). ROTATE: this value previously existed in
  # plaintext in this file's git history and must be considered compromised.
  redis-password: "CHANGE_ME_ROTATE_REQUIRED"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: 54remit
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-master.redis.svc.cluster.local:6379
    - name: redisPassword
      secretKeyRef:
        name: redis-dapr-pubsub
        key: redis-password
    - name: enableTLS
      value: "false"
    - name: dialTimeout
      value: "10s"
    - name: readTimeout
      value: "10s"
    - name: writeTimeout
      value: "10s"
    - name: poolSize
      value: "20"
    - name: poolTimeout
      value: "10s"
    - name: maxConnAge
      value: "30m"
    - name: minIdleConns
      value: "5"
    - name: idleTimeout
      value: "5m"
    - name: idleCheckFrequency
      value: "1m"
auth:
  secretStore: kubernetes
