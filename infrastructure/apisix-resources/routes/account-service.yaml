# account-service
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54remit-account-service-route
  namespace: 54remit
spec:
  ingressClassName: appsec-apisix-prod
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54remit.upi.dev
        paths:
          - /account/*
      backends:
        - serviceName: account-service
          servicePort: 80
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/account(?:/system)?/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            # This legacy route is served only from its declared public host.
            # Add additional reviewed origins through a separate route values overlay.
            allow_origins: "https://54remit.upi.dev"
            allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-Request-ID,X-Idempotency-Key,X-Tenant-ID"
            expose_headers: "X-Request-ID"
            allow_credential: true
        - name: 54remit-access-plugin
          enable: true
          config:
            # The custom plugin validates the three-part JWT shape locally, then
            # delegates signature, issuer, revocation, and tenant authorization
            # to the Keycloak-aware authorizer before injecting trusted headers.
            authorizer_url: "http://auth-service.54remit.svc.cluster.local/token"
            mint_account_url: "http://account-service.54remit.svc.cluster.local/system/get-mint-account"
            keycloak_public_key_url: "http://tenant-management.54remit.svc.cluster.local/tenant/keycloak-public-key"
            tenant_claim: "tenant_id"
            require_tenant_claim: true
        # - name: ucard-jwt-payload-decoder
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service.54remit.svc.cluster.local/token/validate"
