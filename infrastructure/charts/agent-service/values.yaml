replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54agent-agent-service
  pullPolicy: IfNotPresent
  tag: 0.0.13
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  name: 54agent
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 80
resources:
  requests:
    cpu: 100m
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: agent-service
  appPort: 80
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
secrets:
  DATABASE_URI: CHANGE_ME
  DAPR_PUBSUB_NAME: pubsub
  PORT: 80
  VERIFICATION_SERVICE_URL: https://54agent.upi.dev/verification
  VERIFICATION_CLIENT_ID: CHANGE_ME
  VERIFICATION_CLIENT_SECRET: CHANGE_ME
  KYC_REDIRECT_URL: https://kyc.54agent.upi.dev/success
  KAFKA_BOOTSTRAP_SERVERS: kafka-service:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KAFKA_TOPIC_PREFIX: agent-service
