replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-tenant-management-service/54remit-tenant-management-service
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 80
resources:
  requests:
    cpu: 100m
    memory: 250Mi
  limits:
    cpu: 500m
    memory: 1000Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: tenant-management-service
  appPort: 80
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# ⚠️ Do not commit real values here — see admin-service/values.yaml's comment
# for the override convention. This service holds the most sensitive
# credentials of the three (Keycloak admin password, superadmin bootstrap
# secret) — treat its override file with extra care (e.g. sealed-secrets or
# a secrets manager, not a plain gitignored yaml, once one is adopted).
secrets:
  DATABASE_URL: ""  # REQUIRED — set via --set or secrets manager
  REDIS_URL: ""  # REQUIRED — set via --set or secrets manager
  APP_ENV: "production"
  ADMIN_SVC_URL: "http://admin-service:8000"
  AUTH_SVC_URL: "http://auth-service:8000"
  INTERNAL_API_TOKEN: ""  # REQUIRED — set via --set or secrets manager
