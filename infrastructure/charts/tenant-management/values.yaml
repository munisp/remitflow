replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-tenant-management
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 80
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: tenant-management
  appPort: 80
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# ⚠️ Do not commit real values here. This block exists so the chart is valid
# out of the box; override every key at deploy time via
#   helm upgrade --install tenant-management infrastructure/charts/tenant-management \
#     -n 54remit -f infrastructure/values-secrets/tenant-management.yaml
# (a gitignored, per-environment file — see infrastructure/.env.example for
# what each of these maps to).
secrets:
  NODE_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "80"
  LOG_PATH: "./logs"
  LOG_LEVEL: "info"
  LOG_SILENT: "false"
  DATABASE_URI: "CHANGE_ME"
  # DAPR_HOST / DAPR_HTTP_PORT are auto-injected by the Dapr sidecar in-cluster
  # once dapr.enabled is true above — left here only as an explicit override
  # point in case that ever needs to change.
  DAPR_HOST: "127.0.0.1"
  DAPR_HTTP_PORT: "3500"
  # No billing-service exists in this platform yet — leave unset. Tenant
  # provisioning skips (rather than fails on) billing profile creation when
  # this is empty. See services/tenant-management/src/services/billingService.ts.
  BILLING_SERVICE_URL: ""
