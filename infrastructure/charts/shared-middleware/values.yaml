replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-shared-middleware
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8100
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: shared-middleware
  appPort: 8100
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across shared-middleware's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is empty and REQUIRED at deploy time (set via --set or a secrets manager), never committed:
#   helm upgrade --install shared-middleware infrastructure/charts/shared-middleware \
#     -n 54remit -f infrastructure/values-secrets/shared-middleware.yaml
# (a gitignored, per-environment file).
secrets:
  APISIX_ADMIN_URL: ""  # REQUIRED
  DAPR_HTTP_PORT: "3500"
  FLUVIO_GATEWAY_URL: ""  # REQUIRED
  INTERNAL_SERVICE_KEY: ""  # REQUIRED
  KAFKA_BROKERS: "kafka-service:9092"
  KEYCLOAK_URL: ""  # REQUIRED
  LAKEHOUSE_URL: ""  # REQUIRED
  OPENSEARCH_URL: ""  # REQUIRED
  PERMIFY_GRPC_ADDR: ""  # REQUIRED
  REDIS_ADDR: ""  # REQUIRED
  TEMPORAL_HOST_PORT: ""  # REQUIRED
  TIGERBEETLE_ADDR: ""  # REQUIRED