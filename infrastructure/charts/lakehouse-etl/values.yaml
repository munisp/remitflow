replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-services/54remit-lakehouse-etl
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8102
  targetPort: 8102
resources:
  requests:
    cpu: 100m
    memory: 250Mi
  limits:
    cpu: 500m
    memory: 1000Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: lakehouse-etl
  appPort: 8102
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# ⚠️ Do not commit real values here — see admin-service/values.yaml's comment
# for the override convention. This service holds the most sensitive
# credentials of the three (Keycloak admin password, superadmin bootstrap
# secret) — treat its override file with extra care (e.g. sealed-secrets or
# a secrets manager, not a plain gitignored yaml, once one is adopted).
secrets:
  S3_ENDPOINT: ""  # REQUIRED — set via --set or secrets manager
  S3_BUCKET: ""  # REQUIRED — set via --set or secrets manager
  AWS_ACCESS_KEY_ID: ""  # REQUIRED — set via --set or secrets manager
  AWS_SECRET_ACCESS_KEY: ""  # REQUIRED — set via --set or secrets manager