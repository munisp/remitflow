replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-lakehouse-etl
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8089
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: lakehouse-etl
  appPort: 8089
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across lakehouse-etl's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is "CHANGE_ME" and MUST be overridden at deploy time, never committed:
#   helm upgrade --install lakehouse-etl infrastructure/charts/lakehouse-etl \
#     -n 54remit -f infrastructure/values-secrets/lakehouse-etl.yaml
# (a gitignored, per-environment file).
secrets:
  CDC_ENABLED: "CHANGE_ME"
  CDC_SLOT_NAME: "CHANGE_ME"
  DATABASE_URL: "CHANGE_ME"
  DB_COMMAND_TIMEOUT: "CHANGE_ME"
  DB_MAX_INACTIVE_LIFETIME: "CHANGE_ME"
  DB_MAX_QUERIES: "CHANGE_ME"
  DB_POOL_MAX_SIZE: "CHANGE_ME"
  DB_POOL_MIN_SIZE: "CHANGE_ME"
  LAKEHOUSE_PATH: "CHANGE_ME"
  LOG_LEVEL: "info"
  PIPELINE_INTERVAL_SECS: "CHANGE_ME"
  PORT: "8089"
  S3_ACCESS_KEY: "CHANGE_ME"
  S3_BUCKET: "CHANGE_ME"
  S3_ENDPOINT: "CHANGE_ME"
  S3_SECRET_KEY: "CHANGE_ME"
