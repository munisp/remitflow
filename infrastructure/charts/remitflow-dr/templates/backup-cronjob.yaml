{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: remitflow-dr
    remitflow.io/cilium-endpoint: enabled
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: remitflow-immutable-backup
  labels:
    app.kubernetes.io/name: remitflow-dr
    remitflow.io/cilium-endpoint: enabled
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: remitflow-dr
            remitflow.io/cilium-endpoint: enabled
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
{{ toYaml .Values.podSecurityContext | indent 12 }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              envFrom:
                - secretRef:
                    name: {{ .Values.backup.secretName }}
                - configMapRef:
                    name: {{ .Values.backup.configMapName }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
{{ toYaml .Values.resources | indent 16 }}
          nodeSelector:
{{ toYaml .Values.nodeSelector | indent 12 }}
          tolerations:
{{ toYaml .Values.tolerations | indent 12 }}
          affinity:
{{ toYaml .Values.affinity | indent 12 }}
{{- end }}
