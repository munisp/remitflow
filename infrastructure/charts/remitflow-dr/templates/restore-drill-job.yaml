{{- if .Values.restoreDrill.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: remitflow-restore-drill-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: remitflow-dr
    remitflow.io/cilium-endpoint: enabled
    remitflow.io/operation: restore-drill
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remitflow-dr
        remitflow.io/cilium-endpoint: enabled
        remitflow.io/operation: restore-drill
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: restore-drill
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/remitflow-restore-drill"]
          envFrom:
            - secretRef:
                name: {{ .Values.restoreDrill.secretName }}
            - configMapRef:
                name: {{ .Values.restoreDrill.configMapName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- end }}
