image:
  repository: ghcr.io/munisp/remitflow-backup-runner
  tag: main
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: remitflow-backup-runner

backup:
  enabled: true
  schedule: "*/15 * * * *"
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 24
  concurrencyPolicy: Forbid
  secretName: remitflow-backup-credentials
  configMapName: remitflow-backup-config

restoreDrill:
  enabled: false
  secretName: remitflow-restore-drill-credentials
  configMapName: remitflow-restore-drill-config

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
