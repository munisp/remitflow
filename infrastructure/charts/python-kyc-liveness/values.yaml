replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-python-kyc-liveness
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8095
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: python-kyc-liveness
  appPort: 8095
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across python-kyc-liveness's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is "CHANGE_ME" and MUST be overridden at deploy time, never committed:
#   helm upgrade --install python-kyc-liveness infrastructure/charts/python-kyc-liveness \
#     -n 54remit -f infrastructure/values-secrets/python-kyc-liveness.yaml
# (a gitignored, per-environment file).
secrets:
  DAPR_HTTP_PORT: "3500"
  DAPR_PUBSUB: "pubsub"
  DAPR_STATE_STORE: "statestore"
  DATABASE_URL: "CHANGE_ME"
  FACE_MATCH_THRESHOLD: "CHANGE_ME"
  IPROOV_API_KEY: "CHANGE_ME"
  IPROOV_BASE_URL: "CHANGE_ME"
  KYC_CONFIDENCE_THRESHOLD: "CHANGE_ME"
  LIVENESS_PROVIDER: "CHANGE_ME"
  ONFIDO_API_TOKEN: "CHANGE_ME"
  ONFIDO_BASE_URL: "CHANGE_ME"
  OPENSEARCH_URL: "CHANGE_ME"
  PORT: "8095"
