replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-python-compliance-service
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8083
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: python-compliance-service
  appPort: 8083
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across python-compliance-service's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is empty and REQUIRED at deploy time (set via --set or a secrets manager), never committed:
#   helm upgrade --install python-compliance-service infrastructure/charts/python-compliance-service \
#     -n 54remit -f infrastructure/values-secrets/python-compliance-service.yaml
# (a gitignored, per-environment file).
secrets:
  CORS_ORIGINS: ""  # REQUIRED
  DATABASE_URL: ""  # REQUIRED
  EU_SANCTIONS_URL: ""  # REQUIRED
  HMT_SANCTIONS_URL: ""  # REQUIRED
  OFAC_SDN_URL: ""  # REQUIRED
  PORT: "8083"
  REDIS_URL: ""  # REQUIRED
  SANCTIONS_REFRESH_INTERVAL_SECS: ""  # REQUIRED
  UN_SANCTIONS_URL: ""  # REQUIRED