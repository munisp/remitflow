replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-universal-fx
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8084
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: universal-fx
  appPort: 8084
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across universal-fx's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is "CHANGE_ME" and MUST be overridden at deploy time, never committed:
#   helm upgrade --install universal-fx infrastructure/charts/universal-fx \
#     -n 54remit -f infrastructure/values-secrets/universal-fx.yaml
# (a gitignored, per-environment file).
secrets:
  COINGECKO_API_KEY: "CHANGE_ME"
  DATABASE_URL: "CHANGE_ME"
  PORT: "8084"
  RATE_CACHE_TTL_SECONDS: "CHANGE_ME"
  RATE_LOCK_HMAC_SECRET: "CHANGE_ME"
  RATE_LOCK_TTL_SECONDS: "CHANGE_ME"
  SLIPPAGE_BPS: "CHANGE_ME"
