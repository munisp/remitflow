replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-go-ghipss-adapter
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: go-ghipss-adapter
  appPort: 8080
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across go-ghipss-adapter's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is empty and REQUIRED at deploy time (set via --set or a secrets manager), never committed:
#   helm upgrade --install go-ghipss-adapter infrastructure/charts/go-ghipss-adapter \
#     -n 54remit -f infrastructure/values-secrets/go-ghipss-adapter.yaml
# (a gitignored, per-environment file).
secrets:
  DAPR_HTTP_PORT: "3500"
  DATABASE_URL: ""  # REQUIRED
  FLUVIO_GATEWAY_URL: ""  # REQUIRED
  GHIPSS_ENDPOINT: ""  # REQUIRED
  GIP_ENDPOINT: ""  # REQUIRED
  INTERNAL_SERVICE_KEY: ""  # REQUIRED
  KAFKA_BROKERS: "kafka-service:9092"
  LAKEHOUSE_URL: ""  # REQUIRED
  MMI_ENDPOINT: ""  # REQUIRED
  MOJALOOP_HUB_URL: ""  # REQUIRED
  OPENSEARCH_URL: ""  # REQUIRED
  PAPSS_ENDPOINT: ""  # REQUIRED
  PORT: "8080"
  REDIS_ADDR: ""  # REQUIRED
  TEMPORAL_HOST_PORT: ""  # REQUIRED
  TIGERBEETLE_ADDR: ""  # REQUIRED