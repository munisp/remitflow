replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-python-ml-retraining
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8116
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: python-ml-retraining
  appPort: 8116
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across python-ml-retraining's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is "CHANGE_ME" and MUST be overridden at deploy time, never committed:
#   helm upgrade --install python-ml-retraining infrastructure/charts/python-ml-retraining \
#     -n 54remit -f infrastructure/values-secrets/python-ml-retraining.yaml
# (a gitignored, per-environment file).
secrets:
  DATABASE_URL: "CHANGE_ME"
  DATA_DIR: "CHANGE_ME"
  DRIFT_CHECK_INTERVAL_HOURS: "CHANGE_ME"
  FX_FORECAST_SERVICE_URL: "CHANGE_ME"
  GNN_FRAUD_SERVICE_URL: "CHANGE_ME"
  INVESTMENT_ML_SERVICE_URL: "CHANGE_ME"
  MIN_NEW_SAMPLES_TO_RETRAIN: "CHANGE_ME"
  MLFLOW_REGISTRY_SERVICE_URL: "CHANGE_ME"
  NLU_SERVICE_URL: "CHANGE_ME"
  PORT: "8116"
  RAY_TRAINING_SERVICE_URL: "CHANGE_ME"
  RETRAIN_INTERVAL_HOURS: "CHANGE_ME"
