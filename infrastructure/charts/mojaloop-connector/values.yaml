replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54remit-mojaloop-connector
  pullPolicy: IfNotPresent
  tag: 0.1.0
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54remit
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 8085
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 500Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: mojaloop-connector
  appPort: 8085
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
# Auto-generated: env var names below were discovered via source grep
# (os.Getenv / env::var / os.getenv across mojaloop-connector's codebase), so this list
# reflects what the service actually reads — not a guess. Known non-secret
# infra defaults (Kafka, Dapr, log level, etc.) are pre-filled; everything
# else is "CHANGE_ME" and MUST be overridden at deploy time, never committed:
#   helm upgrade --install mojaloop-connector infrastructure/charts/mojaloop-connector \
#     -n 54remit -f infrastructure/values-secrets/mojaloop-connector.yaml
# (a gitignored, per-environment file).
secrets:
  CORE_API_URL: "CHANGE_ME"
  DAPR_HTTP_PORT: "3500"
  DATABASE_URL: "CHANGE_ME"
  FLUVIO_GATEWAY_URL: "CHANGE_ME"
  FSPIOP_SOURCE: "CHANGE_ME"
  KAFKA_BROKERS: "kafka-service:9092"
  LAKEHOUSE_URL: "CHANGE_ME"
  LOG_LEVEL: "info"
  MOJALOOP_HUB_URL: "CHANGE_ME"
  NODE_ENV: "production"
  OPENSEARCH_URL: "CHANGE_ME"
  PORT: "8085"
  REDIS_ADDR: "CHANGE_ME"
  TEMPORAL_HOST_PORT: "CHANGE_ME"
  TIGERBEETLE_ADDR: "CHANGE_ME"
  WEBHOOK_SECRET_MOJALOOP: "CHANGE_ME"
