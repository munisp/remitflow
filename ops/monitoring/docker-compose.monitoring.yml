# RemitFlow — Monitoring Stack
#
# Usage:
#   docker compose -f ops/monitoring/docker-compose.monitoring.yml up -d
#
# Access:
#   Grafana:      http://localhost:3100 (admin/remitflow)
#   Prometheus:   http://localhost:9090
#   Alertmanager: http://localhost:9093

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: remitflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: remitflow-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PAGERDUTY_PLATFORM_KEY=${PAGERDUTY_PLATFORM_KEY:-}
      - PAGERDUTY_FINANCE_KEY=${PAGERDUTY_FINANCE_KEY:-}
      - PAGERDUTY_COMPLIANCE_KEY=${PAGERDUTY_COMPLIANCE_KEY:-}
      - OPSGENIE_API_KEY=${OPSGENIE_API_KEY:-}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: remitflow-grafana
    ports:
      - "3100:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=remitflow
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/remitflow-transfers.json
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
