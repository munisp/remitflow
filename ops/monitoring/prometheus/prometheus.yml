# RemitFlow — Prometheus Scrape Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Main API server
  - job_name: "remitflow-api"
    metrics_path: "/metrics/features"
    static_configs:
      - targets: ["host.docker.internal:3001"]
    scrape_interval: 10s

  # Go services
  - job_name: "remitflow-go-fiat-rails"
    static_configs:
      - targets: ["host.docker.internal:8125"]
  - job_name: "remitflow-go-qr-gateway"
    static_configs:
      - targets: ["host.docker.internal:8122"]

  # Rust services
  - job_name: "remitflow-rust-search"
    static_configs:
      - targets: ["host.docker.internal:8126"]
  - job_name: "remitflow-rust-qr-crypto"
    static_configs:
      - targets: ["host.docker.internal:8123"]

  # Python services
  - job_name: "remitflow-python-voice"
    static_configs:
      - targets: ["host.docker.internal:8127"]
  - job_name: "remitflow-python-analytics"
    static_configs:
      - targets: ["host.docker.internal:8124"]

  # Infrastructure
  - job_name: "postgres"
    static_configs:
      - targets: ["host.docker.internal:9187"]  # postgres_exporter

  - job_name: "redis"
    static_configs:
      - targets: ["host.docker.internal:9121"]  # redis_exporter

  - job_name: "kafka"
    static_configs:
      - targets: ["host.docker.internal:9308"]  # kafka_exporter
