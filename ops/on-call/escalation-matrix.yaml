# RemitFlow — On-Call Escalation Matrix
# Defines who gets paged, when, and how for each severity level

schedules:
  primary:
    name: "Primary On-Call"
    rotation: weekly
    timezone: "America/Toronto"
    handoff: "Monday 09:00 ET"
    team:
      - name: "[Engineer 1]"
        role: "Senior Backend Engineer"
        phone: "+1-XXX-XXX-XXXX"
        slack: "@engineer1"
      - name: "[Engineer 2]"
        role: "Infrastructure Engineer"
        phone: "+1-XXX-XXX-XXXX"
        slack: "@engineer2"
      - name: "[Engineer 3]"
        role: "Full-Stack Engineer"
        phone: "+1-XXX-XXX-XXXX"
        slack: "@engineer3"

  secondary:
    name: "Secondary On-Call (Escalation)"
    rotation: weekly
    timezone: "America/Toronto"
    handoff: "Monday 09:00 ET"
    team:
      - name: "[Tech Lead]"
        role: "Engineering Manager"
        phone: "+1-XXX-XXX-XXXX"
        slack: "@techlead"
      - name: "[CTO]"
        role: "CTO"
        phone: "+1-XXX-XXX-XXXX"
        slack: "@cto"

  compliance:
    name: "Compliance On-Call"
    rotation: weekly
    timezone: "America/Toronto"
    team:
      - name: "[CCO]"
        role: "Chief Compliance Officer"
        phone: "+1-XXX-XXX-XXXX"
        slack: "@cco"
        email: "compliance@remitflow.app"

severity_levels:
  P1_critical:
    description: "Funds at risk, platform down, data breach, or regulatory violation"
    examples:
      - "Ledger imbalance detected (any amount)"
      - "Platform completely unreachable"
      - "Suspected data breach or unauthorized access"
      - "Sanctions screening failure (transactions going unscreened)"
      - "Customer funds not safeguarded"
    response_time: "5 minutes"
    escalation:
      - time: "0 min"
        notify: ["primary on-call (PagerDuty — phone call)"]
      - time: "5 min (no ack)"
        notify: ["secondary on-call (PagerDuty — phone call)"]
      - time: "10 min (no ack)"
        notify: ["CTO + CEO (phone call)"]
      - time: "15 min"
        notify: ["compliance on-call (if financial/regulatory)"]
    actions:
      - "Acknowledge within 5 minutes"
      - "Assess impact and triage"
      - "If funds at risk: FREEZE platform immediately"
      - "If data breach: initiate breach response protocol"
      - "Post update to #incidents Slack channel every 15 minutes"
      - "Bridge call if > 2 people involved"

  P2_high:
    description: "Degraded service, partial outage, or compliance alert"
    examples:
      - "One payment rail down (e.g., NIBSS unavailable)"
      - "KYC provider returning errors (>5% failure rate)"
      - "Significant latency increase (p95 > 1s)"
      - "SAR filing deadline approaching (<24h remaining)"
      - "High-risk transaction requires manual review"
    response_time: "15 minutes"
    escalation:
      - time: "0 min"
        notify: ["primary on-call (PagerDuty — push notification)"]
      - time: "15 min (no ack)"
        notify: ["secondary on-call (PagerDuty — phone call)"]
      - time: "30 min (no ack)"
        notify: ["CTO (Slack DM)"]
    actions:
      - "Acknowledge within 15 minutes"
      - "Investigate and apply workaround"
      - "If payment rail down: enable fallback rail or queue transactions"
      - "Post update to #incidents Slack channel every 30 minutes"
      - "Resolve or create follow-up ticket within 4 hours"

  P3_medium:
    description: "Non-critical degradation, monitoring alert, performance issue"
    examples:
      - "Elevated error rate (1-5%) on non-critical endpoint"
      - "Disk usage >80%"
      - "Backup job failed (but previous backup is <24h old)"
      - "Single pod restart loop"
      - "Certificate expiring in <14 days"
    response_time: "1 hour (business hours) / 4 hours (off-hours)"
    escalation:
      - time: "0 min"
        notify: ["primary on-call (PagerDuty — push notification)"]
      - time: "1 hour (business hours) or 4 hours (off-hours), no ack"
        notify: ["secondary on-call (Slack DM)"]
    actions:
      - "Acknowledge within response time"
      - "Create incident ticket"
      - "Fix within current on-call rotation (7 days)"

  P4_low:
    description: "Cosmetic issues, non-urgent maintenance, information"
    examples:
      - "Non-critical dependency update available"
      - "Log volume spike (no errors)"
      - "Minor UI rendering issue"
      - "Documentation out of date"
    response_time: "Next business day"
    escalation:
      - time: "0 min"
        notify: ["Slack #alerts channel"]
    actions:
      - "Triage during business hours"
      - "Add to sprint backlog"

communication:
  channels:
    primary: "#incidents (Slack)"
    secondary: "PagerDuty"
    customer: "status.remitflow.app"
    regulator: "Email + phone (per regulator requirements)"

  templates:
    internal_update: |
      **Incident Update** — {severity} — {title}
      **Status**: {investigating|identified|monitoring|resolved}
      **Impact**: {description}
      **Next update**: {time}
      **Bridge**: {link}

    customer_notification: |
      We're currently experiencing {brief description}.
      Your funds are safe. {specific impact on their transactions}.
      We expect this to be resolved by {ETA}.
      For urgent matters, contact support@remitflow.app.

    regulator_notification: |
      [CONFIDENTIAL — REGULATORY NOTIFICATION]
      RemitFlow [jurisdiction entity] is reporting {incident type}
      pursuant to {regulation reference}.
      Impact: {description}
      Remediation: {steps taken}
      Contact: {CCO name, phone, email}

financial_incident_specific:
  ledger_imbalance:
    - "FREEZE all new transactions immediately"
    - "Identify scope (which accounts, what amount)"
    - "Check TigerBeetle vs PostgreSQL reconciliation"
    - "Check bank statement vs internal ledger"
    - "Notify compliance team"
    - "DO NOT attempt manual corrections without dual approval"

  stuck_transfers:
    - "Identify stuck transfers (status=processing for >30min)"
    - "Check payment rail status (Circle, Flutterwave, NIBSS)"
    - "If rail down: queue for retry when restored"
    - "If individual failure: attempt alternate rail"
    - "If irrecoverable: initiate compensation (refund to sender)"
    - "Notify affected customers"

  suspicious_activity:
    - "DO NOT alert the subject"
    - "Freeze subject's account"
    - "Preserve all evidence (screenshots, logs, transaction records)"
    - "Notify compliance officer immediately"
    - "File SAR/STR within regulatory deadline"
    - "Document all actions in compliance audit trail"
