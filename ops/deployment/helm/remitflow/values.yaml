# RemitFlow Helm Chart Values
# Override per environment: values-staging.yaml, values-production.yaml

global:
  environment: production
  domain: remitflow.app
  imageRegistry: ""
  imagePullSecrets: []

# ── API Server ─────────────────────────────────────────────────────────────────

api:
  replicaCount: 3
  image:
    repository: remitflow/api
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

  env:
    NODE_ENV: production
    PORT: "3001"
    LOG_LEVEL: info
    # Secrets injected from K8s secrets / Vault
    # DATABASE_URL: vault:secret/data/remitflow/database#url
    # REDIS_URL: vault:secret/data/remitflow/redis#url

  service:
    type: ClusterIP
    port: 3001

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: api.remitflow.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: remitflow-api-tls
        hosts:
          - api.remitflow.app

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3001
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  nodeSelector:
    role: general

  tolerations: []

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["remitflow-api"]
          topologyKey: kubernetes.io/hostname

# ── Frontend ───────────────────────────────────────────────────────────────────

frontend:
  replicaCount: 2
  image:
    repository: remitflow/frontend
    tag: latest

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: remitflow.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: remitflow-frontend-tls
        hosts:
          - remitflow.app

# ── Temporal Worker ────────────────────────────────────────────────────────────

temporal:
  worker:
    replicaCount: 2
    image:
      repository: remitflow/temporal-worker
      tag: latest
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    env:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_NAMESPACE: remitflow-production

# ── Polyglot Services ──────────────────────────────────────────────────────────

services:
  goFxBridge:
    enabled: true
    replicaCount: 2
    image:
      repository: remitflow/go-marklane-fx-bridge
      tag: latest
    port: 8128
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  rustKycBridge:
    enabled: true
    replicaCount: 2
    image:
      repository: remitflow/rust-kyc-compliance-bridge
      tag: latest
    port: 8129
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 128Mi

  pythonSettlement:
    enabled: true
    replicaCount: 2
    image:
      repository: remitflow/python-settlement-reconciliation
      tag: latest
    port: 8130
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

# ── Infrastructure Dependencies ────────────────────────────────────────────────

postgresql:
  enabled: false # Use Aurora Global Database (managed externally by Terraform)

redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    existingSecret: remitflow-redis-secret
  replica:
    replicaCount: 2
  master:
    persistence:
      size: 10Gi

kafka:
  enabled: true
  replicaCount: 3
  persistence:
    size: 50Gi
  kraft:
    enabled: true
  listeners:
    client:
      protocol: SASL_PLAINTEXT
    interBroker:
      protocol: SASL_PLAINTEXT

# ── Monitoring ─────────────────────────────────────────────────────────────────

monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s

  grafana:
    enabled: true
    dashboards:
      enabled: true
      configMaps:
        - remitflow-dashboards

# ── Network Policies ───────────────────────────────────────────────────────────

networkPolicies:
  enabled: true
  # Only allow API → DB, API → Redis, API → Kafka
  # Deny all other inter-pod traffic by default

# ── Pod Security ───────────────────────────────────────────────────────────────

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
