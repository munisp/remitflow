apiVersion: v2
name: remitflow
description: RemitFlow cross-border payment platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - remittance
  - payments
  - fintech
  - compliance
dependencies:
  - name: postgresql
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "26.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
