# RemitFlow — Service Level Objectives (SLOs)
#
# These SLOs define the minimum acceptable performance for the platform.
# Breaching an SLO triggers alerts and consumes error budget.
#
# Error Budget = 1 - SLO target (e.g., 99.9% → 0.1% error budget per 30 days)

---
slos:
  # ─── Fund Delivery ──────────────────────────────────────────────────────────
  - name: "Fund Delivery Success Rate"
    description: "Percentage of initiated transfers that successfully deliver funds to recipient"
    objective: 99.9%
    window: 30d
    error_budget:
      total_minutes: 43.2  # 30 days × 0.1%
      burn_rate_alert: 14.4x  # 1h window
    indicator:
      type: ratio
      good: "sum(rate(transfers_completed_total[5m]))"
      total: "sum(rate(transfers_initiated_total[5m]))"
    owner: platform-team
    tier: critical
    consequences:
      budget_exhausted: "Halt new feature deployments until budget recovers"
      breach: "SEV1 incident, page engineering manager"

  - name: "Fund Delivery Latency"
    description: "Time from transfer initiation to fund delivery to recipient"
    objective:
      p50: 5s
      p95: 30s
      p99: 120s
    window: 30d
    indicator:
      type: histogram
      metric: "transfer_delivery_duration_seconds"
    thresholds:
      warning: "p95 > 30s for 5 minutes"
      critical: "p95 > 60s for 5 minutes"
    owner: platform-team
    tier: critical

  # ─── API Availability ────────────────────────────────────────────────────────
  - name: "API Availability"
    description: "Percentage of API requests that return a non-5xx response"
    objective: 99.95%
    window: 30d
    error_budget:
      total_minutes: 21.6  # 30 days × 0.05%
    indicator:
      type: ratio
      good: "sum(rate(http_requests_total{status!~'5..'}[5m]))"
      total: "sum(rate(http_requests_total[5m]))"
    owner: platform-team
    tier: high

  - name: "API Latency"
    description: "Response time for API endpoints"
    objective:
      p50: 50ms
      p95: 200ms
      p99: 500ms
    window: 30d
    indicator:
      type: histogram
      metric: "http_request_duration_ms"
    owner: platform-team
    tier: high

  # ─── Financial Integrity ─────────────────────────────────────────────────────
  - name: "Ledger Integrity"
    description: "TigerBeetle ledger must always balance (debits = credits)"
    objective: 100%  # Zero tolerance
    window: continuous
    indicator:
      type: threshold
      metric: "abs(sum(tigerbeetle_debits_total) - sum(tigerbeetle_credits_total))"
      threshold: 0
    owner: finance-team
    tier: critical
    consequences:
      any_breach: "SEV1 incident, halt all transfers, page CFO"

  - name: "FX Rate Freshness"
    description: "FX rates must be updated within 5 minutes"
    objective: 99.9%
    window: 30d
    indicator:
      type: threshold
      metric: "time() - fx_rate_last_updated_timestamp"
      threshold: 300  # 5 minutes
    owner: platform-team
    tier: high

  # ─── Settlement ──────────────────────────────────────────────────────────────
  - name: "Settlement Completion Rate"
    description: "Percentage of payouts that settle successfully on first attempt"
    objective: 99.5%
    window: 30d
    indicator:
      type: ratio
      good: "sum(rate(settlements_completed_total[5m]))"
      total: "sum(rate(settlements_initiated_total[5m]))"
    owner: finance-team
    tier: high

  - name: "Settlement Latency by Rail"
    description: "Time from payout submission to settlement confirmation"
    objectives_by_rail:
      ACH: { p95: 24h }
      SEPA: { p95: 4h }
      SWIFT: { p95: 48h }
      NIBSS: { p95: 30s }
      M-Pesa: { p95: 10s }
      MTN_MoMo: { p95: 30s }
      Mojaloop: { p95: 5s }
      PAPSS: { p95: 60s }
    window: 30d
    owner: finance-team
    tier: high

  # ─── Compliance ──────────────────────────────────────────────────────────────
  - name: "KYC Verification Turnaround"
    description: "Time from document submission to verification decision"
    objective:
      tier1: { p95: 5m }   # Automated (ID check)
      tier2: { p95: 24h }  # Address verification
      tier3: { p95: 72h }  # Enhanced due diligence
    window: 30d
    owner: compliance-team
    tier: medium

  - name: "Sanctions Screening Availability"
    description: "Sanctions screening must be operational for all transfers"
    objective: 99.99%  # 4.3 minutes downtime per month max
    window: 30d
    indicator:
      type: ratio
      good: "sum(rate(sanctions_screening_success_total[5m]))"
      total: "sum(rate(sanctions_screening_total[5m]))"
    owner: compliance-team
    tier: critical
    consequences:
      breach: "Hold all transfers until screening restored"

  # ─── User Experience ─────────────────────────────────────────────────────────
  - name: "Quote Response Time"
    description: "Time to return a corridor quote (FX rate + fees)"
    objective: { p95: 200ms }
    window: 30d
    indicator:
      type: histogram
      metric: "quote_response_duration_ms"
    owner: platform-team
    tier: medium

  - name: "Login Success Rate"
    description: "Percentage of login attempts that succeed"
    objective: 99.9%
    window: 30d
    indicator:
      type: ratio
      good: "sum(rate(auth_login_success_total[5m]))"
      total: "sum(rate(auth_login_attempts_total[5m]))"
    owner: platform-team
    tier: medium

---
# Error Budget Policy
error_budget_policy:
  budget_remaining_100_75:
    action: "Normal development velocity"
  budget_remaining_75_50:
    action: "Prioritize reliability work over features (25% sprint capacity)"
  budget_remaining_50_25:
    action: "50% of sprint dedicated to reliability"
  budget_remaining_25_0:
    action: "Feature freeze — all engineering on reliability"
  budget_exhausted:
    action: "Production freeze — no deploys without VP approval"
    duration: "Until budget recovers to 50%"

---
# Review Cadence
review:
  weekly: "SLO dashboard review in engineering standup"
  monthly: "Error budget consumption report to leadership"
  quarterly: "SLO targets review and adjustment"
