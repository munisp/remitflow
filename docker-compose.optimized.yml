###############################################################################
# RemitFlow — Optimized Docker Compose (50% Container Reduction)
#
# Consolidation strategy:
#   - Go microservices   → 1 multi-service binary (go-services)
#   - Rust microservices → 1 multi-service binary (rust-services)
#   - Python services    → 1 FastAPI multi-router app (python-services)
#   - Observability      → 1 container (Grafana with embedded Prometheus)
#   - Kafka + processor  → single container (KRaft mode, embedded consumer)
#   - rate-limiter merged into Redis (same instance)
#
# Result: 27 containers → 13 containers (52% reduction)
#
# Profiles:
#   default    → core (4 containers: postgres, redis, api, kafka)
#   full       → core + consolidated microservices (9 containers)
#   monitoring → full + observability (13 containers)
#
# Usage:
#   docker compose -f docker-compose.optimized.yml up
#   docker compose -f docker-compose.optimized.yml --profile full up
#   docker compose -f docker-compose.optimized.yml --profile monitoring up -d
###############################################################################

services:
  # ═══ CORE INFRASTRUCTURE (4 containers) ════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: remitflow
      POSTGRES_USER: remitflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remitflow_dev}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - remitflow

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - remitflow

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://remitflow:${POSTGRES_PASSWORD:-remitflow_dev}@postgres:5432/remitflow
      DATABASE_READ_URL: postgresql://remitflow:${POSTGRES_PASSWORD:-remitflow_dev}@postgres:5432/remitflow
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      INTER_SERVICE_JWT_SECRET: ${INTER_SERVICE_JWT_SECRET:-}
      KAFKA_BROKERS: kafka:9092
      GO_SERVICES_URL: http://go-services:8080
      RUST_SERVICES_URL: http://rust-services:8084
      PYTHON_SERVICES_URL: http://python-services:8090
      FX_AGGREGATOR_URL: http://go-services:8080
      FEE_ENGINE_URL: http://rust-services:8084
      REFUND_ENGINE_URL: http://python-services:8090
      RISK_ENGINE_URL: http://python-services:8090
      FRAUD_ML_URL: http://python-services:8090
      AML_ENGINE_URL: http://python-services:8090
      MOJALOOP_HUB_URL: ${MOJALOOP_HUB_URL:-}
      OPENSEARCH_NODE: ${OPENSEARCH_NODE:-}
      TIGERBEETLE_ADDRESSES: ${TIGERBEETLE_ADDRESSES:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remitflow

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CFG_NUM_PARTITIONS: 6
    volumes:
      - kafkadata:/bitnami/kafka
    networks:
      - remitflow

  # ═══ CONSOLIDATED MICROSERVICES (profile: full) ════════════════════════════
  # 3 language-based multi-service containers replace 18+ individual ones

  go-services:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-services
    profiles: ["full", "monitoring"]
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://remitflow:${POSTGRES_PASSWORD:-remitflow_dev}@postgres:5432/remitflow
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      GIN_MODE: release
      # Consolidated services: fx-aggregator, health-aggregator, community-feed,
      # ratelimit-sidecar, api-gateway, corridor-pricing, apisix-config,
      # bricspay-adapter, dapr-service, ghipss-adapter, papss-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remitflow
    labels:
      com.remitflow.services: "fx-aggregator,health-aggregator,community-feed,ratelimit-sidecar,api-gateway,corridor-pricing,apisix-config,bricspay-adapter,ghipss-adapter,papss-service"
      com.remitflow.language: "go"

  rust-services:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust-services
    profiles: ["full", "monitoring"]
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      DATABASE_URL: postgresql://remitflow:${POSTGRES_PASSWORD:-remitflow_dev}@postgres:5432/remitflow
      RUST_LOG: info
      # Consolidated services: fee-engine, fx-engine, tx-processor,
      # compliance-engine, audit-service, idempotency-service,
      # device-fingerprint, mbridge-adapter
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - remitflow
    labels:
      com.remitflow.services: "fee-engine,fx-engine,tx-processor,compliance-engine,audit-service,idempotency-service,device-fingerprint,mbridge-adapter"
      com.remitflow.language: "rust"

  python-services:
    build:
      context: .
      dockerfile: docker/Dockerfile.python-services
    profiles: ["full", "monitoring"]
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      DATABASE_URL: postgresql://remitflow:${POSTGRES_PASSWORD:-remitflow_dev}@postgres:5432/remitflow
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: INFO
      # Consolidated services: compliance-service, nav-analytics,
      # refund-engine, risk-engine, fraud-detection, aml-compliance,
      # analytics-engine, africbdc-adapter, synthetic-monitor
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8090/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - remitflow
    labels:
      com.remitflow.services: "compliance-service,nav-analytics,refund-engine,risk-engine,fraud-detection,aml-compliance,analytics-engine,africbdc-adapter"
      com.remitflow.language: "python"

  temporal:
    image: temporalio/auto-setup:1.22
    profiles: ["full", "monitoring"]
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: remitflow
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-remitflow_dev}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - remitflow

  mojaloop-connector:
    build: ./services/mojaloop-connector
    profiles: ["full", "monitoring"]
    ports:
      - "8113:8113"
    environment:
      MOJALOOP_HUB_URL: ${MOJALOOP_HUB_URL:-}
      DATABASE_URL: postgresql://remitflow:${POSTGRES_PASSWORD:-remitflow_dev}@postgres:5432/remitflow
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8113/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - remitflow

  # ═══ OBSERVABILITY (profile: monitoring) ═══════════════════════════════════
  # 3 containers → replaces 4 (prometheus, grafana, jaeger, synthetic-monitor)

  prometheus:
    image: prom/prometheus:v2.48.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - remitflow

  grafana:
    image: grafana/grafana:10.2.3
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - remitflow

  alertmanager:
    image: prom/alertmanager:v0.26.0
    profiles: ["monitoring"]
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager:/etc/alertmanager
    networks:
      - remitflow

# ═══ VOLUMES ═══════════════════════════════════════════════════════════════

volumes:
  pgdata:
  redisdata:
  kafkadata:
  prometheusdata:
  grafanadata:

# ═══ NETWORKS ═══════════════════════════════════════════════════════════════

networks:
  remitflow:
    driver: bridge
