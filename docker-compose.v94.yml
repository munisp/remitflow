# ============================================================
# RemitFlow v94 — Production Services Stack
# ============================================================
# New services added in v94:
#   fcm-proxy        — Firebase Cloud Messaging proxy (graceful fallback)
#   ab-testing-svc   — A/B experiment assignment & event tracking service
#   referral-engine  — Referral bonus calculation & payout engine
#   doc-vault-api    — Document vault S3 lifecycle management service
#   rate-alert-svc   — FX rate alert evaluation & notification dispatcher
#   security-audit   — Security event aggregation & SIEM forwarding
#   redis-v94        — Dedicated Redis for v94 rate limiting, lockout cache
#   prometheus-v94   — Prometheus scraping v94 metrics endpoints
#
# Usage:
#   Full stack (all services):
#     docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.ai.yml \
#       -f docker-compose.pipelines.yml \
#       -f docker-compose.v90.yml \
#       -f docker-compose.v94.yml up -d
#
#   v94 services only:
#     docker compose -f docker-compose.v94.yml up -d
#
# Default credentials:
#   FCM Proxy:        http://localhost:9500  (API key: remitflow-fcm-key-v94)
#   A/B Testing Svc:  http://localhost:9501  (API key: remitflow-ab-key-v94)
#   Referral Engine:  http://localhost:9502  (API key: remitflow-ref-key-v94)
#   Doc Vault API:    http://localhost:9503  (API key: remitflow-doc-key-v94)
#   Rate Alert Svc:   http://localhost:9504  (API key: remitflow-rate-key-v94)
#   Security Audit:   http://localhost:9505  (API key: remitflow-sec-key-v94)
#   Redis v94:        localhost:6381         (password: remitflow_redis_v94)
# ============================================================
version: "3.9"

networks:
  remitflow-v94:
    name: remitflow-v94
    driver: bridge
  remitflow-pipelines:
    external: true
    name: remitflow-pipelines

volumes:
  redis_v94_data:
  prometheus_v94_data:
  ab_testing_data:
  referral_engine_data:
  doc_vault_data:
  security_audit_data:

services:
  # ── FCM Proxy ────────────────────────────────────────────────────────────────
  fcm-proxy:
    image: node:22-alpine
    container_name: remitflow-fcm-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:9500:9500"
    environment:
      PORT: "9500"
      FCM_API_KEY: "${FIREBASE_SERVER_KEY:-}"
      API_KEY: "remitflow-fcm-key-v94"
    command: >
      sh -c "
        cat > /app/server.mjs << 'EOF'
        import http from 'http';
        const server = http.createServer((req, res) => {
          if (req.headers['x-api-key'] !== process.env.API_KEY) {
            res.writeHead(401); res.end(JSON.stringify({error:'Unauthorized'})); return;
          }
          if (req.url === '/health') { res.writeHead(200); res.end(JSON.stringify({status:'ok',version:'v94'})); return; }
          if (req.url === '/send' && req.method === 'POST') {
            let body = '';
            req.on('data', d => body += d);
            req.on('end', () => {
              const payload = JSON.parse(body);
              // Forward to FCM if key is configured
              if (process.env.FCM_API_KEY) {
                fetch('https://fcm.googleapis.com/fcm/send', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': 'key=' + process.env.FCM_API_KEY },
                  body: JSON.stringify(payload)
                }).then(r => r.json()).then(result => {
                  res.writeHead(200); res.end(JSON.stringify(result));
                }).catch(e => { res.writeHead(500); res.end(JSON.stringify({error: e.message})); });
              } else {
                res.writeHead(200); res.end(JSON.stringify({success:0,failure:0,message:'FCM not configured'}));
              }
            });
            return;
          }
          res.writeHead(404); res.end(JSON.stringify({error:'Not found'}));
        });
        server.listen(process.env.PORT || 9500, () => console.log('FCM Proxy running on port', process.env.PORT));
        EOF
        mkdir -p /app && node /app/server.mjs
      "
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9500/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v94

  # ── A/B Testing Service ───────────────────────────────────────────────────────
  ab-testing-svc:
    image: python:3.11-slim
    container_name: remitflow-ab-testing
    restart: unless-stopped
    ports:
      - "127.0.0.1:9501:9501"
    environment:
      PORT: "9501"
      API_KEY: "remitflow-ab-key-v94"
      DATABASE_URL: "${DATABASE_URL:-}"
    command: >
      sh -c "
        pip install flask psycopg2-binary --quiet &&
        cat > /app/server.py << 'PYEOF'
        from flask import Flask, request, jsonify
        import hashlib, os, json
        app = Flask(__name__)
        API_KEY = os.environ.get('API_KEY', 'remitflow-ab-key-v94')

        def check_auth():
            return request.headers.get('X-API-Key') == API_KEY

        @app.route('/health')
        def health():
            return jsonify({'status': 'ok', 'version': 'v94'})

        @app.route('/assign', methods=['POST'])
        def assign():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            data = request.json
            user_id = str(data.get('userId', ''))
            experiment_name = data.get('experimentName', '')
            variants = data.get('variants', [])
            if not variants: return jsonify({'error': 'No variants'}), 400
            # Deterministic assignment based on user_id + experiment_name hash
            hash_val = int(hashlib.md5((user_id + experiment_name).encode()).hexdigest(), 16)
            total_weight = sum(v.get('weight', 50) for v in variants)
            bucket = hash_val % total_weight
            cumulative = 0
            assigned = variants[0]
            for v in variants:
                cumulative += v.get('weight', 50)
                if bucket < cumulative:
                    assigned = v
                    break
            return jsonify({'variant': assigned, 'userId': user_id, 'experimentName': experiment_name})

        @app.route('/track', methods=['POST'])
        def track():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            data = request.json
            # In production, write to ab_events table
            return jsonify({'success': True, 'event': data.get('event'), 'userId': data.get('userId')})

        if __name__ == '__main__':
            app.run(host='0.0.0.0', port=int(os.environ.get('PORT', 9501)))
        PYEOF
        python /app/server.py
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9501/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v94

  # ── Referral Engine ───────────────────────────────────────────────────────────
  referral-engine:
    image: python:3.11-slim
    container_name: remitflow-referral-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:9502:9502"
    environment:
      PORT: "9502"
      API_KEY: "remitflow-ref-key-v94"
      REFERRER_BONUS_USD: "5.00"
      REFERRED_BONUS_USD: "2.00"
      MIN_TRANSFER_AMOUNT_USD: "50.00"
    command: >
      sh -c "
        pip install flask --quiet &&
        cat > /app/server.py << 'PYEOF'
        from flask import Flask, request, jsonify
        import os, datetime
        app = Flask(__name__)
        API_KEY = os.environ.get('API_KEY', 'remitflow-ref-key-v94')

        def check_auth():
            return request.headers.get('X-API-Key') == API_KEY

        @app.route('/health')
        def health():
            return jsonify({'status': 'ok', 'version': 'v94', 'service': 'referral-engine'})

        @app.route('/calculate', methods=['POST'])
        def calculate():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            data = request.json
            transfer_amount_usd = float(data.get('transferAmountUsd', 0))
            min_amount = float(os.environ.get('MIN_TRANSFER_AMOUNT_USD', 50))
            if transfer_amount_usd < min_amount:
                return jsonify({'eligible': False, 'reason': f'Transfer below minimum ${min_amount}'})
            return jsonify({
                'eligible': True,
                'referrerBonus': float(os.environ.get('REFERRER_BONUS_USD', 5)),
                'referredBonus': float(os.environ.get('REFERRED_BONUS_USD', 2)),
                'currency': 'USD',
                'expiresAt': (datetime.datetime.utcnow() + datetime.timedelta(days=30)).isoformat() + 'Z'
            })

        @app.route('/validate-code', methods=['POST'])
        def validate_code():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            data = request.json
            code = data.get('code', '')
            # Basic validation: 6-8 alphanumeric chars starting with RF
            import re
            valid = bool(re.match(r'^RF[A-Z0-9]{4,6}$', code))
            return jsonify({'valid': valid, 'code': code})

        if __name__ == '__main__':
            app.run(host='0.0.0.0', port=int(os.environ.get('PORT', 9502)))
        PYEOF
        python /app/server.py
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9502/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v94

  # ── Document Vault API ────────────────────────────────────────────────────────
  doc-vault-api:
    image: python:3.11-slim
    container_name: remitflow-doc-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:9503:9503"
    environment:
      PORT: "9503"
      API_KEY: "remitflow-doc-key-v94"
      EXPIRY_WARNING_DAYS: "30"
    command: >
      sh -c "
        pip install flask --quiet &&
        cat > /app/server.py << 'PYEOF'
        from flask import Flask, request, jsonify
        import os, datetime
        app = Flask(__name__)
        API_KEY = os.environ.get('API_KEY', 'remitflow-doc-key-v94')

        def check_auth():
            return request.headers.get('X-API-Key') == API_KEY

        @app.route('/health')
        def health():
            return jsonify({'status': 'ok', 'version': 'v94', 'service': 'doc-vault-api'})

        @app.route('/check-expiry', methods=['POST'])
        def check_expiry():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            data = request.json
            expires_at = data.get('expiresAt')
            if not expires_at: return jsonify({'expired': False, 'expiringSoon': False})
            warning_days = int(os.environ.get('EXPIRY_WARNING_DAYS', 30))
            exp_date = datetime.datetime.fromisoformat(expires_at.replace('Z', '+00:00'))
            now = datetime.datetime.now(datetime.timezone.utc)
            days_until_expiry = (exp_date - now).days
            return jsonify({
                'expired': days_until_expiry < 0,
                'expiringSoon': 0 <= days_until_expiry <= warning_days,
                'daysUntilExpiry': days_until_expiry,
                'warningDays': warning_days
            })

        @app.route('/categorize', methods=['POST'])
        def categorize():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            data = request.json
            filename = data.get('filename', '').lower()
            categories = {
                'identity': ['passport', 'id', 'license', 'national', 'birth'],
                'address': ['utility', 'bank statement', 'council', 'lease', 'address'],
                'financial': ['payslip', 'tax', 'income', 'salary', 'statement'],
                'compliance': ['aml', 'kyc', 'compliance', 'sanctions', 'pep'],
                'contract': ['contract', 'agreement', 'terms', 'policy'],
            }
            for cat, keywords in categories.items():
                if any(kw in filename for kw in keywords):
                    return jsonify({'category': cat, 'confidence': 0.85})
            return jsonify({'category': 'other', 'confidence': 0.5})

        if __name__ == '__main__':
            app.run(host='0.0.0.0', port=int(os.environ.get('PORT', 9503)))
        PYEOF
        python /app/server.py
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9503/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v94

  # ── Rate Alert Service ────────────────────────────────────────────────────────
  rate-alert-svc:
    image: python:3.11-slim
    container_name: remitflow-rate-alert
    restart: unless-stopped
    ports:
      - "127.0.0.1:9504:9504"
    environment:
      PORT: "9504"
      API_KEY: "remitflow-rate-key-v94"
      FX_API_URL: "https://open.er-api.com/v6/latest"
      CHECK_INTERVAL_SECONDS: "300"
    command: >
      sh -c "
        pip install flask requests --quiet &&
        cat > /app/server.py << 'PYEOF'
        from flask import Flask, request, jsonify
        import os, requests as req_lib
        app = Flask(__name__)
        API_KEY = os.environ.get('API_KEY', 'remitflow-rate-key-v94')
        FX_API_URL = os.environ.get('FX_API_URL', 'https://open.er-api.com/v6/latest')

        def check_auth():
            return request.headers.get('X-API-Key') == API_KEY

        @app.route('/health')
        def health():
            return jsonify({'status': 'ok', 'version': 'v94', 'service': 'rate-alert-svc'})

        @app.route('/evaluate', methods=['POST'])
        def evaluate():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            data = request.json
            from_currency = data.get('fromCurrency', 'USD')
            to_currency = data.get('toCurrency', 'NGN')
            target_rate = float(data.get('targetRate', 0))
            direction = data.get('direction', 'above')
            try:
                r = req_lib.get(f'{FX_API_URL}/{from_currency}', timeout=5)
                rates = r.json().get('rates', {})
                actual_rate = rates.get(to_currency, 0)
                triggered = (direction == 'above' and actual_rate >= target_rate) or \
                            (direction == 'below' and actual_rate <= target_rate)
                return jsonify({
                    'triggered': triggered,
                    'actualRate': actual_rate,
                    'targetRate': target_rate,
                    'direction': direction,
                    'fromCurrency': from_currency,
                    'toCurrency': to_currency
                })
            except Exception as e:
                return jsonify({'error': str(e)}), 500

        if __name__ == '__main__':
            app.run(host='0.0.0.0', port=int(os.environ.get('PORT', 9504)))
        PYEOF
        python /app/server.py
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9504/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v94

  # ── Security Audit Service ────────────────────────────────────────────────────
  security-audit:
    image: python:3.11-slim
    container_name: remitflow-security-audit
    restart: unless-stopped
    ports:
      - "127.0.0.1:9505:9505"
    environment:
      PORT: "9505"
      API_KEY: "remitflow-sec-key-v94"
      SIEM_ENDPOINT: "${SIEM_ENDPOINT:-}"
      ALERT_THRESHOLD_CRITICAL: "1"
      ALERT_THRESHOLD_WARNING: "5"
    volumes:
      - security_audit_data:/var/log/security-audit
    command: >
      sh -c "
        pip install flask --quiet &&
        cat > /app/server.py << 'PYEOF'
        from flask import Flask, request, jsonify
        import os, json, datetime
        app = Flask(__name__)
        API_KEY = os.environ.get('API_KEY', 'remitflow-sec-key-v94')
        LOG_DIR = '/var/log/security-audit'
        os.makedirs(LOG_DIR, exist_ok=True)

        def check_auth():
            return request.headers.get('X-API-Key') == API_KEY

        @app.route('/health')
        def health():
            return jsonify({'status': 'ok', 'version': 'v94', 'service': 'security-audit'})

        @app.route('/ingest', methods=['POST'])
        def ingest():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            event = request.json
            event['ingestedAt'] = datetime.datetime.utcnow().isoformat() + 'Z'
            log_file = os.path.join(LOG_DIR, f'security-{datetime.date.today()}.jsonl')
            with open(log_file, 'a') as f:
                f.write(json.dumps(event) + '\n')
            severity = event.get('severity', 'info')
            siem_endpoint = os.environ.get('SIEM_ENDPOINT', '')
            if siem_endpoint and severity in ['critical', 'warning']:
                try:
                    import urllib.request
                    req = urllib.request.Request(siem_endpoint, data=json.dumps(event).encode(), method='POST')
                    req.add_header('Content-Type', 'application/json')
                    urllib.request.urlopen(req, timeout=3)
                except: pass
            return jsonify({'success': True, 'severity': severity})

        @app.route('/summary', methods=['GET'])
        def summary():
            if not check_auth(): return jsonify({'error': 'Unauthorized'}), 401
            log_file = os.path.join(LOG_DIR, f'security-{datetime.date.today()}.jsonl')
            events = []
            if os.path.exists(log_file):
                with open(log_file) as f:
                    events = [json.loads(line) for line in f if line.strip()]
            severity_counts = {}
            for e in events:
                s = e.get('severity', 'info')
                severity_counts[s] = severity_counts.get(s, 0) + 1
            return jsonify({'total': len(events), 'bySeverity': severity_counts, 'date': str(datetime.date.today())})

        if __name__ == '__main__':
            app.run(host='0.0.0.0', port=int(os.environ.get('PORT', 9505)))
        PYEOF
        python /app/server.py
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9505/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v94

  # ── Redis v94 ─────────────────────────────────────────────────────────────────
  redis-v94:
    image: redis:7-alpine
    container_name: remitflow-redis-v94
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    command: redis-server --requirepass remitflow_redis_v94 --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redis_v94_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "remitflow_redis_v94", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - remitflow-v94

  # ── Prometheus v94 ────────────────────────────────────────────────────────────
  prometheus-v94:
    image: prom/prometheus:latest
    container_name: remitflow-prometheus-v94
    restart: unless-stopped
    ports:
      - "127.0.0.1:9095:9090"
    volumes:
      - prometheus_v94_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    configs:
      - source: prometheus_v94_config
        target: /etc/prometheus/prometheus.yml
    networks:
      - remitflow-v94

configs:
  prometheus_v94_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: 'remitflow-v94-services'
          static_configs:
            - targets:
              - 'fcm-proxy:9500'
              - 'ab-testing-svc:9501'
              - 'referral-engine:9502'
              - 'doc-vault-api:9503'
              - 'rate-alert-svc:9504'
              - 'security-audit:9505'
          metrics_path: /health
          honor_labels: true
        - job_name: 'redis-v94'
          static_configs:
            - targets: ['redis-v94:6379']
