name: w19-giants
on:
  push:
    paths:
      - .github/workflows/w19-giants.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble giants
        run: |
          set -euo pipefail
          cat .w19chunks/routers_b64.?? | base64 -d | gunzip > server/routers.ts
          cat .w19chunks/schema_b64.?? | base64 -d | gunzip > drizzle/schema.ts
      - name: Verify blob hashes
        run: |
          set -euo pipefail
          R=$(git hash-object server/routers.ts)
          S=$(git hash-object drizzle/schema.ts)
          echo "routers.ts: $R"; echo "schema.ts: $S"
          [ "$R" = "8eb44ed370baa68641da4bd1e0e03677b177c0d6" ] || { echo "ROUTERS HASH MISMATCH"; exit 1; }
          [ "$S" = "78bef21b8f854aea407b25302d118a818952e1ec" ] || { echo "SCHEMA HASH MISMATCH"; exit 1; }
      - name: Commit giants and remove transport files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q .w19chunks
          git rm -q .github/workflows/w19-giants.yml
          git add server/routers.ts drizzle/schema.ts
          git commit -m "W19: routers.ts + schema.ts (chunked transport via workflow, MERGE-SOUND)"
          git push
