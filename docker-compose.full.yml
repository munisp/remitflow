version: "3.9"
# ── RemitFlow — Complete Production Stack ────────────────────────────────────
# Combines: App + Middleware + Microservices + Observability
#
# Usage:
#   docker compose -f docker-compose.full.yml up -d
#   docker compose -f docker-compose.full.yml logs -f app
#   docker compose -f docker-compose.full.yml down -v
#
# Prerequisites:
#   cp .env.example .env && edit .env with your secrets
#   docker compose -f docker-compose.full.yml pull

include:
  - docker-compose.middleware.yml
  - docker-compose.services.yml

services:
  # ── Main Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: remitflow/app:latest
    container_name: remitflow_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET:-remitflow_jwt_secret_change_in_production}"
      REDIS_URL: "redis://redis:6379"
      REDIS_PASSWORD: "remitflow_redis_secret"
      KAFKA_BROKERS: "kafka:29092"
      OPENSEARCH_URL: "http://opensearch:9200"
      TEMPORAL_HOST: "temporal:7233"
      PERMIFY_URL: "http://permify:3478"
      FX_ENGINE_URL: "http://fx-engine:8081"
      MOJALOOP_CONNECTOR_URL: "http://mojaloop-connector:8085"
      LEDGER_SERVICE_URL: "http://ledger-service:8086"
      RISK_ENGINE_URL: "http://risk-engine:8091"
      RATE_LIMITER_URL: "http://rate-limiter:8092"
      FRAUD_ML_URL: "http://fraud-ml:8082"
      AML_ENGINE_URL: "http://aml-engine:8083"
      JAEGER_ENDPOINT: "http://jaeger:4318/v1/traces"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - remitflow_middleware
      - remitflow_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: remitflow_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx_cache:

networks:
  remitflow_middleware:
    external: true
    name: remitflow_middleware
  remitflow_net:
    external: true
    name: remitflow_net
