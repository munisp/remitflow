<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RemitFlow — Cross-Border Remittance Platform</title>

    <!-- PWA Core -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Send money home to family, invest in your roots, save together with your community — the app built for the diaspora." />
    <meta name="application-name" content="RemitFlow" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RemitFlow" />
    <link rel="apple-touch-icon" href="/manus-storage/apple-touch-icon_28be41f0.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/manus-storage/favicon-32_7a835f7c.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/manus-storage/icon-192_d0405887.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RemitFlow — Cross-Border Remittance" />
    <meta property="og:description" content="Send money home to family, invest in your roots, save together with your community — the app built for the diaspora." />
    <meta property="og:image" content="/manus-storage/icon-512_41fa5aeb.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RemitFlow — Send Money Home" />
    <meta name="twitter:description" content="The app built for the diaspora. Send money home, invest in your roots, save with your community." />
    <meta name="twitter:image" content="/manus-storage/icon-512_41fa5aeb.png" />

    <!-- React Fast Refresh pre-init: manus-runtime is a sync script that runs before the
         async preamble module. Pre-initializing these globals prevents the
         "can't detect preamble" error in dev mode. The real preamble module overwrites them. -->
    <script>
      if (typeof window !== 'undefined') {
        window.$RefreshReg$ = window.$RefreshReg$ || function() {};
        window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  
</body>

</html>
