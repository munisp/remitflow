apiVersion: v1
kind: Service
metadata:
  name: mojaloop-hub
  namespace: payment-systems
  labels:
    app: mojaloop-hub
    component: payment-switch
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: mojaloop-hub

---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-hub-headless
  namespace: payment-systems
  labels:
    app: mojaloop-hub
    component: payment-switch
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: 9000
    protocol: TCP
  selector:
    app: mojaloop-hub

---
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle-service
  namespace: payment-systems
  labels:
    app: mojaloop-hub
    component: ledger
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: 9091
    protocol: TCP
  selector:
    app: mojaloop-hub

---
apiVersion: v1
kind: Service
metadata:
  name: upi-integration
  namespace: payment-systems
  labels:
    app: upi-integration
    component: payment-system
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
  - name: metrics
    port: 9092
    targetPort: 9092
