groups:
  - name: openappsec_security_alerts
    interval: 30s
    rules:
      # Critical Alerts
      - alert: HighThreatRate
        expr: rate(openappsec_threats_detected_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
          component: openappsec
        annotations:
          summary: "High threat detection rate"
          description: "Threat detection rate is {{ $value }} threats/sec (threshold: 10/sec)"

      - alert: CriticalThreatDetected
        expr: increase(openappsec_threats_detected_total{severity="critical"}[1m]) > 0
        for: 0m
        labels:
          severity: critical
          component: openappsec
        annotations:
          summary: "Critical threat detected"
          description: "Critical severity threat detected: {{ $labels.threat_type }}"

      - alert: MassiveBlockedRequests
        expr: rate(openappsec_blocked_requests_total[5m]) > 50
        for: 2m
        labels:
          severity: critical
          component: openappsec
        annotations:
          summary: "Massive request blocking"
          description: "Blocking {{ $value }} requests/sec (threshold: 50/sec) - possible attack"

      - alert: OpenAppsecServiceDown
        expr: up{job="openappsec-bridge"} == 0
        for: 1m
        labels:
          severity: critical
          component: openappsec
        annotations:
          summary: "openappsec bridge service is down"
          description: "openappsec bridge service has been down for more than 1 minute"

      - alert: OpenAppsecAgentDown
        expr: up{job="openappsec-agent"} == 0
        for: 1m
        labels:
          severity: critical
          component: openappsec
        annotations:
          summary: "openappsec agent is down"
          description: "openappsec agent has been down for more than 1 minute"

      # High Severity Alerts
      - alert: HighInspectionLatency
        expr: histogram_quantile(0.95, rate(openappsec_inspection_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: high
          component: openappsec
        annotations:
          summary: "High inspection latency"
          description: "95th percentile inspection latency is {{ $value }}s (threshold: 1s)"

      - alert: SQLInjectionAttack
        expr: increase(openappsec_threats_detected_total{threat_type="sql_injection"}[5m]) > 5
        for: 1m
        labels:
          severity: high
          component: openappsec
        annotations:
          summary: "SQL injection attack detected"
          description: "{{ $value }} SQL injection attempts in last 5 minutes"

      - alert: XSSAttack
        expr: increase(openappsec_threats_detected_total{threat_type="xss"}[5m]) > 5
        for: 1m
        labels:
          severity: high
          component: openappsec
        annotations:
          summary: "XSS attack detected"
          description: "{{ $value }} XSS attempts in last 5 minutes"

      - alert: BruteForceAttack
        expr: increase(openappsec_threats_detected_total{threat_type="brute_force"}[5m]) > 10
        for: 2m
        labels:
          severity: high
          component: openappsec
        annotations:
          summary: "Brute force attack detected"
          description: "{{ $value }} brute force attempts in last 5 minutes"

      - alert: BotAttack
        expr: increase(openappsec_threats_detected_total{threat_type="malicious_bot"}[5m]) > 20
        for: 2m
        labels:
          severity: high
          component: openappsec
        annotations:
          summary: "Bot attack detected"
          description: "{{ $value }} malicious bot requests in last 5 minutes"

      # Warning Alerts
      - alert: ElevatedThreatRate
        expr: rate(openappsec_threats_detected_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
          component: openappsec
        annotations:
          summary: "Elevated threat detection rate"
          description: "Threat detection rate is {{ $value }} threats/sec (threshold: 5/sec)"

      - alert: HighBlockRate
        expr: rate(openappsec_blocked_requests_total[10m]) > 20
        for: 5m
        labels:
          severity: warning
          component: openappsec
        annotations:
          summary: "High request block rate"
          description: "Blocking {{ $value }} requests/sec (threshold: 20/sec)"

      - alert: InspectionErrors
        expr: rate(openappsec_inspection_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: openappsec
        annotations:
          summary: "Inspection errors detected"
          description: "{{ $value }} inspection errors/sec"

      - alert: PolicyViolations
        expr: increase(openappsec_policy_violations_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          component: openappsec
        annotations:
          summary: "Multiple policy violations"
          description: "{{ $value }} policy violations in last 10 minutes"

      # Info Alerts
      - alert: ThreatIntelligenceUpdateFailed
        expr: time() - openappsec_threat_intelligence_last_update_timestamp > 7200
        for: 10m
        labels:
          severity: info
          component: openappsec
        annotations:
          summary: "Threat intelligence not updated"
          description: "Threat intelligence hasn't been updated for {{ $value }}s (threshold: 2 hours)"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="openappsec-bridge"} / 1024 / 1024 > 1024
        for: 10m
        labels:
          severity: info
          component: openappsec
        annotations:
          summary: "High memory usage"
          description: "openappsec bridge using {{ $value }}MB memory (threshold: 1024MB)"

  - name: openappsec_performance_alerts
    interval: 30s
    rules:
      - alert: HighRequestRate
        expr: rate(openappsec_requests_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
          component: openappsec
        annotations:
          summary: "High request rate"
          description: "Processing {{ $value }} requests/sec (threshold: 1000/sec)"

      - alert: LowRequestRate
        expr: rate(openappsec_requests_total[5m]) < 1
        for: 10m
        labels:
          severity: info
          component: openappsec
        annotations:
          summary: "Low request rate"
          description: "Only {{ $value }} requests/sec - possible connectivity issue"

  - name: openappsec_availability_alerts
    interval: 30s
    rules:
      - alert: OpenAppsecDegraded
        expr: up{job="openappsec-bridge"} == 1 and rate(openappsec_inspection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: openappsec
        annotations:
          summary: "openappsec service degraded"
          description: "Service is up but experiencing errors: {{ $value }} errors/sec"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total{job="openappsec-bridge"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          component: openappsec
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

