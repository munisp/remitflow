# OpenAppSec Helm Chart Values

replicaCount: 3

image:
  repository: openappsec/agent
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

security:
  waf:
    enabled: true
    mode: blocking
  api:
    enabled: true
  bot:
    enabled: true
  ddos:
    enabled: true

monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9093
