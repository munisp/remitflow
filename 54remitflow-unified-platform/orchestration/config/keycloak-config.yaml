---
# Keycloak Configuration for Nigerian Remittance Platform
# Version: 1.0
# Date: 2025-11-12

keycloak:
  # Server Configuration
  server:
    url: "${KEYCLOAK_URL:http://keycloak:8080}"
    realm: "${KEYCLOAK_REALM:remittance-platform}"
    admin_username: "${KEYCLOAK_ADMIN_USER:admin}"
    admin_password: "${KEYCLOAK_ADMIN_PASSWORD}"
  
  # Client Configuration
  client:
    id: "${KEYCLOAK_CLIENT_ID:remittance-api}"
    secret: "${KEYCLOAK_CLIENT_SECRET}"
    redirect_uris:
      - "https://api.remittance.ng/*"
      - "https://app.remittance.ng/*"
      - "http://localhost:3000/*"
    web_origins:
      - "https://app.remittance.ng"
      - "http://localhost:3000"
  
  # Roles Configuration
  roles:
    realm_roles:
      - name: "user"
        description: "Basic authenticated user"
        composite: false
      
      - name: "premium_user"
        description: "Premium user with enhanced features"
        composite: true
        composites:
          realm:
            - "user"
      
      - name: "admin"
        description: "Platform administrator"
        composite: true
        composites:
          realm:
            - "premium_user"
      
      - name: "support_agent"
        description: "Customer support agent"
        composite: false
      
      - name: "compliance_officer"
        description: "Compliance and AML officer"
        composite: false
  
  # Permission Mappings
  permissions:
    # Domestic Transactions
    transfer:domestic:
      required_roles:
        - "user"
        - "premium_user"
        - "admin"
      mfa_required: false
      kyc_tier_required: "basic"
    
    # International Transactions
    transfer:international:
      required_roles:
        - "premium_user"
        - "admin"
      mfa_required: true
      kyc_tier_required: "enhanced"
    
    # Cryptocurrency
    transfer:crypto:
      required_roles:
        - "premium_user"
        - "admin"
      mfa_required: true
      kyc_tier_required: "premium"
    
    # Wallet Operations
    wallet:topup:
      required_roles:
        - "user"
        - "premium_user"
        - "admin"
      mfa_required: false
      kyc_tier_required: "basic"
    
    wallet:withdraw:
      required_roles:
        - "user"
        - "premium_user"
        - "admin"
      mfa_required: true
      kyc_tier_required: "standard"
    
    # Financial Services
    financial:savings:
      required_roles:
        - "user"
        - "premium_user"
        - "admin"
      mfa_required: false
      kyc_tier_required: "standard"
    
    financial:investment:
      required_roles:
        - "premium_user"
        - "admin"
      mfa_required: true
      kyc_tier_required: "enhanced"
    
    financial:loan:
      required_roles:
        - "premium_user"
        - "admin"
      mfa_required: true
      kyc_tier_required: "enhanced"
    
    financial:insurance:
      required_roles:
        - "user"
        - "premium_user"
        - "admin"
      mfa_required: false
      kyc_tier_required: "standard"
    
    # Admin Operations
    admin:all:
      required_roles:
        - "admin"
      mfa_required: true
      kyc_tier_required: "premium"
  
  # Session Configuration
  session:
    timeout_seconds: 3600  # 1 hour
    refresh_token_timeout_seconds: 86400  # 24 hours
    sso_session_idle_timeout_seconds: 1800  # 30 minutes
    sso_session_max_lifespan_seconds: 36000  # 10 hours
  
  # MFA Configuration
  mfa:
    enabled: true
    required_for_high_risk_operations: true
    supported_types:
      - "totp"  # Time-based One-Time Password
      - "sms"   # SMS OTP
      - "email" # Email OTP
    
    # Amount thresholds for MFA requirement
    amount_thresholds:
      NGN: 1000000  # ₦1M
      USD: 2000
      EUR: 1800
      GBP: 1500
  
  # User Attributes
  user_attributes:
    - name: "kyc_tier"
      type: "string"
      required: true
      default_value: "basic"
      allowed_values:
        - "basic"
        - "standard"
        - "enhanced"
        - "premium"
    
    - name: "mfa_enabled"
      type: "boolean"
      required: false
      default_value: "false"
    
    - name: "mfa_amount_threshold"
      type: "string"
      required: false
      default_value: "1000000"
    
    - name: "phone_number"
      type: "string"
      required: true
    
    - name: "country_code"
      type: "string"
      required: true
      default_value: "NG"
    
    - name: "date_of_birth"
      type: "string"
      required: false
    
    - name: "account_status"
      type: "string"
      required: true
      default_value: "active"
      allowed_values:
        - "active"
        - "suspended"
        - "closed"
        - "pending_verification"
  
  # Event Logging
  events:
    enabled: true
    save_login_events: true
    save_admin_events: true
    expiration_days: 90
    
    # Events to log
    event_types:
      - "LOGIN"
      - "LOGOUT"
      - "LOGIN_ERROR"
      - "REGISTER"
      - "UPDATE_PASSWORD"
      - "UPDATE_PROFILE"
      - "SEND_VERIFY_EMAIL"
      - "VERIFY_EMAIL"
      - "UPDATE_TOTP"
      - "REMOVE_TOTP"
      - "FEDERATED_IDENTITY_LINK"
      - "REMOVE_FEDERATED_IDENTITY"
  
  # Social Login Providers
  identity_providers:
    - provider_id: "google"
      alias: "google"
      enabled: true
      store_token: true
      trust_email: true
      config:
        client_id: "${GOOGLE_CLIENT_ID}"
        client_secret: "${GOOGLE_CLIENT_SECRET}"
        default_scope: "openid profile email"
    
    - provider_id: "facebook"
      alias: "facebook"
      enabled: true
      store_token: true
      trust_email: false
      config:
        client_id: "${FACEBOOK_APP_ID}"
        client_secret: "${FACEBOOK_APP_SECRET}"
        default_scope: "email public_profile"
    
    - provider_id: "apple"
      alias: "apple"
      enabled: true
      store_token: true
      trust_email: true
      config:
        client_id: "${APPLE_CLIENT_ID}"
        team_id: "${APPLE_TEAM_ID}"
        key_id: "${APPLE_KEY_ID}"
        private_key: "${APPLE_PRIVATE_KEY}"
  
  # Password Policy
  password_policy:
    minimum_length: 8
    require_uppercase: true
    require_lowercase: true
    require_digits: true
    require_special_characters: true
    not_username: true
    password_history: 3
    expire_days: 90
  
  # Email Configuration
  email:
    from: "noreply@remittance.ng"
    from_display_name: "Nigerian Remittance Platform"
    reply_to: "support@remittance.ng"
    smtp_server: "${SMTP_SERVER}"
    smtp_port: "${SMTP_PORT:587}"
    smtp_username: "${SMTP_USERNAME}"
    smtp_password: "${SMTP_PASSWORD}"
    smtp_ssl: true
    smtp_starttls: true
  
  # Themes
  themes:
    login_theme: "remittance-platform"
    account_theme: "remittance-platform"
    admin_theme: "keycloak"
    email_theme: "remittance-platform"
  
  # Security
  security:
    brute_force_detection:
      enabled: true
      permanent_lockout: false
      max_login_failures: 5
      wait_increment_seconds: 60
      quick_login_check_milliseconds: 1000
      minimum_quick_login_wait_seconds: 60
      max_failure_wait_seconds: 900
      failure_reset_time_seconds: 43200
    
    content_security_policy: "frame-src 'self'; frame-ancestors 'self'; object-src 'none';"
    x_frame_options: "SAMEORIGIN"
