# KYC Service Policies
# Controls access to KYC documents and verification data with fine-grained visibility

# Users can view their own KYC status
- id: kyc_view_own
  description: "Users can view their own KYC status and documents"
  subjects:
    roles: ["user"]
  actions: ["kyc:view", "kyc:status"]
  resources:
    type: "kyc_record"
  conditions:
    - type: owner_match
  effect: allow
  priority: 5
  redactions:
    - "verification_notes"
    - "risk_flags"
    - "internal_score"

# Users can submit KYC documents
- id: kyc_submit_own
  description: "Users can submit their own KYC documents"
  subjects:
    roles: ["user"]
  actions: ["kyc:submit", "kyc:upload"]
  resources:
    type: "kyc_record"
  conditions:
    - type: owner_match
  effect: allow
  priority: 5

# Support can view basic KYC info with redactions
- id: kyc_view_support_basic
  description: "Support can view basic KYC info with sensitive data redacted"
  subjects:
    roles: ["support"]
  actions: ["kyc:view", "kyc:status"]
  resources:
    type: "kyc_record"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 10
  redactions:
    - "id_document.number"
    - "id_document.image_url"
    - "address.full"
    - "bank_verification.account_number"
    - "bvn"
    - "nin"
    - "passport_number"
    - "drivers_license_number"

# Compliance can view full KYC records
- id: kyc_view_compliance_full
  description: "Compliance can view full KYC records without redaction"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["kyc:view", "kyc:status", "kyc:history"]
  resources:
    type: "kyc_record"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 20
  redactions: []

# Only compliance can approve/reject KYC
- id: kyc_approve_compliance
  description: "Only compliance can approve or reject KYC submissions"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["kyc:approve", "kyc:reject", "kyc:request_resubmission"]
  resources:
    type: "kyc_record"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 20

# Block support from approving KYC
- id: kyc_approve_deny_support
  description: "Support cannot approve KYC submissions"
  subjects:
    roles: ["support"]
  actions: ["kyc:approve", "kyc:reject"]
  resources:
    type: "kyc_record"
  effect: deny
  priority: 25

# Only compliance can upgrade KYC tier
- id: kyc_tier_upgrade_compliance
  description: "Only compliance can upgrade KYC tier"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["kyc:upgrade_tier"]
  resources:
    type: "kyc_record"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 20

# Only admin can downgrade KYC tier
- id: kyc_tier_downgrade_admin
  description: "Only admin can downgrade KYC tier"
  subjects:
    roles: ["admin"]
  actions: ["kyc:downgrade_tier"]
  resources:
    type: "kyc_record"
  effect: allow
  priority: 30

# Compliance can add risk flags
- id: kyc_risk_flag_compliance
  description: "Compliance can add risk flags to KYC records"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["kyc:add_risk_flag", "kyc:remove_risk_flag"]
  resources:
    type: "kyc_record"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 20

# Property KYC requires higher tier access
- id: kyc_property_view_compliance
  description: "Property KYC records require compliance access"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["kyc:view_property", "kyc:approve_property"]
  resources:
    type: "property_kyc"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 25

# Block support from viewing property KYC details
- id: kyc_property_deny_support
  description: "Support cannot view full property KYC details"
  subjects:
    roles: ["support"]
  actions: ["kyc:view_property"]
  resources:
    type: "property_kyc"
  effect: deny
  priority: 30

# Service-to-service KYC verification
- id: kyc_verify_service
  description: "Internal services can verify KYC status"
  subjects:
    roles: ["service"]
  actions: ["kyc:verify", "kyc:check_tier"]
  resources:
    type: "kyc_record"
  effect: allow
  priority: 50

# AML/Sanctions screening access
- id: kyc_aml_screening_compliance
  description: "Compliance can access AML screening results"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["kyc:view_aml_results", "kyc:trigger_aml_check"]
  resources:
    type: "kyc_record"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 25

# PEP (Politically Exposed Person) data access
- id: kyc_pep_data_compliance
  description: "Only compliance can view PEP screening data"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["kyc:view_pep_data"]
  resources:
    type: "kyc_record"
  effect: allow
  priority: 30

# Block non-compliance from PEP data
- id: kyc_pep_data_deny_others
  description: "Non-compliance staff cannot view PEP data"
  subjects:
    roles: ["support", "user"]
  actions: ["kyc:view_pep_data"]
  resources:
    type: "kyc_record"
  effect: deny
  priority: 35
