# Transaction Service Policies
# Controls transaction creation, approval, and viewing with context-aware authorization

# Users can create transactions within their KYC tier limits
- id: transaction_create_user
  description: "Users can create transactions"
  subjects:
    roles: ["user"]
  actions: ["transaction:create"]
  resources:
    type: "transaction"
  conditions:
    - type: owner_match
  effect: allow
  priority: 5

# Users can view their own transactions
- id: transaction_view_owner
  description: "Users can view their own transactions"
  subjects:
    roles: ["user"]
  actions: ["transaction:view", "transaction:list"]
  resources:
    type: "transaction"
  conditions:
    - type: owner_match
  effect: allow
  priority: 5
  redactions:
    - "internal_risk_score"
    - "compliance_flags"
    - "processing_notes"

# Support can view transactions with some redactions
- id: transaction_view_support
  description: "Support can view transactions with redacted sensitive data"
  subjects:
    roles: ["support"]
  actions: ["transaction:view", "transaction:list"]
  resources:
    type: "transaction"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 10
  redactions:
    - "sender.bank_account_full"
    - "beneficiary.bank_account_full"
    - "sender.id_number"

# Compliance can view all transaction details
- id: transaction_view_compliance
  description: "Compliance can view full transaction details"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["transaction:view", "transaction:list"]
  resources:
    type: "transaction"
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 20
  redactions: []

# High-value transactions require compliance approval
- id: transaction_approve_high_value
  description: "High-value transactions (>5M NGN) require compliance approval"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["transaction:approve"]
  resources:
    type: "transaction"
  conditions:
    - type: amount_gte
      value: 5000000
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 30
  required_approvals: ["compliance_manager"]

# Block support from approving high-value transactions
- id: transaction_approve_high_value_deny_support
  description: "Support cannot approve high-value transactions"
  subjects:
    roles: ["support"]
  actions: ["transaction:approve"]
  resources:
    type: "transaction"
  conditions:
    - type: amount_gte
      value: 5000000
  effect: deny
  priority: 35

# Medium-value transactions can be approved by support
- id: transaction_approve_medium_value
  description: "Support can approve medium-value transactions"
  subjects:
    roles: ["support", "compliance", "admin"]
  actions: ["transaction:approve"]
  resources:
    type: "transaction"
  conditions:
    - type: amount_between
      min: 100000
      max: 5000000
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 20

# Low-value transactions auto-approve (no manual approval needed)
- id: transaction_approve_low_value
  description: "Low-value transactions can be approved by any staff"
  subjects:
    roles: ["support", "compliance", "admin"]
  actions: ["transaction:approve"]
  resources:
    type: "transaction"
  conditions:
    - type: amount_lte
      value: 100000
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 15

# High-risk corridor transactions require compliance review
- id: transaction_high_risk_corridor
  description: "High-risk corridor transactions require compliance"
  subjects:
    roles: ["support"]
  actions: ["transaction:approve"]
  resources:
    type: "transaction"
  conditions:
    - type: corridor_in
      values: ["NG_RU", "NG_IR", "NG_KP", "NG_SY", "NG_VE"]
  effect: deny
  priority: 40

# Compliance can handle high-risk corridors
- id: transaction_high_risk_corridor_compliance
  description: "Compliance can approve high-risk corridor transactions"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["transaction:approve"]
  resources:
    type: "transaction"
  conditions:
    - type: corridor_in
      values: ["NG_RU", "NG_IR", "NG_KP", "NG_SY", "NG_VE"]
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 45
  required_approvals: ["compliance_officer", "aml_officer"]

# Only compliance can cancel completed transactions (refunds)
- id: transaction_cancel_completed
  description: "Only compliance can cancel completed transactions"
  subjects:
    roles: ["compliance", "admin"]
  actions: ["transaction:cancel", "transaction:refund"]
  resources:
    type: "transaction"
    statuses: ["completed"]
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 25

# Support can cancel pending transactions
- id: transaction_cancel_pending
  description: "Support can cancel pending transactions"
  subjects:
    roles: ["support", "compliance", "admin"]
  actions: ["transaction:cancel"]
  resources:
    type: "transaction"
    statuses: ["pending", "processing"]
  conditions:
    - type: tenant_match
      allow_null: true
  effect: allow
  priority: 20

# Users can cancel their own pending transactions
- id: transaction_cancel_own_pending
  description: "Users can cancel their own pending transactions"
  subjects:
    roles: ["user"]
  actions: ["transaction:cancel"]
  resources:
    type: "transaction"
    statuses: ["pending"]
  conditions:
    - type: owner_match
  effect: allow
  priority: 10

# Service-to-service can process transactions
- id: transaction_process_service
  description: "Internal services can process transactions"
  subjects:
    roles: ["service"]
  actions: ["transaction:process", "transaction:update_status"]
  resources:
    type: "transaction"
  effect: allow
  priority: 50
