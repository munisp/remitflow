version: '3.8'

services:
  # TigerBeetle Zig Primary Service
  tigerbeetle-zig-primary:
    build:
      context: ./zig-primary
      dockerfile: Dockerfile
    container_name: tigerbeetle-zig-primary
    ports:
      - "8030:8030"
      - "3001:3001"  # TigerBeetle Zig port
    environment:
      - DATABASE_URL=postgresql://banking_user:secure_banking_password@postgres:5432/remittance
      - REDIS_URL=redis://:redis_secure_password@redis:6379
      - TIGERBEETLE_DATA_FILE=/data/tigerbeetle_primary.tigerbeetle
      - TIGERBEETLE_PORT=3001
    volumes:
      - tigerbeetle_zig_data:/data
    depends_on:
      - postgres
      - redis
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # TigerBeetle Go Edge Service 1
  tigerbeetle-go-edge-1:
    build:
      context: ./go-edge
      dockerfile: Dockerfile
    container_name: tigerbeetle-go-edge-1
    ports:
      - "8031:8031"
    environment:
      - SQLITE_DB_PATH=/data/tigerbeetle_edge_1.db
      - REDIS_URL=redis://:redis_secure_password@redis:6379
      - ZIG_PRIMARY_URL=http://tigerbeetle-zig-primary:8030
      - EDGE_ID=edge-1
      - PORT=8031
    volumes:
      - tigerbeetle_edge_1_data:/data
    depends_on:
      - tigerbeetle-zig-primary
      - redis
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8031/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # TigerBeetle Go Edge Service 2
  tigerbeetle-go-edge-2:
    build:
      context: ./go-edge
      dockerfile: Dockerfile
    container_name: tigerbeetle-go-edge-2
    ports:
      - "8033:8031"
    environment:
      - SQLITE_DB_PATH=/data/tigerbeetle_edge_2.db
      - REDIS_URL=redis://:redis_secure_password@redis:6379
      - ZIG_PRIMARY_URL=http://tigerbeetle-zig-primary:8030
      - EDGE_ID=edge-2
      - PORT=8031
    volumes:
      - tigerbeetle_edge_2_data:/data
    depends_on:
      - tigerbeetle-zig-primary
      - redis
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8031/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # TigerBeetle Sync Manager
  tigerbeetle-sync-manager:
    build:
      context: ./sync-manager
      dockerfile: Dockerfile
    container_name: tigerbeetle-sync-manager
    ports:
      - "8032:8032"
    environment:
      - DATABASE_URL=postgresql://banking_user:secure_banking_password@postgres:5432/remittance
      - REDIS_URL=redis://:redis_secure_password@redis:6379
      - SYNC_INTERVAL=5
      - HEARTBEAT_INTERVAL=30
      - MAX_RETRY_ATTEMPTS=3
    depends_on:
      - postgres
      - redis
      - tigerbeetle-zig-primary
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8032/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tigerbeetle-postgres
    environment:
      - POSTGRES_DB=remittance
      - POSTGRES_USER=banking_user
      - POSTGRES_PASSWORD=secure_banking_password
    volumes:
      - tigerbeetle_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d remittance"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tigerbeetle-redis
    command: redis-server --requirepass redis_secure_password --appendonly yes
    volumes:
      - tigerbeetle_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TigerBeetle Management Dashboard
  tigerbeetle-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: tigerbeetle-dashboard
    ports:
      - "8034:80"
    environment:
      - REACT_APP_ZIG_PRIMARY_URL=http://localhost:8030
      - REACT_APP_SYNC_MANAGER_URL=http://localhost:8032
      - REACT_APP_EDGE_1_URL=http://localhost:8031
      - REACT_APP_EDGE_2_URL=http://localhost:8033
    depends_on:
      - tigerbeetle-zig-primary
      - tigerbeetle-sync-manager
      - tigerbeetle-go-edge-1
      - tigerbeetle-go-edge-2
    networks:
      - tigerbeetle-network
    restart: unless-stopped

  # Nginx Load Balancer for Edge Services
  tigerbeetle-nginx:
    image: nginx:alpine
    container_name: tigerbeetle-nginx
    ports:
      - "8035:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - tigerbeetle-go-edge-1
      - tigerbeetle-go-edge-2
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  tigerbeetle_zig_data:
    driver: local
  tigerbeetle_edge_1_data:
    driver: local
  tigerbeetle_edge_2_data:
    driver: local
  tigerbeetle_postgres_data:
    driver: local
  tigerbeetle_redis_data:
    driver: local

networks:
  tigerbeetle-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
