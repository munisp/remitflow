name: nigerian_remittance_flutter
description: Nigerian Remittance Platform - Flutter Mobile App with CDP Integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Coinbase Wallet SDK for CDP integration
  coinbase_wallet_sdk: ^1.0.0

  # HTTP client
  http: ^1.1.0

  # Local storage
  shared_preferences: ^2.2.0

  # Navigation
  go_router: ^13.0.0

  # State management
  provider: ^6.1.0

  # UI components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  # assets:
  #   - images/
  #   - fonts/

