---
# Tiered Storage Strategy for Cost Optimization
# Implements hot/warm/cold storage tiers with automatic lifecycle management

# Storage Classes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hot-storage
  labels:
    tier: hot
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: warm-storage
  labels:
    tier: warm
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  iops: "1000"
  throughput: "125"
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cold-storage
  labels:
    tier: cold
provisioner: kubernetes.io/aws-ebs
parameters:
  type: sc1
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

---
# MinIO Configuration for Object Storage
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-tiering-config
  namespace: storage
data:
  tiering-policy.json: |
    {
      "Version": "2012-10-17",
      "Rules": [
        {
          "ID": "TransactionDataLifecycle",
          "Status": "Enabled",
          "Filter": {
            "Prefix": "transactions/"
          },
          "Transitions": [
            {
              "Days": 30,
              "StorageClass": "WARM"
            },
            {
              "Days": 90,
              "StorageClass": "COLD"
            }
          ],
          "Expiration": {
            "Days": 2555
          }
        },
        {
          "ID": "AuditLogsLifecycle",
          "Status": "Enabled",
          "Filter": {
            "Prefix": "audit-logs/"
          },
          "Transitions": [
            {
              "Days": 7,
              "StorageClass": "WARM"
            },
            {
              "Days": 30,
              "StorageClass": "COLD"
            }
          ],
          "Expiration": {
            "Days": 2555
          }
        },
        {
          "ID": "AnalyticsDataLifecycle",
          "Status": "Enabled",
          "Filter": {
            "Prefix": "analytics/"
          },
          "Transitions": [
            {
              "Days": 7,
              "StorageClass": "WARM"
            },
            {
              "Days": 30,
              "StorageClass": "COLD"
            }
          ],
          "Expiration": {
            "Days": 365
          }
        },
        {
          "ID": "KYCDocumentsLifecycle",
          "Status": "Enabled",
          "Filter": {
            "Prefix": "kyc-documents/"
          },
          "Transitions": [
            {
              "Days": 90,
              "StorageClass": "WARM"
            },
            {
              "Days": 365,
              "StorageClass": "COLD"
            }
          ],
          "Expiration": {
            "Days": 2555
          }
        },
        {
          "ID": "TempFilesCleanup",
          "Status": "Enabled",
          "Filter": {
            "Prefix": "temp/"
          },
          "Expiration": {
            "Days": 1
          }
        }
      ]
    }

---
# Lakehouse Tiered Storage Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: lakehouse-storage-config
  namespace: analytics
data:
  iceberg-catalog.yaml: |
    catalog:
      name: remittance
      type: rest
      uri: http://iceberg-rest:8181
      warehouse: s3://remittance-lakehouse/warehouse
      
    storage:
      tiers:
        hot:
          location: s3://remittance-lakehouse/hot/
          retention_days: 7
          compaction_interval: 1h
          
        warm:
          location: s3://remittance-lakehouse/warm/
          retention_days: 90
          compaction_interval: 24h
          
        cold:
          location: s3://remittance-lakehouse/cold/
          retention_days: 2555
          compaction_interval: 168h
          
    lifecycle:
      rules:
        - name: transactions_tiering
          table_pattern: "*.transactions*"
          hot_to_warm_days: 7
          warm_to_cold_days: 90
          
        - name: audit_tiering
          table_pattern: "*.audit*"
          hot_to_warm_days: 7
          warm_to_cold_days: 30
          
        - name: analytics_tiering
          table_pattern: "*.analytics*"
          hot_to_warm_days: 3
          warm_to_cold_days: 30
          
    compaction:
      target_file_size_mb: 128
      min_input_files: 5
      max_concurrent_jobs: 4

  trino-catalog.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://iceberg-rest:8181
    iceberg.rest-catalog.warehouse=s3://remittance-lakehouse/warehouse
    
    # Storage tiering
    iceberg.file-format=PARQUET
    iceberg.compression-codec=ZSTD
    
    # Performance tuning
    iceberg.split-size=128MB
    iceberg.max-partitions-per-writer=100

---
# PostgreSQL Partitioning for Time-Series Data
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-partitioning-config
  namespace: postgres
data:
  partitioning.sql: |
    -- Enable pg_partman extension
    CREATE EXTENSION IF NOT EXISTS pg_partman;
    
    -- Transactions table with time-based partitioning
    CREATE TABLE IF NOT EXISTS transactions (
        transaction_id UUID PRIMARY KEY,
        agent_id UUID NOT NULL,
        customer_id UUID,
        transaction_type VARCHAR(50) NOT NULL,
        amount DECIMAL(18,2) NOT NULL,
        currency VARCHAR(3) DEFAULT 'KES',
        status VARCHAR(20) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    ) PARTITION BY RANGE (created_at);
    
    -- Create partitions for transactions (monthly)
    SELECT partman.create_parent(
        p_parent_table := 'public.transactions',
        p_control := 'created_at',
        p_type := 'native',
        p_interval := 'monthly',
        p_premake := 3
    );
    
    -- Audit logs table with time-based partitioning
    CREATE TABLE IF NOT EXISTS audit_logs (
        log_id UUID PRIMARY KEY,
        event_type VARCHAR(100) NOT NULL,
        actor_id UUID,
        resource_type VARCHAR(100),
        resource_id UUID,
        action VARCHAR(50) NOT NULL,
        details JSONB,
        ip_address INET,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    ) PARTITION BY RANGE (created_at);
    
    -- Create partitions for audit logs (weekly)
    SELECT partman.create_parent(
        p_parent_table := 'public.audit_logs',
        p_control := 'created_at',
        p_type := 'native',
        p_interval := 'weekly',
        p_premake := 4
    );
    
    -- Configure retention policies
    UPDATE partman.part_config
    SET retention = '7 years', retention_keep_table = false
    WHERE parent_table = 'public.transactions';
    
    UPDATE partman.part_config
    SET retention = '7 years', retention_keep_table = false
    WHERE parent_table = 'public.audit_logs';
    
    -- Create maintenance job
    SELECT cron.schedule('partition-maintenance', '0 3 * * *', 
        $$SELECT partman.run_maintenance()$$);

  archival.sql: |
    -- Archive old partitions to cold storage
    CREATE OR REPLACE FUNCTION archive_old_partitions(
        p_table_name TEXT,
        p_days_old INTEGER DEFAULT 90
    ) RETURNS INTEGER AS $$
    DECLARE
        v_partition_name TEXT;
        v_count INTEGER := 0;
    BEGIN
        FOR v_partition_name IN
            SELECT partition_name
            FROM partman.show_partitions(p_table_name)
            WHERE partition_name < (NOW() - (p_days_old || ' days')::INTERVAL)::DATE::TEXT
        LOOP
            -- Export partition to S3
            EXECUTE format(
                'COPY %I TO PROGRAM ''aws s3 cp - s3://remittance-archive/%s/%s.csv.gz --content-encoding gzip''
                WITH (FORMAT CSV, HEADER)',
                v_partition_name,
                p_table_name,
                v_partition_name
            );
            
            -- Drop partition after successful export
            EXECUTE format('DROP TABLE IF EXISTS %I', v_partition_name);
            
            v_count := v_count + 1;
        END LOOP;
        
        RETURN v_count;
    END;
    $$ LANGUAGE plpgsql;

---
# Redis Tiered Memory Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-memory-config
  namespace: redis
data:
  redis.conf: |
    # Memory management
    maxmemory 4gb
    maxmemory-policy allkeys-lru
    
    # Active defragmentation
    activedefrag yes
    active-defrag-ignore-bytes 100mb
    active-defrag-threshold-lower 10
    active-defrag-threshold-upper 100
    
    # Memory sampling
    maxmemory-samples 10
    
    # Lazy freeing
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
    
    # RDB persistence (for cold data recovery)
    save 900 1
    save 300 10
    save 60 10000
    
    # AOF persistence
    appendonly yes
    appendfsync everysec
    
    # Key expiration policies
    # Hot data: 1 hour
    # Warm data: 24 hours
    # Cold data: 7 days

  tiering-policy.lua: |
    -- Redis tiering policy script
    -- Moves data between memory tiers based on access patterns
    
    local function get_key_age(key)
        local idle = redis.call('OBJECT', 'IDLETIME', key)
        return idle or 0
    end
    
    local function tier_key(key)
        local idle = get_key_age(key)
        local ttl = redis.call('TTL', key)
        
        -- Hot tier: accessed within 1 hour
        if idle < 3600 then
            return 'hot'
        -- Warm tier: accessed within 24 hours
        elseif idle < 86400 then
            return 'warm'
        -- Cold tier: not accessed in 24+ hours
        else
            return 'cold'
        end
    end
    
    local function apply_tiering_policy(key)
        local tier = tier_key(key)
        local current_ttl = redis.call('TTL', key)
        
        if tier == 'cold' and current_ttl == -1 then
            -- Set expiration for cold data (7 days)
            redis.call('EXPIRE', key, 604800)
        elseif tier == 'warm' and current_ttl == -1 then
            -- Set expiration for warm data (24 hours)
            redis.call('EXPIRE', key, 86400)
        end
        
        return tier
    end
    
    return apply_tiering_policy(KEYS[1])

---
# Kafka Log Retention Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-retention-config
  namespace: kafka
data:
  server.properties: |
    # Log retention settings
    log.retention.hours=168
    log.retention.bytes=10737418240
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    
    # Compaction settings
    log.cleanup.policy=delete,compact
    log.cleaner.enable=true
    log.cleaner.threads=2
    log.cleaner.dedupe.buffer.size=134217728
    log.cleaner.io.buffer.size=524288
    log.cleaner.io.max.bytes.per.second=1.7976931348623157E308
    log.cleaner.backoff.ms=15000
    log.cleaner.min.cleanable.ratio=0.5
    log.cleaner.delete.retention.ms=86400000
    
    # Tiered storage (Kafka 3.0+)
    remote.log.storage.system.enable=true
    remote.log.storage.manager.class.name=org.apache.kafka.server.log.remote.storage.RemoteLogManagerConfig
    remote.log.storage.manager.impl.prefix=rsm.config.
    rsm.config.s3.bucket.name=remittance-kafka-tiered
    rsm.config.s3.region=us-east-1
    
    # Topic-specific retention
    # transactions: 7 days hot, then tiered
    # audit-logs: 30 days hot, then tiered
    # analytics: 3 days hot, then tiered

  topic-configs.sh: |
    #!/bin/bash
    
    # Configure topic retention policies
    
    # Transactions topic - 7 days retention
    kafka-configs.sh --bootstrap-server kafka:9092 \
      --alter --entity-type topics --entity-name transactions \
      --add-config retention.ms=604800000,segment.ms=86400000
    
    # Audit logs topic - 30 days retention
    kafka-configs.sh --bootstrap-server kafka:9092 \
      --alter --entity-type topics --entity-name audit-logs \
      --add-config retention.ms=2592000000,segment.ms=86400000
    
    # Analytics topic - 3 days retention
    kafka-configs.sh --bootstrap-server kafka:9092 \
      --alter --entity-type topics --entity-name analytics \
      --add-config retention.ms=259200000,segment.ms=86400000
    
    # Notifications topic - 1 day retention
    kafka-configs.sh --bootstrap-server kafka:9092 \
      --alter --entity-type topics --entity-name notifications \
      --add-config retention.ms=86400000,segment.ms=3600000

---
# Storage Cost Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-monitoring-config
  namespace: monitoring
data:
  prometheus-rules.yaml: |
    groups:
      - name: storage_cost_alerts
        rules:
          - alert: HighStorageCost
            expr: sum(storage_cost_usd) > 1000
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Storage cost exceeds $1000/month"
              description: "Current storage cost is {{ $value }} USD"
          
          - alert: HotStorageOverutilized
            expr: (storage_hot_used_bytes / storage_hot_total_bytes) > 0.8
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Hot storage tier is over 80% utilized"
          
          - alert: DataNotTiering
            expr: increase(storage_tiering_operations_total[24h]) == 0
            for: 24h
            labels:
              severity: warning
            annotations:
              summary: "No data tiering operations in 24 hours"
          
          - alert: PartitionMaintenanceFailed
            expr: pg_partman_maintenance_last_run_success == 0
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL partition maintenance failed"

  grafana-dashboard.json: |
    {
      "title": "Storage Tiering Dashboard",
      "panels": [
        {
          "title": "Storage by Tier",
          "type": "piechart",
          "targets": [
            {"expr": "storage_hot_used_bytes", "legendFormat": "Hot"},
            {"expr": "storage_warm_used_bytes", "legendFormat": "Warm"},
            {"expr": "storage_cold_used_bytes", "legendFormat": "Cold"}
          ]
        },
        {
          "title": "Tiering Operations",
          "type": "graph",
          "targets": [
            {"expr": "rate(storage_tiering_operations_total[1h])", "legendFormat": "Operations/hour"}
          ]
        },
        {
          "title": "Storage Cost Trend",
          "type": "graph",
          "targets": [
            {"expr": "storage_cost_usd", "legendFormat": "Monthly Cost (USD)"}
          ]
        },
        {
          "title": "Data Age Distribution",
          "type": "heatmap",
          "targets": [
            {"expr": "storage_data_age_days_bucket", "legendFormat": "{{le}} days"}
          ]
        }
      ]
    }
