# Temporal 5/5 Bank-Grade Cluster Configuration
# High Availability, Performance, Security, Observability, Disaster Recovery
apiVersion: v1
kind: Namespace
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow
---
# Temporal Server Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal
data:
  config.yaml: |
    log:
      stdout: true
      level: info
    
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            pluginName: postgres
            databaseName: temporal
            connectAddr: "${POSTGRES_HOST}:5432"
            connectProtocol: tcp
            user: "${POSTGRES_USER}"
            password: "${POSTGRES_PASSWORD}"
            maxConns: 50
            maxIdleConns: 10
            maxConnLifetime: "1h"
            tls:
              enabled: true
              caFile: /certs/ca.crt
              certFile: /certs/client.crt
              keyFile: /certs/client.key
        visibility:
          sql:
            pluginName: postgres
            databaseName: temporal_visibility
            connectAddr: "${POSTGRES_HOST}:5432"
            connectProtocol: tcp
            user: "${POSTGRES_USER}"
            password: "${POSTGRES_PASSWORD}"
            maxConns: 50
            maxIdleConns: 10
            maxConnLifetime: "1h"
            tls:
              enabled: true
              caFile: /certs/ca.crt
              certFile: /certs/client.crt
              keyFile: /certs/client.key
    
    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: "${POD_IP}"
      tls:
        internode:
          server:
            certFile: /certs/server.crt
            keyFile: /certs/server.key
            requireClientAuth: true
            clientCaFiles:
              - /certs/ca.crt
          client:
            serverName: temporal
            rootCaFiles:
              - /certs/ca.crt
        frontend:
          server:
            certFile: /certs/server.crt
            keyFile: /certs/server.key
            requireClientAuth: true
            clientCaFiles:
              - /certs/ca.crt
      metrics:
        prometheus:
          timerType: histogram
          listenAddress: "0.0.0.0:9090"
    
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
    
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          rpcAddress: "temporal-frontend:7233"
    
    dcRedirectionPolicy:
      policy: "noop"
    
    archival:
      history:
        state: "enabled"
        enableRead: true
        provider:
          s3store:
            region: "${AWS_REGION}"
      visibility:
        state: "enabled"
        enableRead: true
        provider:
          s3store:
            region: "${AWS_REGION}"
    
    namespaceDefaults:
      archival:
        history:
          state: "enabled"
          URI: "s3://temporal-archival/history"
        visibility:
          state: "enabled"
          URI: "s3://temporal-archival/visibility"
---
# Temporal Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: temporal
  labels:
    app: temporal
    component: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal
      component: frontend
  template:
    metadata:
      labels:
        app: temporal
        component: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: temporal
                    component: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: temporalio/server:1.22.0
          args:
            - start
            - --service=frontend
          ports:
            - containerPort: 7233
              name: grpc
            - containerPort: 6933
              name: membership
            - containerPort: 9090
              name: metrics
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICES
              value: frontend
          envFrom:
            - secretRef:
                name: temporal-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            grpc:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 7233
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: temporal-config
        - name: certs
          secret:
            secretName: temporal-tls
---
