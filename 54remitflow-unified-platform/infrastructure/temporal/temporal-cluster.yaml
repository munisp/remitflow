---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
spec:
  type: ClusterIP
  selector:
    app: temporal
    component: frontend
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: metrics
      port: 9090
      targetPort: 9090
---
# History Service
apiVersion: v1
kind: Service
metadata:
  name: temporal-history
  namespace: temporal
spec:
  type: ClusterIP
  selector:
    app: temporal
    component: history
  ports:
    - name: grpc
      port: 7234
      targetPort: 7234
---
# Matching Service
apiVersion: v1
kind: Service
metadata:
  name: temporal-matching
  namespace: temporal
spec:
  type: ClusterIP
  selector:
    app: temporal
    component: matching
  ports:
    - name: grpc
      port: 7235
      targetPort: 7235
---
# Worker Service
apiVersion: v1
kind: Service
metadata:
  name: temporal-worker
  namespace: temporal
spec:
  type: ClusterIP
  selector:
    app: temporal
    component: worker
  ports:
    - name: grpc
      port: 7239
      targetPort: 7239
---
# Pod Disruption Budgets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-frontend-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-history-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: history
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-matching-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: matching
---
# HPA for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: temporal-frontend-hpa
  namespace: temporal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: temporal-frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-network-policy
  namespace: temporal
spec:
  podSelector:
    matchLabels:
      app: temporal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              temporal-access: "true"
        - podSelector:
            matchLabels:
              app: temporal
      ports:
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 7234
        - protocol: TCP
          port: 7235
        - protocol: TCP
          port: 7239
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: temporal
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# Prometheus ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: temporal
  namespace: temporal
  labels:
    app: temporal
spec:
  selector:
    matchLabels:
      app: temporal
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
# Temporal Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: temporal-alerts
  namespace: temporal
spec:
  groups:
    - name: temporal
      rules:
        - alert: TemporalWorkflowFailureRateHigh
          expr: rate(temporal_workflow_failed_total[5m]) / rate(temporal_workflow_completed_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Temporal workflow failure rate is high"
            description: "Workflow failure rate is {{ $value | humanizePercentage }}"
        - alert: TemporalTaskQueueBacklogHigh
          expr: temporal_task_queue_backlog > 1000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Temporal task queue backlog is high"
            description: "Task queue {{ $labels.task_queue }} has {{ $value }} pending tasks"
        - alert: TemporalServiceDown
          expr: up{job="temporal"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Temporal service is down"
            description: "Temporal {{ $labels.component }} is not responding"
