# Dapr Pub/Sub Subscriptions for Previously Orphan Services
# This file wires orphan services into the main event bus

apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: commission-events-subscription
spec:
  pubsubname: kafka-pubsub
  topic: commission.events
  route: /api/v1/events/commission
  scopes:
    - commission-service
    - settlement-service
    - reporting-service

