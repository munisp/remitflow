apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mojaloop-statestore
  namespace: mojaloop
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: redis-password
    - name: actorStateStore
      value: "true"
    - name: keyPrefix
      value: "mojaloop"
    - name: enableTLS
      value: "false"
    - name: failover
      value: "true"
    - name: sentinelMasterName
      value: "mymaster"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mojaloop-transfer-cache
  namespace: mojaloop
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: redis-password
    - name: keyPrefix
      value: "mojaloop:transfers"
    - name: ttlInSeconds
      value: "3600"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mojaloop-position-cache
  namespace: mojaloop
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: redis-password
    - name: keyPrefix
      value: "mojaloop:positions"
    - name: ttlInSeconds
      value: "60"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mojaloop-idempotency-store
  namespace: mojaloop
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: redis-password
    - name: keyPrefix
