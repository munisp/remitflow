heat_template_version: 2021-04-16

description: >
  Remittance Platform OpenStack Infrastructure Template
  This template creates the complete cloud infrastructure for the Remittance Platform platform
  including compute instances, networking, storage, and security groups.

parameters:
  key_name:
    type: string
    description: Name of keypair to assign to servers
    default: remittance-key
  
  image:
    type: string
    description: Name of image to use for servers
    default: ubuntu-22.04-lts
  
  flavor_master:
    type: string
    description: Flavor to use for Kubernetes master nodes
    default: m1.xlarge
  
  flavor_worker:
    type: string
    description: Flavor to use for Kubernetes worker nodes
    default: m1.large
  
  flavor_database:
    type: string
    description: Flavor to use for database nodes
    default: m1.xlarge
  
  public_net:
    type: string
    description: ID or name of public network for which floating IP addresses will be allocated
    default: public
  
  dns_nameservers:
    type: comma_delimited_list
    description: DNS nameservers for the subnet
    default: ["8.8.8.8", "8.8.4.4"]

resources:
  # Network Infrastructure
  private_net:
    type: OS::Neutron::Net
    properties:
      name: remittance-private-net
      admin_state_up: true

  private_subnet:
    type: OS::Neutron::Subnet
    properties:
      name: remittance-private-subnet
      network_id: { get_resource: private_net }
      cidr: 10.0.0.0/24
      gateway_ip: 10.0.0.1
      dns_nameservers: { get_param: dns_nameservers }
      allocation_pools:
        - start: 10.0.0.10
          end: 10.0.0.250

  router:
    type: OS::Neutron::Router
    properties:
      name: remittance-router
      external_gateway_info:
        network: { get_param: public_net }

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: private_subnet }

  # Security Groups
  master_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: remittance-master-sg
      description: Security group for Kubernetes master nodes
      rules:
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 6443
          port_range_max: 6443
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 2379
          port_range_max: 2380
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 10250
          port_range_max: 10252
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 443
          port_range_max: 443

  worker_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: remittance-worker-sg
      description: Security group for Kubernetes worker nodes
      rules:
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 10250
          port_range_max: 10250
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 30000
          port_range_max: 32767
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 443
          port_range_max: 443

  database_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: remittance-database-sg
      description: Security group for database nodes
      rules:
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 5432
          port_range_max: 5432
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 6379
          port_range_max: 6379
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 9092
          port_range_max: 9092

  # Storage Volumes
  master_volume_1:
    type: OS::Cinder::Volume
    properties:
      name: remittance-master-1-volume
      size: 100
      volume_type: ssd

  master_volume_2:
    type: OS::Cinder::Volume
    properties:
      name: remittance-master-2-volume
      size: 100
      volume_type: ssd

  master_volume_3:
    type: OS::Cinder::Volume
    properties:
      name: remittance-master-3-volume
      size: 100
      volume_type: ssd

  worker_volume_1:
    type: OS::Cinder::Volume
    properties:
      name: remittance-worker-1-volume
      size: 200
      volume_type: ssd

  worker_volume_2:
    type: OS::Cinder::Volume
    properties:
      name: remittance-worker-2-volume
      size: 200
      volume_type: ssd

  worker_volume_3:
    type: OS::Cinder::Volume
    properties:
      name: remittance-worker-3-volume
      size: 200
      volume_type: ssd

  database_volume_1:
    type: OS::Cinder::Volume
    properties:
      name: remittance-database-1-volume
      size: 500
      volume_type: high-iops

  database_volume_2:
    type: OS::Cinder::Volume
    properties:
      name: remittance-database-2-volume
      size: 500
      volume_type: high-iops

  # Kubernetes Master Nodes
  master_node_1:
    type: OS::Nova::Server
    properties:
      name: remittance-master-1
      image: { get_param: image }
      flavor: { get_param: flavor_master }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: master_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y docker.io kubelet kubeadm kubectl
        systemctl enable docker
        systemctl start docker
        systemctl enable kubelet
        
        # Configure Docker daemon
        cat > /etc/docker/daemon.json <<EOF
        {
          "exec-opts": ["native.cgroupdriver=systemd"],
          "log-driver": "json-file",
          "log-opts": {
            "max-size": "100m"
          },
          "storage-driver": "overlay2"
        }
        EOF
        
        systemctl restart docker
        
        # Disable swap
        swapoff -a
        sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
        
        # Configure kernel modules
        cat > /etc/modules-load.d/k8s.conf <<EOF
        br_netfilter
        EOF
        
        cat > /etc/sysctl.d/k8s.conf <<EOF
        net.bridge.bridge-nf-call-ip6tables = 1
        net.bridge.bridge-nf-call-iptables = 1
        EOF
        sysctl --system

  master_node_2:
    type: OS::Nova::Server
    properties:
      name: remittance-master-2
      image: { get_param: image }
      flavor: { get_param: flavor_master }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: master_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y docker.io kubelet kubeadm kubectl
        systemctl enable docker
        systemctl start docker
        systemctl enable kubelet

  master_node_3:
    type: OS::Nova::Server
    properties:
      name: remittance-master-3
      image: { get_param: image }
      flavor: { get_param: flavor_master }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: master_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y docker.io kubelet kubeadm kubectl
        systemctl enable docker
        systemctl start docker
        systemctl enable kubelet

  # Kubernetes Worker Nodes
  worker_node_1:
    type: OS::Nova::Server
    properties:
      name: remittance-worker-1
      image: { get_param: image }
      flavor: { get_param: flavor_worker }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: worker_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y docker.io kubelet kubeadm kubectl
        systemctl enable docker
        systemctl start docker
        systemctl enable kubelet

  worker_node_2:
    type: OS::Nova::Server
    properties:
      name: remittance-worker-2
      image: { get_param: image }
      flavor: { get_param: flavor_worker }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: worker_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y docker.io kubelet kubeadm kubectl
        systemctl enable docker
        systemctl start docker
        systemctl enable kubelet

  worker_node_3:
    type: OS::Nova::Server
    properties:
      name: remittance-worker-3
      image: { get_param: image }
      flavor: { get_param: flavor_worker }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: worker_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y docker.io kubelet kubeadm kubectl
        systemctl enable docker
        systemctl start docker
        systemctl enable kubelet

  # Database Nodes
  database_node_1:
    type: OS::Nova::Server
    properties:
      name: remittance-database-1
      image: { get_param: image }
      flavor: { get_param: flavor_database }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: database_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y postgresql-14 redis-server
        systemctl enable postgresql
        systemctl enable redis-server

  database_node_2:
    type: OS::Nova::Server
    properties:
      name: remittance-database-2
      image: { get_param: image }
      flavor: { get_param: flavor_database }
      key_name: { get_param: key_name }
      networks:
        - network: { get_resource: private_net }
      security_groups:
        - { get_resource: database_security_group }
      user_data_format: RAW
      user_data: |
        #!/bin/bash
        apt-get update
        apt-get install -y postgresql-14 redis-server
        systemctl enable postgresql
        systemctl enable redis-server

  # Volume Attachments
  master_volume_attachment_1:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: master_volume_1 }
      instance_uuid: { get_resource: master_node_1 }
      mountpoint: /dev/vdb

  master_volume_attachment_2:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: master_volume_2 }
      instance_uuid: { get_resource: master_node_2 }
      mountpoint: /dev/vdb

  master_volume_attachment_3:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: master_volume_3 }
      instance_uuid: { get_resource: master_node_3 }
      mountpoint: /dev/vdb

  worker_volume_attachment_1:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: worker_volume_1 }
      instance_uuid: { get_resource: worker_node_1 }
      mountpoint: /dev/vdb

  worker_volume_attachment_2:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: worker_volume_2 }
      instance_uuid: { get_resource: worker_node_2 }
      mountpoint: /dev/vdb

  worker_volume_attachment_3:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: worker_volume_3 }
      instance_uuid: { get_resource: worker_node_3 }
      mountpoint: /dev/vdb

  database_volume_attachment_1:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: database_volume_1 }
      instance_uuid: { get_resource: database_node_1 }
      mountpoint: /dev/vdb

  database_volume_attachment_2:
    type: OS::Cinder::VolumeAttachment
    properties:
      volume_id: { get_resource: database_volume_2 }
      instance_uuid: { get_resource: database_node_2 }
      mountpoint: /dev/vdb

  # Floating IPs
  master_floating_ip_1:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: public_net }
      port_id: { get_attr: [master_node_1, addresses, { get_resource: private_net }, 0, port] }

  master_floating_ip_2:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: public_net }
      port_id: { get_attr: [master_node_2, addresses, { get_resource: private_net }, 0, port] }

  master_floating_ip_3:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: public_net }
      port_id: { get_attr: [master_node_3, addresses, { get_resource: private_net }, 0, port] }

  # Load Balancer for API Gateway
  api_gateway_pool:
    type: OS::Neutron::LBaaS::Pool
    properties:
      name: remittance-api-pool
      protocol: HTTP
      lb_algorithm: ROUND_ROBIN
      subnet: { get_resource: private_subnet }

  api_gateway_listener:
    type: OS::Neutron::LBaaS::Listener
    properties:
      name: remittance-api-listener
      protocol: HTTP
      protocol_port: 80
      loadbalancer: { get_resource: api_gateway_loadbalancer }
      default_pool: { get_resource: api_gateway_pool }

  api_gateway_loadbalancer:
    type: OS::Neutron::LBaaS::LoadBalancer
    properties:
      name: remittance-api-lb
      vip_subnet: { get_resource: private_subnet }

  api_gateway_floating_ip:
    type: OS::Neutron::FloatingIP
    properties:
      floating_network: { get_param: public_net }
      port_id: { get_attr: [api_gateway_loadbalancer, vip_port_id] }

outputs:
  master_node_1_ip:
    description: IP address of master node 1
    value: { get_attr: [master_floating_ip_1, floating_ip_address] }

  master_node_2_ip:
    description: IP address of master node 2
    value: { get_attr: [master_floating_ip_2, floating_ip_address] }

  master_node_3_ip:
    description: IP address of master node 3
    value: { get_attr: [master_floating_ip_3, floating_ip_address] }

  api_gateway_ip:
    description: IP address of API Gateway load balancer
    value: { get_attr: [api_gateway_floating_ip, floating_ip_address] }

  private_network_id:
    description: ID of the private network
    value: { get_resource: private_net }

  private_subnet_id:
    description: ID of the private subnet
    value: { get_resource: private_subnet }

