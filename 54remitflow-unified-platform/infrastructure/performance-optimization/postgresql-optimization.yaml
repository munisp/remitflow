# PostgreSQL Performance Optimization Configuration
# Optimized for Nigerian Banking Workloads and High-Volume Transactions

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-performance-config
  namespace: remittance
  labels:
    app: postgresql
    component: performance-optimization
data:
  postgresql.conf: |
    # PostgreSQL Performance Configuration for Remittance Platform
    # Optimized for high-volume banking transactions and Nigerian network conditions
    
    # Connection Settings
    max_connections = 500
    superuser_reserved_connections = 5
    
    # Memory Configuration (optimized for 8GB RAM nodes)
    shared_buffers = 2GB
    effective_cache_size = 6GB
    work_mem = 32MB
    maintenance_work_mem = 512MB
    
    # WAL Configuration for High Availability
    wal_level = replica
    max_wal_size = 4GB
    min_wal_size = 1GB
    wal_compression = on
    wal_buffers = 64MB
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 15min
    
    # Query Planner Configuration
    random_page_cost = 1.1
    effective_io_concurrency = 200
    
    # Logging Configuration for Banking Compliance
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_min_duration_statement = 1000
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 0
    log_error_verbosity = default
    
    # Autovacuum Configuration for Banking Data
    autovacuum = on
    autovacuum_max_workers = 6
    autovacuum_naptime = 30s
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    autovacuum_freeze_max_age = 200000000
    autovacuum_multixact_freeze_max_age = 400000000
    autovacuum_vacuum_cost_delay = 10ms
    autovacuum_vacuum_cost_limit = 1000
    
    # Background Writer Configuration
    bgwriter_delay = 200ms
    bgwriter_lru_maxpages = 100
    bgwriter_lru_multiplier = 2.0
    
    # Async Commit for Performance (with careful consideration for banking)
    synchronous_commit = on  # Keep synchronous for banking data integrity
    commit_delay = 0
    commit_siblings = 5
    
    # Lock Management
    max_locks_per_transaction = 256
    max_pred_locks_per_transaction = 256
    
    # Parallel Query Configuration
    max_worker_processes = 16
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 4
    
    # Statistics Configuration
    track_activities = on
    track_counts = on
    track_io_timing = on
    track_functions = all
    stats_temp_directory = 'pg_stat_tmp'
    
    # Nigerian Banking Specific Optimizations
    # Timezone for Nigerian operations
    timezone = 'Africa/Lagos'
    log_timezone = 'Africa/Lagos'
    
    # Locale settings for Nigerian banking
    lc_messages = 'en_NG.UTF-8'
    lc_monetary = 'en_NG.UTF-8'
    lc_numeric = 'en_NG.UTF-8'
    lc_time = 'en_NG.UTF-8'
    
    # Network optimizations for Nigerian connectivity
    tcp_keepalives_idle = 600
    tcp_keepalives_interval = 30
    tcp_keepalives_count = 3
    
    # SSL Configuration for Banking Security
    ssl = on
    ssl_cert_file = '/var/lib/postgresql/server.crt'
    ssl_key_file = '/var/lib/postgresql/server.key'
    ssl_ca_file = '/var/lib/postgresql/ca.crt'
    ssl_ciphers = 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384'
    ssl_prefer_server_ciphers = on
    ssl_min_protocol_version = 'TLSv1.2'
    
    # Additional Banking-Specific Settings
    default_transaction_isolation = 'read committed'
    statement_timeout = 300000  # 5 minutes for complex banking queries
    lock_timeout = 30000        # 30 seconds for lock timeout
    idle_in_transaction_session_timeout = 600000  # 10 minutes
    
    # Archive Configuration for Compliance
    archive_mode = on
    archive_command = 'cp %p /var/lib/postgresql/archive/%f'
    archive_timeout = 300  # 5 minutes
    
    # Hot Standby Configuration
    hot_standby = on
    hot_standby_feedback = on
    max_standby_archive_delay = 30s
    max_standby_streaming_delay = 30s
    
    # Replication Configuration
    max_wal_senders = 10
    max_replication_slots = 10
    wal_keep_segments = 32
    wal_sender_timeout = 60s
    
    # Custom Banking Extensions
    shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_audit'
    
    # pg_stat_statements configuration
    pg_stat_statements.max = 10000
    pg_stat_statements.track = all
    pg_stat_statements.track_utility = on
    pg_stat_statements.save = on
    
    # auto_explain configuration for query optimization
    auto_explain.log_min_duration = 5000
    auto_explain.log_analyze = on
    auto_explain.log_buffers = on
    auto_explain.log_timing = on
    auto_explain.log_triggers = on
    auto_explain.log_verbose = on
    auto_explain.log_nested_statements = on
    
    # Banking-specific memory settings
    temp_buffers = 32MB
    max_prepared_transactions = 100
    
    # JIT Configuration (PostgreSQL 11+)
    jit = on
    jit_above_cost = 100000
    jit_inline_above_cost = 500000
    jit_optimize_above_cost = 500000
    
  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # Local connections
    local   all             postgres                                peer
    local   all             all                                     md5
    
    # IPv4 local connections
    host    all             all             127.0.0.1/32            md5
    
    # IPv6 local connections
    host    all             all             ::1/128                 md5
    
    # Kubernetes cluster connections
    host    all             all             10.0.0.0/8              md5
    host    all             all             172.16.0.0/12           md5
    host    all             all             192.168.0.0/16          md5
    
    # SSL connections for banking applications
    hostssl remittance   remittance_user  0.0.0.0/0           md5
    hostssl remittance   readonly_user       0.0.0.0/0           md5
    hostssl remittance   analytics_user      0.0.0.0/0           md5
    
    # Replication connections
    host    replication     replicator      10.0.0.0/8              md5
    host    replication     replicator      172.16.0.0/12           md5
    host    replication     replicator      192.168.0.0/16          md5
    
  banking_indexes.sql: |
    -- Banking-Specific Database Indexes for Performance Optimization
    -- Optimized for Nigerian Banking Transaction Patterns
    
    -- Transactions table indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_created_at_btree 
    ON transactions USING btree (created_at DESC);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_amount_btree 
    ON transactions USING btree (amount);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_status_created_at 
    ON transactions USING btree (status, created_at DESC);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_sender_receiver 
    ON transactions USING btree (sender_account_id, receiver_account_id);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_reference_unique 
    ON transactions USING btree (transaction_reference) WHERE transaction_reference IS NOT NULL;
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_type_date 
    ON transactions USING btree (transaction_type, DATE(created_at));
    
    -- Accounts table indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_accounts_account_number_unique 
    ON accounts USING btree (account_number);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_accounts_customer_id 
    ON accounts USING btree (customer_id);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_accounts_balance_btree 
    ON accounts USING btree (balance);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_accounts_status_type 
    ON accounts USING btree (status, account_type);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_accounts_created_at 
    ON accounts USING btree (created_at DESC);
    
    -- Customers table indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_phone_unique 
    ON customers USING btree (phone_number) WHERE phone_number IS NOT NULL;
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_email_unique 
    ON customers USING btree (email) WHERE email IS NOT NULL;
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_bvn_unique 
    ON customers USING btree (bvn) WHERE bvn IS NOT NULL;
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_nin_unique 
    ON customers USING btree (nin) WHERE nin IS NOT NULL;
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_kyc_status 
    ON customers USING btree (kyc_status, created_at);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_location 
    ON customers USING btree (state, local_government_area);
    
    -- Agents table indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_agents_agent_code_unique 
    ON agents USING btree (agent_code);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_agents_phone_unique 
    ON agents USING btree (phone_number);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_agents_location 
    ON agents USING btree (state, local_government_area);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_agents_status_level 
    ON agents USING btree (status, agent_level);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_agents_parent_agent 
    ON agents USING btree (parent_agent_id) WHERE parent_agent_id IS NOT NULL;
    
    -- Audit logs indexes for compliance
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_audit_logs_timestamp 
    ON audit_logs USING btree (created_at DESC);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_audit_logs_user_action 
    ON audit_logs USING btree (user_id, action_type, created_at DESC);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_audit_logs_table_record 
    ON audit_logs USING btree (table_name, record_id);
    
    -- Fraud cases indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_fraud_cases_status_priority 
    ON fraud_cases USING btree (status, priority, created_at DESC);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_fraud_cases_transaction_id 
    ON fraud_cases USING btree (transaction_id) WHERE transaction_id IS NOT NULL;
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_fraud_cases_customer_id 
    ON fraud_cases USING btree (customer_id);
    
    -- Compliance reports indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_compliance_reports_type_date 
    ON compliance_reports USING btree (report_type, report_date DESC);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_compliance_reports_status 
    ON compliance_reports USING btree (status, created_at DESC);
    
    -- Partial indexes for active records
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_active_transactions 
    ON transactions USING btree (created_at DESC) 
    WHERE status IN ('pending', 'processing');
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_active_accounts 
    ON accounts USING btree (account_number) 
    WHERE status = 'active';
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_active_agents 
    ON agents USING btree (agent_code) 
    WHERE status = 'active';
    
    -- GIN indexes for full-text search
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_search_gin 
    ON customers USING gin (to_tsvector('english', 
        COALESCE(first_name, '') || ' ' || 
        COALESCE(last_name, '') || ' ' || 
        COALESCE(email, '') || ' ' || 
        COALESCE(phone_number, '')));
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_agents_search_gin 
    ON agents USING gin (to_tsvector('english', 
        COALESCE(first_name, '') || ' ' || 
        COALESCE(last_name, '') || ' ' || 
        COALESCE(business_name, '') || ' ' || 
        COALESCE(agent_code, '')));
    
    -- Composite indexes for common query patterns
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_customer_date_amount 
    ON transactions USING btree (sender_account_id, DATE(created_at), amount DESC);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_accounts_customer_type_status 
    ON accounts USING btree (customer_id, account_type, status);
    
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_agents_location_level_status 
    ON agents USING btree (state, agent_level, status);
    
    -- Analyze tables for updated statistics
    ANALYZE transactions;
    ANALYZE accounts;
    ANALYZE customers;
    ANALYZE agents;
    ANALYZE audit_logs;
    ANALYZE fraud_cases;
    ANALYZE compliance_reports;

  banking_maintenance.sql: |
    -- Banking Database Maintenance Procedures
    -- Automated maintenance for optimal performance
    
    -- Create maintenance schema
    CREATE SCHEMA IF NOT EXISTS maintenance;
    
    -- Table maintenance function
    CREATE OR REPLACE FUNCTION maintenance.optimize_banking_tables()
    RETURNS void AS $$
    BEGIN
        -- Vacuum and analyze critical tables
        VACUUM ANALYZE transactions;
        VACUUM ANALYZE accounts;
        VACUUM ANALYZE customers;
        VACUUM ANALYZE agents;
        VACUUM ANALYZE audit_logs;
        
        -- Reindex critical indexes
        REINDEX INDEX CONCURRENTLY idx_transactions_created_at_btree;
        REINDEX INDEX CONCURRENTLY idx_accounts_account_number_unique;
        REINDEX INDEX CONCURRENTLY idx_customers_phone_unique;
        REINDEX INDEX CONCURRENTLY idx_agents_agent_code_unique;
        
        -- Update table statistics
        ANALYZE transactions;
        ANALYZE accounts;
        ANALYZE customers;
        ANALYZE agents;
        
        RAISE NOTICE 'Banking tables optimization completed at %', NOW();
    END;
    $$ LANGUAGE plpgsql;
    
    -- Archive old transaction data (older than 7 years for compliance)
    CREATE OR REPLACE FUNCTION maintenance.archive_old_transactions()
    RETURNS integer AS $$
    DECLARE
        archived_count integer;
    BEGIN
        -- Move transactions older than 7 years to archive table
        WITH archived AS (
            DELETE FROM transactions 
            WHERE created_at < NOW() - INTERVAL '7 years'
            AND status IN ('completed', 'failed', 'cancelled')
            RETURNING *
        )
        INSERT INTO transactions_archive SELECT * FROM archived;
        
        GET DIAGNOSTICS archived_count = ROW_COUNT;
        
        RAISE NOTICE 'Archived % old transactions at %', archived_count, NOW();
        RETURN archived_count;
    END;
    $$ LANGUAGE plpgsql;
    
    -- Clean up old audit logs (keep 3 years for compliance)
    CREATE OR REPLACE FUNCTION maintenance.cleanup_old_audit_logs()
    RETURNS integer AS $$
    DECLARE
        deleted_count integer;
    BEGIN
        DELETE FROM audit_logs 
        WHERE created_at < NOW() - INTERVAL '3 years';
        
        GET DIAGNOSTICS deleted_count = ROW_COUNT;
        
        RAISE NOTICE 'Deleted % old audit log entries at %', deleted_count, NOW();
        RETURN deleted_count;
    END;
    $$ LANGUAGE plpgsql;
    
    -- Banking performance monitoring view
    CREATE OR REPLACE VIEW maintenance.banking_performance_stats AS
    SELECT 
        schemaname,
        tablename,
        attname,
        n_distinct,
        correlation,
        most_common_vals,
        most_common_freqs
    FROM pg_stats 
    WHERE schemaname = 'public' 
    AND tablename IN ('transactions', 'accounts', 'customers', 'agents')
    ORDER BY tablename, attname;
    
    -- Index usage statistics view
    CREATE OR REPLACE VIEW maintenance.index_usage_stats AS
    SELECT 
        schemaname,
        tablename,
        indexname,
        idx_tup_read,
        idx_tup_fetch,
        idx_scan,
        CASE 
            WHEN idx_scan = 0 THEN 'Unused'
            WHEN idx_scan < 100 THEN 'Low Usage'
            WHEN idx_scan < 1000 THEN 'Medium Usage'
            ELSE 'High Usage'
        END as usage_category
    FROM pg_stat_user_indexes 
    WHERE schemaname = 'public'
    ORDER BY idx_scan DESC;
    
    -- Table size monitoring view
    CREATE OR REPLACE VIEW maintenance.table_sizes AS
    SELECT 
        schemaname,
        tablename,
        pg_size_pretty(pg_total_relation_size(schemaname||'.'||tablename)) as total_size,
        pg_size_pretty(pg_relation_size(schemaname||'.'||tablename)) as table_size,
        pg_size_pretty(pg_total_relation_size(schemaname||'.'||tablename) - pg_relation_size(schemaname||'.'||tablename)) as index_size
    FROM pg_tables 
    WHERE schemaname = 'public'
    ORDER BY pg_total_relation_size(schemaname||'.'||tablename) DESC;

