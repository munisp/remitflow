---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak-system
  labels:
    app: keycloak
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: https
    port: 8443
    targetPort: 8443
  - name: management
    port: 9990
    targetPort: 9990
  selector:
    app: keycloak

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: keycloak-system
  labels:
    app: keycloak
spec:
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: https
    port: 8443
    targetPort: 8443
  - name: jgroups
    port: 7600
    targetPort: 7600
  selector:
    app: keycloak

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: keycloak-system
  labels:
    app: keycloak
spec:
  serviceName: keycloak-headless
  replicas: 3
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - keycloak
            topologyKey: kubernetes.io/hostname
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:22.0.5
        command:
        - /opt/keycloak/bin/kc.sh
        - start
        - --config-file=/opt/keycloak/conf/keycloak.conf
        - --import-realm
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        - containerPort: 9990
          name: management
        - containerPort: 7600
          name: jgroups
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-password
        - name: KEYCLOAK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: db-password
        - name: KEYCLOAK_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: truststore-password
        - name: KEYCLOAK_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: smtp-password
        - name: KEYCLOAK_SMTP_USER
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: smtp-user
        - name: KC_CACHE_STACK
          value: "kubernetes"
        - name: JGROUPS_DISCOVERY_PROTOCOL
          value: "kubernetes.KUBE_PING"
        - name: JGROUPS_DISCOVERY_PROPERTIES
          value: "dump_requests=true,port_range=10"
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBERNETES_LABELS
          value: "app=keycloak"
        - name: JAVA_OPTS_APPEND
          value: "-Djgroups.dns.query=keycloak-headless.keycloak-system.svc.cluster.local -Xms2g -Xmx4g -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true -Djboss.modules.system.pkgs=org.jboss.byteman -Djava.awt.headless=true"
        volumeMounts:
        - name: keycloak-config
          mountPath: /opt/keycloak/conf/keycloak.conf
          subPath: keycloak.conf
        - name: keycloak-config
          mountPath: /opt/keycloak/conf/cache-ispn-jdbc-ping.xml
          subPath: cache-ispn-jdbc-ping.xml
        - name: keycloak-realm
          mountPath: /opt/keycloak/data/import/banking-realm.json
          subPath: banking-realm.json
        - name: tls-certs
          mountPath: /etc/keycloak/tls
          readOnly: true
        - name: keycloak-data
          mountPath: /opt/keycloak/data
        - name: keycloak-logs
          mountPath: /var/log/keycloak
        resources:
          requests:
            memory: "3Gi"
            cpu: "1"
          limits:
            memory: "6Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: keycloak-config
        configMap:
          name: keycloak-config
      - name: keycloak-realm
        configMap:
          name: keycloak-config
      - name: tls-certs
        secret:
          secretName: keycloak-secrets
      - name: keycloak-logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: keycloak-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-setup
  namespace: keycloak-system
  labels:
    app: keycloak-realm-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: keycloak-setup
        image: quay.io/keycloak/keycloak:22.0.5
        command:
        - sh
        - -c
        - |
          # Wait for Keycloak to be ready
          echo "Waiting for Keycloak to be ready..."
          while ! curl -f http://keycloak:8080/health/ready; do
            echo "Waiting for Keycloak..."
            sleep 10
          done
          
          # Configure Keycloak admin CLI
          /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://keycloak:8080 \
            --realm master \
            --user admin \
            --password $KEYCLOAK_ADMIN_PASSWORD
          
          # Create banking realm if it doesn't exist
          echo "Creating banking realm..."
          /opt/keycloak/bin/kcadm.sh create realms -f /tmp/banking-realm.json || true
          
          # Configure banking realm settings
          echo "Configuring banking realm..."
          /opt/keycloak/bin/kcadm.sh update realms/banking \
            -s enabled=true \
            -s registrationAllowed=false \
            -s verifyEmail=true \
            -s loginWithEmailAllowed=true \
            -s duplicateEmailsAllowed=false \
            -s resetPasswordAllowed=true \
            -s bruteForceProtected=true \
            -s permanentLockout=false \
            -s maxFailureWaitSeconds=900 \
            -s minimumQuickLoginWaitSeconds=60 \
            -s waitIncrementSeconds=60 \
            -s quickLoginCheckMilliSeconds=1000 \
            -s maxDeltaTimeSeconds=43200 \
            -s failureFactor=30
          
          # Create banking client
          echo "Creating banking client..."
          /opt/keycloak/bin/kcadm.sh create clients -r banking \
            -s clientId=banking-client \
            -s enabled=true \
            -s clientAuthenticatorType=client-secret \
            -s secret=banking-client-secret-change-in-production \
            -s 'redirectUris=["https://banking.agent-network.local/*","https://admin.agent-network.local/*","https://agent.agent-network.local/*","https://mobile.agent-network.local/*"]' \
            -s 'webOrigins=["https://banking.agent-network.local","https://admin.agent-network.local","https://agent.agent-network.local","https://mobile.agent-network.local"]' \
            -s protocol=openid-connect \
            -s fullScopeAllowed=true || true
          
          # Create banking roles
          echo "Creating banking roles..."
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=banking-admin -s description="Banking system administrator with full access" || true
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=banking-user -s description="Standard banking user with basic access" || true
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=transaction-processor -s description="User authorized to process banking transactions" || true
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=fraud-analyst -s description="User authorized to analyze fraud and risk" || true
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=compliance-officer -s description="User authorized for compliance and audit operations" || true
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=customer-service -s description="Customer service representative with limited access" || true
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=agent-manager -s description="Banking agent manager with agent oversight" || true
          /opt/keycloak/bin/kcadm.sh create roles -r banking -s name=branch-manager -s description="Branch manager with regional oversight" || true
          
          # Create banking groups
          echo "Creating banking groups..."
          /opt/keycloak/bin/kcadm.sh create groups -r banking -s name="Banking Administrators" -s path="/Banking Administrators" || true
          /opt/keycloak/bin/kcadm.sh create groups -r banking -s name="Transaction Processors" -s path="/Transaction Processors" || true
          /opt/keycloak/bin/kcadm.sh create groups -r banking -s name="Fraud Analysts" -s path="/Fraud Analysts" || true
          /opt/keycloak/bin/kcadm.sh create groups -r banking -s name="Compliance Officers" -s path="/Compliance Officers" || true
          /opt/keycloak/bin/kcadm.sh create groups -r banking -s name="Customer Service" -s path="/Customer Service" || true
          /opt/keycloak/bin/kcadm.sh create groups -r banking -s name="Agent Managers" -s path="/Agent Managers" || true
          /opt/keycloak/bin/kcadm.sh create groups -r banking -s name="Branch Managers" -s path="/Branch Managers" || true
          
          # Create default admin user
          echo "Creating default admin user..."
          /opt/keycloak/bin/kcadm.sh create users -r banking \
            -s username=admin \
            -s enabled=true \
            -s emailVerified=true \
            -s email=admin@remittance.local \
            -s firstName=Banking \
            -s lastName=Administrator || true
          
          # Set admin user password
          /opt/keycloak/bin/kcadm.sh set-password -r banking --username admin --new-password banking-admin-password-change-in-production
          
          # Add admin role to admin user
          /opt/keycloak/bin/kcadm.sh add-roles -r banking --uusername admin --rolename banking-admin
          
          echo "Keycloak banking realm setup completed successfully!"
        env:
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-password
        volumeMounts:
        - name: keycloak-realm
          mountPath: /tmp/banking-realm.json
          subPath: banking-realm.json
      volumes:
      - name: keycloak-realm
        configMap:
          name: keycloak-config

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-pdb
  namespace: keycloak-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: keycloak

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-network-policy
  namespace: keycloak-system
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: remittance-system
    - namespaceSelector:
        matchLabels:
          name: dapr-system
    - namespaceSelector:
        matchLabels:
          name: temporal-system
    - podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 7600
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: postgres-system
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 7600
    - protocol: TCP
      port: 8080
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 587  # SMTP
    - protocol: TCP
      port: 465  # SMTPS

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: keycloak-metrics
  namespace: keycloak-system
  labels:
    app: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  endpoints:
  - port: management
    interval: 30s
    path: /metrics

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-exporter
  namespace: keycloak-system
  labels:
    app: keycloak-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-exporter
  template:
    metadata:
      labels:
        app: keycloak-exporter
    spec:
      containers:
      - name: keycloak-exporter
        image: aerogear/keycloak-metrics-spi:2.5.3
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: KEYCLOAK_URL
          value: "http://keycloak:8080"
        - name: KEYCLOAK_USER
          value: "admin"
        - name: KEYCLOAK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-password
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-exporter
  namespace: keycloak-system
  labels:
    app: keycloak-exporter
spec:
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  selector:
    app: keycloak-exporter

