# Keycloak Identity and Access Management Configuration for Remittance Platform
# High-Availability Keycloak Cluster optimized for Nigerian banking identity management

apiVersion: v1
kind: Namespace
metadata:
  name: keycloak-system
  labels:
    name: keycloak-system
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: keycloak-system
  labels:
    app: keycloak
data:
  keycloak.conf: |
    # Keycloak Configuration for Remittance Platform
    
    # Database configuration for HA clustering
    db=postgres
    db-url=jdbc:postgresql://postgres-service.postgres-system.svc.cluster.local:5432/keycloak
    db-username=keycloak_user
    db-password=${KEYCLOAK_DB_PASSWORD}
    db-pool-initial-size=20
    db-pool-min-size=10
    db-pool-max-size=100
    
    # Clustering configuration for HA
    cache=ispn
    cache-stack=kubernetes
    cache-config-file=cache-ispn-jdbc-ping.xml
    
    # HTTP/HTTPS configuration
    hostname=keycloak.remittance.local
    hostname-strict=false
    hostname-strict-https=false
    http-enabled=true
    http-port=8080
    https-port=8443
    
    # TLS/SSL configuration
    https-certificate-file=/etc/keycloak/tls/tls.crt
    https-certificate-key-file=/etc/keycloak/tls/tls.key
    https-trust-store-file=/etc/keycloak/tls/truststore.jks
    https-trust-store-password=${KEYCLOAK_TRUSTSTORE_PASSWORD}
    
    # Proxy configuration for Nigerian banking infrastructure
    proxy=edge
    proxy-headers=forwarded|x-forwarded
    
    # Logging configuration for banking compliance
    log-level=INFO
    log-format=json
    log-file=/var/log/keycloak/keycloak.log
    
    # Performance tuning for Nigerian banking workloads
    http-max-queued-requests=1000
    http-pool-max-threads=200
    
    # Security configuration
    fips-mode=disabled
    
    # Health check configuration
    health-enabled=true
    metrics-enabled=true
    
    # Features configuration for banking
    features=account2,account-api,admin-fine-grained-authz,admin2,authorization,ciba,client-policies,declarative-user-profile,docker,impersonation,openshift-integration,par,recovery-codes,scripts,step-up-authentication,token-exchange,update-email,web-authn
    
    # Transaction timeout for banking operations
    transaction-xa-enabled=false

  cache-ispn-jdbc-ping.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <infinispan
        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
        xsi:schemaLocation="urn:infinispan:config:14.0 http://www.infinispan.org/schemas/infinispan-config-14.0.xsd"
        xmlns="urn:infinispan:config:14.0">
        
        <cache-container name="keycloak">
            <transport lock-timeout="60000"/>
            <local-cache name="realms">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <memory max-count="10000"/>
            </local-cache>
            <local-cache name="users">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <memory max-count="10000"/>
            </local-cache>
            <distributed-cache name="sessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="1800000"/>
            </distributed-cache>
            <distributed-cache name="authenticationSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="900000"/>
            </distributed-cache>
            <distributed-cache name="offlineSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="5184000000"/>
            </distributed-cache>
            <distributed-cache name="clientSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="1800000"/>
            </distributed-cache>
            <distributed-cache name="offlineClientSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="5184000000"/>
            </distributed-cache>
            <distributed-cache name="loginFailures" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="900000"/>
            </distributed-cache>
            <local-cache name="authorization">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <memory max-count="10000"/>
            </local-cache>
            <replicated-cache name="work">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="900000"/>
            </replicated-cache>
            <local-cache name="keys">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration max-idle="3600000"/>
                <memory max-count="1000"/>
            </local-cache>
            <distributed-cache name="actionTokens" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration max-idle="300000" lifespan="300000"/>
                <memory max-count="10000"/>
            </distributed-cache>
        </cache-container>
    </infinispan>

