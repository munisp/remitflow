apiVersion: v1
kind: Namespace
metadata:
  name: permify-system
  labels:
    name: permify-system
    app.kubernetes.io/name: permify
    app.kubernetes.io/component: authorization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: permify-system
  labels:
    app: permify
data:
  config.yaml: |
    # Permify Authorization Service Configuration
    # High-Availability setup for Remittance Platform
    
    server:
      http:
        enabled: true
        port: 3476
      grpc:
        enabled: true
        port: 3478
      
    logger:
      level: info
      output: stdout
      
    profiler:
      enabled: true
      port: 6060
      
    authn:
      enabled: true
      method: preshared
      preshared:
        keys:
          - ${PERMIFY_API_KEY}
          
    tracer:
      enabled: true
      exporter: otlp
      endpoint: otel-collector.monitoring.svc.cluster.local:4317
      insecure: true
      
    meter:
      enabled: true
      exporter: otlp
      endpoint: otel-collector.monitoring.svc.cluster.local:4317
      insecure: true
      
    service:
      circuit_breaker: true
      watch:
        enabled: true
      schema:
        cache:
          number_of_counters: 10000
          max_cost: 10485760
      permission:
        bulk_limit: 100
        concurrency_limit: 100
        cache:
          number_of_counters: 10000
          max_cost: 10485760
      relationship:
        cache:
          number_of_counters: 10000
          max_cost: 10485760
          
    database:
      engine: postgres
      uri: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql-ha.postgresql-system.svc.cluster.local:5432/permify?sslmode=require
      auto_migrate: true
      max_open_connections: 50
      max_idle_connections: 10
      max_connection_lifetime: 3600s
      max_connection_idle_time: 300s
      garbage_collection:
        enabled: true
        interval: 3h
        window: 720h
        timeout: 5m

  schema.perm: |
    // Remittance Platform Authorization Schema
    
    entity user {}
    
    entity organization {
      relation admin @user
      relation member @user
      
      permission manage = admin
      permission view = admin or member
    }
    
    entity agent {
      relation owner @user
      relation organization @organization
      relation supervisor @agent
      
      permission manage = owner or organization.admin
      permission view = owner or organization.member or supervisor.owner
      permission transact = owner
    }
    
    entity transaction {
      relation initiator @agent
      relation approver @agent
      
      permission view = initiator.owner or approver.owner or initiator.organization.admin
      permission approve = approver.owner and not initiator.owner
      permission cancel = initiator.owner
    }
    
    entity float_account {
      relation owner @agent
      relation organization @organization
      
      permission view = owner.owner or organization.admin
      permission deposit = owner.owner
      permission withdraw = owner.owner
    }
    
    entity report {
      relation owner @agent
      relation organization @organization
      
      permission view = owner.owner or organization.member
      permission export = owner.owner or organization.admin
    }
    
    entity compliance_record {
      relation subject @agent
      relation reviewer @user
      
      permission view = subject.owner or reviewer or subject.organization.admin
      permission update = reviewer or subject.organization.admin
    }

---
# NOTE: Secrets are managed by External Secrets Operator
# See: infrastructure/ha-components/secret-management/kubernetes/platform-secrets.yaml
# The ExternalSecret 'permify-secrets' in namespace 'permify-system' will create
# a Kubernetes Secret with the following keys:
#   - api-key: Permify API key for authentication
#   - postgres-user: PostgreSQL username
#   - postgres-password: PostgreSQL password
#
# Required AWS Secrets Manager entries:
#   - remittance/permify (with property: api-key)
#   - remittance/permify/database (with properties: username, password)
#
# To deploy without External Secrets (development only), create a Secret manually:
# kubectl create secret generic permify-secrets \
#   --namespace=permify-system \
#   --from-literal=api-key=your-api-key \
#   --from-literal=postgres-user=permify \
#   --from-literal=postgres-password=your-password
---
apiVersion: v1
kind: Service
metadata:
  name: permify-headless
  namespace: permify-system
  labels:
    app: permify
spec:
  clusterIP: None
  ports:
  - name: http
    port: 3476
    targetPort: 3476
  - name: grpc
    port: 3478
    targetPort: 3478
  - name: profiler
    port: 6060
    targetPort: 6060
  selector:
    app: permify

---
apiVersion: v1
kind: Service
metadata:
  name: permify-service
  namespace: permify-system
  labels:
    app: permify
  annotations:
    service.kubernetes.io/topology-aware-hints: "auto"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3476
    targetPort: 3476
  - name: grpc
    port: 3478
    targetPort: 3478
  selector:
    app: permify

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: permify-system
  labels:
    app: permify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: permify
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: permify
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3476"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - permify
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: permify-sa
      containers:
      - name: permify
        image: ghcr.io/permify/permify:latest
        args:
        - serve
        - --config=/etc/permify/config.yaml
        ports:
        - containerPort: 3476
          name: http
        - containerPort: 3478
          name: grpc
        - containerPort: 6060
          name: profiler
        env:
        - name: PERMIFY_API_KEY
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: api-key
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: postgres-password
        volumeMounts:
        - name: permify-config
          mountPath: /etc/permify
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3476
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3476
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - "sleep 5"
      volumes:
      - name: permify-config
        configMap:
          name: permify-config

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: permify-sa
  namespace: permify-system

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-pdb
  namespace: permify-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: permify

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permify-network-policy
  namespace: permify-system
spec:
  podSelector:
    matchLabels:
      app: permify
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: remittance-system
    ports:
    - protocol: TCP
      port: 3476
    - protocol: TCP
      port: 3478
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: postgresql-system
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 4317
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permify-hpa
  namespace: permify-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: permify
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: permify-monitor
  namespace: permify-system
  labels:
    app: permify
spec:
  selector:
    matchLabels:
      app: permify
  endpoints:
  - port: http
    interval: 15s
    path: /metrics

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: permify-alerts
  namespace: permify-system
  labels:
    app: permify
spec:
  groups:
  - name: permify.rules
    rules:
    - alert: PermifyReplicaDown
      expr: up{job="permify"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Permify replica is down"
        description: "Permify replica {{ $labels.instance }} has been down for more than 1 minute."
    - alert: PermifyHighLatency
      expr: histogram_quantile(0.99, rate(permify_request_duration_seconds_bucket[5m])) > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Permify high latency detected"
        description: "Permify P99 latency is above 500ms for more than 5 minutes."
    - alert: PermifyHighErrorRate
      expr: rate(permify_requests_total{status="error"}[5m]) / rate(permify_requests_total[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Permify high error rate"
        description: "Permify error rate is above 5% for more than 5 minutes."
    - alert: PermifyDatabaseConnectionError
      expr: permify_database_connections_errors_total > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Permify database connection errors"
        description: "Permify is experiencing database connection errors."
