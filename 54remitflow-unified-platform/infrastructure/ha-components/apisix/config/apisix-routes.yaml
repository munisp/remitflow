consumers:
  - username: remittance-admin
    plugins:
      key-auth:
        key: "${ADMIN_API_KEY}"
      jwt-auth:
        key: admin
        secret: "${JWT_SECRET}"
        algorithm: HS256

  - username: remittance-service
    plugins:
      key-auth:
        key: "${SERVICE_API_KEY}"
      jwt-auth:
        key: service
        secret: "${JWT_SECRET}"
        algorithm: HS256

  - username: remittance-mobile
    plugins:
      key-auth:
        key: "${MOBILE_API_KEY}"
      jwt-auth:
        key: mobile
        secret: "${JWT_SECRET}"
        algorithm: HS256

global_rules:
  - id: global-logging
    plugins:
      syslog:
        host: fluentd
        port: 5140
        flush_limit: 100
        sock_type: tcp
        batch_max_size: 1000
        buffer_duration: 60
        include_req_body: true
        include_resp_body: false

  - id: global-security
    plugins:
      ip-restriction:
        blacklist:
          - 0.0.0.0/8
          - 10.255.255.0/24
        message: "Access denied"
      ua-restriction:
        bypass_missing: false
        denylist:
          - "curl*"
          - "wget*"
        message: "User-Agent not allowed"

  - id: global-observability
    plugins:
      prometheus:
        prefer_name: true
      zipkin:
        endpoint: "http://zipkin:9411/api/v2/spans"
        sample_ratio: 0.1
        service_name: "apisix"
