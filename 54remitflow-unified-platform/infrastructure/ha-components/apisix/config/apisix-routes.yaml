routes:
  - id: agent-management-api
    uri: /api/v1/agents/*
    name: Agent Management Service
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
    upstream:
      type: roundrobin
      nodes:
        - host: agent-management-service
          port: 8111
          weight: 1
      timeout:
        connect: 5
        send: 30
        read: 30
      retries: 3
      retry_timeout: 10
    plugins:
      key-auth:
        header: X-API-Key
      jwt-auth:
        header: Authorization
        query: token
        cookie: jwt
      limit-req:
        rate: 100
        burst: 50
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Rate limit exceeded"
      limit-count:
        count: 10000
        time_window: 3600
        key: consumer_name
        rejected_code: 429
        policy: redis
        redis_host: redis-cluster
        redis_port: 6379
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
        allow_headers: "Content-Type,Authorization,X-API-Key,X-Idempotency-Key"
        expose_headers: "X-Request-Id,X-RateLimit-Remaining"
        max_age: 3600
        allow_credential: true
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      prometheus:
        prefer_name: true
      opentelemetry:
        sampler:
          name: always_on

  - id: inventory-management-api
    uri: /api/v1/inventory/*
    name: Inventory Management Service
    methods:
      - GET
      - POST
      - PUT
      - DELETE
