          port: 8111
          weight: 1
    plugins:
      public-api: {}

upstreams:
  - id: agent-management-upstream
    name: Agent Management Service Upstream
    type: roundrobin
    hash_on: vars
    key: remote_addr
    nodes:
      - host: agent-management-service
        port: 8111
        weight: 1
    timeout:
      connect: 5
      send: 30
      read: 30
    retries: 3
    retry_timeout: 10
    checks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
      passive:
        healthy:
          http_statuses:
            - 200
            - 201
            - 204
          successes: 3
        unhealthy:
          http_statuses:
            - 500
            - 502
            - 503
          http_failures: 3
          tcp_failures: 3

  - id: inventory-management-upstream
    name: Inventory Management Service Upstream
    type: roundrobin
    nodes:
      - host: inventory-management-service
        port: 8027
        weight: 1
    timeout:
      connect: 5
      send: 30
      read: 30
    retries: 3
    checks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3

  - id: kyc-kyb-upstream
    name: KYC/KYB Service Upstream
    type: roundrobin
    nodes:
      - host: kyc-kyb-service
        port: 8029
        weight: 1
    timeout:
      connect: 5
      send: 60
      read: 120
    retries: 2
    checks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          http_failures: 3

  - id: ocr-upstream
    name: OCR Service Upstream
    type: roundrobin
    nodes:
      - host: ocr-service
        port: 8030
        weight: 1
    timeout:
      connect: 5
