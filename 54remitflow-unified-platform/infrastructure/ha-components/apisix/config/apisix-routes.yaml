      type: roundrobin
      nodes:
        - host: inventory-management-service
          port: 8027
          weight: 1
      timeout:
        connect: 5
        send: 30
        read: 30
      retries: 3
    plugins:
      key-auth:
        header: X-API-Key
      jwt-auth:
        header: Authorization
      limit-req:
        rate: 200
        burst: 100
        key: remote_addr
        rejected_code: 429
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,X-API-Key,X-Idempotency-Key"
        max_age: 3600
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      prometheus:
        prefer_name: true

  - id: kyc-kyb-api
    uri: /api/v1/kyc/*
    name: KYC/KYB Verification Service
