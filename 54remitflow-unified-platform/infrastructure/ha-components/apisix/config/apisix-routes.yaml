      limit-req:
        rate: 50
        burst: 20
        key: remote_addr
        rejected_code: 429
      limit-count:
        count: 1000
        time_window: 3600
        key: consumer_name
        rejected_code: 429
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,OPTIONS"
        allow_headers: "Content-Type,Authorization,X-API-Key"
        max_age: 3600
      request-id:
