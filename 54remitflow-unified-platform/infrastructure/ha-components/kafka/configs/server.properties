# Apache Kafka High-Availability Configuration for Remittance Platform
# Production-ready configuration optimized for Nigerian banking workloads

############################# Server Basics #############################
# The id of the broker. This must be set to a unique integer for each broker.
broker.id=1

# The address the socket server listens on. It will get the value returned from 
# java.net.InetAddress.getCanonicalHostName() if not configured.
listeners=PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093,SASL_SSL://0.0.0.0:9094
advertised.listeners=PLAINTEXT://kafka-1:9092,SSL://kafka-1:9093,SASL_SSL://kafka-1:9094

# Maps listener names to security protocols
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_SSL:SASL_SSL

############################# Socket Server Settings #############################
# The number of threads that the server uses for receiving requests from the network and sending responses to the network
num.network.threads=8

# The number of threads that the server uses for processing requests, which may include disk I/O
num.io.threads=16

# The send buffer (SO_SNDBUF) used by the socket server
socket.send.buffer.bytes=102400

# The receive buffer (SO_RCVBUF) used by the socket server
socket.receive.buffer.bytes=102400

# The maximum size of a request that the socket server will accept (protection against OOM)
socket.request.max.bytes=104857600

############################# Log Basics #############################
# A comma separated list of directories under which to store log files
log.dirs=/var/kafka-logs

# The default number of log partitions per topic. More partitions allow greater
# parallelism for consumption, but this will also result in more files across
# the brokers.
num.partitions=12

# The number of threads per data directory to be used for log recovery at startup and flushing at shutdown.
num.recovery.threads.per.data.dir=2

############################# Internal Topic Settings #############################
# The replication factor for the group metadata internal topics "__consumer_offsets" and "__transaction_state"
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

############################# Log Flush Policy #############################
# Messages are immediately written to the filesystem but by default we only fsync() to sync
# the OS cache lazily. The following configurations control the flush of data to disk.

# The number of messages to accept before forcing a flush of data to disk
log.flush.interval.messages=10000

# The maximum amount of time a message can sit in a log before we force a flush
log.flush.interval.ms=1000

############################# Log Retention Policy #############################
# The following configurations control the disposal of log segments. The policy can
# be set to delete segments after a period of time, or after a given size has accumulated.

# The minimum age of a log file to be eligible for deletion due to age
log.retention.hours=168

# A size-based retention policy for logs. Segments are pruned from the log unless the remaining
# segments drop below log.retention.bytes. Functions independently of log.retention.hours.
log.retention.bytes=1073741824

# The maximum size of a log segment file. When this size is reached a new log segment will be created.
log.segment.bytes=1073741824

# The interval at which log segments are checked to see if they can be deleted according
# to the retention policies
log.retention.check.interval.ms=300000

############################# Zookeeper #############################
# Zookeeper connection string (see zookeeper docs for details).
zookeeper.connect=zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181/kafka

# Timeout in ms for connecting to zookeeper
zookeeper.connection.timeout.ms=18000

############################# Group Coordinator Settings #############################
# The following configuration specifies the time, in milliseconds, that the GroupCoordinator will delay the initial consumer rebalance.
group.initial.rebalance.delay.ms=3000

############################# Security Settings #############################
# Enable SSL
ssl.keystore.location=/opt/kafka/config/ssl/kafka.server.keystore.jks
ssl.keystore.password=banking-network-ssl-password
ssl.key.password=banking-network-ssl-password
ssl.truststore.location=/opt/kafka/config/ssl/kafka.server.truststore.jks
ssl.truststore.password=banking-network-ssl-password

# SSL client authentication
ssl.client.auth=required

# SASL Configuration
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

# Inter-broker security
security.inter.broker.protocol=SASL_SSL
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

############################# Performance Optimizations #############################
# Increase the number of replica fetcher threads for better replication performance
num.replica.fetchers=4

# Increase the replica lag time allowed before a replica is considered out of sync
replica.lag.time.max.ms=30000

# Increase the socket buffer sizes for better network performance
replica.socket.receive.buffer.bytes=65536

# Enable compression for better throughput
compression.type=lz4

# Increase batch size for better throughput
batch.size=65536

# Increase linger time for better batching
linger.ms=5

# Increase buffer memory for producer
buffer.memory=134217728

# Enable idempotent producer for exactly-once semantics
enable.idempotence=true

# Set acknowledgments to all for durability
acks=all

# Set retries for reliability
retries=2147483647

# Set max in flight requests for ordering
max.in.flight.requests.per.connection=5

############################# Nigerian Banking Optimizations #############################
# Optimized for Nigerian network conditions and banking regulations

# Increase timeouts for potentially slower network conditions
request.timeout.ms=60000
session.timeout.ms=30000

# Increase fetch sizes for better throughput over higher latency connections
fetch.max.bytes=52428800
replica.fetch.max.bytes=52428800

# Enable log compaction for key-based topics (account states, etc.)
log.cleanup.policy=compact
log.cleaner.enable=true
log.cleaner.threads=2

# Set minimum in-sync replicas for banking data durability
min.insync.replicas=2

# Enable unclean leader election prevention for data consistency
unclean.leader.election.enable=false

# Set producer and consumer quotas for fair resource usage
quota.producer.default=10485760
quota.consumer.default=10485760

############################# Monitoring and Metrics #############################
# Enable JMX for monitoring
jmx.port=9999

# Enable Kafka metrics
metric.reporters=org.apache.kafka.common.metrics.JmxReporter

# Set metrics sample window
metrics.sample.window.ms=30000

# Set number of samples
metrics.num.samples=2

############################# Banking-Specific Topics Configuration #############################
# Auto-create topics with appropriate configurations for banking workloads
auto.create.topics.enable=false

# Default replication factor for auto-created topics
default.replication.factor=3

# Topic configurations for banking data
# These will be applied when topics are created programmatically
topic.creation.enable=true

# Banking transaction topics configuration
transaction.topic.partitions=24
transaction.topic.replication.factor=3
transaction.topic.min.insync.replicas=2
transaction.topic.retention.ms=604800000
transaction.topic.compression.type=lz4

# Audit log topics configuration
audit.topic.partitions=12
audit.topic.replication.factor=3
audit.topic.min.insync.replicas=2
audit.topic.retention.ms=31536000000
audit.topic.cleanup.policy=compact

# Notification topics configuration
notification.topic.partitions=12
notification.topic.replication.factor=3
notification.topic.min.insync.replicas=2
notification.topic.retention.ms=259200000

############################# High Availability Settings #############################
# Enable controlled shutdown for graceful broker restarts
controlled.shutdown.enable=true
controlled.shutdown.max.retries=3
controlled.shutdown.retry.backoff.ms=5000

# Leader imbalance settings
leader.imbalance.per.broker.percentage=10
leader.imbalance.check.interval.seconds=300

# Replica settings for HA
replica.high.watermark.checkpoint.interval.ms=5000
replica.socket.timeout.ms=30000

# Log settings for durability
log.flush.scheduler.interval.ms=2000
log.flush.offset.checkpoint.interval.ms=60000

############################# Resource Management #############################
# JVM heap settings (set in environment)
# -Xmx6g -Xms6g for production deployment

# File descriptor limits
# Ensure ulimit -n is set to at least 100000

# Memory settings for optimal performance
# vm.swappiness=1
# vm.dirty_ratio=80
# vm.dirty_background_ratio=5

############################# Disaster Recovery #############################
# Enable log segment pre-allocation for better performance
log.preallocate=true

# Set log index interval for faster recovery
log.index.interval.bytes=4096

# Enable log segment deletion delay for recovery
log.segment.delete.delay.ms=60000

############################# Compliance and Auditing #############################
# Enable all necessary logging for Nigerian banking compliance
log4j.logger.kafka.controller=INFO
log4j.logger.kafka.log.LogCleaner=INFO
log4j.logger.state.change.logger=INFO
log4j.logger.kafka.authorizer.logger=INFO

# Enable request logging for audit trails
log4j.logger.kafka.request.logger=INFO, requestAppender
log4j.additivity.kafka.request.logger=false

# Enable security logging
log4j.logger.kafka.security=INFO

