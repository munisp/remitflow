# Redis 5/5 Bank-Grade Cluster Configuration
# High Availability, Performance, Security, Observability, Disaster Recovery
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
---
# Redis Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    port 0
    tls-port 6379
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511
    
    # TLS Configuration
    tls-cert-file /certs/redis.crt
    tls-key-file /certs/redis.key
    tls-ca-cert-file /certs/ca.crt
    tls-auth-clients yes
    tls-replication yes
    tls-cluster yes
    
    # Memory Management
    maxmemory 4gb
    maxmemory-policy volatile-lru
    maxmemory-samples 10
    
    # Persistence - AOF
    appendonly yes
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes
    aof-use-rdb-preamble yes
    
    # Persistence - RDB
    save 900 1
    save 300 10
    save 60 10000
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    
    # Cluster Configuration
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 15000
    cluster-replica-validity-factor 10
    cluster-require-full-coverage no
    cluster-allow-reads-when-down yes
    
    # Security
    requirepass ${REDIS_PASSWORD}
    masterauth ${REDIS_PASSWORD}
    
    # ACL Configuration
    aclfile /etc/redis/users.acl
    
    # Limits
    maxclients 10000
    
    # Slow Log
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    
    # Latency Monitor
    latency-monitor-threshold 100
    
    # Event Notification
    notify-keyspace-events "Ex"
    
    # Lua Scripting
    lua-time-limit 5000
    
    # Replication
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync yes
    repl-diskless-sync-delay 5
    repl-ping-replica-period 10
    repl-timeout 60
    repl-disable-tcp-nodelay no
    repl-backlog-size 256mb
    repl-backlog-ttl 3600
    
  users.acl: |
    # Admin user with full access
    user admin on >$ADMIN_PASSWORD ~* &* +@all
    
    # Application user with limited access
    user app on >$APP_PASSWORD ~remittance:* ~session:* ~cache:* &* +@read +@write +@connection -@dangerous
    
    # Read-only user for monitoring
    user monitor on >$MONITOR_PASSWORD ~* &* +@read +@connection -@dangerous
    
    # Default user disabled
    user default off
---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
  labels:
    app: redis
spec:
  serviceName: redis-headless
  replicas: 6
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: redis
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis
                topologyKey: topology.kubernetes.io/zone
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init-sysctl
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sysctl -w net.core.somaxconn=65535
              sysctl -w vm.overcommit_memory=1
          securityContext:
            privileged: true
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 16379
              name: cluster
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: redis-secrets
          resources:
            requests:
              memory: "6Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --tls --cert /certs/redis.crt --key /certs/redis.key --cacert /certs/ca.crt -a $REDIS_PASSWORD ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --tls --cert /certs/redis.crt --key /certs/redis.key --cacert /certs/ca.crt -a $REDIS_PASSWORD ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.55.0
          ports:
            - containerPort: 9121
              name: metrics
          env:
            - name: REDIS_ADDR
              value: "rediss://localhost:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_EXPORTER_TLS_CLIENT_CERT_FILE
              value: /certs/redis.crt
            - name: REDIS_EXPORTER_TLS_CLIENT_KEY_FILE
              value: /certs/redis.key
            - name: REDIS_EXPORTER_TLS_CA_CERT_FILE
              value: /certs/ca.crt
            - name: REDIS_EXPORTER_SKIP_TLS_VERIFICATION
              value: "false"
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: certs
          secret:
            secretName: redis-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi
---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: cluster
      port: 16379
      targetPort: 16379
---
# Client Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Cluster Initialization Job
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: redis
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: redis:7.2-alpine
          command:
            - sh
            - -c
            - |
              set -e
              
              # Wait for all pods to be ready
              for i in $(seq 0 5); do
                until redis-cli --tls --cert /certs/redis.crt --key /certs/redis.key --cacert /certs/ca.crt \
                  -h redis-$i.redis-headless.redis.svc.cluster.local -a $REDIS_PASSWORD ping; do
                  echo "Waiting for redis-$i..."
                  sleep 5
                done
              done
              
              # Create cluster
              redis-cli --tls --cert /certs/redis.crt --key /certs/redis.key --cacert /certs/ca.crt \
                -a $REDIS_PASSWORD --cluster create \
                redis-0.redis-headless.redis.svc.cluster.local:6379 \
                redis-1.redis-headless.redis.svc.cluster.local:6379 \
                redis-2.redis-headless.redis.svc.cluster.local:6379 \
                redis-3.redis-headless.redis.svc.cluster.local:6379 \
                redis-4.redis-headless.redis.svc.cluster.local:6379 \
                redis-5.redis-headless.redis.svc.cluster.local:6379 \
                --cluster-replicas 1 --cluster-yes
              
              echo "Redis cluster initialized successfully"
          envFrom:
            - secretRef:
                name: redis-secrets
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: redis-tls
---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: redis
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: redis
---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: redis
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              redis-access: "true"
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
---
# Prometheus ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  namespace: redis
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
# Redis Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-alerts
  namespace: redis
spec:
  groups:
    - name: redis
      rules:
        - alert: RedisMemoryHigh
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis memory usage is high"
            description: "Redis {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }}"
        - alert: RedisEvictionsHigh
          expr: rate(redis_evicted_keys_total[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis evictions are high"
            description: "Redis {{ $labels.instance }} is evicting {{ $value }} keys per second"
        - alert: RedisClusterNodeDown
          expr: redis_cluster_state == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Redis cluster node is down"
            description: "Redis cluster {{ $labels.instance }} is not healthy"
        - alert: RedisReplicationBroken
          expr: redis_connected_slaves < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Redis replication is broken"
            description: "Redis {{ $labels.instance }} has no connected replicas"
        - alert: RedisLatencyHigh
          expr: redis_commands_duration_seconds_total / redis_commands_processed_total > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis latency is high"
            description: "Redis {{ $labels.instance }} average command latency is {{ $value }}s"
