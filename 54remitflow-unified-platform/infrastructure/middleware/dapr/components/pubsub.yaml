apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "kafka:9092"
  - name: consumerGroup
    value: "remittance-platform"
  - name: clientID
    value: "remittance-client"
  - name: authType
    value: "none"
  - name: saslUsername
    value: ""
  - name: saslPassword
    value: ""
  - name: saslMechanism
    value: "PLAIN"
  - name: initialOffset
    value: "newest"
  - name: maxMessageBytes
    value: "1024"
  - name: version
    value: "2.6.0"
  - name: disableTls
    value: "true"
  - name: caCert
    value: ""
  - name: clientCert
    value: ""
  - name: clientKey
    value: ""
  - name: skipVerify
    value: "true"
  - name: consumeRetryInterval
    value: "200ms"
  - name: consumeRetryEnabled
    value: "true"
auth:
  secretStore: kubernetes

