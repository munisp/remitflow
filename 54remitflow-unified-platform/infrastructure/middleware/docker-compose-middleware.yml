version: '3.8'

services:
  # APISIX API Gateway
  apisix:
    image: apache/apisix:3.7.0-debian
    container_name: apisix
    restart: always
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - etcd
    ports:
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
      - "9092:9092/tcp"
    networks:
      - middleware-network

  # APISIX Dashboard
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: apisix-dashboard
    restart: always
    volumes:
      - ./apisix/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    depends_on:
      - etcd
    ports:
      - "9000:9000/tcp"
    networks:
      - middleware-network

  # etcd for APISIX
  etcd:
    image: bitnami/etcd:3.5.10
    container_name: etcd
    restart: always
    volumes:
      - etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379/tcp"
    networks:
      - middleware-network

  # Keycloak Identity and Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    command: start-dev
    depends_on:
      - keycloak-db
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - middleware-network

  # Keycloak Database
  keycloak-db:
    image: postgres:15.5-alpine
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - middleware-network

  # Permify Authorization Service
  permify:
    image: ghcr.io/permify/permify:v0.6.9
    container_name: permify
    restart: always
    command: serve --config=/config/config.yaml
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://permify:permify123@permify-db:5432/permify?sslmode=disable
      PERMIFY_LOG_LEVEL: info
      PERMIFY_AUTHN_ENABLED: true
      PERMIFY_AUTHN_METHOD: preshared
      PERMIFY_AUTHN_PRESHARED_KEYS: "remittance-platform-key"
    depends_on:
      - permify-db
    ports:
      - "3476:3476"
      - "3478:3478"
    volumes:
      - ./permify/config.yaml:/config/config.yaml:ro
      - ./permify/schema.perm:/schema/schema.perm:ro
    networks:
      - middleware-network

  # Permify Database
  permify-db:
    image: postgres:15.5-alpine
    container_name: permify-db
    restart: always
    environment:
      POSTGRES_DB: permify
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: permify123
    volumes:
      - permify_db_data:/var/lib/postgresql/data
    networks:
      - middleware-network

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: temporal
    restart: always
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal123
      - POSTGRES_SEEDS=temporal-db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
      - ES_SEEDS=opensearch
      - ES_VERSION=v7
    depends_on:
      - temporal-db
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - middleware-network

  # Temporal Database
  temporal-db:
    image: postgres:15.5-alpine
    container_name: temporal-db
    restart: always
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal123
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    networks:
      - middleware-network

  # Temporal Web UI
  temporal-web:
    image: temporalio/web:2.21.3
    container_name: temporal-web
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    ports:
      - "8088:8088"
    networks:
      - middleware-network

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    restart: always
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - middleware-network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - middleware-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    container_name: kafka-ui
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    ports:
      - "8089:8080"
    networks:
      - middleware-network

  # Fluvio Streaming Platform
  fluvio:
    image: infinyon/fluvio:0.10.15
    container_name: fluvio
    restart: always
    command: cluster start --local --develop
    environment:
      FLUVIO_LOG: info
      RUST_LOG: fluvio=info
    ports:
      - "9003:9003"
    volumes:
      - fluvio_data:/home/fluvio/.fluvio
    networks:
      - middleware-network

  # Dapr Placement Service
  dapr-placement:
    image: daprio/dapr:1.12.0
    container_name: dapr-placement
    restart: always
    command: ["./placement", "-port", "50006", "-log-level", "info"]
    ports:
      - "50006:50006"
    networks:
      - middleware-network

  # Dapr Sentry Service
  dapr-sentry:
    image: daprio/dapr:1.12.0
    container_name: dapr-sentry
    restart: always
    command: ["./sentry", "-port", "50001", "-log-level", "info"]
    ports:
      - "50001:50001"
    networks:
      - middleware-network

  # Redis for Dapr State Store
  redis:
    image: redis:7.2.3-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - middleware-network

  # Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis123
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - middleware-network

  # Zipkin for Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:2.24.3
    container_name: zipkin
    restart: always
    environment:
      - STORAGE_TYPE=mem
    ports:
      - "9411:9411"
    networks:
      - middleware-network

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - middleware-network

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - middleware-network

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.51.0
    container_name: jaeger
    restart: always
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9412
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9412:9412"
    networks:
      - middleware-network

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.89.0
    container_name: otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter metrics
    depends_on:
      - jaeger
      - prometheus
    networks:
      - middleware-network

  # Consul for Service Discovery
  consul:
    image: consul:1.17.0
    container_name: consul
    restart: always
    command: agent -server -bootstrap-expect=1 -ui -bind=0.0.0.0 -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    networks:
      - middleware-network

  # Vault for Secrets Management
  vault:
    image: vault:1.15.2
    container_name: vault
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=remittance-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - middleware-network

  # NATS for Messaging
  nats:
    image: nats:2.10.5-alpine
    container_name: nats
    restart: always
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - middleware-network

  # RustFS for Object Storage (2.3x faster than MinIO for small objects)
  # Apache 2.0 licensed, S3-compatible, written in Rust
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:-rustfsadmin}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:-rustfsadmin123}
      # S3 compatibility settings
      - RUSTFS_REGION=us-east-1
      - RUSTFS_BROWSER=on
    ports:
      - "9001:9001"   # Console
      - "9002:9000"   # S3 API
    volumes:
      - rustfs_data:/data
    networks:
      - middleware-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Legacy MinIO alias for backward compatibility (points to RustFS)
  # Remove this after full migration
  minio:
    image: rustfs/rustfs:latest
    container_name: minio-compat
    restart: always
    command: server /data --console-address ":9011"
    environment:
      - RUSTFS_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - RUSTFS_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9011:9011"   # Console (different port to avoid conflict)
      - "9012:9000"   # S3 API (different port to avoid conflict)
    volumes:
      - minio_data:/data
    networks:
      - middleware-network

volumes:
  etcd_data:
  keycloak_db_data:
  permify_db_data:
  temporal_db_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  fluvio_data:
  redis_data:
  prometheus_data:
  grafana_data:
  consul_data:
  vault_data:
  nats_data:
  rustfs_data:      # Primary RustFS storage
  minio_data:       # Legacy MinIO compatibility

networks:
  middleware-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

