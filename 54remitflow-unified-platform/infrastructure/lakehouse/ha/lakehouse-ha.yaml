apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: lakehouse-ha
  namespace: lakehouse
spec:
  pools:
  - servers: 4
    name: pool-0
    volumeClaimTemplate:
      spec:
        storageClassName: local-storage
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
