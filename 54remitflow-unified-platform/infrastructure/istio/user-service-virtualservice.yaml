apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: user-service
spec:
  hosts:
  - "*"
  gateways:
  - remitflow-gateway.istio-system.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /api/v1/user-service
    route:
    - destination:
        host: user-service
        port:
          number: 8099
