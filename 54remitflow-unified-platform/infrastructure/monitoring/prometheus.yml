# Prometheus Configuration for Nigerian Remittance Platform
# Scrapes metrics from all backend services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'remittance-platform'
    env: '${ENVIRONMENT:-development}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Core Backend Services
  - job_name: 'transaction-service'
    static_configs:
      - targets: ['transaction-service:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8001']
    metrics_path: /metrics

  - job_name: 'wallet-service'
    static_configs:
      - targets: ['wallet-service:8002']
    metrics_path: /metrics

  - job_name: 'exchange-rate-service'
    static_configs:
      - targets: ['exchange-rate-service:8003']
    metrics_path: /metrics

  - job_name: 'kyc-service'
    static_configs:
      - targets: ['kyc-service:8004']
    metrics_path: /metrics

  - job_name: 'risk-service'
    static_configs:
      - targets: ['risk-service:8010']
    metrics_path: /metrics

  - job_name: 'reconciliation-service'
    static_configs:
      - targets: ['reconciliation-service:8011']
    metrics_path: /metrics

  - job_name: 'lakehouse-service'
    static_configs:
      - targets: ['lakehouse-service:8020']
    metrics_path: /metrics

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:8030']
    metrics_path: /metrics

  - job_name: 'compliance-service'
    static_configs:
      - targets: ['compliance-service:8005']
    metrics_path: /metrics

  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:8006']
    metrics_path: /metrics

  # Payment Corridor Services
  - job_name: 'mojaloop-connector'
    static_configs:
      - targets: ['mojaloop-connector:8100']
    metrics_path: /metrics

  - job_name: 'papss-connector'
    static_configs:
      - targets: ['papss-connector:8101']
    metrics_path: /metrics

  - job_name: 'upi-connector'
    static_configs:
      - targets: ['upi-connector:8102']
    metrics_path: /metrics

  - job_name: 'pix-connector'
    static_configs:
      - targets: ['pix-connector:8103']
    metrics_path: /metrics

  # Infrastructure Services
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-1:9092', 'kafka-2:9092', 'kafka-3:9092']
    metrics_path: /metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics

  - job_name: 'tigerbeetle'
    static_configs:
      - targets: ['tigerbeetle:3001']
    metrics_path: /metrics

  # Kubernetes Service Discovery (when deployed to K8s)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
