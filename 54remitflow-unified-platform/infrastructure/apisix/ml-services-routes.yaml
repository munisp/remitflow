---
# Kubernetes Services for ML components
apiVersion: v1
kind: Service
metadata:
  name: ml-routing-service
  namespace: remittance
  labels:
    app: ml-routing-service
    component: ml
spec:
  selector:
    app: ml-routing-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP

