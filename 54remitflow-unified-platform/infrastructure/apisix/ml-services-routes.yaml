# APISIX Routes for AI/ML Services
# Production-ready routing configuration for ML services

apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: ml-routing-service
  namespace: remittance
spec:
  http:
  # ML Routing Service - Predictions
  - name: ml-routing-predict
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/predict
        - /api/v1/ml/routing/predict/*
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: jwt-auth
        enable: true
      - name: limit-req
        enable: true
        config:
          rate: 1000
          burst: 500
          key: remote_addr
      - name: prometheus
        enable: true
      - name: proxy-rewrite
        enable: true
        config:
          regex_uri: ["^/api/v1/ml/routing/(.*)", "/api/v1/$1"]

  # ML Routing Service - Outcomes (Online Learning)
  - name: ml-routing-outcome
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/outcome
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: jwt-auth
        enable: true
      - name: limit-req
        enable: true
        config:
          rate: 5000
          burst: 2000
          key: remote_addr
      - name: prometheus
        enable: true

  # ML Routing Service - Liquidity Forecasting
  - name: ml-routing-forecast
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/forecast
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: jwt-auth
        enable: true
      - name: limit-req
        enable: true
        config:
          rate: 100
          burst: 50
          key: remote_addr
      - name: prometheus
        enable: true

  # ML Routing Service - Model Training (Admin only)
  - name: ml-routing-train
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/train
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: jwt-auth
        enable: true
      - name: consumer-restriction
        enable: true
        config:
          type: consumer_name
          whitelist:
            - admin
            - ml-operator
      - name: limit-req
        enable: true
        config:
          rate: 10
          burst: 5
          key: remote_addr
      - name: prometheus
        enable: true

  # ML Routing Service - Metrics
  - name: ml-routing-metrics
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/metrics
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: jwt-auth
        enable: true
      - name: prometheus
        enable: true

  # ML Routing Service - Features
  - name: ml-routing-features
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/features/*
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: jwt-auth
        enable: true
      - name: proxy-cache
        enable: true
        config:
          cache_ttl: 60
      - name: prometheus
        enable: true

  # ML Routing Service - Bandit
  - name: ml-routing-bandit
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/bandit/*
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: jwt-auth
        enable: true
      - name: prometheus
        enable: true

  # ML Routing Service - Health Check (No auth)
  - name: ml-routing-health
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/routing/health
    backends:
      - serviceName: ml-routing-service
        servicePort: 8080
    plugins:
      - name: prometheus
        enable: true

---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: fraud-detection-service
  namespace: remittance
spec:
  http:
  # Fraud Detection - Real-time Detection
  - name: fraud-detect
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/fraud/detect
    backends:
      - serviceName: fraud-detection-service
        servicePort: 8000
    plugins:
      - name: jwt-auth
        enable: true
      - name: limit-req
        enable: true
        config:
          rate: 5000
          burst: 2000
          key: remote_addr
      - name: prometheus
        enable: true
      - name: response-rewrite
        enable: true
        config:
          headers:
            X-Fraud-Service-Version: "1.0"

  # Fraud Detection - Batch Detection
  - name: fraud-batch-detect
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/fraud/batch
    backends:
      - serviceName: fraud-detection-service
        servicePort: 8000
    plugins:
      - name: jwt-auth
        enable: true
      - name: limit-req
        enable: true
        config:
          rate: 100
          burst: 50
          key: remote_addr
      - name: prometheus
        enable: true

  # Fraud Detection - Model Training (Admin only)
  - name: fraud-train
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/fraud/train
    backends:
      - serviceName: fraud-detection-service
        servicePort: 8000
    plugins:
      - name: jwt-auth
        enable: true
      - name: consumer-restriction
        enable: true
        config:
          type: consumer_name
          whitelist:
            - admin
            - ml-operator
      - name: prometheus
        enable: true

  # Fraud Detection - Model Info
  - name: fraud-model-info
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/fraud/model
    backends:
      - serviceName: fraud-detection-service
        servicePort: 8000
    plugins:
      - name: jwt-auth
        enable: true
      - name: prometheus
        enable: true

  # Fraud Detection - Health Check (No auth)
  - name: fraud-health
    match:
      hosts:
        - api.remittance.local
      paths:
        - /api/v1/ml/fraud/health
    backends:
      - serviceName: fraud-detection-service
        servicePort: 8000
    plugins:
      - name: prometheus
        enable: true

