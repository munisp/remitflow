apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kyb-service-scaler
  namespace: remittance
  labels:
    app: kyb-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: kyb-service
  pollingInterval: 15
  cooldownPeriod: 60
  idleReplicaCount: 2
  minReplicaCount: 2
  maxReplicaCount: 50
  fallback:
    failureThreshold: 3
    replicas: 5
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: kyb-service-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 10
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 50
            periodSeconds: 30
          - type: Pods
            value: 5
            periodSeconds: 30
          selectPolicy: Max
  triggers:
  # Redis queue length trigger
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: kyb_verification_queue
      listLength: "10"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus metrics trigger for CPU usage
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: cpu_usage_percentage
      threshold: "70"
      query: avg(rate(container_cpu_usage_seconds_total{pod=~"kyb-service-.*"}[2m])) * 100
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus metrics trigger for memory usage
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: memory_usage_percentage
      threshold: "80"
      query: avg(container_memory_working_set_bytes{pod=~"kyb-service-.*"} / container_spec_memory_limit_bytes{pod=~"kyb-service-.*"}) * 100
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus metrics trigger for request rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: request_rate_per_second
      threshold: "1000"
      query: sum(rate(http_requests_total{service="kyb-service"}[2m]))
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus metrics trigger for response time
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: response_time_p95
      threshold: "100"
      query: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="kyb-service"}[2m])) by (le)) * 1000
    authenticationRef:
      name: prometheus-auth
  
  # PostgreSQL connection pool trigger
  - type: postgresql
    metadata:
      connection: postgresql://kyb_user:kyb_secure_password_2024@postgres.remittance.svc.cluster.local:5432/kyb_db?sslmode=disable
      query: "SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'active' AND application_name LIKE 'kyb-service%'"
      targetQueryValue: "80"
    authenticationRef:
      name: postgres-auth

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redis-auth
  namespace: remittance
spec:
  secretTargetRef:
  - parameter: password
    name: redis-secret
    key: password

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: prometheus-auth
  namespace: remittance
spec:
  secretTargetRef:
  - parameter: username
    name: prometheus-secret
    key: username
  - parameter: password
    name: prometheus-secret
    key: password

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: postgres-auth
  namespace: remittance
spec:
  secretTargetRef:
  - parameter: connection
    name: postgres-secret
    key: connection

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: remittance
type: Opaque
data:
  password: ""  # Base64 encoded Redis password (empty for no auth)

