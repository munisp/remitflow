apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: communication-platform-scaler
  namespace: remittance
  labels:
    app: communication-platform
    component: autoscaler
spec:
  scaleTargetRef:
    name: communication-platform
  pollingInterval: 12
  cooldownPeriod: 150
  idleReplicaCount: 2
  minReplicaCount: 2
  maxReplicaCount: 45
  fallback:
    failureThreshold: 3
    replicas: 6
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: communication-platform-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 18
            periodSeconds: 100
        scaleUp:
          stabilizationWindowSeconds: 25
          policies:
          - type: Percent
            value: 120
            periodSeconds: 20
          - type: Pods
            value: 9
            periodSeconds: 20
          selectPolicy: Max
  triggers:
  # Redis multi-channel message queue
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: multi_channel_queue
      listLength: "40"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Redis priority message queue
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: priority_message_queue
      listLength: "10"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus multi-channel message rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: multi_channel_message_rate
      threshold: "300"
      query: sum(rate(multi_channel_messages_processed_total[2m]))
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus channel utilization
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: channel_utilization
      threshold: "75"
      query: avg(communication_channel_utilization_percentage)
    authenticationRef:
      name: prometheus-auth

