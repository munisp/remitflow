apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: whatsapp-service-scaler
  namespace: remittance
  labels:
    app: whatsapp-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: whatsapp-service
  pollingInterval: 20
  cooldownPeriod: 180
  idleReplicaCount: 2
  minReplicaCount: 2
  maxReplicaCount: 40
  fallback:
    failureThreshold: 3
    replicas: 5
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: whatsapp-service-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 20
            periodSeconds: 90
        scaleUp:
          stabilizationWindowSeconds: 45
          policies:
          - type: Percent
            value: 100
            periodSeconds: 30
          - type: Pods
            value: 8
            periodSeconds: 30
          selectPolicy: Max
  triggers:
  # Redis queue for WhatsApp messages
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: whatsapp_message_queue
      listLength: "20"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Redis queue for WhatsApp media processing
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: whatsapp_media_queue
      listLength: "10"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus metrics for message rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: whatsapp_message_rate
      threshold: "100"
      query: sum(rate(whatsapp_messages_sent_total[2m]))
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus webhook response time
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: whatsapp_webhook_response_time
      threshold: "500"
      query: histogram_quantile(0.95, sum(rate(whatsapp_webhook_duration_seconds_bucket[2m])) by (le)) * 1000
    authenticationRef:
      name: prometheus-auth

