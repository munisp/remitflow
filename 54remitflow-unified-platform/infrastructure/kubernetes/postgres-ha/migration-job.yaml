# Database Migration Job for Mojaloop Services
# Runs Alembic migrations before service deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: mojaloop-db-migrations
  namespace: remittance
  labels:
    app: mojaloop-migrations
    component: database
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: mojaloop-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z mojaloop-postgres-primary.remittance.svc.cluster.local 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 5
              done
              echo "PostgreSQL is ready!"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: migrations
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Installing dependencies..."
              pip install --quiet alembic asyncpg sqlalchemy psycopg2-binary
              
              echo "Running Central Ledger migrations..."
              cd /migrations/central_ledger
              alembic -c /migrations/alembic.ini upgrade head
              
              echo "Running Settlement Service migrations..."
              cd /migrations/settlement_service
              alembic -c /migrations/alembic.ini -x script_location=/migrations/settlement_service upgrade head
              
              echo "Running Participant Registry migrations..."
              cd /migrations/participant_registry
              alembic -c /migrations/alembic.ini -x script_location=/migrations/participant_registry upgrade head
              
              echo "Running Transfer Service migrations..."
              cd /migrations/transfer_service
              alembic -c /migrations/alembic.ini -x script_location=/migrations/transfer_service upgrade head
              
              echo "All migrations completed successfully!"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mojaloop.mojaloop-postgres.credentials.postgresql.acid.zalan.do
                  key: connection-string
            - name: PGHOST
              value: "mojaloop-postgres-primary.remittance.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "mojaloop"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mojaloop.mojaloop-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mojaloop.mojaloop-postgres.credentials.postgresql.acid.zalan.do
                  key: password
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: migrations
          configMap:
            name: mojaloop-migrations
---
# ConfigMap containing migration scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: mojaloop-migrations
  namespace: remittance
data:
  alembic.ini: |
    [alembic]
    script_location = central_ledger
    file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
    timezone = UTC
    truncate_slug_length = 40
    revision_environment = false
    sourceless = false
    version_path_separator = os
    output_encoding = utf-8
    sqlalchemy.url = %(DATABASE_URL)s
    
    [loggers]
    keys = root,sqlalchemy,alembic
    
    [handlers]
    keys = console
    
    [formatters]
    keys = generic
    
    [logger_root]
    level = WARN
    handlers = console
    qualname =
    
    [logger_sqlalchemy]
    level = WARN
    handlers =
    qualname = sqlalchemy.engine
    
    [logger_alembic]
    level = INFO
    handlers =
    qualname = alembic
    
    [handler_console]
    class = StreamHandler
    args = (sys.stderr,)
    level = NOTSET
    formatter = generic
    
    [formatter_generic]
    format = %(levelname)-5.5s [%(name)s] %(message)s
    datefmt = %H:%M:%S
---
# Pre-upgrade hook for Helm deployments
apiVersion: batch/v1
kind: Job
metadata:
  name: mojaloop-db-migrations-hook
  namespace: remittance
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app: mojaloop-migrations
    component: database
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: mojaloop-migrations
    spec:
      restartPolicy: OnFailure
      serviceAccountName: mojaloop-migrations
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mojaloop-postgres-primary.remittance.svc.cluster.local 5432; do
                sleep 5
              done
      containers:
        - name: migrations
          image: remittance/mojaloop-migrations:latest
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mojaloop.mojaloop-postgres.credentials.postgresql.acid.zalan.do
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# ServiceAccount for migrations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mojaloop-migrations
  namespace: remittance
---
# Role for migrations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mojaloop-migrations
  namespace: remittance
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - mojaloop.mojaloop-postgres.credentials.postgresql.acid.zalan.do
---
# RoleBinding for migrations
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mojaloop-migrations
  namespace: remittance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mojaloop-migrations
subjects:
  - kind: ServiceAccount
    name: mojaloop-migrations
    namespace: remittance
