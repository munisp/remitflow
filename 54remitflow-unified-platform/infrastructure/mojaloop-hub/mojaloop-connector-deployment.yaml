apiVersion: v1
kind: Namespace
metadata:
  name: mojaloop
  labels:
    name: mojaloop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mojaloop-connector-config
  namespace: mojaloop
data:
  MOJALOOP_HUB_URL: "http://mojaloop-ml-api-adapter.mojaloop.svc.cluster.local:3000"
  DFSP_ID: "remittance-platform"
  MOJALOOP_DB_PORT: "5432"
  MOJALOOP_DB_NAME: "mojaloop_hub"
  MOJALOOP_DB_SSL: "true"
  TIGERBEETLE_ADDRESS: "tigerbeetle.tigerbeetle.svc.cluster.local:3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-connector
  namespace: mojaloop
  labels:
    app: mojaloop-connector
    component: connector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mojaloop-connector
  template:
    metadata:
      labels:
        app: mojaloop-connector
        component: connector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mojaloop-connector
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mojaloop-connector
          image: remittance-platform/mojaloop-connector:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mojaloop-connector-config
          env:
            - name: MOJALOOP_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mojaloop-db-credentials
                  key: host
            - name: MOJALOOP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mojaloop-db-credentials
                  key: username
            - name: MOJALOOP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mojaloop-db-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mojaloop-connector
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: mojaloop-connector
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-connector
  namespace: mojaloop
  labels:
    app: mojaloop-connector
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8100
      targetPort: http
      protocol: TCP
  selector:
    app: mojaloop-connector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mojaloop-connector
  namespace: mojaloop
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mojaloop-connector
  namespace: mojaloop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mojaloop-connector
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mojaloop-connector
  namespace: mojaloop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mojaloop-connector
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mojaloop-connector
  namespace: mojaloop
spec:
  podSelector:
    matchLabels:
      app: mojaloop-connector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: remittance-platform
        - namespaceSelector:
            matchLabels:
              name: mojaloop
      ports:
        - protocol: TCP
          port: 8100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: mojaloop
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              name: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mojaloop-connector
  namespace: monitoring
  labels:
    app: mojaloop-connector
spec:
  selector:
    matchLabels:
      app: mojaloop-connector
  namespaceSelector:
    matchNames:
      - mojaloop
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
