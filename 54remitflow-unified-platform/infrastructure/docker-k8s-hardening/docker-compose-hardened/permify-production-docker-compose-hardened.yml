version: '3.8'
services:
  permify-postgres:
    image: postgres:15-alpine
    container_name: permify-postgres
    environment:
      POSTGRES_DB: permify
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: ${PERMIFY_POSTGRES_PASSWORD:-permify_secure_password_change_in_production}
      POSTGRES_INITDB_ARGS: -E UTF8
    volumes:
    - permify-postgres-data:/var/lib/postgresql/data
    - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
    - 5433:5432
    networks:
    - permify-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U permify
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  permify:
    image: ghcr.io/permify/permify:latest
    container_name: permify-server
    depends_on:
      permify-postgres:
        condition: service_healthy
    environment:
      PERMIFY_SERVER_HTTP_ENABLED: 'true'
      PERMIFY_SERVER_HTTP_PORT: '3476'
      PERMIFY_SERVER_GRPC_PORT: '3478'
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgresql://permify:${PERMIFY_POSTGRES_PASSWORD:-permify_secure_password_change_in_production}@permify-postgres:5432/permify?sslmode=disable
      PERMIFY_DATABASE_AUTO_MIGRATE: 'true'
      PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: 20
      PERMIFY_DATABASE_MAX_IDLE_CONNECTIONS: 5
      PERMIFY_DATABASE_MAX_CONNECTION_LIFETIME: 300s
      PERMIFY_DATABASE_MAX_CONNECTION_IDLE_TIME: 60s
      PERMIFY_LOG_LEVEL: info
      PERMIFY_AUTHN_ENABLED: 'true'
      PERMIFY_AUTHN_METHOD: preshared
      PERMIFY_AUTHN_PRESHARED_KEYS: ${PERMIFY_API_KEY:-permify_api_key_change_in_production}
      PERMIFY_PROFILER_ENABLED: 'true'
      PERMIFY_PROFILER_PORT: '6060'
      PERMIFY_METER_ENABLED: 'true'
      PERMIFY_METER_EXPORTER: prometheus
      PERMIFY_METER_ENDPOINT: :9090
      PERMIFY_TRACER_ENABLED: 'true'
      PERMIFY_TRACER_EXPORTER: otlp
      PERMIFY_TRACER_ENDPOINT: jaeger:4318
      PERMIFY_TRACER_INSECURE: 'true'
      PERMIFY_SERVICE_CIRCUIT_BREAKER: 'true'
      PERMIFY_SERVICE_WATCH_ENABLED: 'true'
      PERMIFY_SERVICE_SCHEMA_CACHE_ENABLED: 'true'
      PERMIFY_SERVICE_PERMISSION_CACHE_ENABLED: 'true'
    ports:
    - 3476:3476
    - 3478:3478
    - 9090:9090
    - 6060:6060
    networks:
    - permify-network
    volumes:
    - ../schemas:/etc/permify/schemas:ro
    - ../config:/etc/permify/config:ro
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:3476/healthz
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: permify-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
    - 16686:16686
    - 4318:4318
    - 4317:4317
    networks:
    - permify-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit
        1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  prometheus:
    image: prom/prometheus:latest
    container_name: permify-prometheus
    volumes:
    - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    - --web.enable-lifecycle
    ports:
    - 9091:9090
    networks:
    - permify-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit
        1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  grafana:
    image: grafana/grafana:latest
    container_name: permify-grafana
    depends_on:
    - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_change_in_production}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
    - ../monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    - ../monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    - ../monitoring/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    ports:
    - 3002:3000
    networks:
    - permify-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit
        1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  permify-postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
networks:
  permify-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.25.0.0/16
