version: '3.8'
services:
  openappsec-agent-1:
    image: ghcr.io/openappsec/agent:latest
    container_name: openappsec-agent-1
    hostname: openappsec-agent-1
    restart: always
    ports:
    - 8080:8080
    volumes:
    - ./policies:/etc/cp/conf/policy
    - openappsec-agent-1-data:/var/log/nano_agent
    - /etc/ssl/certs:/etc/ssl/certs:ro
    environment:
    - AGENT_TOKEN=${OPENAPPSEC_AGENT_TOKEN}
    - MANAGEMENT_URL=https://openappsec-management:8443
    - LOG_LEVEL=info
    - TLS_ENABLED=true
    networks:
    - openappsec-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  openappsec-agent-2:
    image: ghcr.io/openappsec/agent:latest
    container_name: openappsec-agent-2
    hostname: openappsec-agent-2
    restart: always
    ports:
    - 8081:8080
    volumes:
    - ./policies:/etc/cp/conf/policy
    - openappsec-agent-2-data:/var/log/nano_agent
    - /etc/ssl/certs:/etc/ssl/certs:ro
    environment:
    - AGENT_TOKEN=${OPENAPPSEC_AGENT_TOKEN}
    - MANAGEMENT_URL=https://openappsec-management:8443
    - LOG_LEVEL=info
    - TLS_ENABLED=true
    networks:
    - openappsec-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  openappsec-management:
    image: ghcr.io/openappsec/management:latest
    container_name: openappsec-management
    hostname: openappsec-management
    restart: always
    ports:
    - 8443:8443
    volumes:
    - openappsec-management-data:/var/lib/openappsec
    - ./certs:/etc/openappsec/certs:ro
    - ./policies:/etc/openappsec/policies
    environment:
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=openappsec
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - TLS_CERT_FILE=/etc/openappsec/certs/server.crt
    - TLS_KEY_FILE=/etc/openappsec/certs/server.key
    - ADMIN_PASSWORD=${OPENAPPSEC_ADMIN_PASSWORD}
    networks:
    - openappsec-network
    depends_on:
    - postgres
    healthcheck:
      test:
      - CMD
      - curl
      - -k
      - -f
      - https://localhost:8443/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  openappsec-bridge-1:
    build:
      context: ../plugin
      dockerfile: Dockerfile
    container_name: openappsec-bridge-1
    hostname: openappsec-bridge-1
    restart: always
    ports:
    - 9000:9000
    environment:
    - OPENAPPSEC_AGENT_URL=http://haproxy:8080
    - OPENAPPSEC_MANAGEMENT_URL=https://openappsec-management:8443
    - LOG_LEVEL=info
    networks:
    - openappsec-network
    depends_on:
    - openappsec-agent-1
    - openappsec-agent-2
    - haproxy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/health
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  openappsec-bridge-2:
    build:
      context: ../plugin
      dockerfile: Dockerfile
    container_name: openappsec-bridge-2
    hostname: openappsec-bridge-2
    restart: always
    ports:
    - 9001:9000
    environment:
    - OPENAPPSEC_AGENT_URL=http://haproxy:8080
    - OPENAPPSEC_MANAGEMENT_URL=https://openappsec-management:8443
    - LOG_LEVEL=info
    networks:
    - openappsec-network
    depends_on:
    - openappsec-agent-1
    - openappsec-agent-2
    - haproxy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/health
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  haproxy:
    image: haproxy:2.8-alpine
    container_name: openappsec-haproxy
    restart: always
    ports:
    - 8082:8080
    - 8404:8404
    volumes:
    - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
    - openappsec-network
    depends_on:
    - openappsec-agent-1
    - openappsec-agent-2
    healthcheck:
      test:
      - CMD
      - haproxy
      - -c
      - -f
      - /usr/local/etc/haproxy/haproxy.cfg
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  postgres:
    image: postgres:15-alpine
    container_name: openappsec-postgres
    restart: always
    ports:
    - 5432:5432
    environment:
    - POSTGRES_DB=openappsec
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - openappsec-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER}
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: openappsec-postgres-backup
    restart: always
    environment:
    - POSTGRES_HOST=postgres
    - POSTGRES_DB=openappsec
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - SCHEDULE=@daily
    - BACKUP_KEEP_DAYS=30
    - BACKUP_KEEP_WEEKS=8
    - BACKUP_KEEP_MONTHS=12
    - HEALTHCHECK_PORT=8080
    volumes:
    - postgres-backups:/backups
    networks:
    - openappsec-network
    depends_on:
    - postgres
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  prometheus:
    image: prom/prometheus:latest
    container_name: openappsec-prometheus
    restart: always
    ports:
    - 9090:9090
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
    - ../monitoring/prometheus-openappsec.yml:/etc/prometheus/prometheus.yml:ro
    - ../monitoring/openappsec-alerts.yml:/etc/prometheus/openappsec-alerts.yml:ro
    - prometheus-data:/prometheus
    networks:
    - openappsec-network
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:9090/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
  grafana:
    image: grafana/grafana:latest
    container_name: openappsec-grafana
    restart: always
    ports:
    - 3000:3000
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
    - grafana-data:/var/lib/grafana
    - ../monitoring/grafana-openappsec-dashboard.json:/etc/grafana/provisioning/dashboards/openappsec.json:ro
    networks:
    - openappsec-network
    depends_on:
    - prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: component,environment
networks:
  openappsec-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.28.0.0/16
volumes:
  openappsec-agent-1-data:
    driver: local
  openappsec-agent-2-data:
    driver: local
  openappsec-management-data:
    driver: local
  postgres-data:
    driver: local
  postgres-backups:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
