name: Mobile Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'frontend/mobile-*/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'frontend/mobile-*/**'
  schedule:
    # Run weekly security scan
    - cron: '0 0 * * 0'

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  # Static Application Security Testing (SAST)
  sast-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd mobile/mobile-pwa && npm ci
          cd ../mobile-native-enhanced && npm ci

      # ESLint Security Plugin
      - name: Run ESLint Security
        run: |
          npm install -g eslint eslint-plugin-security
          cd mobile/mobile-pwa && npx eslint --ext .ts,.tsx src/ --format json > eslint-security-report.json || true
          cd ../mobile-native-enhanced && npx eslint --ext .ts,.tsx src/ --format json > eslint-security-report.json || true

      # Semgrep SAST
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/react
            p/react-native
            p/security-audit
            p/secrets
            p/owasp-top-ten
          generateSarif: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep.sarif
        if: always()

      # CodeQL Analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # Dependency Vulnerability Scan
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm audit
      - name: Run npm audit (PWA)
        run: |
          cd mobile/mobile-pwa
          npm audit --json > npm-audit-pwa.json || true
          npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (Native)
        run: |
          cd mobile/mobile-native-enhanced
          npm audit --json > npm-audit-native.json || true
          npm audit --audit-level=high
        continue-on-error: true

      # Snyk vulnerability scan
      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
        continue-on-error: true

      # OWASP Dependency Check
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'agent-banking-mobile'
          path: 'mobile/'
          format: 'HTML'
          out: 'dependency-check-report'

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/

  # Secret Detection
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TruffleHog
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # Android Security Scan
  android-security:
    name: Android Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd mobile/mobile-native-enhanced
          npm ci

      - name: Build Android APK
        run: |
          cd mobile/mobile-native-enhanced/android
          ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      # MobSF Static Analysis
      - name: Run MobSF Analysis
        uses: fundacaocerti/mobsf-action@v1
        with:
          INPUT_FILE_NAME: mobile/mobile-native-enhanced/android/app/build/outputs/apk/release/app-release.apk
          SCAN_TYPE: apk
          OUTPUT_FILE_NAME: mobsf-android-report
        continue-on-error: true

      - name: Upload MobSF Report
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-android-report
          path: mobsf-android-report/
        if: always()

  # iOS Security Scan
  ios-security:
    name: iOS Security Scan
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd mobile/mobile-native-enhanced
          npm ci

      - name: Install CocoaPods
        run: |
          cd mobile/mobile-native-enhanced/ios
          pod install

      # Build iOS for analysis
      - name: Build iOS
        run: |
          cd mobile/mobile-native-enhanced/ios
          xcodebuild -workspace AgentBanking.xcworkspace \
            -scheme AgentBanking \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
        continue-on-error: true

      # Swift security linting
      - name: Run SwiftLint Security
        run: |
          brew install swiftlint
          cd mobile/mobile-native-enhanced/ios
          swiftlint lint --reporter json > swiftlint-report.json || true

      - name: Upload SwiftLint Report
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: mobile/mobile-native-enhanced/ios/swiftlint-report.json
        if: always()

  # License Compliance
  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check PWA licenses
        run: |
          cd mobile/mobile-pwa
          npm ci
          license-checker --json > licenses-pwa.json
          license-checker --failOn "GPL;AGPL;LGPL" || echo "License check completed with warnings"

      - name: Check Native licenses
        run: |
          cd mobile/mobile-native-enhanced
          npm ci
          license-checker --json > licenses-native.json
          license-checker --failOn "GPL;AGPL;LGPL" || echo "License check completed with warnings"

      - name: Upload License Reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            mobile/mobile-pwa/licenses-pwa.json
            mobile/mobile-native-enhanced/licenses-native.json

  # Security Report Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, secret-scan, android-security, ios-security, license-scan]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate Summary
        run: |
          echo "# Mobile Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Scan | ${{ needs.sast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Security | ${{ needs.android-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Security | ${{ needs.ios-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Reports" >> $GITHUB_STEP_SUMMARY
          echo "Security reports are available as artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::warning::One or more security scans failed. Please review the reports."

      - name: Notify on critical findings
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 Mobile Security Scan Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Mobile Security Scan Failed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
        continue-on-error: true
