apiVersion: v2
name: remittance-platform
description: Nigerian Remittance Platform - Complete Full-Stack Application
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - remittance
  - fintech
  - payments
  - nigeria

maintainers:
  - name: Platform Team
    email: platform@remittance.com

dependencies:
  - name: postgresql
    version: 12.1.9
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  
  - name: redis
    version: 17.3.14
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  
  - name: kafka
    version: 20.0.6
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  
  - name: temporal
    version: 0.20.0
    repository: https://temporalio.github.io/helm-charts
    condition: temporal.enabled
