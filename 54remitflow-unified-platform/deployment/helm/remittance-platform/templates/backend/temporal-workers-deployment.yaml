{{- if .Values.backend.temporal_workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remittance-platform.fullname" . }}-temporal-workers
  labels:
    {{- include "remittance-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-workers
spec:
  replicas: {{ .Values.backend.temporal_workers.replicaCount }}
  selector:
    matchLabels:
      {{- include "remittance-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-workers
  template:
    metadata:
      labels:
        {{- include "remittance-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-workers
    spec:
      containers:
      - name: temporal-worker
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.temporal_workers.image.repository }}:{{ .Values.backend.temporal_workers.image.tag }}"
        imagePullPolicy: {{ .Values.backend.temporal_workers.image.pullPolicy }}
        env:
        - name: TEMPORAL_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "remittance-platform.fullname" . }}-config
              key: temporal-host
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "remittance-platform.fullname" . }}-secrets
              key: database-url
        resources:
          {{- toYaml .Values.backend.temporal_workers.resources | nindent 12 }}
{{- end }}
