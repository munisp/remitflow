apiVersion: v1
kind: Service
metadata:
  name: {{ include "remittance-platform.fullname" . }}-pwa
  labels:
    {{- include "remittance-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: pwa
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "remittance-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pwa
