{{- if .Values.pwa.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "remittance-platform.fullname" . }}-pwa
  labels:
    {{- include "remittance-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "remittance-platform.fullname" . }}-pwa
  minReplicas: {{ .Values.pwa.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.pwa.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.pwa.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
