apiVersion: v1
kind: Secret
metadata:
  name: {{ include "remittance-platform.fullname" . }}-secrets
  labels:
    {{- include "remittance-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  database-url: {{ printf "postgresql://remittance_admin:%s@postgresql:5432/remittance_prod" .Values.secrets.postgresPassword | quote }}
  redis-password: {{ required "secrets.redisPassword is required" .Values.secrets.redisPassword | quote }}
  redis-url: {{ printf "redis://:%s@redis-master:6379/0" .Values.secrets.redisPassword | quote }}
  jwt-secret-key: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  encryption-key: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | default "" | quote }}
  wise-api-key: {{ .Values.secrets.wiseApiKey | default "" | quote }}
  remitly-api-key: {{ .Values.secrets.remitlyApiKey | default "" | quote }}
  stripe-api-key: {{ .Values.secrets.stripeApiKey | default "" | quote }}
  paystack-secret-key: {{ .Values.secrets.paystackSecretKey | default "" | quote }}
  flutterwave-secret-key: {{ .Values.secrets.flutterwaveSecretKey | default "" | quote }}
  twilio-account-sid: {{ .Values.secrets.twilioAccountSid | default "" | quote }}
  twilio-auth-token: {{ .Values.secrets.twilioAuthToken | default "" | quote }}
  sendgrid-api-key: {{ .Values.secrets.sendgridApiKey | default "" | quote }}
  firebase-server-key: {{ .Values.secrets.firebaseServerKey | default "" | quote }}
  africas-talking-api-key: {{ .Values.secrets.africasTalkingApiKey | default "" | quote }}
  africas-talking-username: {{ .Values.secrets.africasTalkingUsername | default "" | quote }}
  circle-api-key: {{ .Values.secrets.circleApiKey | default "" | quote }}
  infura-project-id: {{ .Values.secrets.infuraProjectId | default "" | quote }}
  alchemy-api-key: {{ .Values.secrets.alchemyApiKey | default "" | quote }}
  interswitch-client-id: {{ .Values.secrets.interswitchClientId | default "" | quote }}
  nibss-api-key: {{ .Values.secrets.nibssApiKey | default "" | quote }}
  paystack-webhook-secret: {{ .Values.secrets.paystackWebhookSecret | default "" | quote }}
  flutterwave-webhook-secret: {{ .Values.secrets.flutterwaveWebhookSecret | default "" | quote }}
  stripe-webhook-secret: {{ .Values.secrets.stripeWebhookSecret | default "" | quote }}
  wise-webhook-secret: {{ .Values.secrets.wiseWebhookSecret | default "" | quote }}
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | default "" | quote }}
  aws-secret-access-key: {{ .Values.secrets.awsSecretAccessKey | default "" | quote }}
  vault-token: {{ .Values.vault.token | default "" | quote }}
  kafka-bootstrap-servers: "kafka:9092"
  temporal-host: "temporal-frontend:7233"
