{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "remittance-platform.fullname" . }}-db-backup
  labels:
    {{- include "remittance-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: db-backup
              image: {{ .Values.backup.image }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/tmp/remitflow_backup_${TIMESTAMP}.sql.gz"
                  echo "[backup] Starting backup at ${TIMESTAMP}"
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    -h postgresql \
                    -U remittance_admin \
                    -d remittance_prod \
                    --no-password \
                    --format=custom \
                    --compress=9 \
                    | gzip > "${BACKUP_FILE}"
                  echo "[backup] Backup created: ${BACKUP_FILE}"
                  apk add --no-cache aws-cli
                  aws s3 cp "${BACKUP_FILE}" \
                    "s3://{{ .Values.backup.s3Bucket }}/postgres/${TIMESTAMP}.sql.gz" \
                    --region {{ .Values.backup.s3Region }}
                  echo "[backup] Uploaded to S3 successfully"
                  aws s3 ls "s3://{{ .Values.backup.s3Bucket }}/postgres/" \
                    --region {{ .Values.backup.s3Region }} \
                    | sort -r \
                    | tail -n +{{ add .Values.backup.retentionDays 1 }} \
                    | awk '{print $4}' \
                    | xargs -I{} aws s3 rm "s3://{{ .Values.backup.s3Bucket }}/postgres/{}" \
                      --region {{ .Values.backup.s3Region }} || true
                  echo "[backup] Cleanup completed"
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "remittance-platform.fullname" . }}-secrets
                      key: postgres-password
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "remittance-platform.fullname" . }}-secrets
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "remittance-platform.fullname" . }}-secrets
                      key: aws-secret-access-key
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 500m
{{- end }}
