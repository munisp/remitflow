global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'temporal-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Temporal Server metrics
  - job_name: 'temporal-server'
    static_configs:
      - targets:
          - 'temporal-frontend:9090'
          - 'temporal-history:9090'
          - 'temporal-matching:9090'
          - 'temporal-worker:9090'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'temporal_.*'
        action: keep

  # Temporal Workers metrics
  - job_name: 'temporal-workers'
    static_configs:
      - targets:
          - 'payment-worker:9091'
          - 'kyc-worker:9092'
          - 'fraud-worker:9093'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(temporal_|workflow_|activity_).*'
        action: keep

  # PostgreSQL metrics
  - job_name: 'postgresql'
    static_configs:
      - targets:
          - 'temporal-postgresql:9187'

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

