#
# APISIX Dashboard Configuration
#

conf:
  listen:
    host: 0.0.0.0
    port: 9000
  
  # etcd configuration
  etcd:
    endpoints:
      - "http://etcd:2379"
    prefix: "/apisix"
    mtls:
      key_file: ""
      cert_file: ""
      ca_file: ""
  
  # Log configuration
  log:
    error_log:
      level: warn
      file_path: /tmp/error.log
    access_log:
      file_path: /tmp/access.log
  
  # Security
  security:
    content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
  
  # Authentication
  authentication:
    secret: ${DASHBOARD_SECRET:-secret}
    expire_time: 3600
    users:
      - username: admin
        password: ${DASHBOARD_ADMIN_PASSWORD:-admin}
      - username: user
        password: ${DASHBOARD_USER_PASSWORD:-user}


