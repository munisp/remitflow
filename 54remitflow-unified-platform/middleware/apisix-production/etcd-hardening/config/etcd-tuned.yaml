# etcd Performance Tuning Configuration
# Optimized for production workloads with APISIX

# Storage Configuration
storage:
  # Backend storage quota (8GB)
  quota-backend-bytes: 8589934592
  
  # Auto-compaction (periodic mode, every hour)
  auto-compaction-mode: periodic
  auto-compaction-retention: "1h"
  
  # Snapshot count (trigger snapshot after 10,000 transactions)
  snapshot-count: 10000
  
  # Maximum request size (32MB)
  max-request-bytes: 33554432

# Cluster Configuration
cluster:
  # Heartbeat interval (100ms)
  heartbeat-interval: 100
  
  # Election timeout (1000ms)
  election-timeout: 1000
  
  # Enable strict reconfiguration check
  strict-reconfig-check: true

# Network Configuration
network:
  # Max concurrent streams per connection
  max-concurrent-streams: 128
  
  # Keep-alive time (30s)
  keep-alive-time: 30s
  
  # Keep-alive timeout (10s)
  keep-alive-timeout: 10s

# Performance Tuning
performance:
  # Enable pprof for profiling
  enable-pprof: true
  
  # Metrics level (basic, extensive)
  metrics: extensive
  
  # Enable v2 deprecation warnings
  enable-v2: false

# Logging Configuration
logging:
  # Log level (debug, info, warn, error, panic, fatal)
  log-level: info
  
  # Log format (json, console)
  log-outputs: ["stderr"]
  logger: zap
  
  # Enable access log
  enable-log-rotation: true
  log-rotation-config-json: '{"maxsize": 100, "maxage": 7, "maxbackups": 3, "localtime": true, "compress": true}'

# Security Configuration
security:
  # Client certificate authentication
  client-cert-auth: true
  
  # Peer certificate authentication
  peer-client-cert-auth: true
  
  # Cipher suites (TLS 1.2+)
  cipher-suites:
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
  
  # Minimum TLS version
  tls-min-version: TLS1.2

# Resource Limits (for Kubernetes)
resources:
  requests:
    memory: "2Gi"
    cpu: "1000m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

# Health Check Configuration
health:
  # Health check interval
  health-check-interval: 10s
  
  # Health check timeout
  health-check-timeout: 5s

# Backup Configuration
backup:
  # Backup schedule (cron format)
  schedule: "0 2 * * *"  # Daily at 2 AM
  
  # Backup retention (days)
  retention-days: 30
  
  # Backup compression
  compression: true
  
  # S3 backup (optional)
  s3:
    enabled: false
    bucket: "your-bucket-name"
    region: "us-east-1"
    prefix: "etcd-backups/"

# Monitoring Configuration
monitoring:
  # Prometheus metrics
  metrics-port: 2379
  
  # Enable detailed metrics
  enable-grpc-gateway: true
  
  # Alert thresholds
  alerts:
    disk-usage-threshold: 80  # percent
    latency-threshold: 100     # milliseconds
    leader-changes-threshold: 3  # per hour

# Advanced Tuning
advanced:
  # Backend batch interval (10ms)
  backend-batch-interval: 10ms
  
  # Backend batch limit (10,000)
  backend-batch-limit: 10000
  
  # Max TxN ops (128)
  max-txn-ops: 128
  
  # Max request bytes (1.5MB)
  max-request-bytes: 1572864
  
  # Socket receive buffer size (8MB)
  socket-reuse-port: true
  socket-reuse-address: true

# Experimental Features
experimental:
  # Enable distributed tracing
  enable-distributed-tracing: false
  
  # Enable gRPC logging
  enable-grpc-logging: false
  
  # Compact hash check enabled
  compact-hash-check-enabled: true
  
  # Compact hash check time (1m)
  compact-hash-check-time: "1m"

