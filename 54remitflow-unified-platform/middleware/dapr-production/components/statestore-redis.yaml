apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: remittance-platform
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: redisPassword
    secretKeyRef:
      name: redis-secret
      key: password
  - name: enableTLS
    value: "true"
  - name: failover
    value: "true"
  - name: sentinelMasterName
    value: "mymaster"
  - name: maxRetries
    value: "3"
  - name: maxRetryBackoff
    value: "2s"
  - name: ttlInSeconds
    value: "3600"
  - name: queryIndexes
    value: |
      [
        {
          "name": "user_id",
          "indexes": ["user_id"]
        },
        {
          "name": "transaction_id", 
          "indexes": ["transaction_id"]
        }
      ]
scopes:
- payment-service
- user-service
- fraud-detection

