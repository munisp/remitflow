# Fluvio Helm Chart Values

replicaCount:
  sc: 1
  spu: 3

image:
  repository: infinyon/fluvio
  tag: latest
  pullPolicy: Always

resources:
  sc:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  spu:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

storage:
  storageClass: fast-ssd
  sc:
    size: 100Gi
  spu:
    size: 100Gi

monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9091
  grafana:
    enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
