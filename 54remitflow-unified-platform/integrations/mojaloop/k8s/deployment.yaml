apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-hub
  namespace: payment-systems
  labels:
    app: mojaloop-hub
    component: payment-switch
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mojaloop-hub
  template:
    metadata:
      labels:
        app: mojaloop-hub
        component: payment-switch
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mojaloop-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      - name: wait-for-database
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            until pg_isready -h ${DATABASE_HOST} -p ${DATABASE_PORT} -U ${DATABASE_USER}; do
              echo "Waiting for database..."
              sleep 2
            done
        env:
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: database.host
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: database.port
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: mojaloop-secrets
              key: database.user
      
      - name: wait-for-tigerbeetle
        image: curlimages/curl:latest
        command:
          - sh
          - -c
          - |
            until curl -f http://tigerbeetle-0.tigerbeetle:3000/health; do
              echo "Waiting for TigerBeetle..."
              sleep 2
            done
      
      containers:
      - name: mojaloop-hub
        image: nigerian-remittance/mojaloop-hub:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 9000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mojaloop-secrets
              key: database.url
        - name: DATABASE_POOL_MIN
          value: "5"
        - name: DATABASE_POOL_MAX
          value: "20"
        
        # TigerBeetle configuration
        - name: TIGERBEETLE_CLUSTER_ID
          value: "1"
        - name: TIGERBEETLE_ADDRESS_1
          value: "tigerbeetle-0.tigerbeetle:3000"
        - name: TIGERBEETLE_ADDRESS_2
          value: "tigerbeetle-1.tigerbeetle:3000"
        - name: TIGERBEETLE_ADDRESS_3
          value: "tigerbeetle-2.tigerbeetle:3000"
        
        # Kafka configuration
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: kafka.brokers
        - name: KAFKA_TOPIC_PREFIX
          value: "mojaloop"
        
        # Temporal configuration
        - name: TEMPORAL_HOST
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: temporal.host
        - name: TEMPORAL_NAMESPACE
          value: "mojaloop"
        
        # Payment system integrations
        - name: PAPSS_API_URL
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: papss.api.url
        - name: PIX_API_URL
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: pix.api.url
        - name: CIPS_API_URL
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: cips.api.url
        - name: UPI_API_URL
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: upi.api.url
        
        # UPI specific
        - name: UPI_MERCHANT_ID
          valueFrom:
            secretKeyRef:
              name: mojaloop-secrets
              key: upi.merchant.id
        - name: UPI_MERCHANT_KEY
          valueFrom:
            secretKeyRef:
              name: mojaloop-secrets
              key: upi.merchant.key
        
        # Application configuration
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENVIRONMENT
          value: "production"
        - name: PORT
          value: "8080"
        - name: METRICS_PORT
          value: "9090"
        
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      
      # TigerBeetle Go service sidecar
      - name: tigerbeetle-service
        image: nigerian-remittance/tigerbeetle-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        - name: metrics
          containerPort: 9091
          protocol: TCP
        
        env:
        - name: TIGERBEETLE_ADDRESS_1
          value: "tigerbeetle-0.tigerbeetle:3000"
        - name: TIGERBEETLE_ADDRESS_2
          value: "tigerbeetle-1.tigerbeetle:3000"
        - name: TIGERBEETLE_ADDRESS_3
          value: "tigerbeetle-2.tigerbeetle:3000"
        - name: PORT
          value: "8081"
        
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
      
      terminationGracePeriodSeconds: 30
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mojaloop-hub
              topologyKey: kubernetes.io/hostname
      
      tolerations:
      - key: "payment-systems"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upi-integration
  namespace: payment-systems
  labels:
    app: upi-integration
    component: payment-system
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: upi-integration
  template:
    metadata:
      labels:
        app: upi-integration
        component: payment-system
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mojaloop-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: upi-service
        image: nigerian-remittance/upi-integration:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8082
          protocol: TCP
        - name: metrics
          containerPort: 9092
          protocol: TCP
        
        env:
        - name: NPCI_API_URL
          valueFrom:
            configMapKeyRef:
              name: mojaloop-config
              key: upi.api.url
        - name: UPI_MERCHANT_ID
          valueFrom:
            secretKeyRef:
              name: mojaloop-secrets
              key: upi.merchant.id
        - name: UPI_MERCHANT_KEY
          valueFrom:
            secretKeyRef:
              name: mojaloop-secrets
              key: upi.merchant.key
        - name: MOJALOOP_HUB_URL
          value: "http://mojaloop-hub:8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mojaloop-secrets
              key: database.url
        - name: PORT
          value: "8082"
        - name: LOG_LEVEL
          value: "INFO"
        
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - upi-integration
              topologyKey: kubernetes.io/hostname

