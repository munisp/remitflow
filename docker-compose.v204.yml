networks:
  remitflow-net:
    external: true

services:
  # ─── Go XOF Adapter (West African Corridors) ─────────────────────────────────
  go-xof-adapter:
    build:
      context: ./services/go-xof-adapter
      dockerfile: Dockerfile
    image: remitflow/go-xof-adapter:v204
    container_name: go-xof-adapter
    ports:
      - "8095:8095"
    environment:
      PORT: "8095"
      MOJALOOP_HUB_URL: "http://mojaloop-hub:3000"
      REDIS_URL: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      DAPR_HTTP_PORT: "3500"
      LOG_LEVEL: "info"
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - redis
      - kafka

  go-xof-adapter-dapr:
    image: daprio/daprd:1.12.0
    container_name: go-xof-adapter-dapr
    command:
      - "./daprd"
      - "--app-id=go-xof-adapter"
      - "--app-port=8095"
      - "--dapr-http-port=3500"
      - "--components-path=/components"
      - "--config=/config/dapr-config.yaml"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config:/config
    network_mode: "service:go-xof-adapter"
    depends_on:
      - go-xof-adapter

  # ─── Go Correspondent Manager ─────────────────────────────────────────────────
  go-correspondent-manager:
    build:
      context: ./services/go-correspondent-manager
      dockerfile: Dockerfile
    image: remitflow/go-correspondent-manager:v204
    container_name: go-correspondent-manager
    ports:
      - "8096:8096"
    environment:
      PORT: "8096"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3000"
      DAPR_HTTP_PORT: "3500"
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8096/health"]
