version: "3.9"

# v200 Gap Microservices — Docker Compose
# Includes: Go, Rust, Python services + Dapr sidecars + health checks
# Network: remitflow-net (shared with main docker-compose.yml)

  go-apisix-config:
    build:
      context: ./services/go-apisix-config
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    networks:
      - remitflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

