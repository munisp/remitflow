# RemitFlow Helm Chart — Default Values
# ═══════════════════════════════════════════════════════════════════════════════
# Override per environment: values-staging.yaml, values-production.yaml

global:
  namespace: remitflow
  imageRegistry: ghcr.io/remitflow
  imagePullSecrets:
    - name: ghcr-credentials
  environment: production

# ─── API Server ────────────────────────────────────────────────────────────────

api:
  replicaCount: 3
  image:
    repository: remitflow-api
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  port: 5000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    OTEL_SERVICE_NAME: remitflow-api
    OTEL_EXPORTER_TYPE: otlp
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  secrets:
    databaseUrl: remitflow-db-secrets
    redisUrl: remitflow-redis-secrets
    jwtSecret: remitflow-jwt-secret
    stripeKey: remitflow-stripe-secrets
  healthCheck:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /readiness
      initialDelaySeconds: 5
      periodSeconds: 5

# ─── Go Services ───────────────────────────────────────────────────────────────

goServices:
  transferEngine:
    enabled: true
    replicaCount: 2
    image:
      repository: go-transfer-engine
      tag: "2.0.0"
    port: 8080
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 15
      targetCPUUtilization: 60

  failureMonitor:
    enabled: true
    replicaCount: 1
    image:
      repository: go-failure-monitor
      tag: "2.0.0"
    port: 8090
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    env:
      BNPL_LATE_FEE_RATE: "0.02"
      STUCK_TRANSFER_HOURS: "48"
      AUTO_REFUND_DAYS: "7"
      MORTGAGE_FORECLOSURE_MISS_COUNT: "3"

  escrowMonitor:
    enabled: true
    replicaCount: 1
    image:
      repository: go-escrow-monitor
      tag: "2.0.0"
    port: 8091
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  fxAggregator:
    enabled: true
    replicaCount: 2
    image:
      repository: go-fx-aggregator
      tag: "2.0.0"
    port: 8082
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }

  ratelimit:
    enabled: true
    replicaCount: 2
    image:
      repository: go-ratelimit
      tag: "2.0.0"
    port: 8087
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

# ─── Rust Services ─────────────────────────────────────────────────────────────

rustServices:
  escrowLedger:
    enabled: true
    replicaCount: 2
    image:
      repository: rust-escrow-ledger
      tag: "2.0.0"
    port: 8096
    resources:
      requests: { cpu: 200m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilization: 60

  feeEngine:
    enabled: true
    replicaCount: 2
    image:
      repository: rust-fee-engine
      tag: "2.0.0"
    port: 8095
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }

  agentReconciliation:
    enabled: true
    replicaCount: 1
    image:
      repository: rust-agent-reconciliation
      tag: "2.0.0"
    port: 8098
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    env:
      LARGE_TX_THRESHOLD_NGN: "500000"
      HIGH_TX_COUNT_THRESHOLD: "200"

  pqCrypto:
    enabled: true
    replicaCount: 2
    image:
      repository: rust-pq-crypto
      tag: "2.0.0"
    port: 8097
    resources:
      requests: { cpu: 200m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 256Mi }

# ─── Python ML Services ────────────────────────────────────────────────────────

pythonServices:
  gnnFraud:
    enabled: true
    replicaCount: 2
    image:
      repository: python-gnn-fraud
      tag: "2.0.0"
    port: 8088
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 2000m, memory: 4Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilization: 60

  fxForecasting:
    enabled: true
    replicaCount: 1
    image:
      repository: python-fx-forecasting
      tag: "2.0.0"
    port: 8089
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 2000m, memory: 4Gi }

  investmentRisk:
    enabled: true
    replicaCount: 1
    image:
      repository: python-investment-risk
      tag: "2.0.0"
    port: 8099
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }

  propertyRisk:
    enabled: true
    replicaCount: 1
    image:
      repository: python-property-risk
      tag: "2.0.0"
    port: 8100
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }

# ─── Infrastructure ────────────────────────────────────────────────────────────

pgbouncer:
  enabled: true
  replicaCount: 2
  poolMode: transaction
  maxClientConn: 2000
  defaultPoolSize: 25
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

postgresql:
  enabled: false  # Use external managed PostgreSQL in production
  externalHost: ""
  externalPort: 5432
  auth:
    existingSecret: remitflow-db-secrets

redis:
  enabled: true
  architecture: replication
  replica:
    replicaCount: 2
  auth:
    existingSecret: remitflow-redis-secrets
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

kafka:
  enabled: true
  replicaCount: 3
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 4Gi }

# ─── Observability ─────────────────────────────────────────────────────────────

observability:
  otelCollector:
    enabled: true
    endpoint: http://otel-collector:4318
  prometheus:
    enabled: true
    serviceMonitor: true
  grafana:
    enabled: true
    dashboards: true

# ─── Ingress ───────────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit-rps: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.remitflow.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: remitflow-tls
      hosts:
        - api.remitflow.io

# ─── Network Policies ──────────────────────────────────────────────────────────

networkPolicies:
  enabled: true
  allowIngressFrom:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx

# ─── Pod Disruption Budgets ────────────────────────────────────────────────────

podDisruptionBudget:
  api:
    minAvailable: 2
  transferEngine:
    minAvailable: 1
  escrowLedger:
    minAvailable: 1
  pgbouncer:
    minAvailable: 1
