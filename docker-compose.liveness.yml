##############################################################################
# RemitFlow — Liveness & Anti-Spoofing Service Stack
#
# Starts three cooperating services:
#   1. python-kyc-liveness   (port 8090) — passive liveness, face matching,
#                                          68-pt landmarks, anti-spoofing
#   2. rust-liveness-proxy   (port 8096) — fail-closed circuit-breaker proxy
#                                          in front of python-kyc-liveness
#   3. python-deepfake       (port 8097) — HuggingFace ViT deepfake detector
#                                          + DCT frequency + landmark fallbacks
#
# Usage:
#   docker compose -f docker-compose.liveness.yml up -d
#   docker compose -f docker-compose.liveness.yml logs -f
#   docker compose -f docker-compose.liveness.yml down
#
# Environment variables can be overridden in a .env file or via the shell.
##############################################################################

version: "3.9"

networks:
  liveness-net:
    driver: bridge

volumes:
  hf-model-cache:   # Shared HuggingFace model cache across restarts

services:

  # ── 1. Python KYC Liveness Service ────────────────────────────────────────
  python-kyc-liveness:
    build:
      context: ./services/python-kyc-liveness
      dockerfile: Dockerfile
    container_name: remitflow-kyc-liveness
    restart: unless-stopped
    networks: [liveness-net]
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      # Passive liveness thresholds
      LIVENESS_CONFIDENCE_THRESHOLD: "${LIVENESS_CONFIDENCE_THRESHOLD:-0.65}"
      FACE_MATCH_THRESHOLD: "${FACE_MATCH_THRESHOLD:-0.75}"
      # Anti-spoofing attack detection
      ENABLE_PRINTED_PHOTO_DETECTION: "true"
      ENABLE_SCREEN_REPLAY_DETECTION: "true"
      ENABLE_PAPER_MASK_DETECTION: "true"
      ENABLE_3D_MASK_DETECTION: "true"
      ENABLE_DEEPFAKE_DETECTION: "false"   # Handled by python-deepfake service
      # Active liveness
      ENABLE_ACTIVE_LIVENESS: "true"
      ACTIVE_LIVENESS_BLINK_THRESHOLD: "0.25"
      ACTIVE_LIVENESS_HEAD_MOVEMENT_DEG: "15"
      # Event publishing
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-}"
      KAFKA_LIVENESS_TOPIC: "kyc.liveness.events"
      # Database persistence
      DATABASE_URL: "${DATABASE_URL:-}"
      # Rate limiting
      RATE_LIMIT_RPM: "60"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── 2. Rust Liveness Proxy (fail-closed circuit breaker) ─────────────────
  rust-liveness-proxy:
    build:
      context: ./services/rust-liveness-proxy
      dockerfile: Dockerfile
    container_name: remitflow-liveness-proxy
    restart: unless-stopped
    networks: [liveness-net]
    ports:
      - "8096:8096"
    depends_on:
      python-kyc-liveness:
        condition: service_healthy
    environment:
      PORT: "8096"
      # Upstream: the Python liveness service (internal network address)
      UPSTREAM_URL: "http://python-kyc-liveness:8090"
      # Circuit breaker settings
      CIRCUIT_BREAKER_THRESHOLD: "${CB_THRESHOLD:-3}"      # failures before open
      CIRCUIT_BREAKER_TIMEOUT_SEC: "${CB_TIMEOUT:-30}"     # seconds before half-open
      # Rate limiting (per user_id)
      RATE_LIMIT_RPM: "${PROXY_RATE_LIMIT_RPM:-20}"
      # Request timeout to upstream
      UPSTREAM_TIMEOUT_MS: "${UPSTREAM_TIMEOUT_MS:-8000}"
      # Fail-closed: when circuit is open, return passed=false (blocks KYC)
      FAIL_CLOSED: "true"
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 3. Python Deepfake Detector ───────────────────────────────────────────
  python-deepfake:
    build:
      context: ./services/python-deepfake-detector
      dockerfile: Dockerfile
    container_name: remitflow-deepfake-detector
    restart: unless-stopped
    networks: [liveness-net]
    ports:
      - "8097:8097"
    volumes:
      # Persist downloaded HuggingFace models across container restarts
      - hf-model-cache:/root/.cache/huggingface
    environment:
      PORT: "8097"
      # Primary detector: HuggingFace ViT model
      HF_DEEPFAKE_MODEL_ID: "${HF_DEEPFAKE_MODEL_ID:-Wvolf/ViT-L_Deepfake_Detection}"
      DEEPFAKE_CONFIDENCE_THRESHOLD: "${DEEPFAKE_CONFIDENCE_THRESHOLD:-0.55}"
      # Fallback detectors (used when HF model is unavailable)
      ENABLE_FREQUENCY_FALLBACK: "true"    # DCT checkerboard artifact detection
      ENABLE_LANDMARK_FALLBACK: "true"     # MediaPipe 68-pt landmark consistency
      # GPU acceleration (set to "true" if CUDA is available)
      USE_GPU: "${USE_GPU:-false}"
      # Rate limiting
      RATE_LIMIT_RPM: "${DEEPFAKE_RATE_LIMIT_RPM:-20}"
      MAX_BATCH_SIZE: "8"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 15s   # Model loading can be slow
      retries: 5
      start_period: 60s  # Allow time for model download on first start
    # Uncomment to enable GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── 4. Go Liveness Score Aggregator ──────────────────────────────────────
  go-liveness-aggregator:
    build:
      context: ./services/go-liveness-aggregator
      dockerfile: Dockerfile
    container_name: remitflow-liveness-aggregator
    restart: unless-stopped
    networks: [liveness-net]
    ports:
      - "8098:8098"          # HTTP: /healthz, /metrics, /stats/hourly
    depends_on:
      python-kyc-liveness:
        condition: service_healthy
    environment:
      # PostgreSQL connection (same DB as the Node.js app)
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/remitflow?sslmode=disable}"
      # Kafka broker(s) — comma-separated
      KAFKA_BROKERS: "${KAFKA_BROKERS:-localhost:9092}"
      # HTTP server address
      HTTP_ADDR: ":8098"
      # Logging
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8098/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
