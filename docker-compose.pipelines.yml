# RemitFlow v89 — Data Pipeline Services
# Apache NiFi, Apache Airflow, dbt, and supporting infrastructure
#
# Usage:
#   Start all pipeline services:
#     docker compose -f docker-compose.yml -f docker-compose.pipelines.yml up -d
#
#   Start only pipeline services:
#     docker compose -f docker-compose.pipelines.yml up -d
#
# Default credentials:
#   NiFi:    https://localhost:8443  (admin / remitflow_nifi_admin_2024)
#   Airflow: http://localhost:8080   (admin / remitflow_airflow_admin_2024)
#   dbt:     http://localhost:8088   (docs server — read-only)

version: "3.9"

networks:
  remitflow-pipelines:
    name: remitflow-pipelines
    driver: bridge

volumes:
  nifi_conf:
  nifi_logs:
  nifi_state:
  nifi_database:
  airflow_logs:
  airflow_dags:
  airflow_plugins:
  dbt_profiles:
  dbt_project:
  postgres_airflow:

services:
  # ─── Apache NiFi ────────────────────────────────────────────────────────────
  nifi:
    image: apache/nifi:1.25.0
    container_name: remitflow-nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: remitflow_nifi_admin_2024
      NIFI_SENSITIVE_PROPS_KEY: remitflow_nifi_sensitive_key_2024
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 2g
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - ./nifi/flow-templates:/opt/nifi/nifi-current/conf/templates
    networks:
      - remitflow-pipelines
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── Airflow PostgreSQL Backend ──────────────────────────────────────────────
  airflow-postgres:
    image: postgres:15-alpine
    container_name: remitflow-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: remitflow_airflow_pg_2024
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow:/var/lib/postgresql/data
    networks:
      - remitflow-pipelines
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Airflow Init ────────────────────────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: remitflow-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:remitflow_airflow_pg_2024@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "remitflow_airflow_fernet_key_base64_2024=="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: remitflow_airflow_webserver_secret_2024
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: remitflow_airflow_admin_2024
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./airflow/dags:/opt/airflow/dags/remitflow
    networks:
      - remitflow-pipelines
    command: version
    entrypoint: /bin/bash -c "airflow db migrate && airflow users create --username admin --firstname RemitFlow --lastname Admin --role Admin --email admin@remitflow.io --password remitflow_airflow_admin_2024 || true"

  # ─── Airflow Webserver ───────────────────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: remitflow-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:remitflow_airflow_pg_2024@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "remitflow_airflow_fernet_key_base64_2024=="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: remitflow_airflow_webserver_secret_2024
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_CONN_REMITFLOW_DB: "postgresql://remitflow:remitflow_db_2024@host.docker.internal:5432/remitflow"
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./airflow/dags:/opt/airflow/dags/remitflow
    networks:
      - remitflow-pipelines
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Airflow Scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: remitflow-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:remitflow_airflow_pg_2024@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "remitflow_airflow_fernet_key_base64_2024=="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: remitflow_airflow_webserver_secret_2024
      AIRFLOW_CONN_REMITFLOW_DB: "postgresql://remitflow:remitflow_db_2024@host.docker.internal:5432/remitflow"
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ./airflow/dags:/opt/airflow/dags/remitflow
    networks:
      - remitflow-pipelines
    command: scheduler

  # ─── dbt Core + Docs Server ──────────────────────────────────────────────────
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.0
    container_name: remitflow-dbt
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      DBT_PROFILES_DIR: /dbt/profiles
      DBT_PROJECT_DIR: /dbt/project
      REMITFLOW_DB_HOST: host.docker.internal
      REMITFLOW_DB_PORT: "5432"
      REMITFLOW_DB_NAME: remitflow
      REMITFLOW_DB_USER: remitflow
      REMITFLOW_DB_PASS: remitflow_db_2024
      REMITFLOW_DB_SCHEMA: public
    volumes:
      - dbt_profiles:/dbt/profiles
      - dbt_project:/dbt/project
      - ./dbt:/dbt/project
      - ./dbt/profiles:/dbt/profiles
    networks:
      - remitflow-pipelines
    command: >
      sh -c "dbt deps --project-dir /dbt/project --profiles-dir /dbt/profiles 2>/dev/null || true &&
             dbt docs generate --project-dir /dbt/project --profiles-dir /dbt/profiles 2>/dev/null || true &&
             dbt docs serve --host 0.0.0.0 --port 8088 --project-dir /dbt/project --profiles-dir /dbt/profiles"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── dbt Scheduler (runs models on schedule) ─────────────────────────────────
  dbt-scheduler:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.0
    container_name: remitflow-dbt-scheduler
    restart: unless-stopped
    depends_on:
      - dbt
    environment:
      DBT_PROFILES_DIR: /dbt/profiles
      DBT_PROJECT_DIR: /dbt/project
      REMITFLOW_DB_HOST: host.docker.internal
      REMITFLOW_DB_PORT: "5432"
      REMITFLOW_DB_NAME: remitflow
      REMITFLOW_DB_USER: remitflow
      REMITFLOW_DB_PASS: remitflow_db_2024
      REMITFLOW_DB_SCHEMA: public
      DBT_RUN_SCHEDULE: "0 1 * * *"  # Daily at 1 AM
    volumes:
      - dbt_profiles:/dbt/profiles
      - dbt_project:/dbt/project
      - ./dbt:/dbt/project
      - ./dbt/profiles:/dbt/profiles
    networks:
      - remitflow-pipelines
    command: >
      sh -c "while true; do
               echo \"[$(date)] Running dbt models...\";
               dbt run --project-dir /dbt/project --profiles-dir /dbt/profiles --select tag:daily || true;
               echo \"[$(date)] dbt run complete. Sleeping 24h...\";
               sleep 86400;
             done"
