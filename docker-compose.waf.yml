# ============================================================
# RemitFlow — WAF + API Gateway + Incident Alerting Stack
# Services: APISIX + open-appsec WAF + etcd + Alertmanager
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.waf.yml up -d
#
# Architecture:
#   Internet → APISIX (port 80/443) → open-appsec WAF → RemitFlow App (port 3000)
#   Security events → Prometheus → Alertmanager → Slack/Email/Webhook
# ============================================================

version: "3.9"

networks:
  remitflow-net:
    external: true

volumes:
  etcd_data:
    driver: local
  apisix_logs:
    driver: local

services:

  # ── etcd — APISIX configuration store ────────────────────────────────────
  etcd:
    image: bitnami/etcd:3.5.12
    container_name: remitflow-etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_DATA_DIR: "/bitnami/etcd/data"
    volumes:
      - etcd_data:/bitnami/etcd/data
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.remitflow.service: etcd
      com.remitflow.tier: infrastructure

  # ── APISIX API Gateway with open-appsec WAF plugin ───────────────────────
  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: remitflow-apisix
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "80:9080"       # HTTP — public entry point
      - "443:9443"      # HTTPS — public entry point (TLS terminated here)
      - "9091:9091"     # Prometheus metrics scrape port
      - "9092:9092"     # APISIX control API (internal only)
    environment:
      APISIX_STAND_ALONE: "false"
    volumes:
      - ./apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - apisix_logs:/usr/local/apisix/logs
      # open-appsec WAF shared library mount
      - openappsec_lib:/open-appsec/lib:ro
      - ./openappsec/policy/policy.json:/open-appsec/policy/policy.json:ro
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9080/apisix/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      com.remitflow.service: apisix
      com.remitflow.tier: gateway
      com.remitflow.description: "Open-source API gateway with open-appsec ML WAF"

  # ── open-appsec WAF agent (sidecar to APISIX) ────────────────────────────
  # Runs as a sidecar that shares the WAF library with APISIX via volume
  openappsec-agent:
    image: ghcr.io/openappsec/agent:latest
    container_name: remitflow-openappsec-agent
    restart: unless-stopped
    depends_on:
      - apisix
    environment:
      # Declarative local policy mode (no SaaS management required)
      OPENAPPSEC_UID: "remitflow-production"
      OPENAPPSEC_POLICY: "/open-appsec/policy/policy.json"
      # Log level: debug | info | warning | error
      OPENAPPSEC_LOG_LEVEL: "warning"
    volumes:
      - ./openappsec/policy/policy.json:/open-appsec/policy/policy.json:ro
      - openappsec_lib:/open-appsec/lib
      - openappsec_data:/open-appsec/data
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "open-appsec-ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      com.remitflow.service: openappsec-agent
      com.remitflow.tier: security
      com.remitflow.description: "ML-based WAF — blocks SQLi, XSS, OWASP Top 10 zero-day"

  # ── APISIX Dashboard (optional, disable in production) ───────────────────
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: remitflow-apisix-dashboard
    restart: unless-stopped
    depends_on:
      - apisix
    ports:
      - "9000:9000"     # Dashboard UI (restrict to VPN/internal in production)
    volumes:
      - ./apisix/conf/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    networks:
      - remitflow-net
    labels:
      com.remitflow.service: apisix-dashboard
      com.remitflow.tier: management
      com.remitflow.note: "Disable or restrict access in production"

volumes:
  openappsec_lib:
    driver: local
  openappsec_data:
    driver: local
