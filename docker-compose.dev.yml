# RemitFlow v116 — Local Development Docker Compose
# Starts the core services needed for local development:
#   - PostgreSQL (primary DB)
#   - Redis (sessions, rate limiting, job queues)
#   - MinIO (S3-compatible local storage)
#   - MailHog (local SMTP for email testing)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   # Then run: pnpm dev
#
# After starting, set these in your .env.local:
#   LOCAL_DATABASE_URL=postgresql://remitflow:remitflow@localhost:5432/remitflow
#   REDIS_URL=redis://localhost:6379
#   S3_ENDPOINT=http://localhost:9000
#   S3_ACCESS_KEY=minioadmin
#   S3_SECRET_KEY=minioadmin
#   S3_BUCKET=remitflow-dev
#   SMTP_HOST=localhost
#   SMTP_PORT=1025

version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: remitflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: remitflow
      POSTGRES_USER: remitflow
      POSTGRES_PASSWORD: remitflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitflow -d remitflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remitflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible local storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: remitflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── MinIO bucket init ───────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: remitflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/remitflow-dev &&
        mc anonymous set download local/remitflow-dev &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  # ─── MailHog (local SMTP + web UI) ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: remitflow-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (http://localhost:8025)

  # ─── Adminer (DB GUI) ────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: remitflow-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"   # http://localhost:8080
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: remitflow-dev
