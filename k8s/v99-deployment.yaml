---
# ── RemitFlow v99 Kubernetes Deployment ──────────────────────────────────────
# Includes: Fee Negotiation, Multi-Hop Routing, Compliance Scoring,
#           Transfer Limits V2, Reconciliation V2, Fee Rules Engine,
#           Partner Webhooks V2, Beneficiary Groups V2, System Health V2,
#           Audit Trail V2
# Apply with: kubectl apply -f k8s/v99-deployment.yaml
# Namespace: remitflow
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitflow-v99
  namespace: remitflow
  labels:
    app: remitflow
    version: v99
    tier: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: remitflow
      version: v99
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: remitflow
        version: v99
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: remitflow
          image: remitflow:v99
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: JWT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: BUILT_IN_FORGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: BUILT_IN_FORGE_API_KEY
            - name: BUILT_IN_FORGE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: remitflow-config
                  key: BUILT_IN_FORGE_API_URL
            - name: OAUTH_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: remitflow-config
                  key: OAUTH_SERVER_URL
            - name: VITE_OAUTH_PORTAL_URL
              valueFrom:
                configMapKeyRef:
                  name: remitflow-config
                  key: VITE_OAUTH_PORTAL_URL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: remitflow-v99-svc
  namespace: remitflow
  labels:
    app: remitflow
    version: v99
spec:
  selector:
    app: remitflow
    version: v99
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitflow-v99-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitflow-v99
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: remitflow-v99-pdb
  namespace: remitflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: remitflow
      version: v99
