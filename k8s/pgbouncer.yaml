###############################################################################
# RemitFlow — PgBouncer Connection Pooler
#
# Sits between the application and PostgreSQL to:
#   1. Pool connections (max 1000 clients → 50 backend connections)
#   2. Prevent connection exhaustion under 10K+ concurrent users
#   3. Reduce PostgreSQL memory usage per connection
#   4. Provide transparent failover to read replicas
#
# Configuration:
#   - Transaction pooling mode (safe for all RemitFlow queries)
#   - Health checks via pg_isready
#   - Prometheus metrics on /metrics (port 9127)
#
# Access: Internal-only (ClusterIP). Application uses port 6432.
###############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: remitflow
data:
  pgbouncer.ini: |
    [databases]
    remitflow = host=postgres port=5432 dbname=remitflow
    remitflow_readonly = host=postgres-readonly port=5432 dbname=remitflow

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 50
    min_pool_size = 10
    reserve_pool_size = 10
    reserve_pool_timeout = 3
    max_db_connections = 100
    server_idle_timeout = 600
    server_lifetime = 3600
    server_connect_timeout = 5
    client_idle_timeout = 0
    query_wait_timeout = 120
    query_timeout = 0
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60
    admin_users = remitflow_admin
    stats_users = remitflow_stats

  userlist.txt: |
    "remitflow" "remitflow_dev"
    "remitflow_admin" "admin_password_change_me"
    "remitflow_stats" "stats_password_change_me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: remitflow
  labels:
    app: pgbouncer
    tier: database
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        tier: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.22.0
          ports:
            - containerPort: 6432
              name: pgbouncer
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: config
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
        - name: pgbouncer-exporter
          image: prometheuscommunity/pgbouncer-exporter:v0.7.0
          ports:
            - containerPort: 9127
              name: metrics
          env:
            - name: DATABASE_URL
              value: "postgres://remitflow_stats:stats_password_change_me@localhost:6432/pgbouncer?sslmode=disable"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: remitflow
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: pgbouncer
      protocol: TCP
      name: pgbouncer
    - port: 9127
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: pgbouncer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-pdb
  namespace: remitflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer
