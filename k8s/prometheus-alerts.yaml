---
# RemitFlow — Prometheus Alerting Rules
# Apply with: kubectl apply -f k8s/prometheus-alerts.yaml
# Requires: Prometheus Operator (kube-prometheus-stack)

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: remitflow-alerts
  namespace: monitoring
  labels:
    app: remitflow
    release: kube-prometheus-stack
spec:
  groups:

    # ── API Health ──────────────────────────────────────────────────────────────
    - name: remitflow.api
      interval: 30s
      rules:

        - alert: RemitFlowAPIDown
          expr: up{job="remitflow-api"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "RemitFlow API is down"
            description: "The RemitFlow API pod {{ $labels.instance }} has been unreachable for more than 1 minute."
            runbook: "https://docs.remitflow.app/runbooks/api-down"

        - alert: RemitFlowHighErrorRate
          expr: |
            rate(http_requests_total{job="remitflow-api",status=~"5.."}[5m])
            / rate(http_requests_total{job="remitflow-api"}[5m]) > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "RemitFlow API error rate > 5%"
            description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: RemitFlowHighLatency
          expr: |
            histogram_quantile(0.95,
              rate(http_request_duration_seconds_bucket{job="remitflow-api"}[5m])
            ) > 2.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "RemitFlow API p95 latency > 2s"
            description: "95th percentile latency is {{ $value | humanizeDuration }} over the last 5 minutes."

    # ── Financial Operations ────────────────────────────────────────────────────
    - name: remitflow.financial
      interval: 60s
      rules:

        - alert: RemitFlowTransferFailureSpike
          expr: |
            rate(remitflow_transfer_failures_total[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
            team: payments
          annotations:
            summary: "Transfer failure rate spike detected"
            description: "Transfer failure rate is {{ $value | humanize }} failures/sec over the last 5 minutes."
            runbook: "https://docs.remitflow.app/runbooks/transfer-failures"

        - alert: RemitFlowWalletBalanceNegative
          expr: remitflow_wallet_balance_ngn < 0
          for: 0m
          labels:
            severity: critical
            team: payments
          annotations:
            summary: "Negative wallet balance detected"
            description: "Wallet {{ $labels.wallet_id }} has a negative balance: {{ $value }}. Immediate investigation required."

        - alert: RemitFlowStripeWebhookBacklog
          expr: remitflow_stripe_webhook_queue_depth > 100
          for: 10m
          labels:
            severity: warning
            team: payments
          annotations:
            summary: "Stripe webhook queue backlog"
            description: "Stripe webhook queue depth is {{ $value }} — events may be delayed."

    # ── KYC / AML Compliance ────────────────────────────────────────────────────
    - name: remitflow.compliance
      interval: 60s
      rules:

        - alert: RemitFlowKYCApprovalBacklog
          expr: remitflow_kyc_pending_reviews > 50
          for: 30m
          labels:
            severity: warning
            team: compliance
          annotations:
            summary: "KYC review backlog > 50 cases"
            description: "There are {{ $value }} pending KYC reviews. SLA may be breached."

        - alert: RemitFlowAMLFlagSpike
          expr: rate(remitflow_aml_flags_total[1h]) > 10
          for: 15m
          labels:
            severity: warning
            team: compliance
          annotations:
            summary: "AML flag rate spike"
            description: "AML flagging rate is {{ $value | humanize }} flags/hour — possible attack or data quality issue."

        - alert: RemitFlowSanctionsServiceDown
          expr: up{job="remitflow-sanctions-service"} == 0
          for: 2m
          labels:
            severity: critical
            team: compliance
          annotations:
            summary: "Sanctions screening service is down"
            description: "The sanctions screening service has been unreachable for 2 minutes. All transfers are blocked."

    # ── Database ────────────────────────────────────────────────────────────────
    - name: remitflow.database
      interval: 30s
      rules:

        - alert: RemitFlowDBConnectionPoolExhausted
          expr: remitflow_db_pool_available_connections == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Database connection pool exhausted"
            description: "All database connections are in use. New requests will fail."

        - alert: RemitFlowDBSlowQueries
          expr: |
            rate(remitflow_db_query_duration_seconds_sum[5m])
            / rate(remitflow_db_query_duration_seconds_count[5m]) > 1.0
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Average DB query time > 1s"
            description: "Average database query duration is {{ $value | humanizeDuration }}."

    # ── Infrastructure ──────────────────────────────────────────────────────────
    - name: remitflow.infrastructure
      interval: 30s
      rules:

        - alert: RemitFlowHighMemoryUsage
          expr: |
            container_memory_usage_bytes{pod=~"remitflow-.*"}
            / container_spec_memory_limit_bytes{pod=~"remitflow-.*"} > 0.85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Pod memory usage > 85%"
            description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."

        - alert: RemitFlowKafkaConsumerLag
          expr: kafka_consumer_group_lag{group="remitflow-compliance"} > 1000
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Kafka consumer lag > 1000 messages"
            description: "Consumer group {{ $labels.group }} has a lag of {{ $value }} messages on topic {{ $labels.topic }}."

        - alert: RemitFlowCertificateExpiringSoon
          expr: |
            (ssl_certificate_expiry_seconds{job="remitflow-api"} - time()) / 86400 < 30
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "TLS certificate expiring in < 30 days"
            description: "Certificate for {{ $labels.host }} expires in {{ $value | humanize }} days."
