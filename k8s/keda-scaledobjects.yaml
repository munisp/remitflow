apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-processor-keda
  namespace: remitflow
  labels:
    app.kubernetes.io/component: kafka-processor
    app.kubernetes.io/part-of: remitflow
    app.kubernetes.io/managed-by: keda
  annotations:
    observability.remitflow.io/metrics-enabled: 'true'
    observability.remitflow.io/alerts-enabled: 'true'
spec:
  scaleTargetRef:
    name: kafka-processor
  pollingInterval: 15
  cooldownPeriod: 300
  idleReplicaCount: 0
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka-service.remitflow.svc.cluster.local:9092
      consumerGroup: remitflow-processor
      topic: remitflow.transactions
      lagThreshold: '100'
      offsetResetPolicy: latest
  - type: kafka
    metadata:
      bootstrapServers: kafka-service.remitflow.svc.cluster.local:9092
      consumerGroup: remitflow-processor
      topic: remitflow.payment.completed
      lagThreshold: '50'
      offsetResetPolicy: latest
---
