apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: go-transfer-engine-keda
  namespace: remitflow
  labels:
    app.kubernetes.io/component: transfer-engine
    app.kubernetes.io/part-of: remitflow
    app.kubernetes.io/managed-by: keda
  annotations:
    observability.remitflow.io/metrics-enabled: 'true'
    observability.remitflow.io/alerts-enabled: 'true'
spec:
  scaleTargetRef:
    name: go-transfer-engine
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 3
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-service.remitflow.svc.cluster.local:9090
      metricName: http_requests_total
      query: sum(rate(http_requests_total{service="go-transfer-engine"}[2m]))
      threshold: '500'
  - type: cpu
    metricType: Utilization
    metadata:
      value: '60'
---
