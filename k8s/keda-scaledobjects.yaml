  name: kafka-trigger-auth
  namespace: remitflow
spec:
  secretTargetRef:
  - parameter: sasl
    name: kafka-credentials
    key: sasl-mechanism
  - parameter: username
    name: kafka-credentials
    key: username
  - parameter: password
    name: kafka-credentials
    key: password
