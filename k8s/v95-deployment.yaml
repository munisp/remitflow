---
# RemitFlow v95 Kubernetes Deployment
# Includes: Go rate-limit sidecar, Rust audit service, Python compliance service,
# Compliance Metrics Dashboard, Velocity Check Dashboard, KYC Lifecycle Tracker,
# Beneficiary Manager, Promo Code Admin, Feature Flags Admin, Audit Log Admin
apiVersion: v1
kind: Namespace
metadata:
  name: remitflow-v95
  labels:
    app.kubernetes.io/version: "v95"
    app.kubernetes.io/managed-by: remitflow

---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-v95-config
  namespace: remitflow-v95
data:
  NODE_ENV: "production"
  PORT: "3000"
  GO_RATELIMIT_URL: "http://go-ratelimit-sidecar:8084"
  RUST_AUDIT_URL: "http://rust-audit-service:8082"
  PYTHON_COMPLIANCE_URL: "http://python-compliance-service:8083"
  KAFKA_BROKERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
  OPENSEARCH_URL: "http://opensearch:9200"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "60"
  STRICT_RATE_LIMIT_MAX: "5"
  FRAUD_SCORE_THRESHOLD: "0.7"
  COMPLIANCE_BLOCK_THRESHOLD: "0.8"
  DOCUMENT_EXPIRY_SCAN_CRON: "0 0 10 * * *"
  SESSION_COOKIE_MAX_AGE: "86400000"
  BCRYPT_ROUNDS: "12"

---
# ─── Main App Deployment ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitflow-app
  namespace: remitflow-v95
  labels:
    app: remitflow-app
    version: v95
spec:
  replicas: 3
  selector:
    matchLabels:
      app: remitflow-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: remitflow-app
        version: v95
    spec:
      containers:
        - name: remitflow-app
          image: remitflow/app:v95
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: remitflow-v95-config
            - secretRef:
                name: remitflow-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: remitflow-app
  namespace: remitflow-v95
spec:
  selector:
    app: remitflow-app
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
# ─── Go Rate-Limit Sidecar ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-ratelimit-sidecar
  namespace: remitflow-v95
  labels:
    app: go-ratelimit-sidecar
    version: v95
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-ratelimit-sidecar
  template:
    metadata:
      labels:
        app: go-ratelimit-sidecar
    spec:
      containers:
        - name: go-ratelimit-sidecar
          image: remitflow/go-ratelimit-sidecar:v95
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: remitflow-v95-config
                  key: REDIS_URL
            - name: RATE_LIMIT_WINDOW_MS
              value: "60000"
            - name: RATE_LIMIT_MAX_REQUESTS
              value: "60"
            - name: STRICT_RATE_LIMIT_MAX
              value: "5"
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: go-ratelimit-sidecar
  namespace: remitflow-v95
spec:
  selector:
    app: go-ratelimit-sidecar
  ports:
    - port: 8084
      targetPort: 8084

---
# ─── Rust Audit Service ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-audit-service
  namespace: remitflow-v95
  labels:
    app: rust-audit-service
    version: v95
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-audit-service
  template:
    metadata:
      labels:
        app: rust-audit-service
    spec:
      containers:
        - name: rust-audit-service
          image: remitflow/rust-audit-service:v95
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: remitflow-v95-config
                  key: KAFKA_BROKERS
            - name: BUFFER_SIZE
              value: "10000"
            - name: FLUSH_INTERVAL_SECS
              value: "30"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: audit-buffer
              mountPath: /data
      volumes:
        - name: audit-buffer
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: rust-audit-service
  namespace: remitflow-v95
spec:
  selector:
    app: rust-audit-service
  ports:
    - port: 8082
      targetPort: 8082

---
# ─── Python Compliance Service ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-compliance-service
  namespace: remitflow-v95
  labels:
    app: python-compliance-service
    version: v95
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-compliance-service
  template:
    metadata:
      labels:
        app: python-compliance-service
    spec:
      containers:
        - name: python-compliance-service
          image: remitflow/python-compliance-service:v95
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: FRAUD_SCORE_THRESHOLD
              value: "0.7"
            - name: COMPLIANCE_BLOCK_THRESHOLD
              value: "0.8"
            - name: SANCTIONS_API_URL
              value: "https://api.opensanctions.org/v1"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: remitflow-v95-config
                  key: REDIS_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: python-compliance-service
  namespace: remitflow-v95
spec:
  selector:
    app: python-compliance-service
  ports:
    - port: 8083
      targetPort: 8083

---
# ─── Horizontal Pod Autoscalers ───────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitflow-app-hpa
  namespace: remitflow-v95
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitflow-app
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-compliance-hpa
  namespace: remitflow-v95
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-compliance-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

---
# ─── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remitflow-v95-ingress
  namespace: remitflow-v95
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - remitflow.example.com
      secretName: remitflow-tls
  rules:
    - host: remitflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remitflow-app
                port:
                  number: 3000

---
# ─── Network Policies ─────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remitflow-network-policy
  namespace: remitflow-v95
spec:
  podSelector:
    matchLabels:
      app: remitflow-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: go-ratelimit-sidecar
      ports:
        - port: 8084
    - to:
        - podSelector:
            matchLabels:
              app: rust-audit-service
      ports:
        - port: 8082
    - to:
        - podSelector:
            matchLabels:
              app: python-compliance-service
      ports:
        - port: 8083
    - ports:
        - port: 5432  # PostgreSQL
        - port: 6379  # Redis
        - port: 9092  # Kafka
        - port: 443   # External HTTPS
        - port: 53    # DNS
          protocol: UDP
