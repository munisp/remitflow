# RemitFlow — Horizontal Pod Autoscalers for Polyglot Services
# Covers all Go, Rust, and Python microservices with service-appropriate scaling policies

---
# ─── Go Services ──────────────────────────────────────────────────────────────

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-failure-monitor-hpa
  namespace: remitflow
  labels:
    app.kubernetes.io/component: failure-monitor
    app.kubernetes.io/part-of: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-failure-monitor
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
