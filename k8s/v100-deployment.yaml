##############################################################################
# RemitFlow v100 — Kubernetes Deployment Manifests
# Includes: App, Redis, Kafka, Elasticsearch, Temporal, Prometheus, Grafana
##############################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app.kubernetes.io/name: remitflow
    app.kubernetes.io/version: "v100"

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-v100-config
  namespace: remitflow
data:
  NODE_ENV: "production"
  KAFKA_BROKERS: "kafka-service:9092"
  REDIS_URL: "redis://redis-service:6379"
  ELASTICSEARCH_URL: "http://elasticsearch-service:9200"
  TEMPORAL_ADDRESS: "temporal-service:7233"
  SMTP_HOST: "mailhog-service"
  SMTP_PORT: "1025"
  EXCHANGE_RATE_API_URL: "https://v6.exchangerate-api.com/v6"
  OPEN_BANKING_API_URL: "https://api.mono.co/v2"
  CARBON_OFFSET_API_URL: "https://api.patch.io/v1"
  AML_SCREENING_API_URL: "https://api.complyadvantage.com/searches"
  KYC_PROVIDER_API_URL: "https://api.smileidentity.com/v1"
  TWILIO_FROM_NUMBER: "+15005550006"
  LOG_LEVEL: "info"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PATH: "/api/health"

---
# ── App Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitflow-app-v100
  namespace: remitflow
  labels:
    app: remitflow
    version: v100
    component: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: remitflow
      component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: remitflow
        version: v100
        component: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: remitflow
          image: remitflow:v100
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: remitflow-v100-config
            - secretRef:
                name: remitflow-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---
# ── App Service ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: remitflow-service
  namespace: remitflow
  labels:
    app: remitflow
    component: app
spec:
  selector:
    app: remitflow
    component: app
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP

---
# ── HPA ───────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitflow-hpa-v100
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitflow-app-v100
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---
# ── PodDisruptionBudget ───────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: remitflow-pdb-v100
  namespace: remitflow
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: remitflow
      component: app

---
# ── Ingress ───────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remitflow-ingress-v100
  namespace: remitflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - remitflow.example.com
        - api.remitflow.example.com
      secretName: remitflow-tls
  rules:
    - host: remitflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remitflow-service
                port:
                  number: 80
    - host: api.remitflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: remitflow-service
                port:
                  number: 80

---
# ── Redis Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: remitflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: remitflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# ── Elasticsearch Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: remitflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: xpack.security.enabled
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: es-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: remitflow
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200

---
# ── PersistentVolumeClaims ────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: remitflow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-pvc
  namespace: remitflow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
# ── Secrets (values must be base64-encoded in production) ─────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-secrets
  namespace: remitflow
type: Opaque
stringData:
  DATABASE_URL: "mysql://remitflow:CHANGE_ME@mysql-service:3306/remitflow"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_RANDOM_SECRET"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  BUILT_IN_FORGE_API_KEY: "CHANGE_ME"
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  EXCHANGE_RATE_API_KEY: "CHANGE_ME"
  OPEN_BANKING_CLIENT_SECRET: "CHANGE_ME"
  CARBON_OFFSET_API_KEY: "CHANGE_ME"
  AML_SCREENING_API_KEY: "CHANGE_ME"
  KYC_PROVIDER_API_KEY: "CHANGE_ME"
  S3_ACCESS_KEY: "CHANGE_ME"
  S3_SECRET_KEY: "CHANGE_ME"
