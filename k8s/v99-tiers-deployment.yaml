              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8233
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tier3-diaspora-mortgage-engine
  namespace: remitflow
spec:
  selector:
    app: tier3-diaspora-mortgage-engine
  ports:
    - port: 8233
      targetPort: 8233
  type: ClusterIP

---
###############################################################################
# Horizontal Pod Autoscalers
###############################################################################

# Tier 1 HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tier1-contractor-engine-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tier1-contractor-engine
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tier3-credit-scoring-engine-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tier3-credit-scoring-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tier3-embedded-payroll-api-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tier3-embedded-payroll-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---
###############################################################################
# APISIX Ingress Routes for Tier Services
###############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tier-services-ingress
  namespace: remitflow
  annotations:
    kubernetes.io/ingress.class: apisix
    apisix.apache.org/plugin-config-name: remitflow-security
    apisix.apache.org/rewrite-target: "/$2"
spec:
  rules:
    - host: api.remitflow.com
      http:
        paths:
          - path: /api/v1/tier1(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tier1-contractor-engine
                port:
                  number: 8210
          - path: /api/v1/tier2(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tier2-savings-engine
                port:
                  number: 8221
          - path: /api/v1/tier3(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tier3-credit-scoring-engine
                port:
                  number: 8220
          - path: /api/v1/payroll(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tier3-embedded-payroll-api
                port:
                  number: 8232
          - path: /api/v1/mortgage(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tier3-diaspora-mortgage-engine
                port:
                  number: 8233
          - path: /api/v1/esg(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: tier3-esg-engine
                port:
                  number: 8231
