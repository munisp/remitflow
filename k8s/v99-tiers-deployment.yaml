###############################################################################
# RemitFlow — Kubernetes Manifests for Tier 1/2/3 Feature Microservices (v99)
#
# Tier 1 (Go):    contractor-engine, expense-engine, kyb-engine, payroll-tax-engine
# Tier 2 (Rust):  savings-engine, bond-engine, lc-engine, invoice-financing-engine, payroll-run-engine
# Tier 3 (Python): credit-scoring-engine, esg-engine, embedded-payroll-api, diaspora-mortgage-engine
#
# All pods have Dapr sidecars injected via annotations.
# All services are exposed internally via ClusterIP.
# APISIX ingress routes external traffic via /api/v1/tier{1,2,3}/* paths.
###############################################################################

# ── Namespace (idempotent) ─────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app.kubernetes.io/part-of: remitflow
    tier-services: "v99"

---
# ── ConfigMap — Tier Services Config ──────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: tier-services-config
  namespace: remitflow
data:
  CONTRACTOR_ENGINE_URL: "http://tier1-contractor-engine:8210"
  EXPENSE_ENGINE_URL: "http://tier1-expense-engine:8212"
  KYB_ENGINE_URL: "http://tier1-kyb-engine:8213"
  PAYROLL_TAX_ENGINE_URL: "http://tier1-payroll-tax-engine:8214"
  SAVINGS_ENGINE_URL: "http://tier2-savings-engine:8221"
  BOND_ENGINE_URL: "http://tier2-bond-engine:8222"
  LC_ENGINE_URL: "http://tier2-lc-engine:8223"
  INVOICE_FINANCING_ENGINE_URL: "http://tier2-invoice-financing-engine:8224"
  PAYROLL_RUN_ENGINE_URL: "http://tier2-payroll-run-engine:8225"
  CREDIT_SCORING_ENGINE_URL: "http://tier3-credit-scoring-engine:8220"
  ESG_ENGINE_URL: "http://tier3-esg-engine:8231"
  EMBEDDED_PAYROLL_API_URL: "http://tier3-embedded-payroll-api:8232"
  DIASPORA_MORTGAGE_ENGINE_URL: "http://tier3-diaspora-mortgage-engine:8233"
  KAFKA_BROKERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
  TEMPORAL_HOST: "temporal:7233"
  OPENSEARCH_URL: "http://opensearch:9200"
  LAKEHOUSE_URL: "http://lakehouse:8080"
  PERMIFY_URL: "http://permify:3476"

---
###############################################################################
# TIER 1 — Go Microservices
###############################################################################

# ── Contractor Engine ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier1-contractor-engine
  namespace: remitflow
  labels:
    app: tier1-contractor-engine
    tier: "1"
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tier1-contractor-engine
  template:
    metadata:
      labels:
        app: tier1-contractor-engine
        tier: "1"
        language: go
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "tier1-contractor-engine"
        dapr.io/app-port: "8210"
        dapr.io/log-level: "info"
    spec:
      containers:
        - name: contractor-engine
          image: remitflow/tier1-contractor-engine:latest
          ports:
            - containerPort: 8210
          env:
            - name: PORT
              value: "8210"
            - name: GIN_MODE
              value: release
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: tier-services-config
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8210
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8210
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tier1-contractor-engine
  namespace: remitflow
spec:
  selector:
    app: tier1-contractor-engine
  ports:
    - port: 8210
      targetPort: 8210
  type: ClusterIP

---
