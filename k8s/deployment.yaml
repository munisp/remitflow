---
# ── RemitFlow Kubernetes Deployment ─────────────────────────────────────────
# Apply with: kubectl apply -f k8s/
# Namespace: remitflow

apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app: remitflow

---
# ── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-config
  namespace: remitflow
data:
  NODE_ENV: "production"
  PORT: "3000"
  OAUTH_SERVER_URL: "https://api.manus.im"
  VITE_OAUTH_PORTAL_URL: "https://oauth.manus.im"
  OWNER_NAME: "RemitFlow Admin"
  BUILT_IN_FORGE_API_URL: "https://api.manus.im"
  VITE_FRONTEND_FORGE_API_URL: "https://api.manus.im"

---
# ── Secret ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-secrets
  namespace: remitflow
type: Opaque
stringData:
  DATABASE_URL: "mysql://remitflow:remitflow_secret@mysql-service:3306/remitflow"
  JWT_SECRET: "remitflow-jwt-secret-change-in-production-minimum-32chars"
  VITE_APP_ID: "remitflow-app-id"
  OWNER_OPEN_ID: "owner-open-id"
  BUILT_IN_FORGE_API_KEY: "built-in-forge-api-key"
  VITE_FRONTEND_FORGE_API_KEY: "frontend-forge-api-key"

---
# ── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitflow-app
  namespace: remitflow
  labels:
    app: remitflow
    version: "69.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remitflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: remitflow
        version: "69.0.0"
    spec:
      containers:
        - name: remitflow
          image: remitflow:v99
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: remitflow-config
            - secretRef:
                name: remitflow-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/trpc/system.health?batch=1&input={}
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/trpc/system.health?batch=1&input={}
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# ── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: remitflow-service
  namespace: remitflow
  labels:
    app: remitflow
spec:
  selector:
    app: remitflow
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP

---
# ── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remitflow-ingress
  namespace: remitflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - remitflow.example.com
      secretName: remitflow-tls
  rules:
    - host: remitflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remitflow-service
                port:
                  number: 80

---
# ── HorizontalPodAutoscaler ──────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitflow-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitflow-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ── MySQL StatefulSet ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: remitflow
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root_secret"
            - name: MYSQL_DATABASE
              value: "remitflow"
            - name: MYSQL_USER
              value: "remitflow"
            - name: MYSQL_PASSWORD
              value: "remitflow_secret"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# ── MySQL Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: remitflow
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
