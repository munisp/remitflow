# RemitFlow — Web Application Firewall (WAF) Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# APISIX-based WAF rules providing Layer 7 protection for the RemitFlow API.
# Covers OWASP Top 10, financial-specific attacks, and rate limiting.
#
# Rule Categories:
# 1. SQL Injection prevention
# 2. XSS (Cross-Site Scripting) prevention
# 3. Path traversal prevention
# 4. Request size limits
# 5. Geo-blocking (sanctioned countries)
# 6. Bot detection
# 7. API abuse prevention
# 8. Financial-specific protections
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-waf-rules
  namespace: remitflow
  labels:
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: remitflow
data:
  # ─── OWASP ModSecurity Core Rule Set Integration ──────────────────────────────
  modsec-main.conf: |
    SecRuleEngine On
    SecRequestBodyAccess On
    SecResponseBodyAccess Off
    SecRequestBodyLimit 1048576
    SecRequestBodyNoFilesLimit 131072

    # Anomaly scoring mode — block when score exceeds threshold
    SecAction "id:900110,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=5"
    SecAction "id:900111,phase:1,pass,nolog,setvar:tx.outbound_anomaly_score_threshold=4"

  # ─── Financial-Specific WAF Rules ────────────────────────────────────────────
  remitflow-rules.conf: |
    # Rule 100001: Block IBAN/account number patterns in URL path
    SecRule REQUEST_URI "@rx \b[A-Z]{2}\d{2}[A-Z0-9]{4}\d{7}([A-Z0-9]?){0,16}\b" \
      "id:100001,phase:1,deny,status:403,msg:'IBAN detected in URL path',severity:2,tag:'FINANCIAL/DATA-LEAK'"

    # Rule 100002: Block credit card numbers in request body (non-payment endpoints)
    SecRule REQUEST_URI "!@beginsWith /api/trpc/payment" \
      "id:100002,phase:2,chain"
    SecRule REQUEST_BODY "@rx \b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\b" \
      "deny,status:403,msg:'Credit card number in non-payment request',severity:1,tag:'FINANCIAL/PCI'"

    # Rule 100003: Block excessive transfer amounts (potential injection)
    SecRule ARGS:amount "@gt 10000000" \
      "id:100003,phase:2,deny,status:403,msg:'Transfer amount exceeds WAF limit',severity:2,tag:'FINANCIAL/LIMIT'"

    # Rule 100004: Prevent parameter tampering on fee calculations
    SecRule REQUEST_URI "@contains feeRulesEngine" \
      "id:100004,phase:1,chain"
    SecRule &ARGS "@gt 20" \
      "deny,status:403,msg:'Excessive parameters on fee endpoint',severity:3,tag:'FINANCIAL/TAMPER'"

    # Rule 100005: Block rapid-fire transfer attempts (application-layer DDoS)
    SecRule IP:TRANSFER_COUNT "@gt 50" \
      "id:100005,phase:1,deny,status:429,msg:'Transfer rate limit exceeded',severity:2,tag:'FINANCIAL/ABUSE'"
    SecRule REQUEST_URI "@contains transfer.send" \
      "id:100006,phase:5,pass,nolog,setvar:IP.TRANSFER_COUNT=+1,expirevar:IP.TRANSFER_COUNT=3600"

    # Rule 100007: Block known cryptocurrency address patterns in unexpected fields
    SecRule ARGS "@rx ^(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,39}$" \
      "id:100007,phase:2,deny,status:403,msg:'Cryptocurrency address in request',severity:2,tag:'FINANCIAL/CRYPTO'"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-waf-geo-rules
  namespace: remitflow
data:
  # ─── OFAC/Sanctions Geo-blocking ──────────────────────────────────────────────
  sanctioned-countries.conf: |
    # Block traffic from OFAC-sanctioned countries
    # Updated: 2026-05-20
    # Countries: North Korea, Iran, Syria, Cuba, Russia (partial), Belarus, Myanmar
    SecGeoLookupDB /etc/modsecurity/GeoLite2-Country.mmdb

    SecRule REMOTE_ADDR "@geoLookup" "id:200001,phase:1,pass,nolog"
    SecRule GEO:COUNTRY_CODE "@pm KP IR SY CU" \
      "id:200002,phase:1,deny,status:403,msg:'Request from OFAC-sanctioned country',severity:1,tag:'COMPLIANCE/SANCTIONS'"

    # Russia — block financial transactions only (not all traffic)
    SecRule GEO:COUNTRY_CODE "@streq RU" \
      "id:200003,phase:1,chain"
    SecRule REQUEST_URI "@rx (transfer|payment|wallet|fx)" \
      "deny,status:403,msg:'Financial transaction from sanctioned jurisdiction',severity:1,tag:'COMPLIANCE/SANCTIONS'"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-waf-rate-limits
  namespace: remitflow
data:
  # ─── Application-Aware Rate Limiting ──────────────────────────────────────────
  rate-limits.conf: |
    # Login brute force protection (5 attempts per minute)
    SecRule REQUEST_URI "@contains auth.login" \
      "id:300001,phase:1,pass,nolog,setvar:IP.LOGIN_COUNT=+1,expirevar:IP.LOGIN_COUNT=60"
    SecRule IP:LOGIN_COUNT "@gt 5" \
      "id:300002,phase:1,deny,status:429,msg:'Login rate limit exceeded',severity:2,tag:'AUTH/BRUTE-FORCE'"

    # KYC submission rate (3 per hour)
    SecRule REQUEST_URI "@contains kyc.submit" \
      "id:300003,phase:1,pass,nolog,setvar:IP.KYC_COUNT=+1,expirevar:IP.KYC_COUNT=3600"
    SecRule IP:KYC_COUNT "@gt 3" \
      "id:300004,phase:1,deny,status:429,msg:'KYC submission rate limit',severity:3,tag:'COMPLIANCE/KYC'"

    # Password reset flood protection (3 per 10 minutes)
    SecRule REQUEST_URI "@contains auth.resetPassword" \
      "id:300005,phase:1,pass,nolog,setvar:IP.RESET_COUNT=+1,expirevar:IP.RESET_COUNT=600"
    SecRule IP:RESET_COUNT "@gt 3" \
      "id:300006,phase:1,deny,status:429,msg:'Password reset rate limit',severity:3,tag:'AUTH/ABUSE'"

    # Beneficiary creation rate (10 per hour)
    SecRule REQUEST_URI "@contains beneficiary.create" \
      "id:300007,phase:1,pass,nolog,setvar:IP.BENEFICIARY_COUNT=+1,expirevar:IP.BENEFICIARY_COUNT=3600"
    SecRule IP:BENEFICIARY_COUNT "@gt 10" \
      "id:300008,phase:1,deny,status:429,msg:'Beneficiary creation rate limit',severity:3,tag:'FINANCIAL/ABUSE'"

---
# ─── WAF Deployment (APISIX + ModSecurity) ────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitflow-waf
  namespace: remitflow
  labels:
    app: remitflow-waf
    app.kubernetes.io/component: waf
    app.kubernetes.io/part-of: remitflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remitflow-waf
  template:
    metadata:
      labels:
        app: remitflow-waf
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      containers:
        - name: apisix
          image: apache/apisix:3.9.0-debian
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9443
              name: https
            - containerPort: 9091
              name: metrics
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: waf-rules
              mountPath: /etc/modsecurity/rules/
            - name: geo-rules
              mountPath: /etc/modsecurity/geo/
            - name: rate-limits
              mountPath: /etc/modsecurity/rate/
      volumes:
        - name: waf-rules
          configMap:
            name: remitflow-waf-rules
        - name: geo-rules
          configMap:
            name: remitflow-waf-geo-rules
        - name: rate-limits
          configMap:
            name: remitflow-waf-rate-limits

---
apiVersion: v1
kind: Service
metadata:
  name: remitflow-waf
  namespace: remitflow
spec:
  selector:
    app: remitflow-waf
  ports:
    - port: 80
      targetPort: 9080
      name: http
    - port: 443
      targetPort: 9443
      name: https
    - port: 9091
      targetPort: 9091
      name: metrics
  type: ClusterIP
