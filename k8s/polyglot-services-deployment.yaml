  selector:
    matchLabels:
      app: python-gnn-fraud
  template:
    metadata:
      labels:
        app: python-gnn-fraud
        language: python
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8094'
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: python-gnn-fraud
        image: remitflow/python-gnn-fraud:latest
        ports:
        - containerPort: 8094
        env:
        - name: PORT
          value: '8094'
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8094
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8094
          initialDelaySeconds: 20
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health
            port: 8094
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 18
---
