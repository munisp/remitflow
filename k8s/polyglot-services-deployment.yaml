apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-transfer-engine
  namespace: remitflow
  labels:
    app: go-transfer-engine
    language: go
    tier: critical
    observability: enabled
    metrics: prometheus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-transfer-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: go-transfer-engine
        language: go
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8089'
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: go-transfer-engine
        image: remitflow/go-transfer-engine:latest
        ports:
        - containerPort: 8089
        env:
        - name: PORT
          value: '8089'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: remitflow-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8089
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
---
