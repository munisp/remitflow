# k8s/secrets.yaml — RemitFlow Kubernetes Secrets Manifest
# Usage: kubectl apply -f k8s/secrets.yaml
# NOTE: Values must be base64-encoded. Use: echo -n "value" | base64
#
# ⚠️  PRODUCTION: Do NOT use this file with real credentials committed to git.
#     Instead, use one of:
#       1. HashiCorp Vault Agent Injector (recommended) — see ops/vault-init.sh
#       2. Sealed Secrets (Bitnami) — encrypt at rest in git
#       3. External Secrets Operator — sync from AWS Secrets Manager/GCP/Azure
#
#     This file exists as a TEMPLATE and for local development only.
#     Run: ./ops/vault-init.sh to configure production secrets management.
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-secrets
  namespace: remitflow
  labels:
    app: remitflow
    environment: production
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://remitflow:CHANGE_ME@postgres:5432/remitflow"
  LOCAL_DATABASE_URL: "postgresql://remitflow:CHANGE_ME@postgres:5432/remitflow"
  # Auth
  JWT_SECRET: "CHANGE_ME_use_openssl_rand_base64_64"
  # OAuth
  VITE_APP_ID: "remitflow-app-id"
  OAUTH_SERVER_URL: "https://api.manus.im"
  VITE_OAUTH_PORTAL_URL: "https://auth.manus.im"
  # Stripe
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  VITE_STRIPE_PUBLISHABLE_KEY: "pk_live_CHANGE_ME"
  # Email (Resend)
  RESEND_API_KEY: "re_CHANGE_ME"
  APP_URL: "https://remitflow.app"
  # FX Engine
  FX_ENGINE_URL: "http://fx-engine:8081"
  FX_API_KEY: "CHANGE_ME"
  # AML Engine
  AML_ENGINE_URL: "http://aml-engine:8082"
  # Fraud ML
  FRAUD_ML_URL: "http://fraud-ml:8083"
  # Compliance ML
  COMPLIANCE_ML_URL: "http://python-compliance-ml:8086"
  # Export Service
  EXPORT_SERVICE_URL: "http://go-export-service:8084"
  # PDF Receipt
  PDF_RECEIPT_URL: "http://rust-pdf-receipt:8085"
  # Keycloak SSO (optional)
  KEYCLOAK_URL: "https://sso.remitflow.app"
  KEYCLOAK_REALM: "remitflow"
  KEYCLOAK_CLIENT_ID: "remitflow-web"
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
  # Monitoring
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_use_strong_password"
  # Manus Built-in APIs
  BUILT_IN_FORGE_API_URL: "https://api.manus.im"
  BUILT_IN_FORGE_API_KEY: "CHANGE_ME"
  VITE_FRONTEND_FORGE_API_KEY: "CHANGE_ME"
  VITE_FRONTEND_FORGE_API_URL: "https://api.manus.im"
  # HashiCorp Vault (production secrets management)
  VAULT_ADDR: "http://vault:8200"
  VAULT_ROLE_ID: "CHANGE_ME"
  VAULT_SECRET_ID: "CHANGE_ME"
  # Temporal (workflow engine)
  TEMPORAL_ADDRESS: "temporal-frontend:7233"
  TEMPORAL_TASK_QUEUE: "remitflow-main"
  # Payment providers (fetched from Vault in production)
  CIRCLE_API_KEY: "CHANGE_ME"
  CIRCLE_ENV: "production"
  FIREBLOCKS_API_KEY: "CHANGE_ME"
  FIREBLOCKS_ENV: "production"
  # KYC providers (fetched from Vault in production)
  ONFIDO_API_KEY: "CHANGE_ME"
  ONFIDO_ENV: "production"
  SMILE_PARTNER_ID: "CHANGE_ME"
  SMILE_API_KEY: "CHANGE_ME"
  # Compliance (fetched from Vault in production)
  OFAC_API_KEY: "CHANGE_ME"
  CHAINALYSIS_API_KEY: "CHANGE_ME"
  NOTABENE_API_KEY: "CHANGE_ME"
  # Flutterwave (Africa payments)
  FLUTTERWAVE_SECRET_KEY: "CHANGE_ME"
  FLUTTERWAVE_WEBHOOK_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-tls
  namespace: remitflow
type: kubernetes.io/tls
data:
  # Replace with actual base64-encoded TLS certificate and key
  tls.crt: "CHANGE_ME_base64_encoded_cert"
  tls.key: "CHANGE_ME_base64_encoded_key"
