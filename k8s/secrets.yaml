# k8s/secrets.yaml — RemitFlow Kubernetes Secrets Manifest
# Usage: kubectl apply -f k8s/secrets.yaml
# NOTE: Values must be base64-encoded. Use: echo -n "value" | base64
# In production, use Sealed Secrets or HashiCorp Vault instead of plain Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-secrets
  namespace: remitflow
  labels:
    app: remitflow
    environment: production
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://remitflow:CHANGE_ME@postgres:5432/remitflow"
  LOCAL_DATABASE_URL: "postgresql://remitflow:CHANGE_ME@postgres:5432/remitflow"
  # Auth
  JWT_SECRET: "CHANGE_ME_use_openssl_rand_base64_64"
  # OAuth
  VITE_APP_ID: "remitflow-app-id"
  OAUTH_SERVER_URL: "https://api.manus.im"
  VITE_OAUTH_PORTAL_URL: "https://auth.manus.im"
  # Stripe
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  VITE_STRIPE_PUBLISHABLE_KEY: "pk_live_CHANGE_ME"
  # Email (Resend)
  RESEND_API_KEY: "re_CHANGE_ME"
  APP_URL: "https://remitflow.app"
  # FX Engine
  FX_ENGINE_URL: "http://fx-engine:8081"
  FX_API_KEY: "CHANGE_ME"
  # AML Engine
  AML_ENGINE_URL: "http://aml-engine:8082"
  # Fraud ML
  FRAUD_ML_URL: "http://fraud-ml:8083"
  # Compliance ML
  COMPLIANCE_ML_URL: "http://python-compliance-ml:8086"
  # Export Service
  EXPORT_SERVICE_URL: "http://go-export-service:8084"
  # PDF Receipt
  PDF_RECEIPT_URL: "http://rust-pdf-receipt:8085"
  # Keycloak SSO (optional)
  KEYCLOAK_URL: "https://sso.remitflow.app"
  KEYCLOAK_REALM: "remitflow"
  KEYCLOAK_CLIENT_ID: "remitflow-web"
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
  # Monitoring
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_use_strong_password"
  # Manus Built-in APIs
  BUILT_IN_FORGE_API_URL: "https://api.manus.im"
  BUILT_IN_FORGE_API_KEY: "CHANGE_ME"
  VITE_FRONTEND_FORGE_API_KEY: "CHANGE_ME"
  VITE_FRONTEND_FORGE_API_URL: "https://api.manus.im"
---
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-tls
  namespace: remitflow
type: kubernetes.io/tls
data:
  # Replace with actual base64-encoded TLS certificate and key
  tls.crt: "CHANGE_ME_base64_encoded_cert"
  tls.key: "CHANGE_ME_base64_encoded_key"
