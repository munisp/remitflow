    version: v97
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-audit
  template:
    metadata:
      labels:
        app: rust-audit
        version: v97
    spec:
      containers:
        - name: rust-audit
          image: remitflow-rust-audit:v97
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: remitflow-v97-config
            - secretRef:
                name: remitflow-v97-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: rust-audit-service
  namespace: remitflow-v97
spec:
  selector:
    app: rust-audit
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP

---
# ─── Python Compliance Service ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-compliance
  namespace: remitflow-v97
  labels:
    app: python-compliance
    version: v97
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-compliance
  template:
    metadata:
      labels:
        app: python-compliance
        version: v97
    spec:
      containers:
        - name: python-compliance
          image: remitflow-python-compliance:v97
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: remitflow-v97-config
            - secretRef:
                name: remitflow-v97-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: python-compliance-service
  namespace: remitflow-v97
spec:
  selector:
    app: python-compliance
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP

---
# ─── Horizontal Pod Autoscaler ──────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitflow-app-hpa
  namespace: remitflow-v97
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitflow-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ─── Ingress ────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remitflow-v97-ingress
  namespace: remitflow-v97
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - remitflow.app
        - api.remitflow.app
      secretName: remitflow-v97-tls
  rules:
    - host: remitflow.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remitflow-app-service
                port:
                  number: 3000
    - host: api.remitflow.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: remitflow-app-service
                port:
                  number: 3000
