---
# ============================================================
# RemitFlow v90 — Kubernetes Deployment Manifests
# Services: sanctions-api, open-banking-hub, regulatory-svc,
#           fraud-api-v2, swift-simulator, sepa-simulator
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: remitflow-v90
  labels:
    app.kubernetes.io/part-of: remitflow
    version: v90

---
# ── Secrets ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-v90-secrets
  namespace: remitflow-v90
type: Opaque
stringData:
  SANCTIONS_API_KEY: "remitflow-sanctions-key-v90"
  OPEN_BANKING_API_KEY: "remitflow-ob-key-v90"
  REGULATORY_API_KEY: "remitflow-reg-key-v90"
  FRAUD_API_KEY: "remitflow-fraud-key-v90"
  REDIS_PASSWORD: "remitflow_redis_v90"

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-v90-config
  namespace: remitflow-v90
data:
  SANCTIONS_MATCH_THRESHOLD: "0.70"
  SANCTIONS_REFRESH_INTERVAL_HOURS: "24"
  FRAUD_SCORE_THRESHOLD_LOW: "0.30"
  FRAUD_SCORE_THRESHOLD_MEDIUM: "0.60"
  FRAUD_SCORE_THRESHOLD_HIGH: "0.85"
  FRAUD_MODEL_VERSION: "3.4.0"
  OPEN_BANKING_CONSENT_EXPIRY_DAYS: "90"
  FINCEN_CTR_THRESHOLD_USD: "10000"
  FINCEN_SAR_THRESHOLD_USD: "5000"
  SWIFT_BIC: "REMFNGLA"
  SEPA_BIC: "REMFDE22"
  LOG_LEVEL: "INFO"

---
# ── Sanctions API Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanctions-api
  namespace: remitflow-v90
  labels:
    app: sanctions-api
    version: v90
    tier: compliance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sanctions-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sanctions-api
        version: v90
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sanctions-api
          image: remitflow/sanctions-api:v90
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: http
          env:
            - name: PORT
              value: "9100"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v90-secrets
                  key: SANCTIONS_API_KEY
            - name: MATCH_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: remitflow-v90-config
                  key: SANCTIONS_MATCH_THRESHOLD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: sanctions-api
  namespace: remitflow-v90
spec:
  selector:
    app: sanctions-api
  ports:
    - port: 9100
      targetPort: 9100
      name: http
  type: ClusterIP

---
# ── Fraud API v2 Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-v2
  namespace: remitflow-v90
  labels:
    app: fraud-api-v2
    version: v90
    tier: ml-inference
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-api-v2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fraud-api-v2
        version: v90
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      containers:
        - name: fraud-api-v2
          image: remitflow/fraud-api:v90
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9400
              name: http
          env:
            - name: PORT
              value: "9400"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v90-secrets
                  key: FRAUD_API_KEY
            - name: MODEL_VERSION
              valueFrom:
                configMapKeyRef:
                  name: remitflow-v90-config
                  key: FRAUD_MODEL_VERSION
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9400
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 9400
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api-v2
  namespace: remitflow-v90
spec:
  selector:
    app: fraud-api-v2
  ports:
    - port: 9400
      targetPort: 9400
      name: http
  type: ClusterIP

---
# ── Open Banking Hub Deployment ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-banking-hub
  namespace: remitflow-v90
  labels:
    app: open-banking-hub
    version: v90
    tier: open-banking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: open-banking-hub
  template:
    metadata:
      labels:
        app: open-banking-hub
        version: v90
    spec:
      containers:
        - name: open-banking-hub
          image: remitflow/open-banking-hub:v90
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: PORT
              value: "9200"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v90-secrets
                  key: OPEN_BANKING_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: open-banking-hub
  namespace: remitflow-v90
spec:
  selector:
    app: open-banking-hub
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  type: ClusterIP

---
# ── Regulatory Service Deployment ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulatory-svc
  namespace: remitflow-v90
  labels:
    app: regulatory-svc
    version: v90
    tier: compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regulatory-svc
  template:
    metadata:
      labels:
        app: regulatory-svc
        version: v90
    spec:
      containers:
        - name: regulatory-svc
          image: remitflow/regulatory-svc:v90
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9300
              name: http
          env:
            - name: PORT
              value: "9300"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v90-secrets
                  key: REGULATORY_API_KEY
            - name: FINCEN_CTR_THRESHOLD_USD
              valueFrom:
                configMapKeyRef:
                  name: remitflow-v90-config
                  key: FINCEN_CTR_THRESHOLD_USD
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9300
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: regulatory-svc
  namespace: remitflow-v90
spec:
  selector:
    app: regulatory-svc
  ports:
    - port: 9300
      targetPort: 9300
      name: http
  type: ClusterIP

---
# ── HPA for Fraud API v2 ──────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-api-v2-hpa
  namespace: remitflow-v90
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-api-v2
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ── HPA for Sanctions API ─────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sanctions-api-hpa
  namespace: remitflow-v90
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sanctions-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# ── Network Policy ────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remitflow-v90-netpol
  namespace: remitflow-v90
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remitflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remitflow-v90
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remitflow
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remitflow-v90
    - ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
