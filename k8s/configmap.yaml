# RemitFlow — Kubernetes ConfigMap (non-secret environment variables)
# Secrets (JWT_SECRET, DATABASE_URL, STRIPE_SECRET_KEY, etc.) are in k8s Secrets, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-config
  namespace: remitflow
data:
  NODE_ENV: "production"
  PORT: "3000"
  APP_URL: "https://remitflow.app"
  # OAuth
  OAUTH_SERVER_URL: "https://api.manus.im"
  VITE_OAUTH_PORTAL_URL: "https://oauth.manus.im"
  # Keycloak OIDC
  KEYCLOAK_URL: "https://auth.remitflow.app"
  KEYCLOAK_REALM: "remitflow"
  KEYCLOAK_CLIENT_ID: "remitflow-app"
  # Microservice URLs (internal cluster DNS)
  FX_ENGINE_URL: "http://remitflow-fx-engine:8081"
  FRAUD_ML_URL: "http://remitflow-fraud-ml:8082"
  AML_ENGINE_URL: "http://remitflow-aml-engine:8083"
  COMMUNITY_FEED_URL: "http://remitflow-community-feed:8084"
  SHARE_LINK_URL: "http://remitflow-share-link:8085"
  NAV_ANALYTICS_URL: "http://remitflow-nav-analytics:8086"
  INVESTMENT_FEED_URL: "http://remitflow-go-investment-feed:8095"
  PORTFOLIO_CALC_URL: "http://remitflow-rust-portfolio-calc:8096"
  INVESTMENT_ML_URL: "http://remitflow-python-investment-ml:8097"
  TRANSFER_ENGINE_URL: "http://remitflow-transfer-engine:50051"
  ANALYTICS_URL: "http://remitflow-analytics:8085"
  PDF_RECEIPT_URL: "http://remitflow-pdf-receipt:8086"
  # Email
  RESEND_FROM_EMAIL: "noreply@remitflow.app"
  # Feature flags
  ENABLE_MOJALOOP: "false"
  ENABLE_CBDC: "false"
  ENABLE_KEYCLOAK: "true"
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-nginx-headers
  namespace: remitflow
data:
  Upgrade: "$http_upgrade"
  Connection: "upgrade"
  X-Real-IP: "$remote_addr"
  X-Forwarded-For: "$proxy_add_x_forwarded_for"
  X-Forwarded-Proto: "$scheme"
