# RemitFlow — Horizontal Pod Autoscaler
# Tuned for 1M+ TPS sustained throughput:
#   - API: 50K RPS target → min 10, max 100 pods, CPU 60%
#   - Transfer Engine: 20K TPS target → min 8, max 50 pods, CPU 50%
#   - Webhook Processor: burst-tolerant → min 5, max 30 pods
#   - Fraud Scorer: ML inference → min 5, max 20 pods, CPU 45%
#   - Mojaloop Connector: high fan-out → min 5, max 25 pods
#   - Temporal Workers: durable workflows → min 5, max 30 pods

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitflow-api-hpa
  namespace: remitflow
  labels:
    app: remitflow
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitflow-api
  minReplicas: 10
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "5000"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 10
          periodSeconds: 15
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 5
          periodSeconds: 120
---
apiVersion: autoscaling/v2
