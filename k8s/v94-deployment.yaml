# ============================================================
# RemitFlow v94 — Kubernetes Deployment Manifests
# ============================================================
# Services:
#   - fcm-proxy (Firebase Cloud Messaging proxy)
#   - ab-testing-svc (A/B experiment assignment)
#   - referral-engine (Referral bonus calculation)
#   - doc-vault-api (Document vault lifecycle)
#   - rate-alert-svc (FX rate alert evaluation)
#   - security-audit (Security event aggregation)
#   - redis-v94 (Rate limiting & lockout cache)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: remitflow-v94
  labels:
    app.kubernetes.io/part-of: remitflow
    version: v94
---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-v94-config
  namespace: remitflow-v94
data:
  REFERRER_BONUS_USD: "5.00"
  REFERRED_BONUS_USD: "2.00"
  MIN_TRANSFER_AMOUNT_USD: "50.00"
  EXPIRY_WARNING_DAYS: "30"
  CHECK_INTERVAL_SECONDS: "300"
  FX_API_URL: "https://open.er-api.com/v6/latest"
  ALERT_THRESHOLD_CRITICAL: "1"
  ALERT_THRESHOLD_WARNING: "5"
---
# ── Secret ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-v94-secrets
  namespace: remitflow-v94
type: Opaque
stringData:
  FCM_API_KEY: ""
  AB_API_KEY: "remitflow-ab-key-v94"
  REFERRAL_API_KEY: "remitflow-ref-key-v94"
  DOC_VAULT_API_KEY: "remitflow-doc-key-v94"
  RATE_ALERT_API_KEY: "remitflow-rate-key-v94"
  SECURITY_AUDIT_API_KEY: "remitflow-sec-key-v94"
  REDIS_PASSWORD: "remitflow_redis_v94"
---
# ── Redis v94 ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-v94
  namespace: remitflow-v94
  labels:
    app: redis-v94
    version: v94
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-v94
  template:
    metadata:
      labels:
        app: redis-v94
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remitflow-v94-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-v94
  namespace: remitflow-v94
spec:
  selector:
    app: redis-v94
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
# ── FCM Proxy ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcm-proxy
  namespace: remitflow-v94
  labels:
    app: fcm-proxy
    version: v94
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fcm-proxy
  template:
    metadata:
      labels:
        app: fcm-proxy
    spec:
      containers:
        - name: fcm-proxy
          image: node:22-alpine
          ports:
            - containerPort: 9500
          env:
            - name: PORT
              value: "9500"
            - name: FCM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v94-secrets
                  key: FCM_API_KEY
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v94-secrets
                  key: AB_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9500
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9500
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fcm-proxy
  namespace: remitflow-v94
spec:
  selector:
    app: fcm-proxy
  ports:
    - port: 9500
      targetPort: 9500
  type: ClusterIP
---
# ── A/B Testing Service ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ab-testing-svc
  namespace: remitflow-v94
  labels:
    app: ab-testing-svc
    version: v94
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ab-testing-svc
  template:
    metadata:
      labels:
        app: ab-testing-svc
    spec:
      containers:
        - name: ab-testing
          image: python:3.11-slim
          ports:
            - containerPort: 9501
          env:
            - name: PORT
              value: "9501"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v94-secrets
                  key: AB_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9501
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9501
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ab-testing-svc
  namespace: remitflow-v94
spec:
  selector:
    app: ab-testing-svc
  ports:
    - port: 9501
      targetPort: 9501
  type: ClusterIP
---
