# ── Security Audit Service ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-audit
  namespace: remitflow-v94
  labels:
    app: security-audit
    version: v94
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-audit
  template:
    metadata:
      labels:
        app: security-audit
    spec:
      containers:
        - name: security-audit
          image: python:3.11-slim
          ports:
            - containerPort: 9505
          envFrom:
            - configMapRef:
                name: remitflow-v94-config
          env:
            - name: PORT
              value: "9505"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v94-secrets
                  key: SECURITY_AUDIT_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: audit-logs
              mountPath: /var/log/security-audit
          livenessProbe:
            httpGet:
              path: /health
              port: 9505
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: audit-logs
          persistentVolumeClaim:
            claimName: security-audit-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-audit-pvc
  namespace: remitflow-v94
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: security-audit
  namespace: remitflow-v94
spec:
  selector:
    app: security-audit
  ports:
    - port: 9505
      targetPort: 9505
  type: ClusterIP
---
# ── HPA for v94 services ──────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ab-testing-hpa
  namespace: remitflow-v94
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ab-testing-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rate-alert-hpa
  namespace: remitflow-v94
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rate-alert-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
