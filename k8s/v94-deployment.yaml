              value: "9502"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-v94-secrets
                  key: REFERRAL_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9502
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: referral-engine
  namespace: remitflow-v94
spec:
  selector:
    app: referral-engine
  ports:
    - port: 9502
      targetPort: 9502
  type: ClusterIP
---
