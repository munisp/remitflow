---
# ─────────────────────────────────────────────────────────────────────────────
# RemitFlow v134 — Security Services Kubernetes Manifests
# Deploys: go-security-sidecar, rust-crypto-guard, python-anomaly-detector,
#          python-kyc-liveness, python-sanctions-updater
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app.kubernetes.io/part-of: remitflow
    security: hardened

---
# ── Go Security Sidecar ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-security-sidecar
  namespace: remitflow
  labels:
    app: go-security-sidecar
    tier: security
    version: v134
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-security-sidecar
  template:
    metadata:
      labels:
        app: go-security-sidecar
        tier: security
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: go-security-sidecar
          image: remitflow/go-security-sidecar:v134
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: PORT
              value: "8200"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: REDIS_URL
            - name: UPSTREAM_URL
              value: "http://remitflow-app:3000"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

---
apiVersion: v1
kind: Service
metadata:
  name: go-security-sidecar
  namespace: remitflow
spec:
  selector:
    app: go-security-sidecar
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-security-sidecar-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-security-sidecar
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# ── Rust Crypto Guard ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-crypto-guard
  namespace: remitflow
  labels:
    app: rust-crypto-guard
    tier: security
    version: v134
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-crypto-guard
  template:
    metadata:
      labels:
        app: rust-crypto-guard
        tier: security
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: rust-crypto-guard
          image: remitflow/rust-crypto-guard:v134
          imagePullPolicy: Always
          ports:
            - containerPort: 8201
              name: http
          env:
            - name: PORT
              value: "8201"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: JWT_SECRET
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8201
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8201
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

---
apiVersion: v1
kind: Service
metadata:
  name: rust-crypto-guard
  namespace: remitflow
spec:
  selector:
    app: rust-crypto-guard
  ports:
    - name: http
      port: 8201
      targetPort: 8201
  type: ClusterIP

---
# ── Python Anomaly Detector ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-anomaly-detector
  namespace: remitflow
  labels:
    app: python-anomaly-detector
    tier: security
    version: v134
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-anomaly-detector
  template:
    metadata:
      labels:
        app: python-anomaly-detector
        tier: security
    spec:
      containers:
        - name: python-anomaly-detector
          image: remitflow/python-anomaly-detector:v134
          imagePullPolicy: Always
          ports:
            - containerPort: 8202
              name: http
          env:
            - name: PORT
              value: "8202"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8202
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8202
            initialDelaySeconds: 30
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: python-anomaly-detector
  namespace: remitflow
spec:
  selector:
    app: python-anomaly-detector
  ports:
    - name: http
      port: 8202
      targetPort: 8202
  type: ClusterIP

---
# ── Python KYC Liveness ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-kyc-liveness
  namespace: remitflow
  labels:
    app: python-kyc-liveness
    tier: kyc
    version: v134
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-kyc-liveness
  template:
    metadata:
      labels:
        app: python-kyc-liveness
        tier: kyc
    spec:
      containers:
        - name: python-kyc-liveness
          image: remitflow/python-kyc-liveness:v134
          imagePullPolicy: Always
          ports:
            - containerPort: 8203
              name: http
          env:
            - name: PORT
              value: "8203"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8203
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8203
            initialDelaySeconds: 60
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: python-kyc-liveness
  namespace: remitflow
spec:
  selector:
    app: python-kyc-liveness
  ports:
    - name: http
      port: 8203
      targetPort: 8203
  type: ClusterIP

---
# ── Python Sanctions Updater (CronJob) ────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: python-sanctions-updater
  namespace: remitflow
  labels:
    app: python-sanctions-updater
    tier: compliance
    version: v134
spec:
  schedule: "0 2 * * *"  # Daily at 2am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: python-sanctions-updater
        spec:
          restartPolicy: OnFailure
          containers:
            - name: python-sanctions-updater
              image: remitflow/python-sanctions-updater:v134
              imagePullPolicy: Always
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: remitflow-secrets
                      key: DATABASE_URL
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: remitflow-secrets
                      key: REDIS_URL
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"

---
# ── Network Policy: Security Services ─────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-services-netpol
  namespace: remitflow
spec:
  podSelector:
    matchLabels:
      tier: security
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: remitflow-app
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - port: 8200
        - port: 8201
        - port: 8202
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: remitflow-app
      ports:
        - port: 3000
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
