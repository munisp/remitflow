# TigerBeetle StatefulSet — 3-replica VSR cluster for 1M+ TPS
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: remitflow
  labels:
    app: tigerbeetle
    tier: ledger
spec:
  serviceName: tigerbeetle
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tigerbeetle
  template:
    metadata:
      labels:
        app: tigerbeetle
        tier: ledger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9181"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: tigerbeetle
          image: ghcr.io/tigerbeetle/tigerbeetle:0.16.11
          command:
            - "tigerbeetle"
            - "start"
            - "--addresses=tigerbeetle-0.tigerbeetle:3001,tigerbeetle-1.tigerbeetle:3001,tigerbeetle-2.tigerbeetle:3001"
            - "--cache-grid-bytes=4294967296"
            - "/data/0_0.tigerbeetle"
          ports:
            - containerPort: 3001
              name: tigerbeetle
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "4"
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - tigerbeetle
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-nvme
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle
  namespace: remitflow
  labels:
    app: tigerbeetle
spec:
  clusterIP: None
  ports:
    - port: 3001
      targetPort: tigerbeetle
      protocol: TCP
      name: tigerbeetle
  selector:
    app: tigerbeetle
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tigerbeetle-pdb
  namespace: remitflow
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: tigerbeetle
