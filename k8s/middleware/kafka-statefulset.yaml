# Kafka StatefulSet — 3-broker cluster for 1M+ msg/s
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: remitflow
  labels:
    app: kafka
    tier: messaging
spec:
  serviceName: kafka
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        tier: messaging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9404"
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 29092
              name: kafka-internal
          env:
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_NUM_PARTITIONS
              value: "12"
            - name: KAFKA_NUM_NETWORK_THREADS
              value: "8"
            - name: KAFKA_NUM_IO_THREADS
              value: "16"
            - name: KAFKA_SOCKET_SEND_BUFFER_BYTES
              value: "1048576"
            - name: KAFKA_SOCKET_RECEIVE_BUFFER_BYTES
              value: "1048576"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_FLUSH_INTERVAL_MESSAGES
              value: "100000"
            - name: KAFKA_COMPRESSION_TYPE
              value: "lz4"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms6g -Xmx6g"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: "6Gi"
              cpu: "4"
            limits:
              memory: "8Gi"
              cpu: "8"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kafka-broker-api-versions --bootstrap-server localhost:9092"
            initialDelaySeconds: 30
            periodSeconds: 15
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kafka
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-nvme
        resources:
          requests:
            storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: remitflow
spec:
  clusterIP: None
  ports:
    - port: 9092
      name: external
    - port: 29092
      name: internal
  selector:
    app: kafka
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-pdb
  namespace: remitflow
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: kafka
