---
# RemitFlow — Kubernetes Microservices Stack
# All Go, Rust, and Python microservices
# Apply with: kubectl apply -f k8s/middleware/services-stack.yaml
# Namespace: remitflow
---
# ── FX Engine (Go) ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-engine
  namespace: remitflow
  labels:
    app: fx-engine
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fx-engine
  template:
    metadata:
      labels:
        app: fx-engine
        version: v1
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "fx-engine"
        dapr.io/app-port: "8080"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: fx-engine
          image: remitflow/fx-engine:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.remitflow-middleware.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: remitflow-app-secrets
                  key: redis-password
            - name: KAFKA_BROKERS
              value: "kafka.remitflow-middleware.svc.cluster.local:9092"
            - name: OPEN_EXCHANGE_RATES_APP_ID
              valueFrom:
                secretKeyRef:
                  name: remitflow-app-secrets
                  key: open-exchange-rates-app-id
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fx-engine
  namespace: remitflow
spec:
  selector:
    app: fx-engine
  ports:
    - port: 8080
      targetPort: 8080
---
# ── Mojaloop Connector (Go) ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-connector
  namespace: remitflow
  labels:
    app: mojaloop-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mojaloop-connector
  template:
    metadata:
      labels:
        app: mojaloop-connector
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mojaloop-connector"
        dapr.io/app-port: "8081"
    spec:
      containers:
        - name: mojaloop-connector
