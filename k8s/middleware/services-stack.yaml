# ── v63: Go Transfer Engine (gRPC state machine + fraud scoring) ──────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-engine
  namespace: remitflow
  labels:
    app: transfer-engine
    version: v63
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transfer-engine
  template:
    metadata:
      labels:
        app: transfer-engine
    spec:
      containers:
        - name: transfer-engine
          image: remitflow/transfer-engine:latest
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: PORT
              value: "50051"
            - name: GO_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-app-secrets
                  key: database-url
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo health | nc -w1 localhost 50051 || exit 0"]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["sh", "-c", "echo health | nc -w1 localhost 50051 || exit 0"]
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-engine
  namespace: remitflow
spec:
  selector:
    app: transfer-engine
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
      protocol: TCP
---
