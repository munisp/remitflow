# RemitFlow v76 — Kubernetes Manifests for Polyglot Microservices
# Apply: kubectl apply -f k8s/microservices-v76.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app.kubernetes.io/part-of: remitflow
    version: "v76"

---
# ─── Go: NGX Price Feed ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngx-price-feed
  namespace: remitflow
  labels:
    app: ngx-price-feed
    language: go
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngx-price-feed
  template:
    metadata:
      labels:
        app: ngx-price-feed
        language: go
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: ngx-price-feed
          image: remitflow/ngx-price-feed:v76
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: GIN_MODE
              value: "release"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ngx-price-feed
  namespace: remitflow
spec:
  selector:
    app: ngx-price-feed
  ports:
    - port: 8081
      targetPort: 8081

---
# ─── Go: API Gateway ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: remitflow
  labels:
    app: api-gateway
    language: go
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        language: go
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: api-gateway
          image: remitflow/api-gateway:v76
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: GIN_MODE
              value: "release"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: remitflow
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8082
      targetPort: 8082

