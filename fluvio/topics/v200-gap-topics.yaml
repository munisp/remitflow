# Fluvio Stream Topic Definitions — v200 Gap Features
# Real-time data streams for West Africa corridors, HNW, SME, correspondent banking
# All topics use 3 partitions for parallelism and 7-day retention

topics:
  # ─── West Africa XOF Corridor ────────────────────────────────────────────────
  - name: xof-fx-rates
    description: "Real-time XOF/NGN FX rate feed from BCEAO and market makers"
    partitions: 3
    replication: 2
    retention:
      time: 86400  # 24 hours — FX rates are time-sensitive
      size: 104857600  # 100MB
    config:
      compression: lz4
      max_message_bytes: 65536
    schema:
      type: json
      fields:
        - name: corridor_code
          type: string
          description: "TG, NE, ML, BJ, GH"
        - name: xof_per_ngn
          type: float64
          description: "XOF per 1 NGN"
        - name: bid
          type: float64
        - name: ask
          type: float64
        - name: spread_bps
          type: float64
        - name: source
          type: string
          description: "bceao, market_maker, fallback"
        - name: timestamp
          type: int64
          description: "Unix timestamp milliseconds"

  - name: xof-transfer-events
    description: "Real-time XOF corridor transfer lifecycle events"
    partitions: 3
    replication: 2
    retention:
      time: 604800  # 7 days
      size: 1073741824  # 1GB
    config:
      compression: lz4
    schema:
      type: json
      fields:
        - name: transfer_id
          type: string
        - name: event_type
          type: string
          description: "initiated, fx_reserved, mojaloop_submitted, settled, failed"
        - name: user_id
          type: int64
        - name: corridor_code
          type: string
        - name: amount_ngn
          type: float64
        - name: amount_xof
          type: float64
        - name: mojaloop_txn_id
          type: string
        - name: timestamp
          type: int64

  # ─── HNW Private Banking ─────────────────────────────────────────────────────
  - name: hnw-rate-locks
    description: "HNW FX rate lock creation and expiry events"
    partitions: 2
    replication: 2
    retention:
      time: 7200  # 2 hours — rate locks expire in 30 min, keep 2h for audit
      size: 10485760  # 10MB
    config:
      compression: none
    schema:
      type: json
      fields:
        - name: lock_id
          type: string
        - name: user_id
          type: int64
        - name: corridor_code
          type: string
        - name: amount_ngn
          type: float64
        - name: fx_rate
          type: float64
        - name: spread_bps
          type: float64
        - name: event_type
          type: string
          description: "created, executed, expired, cancelled"
        - name: expires_at
          type: int64
        - name: timestamp
          type: int64

  - name: hnw-portfolio-updates
    description: "HNW client portfolio and AUM update events"
    partitions: 2
    replication: 2
    retention:
      time: 604800  # 7 days
      size: 104857600  # 100MB
    config:
      compression: lz4
    schema:
      type: json
      fields:
        - name: user_id
          type: int64
        - name: aum_ngn
          type: float64
        - name: aum_tier
          type: string
        - name: negotiated_spread_bps
          type: float64
        - name: event_type
          type: string
          description: "aum_updated, tier_upgraded, rm_assigned"
        - name: timestamp
          type: int64

  # ─── SME Trade Payments ──────────────────────────────────────────────────────
  - name: sme-batch-status
    description: "SME bulk payment batch status updates — real-time progress"
    partitions: 3
    replication: 2
    retention:
      time: 604800  # 7 days
      size: 536870912  # 512MB
    config:
      compression: lz4
    schema:
      type: json
      fields:
        - name: batch_id
          type: string
        - name: user_id
          type: int64
        - name: corridor_code
          type: string
        - name: total_payments
          type: int32
        - name: processed
          type: int32
        - name: succeeded
          type: int32
        - name: failed
          type: int32
        - name: status
          type: string
          description: "processing, completed, failed"
        - name: timestamp
          type: int64

  - name: form-m-events
    description: "Form M validation and CBN submission events"
    partitions: 2
    replication: 2
    retention:
      time: 2592000  # 30 days — regulatory requirement
      size: 104857600  # 100MB
    config:
      compression: lz4
    schema:
      type: json
      fields:
        - name: form_m_number
          type: string
        - name: user_id
          type: int64
        - name: corridor_code
          type: string
        - name: value_usd
          type: float64
        - name: event_type
          type: string
          description: "submitted, validated, rejected, cbn_approved"
        - name: timestamp
          type: int64

  # ─── Correspondent Banking ───────────────────────────────────────────────────
  - name: correspondent-liquidity
    description: "Nostro/vostro balance alerts and rebalancing triggers"
    partitions: 2
    replication: 2
    retention:
      time: 604800  # 7 days
      size: 52428800  # 50MB
    config:
      compression: none
    schema:
      type: json
      fields:
        - name: correspondent_id
          type: string
        - name: bank_name
          type: string
        - name: currency
          type: string
        - name: nostro_balance_usd
          type: float64
        - name: vostro_balance_usd
          type: float64
        - name: utilization_pct
          type: float64
        - name: alert_type
          type: string
          description: "low_nostro, high_vostro, rebalance_triggered, rebalance_completed"
        - name: threshold_usd
          type: float64
        - name: timestamp
          type: int64

  # ─── Diaspora Acquisition ────────────────────────────────────────────────────
  - name: diaspora-offers
    description: "Cross-sell and acquisition offer events for USA/EU/Canada diaspora"
    partitions: 2
    replication: 2
    retention:
      time: 2592000  # 30 days
      size: 104857600  # 100MB
    config:
      compression: lz4
    schema:
      type: json
      fields:
        - name: user_id
          type: int64
        - name: diaspora_region
          type: string
          description: "usa, eu_italy, eu_germany, canada"
        - name: offer_type
          type: string
          description: "zero_fee_first_transfer, referral_bonus, ach_cashback, sepa_instant_promo"
        - name: event_type
          type: string
          description: "shown, clicked, converted, dismissed"
        - name: acquisition_channel
          type: string
        - name: timestamp
          type: int64

  # ─── Immigrant Worker ────────────────────────────────────────────────────────
  - name: immigrant-worker-events
    description: "Immigrant worker KYC and transfer events"
    partitions: 2
    replication: 2
    retention:
      time: 604800  # 7 days
      size: 104857600  # 100MB
    config:
      compression: lz4
    schema:
      type: json
      fields:
        - name: user_id
          type: int64
        - name: kyc_tier
          type: string
        - name: event_type
          type: string
          description: "kyc_verified, kyc_upgraded, transfer_initiated, limit_reached"
        - name: amount_ngn
          type: float64
        - name: monthly_used_usd
          type: float64
        - name: timestamp
          type: int64
