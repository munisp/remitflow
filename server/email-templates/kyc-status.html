<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYC Verification Update - RemitFlow</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="background-color:#6366f1;padding:24px 32px;">
              <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:700;">RemitFlow</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="margin:0 0 16px;font-size:20px;color:#111827;">KYC Verification {{STATUS}}</h2>
              <div style="padding:16px;background-color:{{STATUS_BG}};border-radius:8px;border:1px solid {{STATUS_BORDER}};margin-bottom:24px;">
                <p style="margin:0;font-size:16px;font-weight:600;color:{{STATUS_COLOR}};">{{STATUS_MESSAGE}}</p>
              </div>
              <p style="margin:0 0 16px;font-size:14px;color:#4b5563;line-height:1.6;">Hi {{USER_NAME}},</p>
              <p style="margin:0 0 16px;font-size:14px;color:#4b5563;line-height:1.6;">{{BODY_MESSAGE}}</p>
              <table width="100%" cellpadding="8" cellspacing="0" style="border:1px solid #e5e7eb;border-radius:8px;margin-bottom:24px;">
                <tr style="border-bottom:1px solid #e5e7eb;">
                  <td style="color:#6b7280;font-size:14px;padding:12px 16px;">Verification Level</td>
                  <td style="font-weight:600;font-size:14px;padding:12px 16px;text-align:right;">Tier {{TIER}}</td>
                </tr>
                <tr style="border-bottom:1px solid #e5e7eb;">
                  <td style="color:#6b7280;font-size:14px;padding:12px 16px;">Daily Limit</td>
                  <td style="font-size:14px;padding:12px 16px;text-align:right;">{{DAILY_LIMIT}}</td>
                </tr>
                <tr>
                  <td style="color:#6b7280;font-size:14px;padding:12px 16px;">Monthly Limit</td>
                  <td style="font-size:14px;padding:12px 16px;text-align:right;">{{MONTHLY_LIMIT}}</td>
                </tr>
              </table>
              <div style="text-align:center;">
                <a href="{{APP_URL}}/kyc" style="display:inline-block;background-color:#6366f1;color:#ffffff;text-decoration:none;padding:12px 32px;border-radius:6px;font-weight:600;font-size:14px;">{{CTA_TEXT}}</a>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;background-color:#f9fafb;border-top:1px solid #e5e7eb;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">RemitFlow Ltd | FCA Authorized Payment Institution</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
