# =============================================================================
# RemitFlow — open-appsec WAF Performance Tuning
# Target: Handle 1M+ req/sec without adding >1ms latency
#
# open-appsec is an ML-based WAF that learns traffic patterns.
# Tuning focuses on:
#   1. ML engine throughput (async scoring, batch processing)
#   2. Connection handling (keep-alive, buffer sizes)
#   3. Policy optimization (skip static, focus on API routes)
#   4. Resource limits (CPU/memory caps to prevent WAF from starving app)
# =============================================================================

# ── Agent Configuration ──────────────────────────────────────────────────────
agent:
  # Processing mode: non-blocking async (don't delay requests)
  mode: prevent-async
  # Max concurrent requests being scored
  max_concurrent_inspections: 10000
  # Inspection timeout: fail-open after 5ms
  inspection_timeout_ms: 5
  # Request body inspection limit: 64KB (skip large file uploads)
  max_body_size_bytes: 65536
  # Skip inspection for responses (only inspect requests)
  inspect_response: false
  # Log level: warning in production (reduce I/O)
  log_level: warning
  # Metrics: expose Prometheus-compatible metrics
  metrics_enabled: true
  metrics_port: 9191

# ── ML Engine Tuning ─────────────────────────────────────────────────────────
ml_engine:
  # Model inference batch size
  batch_size: 64
  # Inference timeout per batch
  timeout_ms: 10
  # Thread pool for ML inference
  inference_threads: 4
  # Model cache: keep models in memory
  model_cache_size_mb: 512
  # Learning rate decay: slow down model updates in production
  learning_rate_decay: 0.999
  # Anomaly threshold: 0.7 (lower = more aggressive blocking)
  anomaly_threshold: 0.7
  # Update interval: retrain model every 6 hours
  model_update_interval_hours: 6

# ── Connection Handling ──────────────────────────────────────────────────────
network:
  # Keep-alive: reuse connections between APISIX and WAF agent
  keepalive_enabled: true
  keepalive_timeout_sec: 120
  keepalive_max_requests: 100000
  # Socket buffer sizes
  recv_buffer_size_bytes: 1048576  # 1MB
  send_buffer_size_bytes: 1048576  # 1MB
  # Max connections from APISIX
  max_connections: 10000
  # Connection timeout
  connect_timeout_ms: 100
  # Backlog queue
  listen_backlog: 65535

# ── Policy Optimization ─────────────────────────────────────────────────────
policy:
  # Bypass rules: skip WAF for known-safe paths
  bypass_rules:
    - path_prefix: /health
    - path_prefix: /ready
    - path_prefix: /metrics
    - path_prefix: /api/docs
    - path_prefix: /assets/
    - path_prefix: /static/
    - path_prefix: /favicon.ico
    - path_prefix: /manifest.json
    - path_prefix: /sw.js
    - method: OPTIONS  # CORS preflight

  # Enhanced inspection: deeper analysis for financial endpoints
  enhanced_inspection:
    - path_prefix: /api/trpc/transfer
      body_inspection: true
      max_body_size_bytes: 131072  # 128KB
    - path_prefix: /api/webhooks/
      body_inspection: true
      hmac_validation: true
    - path_prefix: /api/trpc/admin
      body_inspection: true
      strict_mode: true

  # Rate limit integration: auto-block IPs exceeding thresholds
  auto_block:
    enabled: true
    # Block IP after 5 WAF violations in 1 minute
    violation_threshold: 5
    violation_window_sec: 60
    # Block duration: 15 minutes
    block_duration_sec: 900
    # Permanent block after 3 temporary blocks
    permanent_block_threshold: 3

  # Trusted sources: skip inspection for internal services
  trusted_sources:
    - cidr: 10.0.0.0/8
    - cidr: 172.16.0.0/12
    - cidr: 192.168.0.0/16

# ── Resource Limits ──────────────────────────────────────────────────────────
resources:
  # CPU: cap at 4 cores (don't starve application pods)
  cpu_limit_cores: 4
  cpu_request_cores: 2
  # Memory: 2GB for ML models + inference buffers
  memory_limit_gb: 2
  memory_request_gb: 1
  # Disk: 1GB for model storage + logs
  disk_limit_gb: 1

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  # Only log blocked requests (reduce I/O)
  log_blocked_only: true
  # Structured JSON logs for OpenSearch ingestion
  format: json
  # Rotate logs: 100MB max, 5 files
  max_file_size_mb: 100
  max_files: 5
  # Send security events to Kafka for SIEM
  kafka_topic: remitflow.security.waf-events
  kafka_brokers: kafka-0:29092,kafka-1:29092,kafka-2:29092
