# =============================================================================
# RemitFlow PostgreSQL 16 — Tuned for 1M+ TPS (64-core, 256GB RAM target)
# =============================================================================

# ── Connection Handling ──────────────────────────────────────────────────────
# PgBouncer sits in front, so PG itself doesn't need thousands of connections.
# Each backend connection uses ~10MB RAM. 200 backends × 10MB = 2GB.
max_connections = 200
superuser_reserved_connections = 5

# ── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 64GB                 # 25% of 256GB RAM
effective_cache_size = 192GB          # 75% of RAM — OS page cache + shared_buffers
work_mem = 256MB                      # per-sort/hash — generous for complex queries
maintenance_work_mem = 2GB            # VACUUM, CREATE INDEX
huge_pages = try                      # 2MB huge pages reduce TLB misses

# ── WAL (Write-Ahead Log) — Throughput-Critical ──────────────────────────────
wal_level = replica                   # minimal doesn't allow streaming replication
wal_buffers = 256MB                   # 1/256 of shared_buffers, capped
max_wal_size = 16GB                   # delay checkpoints → fewer IOPS spikes
min_wal_size = 4GB
checkpoint_completion_target = 0.9    # spread checkpoint writes
checkpoint_timeout = 15min            # less frequent checkpoints
wal_compression = lz4                 # 40% WAL size reduction, minimal CPU
full_page_writes = on                 # required for crash safety
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# ── Synchronous Commit Tuning ────────────────────────────────────────────────
# For financial data: synchronous_commit = on (default). 
# For audit logs / analytics: set per-session to 'off' for 10x write throughput.
synchronous_commit = on

# ── Background Writer ────────────────────────────────────────────────────────
bgwriter_delay = 20ms                 # more aggressive than default 200ms
bgwriter_lru_maxpages = 1000          # write up to 1000 pages per round
bgwriter_lru_multiplier = 4.0         # anticipate future needs
bgwriter_flush_after = 512kB

# ── Autovacuum — Aggressive for High-Churn Tables ───────────────────────────
autovacuum_max_workers = 6            # default 3 too few for 1M TPS
autovacuum_naptime = 10s              # check every 10s (default 1min)
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.01 # vacuum when 1% changed (default 20%)
autovacuum_analyze_scale_factor = 0.005
autovacuum_vacuum_cost_delay = 2ms    # less throttling
autovacuum_vacuum_cost_limit = 2000   # higher budget

# ── Parallel Query ───────────────────────────────────────────────────────────
max_parallel_workers_per_gather = 8
max_parallel_workers = 16
max_parallel_maintenance_workers = 4
parallel_leader_participation = on

# ── Planner ──────────────────────────────────────────────────────────────────
random_page_cost = 1.1                # SSD storage (NVMe)
effective_io_concurrency = 200        # NVMe can handle 200+ concurrent IOs
seq_page_cost = 1.0
cpu_tuple_cost = 0.03
default_statistics_target = 500       # better cardinality estimates
jit = on                              # JIT for complex analytical queries
jit_above_cost = 100000

# ── Replication ──────────────────────────────────────────────────────────────
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on
wal_keep_size = 2GB

# ── Logging (lightweight for production) ──────────────────────────────────────
log_min_duration_statement = 500      # log queries slower than 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1000

# ── Connection Keepalive ─────────────────────────────────────────────────────
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ── Partitioning ─────────────────────────────────────────────────────────────
enable_partition_pruning = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
