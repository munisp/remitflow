# =============================================================================
# RemitFlow Mojaloop — Connector + Hub Tuning for 1M+ TPS
# =============================================================================
# Mojaloop is inherently limited by its multi-hop consensus model (quote → 
# transfer → fulfil). The real bottleneck is the scheme adapter, not Mojaloop
# hub itself. Key optimizations:
#   1. Connection pooling on the Go connector
#   2. Async forwarding with bounded goroutine pools
#   3. Bulk quotes and transfers (ISO 20022 bulk messages)
#   4. Pre-cached party lookups (Redis) to skip lookup round-trips

# ── Go Connector Tuning ──────────────────────────────────────────────────────
connector:
  # HTTP server tuning
  server:
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
    max_header_bytes: 65536

  # Connection pool to Mojaloop Hub
  http_client:
    max_idle_conns: 200
    max_idle_conns_per_host: 100
    max_conns_per_host: 200
    idle_conn_timeout: 90s
    tls_handshake_timeout: 5s
    expect_continue_timeout: 1s
    disable_keep_alives: false
    response_header_timeout: 30s

  # Connection pool to Node.js Core (webhook forwarding)
  core_client:
    max_idle_conns: 100
    max_idle_conns_per_host: 50
    idle_conn_timeout: 90s

  # Goroutine pool for async forwarding
  worker_pool:
    max_workers: 1000
    queue_size: 50000
    batch_size: 100
    batch_timeout: 10ms

  # Party lookup cache (Redis)
  party_cache:
    enabled: true
    ttl: 300s
    max_entries: 1000000

  # Quote cache (short TTL for live FX rates)
  quote_cache:
    enabled: true
    ttl: 30s
    max_entries: 100000

# ── Mojaloop Central Ledger Tuning ───────────────────────────────────────────
# These are environment variables for the mojaloop/central-ledger container.
central_ledger:
  NODE_ENV: production
  # Database connection pool
  CLEDG_DATABASE__POOL__MIN: 20
  CLEDG_DATABASE__POOL__MAX: 100
  CLEDG_DATABASE__POOL__ACQUIRE_TIMEOUT_MS: 30000
  CLEDG_DATABASE__POOL__CREATE_TIMEOUT_MS: 30000
  CLEDG_DATABASE__POOL__IDLE_TIMEOUT_MS: 30000
  # Cache
  CLEDG_CACHE__ENABLED: true
  CLEDG_CACHE__EXPIRES_IN_MS: 30000
  # Kafka producer
  CLEDG_KAFKA__PRODUCER__BATCH__SIZE: 524288
  CLEDG_KAFKA__PRODUCER__LINGER__MS: 5
  CLEDG_KAFKA__PRODUCER__COMPRESSION__TYPE: lz4
  # Position handler
  CLEDG_HANDLERS__API__DISABLED: false
  CLEDG_HANDLERS__TRANSFERS__PREPARE__DISABLED: false
  CLEDG_HANDLERS__TRANSFERS__FULFIL__DISABLED: false
  CLEDG_HANDLERS__TIMEOUT__DISABLED: false
  # Settlement model
  CLEDG_SETTLEMENT__MODEL__NAME: DEFAULT
  CLEDG_SETTLEMENT__DELAY: DEFERRED

# ── FSPIOP Config Overrides ──────────────────────────────────────────────────
fspiop:
  version: "1.1"
  dfsp_id: "remitflow-dfsp"
  timeouts:
    party_lookup_ms: 10000
    quote_ms: 15000
    transfer_ms: 15000
    bulk_transfer_ms: 60000
  # Bulk operations: process up to 1000 transfers per bulk message
  bulk:
    max_transfers_per_message: 1000
    enabled: true
  # JWS signing: use Ed25519 for speed (2x faster than RS256)
  jws:
    enabled: true
    algorithm: EdDSA
    signing_key_path: "/secrets/mojaloop-jws-ed25519.pem"
