# =============================================================================
# RemitFlow — Linux Kernel Tuning for 1M+ TPS
# =============================================================================
# Apply via: sysctl -p /etc/sysctl.d/99-remitflow.conf
# Or add to K8s node DaemonSet init container.

# ── Network Stack ────────────────────────────────────────────────────────────
# Max connections waiting to be accepted (SYN backlog).
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# Socket buffer sizes (auto-tuning range).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# Network queue backlog (packets queued before kernel processes them).
net.core.netdev_max_backlog = 65536
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

# TCP connection reuse (critical for high connection rates).
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_tw_buckets = 2000000

# Keepalive (faster detection of dead connections).
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# TCP fast open (reduce connection latency).
net.ipv4.tcp_fastopen = 3

# Increase local port range for outbound connections.
net.ipv4.ip_local_port_range = 1024 65535

# Disable SYN cookies under normal load (they bypass the backlog queue).
net.ipv4.tcp_syncookies = 1

# TCP congestion control: BBR for better throughput on lossy networks.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# ── File Descriptors ─────────────────────────────────────────────────────────
fs.file-max = 2097152
fs.nr_open = 2097152

# ── Virtual Memory ──────────────────────────────────────────────────────────
# Reduce swappiness: keep data in RAM.
vm.swappiness = 10
# Don't overcommit: fail early instead of OOM killing.
vm.overcommit_memory = 0
# Dirty page ratio: flush at 10% of RAM (prevents IO storms).
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
# Hugepages for PostgreSQL/Redis.
vm.nr_hugepages = 16384

# ── io_uring (TigerBeetle) ──────────────────────────────────────────────────
fs.aio-max-nr = 1048576

# ── IPC (shared memory for PostgreSQL) ───────────────────────────────────────
kernel.shmmax = 68719476736
kernel.shmall = 16777216
