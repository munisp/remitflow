# =============================================================================
# RemitFlow Kafka Consumer — Tuned for 1M+ msg/s
# =============================================================================

# ── Fetch Tuning ─────────────────────────────────────────────────────────────
# fetch.min.bytes: wait until at least 1KB available (reduces round trips).
# fetch.max.bytes: pull up to 50MB per fetch (large batches).
# max.partition.fetch.bytes: up to 10MB per partition per fetch.
fetch.min.bytes=1024
fetch.max.bytes=52428800
max.partition.fetch.bytes=10485760
fetch.max.wait.ms=500

# ── Poll Tuning ──────────────────────────────────────────────────────────────
max.poll.records=1000
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=10000

# ── Auto Commit ──────────────────────────────────────────────────────────────
enable.auto.commit=false
auto.offset.reset=latest

# ── Connection ───────────────────────────────────────────────────────────────
connections.max.idle.ms=540000
request.timeout.ms=30000

# ── Deserialization ──────────────────────────────────────────────────────────
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
