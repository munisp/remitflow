# =============================================================================
# RemitFlow Redis 7.2 — Tuned for 1M+ ops/s (per-node, 6-node cluster)
# =============================================================================
# Deploy as 6-node cluster: 3 masters + 3 replicas for HA + sharding.
# Each node handles ~300K ops/s → 900K+ aggregate with 3 masters.

# ── Cluster Mode ─────────────────────────────────────────────────────────────
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-migration-barrier 1
cluster-require-full-coverage no
cluster-allow-reads-when-down yes

# ── Memory ───────────────────────────────────────────────────────────────────
maxmemory 32gb
maxmemory-policy allkeys-lfu
# LFU (Least Frequently Used) is better than LRU for financial caches
# where hot keys (FX rates, user sessions) should stay in cache.
lfu-log-factor 10
lfu-decay-time 1

# ── Network / Threading ─────────────────────────────────────────────────────
# Redis 7 I/O threading: main thread handles commands, I/O threads handle
# socket read/write. 4 I/O threads on 8+ core boxes → ~2x throughput.
io-threads 4
io-threads-do-reads yes
bind 0.0.0.0
protected-mode no
tcp-backlog 65535
tcp-keepalive 300
timeout 0

# ── Persistence (tuned for throughput, not durability — PG is source of truth)
save 3600 1
save 300 100
save 60 50000
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
aof-use-rdb-preamble yes

# ── Snapshotting ─────────────────────────────────────────────────────────────
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error no

# ── Lazy Freeing ─────────────────────────────────────────────────────────────
# Offload expensive memory frees to background threads.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# ── Client Output Buffer Limits ──────────────────────────────────────────────
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 512mb 128mb 60
client-output-buffer-limit pubsub 64mb 16mb 60

# ── Slow Log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 5000
slowlog-max-len 256
latency-monitor-threshold 50

# ── Active Defrag ────────────────────────────────────────────────────────────
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# ── Keyspace Notifications ───────────────────────────────────────────────────
notify-keyspace-events ""

# ── Connection Limits ────────────────────────────────────────────────────────
maxclients 65535
