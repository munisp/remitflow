# =============================================================================
# RemitFlow Temporal — Dynamic Config for 1M+ workflow executions/sec
# =============================================================================
# Place at /etc/temporal/config/dynamicconfig/production.yaml
# Temporal server reads this at runtime without restart.

# ── History Service ──────────────────────────────────────────────────────────
# Increase cache sizes to reduce DB round-trips.
history.cacheMaxSize:
  - value: 65536
    constraints: {}
history.cacheTTL:
  - value: "1h"
    constraints: {}

# Max concurrent workflow task pollers per history shard.
history.maxConcurrentWorkflowTaskPollers:
  - value: 32
    constraints: {}

# Reduce history event persistence batch delay.
history.transferProcessorUpdateShardTaskCount:
  - value: 100
    constraints: {}

# ── Matching Service ─────────────────────────────────────────────────────────
# Task queue processing throughput.
matching.numTaskqueueReadPartitions:
  - value: 16
    constraints: {}
matching.numTaskqueueWritePartitions:
  - value: 16
    constraints: {}

# Max tasks dispatched per second per task queue partition.
matching.rps:
  - value: 10000
    constraints: {}

matching.forwarderMaxOutstandingPolls:
  - value: 20
    constraints: {}
matching.forwarderMaxRatePerSecond:
  - value: 50000
    constraints: {}

# ── Frontend Service ─────────────────────────────────────────────────────────
frontend.rps:
  - value: 100000
    constraints: {}
frontend.namespaceRPS:
  - value: 50000
    constraints: {}
frontend.globalNamespaceRPS:
  - value: 100000
    constraints: {}
frontend.maxNamespaceCountPerInstance:
  - value: 100
    constraints: {}

# ── Worker Pool ──────────────────────────────────────────────────────────────
# Sticky execution: re-route workflow tasks to the same worker.
# Eliminates cache misses from workflow history replay.
worker.enableStickyQuery:
  - value: true
    constraints: {}

# ── Persistence ──────────────────────────────────────────────────────────────
# Increase max concurrent DB operations.
system.visibilityProcessorMaxPollRPS:
  - value: 5000
    constraints: {}
system.timerProcessorMaxPollRPS:
  - value: 5000
    constraints: {}
system.transferProcessorMaxPollRPS:
  - value: 5000
    constraints: {}

# ── Archival ─────────────────────────────────────────────────────────────────
# Reduce retention overhead by archiving completed workflows faster.
system.archivalProcessorMaxPollRPS:
  - value: 1000
    constraints: {}

# ── Visibility ───────────────────────────────────────────────────────────────
# Dual-write to advanced visibility (OpenSearch) for fast queries.
system.enableReadFromSecondaryAdvancedVisibility:
  - value: true
    constraints: {}

# ── Rate Limiting ────────────────────────────────────────────────────────────
# Per-namespace rate limits for workflow start / signal / query.
frontend.maxNamespaceWorkflowIDReuseInterval:
  - value: "0s"
    constraints: {}
