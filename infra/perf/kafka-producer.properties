# =============================================================================
# RemitFlow Kafka Producer — Tuned for 1M+ msg/s
# =============================================================================

# ── Batching (most impactful setting for throughput) ─────────────────────────
# batch.size: max bytes per partition batch. 512KB allows large batches.
# linger.ms: wait up to 5ms to fill batch before sending.
# Together: collect up to 512KB or wait 5ms, whichever comes first.
batch.size=524288
linger.ms=5
buffer.memory=268435456

# ── Compression ──────────────────────────────────────────────────────────────
# lz4: best throughput/compression ratio. zstd: better compression, more CPU.
# For 1M TPS, lz4 gives ~4x compression with minimal CPU overhead.
compression.type=lz4

# ── Acknowledgments ──────────────────────────────────────────────────────────
# acks=all: wait for all in-sync replicas. Required for financial data.
# For non-critical events (analytics, logs): acks=1 for 2x throughput.
acks=all
retries=2147483647
delivery.timeout.ms=120000
retry.backoff.ms=100
retry.backoff.max.ms=1000

# ── Idempotence ──────────────────────────────────────────────────────────────
enable.idempotence=true
max.in.flight.requests.per.connection=5

# ── Serialization ────────────────────────────────────────────────────────────
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# ── Connection ───────────────────────────────────────────────────────────────
connections.max.idle.ms=540000
max.block.ms=60000
request.timeout.ms=30000
