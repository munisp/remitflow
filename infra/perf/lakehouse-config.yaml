# =============================================================================
# RemitFlow — Lakehouse ETL Performance Tuning
# Target: Process 1M+ records/sec through Bronze → Silver → Gold pipeline
#
# Architecture:
#   PostgreSQL (OLTP) ──CDC──> Bronze (raw Parquet) ──> Silver ──> Gold
#   Storage: S3/MinIO (Parquet + Iceberg)
#   Query: DuckDB (in-process OLAP)
#   CDC: PostgreSQL logical replication (wal2json)
#
# Hardware target: 16-core / 64GB RAM / NVMe storage
# =============================================================================

# ── Database Connection Pool ─────────────────────────────────────────────────
database:
  # asyncpg pool: max connections for CDC + batch extraction
  pool_min_size: 10
  pool_max_size: 50
  pool_max_queries: 50000  # recycle connections after 50K queries
  pool_max_inactive_connection_lifetime: 300  # 5 minutes
  command_timeout: 120  # 2 minutes for large batch queries
  # Statement cache per connection
  statement_cache_size: 1024
  # Prepared statements for repeated queries
  prepared_statement_cache_size: 256

# ── CDC (Change Data Capture) ────────────────────────────────────────────────
cdc:
  enabled: true
  slot_name: remitflow_lakehouse_cdc
  # Publication: only capture relevant tables
  publication_tables:
    - transactions
    - wallets
    - users
    - auditLogs
    - compliance_cases
    - fx_rates
  # Batch size: 10K changes per CDC poll
  batch_size: 10000
  # Poll interval: 100ms for near-real-time
  poll_interval_ms: 100
  # Max WAL sender connections
  max_wal_senders: 4
  # WAL keep size: 2GB before forcing checkpoint
  wal_keep_size_mb: 2048

# ── PyArrow / Parquet ────────────────────────────────────────────────────────
parquet:
  # Row group size: 128MB (optimal for S3 reads)
  row_group_size_bytes: 134217728
  # Page size: 1MB (optimal for column pushdown)
  data_page_size_bytes: 1048576
  # Dictionary encoding: enable for low-cardinality columns
  dictionary_enabled: true
  dictionary_page_size_bytes: 2097152  # 2MB
  # Compression: zstd level 3 (best ratio for analytics)
  compression: zstd
  compression_level: 3
  # Writer batch size: 100K rows per batch
  write_batch_size: 100000
  # Max file size: 256MB (triggers new file)
  max_file_size_bytes: 268435456
  # Statistics: enable for predicate pushdown
  write_statistics: true
  # Bloom filter: enable for transfer_id and user_id columns
  bloom_filter_columns:
    - transfer_id
    - user_id
    - reference
    - corridor

# ── Iceberg Catalog ──────────────────────────────────────────────────────────
iceberg:
  # Manifest list: compact after 100 data files
  manifest_target_size_bytes: 8388608  # 8MB
  manifest_min_merge_count: 100
  # Snapshot expiry: keep 100 snapshots (time-travel)
  max_snapshots: 100
  snapshot_expiry_hours: 168  # 7 days
  # Schema evolution: allow column additions
  allow_schema_evolution: true
  # Partition spec: daily partitions for time-series data
  default_partition:
    field: created_at
    transform: day
  # Sort order: optimize for common query patterns
  sort_order:
    - field: created_at
      direction: desc
    - field: user_id
      direction: asc

# ── DuckDB (OLAP Query Engine) ───────────────────────────────────────────────
duckdb:
  # Threads: use all available cores
  threads: 16
  # Memory limit: 32GB for OLAP queries
  memory_limit_gb: 32
  # Temp directory: NVMe for spill-to-disk
  temp_directory: /data/duckdb_temp
  # Enable parallel CSV/Parquet reading
  enable_object_cache: true
  # Max memory per query
  max_memory_per_query_gb: 8
  # Preserve insertion order: false (allow parallel inserts)
  preserve_insertion_order: false
  # Enable progress bar for long queries
  enable_progress_bar: false
  # HTTP keep-alive for S3 reads
  s3_use_ssl: true
  s3_url_style: path
  # Parquet file cache
  enable_parquet_metadata_cache: true

# ── ETL Pipeline ─────────────────────────────────────────────────────────────
pipeline:
  # Batch size: 100K records per pipeline run
  batch_size: 100000
  # Max concurrent extractors
  max_concurrent_extractors: 8
  # Bronze → Silver: parallel transformation
  silver_transform_threads: 8
  # Silver → Gold: aggregation parallelism
  gold_aggregate_threads: 4
  # Pipeline interval: hourly for batch, continuous for CDC
  batch_interval_sec: 3600
  cdc_interval_sec: 1  # near-real-time CDC processing
  # Retry on failure
  max_retries: 3
  retry_backoff_sec: 30
  # Checkpoint: save progress every 10K records
  checkpoint_interval: 10000

# ── S3/MinIO Storage ─────────────────────────────────────────────────────────
storage:
  # Connection pool for S3 uploads
  max_connections: 50
  # Multipart upload: 64MB parts
  multipart_chunk_size_bytes: 67108864
  # Concurrent uploads: 8 threads
  max_concurrent_uploads: 8
  # Transfer acceleration: enable if using AWS S3
  transfer_acceleration: false
  # Server-side encryption
  sse_enabled: true
  sse_algorithm: AES256

# ── Compaction ───────────────────────────────────────────────────────────────
compaction:
  # Auto-compact when file count exceeds threshold
  auto_compact_enabled: true
  # Compact when > 50 small files per partition
  small_file_threshold: 50
  # Target file size after compaction: 256MB
  target_file_size_bytes: 268435456
  # Max concurrent compaction tasks
  max_concurrent_tasks: 4
  # Compaction schedule: every 4 hours
  schedule_interval_hours: 4
  # Z-order optimization for multi-column queries
  zorder_columns:
    - user_id
    - created_at
    - corridor
