# =============================================================================
# RemitFlow Kafka Broker — Tuned for 1M+ msg/s (3-broker cluster minimum)
# =============================================================================

# ── Network Threads ──────────────────────────────────────────────────────────
# Network threads handle socket I/O. I/O threads handle disk read/write.
# For 1M+ TPS: network_threads >= 8, io_threads >= 16 on 64-core box.
num.network.threads=8
num.io.threads=16
num.replica.fetchers=4

# ── Socket Buffers ───────────────────────────────────────────────────────────
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600

# ── Log (topic data) Settings ────────────────────────────────────────────────
# Log segments: smaller = faster cleanup, larger = fewer file handles.
log.segment.bytes=1073741824
log.retention.hours=168
log.retention.check.interval.ms=300000
log.cleaner.enable=true
log.cleaner.threads=4
log.cleaner.dedupe.buffer.size=536870912

# ── Batching / Lingering ─────────────────────────────────────────────────────
# linger.ms: broker waits this long to batch incoming produce requests.
# Increases latency by up to linger.ms but dramatically improves throughput.
# queue.buffering.max.messages: max messages to buffer before sending.

# ── Replication (production: min 3 brokers) ──────────────────────────────────
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false

# ── Partitioning ─────────────────────────────────────────────────────────────
num.partitions=12
auto.create.topics.enable=false

# ── Compression ──────────────────────────────────────────────────────────────
compression.type=lz4
log.message.timestamp.type=LogAppendTime

# ── Request Handling ─────────────────────────────────────────────────────────
queued.max.requests=500
request.timeout.ms=30000
replica.lag.time.max.ms=30000
replica.fetch.max.bytes=10485760

# ── Zero-Copy ────────────────────────────────────────────────────────────────
# sendfile() syscall for consumer fetches — bypass user-space copy.
# This is enabled by default but critical for high throughput.

# ── Log Flush (let OS handle it for throughput; replication handles durability)
log.flush.interval.messages=100000
log.flush.interval.ms=1000

# ── Group Coordinator ────────────────────────────────────────────────────────
group.initial.rebalance.delay.ms=3000
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

# ── JVM Settings (set in kafka-server-start.sh or KAFKA_HEAP_OPTS) ───────────
# KAFKA_HEAP_OPTS="-Xms6g -Xmx6g"
# KAFKA_JVM_PERFORMANCE_OPTS="-XX:+UseG1GC -XX:MaxGCPauseMillis=20 
#   -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent 
#   -XX:G1HeapRegionSize=16M -XX:MetaspaceSize=96m -XX:MinMetaFreeRatio=50 
#   -XX:MaxMetaFreeRatio=80"
