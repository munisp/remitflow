###############################################################################
# RemitFlow — Prometheus Alerting Rules
# Covers: SLO burn rates, middleware health, security events, performance
###############################################################################

groups:
  # ═══ SLO BURN RATE ALERTS ════════════════════════════════════════════════════
  - name: remitflow.slo
    interval: 1m
    rules:
      # Fast burn: consuming error budget 5x faster than allowed
      - alert: TransferAvailabilityFastBurn
        expr: |
          (
            sum(rate(remitflow_transfers_total{status!~"2.."}[1h])) /
            sum(rate(remitflow_transfers_total[1h]))
          ) > (1 - 0.9995) * 5
        for: 2m
        labels:
          severity: critical
          slo: transfer_availability
          team: platform
        annotations:
          summary: "Transfer API availability SLO fast burn rate"
          description: "Transfer failure rate {{ $value | humanizePercentage }} exceeds 5x burn rate. Error budget will be exhausted in ~6 hours."
          runbook: "https://runbooks.remitflow.io/slo/transfer-availability"

      # Slow burn: consuming error budget at 1x over 6 hours
      - alert: TransferAvailabilitySlowBurn
        expr: |
          (
            sum(rate(remitflow_transfers_total{status!~"2.."}[6h])) /
            sum(rate(remitflow_transfers_total[6h]))
          ) > (1 - 0.9995)
        for: 15m
        labels:
          severity: warning
          slo: transfer_availability
          team: platform
        annotations:
          summary: "Transfer API availability SLO slow burn rate"
          description: "Transfer failure rate {{ $value | humanizePercentage }} is consuming the error budget."

      - alert: TransferLatencyP99Breach
        expr: |
          histogram_quantile(0.99,
            sum(rate(remitflow_api_request_duration_ms_bucket{route=~"/api/trpc/transfers.*"}[5m])) by (le)
          ) > 500
        for: 5m
        labels:
          severity: warning
          slo: transfer_latency_p99
          team: platform
        annotations:
          summary: "Transfer API P99 latency SLO breach"
          description: "Transfer API P99 latency is {{ $value }}ms, exceeding the 500ms SLO target."

      - alert: PlatformAvailabilityBreach
        expr: |
          avg_over_time(up{job="remitflow-api"}[5m]) < 0.9999
        for: 1m
        labels:
          severity: critical
          slo: platform_availability
          team: platform
        annotations:
          summary: "Platform availability SLO breach"
          description: "Platform availability dropped to {{ $value | humanizePercentage }}."

  # ═══ MIDDLEWARE HEALTH ALERTS ═════════════════════════════════════════════════
  - name: remitflow.middleware
    interval: 30s
    rules:
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_group_lag > 1000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} topic {{ $labels.topic }} lag is {{ $value }} messages."

      - alert: KafkaConsumerLagCritical
        expr: kafka_consumer_group_lag > 10000
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Kafka consumer lag is critical"
          description: "Consumer group {{ $labels.consumergroup }} lag {{ $value }} may indicate a stuck consumer."

      - alert: TemporalWorkflowFailed
        expr: increase(temporal_workflow_failed_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Temporal workflow failures detected"
          description: "{{ $value }} Temporal workflow failures in the last 5 minutes."

      - alert: TigerBeetleLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(remitflow_middleware_latency_ms_bucket{service="tigerbeetle"}[5m])) by (le)
          ) > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "TigerBeetle P99 latency is high"
          description: "TigerBeetle P99 latency is {{ $value }}ms."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is {{ $value | humanizePercentage }} of max."

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "PostgreSQL has {{ $value }} active connections."

  # ═══ SECURITY ALERTS ═════════════════════════════════════════════════════════
  - name: remitflow.security
    interval: 1m
    rules:
      - alert: RateLimitBreachHigh
        expr: increase(remitflow_rate_limit_exceeded_total[5m]) > 100
        for: 1m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate of rate limit breaches"
          description: "{{ $value }} rate limit violations in 5 minutes — possible DDoS or credential stuffing."

      - alert: AMLFlagRateHigh
        expr: |
          (
            sum(rate(remitflow_transfers_total{status="aml_flagged"}[1h])) /
            sum(rate(remitflow_transfers_total[1h]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "AML flag rate exceeds 5%"
          description: "AML flag rate is {{ $value | humanizePercentage }} — possible coordinated fraud."

      - alert: KYCRejectionRateHigh
        expr: |
          (
            sum(rate(remitflow_kyc_events_total{event="rejected"}[1h])) /
            sum(rate(remitflow_kyc_events_total[1h]))
          ) > 0.3
        for: 10m
        labels:
          severity: warning
          team: compliance
        annotations:
          summary: "KYC rejection rate is unusually high"
          description: "KYC rejection rate is {{ $value | humanizePercentage }}."

  # ═══ INFRASTRUCTURE ALERTS ═══════════════════════════════════════════════════
  - name: remitflow.infrastructure
    interval: 1m
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is {{ $value }}% available on {{ $labels.instance }}."
