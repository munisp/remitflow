# RemitFlow Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "api-server"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: "/metrics"

  - job_name: "fx-aggregator"
    static_configs:
      - targets: ["fx-aggregator:8100"]

  - job_name: "fee-engine"
    static_configs:
      - targets: ["fee-engine:8101"]

  - job_name: "refund-engine"
    static_configs:
      - targets: ["refund-engine:8102"]

  - job_name: "health-aggregator"
    static_configs:
      - targets: ["health-aggregator:8200"]

  - job_name: "synthetic-monitor"
    static_configs:
      - targets: ["synthetic-monitor:8201"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
