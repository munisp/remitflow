# RemitFlow Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "api-server"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: "/metrics"

  - job_name: "fx-aggregator"
    static_configs:
      - targets: ["fx-aggregator:8100"]

  - job_name: "fee-engine"
    static_configs:
      - targets: ["fee-engine:8101"]

  - job_name: "refund-engine"
    static_configs:
      - targets: ["refund-engine:8102"]

  - job_name: "health-aggregator"
    static_configs:
      - targets: ["health-aggregator:8200"]

  - job_name: "synthetic-monitor"
    static_configs:
      - targets: ["synthetic-monitor:8201"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ─── New Polyglot Services ──────────────────────────────────────────────────
  - job_name: "tb-bridge"
    static_configs:
      - targets: ["tb-bridge:8200"]
    metrics_path: "/metrics"

  - job_name: "fluvio-consumer"
    static_configs:
      - targets: ["fluvio-consumer:8300"]
    metrics_path: "/metrics"

  - job_name: "crypto-utils"
    static_configs:
      - targets: ["crypto-utils:8202"]
    metrics_path: "/metrics"

  - job_name: "apisix-manager"
    static_configs:
      - targets: ["apisix-manager:8100"]
    metrics_path: "/metrics"

  - job_name: "rate-limiter"
    static_configs:
      - targets: ["rate-limiter:8101"]
    metrics_path: "/metrics"

  - job_name: "health-probe"
    static_configs:
      - targets: ["health-probe:8099"]
    metrics_path: "/metrics"

  - job_name: "aml-scorer"
    static_configs:
      - targets: ["aml-scorer:8103"]
    metrics_path: "/metrics"

  - job_name: "lakehouse"
    static_configs:
      - targets: ["lakehouse:8102"]
    metrics_path: "/metrics"

  - job_name: "compliance-reporter"
    static_configs:
      - targets: ["compliance-reporter:8104"]
    metrics_path: "/metrics"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
