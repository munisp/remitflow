# Redis Sentinel — High-Availability Configuration
#
# 3-node Redis deployment with Sentinel for automatic failover:
#   - 1 master + 2 replicas for data redundancy
#   - 3 sentinels for quorum-based failover detection
#   - Automatic promotion of replica to master on failure
#
# Usage:
#   docker-compose -f docker-compose.redis-sentinel.yml up -d
#
# Environment:
#   REDIS_SENTINEL_HOSTS=sentinel-0:26379,sentinel-1:26379,sentinel-2:26379
#   REDIS_SENTINEL_MASTER=remitflow-master
#   REDIS_PASSWORD=<your-redis-password>

version: "3.9"

services:
  # ── Redis Master ────────────────────────────────────────────────────────
  redis-master:
    image: redis:7.4-alpine
    container_name: redis-master
    hostname: redis-master
    command: >
      redis-server
        --appendonly yes
        --maxmemory 32gb
        --maxmemory-policy allkeys-lfu
        --io-threads 4
        --io-threads-do-reads yes
        --lazyfree-lazy-eviction yes
        --lazyfree-lazy-expire yes
        --lazyfree-lazy-server-del yes
        --activedefrag yes
        --save ""
        --bind 0.0.0.0
        --protected-mode no
        --requirepass ${REDIS_PASSWORD:-remitflow-redis-pass}
    ports:
      - "6379:6379"
    networks:
      - redis-sentinel
    volumes:
      - redis-master-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 34G
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-remitflow-redis-pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Redis Replica 1 ────────────────────────────────────────────────────
  redis-replica-1:
    image: redis:7.4-alpine
    container_name: redis-replica-1
    hostname: redis-replica-1
    command: >
      redis-server
        --appendonly yes
        --maxmemory 32gb
        --maxmemory-policy allkeys-lfu
        --io-threads 4
        --slaveof redis-master 6379
        --masterauth ${REDIS_PASSWORD:-remitflow-redis-pass}
        --requirepass ${REDIS_PASSWORD:-remitflow-redis-pass}
        --bind 0.0.0.0
        --protected-mode no
    ports:
      - "6380:6379"
    networks:
      - redis-sentinel
    volumes:
      - redis-replica-1-data:/data
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Redis Replica 2 ────────────────────────────────────────────────────
  redis-replica-2:
    image: redis:7.4-alpine
    container_name: redis-replica-2
    hostname: redis-replica-2
    command: >
      redis-server
        --appendonly yes
        --maxmemory 32gb
        --maxmemory-policy allkeys-lfu
        --io-threads 4
        --slaveof redis-master 6379
        --masterauth ${REDIS_PASSWORD:-remitflow-redis-pass}
        --requirepass ${REDIS_PASSWORD:-remitflow-redis-pass}
        --bind 0.0.0.0
        --protected-mode no
    ports:
      - "6381:6379"
    networks:
      - redis-sentinel
    volumes:
      - redis-replica-2-data:/data
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Sentinel 0 ──────────────────────────────────────────────────────────
  sentinel-0:
    image: redis:7.4-alpine
    container_name: sentinel-0
    hostname: sentinel-0
    entrypoint: /bin/sh
    command: |
      -c '
        cat > /etc/redis/sentinel.conf << EOF
        port 26379
        sentinel monitor remitflow-master redis-master 6379 2
        sentinel auth-pass remitflow-master ${REDIS_PASSWORD:-remitflow-redis-pass}
        sentinel down-after-milliseconds remitflow-master 5000
        sentinel failover-timeout remitflow-master 10000
        sentinel parallel-syncs remitflow-master 1
        EOF
        redis-sentinel /etc/redis/sentinel.conf
      '
    ports:
      - "26379:26379"
    networks:
      - redis-sentinel
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Sentinel 1 ──────────────────────────────────────────────────────────
  sentinel-1:
    image: redis:7.4-alpine
    container_name: sentinel-1
    hostname: sentinel-1
    entrypoint: /bin/sh
    command: |
      -c '
        cat > /etc/redis/sentinel.conf << EOF
        port 26379
        sentinel monitor remitflow-master redis-master 6379 2
        sentinel auth-pass remitflow-master ${REDIS_PASSWORD:-remitflow-redis-pass}
        sentinel down-after-milliseconds remitflow-master 5000
        sentinel failover-timeout remitflow-master 10000
        sentinel parallel-syncs remitflow-master 1
        EOF
        redis-sentinel /etc/redis/sentinel.conf
      '
    ports:
      - "26380:26379"
    networks:
      - redis-sentinel
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy

  # ── Sentinel 2 ──────────────────────────────────────────────────────────
  sentinel-2:
    image: redis:7.4-alpine
    container_name: sentinel-2
    hostname: sentinel-2
    entrypoint: /bin/sh
    command: |
      -c '
        cat > /etc/redis/sentinel.conf << EOF
        port 26379
        sentinel monitor remitflow-master redis-master 6379 2
        sentinel auth-pass remitflow-master ${REDIS_PASSWORD:-remitflow-redis-pass}
        sentinel down-after-milliseconds remitflow-master 5000
        sentinel failover-timeout remitflow-master 10000
        sentinel parallel-syncs remitflow-master 1
        EOF
        redis-sentinel /etc/redis/sentinel.conf
      '
    ports:
      - "26381:26379"
    networks:
      - redis-sentinel
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:

networks:
  redis-sentinel:
    driver: bridge
