# TigerBeetle 3-Replica VSR Cluster
#
# Production configuration with Viewstamped Replication for:
#   - Fault tolerance (survives 1 node failure)
#   - Automatic leader election
#   - Consistent replicated state
#
# Usage:
#   docker-compose -f docker-compose.tigerbeetle-cluster.yml up -d
#
# Environment:
#   TIGERBEETLE_ADDRESSES=tigerbeetle-0:3001,tigerbeetle-1:3001,tigerbeetle-2:3001

version: "3.9"

services:
  # ── Replica 0 (initial leader) ──────────────────────────────────────────
  tigerbeetle-0:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.6
    container_name: tigerbeetle-0
    hostname: tigerbeetle-0
    command: |
      start
        --addresses=0.0.0.0:3001,tigerbeetle-1:3001,tigerbeetle-2:3001
        --cache-grid-bytes=4294967296
        /data/0_0.tigerbeetle
    volumes:
      - tb-data-0:/data
    ports:
      - "3001:3001"
    networks:
      - tigerbeetle-cluster
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 4G
    healthcheck:
      test: ["CMD", "tigerbeetle", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Replica 1 ───────────────────────────────────────────────────────────
  tigerbeetle-1:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.6
    container_name: tigerbeetle-1
    hostname: tigerbeetle-1
    command: |
      start
        --addresses=tigerbeetle-0:3001,0.0.0.0:3001,tigerbeetle-2:3001
        --cache-grid-bytes=4294967296
        /data/0_1.tigerbeetle
    volumes:
      - tb-data-1:/data
    ports:
      - "3002:3001"
    networks:
      - tigerbeetle-cluster
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 4G
    healthcheck:
      test: ["CMD", "tigerbeetle", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      tigerbeetle-0:
        condition: service_started

  # ── Replica 2 ───────────────────────────────────────────────────────────
  tigerbeetle-2:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.6
    container_name: tigerbeetle-2
    hostname: tigerbeetle-2
    command: |
      start
        --addresses=tigerbeetle-0:3001,tigerbeetle-1:3001,0.0.0.0:3001
        --cache-grid-bytes=4294967296
        /data/0_2.tigerbeetle
    volumes:
      - tb-data-2:/data
    ports:
      - "3003:3001"
    networks:
      - tigerbeetle-cluster
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 4G
    healthcheck:
      test: ["CMD", "tigerbeetle", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      tigerbeetle-0:
        condition: service_started

  # ── Init Job — Format data files on first run ───────────────────────────
  tigerbeetle-init:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.6
    container_name: tigerbeetle-init
    entrypoint: /bin/sh
    command: |
      -c '
        echo "Formatting TigerBeetle data files for 3-replica cluster..."
        for i in 0 1 2; do
          FILE="/data/0_$${i}.tigerbeetle"
          if [ ! -f "$$FILE" ]; then
            tigerbeetle format --cluster=0 --replica=$${i} --replica-count=3 "$$FILE"
            echo "Formatted replica $${i}"
          else
            echo "Replica $${i} data file already exists, skipping format"
          fi
        done
        echo "Init complete"
      '
    volumes:
      - tb-data-0:/data/0
      - tb-data-1:/data/1
      - tb-data-2:/data/2
    networks:
      - tigerbeetle-cluster

volumes:
  tb-data-0:
    driver: local
  tb-data-1:
    driver: local
  tb-data-2:
    driver: local

networks:
  tigerbeetle-cluster:
    driver: bridge
