###############################################################################
# Fluvio Topics — CBN Compliance Real-Time Streaming (v187)
#
# Fluvio provides low-latency, high-throughput streaming for:
# - Real-time BMATCH rate broadcasting to frontend clients
# - Live settlement account status updates
# - Instant wallet funding block notifications
# - CBN audit event streaming to lakehouse
###############################################################################

topics:
  - name: bmatch-rates-live
    partitions: 3
    replication: 1
    retention:
      time: 1h
    description: "Real-time BMATCH FX rate updates — 60s refresh cycle"
    consumers:
      - remitflow-app
      - python-cbn-lakehouse
      - rust-bmatch-engine

  - name: settlement-account-updates
    partitions: 1
    replication: 1
    retention:
      time: 24h
    description: "Settlement account CRUD events and CBN filing status changes"
    consumers:
      - remitflow-app
      - python-cbn-lakehouse

  - name: wallet-funding-events
    partitions: 3
    replication: 1
    retention:
      time: 7d
    description: "Wallet funding events with NFEM compliance flags"
    consumers:
      - python-cbn-lakehouse
      - aml-engine

  - name: cbn-audit-trail
    partitions: 3
    replication: 1
    retention:
      time: 90d
    description: "Immutable CBN audit trail — all compliance events"
    consumers:
      - python-cbn-lakehouse

  - name: bdc-liquidity-stream
    partitions: 1
    replication: 1
    retention:
      time: 30d
    description: "BDC partner liquidity requests and approvals"
    consumers:
      - go-settlement-registry
      - python-cbn-lakehouse
