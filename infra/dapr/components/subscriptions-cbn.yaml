###############################################################################
# Dapr Subscriptions — CBN Compliance Topics (v187)
#
# These subscriptions wire Kafka events from the CBN compliance services
# to their respective consumers via Dapr pubsub.
###############################################################################
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: cbn-settlement-account-events
  namespace: default
spec:
  pubsubname: remitflow-pubsub
  topic: settlement-account-created
  routes:
    default: /api/dapr/settlement-account-created
  scopes:
    - go-settlement-registry
    - python-cbn-lakehouse
---
