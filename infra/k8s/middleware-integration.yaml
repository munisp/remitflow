# ── Shared Secrets Template (values to be provided via Vault/Sealed Secrets) ──
apiVersion: v1
kind: Secret
metadata:
  name: middleware-secrets
  namespace: remitflow
  annotations:
    # Replace with Sealed Secrets or External Secrets Operator in production
    kubernetes.io/description: "Middleware integration secrets — inject via Vault or ESO"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_VAULT_SECRET"
  OPENSEARCH_USER: "REPLACE_WITH_VAULT_SECRET"
  OPENSEARCH_PASSWORD: "REPLACE_WITH_VAULT_SECRET"
  KEYCLOAK_ADMIN_USER: "REPLACE_WITH_VAULT_SECRET"
  KEYCLOAK_ADMIN_PASSWORD: "REPLACE_WITH_VAULT_SECRET"
  TWILIO_ACCOUNT_SID: "REPLACE_WITH_VAULT_SECRET"
  TWILIO_AUTH_TOKEN: "REPLACE_WITH_VAULT_SECRET"
  SENDGRID_API_KEY: "REPLACE_WITH_VAULT_SECRET"
  WHATSAPP_API_KEY: "REPLACE_WITH_VAULT_SECRET"
  FCM_SERVER_KEY: "REPLACE_WITH_VAULT_SECRET"

