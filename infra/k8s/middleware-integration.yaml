##############################################################################
# middleware-integration.yaml
# Kubernetes manifests for all 8 new RemitFlow middleware integration services
##############################################################################

---
# ── Namespace ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app.kubernetes.io/part-of: remitflow

---
# ── Shared ConfigMap ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: middleware-config
  namespace: remitflow
data:
  KAFKA_BROKERS: "kafka:9092"
  TEMPORAL_HOST: "temporal:7233"
  TEMPORAL_NAMESPACE: "remitflow"
  REDIS_URL: "redis://redis:6379"
  FLUVIO_ENDPOINT: "fluvio-sc:9003"
  OPENSEARCH_URL: "http://opensearch:9200"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "remitflow"
  PERMIFY_URL: "http://permify:3476"
  MOJALOOP_URL: "http://mojaloop-central-ledger:3001"
  TIGERBEETLE_ADDRESSES: "tigerbeetle:3000"
  MIDDLEWARE_BUS_URL: "http://go-middleware-bus:8200"
  RUST_CONNECTOR_URL: "http://rust-middleware-connector:8210"
  ANALYTICS_MIDDLEWARE_URL: "http://python-analytics-middleware:8220"
  KYC_TRIGGER_ENGINE_URL: "http://go-kyc-trigger-engine:8160"
  LOG_LEVEL: "info"

---
# ── go-middleware-bus ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-middleware-bus
  namespace: remitflow
  labels:
    app: go-middleware-bus
    component: middleware
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-middleware-bus
  template:
    metadata:
      labels:
        app: go-middleware-bus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: go-middleware-bus
          image: remitflow/go-middleware-bus:latest
          ports:
            - containerPort: 8200
          envFrom:
            - configMapRef:
                name: middleware-config
            - secretRef:
                name: middleware-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: go-middleware-bus
  namespace: remitflow
spec:
  selector:
    app: go-middleware-bus
  ports:
    - port: 8200
      targetPort: 8200
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-middleware-bus-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-middleware-bus
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# ── rust-middleware-connector ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-middleware-connector
  namespace: remitflow
  labels:
    app: rust-middleware-connector
    component: middleware
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-middleware-connector
  template:
    metadata:
      labels:
        app: rust-middleware-connector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8210"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: rust-middleware-connector
          image: remitflow/rust-middleware-connector:latest
          ports:
            - containerPort: 8210
          envFrom:
            - configMapRef:
                name: middleware-config
            - secretRef:
                name: middleware-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8210
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8210
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: rust-middleware-connector
  namespace: remitflow
spec:
  selector:
    app: rust-middleware-connector
  ports:
    - port: 8210
      targetPort: 8210

