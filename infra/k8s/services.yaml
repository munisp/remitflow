# ─── Lakehouse Sync (Python) ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse
  namespace: remitflow
  labels:
    app: lakehouse
    language: python
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakehouse
  template:
    metadata:
      labels:
        app: lakehouse
        language: python
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: lakehouse
          image: remitflow/lakehouse:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8102
              name: http
          env:
            - name: LAKEHOUSE_PORT
              value: "8102"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: database-url
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: remitflow-config
                  key: s3-endpoint
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: s3-secret-key
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8102
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lakehouse
  namespace: remitflow
spec:
  selector:
    app: lakehouse
  ports:
    - port: 8102
      targetPort: 8102
      name: http

