    metadata:
      labels:
        app: aml-scorer
        language: python
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8103"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: aml-scorer
          image: remitflow/aml-scorer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8103
              name: http
          env:
            - name: AML_SCORER_PORT
              value: "8103"
