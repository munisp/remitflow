###############################################################################
# RemitFlow — Kubernetes Service Manifests
# ══════════════════════════════════════════
# Deployments and Services for all polyglot microservices.
# Apply with: kubectl apply -f infra/k8s/services.yaml -n remitflow
###############################################################################

apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app.kubernetes.io/managed-by: kubectl
    environment: production

---
# ─── TigerBeetle Bridge (Rust) ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-bridge
  namespace: remitflow
  labels:
    app: tb-bridge
    language: rust
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tb-bridge
  template:
    metadata:
      labels:
        app: tb-bridge
        language: rust
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: tb-bridge
          image: remitflow/tb-bridge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: TB_BRIDGE_PORT
              value: "8200"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: database-url
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tb-bridge
  namespace: remitflow
spec:
  selector:
    app: tb-bridge
  ports:
    - port: 8200
      targetPort: 8200
      name: http

---
# ─── Fluvio Consumer (Rust) ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-consumer
  namespace: remitflow
  labels:
    app: fluvio-consumer
    language: rust
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluvio-consumer
  template:
    metadata:
      labels:
        app: fluvio-consumer
        language: rust
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8300"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: fluvio-consumer
          image: remitflow/fluvio-consumer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8300
              name: http
          env:
            - name: FLUVIO_HTTP_BRIDGE_PORT
              value: "8300"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: remitflow-secrets
                  key: redis-url
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-consumer
  namespace: remitflow
spec:
  selector:
    app: fluvio-consumer
  ports:
