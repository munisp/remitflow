---
# ─── Secrets Template ─────────────────────────────────────────────────────────
# DO NOT APPLY WITH THESE VALUES. Every value below is a placeholder; the
# canonical source of truth is a secrets manager synced via the External
# Secrets Operator (or Sealed Secrets). Sketch:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: remitflow-secrets
#     namespace: remitflow
#   spec:
#     refreshInterval: 1h
#     secretStoreRef: { name: <your-cluster-secret-store>, kind: ClusterSecretStore }
#     target: { name: remitflow-secrets }
#     data:
#       - { secretKey: database-url,            remoteRef: { key: remitflow/postgres,  property: url } }
#       - { secretKey: redis-url,               remoteRef: { key: remitflow/redis,     property: url } }
#       - { secretKey: crypto-master-key,       remoteRef: { key: remitflow/crypto,    property: master_key } }
#       - { secretKey: crypto-hmac-key,         remoteRef: { key: remitflow/crypto,    property: hmac_key } }
#       - { secretKey: apisix-admin-key,        remoteRef: { key: remitflow/apisix,    property: admin_key } }
#       - { secretKey: s3-access-key,           remoteRef: { key: remitflow/minio,     property: root_user } }
#       - { secretKey: s3-secret-key,           remoteRef: { key: remitflow/minio,     property: root_password } }
#       - { secretKey: jwt-secret,              remoteRef: { key: remitflow/api,       property: jwt_secret } }
#       - { secretKey: session-secret,          remoteRef: { key: remitflow/api,       property: session_secret } }
#       - { secretKey: keycloak-client-secret,  remoteRef: { key: remitflow/keycloak,  property: client_secret } }
#       - { secretKey: keycloak-admin-password, remoteRef: { key: remitflow/keycloak,  property: admin_password } }
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-secrets
  namespace: remitflow
  annotations:
    # Marker for reviewers/tooling: values are placeholders, not credentials.
    remitflow.io/secret-source: "external-secrets-operator-required"
type: Opaque
stringData:
  # REPLACE_VIA_EXTERNAL_SECRET — postgres password property
  database-url: "postgres://remitflow:REPLACE_VIA_EXTERNAL_SECRET@postgres:5432/remitflow"
  # ACL user remitflow_app — the password segment is REDIS_APP_PASSWORD,
  # supplied by the secrets manager (see redis/users.acl).
  redis-url: "redis://remitflow_app:REPLACE_VIA_EXTERNAL_SECRET@redis:6379"
  # REPLACE_VIA_EXTERNAL_SECRET — 64 hex chars
  crypto-master-key: "REPLACE_VIA_EXTERNAL_SECRET_64_HEX"
  # REPLACE_VIA_EXTERNAL_SECRET — 64 hex chars
  crypto-hmac-key: "REPLACE_VIA_EXTERNAL_SECRET_64_HEX"
  # REPLACE_VIA_EXTERNAL_SECRET — must match the key rendered into APISIX config
  apisix-admin-key: "REPLACE_VIA_EXTERNAL_SECRET"
  # REPLACE_VIA_EXTERNAL_SECRET — MinIO root credentials
  s3-access-key: "REPLACE_VIA_EXTERNAL_SECRET"
  s3-secret-key: "REPLACE_VIA_EXTERNAL_SECRET"
  # REPLACE_VIA_EXTERNAL_SECRET — min 32 chars each
  jwt-secret: "REPLACE_VIA_EXTERNAL_SECRET_MIN_32_CHARS"
  session-secret: "REPLACE_VIA_EXTERNAL_SECRET_MIN_32_CHARS"
  keycloak-client-secret: "REPLACE_VIA_EXTERNAL_SECRET"
  keycloak-admin-password: "REPLACE_VIA_EXTERNAL_SECRET"

---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-config
  namespace: remitflow
data:
  s3-endpoint: "http://minio:9000"
  lakehouse-bucket: "remitflow-lakehouse"
  temporal-address: "temporal:7233"
  temporal-namespace: "remitflow"
  keycloak-url: "http://keycloak:8080"
  keycloak-realm: "remitflow"
  # Canonical Permify tenant (consumed by permify-bootstrap Job + api).
  permify-tenant-id: "remitflow"
  aml-threshold-critical: "81"
  feature-aml-scoring: "true"
  feature-tigerbeetle: "true"
  feature-fluvio: "true"
  feature-lakehouse-sync: "true"

---
# ─── HorizontalPodAutoscaler ──────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aml-scorer-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aml-scorer
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fluvio-consumer-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fluvio-consumer
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
