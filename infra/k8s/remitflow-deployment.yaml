---
# RemitFlow v110 — Kubernetes Deployment Manifests
# Namespace: remitflow
# Services: app, postgres, redis, kafka, temporal, keycloak, opensearch,
#           minio, apisix, go-cips, rust-upi, python-pix, go-kafka,
#           go-temporal, go-permify, rust-redis, rust-fluvio, python-keycloak,
#           python-opensearch, python-lakehouse, rust-pg, rust-tigerbeetle,
#           go-apisix, prometheus, grafana

apiVersion: v1
kind: Namespace
metadata:
  name: remitflow
  labels:
    app.kubernetes.io/name: remitflow
    app.kubernetes.io/version: "v110"

---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: remitflow-config
  namespace: remitflow
data:
  NODE_ENV: "production"
  KAFKA_BROKERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
  TEMPORAL_ADDRESS: "temporal:7233"
  KEYCLOAK_URL: "http://keycloak:8080"
  OPENSEARCH_URL: "http://opensearch:9200"
  CIPS_API_URL: "http://go-cips-adapter:8091"
  UPI_API_URL: "http://rust-upi-adapter:8092"
  PIX_API_URL: "http://python-pix-adapter:8093"
  LAKEHOUSE_URL: "http://python-lakehouse-service:8101"
  PERMIFY_URL: "http://go-permify-service:8096"
  APISIX_ADMIN_URL: "http://apisix:9180"
  APISIX_ADMIN_KEY: "edd1c9f034335f136f87ad84b625c8f1"
  CIPS_SANDBOX_MODE: "true"
  UPI_SANDBOX_MODE: "true"
  PIX_SANDBOX_MODE: "true"

---
# ─── Secret ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: remitflow-secrets
  namespace: remitflow
type: Opaque
stringData:
  DATABASE_URL: "postgresql://remitflow:remitflow@postgres:5432/remitflow"
  JWT_SECRET: "remitflow-jwt-secret-production-001"
  STRIPE_SECRET_KEY: "sk_test_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
  MINIO_ROOT_USER: "remitflow"
  MINIO_ROOT_PASSWORD: "remitflow123"

---
# ─── RemitFlow App Deployment ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remitflow-app
  namespace: remitflow
  labels:
    app: remitflow-app
    version: v110
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remitflow-app
  template:
    metadata:
      labels:
        app: remitflow-app
        version: v110
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "remitflow-app"
        dapr.io/app-port: "3000"
        dapr.io/config: "remitflow-dapr-config"
    spec:
      containers:
        - name: remitflow-app
          image: remitflow:v110
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: remitflow-config
            - secretRef:
                name: remitflow-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: remitflow-app
  namespace: remitflow
spec:
  selector:
    app: remitflow-app
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
# ─── Go CIPS Adapter ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-cips-adapter
  namespace: remitflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-cips-adapter
  template:
    metadata:
      labels:
        app: go-cips-adapter
    spec:
      containers:
        - name: go-cips-adapter
          image: remitflow-go-cips:v110
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
          env:
            - name: PORT
              value: "8091"
            - name: CIPS_SANDBOX_MODE
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: go-cips-adapter
  namespace: remitflow
spec:
  selector:
    app: go-cips-adapter
  ports:
    - port: 8091
      targetPort: 8091

---
# ─── Rust UPI Adapter ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-upi-adapter
  namespace: remitflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-upi-adapter
  template:
    metadata:
      labels:
        app: rust-upi-adapter
    spec:
      containers:
        - name: rust-upi-adapter
          image: remitflow-rust-upi:v110
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8092
          env:
            - name: PORT
              value: "8092"
            - name: UPI_SANDBOX_MODE
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8092
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: rust-upi-adapter
  namespace: remitflow
spec:
  selector:
    app: rust-upi-adapter
  ports:
    - port: 8092
      targetPort: 8092

---
# ─── Python PIX Adapter ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-pix-adapter
  namespace: remitflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-pix-adapter
  template:
    metadata:
      labels:
        app: python-pix-adapter
    spec:
      containers:
        - name: python-pix-adapter
          image: remitflow-python-pix:v110
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8093
          env:
            - name: PORT
              value: "8093"
            - name: PIX_SANDBOX_MODE
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8093
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: python-pix-adapter
  namespace: remitflow
spec:
  selector:
    app: python-pix-adapter
  ports:
    - port: 8093
      targetPort: 8093

---
# ─── Ingress (APISIX / NGINX) ─────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remitflow-ingress
  namespace: remitflow
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  rules:
    - host: remitflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remitflow-app
                port:
                  number: 3000
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: apisix
                port:
                  number: 9080

---
# ─── HorizontalPodAutoscaler ──────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remitflow-app-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remitflow-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ─── PodDisruptionBudget ──────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: remitflow-app-pdb
  namespace: remitflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: remitflow-app

---
# ─── NetworkPolicy ────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remitflow-network-policy
  namespace: remitflow
spec:
  podSelector:
    matchLabels:
      app: remitflow-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remitflow
      ports:
        - port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: remitflow
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
        - port: 80
