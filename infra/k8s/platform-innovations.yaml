# RemitFlow — Platform Innovation Services Kubernetes Manifests
# Covers: go-realtime-hub, rust-payment-retry, python-realtime-compliance,
#         go-slo-tracker, go-chaos-engine, go-fx-hedging, go-defi-yield

---
# ── go-realtime-hub ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-realtime-hub
  namespace: remitflow
  labels: { app: go-realtime-hub, tier: realtime, version: v1 }
spec:
  replicas: 3
  selector:
    matchLabels: { app: go-realtime-hub }
  template:
    metadata:
      labels: { app: go-realtime-hub }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8141"
        prometheus.io/path:   "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: go-realtime-hub
        image: remitflow/go-realtime-hub:latest
        ports: [{ containerPort: 8141 }]
        env:
        - { name: PORT, value: "8141" }
        resources:
          requests: { cpu: "100m", memory: "64Mi" }
          limits:   { cpu: "500m", memory: "256Mi" }
        livenessProbe:
          httpGet: { path: /livez, port: 8141 }
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /readyz, port: 8141 }
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: go-realtime-hub
  namespace: remitflow
spec:
  selector: { app: go-realtime-hub }
  ports:
  - { port: 8141, targetPort: 8141, name: http }

