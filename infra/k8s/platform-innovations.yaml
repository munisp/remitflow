---
# ── HorizontalPodAutoscaler for high-traffic services ─────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-realtime-hub-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-realtime-hub
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 60 }
  - type: Resource
    resource:
      name: memory
      target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-realtime-compliance-hpa
  namespace: remitflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-realtime-compliance
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 70 }

---
# ── PodDisruptionBudgets ────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-realtime-hub-pdb
  namespace: remitflow
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: go-realtime-hub }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rust-payment-retry-pdb
  namespace: remitflow
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: rust-payment-retry }
