# APISIX Stablecoin Routes — RemitFlow
# Configures rate limiting and circuit breakers for all stablecoin endpoints.
# Only plugins shipped with apache/apisix:3.9 are used (limit-count, limit-req,
# api-breaker, hmac-auth). WAF inspection is performed by the open-appsec agent
# at the container/ingress layer — it is NOT an APISIX plugin and is configured
# separately (see docker-compose.security.yml).
# Applied idempotently by services/gateway-config/apply-stablecoin-routes.py
# (invoked from setup-routes.sh).

routes:
  # ─── ON-RAMP ───────────────────────────────────────────────────────────────
  - id: stablecoin-onramp
    uri: /api/trpc/stablecoinEnhanced.buyWithFiat
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 10
        time_window: 60
        key: consumer_name
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 3
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── OFF-RAMP ──────────────────────────────────────────────────────────────
  - id: stablecoin-offramp
    uri: /api/trpc/stablecoinEnhanced.sellToFiat
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 10
        time_window: 60
        key: consumer_name
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 3
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── SWAP ──────────────────────────────────────────────────────────────────
  - id: stablecoin-swap
    uri: /api/trpc/stablecoinEnhanced.swap
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 20
        time_window: 60
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 30
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── SEND ──────────────────────────────────────────────────────────────────
  - id: stablecoin-send
    uri: /api/trpc/stablecoinEnhanced.send
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 5
        time_window: 60
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── YIELD / STAKING ───────────────────────────────────────────────────────
  - id: stablecoin-yield
    uri: /api/trpc/stablecoinEnhanced.stakeForYield
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 5
        time_window: 300
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 120
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── BRIDGE ────────────────────────────────────────────────────────────────
  - id: stablecoin-bridge
    uri: /api/trpc/stablecoinEnhanced.bridgeChain
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 3
        time_window: 300
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 180
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200]
          successes: 3

  # ─── WEBHOOK RECEIVER ──────────────────────────────────────────────────────
  # wave12 (SPEC-wave12 §3.5): provider webhooks are served by
  # go-stablecoin-settlement (`POST /webhook/{provider}`, HMAC-verified,
  # port 8215) — the remitflow-backend TS receiver routes never existed and
  # 404'd. Rewritten + repointed accordingly.
  - id: stablecoin-webhook-circle
    uri: /api/webhooks/stablecoin/circle
    methods: [POST]
    upstream_id: go-stablecoin-settlement
    plugins:
      proxy-rewrite:
        uri: /webhook/circle
      limit-req:
        rate: 100
        burst: 200
        key: remote_addr
        rejected_code: 429
      hmac-auth:
        signed_headers: [x-circle-signature, date]

  - id: stablecoin-webhook-yellowcard
    uri: /api/webhooks/stablecoin/yellowcard
    methods: [POST]
    upstream_id: go-stablecoin-settlement
    plugins:
      proxy-rewrite:
        uri: /webhook/yellowcard
      limit-req:
        rate: 100
        burst: 200
        key: remote_addr
        rejected_code: 429

upstreams:
  - id: remitflow-backend
    type: roundrobin
    nodes:
      - host: remitflow-server
        port: 3000
        weight: 1
    health_check:
      active:
        http_path: /api/health
        interval: 5
        timeout: 3
        healthy:
          http_statuses: [200]
  # wave12: go-stablecoin-settlement (SPEC-wave12 §3.5 — provider webhook receiver)
  - id: go-stablecoin-settlement
    type: roundrobin
    nodes:
      - host: go-stablecoin-settlement
        port: 8215
        weight: 1
    health_check:
      active:
        http_path: /health
        interval: 5
        timeout: 3
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
