# APISIX Stablecoin Routes — RemitFlow
# Configures rate limiting and circuit breakers for all stablecoin endpoints.
# Only plugins shipped with apache/apisix:3.9 are used (limit-count, limit-req,
# api-breaker, hmac-auth). WAF inspection is performed by the open-appsec agent
# at the container/ingress layer — it is NOT an APISIX plugin and is configured
# separately (see docker-compose.security.yml).
# Applied idempotently by services/gateway-config/apply-stablecoin-routes.py
# (invoked from setup-routes.sh).
#
# wave14 (SPEC-wave14 §7) performance tuning:
#   - Every upstream below carries keepalive_pool (reuses upstream connections,
#     removing TCP handshake latency per request) and an explicit
#     connect/send/read timeout budget.
#   - Retry policy: APISIX has NO route-level `retries` field — retries are an
#     upstream attribute. All routes in THIS file are POST mutations, so both
#     upstreams here set retries: 0 (a mutation must never be replayed by the
#     gateway). The idempotent GET query routes in
#     deploy/apisix/routes-wave10.yaml use the separate `remitflow-backend-read`
#     upstream (same nodes, retries: 1) defined in that file.
#   - limit-count policy: left at the default `local` (per-worker counter).
#     `policy: redis` was evaluated and NOT applied — repo evidence shows it is
#     not currently satisfiable: the `redis` service (docker-compose.yml:34,
#     redis:6379, ACL user remitflow_app) is on the compose default network,
#     while the apisix container (docker-compose.yml:1075) is attached only to
#     remitflow-internal/remitflow-external, and REDIS_APP_PASSWORD is not
#     provisioned to the apisix container or to the route-render path. Until a
#     network link + credential path exist, counters are per nginx worker:
#     effective limits are (count × worker count) — acceptable here because
#     these limits are DoS guardrails, not exact quotas.

routes:
  # ─── ON-RAMP ───────────────────────────────────────────────────────────────
  - id: stablecoin-onramp
    uri: /api/trpc/stablecoinEnhanced.buyWithFiat
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 10
        time_window: 60
        key: consumer_name
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 3
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── OFF-RAMP ──────────────────────────────────────────────────────────────
  - id: stablecoin-offramp
    uri: /api/trpc/stablecoinEnhanced.sellToFiat
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 10
        time_window: 60
        key: consumer_name
        rejected_code: 429
      limit-req:
        rate: 2
        burst: 3
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── SWAP ──────────────────────────────────────────────────────────────────
  - id: stablecoin-swap
    uri: /api/trpc/stablecoinEnhanced.swap
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 20
        time_window: 60
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 30
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── SEND ──────────────────────────────────────────────────────────────────
  - id: stablecoin-send
    uri: /api/trpc/stablecoinEnhanced.send
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 5
        time_window: 60
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── YIELD / STAKING ───────────────────────────────────────────────────────
  - id: stablecoin-yield
    uri: /api/trpc/stablecoinEnhanced.stakeForYield
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 5
        time_window: 300
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 120
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200]
          successes: 2

  # ─── BRIDGE ────────────────────────────────────────────────────────────────
  - id: stablecoin-bridge
    uri: /api/trpc/stablecoinEnhanced.bridgeChain
    methods: [POST]
    upstream_id: remitflow-backend
    plugins:
      limit-count:
        count: 3
        time_window: 300
        key: consumer_name
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 180
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200]
          successes: 3

  # ─── WEBHOOK RECEIVER ──────────────────────────────────────────────────────
  # wave12 (SPEC-wave12 §3.5): provider webhooks are served by
  # go-stablecoin-settlement (`POST /webhook/{provider}`, HMAC-verified,
  # port 8215) — the remitflow-backend TS receiver routes never existed and
  # 404'd. Rewritten + repointed accordingly.
  - id: stablecoin-webhook-circle
    uri: /api/webhooks/stablecoin/circle
    methods: [POST]
    upstream_id: go-stablecoin-settlement
    plugins:
      proxy-rewrite:
        uri: /webhook/circle
      limit-req:
        rate: 100
        burst: 200
        key: remote_addr
        rejected_code: 429
      hmac-auth:
        signed_headers: [x-circle-signature, date]

  - id: stablecoin-webhook-yellowcard
    uri: /api/webhooks/stablecoin/yellowcard
    methods: [POST]
    upstream_id: go-stablecoin-settlement
    plugins:
      proxy-rewrite:
        uri: /webhook/yellowcard
      limit-req:
        rate: 100
        burst: 200
        key: remote_addr
        rejected_code: 429

upstreams:
  - id: remitflow-backend
    type: roundrobin
    nodes:
      - host: remitflow-server
        port: 3000
        weight: 1
    # wave14: upstream connection reuse + timeout budget. idle_timeout/requests
    # are numeric seconds/count per APISIX schema (no unit suffixes).
    keepalive_pool:
      size: 32
      idle_timeout: 60   # seconds
      requests: 1000
    timeout:
      connect: 2         # seconds
      send: 10
      read: 10
    # POST mutations only on this upstream (in this file) — never replayed.
    # Shared with the mutation routes of deploy/apisix/routes-wave10.yaml;
    # GET query routes there use remitflow-backend-read (retries: 1).
    retries: 0
    health_check:
      active:
        http_path: /api/health
        interval: 5
        timeout: 3
        healthy:
          http_statuses: [200]
  # wave12: go-stablecoin-settlement (SPEC-wave12 §3.5 — provider webhook receiver)
  - id: go-stablecoin-settlement
    type: roundrobin
    nodes:
      - host: go-stablecoin-settlement
        port: 8215
        weight: 1
    # wave14: connection reuse + timeout budget (same rationale as above).
    keepalive_pool:
      size: 32
      idle_timeout: 60   # seconds
      requests: 1000
    timeout:
      connect: 2         # seconds
      send: 10
      read: 10
    # Webhook POSTs are mutations; providers re-deliver on failure themselves.
    retries: 0
    health_check:
      active:
        http_path: /health
        interval: 5
        timeout: 3
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
