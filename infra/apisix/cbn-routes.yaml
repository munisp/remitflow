###############################################################################
# APISIX Routes — CBN Compliance Services (v187)
#
# Routes all CBN compliance API traffic through APISIX gateway with:
# - Rate limiting (100 req/min per IP)
# - JWT authentication (Keycloak tokens)
# - OpenAppSec WAF protection
# - Request/response logging to OpenSearch
# - CORS headers for frontend
###############################################################################

routes:
  # ── BMATCH FX Rate Engine ──────────────────────────────────────────────────
  - id: bmatch-rates-public
    uri: /api/v1/rates/*
    methods: [GET]
    upstream:
      type: roundrobin
      nodes:
        rust-bmatch-engine:8097: 1
    plugins:
      limit-req:
        rate: 100
        burst: 50
        key: remote_addr
        rejected_code: 429
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Authorization,Content-Type"
      response-rewrite:
        headers:
          X-CBN-Compliance: "BMATCH-v187"
          X-Rate-Source: "ADB-Passthrough"

  - id: bmatch-snapshot-admin
    uri: /api/v1/rates/snapshot
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        rust-bmatch-engine:8097: 1
    plugins:
      jwt-auth: {}
      limit-req:
        rate: 10
        burst: 5
        key: consumer_name
        rejected_code: 429

  # ── Settlement Account Registry ────────────────────────────────────────────
  - id: settlement-registry-admin
    uri: /api/v1/settlement/*
    methods: [GET, POST, PUT, DELETE]
    upstream:
      type: roundrobin
      nodes:
        go-settlement-registry:8098: 1
    plugins:
      jwt-auth: {}
      limit-req:
        rate: 60
        burst: 20
        key: consumer_name
        rejected_code: 429
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Internal-Key"
      request-id: {}

  # ── CBN Audit Lakehouse ────────────────────────────────────────────────────
  - id: cbn-lakehouse-export
    uri: /api/v1/cbn/export
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        python-cbn-lakehouse:8099: 1
    plugins:
      jwt-auth: {}
      limit-req:
        rate: 10
        burst: 3
        key: consumer_name
        rejected_code: 429
      request-id: {}

  - id: cbn-lakehouse-search
    uri: /api/v1/cbn/search
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        python-cbn-lakehouse:8099: 1
    plugins:
      jwt-auth: {}
      limit-req:
        rate: 30
        burst: 10
        key: consumer_name
        rejected_code: 429

  - id: cbn-lakehouse-stats
    uri: /api/v1/cbn/stats
    methods: [GET]
    upstream:
      type: roundrobin
      nodes:
        python-cbn-lakehouse:8099: 1
    plugins:
      jwt-auth: {}
      proxy-cache:
        cache_strategy: disk
        cache_ttl: 60

  - id: cbn-corridors-public
    uri: /api/v1/cbn/corridors
    methods: [GET]
    upstream:
      type: roundrobin
      nodes:
        python-cbn-lakehouse:8099: 1
    plugins:
      proxy-cache:
        cache_strategy: disk
        cache_ttl: 300
      cors:
        allow_origins: "*"

# ── Consumers (Keycloak JWT) ──────────────────────────────────────────────────
consumers:
  - username: remitflow-admin
    plugins:
      jwt-auth:
        key: remitflow-admin
        algorithm: RS256
        public_key: "${KEYCLOAK_PUBLIC_KEY}"

  - username: remitflow-service
    plugins:
      jwt-auth:
        key: remitflow-service
        algorithm: RS256
        public_key: "${KEYCLOAK_PUBLIC_KEY}"

# ── Global Plugins ────────────────────────────────────────────────────────────
global_rules:
  - id: openappsec-waf
    plugins:
      # OpenAppSec WAF — blocks OWASP Top 10 attacks
      # Configured via openappsec-agent sidecar
      ext-plugin-pre-req:
        conf:
          - name: openappsec
            value: '{"mode":"prevent","log_level":"warning"}'

  - id: observability
    plugins:
      prometheus: {}
      opentelemetry:
        sampler:
          name: always_on
