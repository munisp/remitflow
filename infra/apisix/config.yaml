apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_listen:
    ip: 0.0.0.0
    port: 9180
  admin_api_mtls:
    admin_ssl_ca_cert: ""
    admin_ssl_cert: ""
    admin_ssl_cert_key: ""
  admin_key:
    - name: admin
      key: edd1c9f034335f136f87ad84b625c8f1
      role: admin
    - name: viewer
      key: 4054f7cf07e344346cd3f287985e76a2
      role: viewer
  allow_admin:
    - 0.0.0.0/0
  extra_lua_path: ""
  extra_lua_cpath: ""

nginx_config:
  error_log: /dev/stderr
  error_log_level: warn
  worker_processes: auto
  worker_rlimit_nofile: 20480
  event:
    worker_connections: 10620
  http:
    access_log: /dev/stdout
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    send_timeout: 10s
    underscores_in_headers: "on"
    real_ip_header: X-Real-IP
    real_ip_recursive: "on"
    real_ip_from:
      - 0.0.0.0/0

etcd:
  host:
    - http://etcd:2379
  prefix: /apisix
  timeout: 30
  startup_retry: 2

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: 0.0.0.0
      port: 9091
  opentelemetry:
    resource:
      service.name: remitflow-apisix
    collector:
      address: jaeger:4317
      request_timeout: 3
      request_headers:
        Authorization: token

plugins:
  - real-ip
  - ai
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - ext-plugin-pre-req
  - fault-injection
  - mocking
  - serverless-pre-function
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - uri-blocker
  - request-validation
  - chaitin-waf
  - multi-auth
  - jwt-auth
  - key-auth
  - consumer-restriction
  - forward-auth
  - opa
  - authz-keycloak
  - authz-casdoor
  - wolf-rbac
  - ldap-auth
  - hmac-auth
  - basic-auth
  - openid-connect
  - cas-auth
  - authz-casbin
  - limit-req
  - limit-count
  - limit-conn
  - gzip
  - real-ip
  - proxy-cache
  - body-transformer
  - proxy-mirror
  - proxy-rewrite
  - workflow
