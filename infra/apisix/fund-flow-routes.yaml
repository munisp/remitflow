# RemitFlow — APISix Fund Flow Route Configuration
#
# Circuit breaking, rate limiting, and health checking
# for all financial endpoints that move funds.
#
# These routes ensure that if any downstream service (TigerBeetle, Temporal,
# Kafka, Redis, PostgreSQL) is degraded, fund-moving operations are blocked
# rather than proceeding without atomicity guarantees.

routes:
  # ── Transfer Send (Cross-border) ──────────────────────────────────────────
  - uri: /api/trpc/transfer.send*
    name: transfer-send-atomic
    plugins:
      limit-req:
        rate: 500
        burst: 100
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 30
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200, 201]
          successes: 2
      prometheus:
        prefer_name: true
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      checks:
        active:
          type: http
          http_path: /api/health
          healthy:
            interval: 5
            successes: 2
          unhealthy:
            interval: 2
            http_failures: 3
      timeout:
        connect: 5
        send: 30
        read: 30
      retries: 0  # No retry on fund operations — idempotency must be explicit

  # ── P2P Instant Transfer ──────────────────────────────────────────────────
  - uri: /api/trpc/p2p.*
    name: p2p-instant-atomic
    plugins:
      limit-req:
        rate: 1000
        burst: 200
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 20
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200, 201]
          successes: 2
      prometheus:
        prefer_name: true
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── Agent Cash-Out ────────────────────────────────────────────────────────
  - uri: /api/trpc/pos.cashOut*
    name: agent-cashout-atomic
    plugins:
      limit-req:
        rate: 200
        burst: 50
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200, 201]
          successes: 3
      prometheus:
        prefer_name: true
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── Agent Cash-In ─────────────────────────────────────────────────────────
  - uri: /api/trpc/pos.cashIn*
    name: agent-cashin-atomic
    plugins:
      limit-req:
        rate: 200
        burst: 50
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200, 201]
          successes: 3
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── Cash Pickup Verify & Disburse ─────────────────────────────────────────
  - uri: /api/trpc/cashPickup.verifyAndDisburse*
    name: cash-pickup-disburse-atomic
    plugins:
      limit-req:
        rate: 100
        burst: 20
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200, 201]
          successes: 3
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── Stablecoin Transfer/Bridge ────────────────────────────────────────────
  - uri: /api/trpc/stablecoin.*
    name: stablecoin-atomic
    plugins:
      limit-req:
        rate: 100
        burst: 20
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 120
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200, 201]
          successes: 3
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── BNPL Installments ─────────────────────────────────────────────────────
  - uri: /api/trpc/bnpl.*
    name: bnpl-atomic
    plugins:
      limit-req:
        rate: 300
        burst: 50
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 30
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200, 201]
          successes: 2
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── Savings Deposit/Withdraw ──────────────────────────────────────────────
  - uri: /api/trpc/savings.*
    name: savings-atomic
    plugins:
      limit-req:
        rate: 500
        burst: 100
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 20
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 3
        healthy:
          http_statuses: [200, 201]
          successes: 2
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── Wallet Top-Up (External Payment Gateways) ─────────────────────────────
  - uri: /api/webhooks/*
    name: payment-webhooks-protected
    plugins:
      limit-req:
        rate: 100
        burst: 50
        key: remote_addr
        rejected_code: 429
      ip-restriction:
        # Allow only known payment gateway IPs in production
        # In dev: allow all
        whitelist:
          - "0.0.0.0/0"
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 60
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200, 201]
          successes: 3
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 1  # Single retry for webhooks (idempotent by design)

  # ── Float Replenishment (Admin) ───────────────────────────────────────────
  - uri: /api/trpc/floatReplenishment.*
    name: float-replenishment-atomic
    plugins:
      limit-req:
        rate: 50
        burst: 10
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 120
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200, 201]
          successes: 3
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      retries: 0

  # ── Batch/Payroll ─────────────────────────────────────────────────────────
  - uri: /api/trpc/batch.*
    name: batch-payroll-atomic
    plugins:
      limit-req:
        rate: 20
        burst: 5
        key: remote_addr
        rejected_code: 429
      api-breaker:
        break_response_code: 503
        max_breaker_sec: 180
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 2
        healthy:
          http_statuses: [200, 201]
          successes: 3
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:3000": 1
      timeout:
        connect: 5
        send: 120
        read: 120
      retries: 0

  # ── Go Atomicity Orchestrator ─────────────────────────────────────────────
  - uri: /atomicity/*
    name: go-orchestrator
    plugins:
      limit-req:
        rate: 10000
        burst: 2000
        key: remote_addr
      proxy-rewrite:
        regex_uri: ["^/atomicity/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:8150": 1
      checks:
        active:
          type: http
          http_path: /health
          healthy:
            interval: 5
            successes: 2
          unhealthy:
            interval: 2
            http_failures: 3

  # ── Rust Transaction Guard ────────────────────────────────────────────────
  - uri: /tx-guard/*
    name: rust-transaction-guard
    plugins:
      limit-req:
        rate: 50000
        burst: 10000
        key: remote_addr
      proxy-rewrite:
        regex_uri: ["^/tx-guard/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:8160": 1
      checks:
        active:
          type: http
          http_path: /health
          healthy:
            interval: 5
            successes: 2
          unhealthy:
            interval: 2
            http_failures: 3

  # ── Python Reconciliation Engine ──────────────────────────────────────────
  - uri: /reconciliation/*
    name: python-reconciliation
    plugins:
      limit-req:
        rate: 1000
        burst: 200
        key: remote_addr
      proxy-rewrite:
        regex_uri: ["^/reconciliation/(.*)", "/$1"]
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:8170": 1
      checks:
        active:
          type: http
          http_path: /health
          healthy:
            interval: 10
            successes: 2
          unhealthy:
            interval: 5
            http_failures: 3

# ── Global Plugins ────────────────────────────────────────────────────────────

global_rules:
  - id: fund-flow-observability
    plugins:
      prometheus:
        prefer_name: true
      zipkin:
        endpoint: "http://localhost:9411/api/v2/spans"
        sample_ratio: 0.1
        service_name: "apisix-fund-flow"
