# RemitFlow v76 — Polyglot Microservices Docker Compose
# Covers all 9 new microservices: 3 Go, 3 Rust, 3 Python
# Usage: docker compose -f docker-compose.yml -f docker-compose.microservices.yml up -d

version: "3.9"

services:

  # ─── Go Microservices ────────────────────────────────────────────────────────

  ngx-price-feed:
    build:
      context: ./microservices/go-services/ngx-price-feed
      dockerfile: Dockerfile
    container_name: remitflow-ngx-price-feed
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      GIN_MODE: "release"
      NGX_API_KEY: "${NGX_API_KEY:-}"
      LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "ngx-price-feed"
      com.remitflow.language: "go"
      com.remitflow.version: "1.0.0"

  api-gateway:
    build:
      context: ./microservices/go-services/api-gateway
      dockerfile: Dockerfile
    container_name: remitflow-api-gateway
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      GIN_MODE: "release"
      JWT_SECRET: "${JWT_SECRET:-dev-secret}"
      RATE_LIMIT_RPS: "100"
      LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "api-gateway"
      com.remitflow.language: "go"
      com.remitflow.version: "1.0.0"

  corridor-pricing:
    build:
      context: ./microservices/go-services/corridor-pricing
      dockerfile: Dockerfile
    container_name: remitflow-corridor-pricing
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      GIN_MODE: "release"
      FX_PROVIDER_URL: "${FX_PROVIDER_URL:-}"
      CACHE_TTL_SECONDS: "300"
      LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "corridor-pricing"
      com.remitflow.language: "go"
      com.remitflow.version: "1.0.0"

  # ─── Rust Microservices ──────────────────────────────────────────────────────

  fx-engine:
    build:
      context: ./microservices/rust-services/fx-engine
      dockerfile: Dockerfile
    container_name: remitflow-fx-engine
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      RUST_LOG: "info"
      RATE_LOCK_TTL_SECONDS: "30"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "fx-engine"
      com.remitflow.language: "rust"
      com.remitflow.version: "1.0.0"

  tx-processor:
    build:
      context: ./microservices/rust-services/tx-processor
      dockerfile: Dockerfile
    container_name: remitflow-tx-processor
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      RUST_LOG: "info"
      DATABASE_URL: "${DATABASE_URL:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "tx-processor"
      com.remitflow.language: "rust"
      com.remitflow.version: "1.0.0"

  compliance-engine:
    build:
      context: ./microservices/rust-services/compliance-engine
      dockerfile: Dockerfile
    container_name: remitflow-compliance-engine
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      RUST_LOG: "info"
      OFAC_API_KEY: "${OFAC_API_KEY:-}"
      WATCHLIST_REFRESH_HOURS: "24"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "compliance-engine"
      com.remitflow.language: "rust"
      com.remitflow.version: "1.0.0"

  # ─── Python Microservices ────────────────────────────────────────────────────

  fraud-detection:
    build:
      context: ./microservices/python-services/fraud-detection
      dockerfile: Dockerfile
    container_name: remitflow-fraud-detection
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      MODEL_PATH: "/app/models/fraud_model.pkl"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8087/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "fraud-detection"
      com.remitflow.language: "python"
      com.remitflow.version: "1.0.0"

  aml-compliance:
    build:
      context: ./microservices/python-services/aml-compliance
      dockerfile: Dockerfile
    container_name: remitflow-aml-compliance
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      PORT: "8088"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8088/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "aml-compliance"
      com.remitflow.language: "python"
      com.remitflow.version: "1.0.0"

  analytics-engine:
    build:
      context: ./microservices/python-services/analytics-engine
      dockerfile: Dockerfile
    container_name: remitflow-analytics-engine
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      PORT: "8089"
      LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8089/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - remitflow-internal
    labels:
      com.remitflow.service: "analytics-engine"
      com.remitflow.language: "python"
      com.remitflow.version: "1.0.0"

  go-apisix-config:
    build:
      context: ./services/go-apisix-config
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  go-bricspay-adapter:
    build:
      context: ./services/go-bricspay-adapter
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  go-dapr-service:
    build:
      context: ./services/go-dapr-service
    ports:
      - "8092:8092"
    environment:
      - PORT=8092
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  go-ghipss-adapter:
    build:
      context: ./services/go-ghipss-adapter
    ports:
      - "8093:8093"
    environment:
      - PORT=8093
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  go-papss-service:
    build:
      context: ./services/go-papss-service
    ports:
      - "8094:8094"
    environment:
      - PORT=8094
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  python-africbdc-adapter:
    build:
      context: ./services/python-africbdc-adapter
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  rust-device-fingerprint:
    build:
      context: ./services/rust-device-fingerprint
    ports:
      - "8096:8096"
    environment:
      - PORT=8096
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  rust-mbridge-adapter:
    build:
      context: ./services/rust-mbridge-adapter
    ports:
      - "8097:8097"
    environment:
      - PORT=8097
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  shared-middleware:
    build:
      context: ./services/shared-middleware
    ports:
      - "8098:8098"
    environment:
      - PORT=8098
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  universal-fx:
    build:
      context: ./services/universal-fx
    ports:
      - "8099:8099"
    environment:
      - PORT=8099
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  outbound-swift:
    build:
      context: ./services/outbound-swift
    ports:
      - "8100:8100"
    environment:
      - PORT=8100
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
