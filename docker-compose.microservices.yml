  float-income:
    build:
      context: ./services/float-income
    ports:
      - "8101:8101"
    environment:
      - PORT=8101
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped

  revenue-analytics:
    build:
      context: ./services/revenue-analytics
    ports:
      - "8102:8102"
    environment:
      - PORT=8102
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - remitflow-network
    restart: unless-stopped
networks:
  remitflow-internal:
    external: true
    name: remitflow_remitflow-internal
