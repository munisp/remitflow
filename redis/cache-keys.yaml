# RemitFlow Redis Cache Key Registry
# Format: namespace:entity:identifier[:field]
# TTL values in seconds

cache_keys:
  fx_rates:
    pattern: "fx:rate:{from_currency}:{to_currency}"
    ttl: 60
    description: "Live FX rate cache — refreshed every 60s by go-xof-adapter and outbound-swift"

  user_session:
    pattern: "session:{session_id}"
    ttl: 86400
    description: "User session data — 24h TTL"

  kyc_status:
    pattern: "kyc:status:{user_id}"
    ttl: 3600
    description: "KYC tier status cache — 1h TTL"

  annual_usage:
    pattern: "annual:usage:{user_id}:{year}:{purpose_code}"
    ttl: 3600
    description: "CBN annual limit usage cache — 1h TTL"

  rate_limit:
    pattern: "ratelimit:{ip}:{endpoint}"
    ttl: 60
    description: "Rate limiting counters — 1 minute window"

  correspondent_rates:
    pattern: "correspondent:rate:{bank_id}:{currency_pair}"
    ttl: 300
    description: "Correspondent bank FX rates — 5 minute TTL"

  hnw_profile:
    pattern: "hnw:profile:{user_id}"
    ttl: 1800
    description: "HNW client profile cache — 30 minute TTL"

  sme_batch_status:
    pattern: "sme:batch:{batch_id}:status"
    ttl: 600
    description: "SME batch processing status — 10 minute TTL"

  cross_sell_score:
    pattern: "crosssell:score:{user_id}"
    ttl: 3600
    description: "Cross-sell ML score cache — 1h TTL"

  agent_float:
    pattern: "agent:float:{agent_id}"
    ttl: 300
    description: "Agent float balance cache — 5 minute TTL"

  transfer_idempotency:
    pattern: "idempotency:{idempotency_key}"
    ttl: 86400
    description: "Transfer idempotency keys — 24h TTL to prevent double-sends"
