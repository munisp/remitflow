version: '3.8'
services:
  redis:
    image: redis:7.2-alpine
    container_name: remitflow-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-remitflow-redis-dev-password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-remitflow-redis-dev-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel:
    image: redis:7.2-alpine
    container_name: remitflow-redis-sentinel
    command: redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
    networks:
      - remitflow-net

volumes:
  redis-data:

networks:
  remitflow-net:
    external: true
