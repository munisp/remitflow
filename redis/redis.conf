# ═══════════════════════════════════════════════════════════════════════════════
# RemitFlow Redis Configuration — Hardened for Production
# ═══════════════════════════════════════════════════════════════════════════════
#
# SECURITY HARDENING — CVE-2025-49844 (RediShell) Mitigation
# CVE-2025-49844 (CVSS 10.0): UAF in Redis Lua scripting engine allows RCE.
# Mitigations: patched Redis 7.4.2 image, ACL-based Lua control (see
# users.acl — only the app and rate-limiter users get +EVAL), ACL auth
# enforced, dangerous commands renamed.
#
# NOTE: EVAL/EVALSHA are intentionally NOT globally disabled here — the
# platform requires atomic Lua (distributed locks, sliding-window rate
# limits in redisHardened.ts and go-rate-limiter). Lua access is enforced
# per-user via ACLs instead of a global ban that broke those code paths.
#
# ── Network Binding ──────────────────────────────────────────────────────────
# 0.0.0.0 is REQUIRED inside the Docker container (other services reach this
# Redis over the compose network). Access control is enforced by the ACL file
# (default user is OFF) + protected-mode, not by loopback binding.
bind 0.0.0.0
protected-mode yes
port 6379

# ── Authentication via ACL file ──────────────────────────────────────────────
aclfile /etc/redis/users.acl

# ── CVE-2025-49844: Lua control moved to ACLs (users.acl) ────────────────────
# EVAL/EVALSHA are gated per-user in users.acl (+EVAL only for the
# application and rate-limiter users; denied for all others). SCRIPT is
# renamed away globally — Lua is invoked via EVAL only, no script cache mgmt.
rename-command SCRIPT ""
rename-command DEBUG ""

# ── Disable Dangerous Administrative Commands ────────────────────────────────
rename-command CONFIG ""
rename-command SHUTDOWN "REMITFLOW_SHUTDOWN_9f3kL2mP"
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command MIGRATE ""
rename-command SLAVEOF ""
rename-command REPLICAOF ""
rename-command MONITOR ""

# ── Memory ───────────────────────────────────────────────────────────────────
# Container default: 512mb (compose services have far less than 32gb RAM).
# Raise deliberately for dedicated-cache hosts.
maxmemory 512mb
maxmemory-policy allkeys-lfu
lfu-log-factor 10
lfu-decay-time 1

# ── I/O Threading (Redis 7+) ─────────────────────────────────────────────────
io-threads 4
io-threads-do-reads yes

# ── Persistence ──────────────────────────────────────────────────────────────
save 3600 1
save 300 100
save 60 50000
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
aof-use-rdb-preamble yes
rdbcompression yes
stop-writes-on-bgsave-error no

# ── Lazy Freeing ─────────────────────────────────────────────────────────────
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# ── Connection Limits ────────────────────────────────────────────────────────
tcp-backlog 65535
tcp-keepalive 300
timeout 300
maxclients 10000

# ── Active Defrag ────────────────────────────────────────────────────────────
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# ── Slow Log & Monitoring ────────────────────────────────────────────────────
slowlog-log-slower-than 5000
slowlog-max-len 256
latency-monitor-threshold 50
latency-tracking yes
notify-keyspace-events "Kx"

# ── Logging ──────────────────────────────────────────────────────────────────
# Empty logfile = stdout (required in the container: /var/log/redis does not
# exist there and a file target would abort startup). syslog is unavailable
# in the container as well.
loglevel notice
logfile ""
syslog-enabled no
syslog-ident redis
syslog-facility local0
