# RemitFlow Redis Configuration — Tuned for 1M+ ops/s
# Production: deploy as 6-node cluster (3 masters + 3 replicas).
# See infra/perf/redis-cluster.conf for full cluster config.
bind 0.0.0.0
port 6379
maxmemory 32gb
maxmemory-policy allkeys-lfu

# ── I/O Threading (Redis 7+) — 2x throughput on 8+ core boxes ───────────────
io-threads 4
io-threads-do-reads yes

# ── Persistence — balanced for throughput (PG is source of truth) ────────────
save 3600 1
save 300 100
save 60 50000
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
aof-use-rdb-preamble yes
rdbcompression yes
stop-writes-on-bgsave-error no

# ── Lazy Freeing — offload expensive frees to background threads ─────────────
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# ── Connection Limits ────────────────────────────────────────────────────────
tcp-backlog 65535
tcp-keepalive 300
timeout 0
maxclients 65535

# ── Active Defrag ────────────────────────────────────────────────────────────
activedefrag yes
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# ── Slow Log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 5000
slowlog-max-len 256
latency-monitor-threshold 50
notify-keyspace-events ""
