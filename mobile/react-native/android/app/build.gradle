apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Autolinking
}

def enableProguardInReleaseBuilds = true

android {
    namespace "com.remitflow.mobile"
    compileSdk rootProject.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.remitflow.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Configure for production:
            // storeFile file(REMITFLOW_UPLOAD_STORE_FILE)
            // storePassword REMITFLOW_UPLOAD_STORE_PASSWORD
            // keyAlias REMITFLOW_UPLOAD_KEY_ALIAS
            // keyPassword REMITFLOW_UPLOAD_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.debug // Switch to release for production
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "RemitFlow Dev"
            buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:3001"'
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "RemitFlow Staging"
            buildConfigField "String", "API_BASE_URL", '"https://staging-api.remitflow.com"'
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "RemitFlow"
            buildConfigField "String", "API_BASE_URL", '"https://api.remitflow.com"'
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.multidex:multidex:2.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
