# ═══════════════════════════════════════════════════════════════════════════════
# RemitFlow — Docker Compose Security Override
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.security.yml up
#
# This file applies production security hardening to all services:
#   - no-new-privileges: prevents privilege escalation
#   - read_only: prevents filesystem tampering
#   - cap_drop: removes all Linux capabilities (principle of least privilege)
#   - cap_add: adds back only the minimum required capabilities
#   - security_opt: applies seccomp and AppArmor profiles
#   - Resource limits: prevents DoS via resource exhaustion
#   - Network isolation: internal services cannot reach the internet
#
# CVE Mitigations applied:
#   - CVE-2025-49844 (Redis RCE): Redis 7.4.2, Lua disabled, ACL enforced
#   - CVE-2024-32650 (rustls DoS): reqwest 0.12 + rustls 0.23.5+ in all Rust services
#   - RUSTSEC-2024-0363 (sqlx SQLi): sqlx 0.8.1 in all Rust services
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ── Redis: CVE-2025-49844 Hardened ─────────────────────────────────────────
  redis:
    image: redis:7.4.2-alpine
    security_opt:
      - no-new-privileges:true
      - seccomp:./infra/seccomp/redis-seccomp.json
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/log/redis:noexec,nosuid,size=32m
    mem_limit: 34g
    memswap_limit: 34g
    cpus: "4.0"
    networks:
      - remitflow-internal
    labels:
      - "security.cve-2025-49844=mitigated-lua-disabled"
      - "security.acl=enforced"

  # ── PostgreSQL: Hardened ────────────────────────────────────────────────────
  postgres:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    mem_limit: 16g
    memswap_limit: 16g
    cpus: "8.0"
    networks:
      - remitflow-internal

  # ── API Server (Node.js/TypeScript) ────────────────────────────────────────
  api:
    security_opt:
      - no-new-privileges:true
      - seccomp:./infra/seccomp/node-seccomp.json
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"
    networks:
      - remitflow-internal
      - remitflow-external
    environment:
      - NODE_OPTIONS=--max-old-space-size=3072 --disallow-code-generation-from-strings

  # ── TigerBeetle Bridge (Rust) ───────────────────────────────────────────────
  rust-tigerbeetle-bridge:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"
    networks:
      - remitflow-internal

  # ── Fluvio Consumer (Rust) ──────────────────────────────────────────────────
  rust-fluvio-consumer:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    networks:
      - remitflow-internal

  # ── Event Store (Rust) ──────────────────────────────────────────────────────
  rust-event-store:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "4.0"
    networks:
      - remitflow-internal

  # ── APISIX Manager (Go) ─────────────────────────────────────────────────────
  go-apisix-manager:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    networks:
      - remitflow-internal

  # ── Rate Limiter (Go) ───────────────────────────────────────────────────────
  go-rate-limiter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    networks:
      - remitflow-internal

  # ── Health Probe (Go) ───────────────────────────────────────────────────────
  go-health-probe:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.25"
    networks:
      - remitflow-internal

  # ── Saga Orchestrator (Go) ──────────────────────────────────────────────────
  go-saga-orchestrator:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "2.0"
    networks:
      - remitflow-internal

  # ── AML Scorer (Python) ─────────────────────────────────────────────────────
  python-aml-scorer:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=512m
    mem_limit: 8g
    memswap_limit: 8g
    cpus: "4.0"
    networks:
      - remitflow-internal

  # ── Lakehouse Sync (Python) ─────────────────────────────────────────────────
  python-lakehouse:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=1g
    mem_limit: 16g
    memswap_limit: 16g
    cpus: "4.0"
    networks:
      - remitflow-internal

  # ── ML Feature Pipeline (Python) ────────────────────────────────────────────
  python-ml-feature-pipeline:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=2g
    mem_limit: 16g
    memswap_limit: 16g
    cpus: "8.0"
    networks:
      - remitflow-internal

  # ── Keycloak ────────────────────────────────────────────────────────────────
  keycloak:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"
    networks:
      - remitflow-internal
      - remitflow-external

  # ── Temporal ────────────────────────────────────────────────────────────────
  temporal:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"
    networks:
      - remitflow-internal

networks:
  remitflow-internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 172.20.0.0/16

  remitflow-external:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.21.0.0/16
