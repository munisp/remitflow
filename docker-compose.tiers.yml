# RemitFlow v99 — Tier 1/2/3 Microservices Docker Compose
# Covers all 13 new tier feature microservices:
#   Tier 1 (Go): contractor-engine, expense-engine, kyb-engine, payroll-tax-engine
#   Tier 2 (Rust): savings-engine, bond-engine, lc-engine, invoice-financing-engine, payroll-run-engine
#   Tier 3 (Python): embedded-payroll-api, diaspora-mortgage-engine, credit-scoring-engine, esg-engine
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.tiers.yml up -d
#   docker compose -f docker-compose.tiers.yml up -d tier1-contractor-engine tier1-expense-engine
#
# Port allocation:
#   8210 — contractor-engine (Go)
#   8211 — treasury-engine (Go, existing)
#   8212 — expense-engine (Go)
#   8213 — kyb-engine (Go)
#   8214 — payroll-tax-engine (Go)
#   8220 — credit-scoring-engine (Python)
#   8221 — savings-engine (Rust)
#   8222 — bond-engine (Rust)
#   8223 — lc-engine (Rust)
#   8224 — invoice-financing-engine (Rust)
#   8225 — payroll-run-engine (Rust)
#   8230 — tax-sidecar (Python, existing)
#   8231 — esg-engine (Python)
#   8232 — embedded-payroll-api (Python)
#   8233 — diaspora-mortgage-engine (Python)

version: "3.9"

x-go-defaults: &go-defaults
  restart: unless-stopped
  networks:
    - remitflow_net
  labels:
    com.remitflow.tier: "tier1"
    com.remitflow.language: "go"
    com.remitflow.version: "1.0.0"

x-rust-defaults: &rust-defaults
  restart: unless-stopped
  networks:
    - remitflow_net
  labels:
    com.remitflow.tier: "tier2"
    com.remitflow.language: "rust"
    com.remitflow.version: "1.0.0"

x-python-defaults: &python-defaults
  restart: unless-stopped
  networks:
    - remitflow_net
  labels:
    com.remitflow.tier: "tier3"
    com.remitflow.language: "python"
    com.remitflow.version: "1.0.0"

services:

  # ─── Tier 1: Go Microservices ────────────────────────────────────────────────

  tier1-contractor-engine:
    <<: *go-defaults
    build:
      context: ./services/contractor-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier1_contractor_engine
    ports:
      - "8210:8210"
    environment:
      PORT: "8210"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis:6379"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8210/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.remitflow.service: "contractor-engine"
      com.remitflow.tier: "tier1"
      com.remitflow.language: "go"

  tier1-expense-engine:
    <<: *go-defaults
    build:
      context: ./services/expense-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier1_expense_engine
    ports:
      - "8212:8212"
    environment:
      PORT: "8212"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis:6379"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8212/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.remitflow.service: "expense-engine"
      com.remitflow.tier: "tier1"
      com.remitflow.language: "go"

  tier1-kyb-engine:
    <<: *go-defaults
    build:
      context: ./services/kyb-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier1_kyb_engine
    ports:
      - "8213:8213"
    environment:
      PORT: "8213"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis:6379"
      PERMIFY_URL: "${PERMIFY_URL:-http://permify:3476}"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8213/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.remitflow.service: "kyb-engine"
      com.remitflow.tier: "tier1"
      com.remitflow.language: "go"

  tier1-payroll-tax-engine:
    <<: *go-defaults
    build:
      context: ./services/payroll-tax-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier1_payroll_tax_engine
    ports:
      - "8214:8214"
    environment:
      PORT: "8214"
      GIN_MODE: release
      DATABASE_URL: "${DATABASE_URL}"
      FIRS_API_KEY: "${FIRS_API_KEY:-}"
      HMRC_API_KEY: "${HMRC_API_KEY:-}"
      KRA_API_KEY: "${KRA_API_KEY:-}"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8214/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.remitflow.service: "payroll-tax-engine"
      com.remitflow.tier: "tier1"
      com.remitflow.language: "go"

  # ─── Tier 2: Rust Microservices ──────────────────────────────────────────────

  tier2-savings-engine:
    <<: *rust-defaults
    build:
      context: ./services/savings-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier2_savings_engine
    ports:
      - "8221:8221"
    environment:
      PORT: "8221"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8221/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.remitflow.service: "savings-engine"
      com.remitflow.tier: "tier2"
      com.remitflow.language: "rust"

  tier2-bond-engine:
    <<: *rust-defaults
    build:
      context: ./services/bond-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier2_bond_engine
    ports:
      - "8222:8222"
    environment:
      PORT: "8222"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      TIGERBEETLE_CLUSTER_ID: "${TIGERBEETLE_CLUSTER_ID:-0}"
      TIGERBEETLE_ADDRESSES: "${TIGERBEETLE_ADDRESSES:-tigerbeetle:3000}"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.remitflow.service: "bond-engine"
      com.remitflow.tier: "tier2"
      com.remitflow.language: "rust"

  tier2-lc-engine:
    <<: *rust-defaults
    build:
      context: ./services/lc-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier2_lc_engine
    ports:
      - "8223:8223"
    environment:
      PORT: "8223"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      SWIFT_GPI_API_KEY: "${SWIFT_GPI_API_KEY:-}"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8223/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.remitflow.service: "lc-engine"
      com.remitflow.tier: "tier2"
      com.remitflow.language: "rust"

  tier2-invoice-financing-engine:
    <<: *rust-defaults
    build:
      context: ./services/invoice-financing-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier2_invoice_financing_engine
    ports:
      - "8224:8224"
    environment:
      PORT: "8224"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8224/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.remitflow.service: "invoice-financing-engine"
      com.remitflow.tier: "tier2"
      com.remitflow.language: "rust"

  tier2-payroll-run-engine:
    <<: *rust-defaults
    build:
      context: ./services/payroll-run-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier2_payroll_run_engine
    ports:
      - "8225:8225"
    environment:
      PORT: "8225"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      TEMPORAL_HOST: "${TEMPORAL_HOST:-temporal:7233}"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8225/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      com.remitflow.service: "payroll-run-engine"
      com.remitflow.tier: "tier2"
      com.remitflow.language: "rust"

  # ─── Tier 3: Python Microservices ────────────────────────────────────────────

  tier3-credit-scoring-engine:
    <<: *python-defaults
    build:
      context: ./services/credit-scoring-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier3_credit_scoring_engine
    ports:
      - "8220:8220"
    environment:
      PORT: "8220"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      OPENSEARCH_URL: "${OPENSEARCH_URL:-http://opensearch:9200}"
      MODEL_VERSION: "v3"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8220/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.remitflow.service: "credit-scoring-engine"
      com.remitflow.tier: "tier3"
      com.remitflow.language: "python"

  tier3-esg-engine:
    <<: *python-defaults
    build:
      context: ./services/esg-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier3_esg_engine
    ports:
      - "8231:8231"
    environment:
      PORT: "8231"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      LAKEHOUSE_URL: "${LAKEHOUSE_URL:-http://lakehouse:8080}"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8231/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.remitflow.service: "esg-engine"
      com.remitflow.tier: "tier3"
      com.remitflow.language: "python"

  tier3-embedded-payroll-api:
    <<: *python-defaults
    build:
      context: ./services/embedded-payroll-api
      dockerfile: Dockerfile
    container_name: remitflow_tier3_embedded_payroll_api
    ports:
      - "8232:8232"
    environment:
      PORT: "8232"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      DAPR_HTTP_PORT: "3500"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8232/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.remitflow.service: "embedded-payroll-api"
      com.remitflow.tier: "tier3"
      com.remitflow.language: "python"

  tier3-diaspora-mortgage-engine:
    <<: *python-defaults
    build:
      context: ./services/diaspora-mortgage-engine
      dockerfile: Dockerfile
    container_name: remitflow_tier3_diaspora_mortgage_engine
    ports:
      - "8233:8233"
    environment:
      PORT: "8233"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      CREDIT_SCORING_URL: "http://tier3-credit-scoring-engine:8220"
      LOG_LEVEL: INFO
    depends_on:
      tier3-credit-scoring-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8233/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      com.remitflow.service: "diaspora-mortgage-engine"
      com.remitflow.tier: "tier3"
      com.remitflow.language: "python"

networks:
  remitflow_net:
    external: true
    name: remitflow_remitflow_net
