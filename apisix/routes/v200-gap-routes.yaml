# APISIX Route Definitions — v200 Gap Microservices
# All routes include: JWT authentication, rate limiting, CORS, and request logging
# Base URL pattern: /api/v1/{service-name}/{endpoint}

routes:
  # ─── Go XOF Adapter (West African Corridors) ───────────────────────────────
  - id: xof-adapter-quote
    uri: /api/v1/xof/quote
    methods: [POST]
    upstream:
      nodes:
        go-xof-adapter:8095: 1
      type: roundrobin
    plugins:
      jwt-auth:
        header: Authorization
      limit-req:
        rate: 100
        burst: 50
        key: consumer_name
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Authorization,Content-Type"
      request-id:
        header_name: X-Request-ID
      prometheus: {}

  - id: xof-adapter-submit
    uri: /api/v1/xof/submit
    methods: [POST]
    upstream:
      nodes:
        go-xof-adapter:8095: 1
      type: roundrobin
    plugins:
      jwt-auth:
        header: Authorization
      limit-req:
        rate: 20
        burst: 10
        key: consumer_name
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Authorization,Content-Type"

  - id: xof-adapter-status
    uri: /api/v1/xof/status/*
    methods: [GET]
    upstream:
      nodes:
        go-xof-adapter:8095: 1
      type: roundrobin
    plugins:
      jwt-auth:
        header: Authorization
      limit-req:
        rate: 200
        burst: 100
        key: consumer_name

  # ─── Go Correspondent Manager ───────────────────────────────────────────────
  - id: correspondent-list
    uri: /api/v1/correspondents
    methods: [GET]
    upstream:
      nodes:
        go-correspondent-manager:8096: 1
      type: roundrobin
    plugins:
      jwt-auth:
        header: Authorization
      limit-req:
        rate: 50
        burst: 20
        key: consumer_name
      # Admin-only: require correspondent_bank_admin role
      opa:
        host: http://permify:3476
        policy: remitflow/can_manage_correspondents

  - id: correspondent-create
    uri: /api/v1/correspondents
    methods: [POST]
    upstream:
      nodes:
        go-correspondent-manager:8096: 1
      type: roundrobin
    plugins:
      jwt-auth:
        header: Authorization
      limit-req:
        rate: 10
        burst: 5
        key: consumer_name
      opa:
        host: http://permify:3476
        policy: remitflow/can_manage_correspondents

  - id: clearing-line-create
    uri: /api/v1/clearing-line
    methods: [POST]
    upstream:
      nodes:
        go-correspondent-manager:8096: 1
      type: roundrobin
    plugins:
      jwt-auth:
        header: Authorization
      limit-req:
        rate: 10
        burst: 5
        key: consumer_name

