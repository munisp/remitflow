# ============================================================
# APISIX Dashboard Configuration — RemitFlow
# ============================================================

conf:
  listen:
    host: 0.0.0.0
    port: 9000
  etcd:
    endpoints:
      - etcd:2379
    username: ""
    password: ""
    mtls:
      key_file: ""
      cert_file: ""
      ca_file: ""
  log:
    error_log:
      level: warn
      file_path: logs/error.log
    access_log:
      file_path: logs/access.log
  security:
    # IMPORTANT: Change this in production!
    # Generate with: openssl rand -hex 32
    secret: "${APISIX_DASHBOARD_SECRET:-remitflow-apisix-dashboard-secret-change-in-production}"
    cors:
      allow_origins: "http://localhost:9000"
    csp: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    x_frame_options: "deny"
    content_type_nosniff: "nosniff"
    x_xss_protection: "1; mode=block"
    referrer_policy: "same-origin"
    hsts: "max-age=31536000"
  authentication:
    secret: "${APISIX_DASHBOARD_SECRET:-remitflow-apisix-dashboard-secret-change-in-production}"
    expire_time: 3600
    users:
      - username: admin
        # IMPORTANT: Change this password in production!
        password: "${APISIX_DASHBOARD_PASSWORD:-RemitFlow@Admin2024!}"
