# OpenTelemetry Collector configuration for RemitFlow
# Handles traces, metrics, and logs from all polyglot services (Go, Rust, Python, TypeScript)
# Integrates with: Prometheus (KEDA scaling), OpenSearch (SIEM), Kafka (event stream)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver — scrapes pod lifecycle metrics from polyglot services
  prometheus:
    config:
      scrape_configs:
        - job_name: 'remitflow-pods'
          scrape_interval: 15s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: ['remitflow']
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - source_labels: [__meta_kubernetes_pod_label_app]
              action: replace
              target_label: service
            - source_labels: [__meta_kubernetes_pod_label_language]
              action: replace
              target_label: language

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Filter pod lifecycle events for dedicated pipeline
  filter/lifecycle:
    metrics:
      include:
        match_type: regexp
        metric_names:
          - "pod\\..*"
          - "keda\\..*"
          - "health\\..*"

  # Add K8s metadata to all telemetry
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.deployment.name

  # Resource detection for automatic cloud metadata
  resourcedetection:
    detectors: [env, system]
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # OpenSearch exporter for SIEM (pod lifecycle events, panic recovery, KEDA scaling)
  opensearch:
    http:
      endpoint: http://opensearch-service.remitflow.svc.cluster.local:9200
      tls:
        insecure: true
    logs_index: remitflow-pod-lifecycle
    traces_index: remitflow-traces

  # Kafka exporter for event streaming to downstream analytics
  kafka:
    brokers:
      - kafka-service.remitflow.svc.cluster.local:9092
    topic: remitflow.observability.events
    encoding: otlp_json

  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [opensearch, logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [prometheus]
    metrics/lifecycle:
      receivers: [otlp]
      processors: [memory_limiter, filter/lifecycle, batch]
      exporters: [prometheus, kafka]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [opensearch, logging]
