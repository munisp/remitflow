---
# RemitFlow — Fluvio Topic Definitions
# Fluvio is used for high-throughput real-time streaming (FX rates, price feeds)

topics:
  - name: remitflow.fx.rates
    partitions: 6
    replication: 1
    retention:
      time: 24h
      size: 1GB
    compression: lz4
    description: "Real-time FX rate updates from multiple providers"

  - name: remitflow.transactions.stream
    partitions: 12
    replication: 1
    retention:
      time: 7d
      size: 10GB
    compression: lz4
    description: "High-throughput transaction event stream"

  - name: remitflow.investment.prices
    partitions: 6
    replication: 1
    retention:
      time: 7d
      size: 5GB
    compression: lz4
    description: "Real-time investment asset price feed"

  - name: remitflow.risk.scores
    partitions: 6
    replication: 1
    retention:
      time: 30d
      size: 2GB
    compression: lz4
    description: "Transaction risk scores from risk engine"

  - name: remitflow.notifications.stream
    partitions: 3
    replication: 1
    retention:
      time: 48h
      size: 500MB
    compression: lz4
    description: "User notification events"

  - name: remitflow.audit.stream
    partitions: 3
    replication: 1
    retention:
      time: 90d
      size: 20GB
    compression: gzip
    description: "Immutable audit log stream"

  - name: remitflow.mojaloop.transfers
    partitions: 6
    replication: 1
    retention:
      time: 30d
      size: 5GB
    compression: lz4
    description: "Mojaloop transfer events"

connectors:
  - name: postgres-sink
    type: sink
    topic: remitflow.transactions.stream
    config:
      host: postgres
      port: 5432
      database: remitflow
      table: transaction_events
      batch_size: 100
      flush_interval: 5s

  - name: opensearch-sink
    type: sink
    topic: remitflow.transactions.stream
    config:
      host: opensearch
      port: 9200
      index: remitflow-transactions
      batch_size: 50
      flush_interval: 2s
