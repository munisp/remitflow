# Prometheus configuration for RemitFlow staging
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "remitflow-api"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: /api/metrics
    scrape_interval: 10s

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "pgbouncer"
    static_configs:
      - targets: ["pgbouncer:6432"]
    metrics_path: /metrics
