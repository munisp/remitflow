groups:
  - name: remitflow.critical
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.job }}"

      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_activity_count > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection pool near exhaustion"
          description: "{{ $value }} active connections (max 100)"

  - name: remitflow.financial
    interval: 60s
    rules:
      - alert: HighTransactionFailureRate
        expr: rate(remitflow_transactions_failed_total[10m]) / rate(remitflow_transactions_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High transaction failure rate"
          description: "{{ $value | humanizePercentage }} of transactions are failing"

      - alert: FXRateStaleness
        expr: time() - remitflow_fx_last_update_timestamp > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "FX rates are stale"
          description: "FX rates have not been updated for {{ $value | humanizeDuration }}"

      - alert: LargeTransactionVolume
        expr: sum(rate(remitflow_transaction_amount_usd_sum[1h])) > 1000000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High transaction volume"
          description: "Transaction volume exceeds $1M/hour: ${{ $value | humanize }}"

  - name: remitflow.security
    interval: 30s
    rules:
      - alert: HighRiskTransactionSpike
        expr: rate(risk_high_risk_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High-risk transaction spike detected"
          description: "{{ $value }} high-risk transactions per second"

      - alert: BruteForceDetected
        expr: rate(remitflow_auth_failures_total[5m]) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Possible brute force attack"
          description: "{{ $value }} auth failures per second"

      - alert: AnomalousAPIUsage
        expr: rate(http_requests_total[1m]) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Anomalous API usage detected"
          description: "{{ $value }} requests/second on {{ $labels.job }}"

  - name: remitflow.infrastructure
    interval: 60s
    rules:
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag_sum > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag"
          description: "Consumer lag is {{ $value }} messages"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory"
