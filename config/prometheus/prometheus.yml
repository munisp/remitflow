global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: remitflow-production
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── Main Application ───────────────────────────────────────────────────────
  - job_name: remitflow-app
    static_configs:
      - targets: [app:3000]
    metrics_path: /api/metrics
    scrape_interval: 15s

  # ── FX Engine ──────────────────────────────────────────────────────────────
  - job_name: fx-engine
    static_configs:
      - targets: [fx-engine:8085]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Risk Engine ────────────────────────────────────────────────────────────
  - job_name: risk-engine
    static_configs:
      - targets: [risk-engine:8091]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Mojaloop Connector ─────────────────────────────────────────────────────
  - job_name: mojaloop-connector
    static_configs:
      - targets: [mojaloop-connector:8086]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Ledger Service ─────────────────────────────────────────────────────────
  - job_name: ledger-service
    static_configs:
      - targets: [ledger-service:8087]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Kafka Processor ────────────────────────────────────────────────────────
  - job_name: kafka-processor
    static_configs:
      - targets: [kafka-processor:8092]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Search Indexer ─────────────────────────────────────────────────────────
  - job_name: search-indexer
    static_configs:
      - targets: [search-indexer:8088]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── Lakehouse ETL ──────────────────────────────────────────────────────────
  - job_name: lakehouse-etl
    static_configs:
      - targets: [lakehouse-etl:8089]
    metrics_path: /metrics
    scrape_interval: 60s

  # ── Temporal Workflows ─────────────────────────────────────────────────────
  - job_name: temporal-workflows
    static_configs:
      - targets: [temporal-workflows:8090]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── APISIX Gateway ─────────────────────────────────────────────────────────
  - job_name: apisix
    static_configs:
      - targets: [apisix:9091]
    metrics_path: /apisix/prometheus/metrics
    scrape_interval: 10s

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
    scrape_interval: 30s

  # ── Redis ──────────────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
    scrape_interval: 15s

  # ── Kafka ──────────────────────────────────────────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
    scrape_interval: 30s

  # ── OpenSearch ─────────────────────────────────────────────────────────────
  - job_name: opensearch
    static_configs:
      - targets: [opensearch:9200]
    metrics_path: /_prometheus/metrics
    scrape_interval: 30s

  # ── Node Exporter ──────────────────────────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
    scrape_interval: 15s
