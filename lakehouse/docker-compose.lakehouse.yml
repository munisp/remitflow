version: '3.8'
services:
  # Apache Spark master
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: remitflow-spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8081:8080"
      - "7077:7077"
    networks:
      - remitflow-net

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: remitflow-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    networks:
      - remitflow-net

  # MinIO as S3-compatible object store for Iceberg
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: remitflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: remitflow
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-remitflow-minio-dev-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Apache Iceberg REST catalog
  iceberg-rest:
    image: tabulario/iceberg-rest:0.10.0
    container_name: remitflow-iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: remitflow
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-remitflow-minio-dev-password}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://remitflow-lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
    ports:
      - "8182:8181"
    depends_on:
      - minio
    networks:
      - remitflow-net

  # dbt for data transformations
  dbt:
    image: ghcr.io/dbt-labs/dbt-spark:1.8.0
    container_name: remitflow-dbt
    volumes:
      - ./dbt:/usr/app/dbt
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml
    working_dir: /usr/app/dbt
    networks:
      - remitflow-net

volumes:
  minio-data:

networks:
  remitflow-net:
    external: true
