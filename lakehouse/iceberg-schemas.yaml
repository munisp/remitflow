# Apache Iceberg Table Schemas for RemitFlow Lakehouse
# All tables use partitioning by year/month for efficient time-range queries.

tables:
  transfers_fact:
    namespace: remitflow
    name: transfers_fact
    description: "Immutable fact table for all transfer events"
    location: "s3://remitflow-lakehouse/transfers_fact/"
    partition_spec:
      - field: created_year
        transform: year
        source: created_at
      - field: created_month
        transform: month
        source: created_at
    schema:
      - name: transfer_id
        type: string
        required: true
      - name: user_id
        type: long
        required: true
      - name: amount_ngn
        type: decimal(18,2)
      - name: amount_usd
        type: decimal(18,2)
      - name: from_currency
        type: string
      - name: to_currency
        type: string
      - name: corridor
        type: string
      - name: purpose_code
        type: string
      - name: status
        type: string
      - name: fee_usd
        type: decimal(10,4)
      - name: fx_rate
        type: decimal(18,6)
      - name: fx_spread_usd
        type: decimal(10,4)
      - name: rail
        type: string
      - name: created_at
        type: timestamptz
        required: true
      - name: completed_at
        type: timestamptz
      - name: created_year
        type: int
      - name: created_month
        type: int

  fx_rates_history:
    namespace: remitflow
    name: fx_rates_history
    description: "Historical FX rate snapshots for analytics and backtesting"
    location: "s3://remitflow-lakehouse/fx_rates_history/"
    partition_spec:
      - field: rate_date
        transform: date
        source: captured_at
    schema:
      - name: id
        type: string
        required: true
      - name: from_currency
        type: string
        required: true
      - name: to_currency
        type: string
        required: true
      - name: rate
        type: decimal(18,6)
        required: true
      - name: source
        type: string
      - name: captured_at
        type: timestamptz
        required: true
      - name: rate_date
        type: date

  revenue_daily:
    namespace: remitflow
    name: revenue_daily
    description: "Daily revenue aggregates by corridor and product"
    location: "s3://remitflow-lakehouse/revenue_daily/"
    partition_spec:
      - field: revenue_year
        transform: year
        source: revenue_date
    schema:
      - name: revenue_date
        type: date
        required: true
      - name: corridor
        type: string
        required: true
      - name: product
        type: string
      - name: transfer_count
        type: long
      - name: total_volume_usd
        type: decimal(18,2)
      - name: fee_income_usd
        type: decimal(18,4)
      - name: fx_spread_usd
        type: decimal(18,4)
      - name: float_income_usd
        type: decimal(18,4)
      - name: total_revenue_usd
        type: decimal(18,4)
      - name: revenue_year
        type: int

  kyc_events:
    namespace: remitflow
    name: kyc_events
    description: "KYC verification event log for compliance reporting"
    location: "s3://remitflow-lakehouse/kyc_events/"
    partition_spec:
      - field: event_month
        transform: month
        source: event_at
    schema:
      - name: event_id
        type: string
        required: true
      - name: user_id
        type: long
        required: true
      - name: event_type
        type: string
      - name: kyc_tier_before
        type: int
      - name: kyc_tier_after
        type: int
      - name: provider
        type: string
      - name: country
        type: string
      - name: event_at
        type: timestamptz
        required: true
      - name: event_month
        type: int
