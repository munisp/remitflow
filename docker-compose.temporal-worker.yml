# =============================================================================
# RemitFlow — Temporal Worker Docker Compose
# Deploys the Temporal worker independently from the main Express server.
# Usage:
#   docker compose -f docker-compose.temporal-worker.yml up -d
#   docker compose -f docker-compose.temporal-worker.yml logs -f worker
# =============================================================================

version: "3.9"

# ── Shared network (attach to existing remitflow stack) ───────────────────────
networks:
  remitflow:
    external: true          # Must match the network in docker-compose.v7.yml
    name: remitflow_default

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  worker_logs:

# ── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Temporal Worker (primary) ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: remitflow/temporal-worker:latest
    container_name: remitflow-temporal-worker
    restart: unless-stopped
    networks:
      - remitflow
    ports:
      - "8080:8080"           # Health check endpoint
    environment:
      NODE_ENV: production
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: remitflow
      TEMPORAL_TASK_QUEUE: remitflow-transfers
      WORKER_HEALTH_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-""}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-""}
      KYC_SERVICE_URL: ${KYC_SERVICE_URL:-http://kyc-service:8000}
    volumes:
      - worker_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "traefik.enable=false"
      - "com.remitflow.service=temporal-worker"
      - "com.remitflow.version=v10"

  # ── Temporal Worker (replica for HA) ────────────────────────────────────────
  worker-replica:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: remitflow/temporal-worker:latest
    container_name: remitflow-temporal-worker-2
    restart: unless-stopped
    networks:
      - remitflow
    ports:
      - "8081:8080"           # Health check on different host port
    environment:
      NODE_ENV: production
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: remitflow
      TEMPORAL_TASK_QUEUE: remitflow-transfers
      WORKER_HEALTH_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-""}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-""}
      KYC_SERVICE_URL: ${KYC_SERVICE_URL:-http://kyc-service:8000}
    volumes:
      - worker_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "traefik.enable=false"
      - "com.remitflow.service=temporal-worker-replica"
      - "com.remitflow.version=v10"

  # ── Worker Prometheus metrics exporter ──────────────────────────────────────
  worker-metrics:
    image: prom/node-exporter:latest
    container_name: remitflow-worker-metrics
    restart: unless-stopped
    networks:
      - remitflow
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    labels:
      - "com.remitflow.service=worker-metrics"
