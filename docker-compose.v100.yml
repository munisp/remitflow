##############################################################################
# RemitFlow v100 — Full Production Docker Compose
# Includes: App, DB, Redis, Kafka, Elasticsearch, Prometheus, Grafana,
#           Temporal, Nginx, Mailhog, MinIO, Jaeger, Loki, Alertmanager
##############################################################################
version: "3.9"

x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: mysql://remitflow:remitflow_pass@mysql:3306/remitflow
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  JWT_SECRET: remitflow_jwt_secret_v100_change_in_production
  VITE_APP_ID: remitflow-app
  OAUTH_SERVER_URL: https://api.manus.im
  VITE_OAUTH_PORTAL_URL: https://auth.manus.im
  BUILT_IN_FORGE_API_URL: https://api.manus.im
  BUILT_IN_FORGE_API_KEY: remitflow_forge_key_v100
  VITE_FRONTEND_FORGE_API_KEY: remitflow_frontend_forge_key_v100
  VITE_FRONTEND_FORGE_API_URL: https://api.manus.im
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: remitflow_minio_access
  S3_SECRET_KEY: remitflow_minio_secret
  S3_BUCKET: remitflow-assets
  ELASTICSEARCH_URL: http://elasticsearch:9200
  TEMPORAL_ADDRESS: temporal:7233
  SMTP_HOST: mailhog
  SMTP_PORT: 1025
  TWILIO_ACCOUNT_SID: AC_default_sid_replace_in_production
  TWILIO_AUTH_TOKEN: default_auth_token_replace_in_production
  TWILIO_FROM_NUMBER: "+15005550006"
  STRIPE_SECRET_KEY: sk_test_default_replace_in_production
  STRIPE_WEBHOOK_SECRET: whsec_default_replace_in_production
  VITE_STRIPE_PUBLISHABLE_KEY: pk_test_default_replace_in_production
  EXCHANGE_RATE_API_KEY: default_exchange_rate_api_key
  OPEN_BANKING_CLIENT_ID: remitflow_open_banking_client
  OPEN_BANKING_CLIENT_SECRET: remitflow_open_banking_secret
  CARBON_OFFSET_API_KEY: remitflow_carbon_api_key
  AML_SCREENING_API_KEY: remitflow_aml_api_key
  KYC_PROVIDER_API_KEY: remitflow_kyc_api_key

services:
  # ── Application ────────────────────────────────────────────────────────────
  app:
    image: remitflow:v100
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - remitflow-net
    volumes:
      - app-logs:/app/logs

  # ── MySQL / TiDB ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_in_production
      MYSQL_DATABASE: remitflow
      MYSQL_USER: remitflow
      MYSQL_PASSWORD: remitflow_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "remitflow", "-premitflow_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow-net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass remitflow_redis_pass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "remitflow_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow-net

  # ── Kafka + Zookeeper ─────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - remitflow-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - remitflow-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: remitflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - remitflow-net

  # ── Elasticsearch ─────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - remitflow-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - remitflow-net

  # ── MinIO (S3-compatible) ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: remitflow_minio_access
      MINIO_ROOT_PASSWORD: remitflow_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - remitflow-net

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - remitflow-net

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: remitflow_grafana_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - remitflow-net

  # ── Jaeger (Distributed Tracing) ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.51
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    networks:
      - remitflow-net

  # ── Temporal (Workflow Engine) ────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.22.0
    depends_on:
      - mysql
    ports:
      - "7233:7233"
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_USER: remitflow
      MYSQL_PWD: remitflow_pass
      MYSQL_SEEDS: mysql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    networks:
      - remitflow-net

  temporal-ui:
    image: temporalio/ui:2.21.0
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    networks:
      - remitflow-net

  # ── Mailhog (SMTP Testing) ────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - remitflow-net

  # ── Nginx (Reverse Proxy) ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - remitflow-net

  # ── Loki (Log Aggregation) ────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - remitflow-net

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - app-logs:/var/log/app:ro
      - /var/log:/var/log:ro
    networks:
      - remitflow-net

  # ── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    ports:
      - "9093:9093"
    volumes:
      - ./k8s/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - remitflow-net

networks:
  remitflow-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  es-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  app-logs:
