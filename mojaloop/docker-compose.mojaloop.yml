version: '3.8'
# Mojaloop Simulator for RemitFlow development
# Production: connect to actual Mojaloop Hub via FSPIOP API
services:
  mojaloop-simulator:
    image: mojaloop/simulator:v14.1.1
    container_name: remitflow-mojaloop-sim
    ports:
      - "8444:8444"
    environment:
      LOG_LEVEL: info
      OUTBOUND_ENDPOINT: http://mojaloop-simulator:8444
      INBOUND_LISTEN_PORT: 8444
      MUTUAL_TLS_ENABLED: "false"
      VALIDATE_INBOUND_JWS: "false"
      DFSP_ID: remitflow-dfsp
    networks:
      - remitflow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8444/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mojaloop-ttk:
    image: mojaloop/ml-testing-toolkit:v17.0.0
    container_name: remitflow-mojaloop-ttk
    ports:
      - "5050:5050"
      - "5051:5051"
    environment:
      LOG_LEVEL: info
    networks:
      - remitflow-net

networks:
  remitflow-net:
    external: true
