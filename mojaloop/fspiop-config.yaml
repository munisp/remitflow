# Mojaloop FSPIOP API Configuration for RemitFlow
# Implements ISO 20022 pacs.008 / pacs.002 message mapping
# Tuned for 1M+ TPS: tighter timeouts, connection pooling, bulk operations

fspiop:
  version: "1.1"
  dfsp_id: "remitflow-dfsp"
  hub_endpoint: "${MOJALOOP_HUB_URL:-http://mojaloop-simulator:8444}"

  # JWS signing — EdDSA for speed (2x faster than RS256)
  jws:
    enabled: true
    algorithm: EdDSA
    signing_key_path: "/secrets/mojaloop-jws-ed25519.pem"
    verification_keys_path: "/secrets/mojaloop-jws-public-keys/"

  # mTLS for production
  mtls:
    enabled: true
    cert_path: "/secrets/mojaloop-client.crt"
    key_path: "/secrets/mojaloop-client.key"
    ca_path: "/secrets/mojaloop-ca.crt"

  # Connection pool to Mojaloop Hub
  connection_pool:
    max_idle_conns: 200
    max_idle_conns_per_host: 100
    max_conns_per_host: 200
    idle_conn_timeout_ms: 90000

  # Supported corridors via Mojaloop
  corridors:
    - id: NG_GH
      from_currency: NGN
      to_currency: GHS
      scheme: GhIPSS
      description: "Nigeria to Ghana via GhIPSS/Mojaloop"

    - id: NG_KE
      from_currency: NGN
      to_currency: KES
      scheme: PesaLink
      description: "Nigeria to Kenya via PesaLink/Mojaloop"

    - id: NG_TZ
      from_currency: NGN
      to_currency: TZS
      scheme: TIPS
      description: "Nigeria to Tanzania via TIPS/Mojaloop"

    - id: NG_UG
      from_currency: NGN
      to_currency: UGX
      scheme: UgandaIPS
      description: "Nigeria to Uganda via Uganda IPS/Mojaloop"

    - id: NG_ZA
      from_currency: NGN
      to_currency: ZAR
      scheme: SADC-RTGS
      description: "Nigeria to South Africa via SADC-RTGS"

  # Message timeout settings — tightened for throughput
  timeouts:
    party_lookup_ms: 10000
    quote_ms: 15000
    transfer_ms: 15000
    bulk_transfer_ms: 60000

  # Bulk operations — process up to 1000 transfers per bulk message
  bulk:
    enabled: true
    max_transfers_per_message: 1000
    batch_timeout_ms: 10

  # Party lookup cache (Redis) — skip network round-trip for known parties
  party_cache:
    enabled: true
    ttl_seconds: 300
    max_entries: 1000000

  # Quote cache — short TTL for live FX rates
  quote_cache:
    enabled: true
    ttl_seconds: 30
    max_entries: 100000

  # Callback endpoints (RemitFlow receives these)
  callbacks:
    parties: "/api/mojaloop/parties"
    quotes: "/api/mojaloop/quotes"
    transfers: "/api/mojaloop/transfers"
    bulk_transfers: "/api/mojaloop/bulk-transfers"
    transaction_requests: "/api/mojaloop/transaction-requests"
