# ISO 20022 to Mojaloop FSPIOP Message Mapping
# Used by go-cips-adapter and go-nibss-adapter for interoperability

mappings:
  pacs008_to_transferRequest:
    description: "Map ISO 20022 pacs.008 FIToFICstmrCdtTrf to Mojaloop transfer"
    fields:
      - iso: "GrpHdr.MsgId"
        mojaloop: "transferId"
        transform: "uuid_from_string"

      - iso: "CdtTrfTxInf.IntrBkSttlmAmt.Ccy"
        mojaloop: "amount.currency"

      - iso: "CdtTrfTxInf.IntrBkSttlmAmt.value"
        mojaloop: "amount.amount"
        transform: "decimal_to_string"

      - iso: "CdtTrfTxInf.Dbtr.Nm"
        mojaloop: "payer.name"

      - iso: "CdtTrfTxInf.Cdtr.Nm"
        mojaloop: "payee.name"

      - iso: "CdtTrfTxInf.CdtrAcct.Id.IBAN"
        mojaloop: "payee.partyIdInfo.partyIdentifier"

  pacs002_from_transferFulfil:
    description: "Map Mojaloop transferFulfil to ISO 20022 pacs.002"
    fields:
      - mojaloop: "transferId"
        iso: "GrpHdr.MsgId"

      - mojaloop: "transferState"
        iso: "TxInfAndSts.TxSts"
        transform: "mojaloop_state_to_iso_status"

      - mojaloop: "completedTimestamp"
        iso: "GrpHdr.CreDtTm"
        transform: "iso8601_to_datetime"
