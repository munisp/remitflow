# RemitFlow — Canary Deployment Configuration
#
# Progressive rollout with automatic rollback:
#   Stage 1: 1% traffic (5 min) — smoke test
#   Stage 2: 5% traffic (10 min) — error rate check
#   Stage 3: 25% traffic (15 min) — latency check
#   Stage 4: 50% traffic (15 min) — full validation
#   Stage 5: 100% traffic — promote
#
# Rollback triggers:
#   - Error rate > 1%
#   - p95 latency > 500ms
#   - Any 5xx spike > 0.5%
#   - TigerBeetle ledger imbalance detected
#
# Works with: Kubernetes (Argo Rollouts), AWS (CodeDeploy), Fly.io

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: remitflow-api
  namespace: remitflow
  labels:
    app: remitflow
    component: api-server
spec:
  replicas: 10
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: remitflow
      component: api-server
  strategy:
    canary:
      canaryService: remitflow-api-canary
      stableService: remitflow-api-stable
      trafficRouting:
        nginx:
          stableIngress: remitflow-api-ingress
          additionalIngressAnnotations:
            canary-by-header: X-Canary
      steps:
        # Stage 1: Smoke test with 1% traffic
        - setWeight: 1
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: remitflow-smoke-test
            args:
              - name: service-name
                value: remitflow-api-canary

        # Stage 2: 5% with error rate check
        - setWeight: 5
        - pause: { duration: 10m }
        - analysis:
            templates:
              - templateName: remitflow-error-rate
              - templateName: remitflow-latency
            args:
              - name: service-name
                value: remitflow-api-canary

        # Stage 3: 25% with full validation
        - setWeight: 25
        - pause: { duration: 15m }
        - analysis:
            templates:
              - templateName: remitflow-error-rate
              - templateName: remitflow-latency
              - templateName: remitflow-ledger-balance
            args:
              - name: service-name
                value: remitflow-api-canary

        # Stage 4: 50% sustained load
        - setWeight: 50
        - pause: { duration: 15m }
        - analysis:
            templates:
              - templateName: remitflow-full-validation
            args:
              - name: service-name
                value: remitflow-api-canary

        # Stage 5: Full promotion
        - setWeight: 100

      # Anti-affinity: canary pods on different nodes than stable
      antiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          weight: 100

---
# Analysis Template: Smoke Test
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: remitflow-smoke-test
  namespace: remitflow
spec:
  args:
    - name: service-name
  metrics:
    - name: smoke-health
      interval: 30s
      count: 5
      successCondition: result == "healthy"
      provider:
        web:
          url: "http://{{args.service-name}}.remitflow.svc.cluster.local:3001/api/services/health"
          jsonPath: "{$.status}"

---
# Analysis Template: Error Rate
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: remitflow-error-rate
  namespace: remitflow
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 1m
      count: 10
      successCondition: result[0] < 0.01
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[5m]))

---
# Analysis Template: Latency
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: remitflow-latency
  namespace: remitflow
spec:
  args:
    - name: service-name
  metrics:
    - name: p95-latency
      interval: 1m
      count: 10
      successCondition: result[0] < 500
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_ms_bucket{service="{{args.service-name}}"}[5m])) by (le)
            )

---
# Analysis Template: Ledger Balance (Financial Integrity)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: remitflow-ledger-balance
  namespace: remitflow
spec:
  args:
    - name: service-name
  metrics:
    - name: ledger-balance
      interval: 2m
      count: 5
      successCondition: result[0] == 0
      failureLimit: 0  # Zero tolerance for ledger imbalance
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            abs(
              sum(tigerbeetle_debits_total{service="{{args.service-name}}"})
              -
              sum(tigerbeetle_credits_total{service="{{args.service-name}}"})
            )

---
# Analysis Template: Full Validation (runs all checks)
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: remitflow-full-validation
  namespace: remitflow
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 1m
      count: 15
      successCondition: result[0] < 0.01
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[5m]))
    - name: p95-latency
      interval: 1m
      count: 15
      successCondition: result[0] < 500
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_ms_bucket{service="{{args.service-name}}"}[5m])) by (le)
            )
    - name: ledger-integrity
      interval: 2m
      count: 7
      successCondition: result[0] == 0
      failureLimit: 0
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            abs(
              sum(tigerbeetle_debits_total{service="{{args.service-name}}"})
              -
              sum(tigerbeetle_credits_total{service="{{args.service-name}}"})
            )
    - name: transfer-success-rate
      interval: 1m
      count: 15
      successCondition: result[0] > 0.99
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(transfers_completed_total{service="{{args.service-name}}"}[5m]))
            /
            sum(rate(transfers_initiated_total{service="{{args.service-name}}"}[5m]))
