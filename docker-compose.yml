version: "3.9"

# ── RemitFlow — Full-Stack Docker Compose ────────────────────────────────────
# Usage:
#   docker compose up -d              # start all services
#   docker compose logs -f app        # follow app logs
#   docker compose down -v            # stop and remove volumes

services:
  # ── Go FX Engine ─────────────────────────────────────────────────────────
  fx-engine:
    build:
      context: ./services/fx-engine
      dockerfile: Dockerfile
    container_name: remitflow_fx_engine
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      REDIS_URL: "redis:6379"
      GIN_MODE: release
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── Python Fraud ML ────────────────────────────────────────────────────────
  fraud-ml:
    build:
      context: ./services/fraud-ml
      dockerfile: Dockerfile
    container_name: remitflow_fraud_ml
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      - remitflow_net

  # ── Rust AML Engine ────────────────────────────────────────────────────────
  aml-engine:
    build:
      context: ./services/aml-engine
      dockerfile: Dockerfile
    container_name: remitflow_aml_engine
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── Application ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: remitflow:v69
    container_name: remitflow_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-mysql://remitflow:CHANGE_ME@db:3306/remitflow}
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: ${VITE_APP_ID}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-https://api.manus.im}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-https://oauth.manus.im}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID}
      OWNER_NAME: ${OWNER_NAME:-RemitFlow Admin}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-https://api.manus.im}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-https://api.manus.im}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
      FX_ENGINE_URL: "http://fx-engine:8081"
      FRAUD_ML_URL: "http://fraud-ml:8082"
      AML_ENGINE_URL: "http://aml-engine:8083"
      COMMUNITY_FEED_URL: "http://community-feed:8084"
      SHARE_LINK_URL: "http://share-link:8085"
      NAV_ANALYTICS_URL: "http://nav-analytics:8086"
      INVESTMENT_FEED_URL: "http://go-investment-feed:8095"
      PORTFOLIO_CALC_URL: "http://rust-portfolio-calc:8096"
      INVESTMENT_ML_URL: "http://python-investment-ml:8097"
      TRANSFER_ENGINE_URL: "http://transfer-engine:50051"
      ANALYTICS_URL: "http://analytics:8085"
      PDF_RECEIPT_URL: "http://pdf-receipt:8086"
      # Keycloak OIDC
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-remitflow}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-remitflow-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fx-engine:
        condition: service_healthy
      fraud-ml:
        condition: service_healthy
      aml-engine:
        condition: service_healthy
      community-feed:
        condition: service_healthy
      share-link:
        condition: service_healthy
      nav-analytics:
        condition: service_healthy
      go-investment-feed:
        condition: service_healthy
      rust-portfolio-calc:
        condition: service_healthy
      python-investment-ml:
        condition: service_healthy
      transfer-engine:
        condition: service_started
      analytics:
        condition: service_healthy
      pdf-receipt:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/trpc/system.health?batch=1&input={}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - remitflow_net

  # ── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: remitflow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_ROOT}
      MYSQL_DATABASE: remitflow
      MYSQL_USER: ${DB_USER:-remitflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-remitflow}", "-p${DB_PASSWORD:-CHANGE_ME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - remitflow_net

  # ── Redis (session cache, rate limiting) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remitflow_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_REDIS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── Go Community Feed Service ──────────────────────────────────────────────────
  community-feed:
    build:
      context: ./services/go-community-feed
      dockerfile: Dockerfile
    container_name: remitflow_community_feed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-mysql://remitflow:CHANGE_ME@db:3306/remitflow}
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── Rust Share Link Service ──────────────────────────────────────────────────
  share-link:
    build:
      context: ./services/rust-share-link
      dockerfile: Dockerfile
    container_name: remitflow_share_link
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      PORT: "8085"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── Python Nav Analytics Service ─────────────────────────────────────────────
  nav-analytics:
    build:
      context: ./services/python-nav-analytics
      dockerfile: Dockerfile
    container_name: remitflow_nav_analytics
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      PORT: "8086"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v49: Go Investment Price Feed ─────────────────────────────────────────────
  go-investment-feed:
    build:
      context: ./services/go-investment-feed
      dockerfile: Dockerfile
    container_name: remitflow_go_investment_feed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      PORT: "8095"
      GIN_MODE: release
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v49: Rust Portfolio Calculator ─────────────────────────────────────────────
  rust-portfolio-calc:
    build:
      context: ./services/rust-portfolio-calc
      dockerfile: Dockerfile
    container_name: remitflow_rust_portfolio_calc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      PORT: "8096"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v49: Python Investment ML Service ─────────────────────────────────────────────
  python-investment-ml:
    build:
      context: ./services/python-investment-ml
      dockerfile: Dockerfile
    container_name: remitflow_python_investment_ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8097"
    environment:
      PORT: "8097"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      - remitflow_net

  # ── v63: Go Transfer Engine (gRPC + state machine + fraud scoring) ──────────
  transfer-engine:
    build:
      context: ./services/transfer-engine
      dockerfile: Dockerfile
    container_name: remitflow_transfer_engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      PORT: "50051"
      GO_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql://remitflow:CHANGE_ME@db:3306/remitflow}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'health' | nc -w1 localhost 50051 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - remitflow_net

  # ── v63: Python Analytics Pipeline (KPIs, reports, corridor metrics) ───────
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: remitflow_analytics
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8085"
    environment:
      PORT: "8085"
      DATABASE_URL: ${DATABASE_URL:-mysql://remitflow:CHANGE_ME@db:3306/remitflow}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - remitflow_net

  # ── v63: Python PDF Receipt Generator ──────────────────────────────────
  pdf-receipt:
    build:
      context: ./services/pdf-receipt
      dockerfile: Dockerfile
    container_name: remitflow_pdf_receipt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8086"
    environment:
      PORT: "8086"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - remitflow_net

  # ── Keycloak Identity Provider ───────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: remitflow_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-mem
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/remitflow-realm.json:/opt/keycloak/data/import/remitflow-realm.json:ro
    networks:
      - remitflow_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: remitflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - remitflow_net

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: remitflow_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - remitflow_net
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: remitflow_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-remitflow_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - remitflow_net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Go Transaction Export Service (v64) ──────────────────────────────────
  go-export-service:
    build:
      context: ./services/go-export-service
      dockerfile: Dockerfile
    container_name: remitflow_go_export
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8095"
    environment:
      PORT: "8095"
      GIN_MODE: release
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── Rust PDF Receipt Service (v64) ────────────────────────────────────
  rust-pdf-receipt:
    build:
      context: ./services/rust-pdf-receipt
      dockerfile: Dockerfile
    container_name: remitflow_rust_pdf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8096"
    environment:
      PORT: "8096"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── Python Compliance ML Service (v64) ───────────────────────────────
  python-compliance-ml:
    build:
      context: ./services/python-compliance-ml
      dockerfile: Dockerfile
    container_name: remitflow_compliance_ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8097"
    environment:
      PORT: "8097"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      - remitflow_net


  # ── Kafka KRaft (no Zookeeper) ────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: remitflow_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - remitflow_net

  # ── v110: Go CIPS Adapter ─────────────────────────────────────────────────
  go-cips-adapter:
    build:
      context: ./services/go-cips-adapter
      dockerfile: Dockerfile
    container_name: remitflow_go_cips
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      PORT: "8091"
      CIPS_SANDBOX_MODE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v110: Rust UPI Adapter ─────────────────────────────────────────────────
  rust-upi-adapter:
    build:
      context: ./services/rust-upi-adapter
      dockerfile: Dockerfile
    container_name: remitflow_rust_upi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      PORT: "8092"
      UPI_SANDBOX_MODE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v110: Python PIX Adapter ───────────────────────────────────────────────
  python-pix-adapter:
    build:
      context: ./services/python-pix-adapter
      dockerfile: Dockerfile
    container_name: remitflow_python_pix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      PORT: "8093"
      PIX_SANDBOX_MODE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v110: Go Kafka Service ─────────────────────────────────────────────────
  go-kafka-service:
    build:
      context: ./services/go-kafka-service
      dockerfile: Dockerfile
    container_name: remitflow_go_kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      PORT: "8094"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v110: Go Temporal Worker ───────────────────────────────────────────────
  go-temporal-worker:
    build:
      context: ./services/go-temporal-worker
      dockerfile: Dockerfile
    container_name: remitflow_go_temporal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      PORT: "8095"
      TEMPORAL_ADDRESS: temporal:7233
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8095/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v110: Go Permify Authorization ────────────────────────────────────────
  go-permify-service:
    build:
      context: ./services/go-permify-service
      dockerfile: Dockerfile
    container_name: remitflow_go_permify
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      PORT: "8096"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8096/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v110: Rust Redis Cache Service ────────────────────────────────────────
  rust-redis-service:
    build:
      context: ./services/rust-redis-service
      dockerfile: Dockerfile
    container_name: remitflow_rust_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8097"
    environment:
      PORT: "8097"
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow_net

  # ── v110: Rust Fluvio Streaming ────────────────────────────────────────────
  rust-fluvio-service:
    build:
      context: ./services/rust-fluvio-service
      dockerfile: Dockerfile
    container_name: remitflow_rust_fluvio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8098"
    environment:
      PORT: "8098"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 15s
