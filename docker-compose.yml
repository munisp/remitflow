version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: remitflow-postgres
    environment:
      POSTGRES_USER: remitflow
      POSTGRES_PASSWORD: remitflow123
      POSTGRES_DB: remitflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_production_schema_v2.0.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitflow -d remitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remitflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── Compliance ML ────────────────────────────────────────────────────────
  compliance-ml:
    build:
      context: ./services/python-compliance-ml
      dockerfile: Dockerfile
    container_name: remitflow-compliance-ml
    ports:
      - "8097:8097"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - COMPLYADVANTAGE_API_KEY=${COMPLYADVANTAGE_API_KEY}
      - DOWJONES_API_KEY=${DOWJONES_API_KEY}
      - DOWJONES_API_SECRET=${DOWJONES_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── KYC Liveness ───────────────────────────────────────────────────────────
  kyc-liveness:
    build:
      context: ./services/python-kyc-liveness
      dockerfile: Dockerfile
    container_name: remitflow-kyc-liveness
    ports:
      - "8095:8095"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - UNIFACE_MODEL_PATH=/models/minifasnet.onnx
    volumes:
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── AML Scorer ───────────────────────────────────────────────────────────
  aml-scorer:
    build:
      context: ./services/python-aml-scorer
      dockerfile: Dockerfile
    container_name: remitflow-aml-scorer
    ports:
      - "8096:8096"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - MODEL_PATH=/models/aml_model.joblib
      - MODEL_METADATA_PATH=/models/aml_model_metadata.json
    volumes:
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── FX Engine ────────────────────────────────────────────────────────────
  fx-engine:
    build:
      context: ./services/python-fx-engine
      dockerfile: Dockerfile
    container_name: remitflow-fx-engine
    ports:
      - "8093:8093"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY}
      - OPENEXCHANGERATES_APP_ID=${OPENEXCHANGERATES_APP_ID}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Core Banking Adapter ─────────────────────────────────────────────────
  core-banking:
    build:
      context: ./services/core-banking-adapter
      dockerfile: Dockerfile
    container_name: remitflow-core-banking
    ports:
      - "8092:8092"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - CORE_BANKING_BASE_URL=${CORE_BANKING_BASE_URL}
      - CORE_BANKING_API_KEY=${CORE_BANKING_API_KEY}
      - CORE_BANKING_API_SECRET=${CORE_BANKING_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Rust Transaction Processor ───────────────────────────────────────────
  transaction-processor:
    build:
      context: ./services/rust-transaction-processor
      dockerfile: Dockerfile
    container_name: remitflow-transaction-processor
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
