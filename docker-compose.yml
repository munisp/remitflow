###############################################################################
# RemitFlow — Consolidated Docker Compose
# Replaces 24 scattered files with 3 profiles:
#   default  → core services (DB, Redis, API)
#   full     → core + all microservices
#   monitoring → full + Prometheus, Grafana, Jaeger
#
# Usage:
#   docker compose up                    # core only
#   docker compose --profile full up     # all services
#   docker compose --profile monitoring up  # everything + observability
###############################################################################

services:
  # ═══ CORE INFRASTRUCTURE ═══════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: remitflow
      POSTGRES_USER: remitflow
      POSTGRES_PASSWORD: remitflow_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://remitflow:remitflow_dev@postgres:5432/remitflow
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-in-production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/trpc/system.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ═══ MICROSERVICES (profile: full) ═════════════════════════════════════════

  fx-aggregator:
    build: ./services/go-fx-aggregator
    profiles: ["full", "monitoring"]
    ports:
      - "8100:8100"
    environment:
      CURRENCYLAYER_API_KEY: ${CURRENCYLAYER_API_KEY:-}
      OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  fee-engine:
    build: ./services/rust-fee-engine
    profiles: ["full", "monitoring"]
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  refund-engine:
    build: ./services/python-refund-engine
    profiles: ["full", "monitoring"]
    ports:
      - "8102:8102"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8102/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  health-aggregator:
    build: ./services/go-health-aggregator
    profiles: ["full", "monitoring"]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      API_SERVER_URL: http://api:3000
      FX_AGGREGATOR_URL: http://fx-aggregator:8100
      FEE_ENGINE_URL: http://fee-engine:8101
      REFUND_ENGINE_URL: http://refund-engine:8102

  kafka:
    image: bitnami/kafka:3.6
    profiles: ["full", "monitoring"]
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

  temporal:
    image: temporalio/auto-setup:1.22
    profiles: ["full", "monitoring"]
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: remitflow
      POSTGRES_PWD: remitflow_dev
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ═══ MONITORING (profile: monitoring) ══════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.48.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.2.3
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafanadata:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.53
    profiles: ["monitoring"]
    ports:
      - "16686:16686"
      - "4318:4318"

  # ═══ ADDITIONAL SERVICES (profile: full) ════════════════════════════════════

  go-community-feed:
    build: ./services/go-community-feed
    profiles: ["full", "monitoring"]
    ports:
      - "8110:8110"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8110/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  go-ratelimit-sidecar:
    build: ./services/go-ratelimit-sidecar
    profiles: ["full", "monitoring"]
    ports:
      - "8111:8111"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8111/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-processor:
    build: ./services/kafka-processor
    profiles: ["full", "monitoring"]
    depends_on:
      - kafka

  ledger-service:
    build: ./services/ledger-service
    profiles: ["full", "monitoring"]
    ports:
      - "8112:8112"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8112/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mojaloop-connector:
    build: ./services/mojaloop-connector
    profiles: ["full", "monitoring"]
    ports:
      - "8113:8113"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8113/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-compliance-service:
    build: ./services/python-compliance-service
    profiles: ["full", "monitoring"]
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-nav-analytics:
    build: ./services/python-nav-analytics
    profiles: ["full", "monitoring"]
    ports:
      - "8114:8114"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8114/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rate-limiter:
    image: redis:7-alpine
    profiles: ["full", "monitoring"]
    ports:
      - "6380:6379"

  risk-engine:
    build: ./services/risk-engine
    profiles: ["full", "monitoring"]
    ports:
      - "8115:8115"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8115/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rust-audit-service:
    build: ./services/rust-audit-service
    profiles: ["full", "monitoring"]
    ports:
      - "8116:8116"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8116/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  search-indexer:
    build: ./services/search-indexer
    profiles: ["full", "monitoring"]
    ports:
      - "8117:8117"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8117/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  synthetic-monitor:
    build: ./services/python-synthetic-monitor
    profiles: ["monitoring"]
    ports:
      - "8201:8201"
    environment:
      REMITFLOW_BASE_URL: http://api:3000

  idempotency-service:
    build: ./services/rust-idempotency
    profiles: ["full", "monitoring"]
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8103/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══ INFRASTRUCTURE SERVICES (profile: full) ════════════════════════════════

  temporal:
    image: temporalio/auto-setup:1.24
    profiles: ["full", "monitoring"]
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: remitflow
      POSTGRES_PWD: remitflow_dev
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.26.2
    profiles: ["full", "monitoring"]
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["full", "monitoring"]
    command: ["node", "--loader", "ts-node/esm", "server/temporal/worker.ts"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: remitflow-main
      DATABASE_URL: postgresql://remitflow:remitflow_dev@postgres:5432/remitflow
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      WORKER_HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    profiles: ["full", "monitoring"]
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgresql://remitflow:remitflow_dev@postgres:5432/remitflow
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      AUTH_TYPE: plain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  vault:
    image: hashicorp/vault:1.15
    profiles: ["full", "monitoring"]
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: remitflow-dev-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  grafanadata:
