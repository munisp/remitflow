version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: remitflow-postgres
    environment:
      POSTGRES_USER: remitflow
      POSTGRES_PASSWORD: remitflow123
      POSTGRES_DB: remitflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_production_schema_v2.0.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitflow -d remitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remitflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (for local dev; use managed Kafka in production) ───────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: remitflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: remitflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ─── Compliance ML ────────────────────────────────────────────────────────
  compliance-ml:
    build:
      context: ./services/python-compliance-ml
      dockerfile: Dockerfile
    container_name: remitflow-compliance-ml
    ports:
      - "8097:8097"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - COMPLYADVANTAGE_API_KEY=${COMPLYADVANTAGE_API_KEY}
      - DOWJONES_API_KEY=${DOWJONES_API_KEY}
      - DOWJONES_API_SECRET=${DOWJONES_API_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── KYC Liveness ───────────────────────────────────────────────────────────
  kyc-liveness:
    build:
      context: ./services/python-kyc-liveness
      dockerfile: Dockerfile
    container_name: remitflow-kyc-liveness
    ports:
      - "8095:8095"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - UNIFACE_MODEL_PATH=/models/minifasnet.onnx
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── AML Scorer ───────────────────────────────────────────────────────────
  aml-scorer:
    build:
      context: ./services/python-aml-scorer
      dockerfile: Dockerfile
    container_name: remitflow-aml-scorer
    ports:
      - "8096:8096"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - MODEL_PATH=/models/aml_model.joblib
      - MODEL_METADATA_PATH=/models/aml_model_metadata.json
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── FX Engine ────────────────────────────────────────────────────────────
  fx-engine:
    build:
      context: ./services/python-fx-engine
      dockerfile: Dockerfile
    container_name: remitflow-fx-engine
    ports:
      - "8093:8093"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY}
      - OPENEXCHANGERATES_APP_ID=${OPENEXCHANGERATES_APP_ID}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Core Banking Adapter ─────────────────────────────────────────────────
  core-banking:
    build:
      context: ./services/core-banking-adapter
      dockerfile: Dockerfile
    container_name: remitflow-core-banking
    ports:
      - "8092:8092"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - TREASURY_PRIME_API_KEY=${TREASURY_PRIME_API_KEY}
      - TREASURY_PRIME_API_SECRET=${TREASURY_PRIME_API_SECRET}
      - TREASURY_PRIME_BASE_URL=${TREASURY_PRIME_BASE_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Rust Transaction Processor ───────────────────────────────────────────
  transaction-processor:
    build:
      context: ./services/rust-transaction-processor
      dockerfile: Dockerfile
    container_name: remitflow-transaction-processor
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - PORT=8081
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Travel Rule ──────────────────────────────────────────────────────────
  travel-rule:
    build:
      context: ./services/travel-rule
      dockerfile: Dockerfile
    container_name: remitflow-travel-rule
    ports:
      - "8098:8098"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - TRISA_ENDPOINT=${TRISA_ENDPOINT}
      - SYGNA_API_KEY=${SYGNA_API_KEY}
      - SYGNA_API_SECRET=${SYGNA_API_SECRET}
      - OPENVASP_NODE_ID=${OPENVASP_NODE_ID}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── SAR Filing ───────────────────────────────────────────────────────────
  sar-filing:
    build:
      context: ./services/sar-filing
      dockerfile: Dockerfile
    container_name: remitflow-sar-filing
    ports:
      - "8099:8099"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - NCA_API_KEY=${NCA_API_KEY}
      - NCA_API_SECRET=${NCA_API_SECRET}
      - FINCEN_API_KEY=${FINCEN_API_KEY}
      - FINCEN_API_SECRET=${FINCEN_API_SECRET}
      - JURISDICTION=${JURISDICTION:-GB}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Kafka Streaming ──────────────────────────────────────────────────────
  kafka-streaming:
    build:
      context: ./services/kafka-streaming
      dockerfile: Dockerfile
    container_name: remitflow-kafka-streaming
    ports:
      - "8100:8100"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── MFA Service ──────────────────────────────────────────────────────────
  mfa-service:
    build:
      context: ./services/mfa-service
      dockerfile: Dockerfile
    container_name: remitflow-mfa-service
    ports:
      - "8101:8101"
    environment:
      - DATABASE_URL=postgresql://remitflow:remitflow123@postgres:5432/remitflow
      - MFA_ISSUER_NAME=RemitFlow
      - WEBAUTHN_RP_ID=remitflow.com
      - WEBAUTHN_RP_NAME=RemitFlow
      - WEBAUTHN_ORIGIN=https://admin.remitflow.com
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
