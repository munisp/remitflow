apiVersion: apps/v1
kind: Deployment
metadata:
  name: openappsec
  namespace: remittance-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: openappsec
  template:
    metadata:
      labels:
        app: openappsec
    spec:
      containers:
      - name: openappsec
        image: openappsec/agent:latest
        ports:
        - containerPort: 8080
        - containerPort: 9093
