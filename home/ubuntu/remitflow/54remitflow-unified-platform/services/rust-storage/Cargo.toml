[package]
name = "remittance-storage"
version = "1.0.0"
edition = "2021"
authors = ["Remittance Platform Team"]
description = "High-performance S3-compatible storage client for Remittance Platform"
license = "Apache-2.0"

[dependencies]
# AWS S3 SDK for Rust (works with RustFS, MinIO, and any S3-compatible storage)
aws-config = "1.1"
aws-sdk-s3 = "1.12"
aws-credential-types = "1.1"
aws-smithy-runtime-api = "1.1"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"
bytes = "1.5"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Metrics and health
prometheus = "0.13"

# Encryption
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Compression
flate2 = "1.0"

# HTTP server (for health endpoints)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
wiremock = "0.5"

[[bin]]
name = "storage-service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
