apiVersion: v1
kind: Namespace
metadata:
  name: temporal-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal-system
data:
  development-sql.yaml: |
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
        constraints: {}
    history.maxAutoResetPoints:
      - value: 20
        constraints: {}
    frontend.defaultWorkflowTaskTimeout:
      - value: "10s"
        constraints: {}
    frontend.defaultWorkflowExecutionTimeout:
      - value: "24h"
        constraints: {}
    system.defaultWorkflowRetentionPeriod:
      - value: "7d"
        constraints: {}
    system.enableMetrics:
      - value: true
        constraints: {}

---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-postgresql-secret
  namespace: temporal-system
type: Opaque
stringData:
  POSTGRES_USER: temporal
  POSTGRES_PASSWORD: temporal_prod_password_change_me
  POSTGRES_DB: temporal

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgresql
  namespace: temporal-system
spec:
  selector:
    app: temporal-postgresql
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgresql
  namespace: temporal-system
spec:
  serviceName: temporal-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: temporal-postgresql
  template:
    metadata:
      labels:
        app: temporal-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: temporal-postgresql-secret
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - temporal
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - temporal
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal-system
spec:
  selector:
    app: temporal-server
    component: frontend
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: membership
      port: 6933
      targetPort: 6933
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-history
  namespace: temporal-system
spec:
  selector:
    app: temporal-server
    component: history
  ports:
    - name: grpc
      port: 7234
      targetPort: 7234
    - name: membership
      port: 6934
      targetPort: 6934
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-matching
  namespace: temporal-system
spec:
  selector:
    app: temporal-server
    component: matching
  ports:
    - name: grpc
      port: 7235
      targetPort: 7235
    - name: membership
      port: 6935
      targetPort: 6935
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-worker
  namespace: temporal-system
spec:
  selector:
    app: temporal-server
    component: worker
  ports:
    - name: grpc
      port: 7239
      targetPort: 7239
    - name: membership
      port: 6939
      targetPort: 6939
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: temporal-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-server
      component: frontend
  template:
    metadata:
      labels:
        app: temporal-server
        component: frontend
    spec:
      containers:
      - name: temporal-frontend
        image: temporalio/server:1.22.4
        args:
          - "start"
          - "--service"
          - "frontend"
        env:
        - name: DB
          value: "postgresql12"
        - name: DB_PORT
          value: "5432"
        - name: POSTGRES_SEEDS
          value: "temporal-postgresql"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: temporal-postgresql-secret
              key: POSTGRES_USER
        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: temporal-postgresql-secret
              key: POSTGRES_PASSWORD
        - name: DYNAMIC_CONFIG_FILE_PATH
          value: "/etc/temporal/config/dynamicconfig/development-sql.yaml"
        - name: SERVICES
          value: "frontend"
        - name: PROMETHEUS_ENDPOINT
          value: "0.0.0.0:9090"
        ports:
        - containerPort: 7233
          name: grpc
        - containerPort: 6933
          name: membership
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/temporal/config/dynamicconfig
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: temporal-config

