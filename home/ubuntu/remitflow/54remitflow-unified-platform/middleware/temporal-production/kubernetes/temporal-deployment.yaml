        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: temporal-postgresql-secret
              key: POSTGRES_PASSWORD
        - name: DYNAMIC_CONFIG_FILE_PATH
          value: "/etc/temporal/config/dynamicconfig/development-sql.yaml"
        - name: SERVICES
          value: "history"
        - name: PROMETHEUS_ENDPOINT
          value: "0.0.0.0:9090"
        ports:
        - containerPort: 7234
          name: grpc
        - containerPort: 6934
          name: membership
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/temporal/config/dynamicconfig
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          tcpSocket:
            port: 7234
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 7234
          initialDelaySeconds: 10
