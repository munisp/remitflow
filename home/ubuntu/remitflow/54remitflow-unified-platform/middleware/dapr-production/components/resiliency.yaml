apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: remittance-resiliency
  namespace: remittance-platform
spec:
  policies:
    retries:
      DefaultRetryPolicy:
        policy: constant
        duration: 1s
        maxRetries: 3
      
      AggressiveRetryPolicy:
        policy: exponential
        maxInterval: 60s
        maxRetries: 10
    
    timeouts:
      DefaultTimeout: 5s
      LongTimeout: 30s
    
    circuitBreakers:
      DefaultCircuitBreaker:
        maxRequests: 5
        interval: 10s
        timeout: 30s
        trip: consecutiveFailures > 3
      
      AggressiveCircuitBreaker:
        maxRequests: 3
        interval: 5s
        timeout: 15s
        trip: consecutiveFailures > 2

  targets:
    apps:
      payment-service:
        retry: AggressiveRetryPolicy
        circuitBreaker: AggressiveCircuitBreaker
        timeout: LongTimeout
      
      fraud-detection:
        retry: DefaultRetryPolicy
        circuitBreaker: DefaultCircuitBreaker
        timeout: DefaultTimeout
      
      user-service:
        retry: DefaultRetryPolicy
        circuitBreaker: DefaultCircuitBreaker
        timeout: DefaultTimeout
    
    components:
      statestore:
        outbound:
          retry: DefaultRetryPolicy
          circuitBreaker: DefaultCircuitBreaker
      
      pubsub:
        outbound:
          retry: AggressiveRetryPolicy
          circuitBreaker: AggressiveCircuitBreaker
      
      tigerbeetle-binding:
        outbound:
          retry: AggressiveRetryPolicy
          circuitBreaker: AggressiveCircuitBreaker
          timeout: LongTimeout

