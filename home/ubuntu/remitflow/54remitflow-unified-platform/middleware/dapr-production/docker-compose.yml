version: '3.8'

services:
  # Dapr placement service
  placement:
    image: "daprio/dapr:1.12.0"
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"
    networks:
      - dapr-network

  # Redis for state store
  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    networks:
      - dapr-network
    volumes:
      - redis-data:/data

  # Zipkin for tracing
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - dapr-network

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ID=payment-service
      - APP_PORT=5000
    ports:
      - "5000:5000"
      - "50001:50001"  # Dapr HTTP
      - "50002:50002"  # Dapr gRPC
    depends_on:
      - placement
      - redis
    networks:
      - dapr-network
    volumes:
      - ./components:/components
      - ./config:/config

  # Payment Service Dapr Sidecar
  payment-service-dapr:
    image: "daprio/daprd:1.12.0"
    command: [
      "./daprd",
      "-app-id", "payment-service",
      "-app-port", "5000",
      "-dapr-http-port", "50001",
      "-dapr-grpc-port", "50002",
      "-placement-host-address", "placement:50006",
      "-components-path", "/components",
      "-config", "/config/dapr-config.yaml"
    ]
    depends_on:
      - payment-service
      - placement
    network_mode: "service:payment-service"
    volumes:
      - ./components:/components
      - ./config:/config

  # Fraud Detection Service
  fraud-detection:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ID=fraud-detection
      - APP_PORT=5001
    ports:
      - "5001:5001"
      - "50003:50003"  # Dapr HTTP
      - "50004:50004"  # Dapr gRPC
    depends_on:
      - placement
      - redis
    networks:
      - dapr-network
    volumes:
      - ./components:/components
      - ./config:/config

  # Fraud Detection Dapr Sidecar
  fraud-detection-dapr:
    image: "daprio/daprd:1.12.0"
    command: [
      "./daprd",
      "-app-id", "fraud-detection",
      "-app-port", "5001",
      "-dapr-http-port", "50003",
      "-dapr-grpc-port", "50004",
      "-placement-host-address", "placement:50006",
      "-components-path", "/components",
      "-config", "/config/dapr-config.yaml"
    ]
    depends_on:
      - fraud-detection
      - placement
    network_mode: "service:fraud-detection"
    volumes:
      - ./components:/components
      - ./config:/config

  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ID=user-service
      - APP_PORT=5002
    ports:
      - "5002:5002"
      - "50005:50005"  # Dapr HTTP
      - "50006:50006"  # Dapr gRPC
    depends_on:
      - placement
      - redis
    networks:
      - dapr-network
    volumes:
      - ./components:/components
      - ./config:/config

  # User Service Dapr Sidecar
  user-service-dapr:
    image: "daprio/daprd:1.12.0"
    command: [
      "./daprd",
      "-app-id", "user-service",
      "-app-port", "5002",
      "-dapr-http-port", "50005",
      "-dapr-grpc-port", "50006",
      "-placement-host-address", "placement:50006",
      "-components-path", "/components",
      "-config", "/config/dapr-config.yaml"
    ]
    depends_on:
      - user-service
      - placement
    network_mode: "service:user-service"
    volumes:
      - ./components:/components
      - ./config:/config

networks:
  dapr-network:
    driver: bridge

volumes:
  redis-data:

