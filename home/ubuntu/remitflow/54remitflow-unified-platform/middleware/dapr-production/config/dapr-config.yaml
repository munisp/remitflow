apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: remittance-platform
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin:9411/api/v2/spans"
  
  metric:
    enabled: true
  
  metrics:
    enabled: true
    rules:
    - name: payment_processing
      labels:
      - name: app_id
        value: payment-service
      - name: method
        value: POST
    - name: fraud_detection
      labels:
      - name: app_id
        value: fraud-detection
  
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  
  accessControl:
    defaultAction: deny
    trustDomain: "remittance-platform"
    policies:
    - appId: payment-service
      defaultAction: allow
      trustDomain: "remittance-platform"
      namespace: "remittance-platform"
      operations:
      - name: /transfer
        httpVerb: ['POST']
        action: allow
      - name: /balance
        httpVerb: ['GET']
        action: allow
    
    - appId: fraud-detection
      defaultAction: allow
      trustDomain: "remittance-platform"
      namespace: "remittance-platform"
      operations:
      - name: /analyze
        httpVerb: ['POST']
        action: allow
    
    - appId: user-service
      defaultAction: allow
      trustDomain: "remittance-platform"
      namespace: "remittance-platform"
      operations:
      - name: /users
        httpVerb: ['GET', 'POST', 'PUT']
        action: allow
  
  features:
  - name: ServiceInvocation
    enabled: true
  - name: ActorStateStore
    enabled: true
  - name: PubSub
    enabled: true
  
  nameResolution:
    component: "kubernetes"
    version: "v1"
    configuration:
      clusterDomain: "cluster.local"

