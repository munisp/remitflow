version: '3.8'

services:
  # PostgreSQL database for Permify
  permify-postgres:
    image: postgres:15-alpine
    container_name: permify-postgres
    environment:
      POSTGRES_DB: permify
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: ${PERMIFY_POSTGRES_PASSWORD:-permify_secure_password_change_in_production}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - permify-postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    networks:
      - permify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permify"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Permify authorization server
  permify:
    image: ghcr.io/permify/permify:latest
    container_name: permify-server
    depends_on:
      permify-postgres:
        condition: service_healthy
    environment:
      # Server configuration
      PERMIFY_SERVER_HTTP_ENABLED: "true"
      PERMIFY_SERVER_HTTP_PORT: "3476"
      PERMIFY_SERVER_GRPC_PORT: "3478"
      
      # Database configuration
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgresql://permify:${PERMIFY_POSTGRES_PASSWORD:-permify_secure_password_change_in_production}@permify-postgres:5432/permify?sslmode=disable
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
      PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: 20
      PERMIFY_DATABASE_MAX_IDLE_CONNECTIONS: 5
      PERMIFY_DATABASE_MAX_CONNECTION_LIFETIME: 300s
      PERMIFY_DATABASE_MAX_CONNECTION_IDLE_TIME: 60s
      
      # Logging
      PERMIFY_LOG_LEVEL: info
      
      # Authn (Authentication)
      PERMIFY_AUTHN_ENABLED: "true"
      PERMIFY_AUTHN_METHOD: preshared
      PERMIFY_AUTHN_PRESHARED_KEYS: ${PERMIFY_API_KEY:-permify_api_key_change_in_production}
      
      # Profiler
      PERMIFY_PROFILER_ENABLED: "true"
      PERMIFY_PROFILER_PORT: "6060"
      
      # Meter (Metrics)
      PERMIFY_METER_ENABLED: "true"
      PERMIFY_METER_EXPORTER: prometheus
      PERMIFY_METER_ENDPOINT: ":9090"
      
      # Tracer
      PERMIFY_TRACER_ENABLED: "true"
      PERMIFY_TRACER_EXPORTER: otlp
      PERMIFY_TRACER_ENDPOINT: jaeger:4318
      PERMIFY_TRACER_INSECURE: "true"
      
      # Service
      PERMIFY_SERVICE_CIRCUIT_BREAKER: "true"
      PERMIFY_SERVICE_WATCH_ENABLED: "true"
      PERMIFY_SERVICE_SCHEMA_CACHE_ENABLED: "true"
      PERMIFY_SERVICE_PERMISSION_CACHE_ENABLED: "true"
      
    ports:
      - "3476:3476"  # HTTP API
      - "3478:3478"  # gRPC API
      - "9090:9090"  # Prometheus metrics
      - "6060:6060"  # Profiler
    networks:
      - permify-network
    volumes:
      - ../schemas:/etc/permify/schemas:ro
      - ../config:/etc/permify/config:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3476/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: permify-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP receiver
      - "4317:4317"    # OTLP gRPC receiver
    networks:
      - permify-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: permify-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"  # Prometheus UI (using 9091 to avoid conflict)
    networks:
      - permify-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: permify-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_change_in_production}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ../monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"  # Grafana UI (using 3002 to avoid conflict)
    networks:
      - permify-network
    restart: unless-stopped

volumes:
  permify-postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  permify-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

