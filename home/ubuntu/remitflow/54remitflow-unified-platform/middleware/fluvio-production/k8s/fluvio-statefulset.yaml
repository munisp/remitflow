apiVersion: v1
kind: Namespace
metadata:
  name: fluvio-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluvio
  namespace: fluvio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluvio
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluvio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluvio
subjects:
  - kind: ServiceAccount
    name: fluvio
    namespace: fluvio-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluvio-config
  namespace: fluvio-system
data:
  fluvio.yaml: |
    cluster_url: "fluvio-sc:9003"
    profile: "kubernetes"
    producer:
      batch_size: 100
      flush_interval: 1.0
      max_retries: 3
    consumer:
      group_id: "remittance-group"
      auto_commit: true
      max_retries: 3
    topics:
      payment-events:
        partitions: 3
        replication: 2
        retention_time: "7d"
      transaction-events:
        partitions: 3
        replication: 2
        retention_time: "30d"
      audit-events:
        partitions: 2
        replication: 2
        retention_time: "90d"
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc
  namespace: fluvio-system
  labels:
    app: fluvio-sc
spec:
  type: ClusterIP
  ports:
    - name: sc
      port: 9003
      targetPort: 9003
    - name: public
      port: 9005
      targetPort: 9005
  selector:
    app: fluvio-sc
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc-public
  namespace: fluvio-system
  labels:
    app: fluvio-sc
spec:
  type: LoadBalancer
  ports:
    - name: sc
      port: 9003
      targetPort: 9003
    - name: public
      port: 9005
      targetPort: 9005
  selector:
    app: fluvio-sc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-sc
  namespace: fluvio-system
  labels:
    app: fluvio-sc
spec:
  serviceName: fluvio-sc
  replicas: 1
  selector:
    matchLabels:
      app: fluvio-sc
  template:
    metadata:
      labels:
        app: fluvio-sc
    spec:
      serviceAccountName: fluvio
      containers:
        - name: fluvio-sc
          image: infinyon/fluvio:latest
          command: ["fluvio", "cluster", "start", "--sc"]
          ports:
            - name: sc
              containerPort: 9003
            - name: public
              containerPort: 9005
          env:
            - name: RUST_LOG
              value: "info"
            - name: FLUVIO_SC_PRIVATE_HOST
              value: "fluvio-sc"
            - name: FLUVIO_SC_PUBLIC_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FLUVIO_SC_PORT
              value: "9003"
          volumeMounts:
            - name: fluvio-sc-data
              mountPath: /home/fluvio/.fluvio
            - name: config
              mountPath: /etc/fluvio
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            exec:
              command: ["fluvio", "version"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["fluvio", "version"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: fluvio-config
  volumeClaimTemplates:
    - metadata:
        name: fluvio-sc-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-spu
  namespace: fluvio-system
  labels:
    app: fluvio-spu
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: spu
      port: 9010
      targetPort: 9010
  selector:
    app: fluvio-spu
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-spu
  namespace: fluvio-system
  labels:
    app: fluvio-spu
spec:
  serviceName: fluvio-spu
  replicas: 3
  selector:
    matchLabels:
      app: fluvio-spu
  template:
    metadata:
      labels:
        app: fluvio-spu
    spec:
      serviceAccountName: fluvio
      containers:
        - name: fluvio-spu
          image: infinyon/fluvio:latest
          command:
            - sh
            - -c
            - |
              SPU_ID=$(echo $HOSTNAME | sed 's/.*-//')
              SPU_PORT=$((9010 + SPU_ID))
              fluvio cluster start --spu --spu-id $SPU_ID
          ports:
            - name: spu
              containerPort: 9010
          env:
            - name: RUST_LOG
              value: "info"
            - name: FLUVIO_SPU_PRIVATE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FLUVIO_SPU_PUBLIC_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FLUVIO_SPU_PORT
              value: "9010"
            - name: FLUVIO_SC_HOST
              value: "fluvio-sc"
            - name: FLUVIO_SC_PORT
              value: "9003"
          volumeMounts:
            - name: fluvio-spu-data
              mountPath: /home/fluvio/.fluvio
            - name: config
              mountPath: /etc/fluvio
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          livenessProbe:
            exec:
              command: ["fluvio", "version"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["fluvio", "version"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: fluvio-config
  volumeClaimTemplates:
    - metadata:
        name: fluvio-spu-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-producer-metrics
  namespace: fluvio-system
  labels:
    app: fluvio-producer
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
  selector:
    app: fluvio-producer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-producer
  namespace: fluvio-system
  labels:
    app: fluvio-producer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluvio-producer
  template:
    metadata:
      labels:
        app: fluvio-producer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: fluvio
      containers:
        - name: fluvio-producer
          image: nigerian-remittance/fluvio-producer:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9091
          env:
            - name: FLUVIO_CLUSTER_URL
              value: "fluvio-sc:9003"
            - name: FLUVIO_PROFILE
              value: "kubernetes"
            - name: FLUVIO_PRODUCER_BATCH_SIZE
              value: "100"
            - name: FLUVIO_PRODUCER_FLUSH_INTERVAL
              value: "1.0"
            - name: FLUVIO_METRICS_ENABLED
              value: "true"
            - name: FLUVIO_METRICS_PORT
              value: "9091"
          volumeMounts:
            - name: config
              mountPath: /etc/fluvio
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: fluvio-config
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-consumer-metrics
  namespace: fluvio-system
  labels:
    app: fluvio-consumer
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9092
      targetPort: 9092
  selector:
    app: fluvio-consumer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-consumer
  namespace: fluvio-system
  labels:
    app: fluvio-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluvio-consumer
  template:
    metadata:
      labels:
        app: fluvio-consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: fluvio
      containers:
        - name: fluvio-consumer
          image: nigerian-remittance/fluvio-consumer:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9092
          env:
            - name: FLUVIO_CLUSTER_URL
              value: "fluvio-sc:9003"
            - name: FLUVIO_PROFILE
              value: "kubernetes"
            - name: FLUVIO_CONSUMER_GROUP_ID
              value: "remittance-group"
            - name: FLUVIO_CONSUMER_AUTO_COMMIT
              value: "true"
            - name: FLUVIO_METRICS_ENABLED
              value: "true"
            - name: FLUVIO_METRICS_PORT
              value: "9092"
          volumeMounts:
            - name: config
              mountPath: /etc/fluvio
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: fluvio-config
