groups:
- name: etcd_alerts
  interval: 30s
  rules:
  
  # Critical Alerts
  - alert: EtcdClusterDown
    expr: up{job="etcd"} == 0
    for: 1m
    labels:
      severity: critical
      component: etcd
    annotations:
      summary: "etcd cluster is down"
      description: "etcd instance {{ $labels.instance }} is down for more than 1 minute."
      
  - alert: EtcdInsufficientMembers
    expr: count(up{job="etcd"} == 1) < 2
    for: 3m
    labels:
      severity: critical
      component: etcd
    annotations:
      summary: "etcd cluster has insufficient members"
      description: "etcd cluster has only {{ $value }} members available. Minimum 2 required for quorum."
      
  - alert: EtcdNoLeader
    expr: etcd_server_has_leader{job="etcd"} == 0
    for: 1m
    labels:
      severity: critical
      component: etcd
    annotations:
      summary: "etcd cluster has no leader"
      description: "etcd cluster on {{ $labels.instance }} has no leader for more than 1 minute."
      
  - alert: EtcdHighNumberOfLeaderChanges
    expr: rate(etcd_server_leader_changes_seen_total{job="etcd"}[15m]) > 3
    for: 5m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd cluster has high number of leader changes"
      description: "etcd instance {{ $labels.instance }} has seen {{ $value }} leader changes in the last 15 minutes."
      
  # Performance Alerts
  - alert: EtcdHighFsyncDurations
    expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[5m])) > 0.5
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd has high fsync durations"
      description: "etcd instance {{ $labels.instance }} fync durations are high ({{ $value }}s 99th percentile over 5m)."
      
  - alert: EtcdHighCommitDurations
    expr: histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket{job="etcd"}[5m])) > 0.25
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd has high commit durations"
      description: "etcd instance {{ $labels.instance }} commit durations are high ({{ $value }}s 99th percentile over 5m)."
      
  - alert: EtcdHighNumberOfFailedGRPCRequests
    expr: rate(grpc_server_handled_total{job="etcd",grpc_code!="OK"}[5m]) > 0.01
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd has high number of failed gRPC requests"
      description: "etcd instance {{ $labels.instance }} has {{ $value }} failed gRPC requests per second."
      
  - alert: EtcdGRPCRequestsSlow
    expr: histogram_quantile(0.99, rate(grpc_server_handling_seconds_bucket{job="etcd",grpc_type="unary"}[5m])) > 0.15
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd gRPC requests are slow"
      description: "etcd instance {{ $labels.instance }} gRPC requests are slow ({{ $value }}s 99th percentile over 5m)."
      
  # Storage Alerts
  - alert: EtcdMemberCommunicationSlow
    expr: histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket{job="etcd"}[5m])) > 0.15
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd member communication is slow"
      description: "etcd instance {{ $labels.instance }} member communication is slow ({{ $value }}s 99th percentile over 5m)."
      
  - alert: EtcdHighNumberOfFailedProposals
    expr: rate(etcd_server_proposals_failed_total{job="etcd"}[15m]) > 5
    for: 15m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd has high number of failed proposals"
      description: "etcd instance {{ $labels.instance }} has {{ $value }} failed proposals per second."
      
  - alert: EtcdDatabaseQuotaLowSpace
    expr: (etcd_mvcc_db_total_size_in_bytes{job="etcd"} / etcd_server_quota_backend_bytes{job="etcd"}) > 0.80
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd database quota is running low"
      description: "etcd instance {{ $labels.instance }} database size is {{ $value | humanizePercentage }} of the quota."
      
  - alert: EtcdDatabaseQuotaFullSpace
    expr: (etcd_mvcc_db_total_size_in_bytes{job="etcd"} / etcd_server_quota_backend_bytes{job="etcd"}) > 0.95
    for: 5m
    labels:
      severity: critical
      component: etcd
    annotations:
      summary: "etcd database quota is almost full"
      description: "etcd instance {{ $labels.instance }} database size is {{ $value | humanizePercentage }} of the quota."
      
  - alert: EtcdExcessiveDatabaseGrowth
    expr: predict_linear(etcd_mvcc_db_total_size_in_bytes{job="etcd"}[4h], 4*60*60) > etcd_server_quota_backend_bytes{job="etcd"}
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd database is growing too fast"
      description: "etcd instance {{ $labels.instance }} database will exceed quota in 4 hours at current growth rate."
      
  # Backup Alerts
  - alert: EtcdBackupFailed
    expr: time() - etcd_backup_last_success_timestamp_seconds{job="etcd-backup"} > 86400
    for: 1h
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd backup has failed"
      description: "etcd backup has not succeeded in the last 24 hours."
      
  - alert: EtcdBackupTooOld
    expr: time() - etcd_backup_last_success_timestamp_seconds{job="etcd-backup"} > 172800
    for: 1h
    labels:
      severity: critical
      component: etcd
    annotations:
      summary: "etcd backup is too old"
      description: "etcd backup has not succeeded in the last 48 hours."
      
  # Certificate Alerts
  - alert: EtcdCertificateExpiringSoon
    expr: (etcd_server_certificate_expiration_seconds{job="etcd"} - time()) / 86400 < 30
    for: 1h
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd TLS certificate expiring soon"
      description: "etcd instance {{ $labels.instance }} TLS certificate will expire in {{ $value }} days."
      
  - alert: EtcdCertificateExpiringVerySoon
    expr: (etcd_server_certificate_expiration_seconds{job="etcd"} - time()) / 86400 < 7
    for: 1h
    labels:
      severity: critical
      component: etcd
    annotations:
      summary: "etcd TLS certificate expiring very soon"
      description: "etcd instance {{ $labels.instance }} TLS certificate will expire in {{ $value }} days."
      
  # Cluster Health Alerts
  - alert: EtcdClusterVersionMismatch
    expr: count(count by (version) (etcd_server_version{job="etcd"})) > 1
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd cluster has version mismatch"
      description: "etcd cluster has multiple versions running."
      
  - alert: EtcdHighMemoryUsage
    expr: process_resident_memory_bytes{job="etcd"} > 2147483648
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd has high memory usage"
      description: "etcd instance {{ $labels.instance }} is using {{ $value | humanize }}B of memory."
      
  - alert: EtcdHighCPUUsage
    expr: rate(process_cpu_seconds_total{job="etcd"}[5m]) > 0.8
    for: 10m
    labels:
      severity: warning
      component: etcd
    annotations:
      summary: "etcd has high CPU usage"
      description: "etcd instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} CPU."

