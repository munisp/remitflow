#
# APISIX Production Configuration
# Nigerian Remittance Platform
#

apisix:
  node_listen:
    - 9080              # HTTP port
  enable_admin: true
  enable_admin_cors: true
  admin_key:
    - name: "admin"
      key: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
      role: admin
    - name: "viewer"
      key: ${APISIX_VIEWER_KEY:-4054f7cf07e344346cd3f287985e76a2}
      role: viewer
  
  # Enable IPv6
  enable_ipv6: false
  
  # Enable control API
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  
  # etcd configuration
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30
    
  # Admin API
  admin:
    admin_listen:
      ip: "0.0.0.0"
      port: 9180
    https_admin: false
    admin_api_version: v3

# Plugin configuration
plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091
    export_uri: /apisix/prometheus/metrics
    metric_prefix: apisix_
    enable_export_server: true
  
  zipkin:
    endpoint: "http://jaeger:9411/api/v2/spans"
    sample_ratio: 1
    service_name: "APISIX-Gateway"
  
  jwt-auth:
    exp: 86400  # 24 hours
  
  limit-req:
    nodelay: false
  
  limit-count:
    redis_timeout: 1000

# Nginx configuration
nginx_config:
  error_log: "/usr/local/apisix/logs/error.log"
  error_log_level: "warn"
  
  http:
    access_log: "/usr/local/apisix/logs/access.log"
    access_log_format: |
      $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time $upstream_response_time $upstream_addr $upstream_status
    
    # Performance tuning
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    send_timeout: 10s
    
    # Buffer sizes
    client_max_body_size: 10m
    client_body_buffer_size: 128k
    
    # Upstream settings
    upstream:
      keepalive: 320
      keepalive_requests: 1000
      keepalive_timeout: 60s

# Plugins to enable
plugins:
  # Authentication
  - jwt-auth
  - key-auth
  - basic-auth
  - openid-connect
  
  # Security
  - cors
  - csrf
  - ip-restriction
  - ua-restriction
  - referer-restriction
  
  # Traffic control
  - limit-req
  - limit-count
  - limit-conn
  
  # Transformation
  - request-validation
  - response-rewrite
  - proxy-rewrite
  - grpc-transcode
  
  # Observability
  - prometheus
  - zipkin
  - http-logger
  - error-log-logger
  
  # Caching
  - proxy-cache
  
  # Load balancing
  - traffic-split
  
  # Other
  - redirect
  - echo
  - serverless-pre-function
  - serverless-post-function

stream_plugins: []

