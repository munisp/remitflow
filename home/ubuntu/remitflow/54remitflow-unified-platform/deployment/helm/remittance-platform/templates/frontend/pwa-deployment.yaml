apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remittance-platform.fullname" . }}-pwa
  labels:
    {{- include "remittance-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: pwa
spec:
  replicas: {{ .Values.pwa.replicaCount }}
  selector:
    matchLabels:
      {{- include "remittance-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pwa
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "remittance-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pwa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: pwa
          image: "{{ .Values.pwa.image.repository }}:{{ .Values.pwa.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.pwa.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.pwa.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
