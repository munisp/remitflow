name: nigerian_remittance_flutter
description: Nigerian Remittance Flutter App
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^13.0.0
  
  # Biometric Authentication
  local_auth: ^2.1.8
  local_auth_android: ^1.0.38
  local_auth_ios: ^1.1.6
  
  # Card Scanning
  google_ml_kit: ^0.16.3
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  
  # Payments
  pay: ^2.0.0
  stripe_payment: ^1.1.5
  
  # Offline & Storage
  sqflite: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  
  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
