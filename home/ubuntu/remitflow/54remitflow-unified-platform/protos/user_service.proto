
syntax = "proto3";

package user_service;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// The user service definition.
service UserService {
  // Creates a new user profile.
  rpc CreateUserProfile(CreateUserProfileRequest) returns (UserProfileResponse) {}
  // Retrieves a user profile by their ID.
  rpc GetUserProfile(GetUserProfileRequest) returns (UserProfileResponse) {}
  // Updates an existing user profile.
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UserProfileResponse) {}
  // Deletes a user profile.
  rpc DeleteUserProfile(DeleteUserProfileRequest) returns (google.protobuf.Empty) {}
  // Lists user profiles with pagination.
  rpc ListUserProfiles(ListUserProfilesRequest) returns (ListUserProfilesResponse) {}
  // Retrieves statistics about user profiles.
  rpc GetUserStats(google.protobuf.Empty) returns (UserStatsResponse) {}
}

// The request message for creating a user profile.
message CreateUserProfileRequest {
  string email = 1;
  optional string phone = 2;
  optional string full_name = 3;
  optional string date_of_birth = 4;
  optional string country = 5;
  optional string address = 6;
  optional int32 kyc_level = 7;
  optional string status = 8;
  optional string preferred_currency = 9;
  optional string language = 10;
}

// The request message for retrieving a user profile.
message GetUserProfileRequest {
  string user_id = 1;
}

// The request message for updating a user profile.
message UpdateUserProfileRequest {
  string user_id = 1;
  optional string email = 2;
  optional string phone = 3;
  optional string full_name = 4;
  optional string date_of_birth = 5;
  optional string country = 6;
  optional string address = 7;
  optional int32 kyc_level = 8;
  optional string status = 9;
  optional string preferred_currency = 10;
  optional string language = 11;
}

// The request message for deleting a user profile.
message DeleteUserProfileRequest {
  string user_id = 1;
}

// The request message for listing user profiles.
message ListUserProfilesRequest {
  int32 skip = 1;
  int32 limit = 2;
}

// The response message containing a user profile.
message UserProfileResponse {
  string id = 1;
  string email = 2;
  string phone = 3;
  string full_name = 4;
  string date_of_birth = 5;
  string country = 6;
  string address = 7;
  int32 kyc_level = 8;
  string status = 9;
  string preferred_currency = 10;
  string language = 11;
  google.protobuf.Timestamp last_login_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// The response message for listing user profiles.
message ListUserProfilesResponse {
  int64 total = 1;
  repeated UserProfileResponse items = 2;
  int32 skip = 3;
  int32 limit = 4;
}

// The response message for user statistics.
message UserStatsResponse {
  int64 total = 1;
  int64 today = 2;
}
