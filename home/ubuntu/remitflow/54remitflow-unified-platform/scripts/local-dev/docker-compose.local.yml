# Local Development Environment
# One-command bring-up: docker-compose -f docker-compose.local.yml up -d

version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: remittance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multibank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: remittance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka (using Redpanda for lighter footprint)
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: remittance-kafka
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "8081:8081"  # Schema Registry
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MinIO (S3-compatible storage for local dev)
  minio:
    image: minio/minio:latest
    container_name: remittance-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: remittance-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Temporal
  temporal:
    image: temporalio/auto-setup:latest
    container_name: remittance-temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:latest
    container_name: remittance-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  # APISIX Gateway
  apisix:
    image: apache/apisix:latest
    container_name: remittance-apisix
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9180:9180"  # Admin API
    depends_on:
      - redis

  # Backend API (Python)
  backend-api:
    build:
      context: ../../backend/python-services
      dockerfile: Dockerfile.dev
    container_name: remittance-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/multibank
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      KEYCLOAK_URL: http://keycloak:8080
      TEMPORAL_HOST: temporal:7233
    ports:
      - "8000:8000"
    volumes:
      - ../../backend/python-services:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (React)
  frontend:
    build:
      context: ../../frontend/management-pwa
      dockerfile: Dockerfile.dev
    container_name: remittance-frontend
    environment:
      REACT_APP_API_URL: http://localhost:9080/api
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend/management-pwa:/app
      - /app/node_modules
    command: npm start

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: remittance-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: remittance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  # Seed data loader
  seed-data:
    build:
      context: .
      dockerfile: Dockerfile.seed
    container_name: remittance-seed
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/multibank
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    command: python seed_data.py

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
  grafana_data:
  prometheus_data:

networks:
  default:
    name: remittance-network
