# Permify Authorization Service Deployment
# Production-grade fine-grained authorization for the remittance platform
apiVersion: v1
kind: Namespace
metadata:
  name: permify
  labels:
    app.kubernetes.io/name: permify
    app.kubernetes.io/component: authorization

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: permify
data:
  config.yaml: |
    server:
      http:
        enabled: true
        port: 3476
      grpc:
        enabled: true
        port: 3478
      
    logger:
      level: info
      output: stdout
      
    profiler:
      enabled: false
      
    authn:
      enabled: true
      method: preshared
      preshared:
        keys:
          - ${PERMIFY_API_KEY}
    
    tracer:
      enabled: true
      exporter: otlp
      endpoint: ${OTEL_COLLECTOR_HOST}:4317
      insecure: true
    
    meter:
      enabled: true
      exporter: otlp
      endpoint: ${OTEL_COLLECTOR_HOST}:4317
      insecure: true
    
    service:
      circuit_breaker: true
      watch:
        enabled: true
      schema:
        cache:
          number_of_counters: 1000
          max_cost: 10MiB
      permission:
        bulk_limit: 100
        concurrency_limit: 100
      relationship:
        bulk_limit: 100
        concurrency_limit: 100
    
    database:
      engine: postgres
      uri: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/permify?sslmode=require
      auto_migrate: true
      max_open_connections: 20
      max_idle_connections: 5
      max_connection_lifetime: 300s
      max_connection_idle_time: 60s
      garbage_collection:
        enabled: true
        interval: 3m
        window: 720h
        timeout: 5m

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: permify
  labels:
    app.kubernetes.io/name: permify
    app.kubernetes.io/component: authorization
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: permify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: permify
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3476"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - permify
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: permify
          image: ghcr.io/permify/permify:v0.9.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/permify/config.yaml
          ports:
            - name: http
              containerPort: 3476
              protocol: TCP
            - name: grpc
              containerPort: 3478
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/permify
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: permify-secrets
                  key: postgres-host
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: permify-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: permify-secrets
                  key: postgres-password
            - name: PERMIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: permify-secrets
                  key: api-key
            - name: OTEL_COLLECTOR_HOST
              value: "otel-collector.monitoring"
      volumes:
        - name: config
          configMap:
            name: permify-config

---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: permify
  labels:
    app.kubernetes.io/name: permify
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3476
      targetPort: 3476
      protocol: TCP
    - name: grpc
      port: 3478
      targetPort: 3478
      protocol: TCP
  selector:
    app.kubernetes.io/name: permify

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permify-hpa
  namespace: permify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: permify
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-pdb
  namespace: permify
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: permify

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permify-network-policy
  namespace: permify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: permify
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: remittance
      ports:
        - protocol: TCP
          port: 3476
        - protocol: TCP
          port: 3478
    - from:
        - namespaceSelector:
            matchLabels:
              name: apisix
      ports:
        - protocol: TCP
          port: 3476
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: permify
  namespace: permify

---
# Secret Template (values should be provided via external secrets manager)
apiVersion: v1
kind: Secret
metadata:
  name: permify-secrets
  namespace: permify
type: Opaque
stringData:
  postgres-host: "${POSTGRES_HOST}"
  postgres-user: "${POSTGRES_USER}"
  postgres-password: "${POSTGRES_PASSWORD}"
  api-key: "${PERMIFY_API_KEY}"
