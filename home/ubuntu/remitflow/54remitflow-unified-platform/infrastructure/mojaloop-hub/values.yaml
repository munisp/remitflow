# Mojaloop Hub Helm Values
# Local deployment with PostgreSQL (instead of MySQL) and HA configuration
# Compatible with Mojaloop v15.x+ which supports PostgreSQL via Knex
#
# IMPORTANT: This configuration uses PostgreSQL instead of the default MySQL.
# Mojaloop's central-ledger and other services use Knex.js which supports
# multiple database dialects including PostgreSQL.
#
# Reference: https://github.com/mojaloop/helm

global:
  config:
    # Database configuration - PostgreSQL instead of MySQL
    db:
      type: postgres
      host: ${MOJALOOP_DB_HOST}
      port: 5432
      database: mojaloop_hub
      user: ${MOJALOOP_DB_USER}
      password: ${MOJALOOP_DB_PASSWORD}
      
      # Connection pool settings for HA
      pool:
        min: 2
        max: 20
        acquireTimeoutMillis: 30000
        createTimeoutMillis: 30000
        destroyTimeoutMillis: 5000
        idleTimeoutMillis: 30000
        reapIntervalMillis: 1000
        createRetryIntervalMillis: 200
      
      # SSL configuration for RDS
      ssl:
        enabled: true
        rejectUnauthorized: true
        ca: /etc/ssl/certs/rds-ca-bundle.pem
    
    # Kafka configuration (using MSK)
    kafka:
      host: ${KAFKA_BOOTSTRAP_SERVERS}
      
    # Redis configuration (using ElastiCache)
    redis:
      host: ${REDIS_HOST}
      port: 6379

  # Image configuration
  image:
    registry: mojaloop
    pullPolicy: IfNotPresent

# Central Ledger - Core hub service
central-ledger:
  enabled: true
  replicaCount: 2
  
  config:
    db:
      type: postgres
      host: ${MOJALOOP_DB_HOST}
      port: 5432
      database: mojaloop_central_ledger
      user: ${MOJALOOP_DB_USER}
      password: ${MOJALOOP_DB_PASSWORD}
      pool:
        min: 2
        max: 30
    
    # Kafka topics
    kafka:
      producer:
        topic:
          transferPrepare: topic-transfer-prepare
          transferFulfil: topic-transfer-fulfil
          transferPosition: topic-transfer-position
          notification: topic-notification-event
      consumer:
        topic:
          transferPrepare: topic-transfer-prepare
          transferFulfil: topic-transfer-fulfil
          transferPosition: topic-transfer-position
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  
  # Pod disruption budget for HA
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  
  # Horizontal pod autoscaler
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ML API Adapter - FSPIOP API gateway
ml-api-adapter:
  enabled: true
  replicaCount: 2
  
  config:
    port: 3000
    
    kafka:
      producer:
        topic:
          transferPrepare: topic-transfer-prepare
          transferFulfil: topic-transfer-fulfil
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Account Lookup Service - Party resolution
account-lookup-service:
  enabled: true
  replicaCount: 2
  
  config:
    db:
      type: postgres
      host: ${MOJALOOP_DB_HOST}
      port: 5432
      database: mojaloop_als
      user: ${MOJALOOP_DB_USER}
      password: ${MOJALOOP_DB_PASSWORD}
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Quoting Service - Quote handling
quoting-service:
  enabled: true
  replicaCount: 2
  
  config:
    db:
      type: postgres
      host: ${MOJALOOP_DB_HOST}
      port: 5432
      database: mojaloop_quoting
      user: ${MOJALOOP_DB_USER}
      password: ${MOJALOOP_DB_PASSWORD}
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Transaction Requests Service - Request-to-Pay
transaction-requests-service:
  enabled: true
  replicaCount: 2
  
  config:
    db:
      type: postgres
      host: ${MOJALOOP_DB_HOST}
      port: 5432
      database: mojaloop_txn_requests
      user: ${MOJALOOP_DB_USER}
      password: ${MOJALOOP_DB_PASSWORD}
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Settlement Service - Settlement windows and positions
settlement-service:
  enabled: true
  replicaCount: 2
  
  config:
    db:
      type: postgres
      host: ${MOJALOOP_DB_HOST}
      port: 5432
      database: mojaloop_settlement
      user: ${MOJALOOP_DB_USER}
      password: ${MOJALOOP_DB_PASSWORD}
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Central Event Processor - Event handling
central-event-processor:
  enabled: true
  replicaCount: 2
  
  config:
    kafka:
      consumer:
        topic:
          notification: topic-notification-event
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Email Notifier - Notifications
email-notifier:
  enabled: false  # Disable for now, use platform's notification service

# Simulator - For testing
simulator:
  enabled: false  # Disable in production

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: mojaloop.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mojaloop-tls
      hosts:
        - mojaloop.${DOMAIN}

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: remittance-platform
        - podSelector:
            matchLabels:
              app: mojaloop-connector
