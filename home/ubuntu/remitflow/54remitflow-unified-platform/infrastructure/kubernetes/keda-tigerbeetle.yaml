apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tigerbeetle-scaler
  namespace: remittance
  labels:
    app: tigerbeetle-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: tigerbeetle-service
  pollingInterval: 5
  cooldownPeriod: 30
  idleReplicaCount: 3
  minReplicaCount: 3
  maxReplicaCount: 200
  fallback:
    failureThreshold: 3
    replicas: 10
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: tigerbeetle-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
          - type: Percent
            value: 10
            periodSeconds: 30
        scaleUp:
          stabilizationWindowSeconds: 15
          policies:
          - type: Percent
            value: 200
            periodSeconds: 10
          - type: Pods
            value: 20
            periodSeconds: 10
          selectPolicy: Max
  triggers:
  # Redis transaction queue trigger
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: tigerbeetle_transaction_queue
      listLength: "50"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Redis account creation queue
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: tigerbeetle_account_queue
      listLength: "20"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus transaction rate trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: tigerbeetle_transaction_rate
      threshold: "10000"
      query: sum(rate(tigerbeetle_transactions_processed_total[30s]))
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus CPU usage trigger (aggressive scaling for high-performance)
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: tigerbeetle_cpu_usage
      threshold: "50"
      query: avg(rate(container_cpu_usage_seconds_total{pod=~"tigerbeetle-.*"}[30s])) * 100
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus memory usage trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: tigerbeetle_memory_usage
      threshold: "70"
      query: avg(container_memory_working_set_bytes{pod=~"tigerbeetle-.*"} / container_spec_memory_limit_bytes{pod=~"tigerbeetle-.*"}) * 100
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus response time trigger (ultra-low latency requirement)
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: tigerbeetle_response_time
      threshold: "1"
      query: histogram_quantile(0.95, sum(rate(tigerbeetle_request_duration_seconds_bucket[30s])) by (le)) * 1000
    authenticationRef:
      name: prometheus-auth
  
  # Custom metrics for TigerBeetle throughput
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: tigerbeetle_throughput_utilization
      threshold: "80"
      query: (sum(rate(tigerbeetle_transactions_processed_total[1m])) / sum(tigerbeetle_max_throughput)) * 100
    authenticationRef:
      name: prometheus-auth

---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: tigerbeetle-batch-processor
  namespace: remittance
  labels:
    app: tigerbeetle-batch-processor
    component: batch-autoscaler
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app: tigerbeetle-batch-processor
      spec:
        containers:
        - name: tigerbeetle-batch-processor
          image: remittance/tigerbeetle:latest
          command: ["./tigerbeetle-core", "--batch-mode"]
          env:
          - name: BATCH_SIZE
            value: "10000"
          - name: REDIS_HOST
            value: redis.remittance.svc.cluster.local
          - name: TB_CLUSTER_ID
            value: "0"
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
        restartPolicy: Never
        backoffLimit: 2
  pollingInterval: 10
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  maxReplicaCount: 50
  scalingStrategy:
    strategy: "accurate"
  triggers:
  # Redis list trigger for batch transactions
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: tigerbeetle_batch_queue
      listLength: "1000"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus trigger for pending batch operations
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: tigerbeetle_batch_pending
      threshold: "5000"
      query: sum(tigerbeetle_batch_operations_pending)
    authenticationRef:
      name: prometheus-auth

