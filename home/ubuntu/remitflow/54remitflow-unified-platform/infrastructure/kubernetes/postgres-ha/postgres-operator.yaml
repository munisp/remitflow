# Zalando Postgres Operator for HA PostgreSQL
# This provides automatic failover, backup, and connection pooling
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-operator
---
# Operator RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-operator
  namespace: postgres-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-operator
rules:
  - apiGroups: ["acid.zalan.do"]
    resources: ["postgresqls", "postgresqls/status", "operatorconfigurations"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "secrets", "services", "persistentvolumeclaims", "pods"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-operator
subjects:
  - kind: ServiceAccount
    name: postgres-operator
    namespace: postgres-operator
---
# Operator Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-operator
  namespace: postgres-operator
data:
  # General
  enable_crd_registration: "true"
  enable_lazy_spilo_upgrade: "false"
  enable_pgversion_env_var: "true"
  enable_shm_volume: "true"
  enable_spilo_wal_path_compat: "false"
  etcd_host: ""
  kubernetes_use_configmaps: "true"
  
  # Postgres settings
  docker_image: "ghcr.io/zalando/spilo-15:3.0-p1"
  enable_master_load_balancer: "false"
  enable_replica_load_balancer: "false"
  master_dns_name_format: "{cluster}.{namespace}.svc.cluster.local"
  replica_dns_name_format: "{cluster}-repl.{namespace}.svc.cluster.local"
  
  # Connection pooler
  connection_pooler_image: "registry.opensource.zalan.do/acid/pgbouncer:master-27"
  connection_pooler_mode: "transaction"
  connection_pooler_number_of_instances: "2"
  connection_pooler_default_cpu_request: "100m"
  connection_pooler_default_memory_request: "100Mi"
  connection_pooler_default_cpu_limit: "500m"
  connection_pooler_default_memory_limit: "256Mi"
  
  # Backup settings
  logical_backup_docker_image: "registry.opensource.zalan.do/acid/logical-backup:v1.10.1"
  logical_backup_s3_bucket: "remittance-postgres-backups"
  logical_backup_s3_region: "us-east-1"
  logical_backup_schedule: "0 3 * * *"
  
  # Resource defaults
  default_cpu_request: "100m"
  default_memory_request: "256Mi"
  default_cpu_limit: "1"
  default_memory_limit: "1Gi"
  
  # Pod management
  pod_deletion_wait_timeout: "10m"
  pod_label_wait_timeout: "10m"
  pod_management_policy: "ordered_ready"
  
  # Patroni settings
  patroni_api_check_interval: "1s"
  patroni_api_check_timeout: "5s"
  
  # Teams API (disabled for self-managed)
  enable_teams_api: "false"
  
  # Logging
  api_port: "8080"
  cluster_history_entries: "1000"
  cluster_labels: "application:spilo"
  cluster_name_label: "cluster-name"
  
  # Timeouts
  resource_check_interval: "3s"
  resource_check_timeout: "10m"
  
  # Sidecars
  sidecars: |
    - name: exporter
      image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
      ports:
        - name: exporter
          containerPort: 9187
          protocol: TCP
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      env:
        - name: DATA_SOURCE_URI
          value: "127.0.0.1:5432/postgres?sslmode=disable"
        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef:
              name: postgres.mojaloop-postgres.credentials.postgresql.acid.zalan.do
              key: username
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: postgres.mojaloop-postgres.credentials.postgresql.acid.zalan.do
              key: password
---
# Operator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-operator
  namespace: postgres-operator
  labels:
    application: postgres-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: postgres-operator
  template:
    metadata:
      labels:
        name: postgres-operator
        application: postgres-operator
    spec:
      serviceAccountName: postgres-operator
      containers:
        - name: postgres-operator
          image: registry.opensource.zalan.do/acid/postgres-operator:v1.10.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
            limits:
              cpu: 500m
              memory: 500Mi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: CONFIG_MAP_NAME
              value: postgres-operator
            - name: POSTGRES_OPERATOR_CONFIGURATION_OBJECT
              value: postgresql-operator-default-configuration
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
# Operator Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-operator
  namespace: postgres-operator
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: api
  selector:
    name: postgres-operator
