apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aiml-service-scaler
  namespace: remittance
  labels:
    app: aiml-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: aiml-service
  pollingInterval: 20
  cooldownPeriod: 180
  idleReplicaCount: 1
  minReplicaCount: 1
  maxReplicaCount: 30
  fallback:
    failureThreshold: 3
    replicas: 3
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: aiml-service-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
          - type: Percent
            value: 20
            periodSeconds: 120
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 75
            periodSeconds: 30
          - type: Pods
            value: 3
            periodSeconds: 30
          selectPolicy: Max
  triggers:
  # Redis queue for document processing
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: document_processing_queue
      listLength: "5"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Redis queue for OCR processing
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: ocr_processing_queue
      listLength: "3"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus GPU utilization trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: gpu_utilization
      threshold: "70"
      query: avg(nvidia_gpu_utilization{pod=~"aiml-service-.*"})
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus CPU usage trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: aiml_cpu_usage
      threshold: "65"
      query: avg(rate(container_cpu_usage_seconds_total{pod=~"aiml-service-.*"}[2m])) * 100
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus memory usage trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: aiml_memory_usage
      threshold: "85"
      query: avg(container_memory_working_set_bytes{pod=~"aiml-service-.*"} / container_spec_memory_limit_bytes{pod=~"aiml-service-.*"}) * 100
    authenticationRef:
      name: prometheus-auth

