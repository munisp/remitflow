apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: falkor-db-scaler
  namespace: remittance
  labels:
    app: falkor-db-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: falkor-db-service
  pollingInterval: 20
  cooldownPeriod: 300
  idleReplicaCount: 1
  minReplicaCount: 1
  maxReplicaCount: 25
  fallback:
    failureThreshold: 3
    replicas: 3
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: falkor-db-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 450
          policies:
          - type: Percent
            value: 25
            periodSeconds: 150
        scaleUp:
          stabilizationWindowSeconds: 45
          policies:
          - type: Percent
            value: 80
            periodSeconds: 30
          - type: Pods
            value: 4
            periodSeconds: 30
          selectPolicy: Max
  triggers:
  # Redis queue for database operations
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: falkor_db_queue
      listLength: "8"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus database connection pool trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: falkor_db_connections
      threshold: "40"
      query: sum(falkor_db_active_connections)
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus query response time trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: falkor_db_response_time
      threshold: "200"
      query: avg(falkor_db_query_duration_ms)
    authenticationRef:
      name: prometheus-auth

