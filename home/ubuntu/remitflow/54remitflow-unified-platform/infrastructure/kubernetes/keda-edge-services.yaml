apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: connectivity-monitor-scaler
  namespace: remittance
  labels:
    app: connectivity-monitor
    component: autoscaler
spec:
  scaleTargetRef:
    name: connectivity-monitor
  pollingInterval: 30
  cooldownPeriod: 300
  idleReplicaCount: 1
  minReplicaCount: 1
  maxReplicaCount: 15
  fallback:
    failureThreshold: 3
    replicas: 3
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: connectivity-monitor-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
          - type: Percent
            value: 30
            periodSeconds: 200
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 80
            periodSeconds: 40
          - type: Pods
            value: 3
            periodSeconds: 40
          selectPolicy: Max
  triggers:
  # Redis queue for connectivity checks
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: connectivity_check_queue
      listLength: "10"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus network latency trigger
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: network_latency_ms
      threshold: "100"
      query: avg(network_latency_milliseconds)
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus connection failure rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: connection_failure_rate
      threshold: "5"
      query: (sum(rate(network_connection_failures_total[5m])) / sum(rate(network_connection_attempts_total[5m]))) * 100
    authenticationRef:
      name: prometheus-auth

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: connectivity-resilience-scaler
  namespace: remittance
  labels:
    app: connectivity-resilience
    component: autoscaler
spec:
  scaleTargetRef:
    name: connectivity-resilience
  pollingInterval: 20
  cooldownPeriod: 240
  idleReplicaCount: 2
  minReplicaCount: 2
  maxReplicaCount: 25
  fallback:
    failureThreshold: 3
    replicas: 5
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: connectivity-resilience-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 480
          policies:
          - type: Percent
            value: 25
            periodSeconds: 160
        scaleUp:
          stabilizationWindowSeconds: 40
          policies:
          - type: Percent
            value: 100
            periodSeconds: 25
          - type: Pods
            value: 5
            periodSeconds: 25
          selectPolicy: Max
  triggers:
  # Redis queue for resilience operations
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: resilience_operation_queue
      listLength: "15"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus network quality score
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: network_quality_score
      threshold: "60"
      query: 100 - avg(network_quality_percentage)
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus offline transaction queue
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: offline_transaction_count
      threshold: "20"
      query: sum(offline_transactions_pending)
    authenticationRef:
      name: prometheus-auth

