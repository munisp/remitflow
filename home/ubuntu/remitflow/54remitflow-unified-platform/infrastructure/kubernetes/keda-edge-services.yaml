apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: power-management-scaler
  namespace: remittance
  labels:
    app: power-management-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: power-management-service
  pollingInterval: 60
  cooldownPeriod: 600
  idleReplicaCount: 1
  minReplicaCount: 1
  maxReplicaCount: 8
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: power-management-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 1200
          policies:
          - type: Percent
            value: 50
            periodSeconds: 400
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
          - type: Pods
            value: 2
            periodSeconds: 60
          selectPolicy: Max
  triggers:
  # Redis queue for power management events
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: power_management_queue
      listLength: "3"
      enableTLS: "false"
    authenticationRef:
      name: redis-auth
  
  # Prometheus power events rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: power_events_rate
      threshold: "5"
      query: sum(rate(power_management_events_total[5m]))
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus battery level monitoring
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: low_battery_devices
      threshold: "20"
      query: sum(devices_with_low_battery)
    authenticationRef:
      name: prometheus-auth

