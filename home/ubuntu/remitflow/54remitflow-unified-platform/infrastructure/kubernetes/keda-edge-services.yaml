apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rural-banking-scaler
  namespace: remittance
  labels:
    app: rural-banking-service
    component: autoscaler
spec:
  scaleTargetRef:
    name: rural-banking-service
  pollingInterval: 25
  cooldownPeriod: 360
  idleReplicaCount: 1
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 3
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: rural-banking-hpa
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 720
          policies:
          - type: Percent
            value: 35
            periodSeconds: 240
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 70
            periodSeconds: 40
          - type: Pods
            value: 4
            periodSeconds: 40
          selectPolicy: Max
  triggers:
  # Redis queue for rural banking operations
  - type: redis
    metadata:
      address: redis.remittance.svc.cluster.local:6379
      listName: rural_banking_queue
