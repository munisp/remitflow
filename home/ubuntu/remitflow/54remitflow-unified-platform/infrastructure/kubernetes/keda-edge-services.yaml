    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: rural_connectivity_demand
      threshold: "40"
      query: sum(rural_area_connection_requests_per_minute)
    authenticationRef:
      name: prometheus-auth
  
  # Prometheus bandwidth utilization in rural areas
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: rural_bandwidth_utilization
      threshold: "70"
      query: avg(rural_bandwidth_utilization_percentage)
    authenticationRef:
      name: prometheus-auth

