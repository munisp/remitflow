# Kubernetes Deployments for Previously Orphan Services
# Generated to wire orphan services into the main platform flow

apiVersion: v1
kind: Namespace
metadata:
  name: remittance
  labels:
    app.kubernetes.io/name: remittance
    app.kubernetes.io/part-of: remittance-platform

---
# Commission Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commission-service
  namespace: remittance
  labels:
    app: commission-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: commission-service
  template:
    metadata:
      labels:
        app: commission-service
        tier: backend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "commission-service"
        dapr.io/app-port: "8000"
    spec:
      containers:
      - name: commission-service
        image: remittance/commission-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: connection-string
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: commission-service
  namespace: remittance
spec:
  selector:
    app: commission-service
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

