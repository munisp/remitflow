version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp-postgres
    environment:
      POSTGRES_DB: whatsapp_service
      POSTGRES_USER: whatsapp_user
      POSTGRES_PASSWORD: whatsapp_secure_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_user -d whatsapp_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache and Message Queue
  redis:
    image: redis:7-alpine
    container_name: whatsapp-redis
    command: redis-server --appendonly yes --requirepass whatsapp_redis_password_2024
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # WhatsApp Go Service
  whatsapp-service:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp-service
    container_name: whatsapp-go-service
    environment:
      # WhatsApp Business API Configuration
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      
      # Database Configuration
      DATABASE_URL: postgresql://whatsapp_user:whatsapp_secure_password_2024@postgres:5432/whatsapp_service?sslmode=disable
      
      # Redis Configuration
      REDIS_URL: redis://:whatsapp_redis_password_2024@redis:6379/0
      
      # Service Configuration
      PORT: 8080
      GIN_MODE: release
      LOG_LEVEL: info
      
      # Performance Tuning
      GOMAXPROCS: 4
      GOGC: 100
    ports:
      - "8080:8080"
    networks:
      - whatsapp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # WhatsApp Python Webhook Handler
  webhook-handler:
    build:
      context: .
      dockerfile: Dockerfile.webhook-handler
    container_name: whatsapp-webhook-handler
    environment:
      # WhatsApp Configuration
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      
      # AI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      
      # Database Configuration
      DATABASE_URL: postgresql://whatsapp_user:whatsapp_secure_password_2024@postgres:5432/whatsapp_service
      
      # Redis Configuration
      REDIS_URL: redis://:whatsapp_redis_password_2024@redis:6379/0
      
      # Service Configuration
      PORT: 8081
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    ports:
      - "8081:8081"
    networks:
      - whatsapp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Nginx Load Balancer and SSL Termination
  nginx:
    image: nginx:alpine
    container_name: whatsapp-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - whatsapp-network
    depends_on:
      - whatsapp-service
      - webhook-handler
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: whatsapp-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: whatsapp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: whatsapp_grafana_admin_2024
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - whatsapp-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # OpenSearch for Log Management
  opensearch:
    image: opensearchproject/opensearch:8.11.0
    container_name: whatsapp-opensearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Kibana for Log Visualization
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:8.11.0
    container_name: whatsapp-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: http://opensearch:9200
    ports:
      - "5601:5601"
    networks:
      - whatsapp-network
    depends_on:
      - opensearch
    restart: unless-stopped

  # Logstash for Log Processing
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: whatsapp-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config:/usr/share/logstash/config:ro
    ports:
      - "5044:5044"
      - "9600:9600"
    networks:
      - whatsapp-network
    depends_on:
      - opensearch
    restart: unless-stopped

  # Redis Commander for Redis Management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: whatsapp-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:whatsapp_redis_password_2024
    ports:
      - "8082:8081"
    networks:
      - whatsapp-network
    depends_on:
      - redis
    restart: unless-stopped

  # pgAdmin for PostgreSQL Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whatsapp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agentbanking.ng
      PGADMIN_DEFAULT_PASSWORD: whatsapp_pgadmin_admin_2024
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8083:80"
    networks:
      - whatsapp-network
    depends_on:
      - postgres
    restart: unless-stopped

  # Health Check Service
  healthcheck:
    build:
      context: .
      dockerfile: Dockerfile.healthcheck
    container_name: whatsapp-healthcheck
    environment:
      SERVICES_TO_CHECK: "whatsapp-service:8080,webhook-handler:8081,postgres:5432,redis:6379"
      CHECK_INTERVAL: 30
    networks:
      - whatsapp-network
    depends_on:
      - whatsapp-service
      - webhook-handler
      - postgres
      - redis
    restart: unless-stopped

  # Backup Service
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: whatsapp-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: whatsapp_service
      POSTGRES_USER: whatsapp_user
      POSTGRES_PASSWORD: whatsapp_secure_password_2024
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
      BACKUP_RETENTION_DAYS: 30
      S3_BUCKET: ${BACKUP_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - backup_data:/backups
    networks:
      - whatsapp-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  opensearch_data:
    driver: local
  pgadmin_data:
    driver: local
  backup_data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

