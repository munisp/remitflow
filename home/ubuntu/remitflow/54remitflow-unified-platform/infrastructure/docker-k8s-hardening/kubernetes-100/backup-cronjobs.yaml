---
# etcd Backup CronJob (APISIX)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: production
  labels:
    app: apisix
    component: backup
spec:
  schedule: "*/6 * * * *"  # Every 6 hours
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: apisix
            component: backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: etcd-backup
            image: quay.io/coreos/etcd:v3.5.11
            env:
            - name: ETCDCTL_API
              value: "3"
            - name: ETCD_ENDPOINTS
              value: "https://etcd-0.etcd:2379,https://etcd-1.etcd:2379,https://etcd-2.etcd:2379"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              BACKUP_FILE="/backups/etcd/backup-$(date +%Y%m%d-%H%M%S).db"
              mkdir -p /backups/etcd
              
              echo "Starting etcd backup at $(date)"
              etcdctl --endpoints=$ETCD_ENDPOINTS \
                --cacert=/certs/ca.crt \
                --cert=/certs/client.crt \
                --key=/certs/client.key \
                snapshot save $BACKUP_FILE
              
              echo "Backup completed: $BACKUP_FILE"
              ls -lh $BACKUP_FILE
              
              # Verify snapshot
              etcdctl snapshot status $BACKUP_FILE
              
              # Cleanup old backups (keep 7 days for etcd)
              find /backups/etcd -name "backup-*.db" -mtime +7 -delete
              echo "Old backups cleaned up"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            - name: etcd-certs
              mountPath: /certs
              readOnly: true
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage-pvc
          - name: etcd-certs
            secret:
              secretName: etcd-certs

---
# Volume Snapshot Class
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: csi-snapclass
  labels:
    component: storage
driver: csi.storage.k8s.io
deletionPolicy: Retain
parameters:
  snapshot-type: "incremental"

---
# Backup Monitoring Service
apiVersion: v1
kind: Service
metadata:
  name: backup-monitor
  namespace: production
  labels:
    app: backup
    component: monitoring
spec:
  selector:
    app: backup
    component: monitoring
  ports:
  - port: 9090
    targetPort: 9090
    name: metrics

---
# Backup Restore Documentation ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-restore-procedures
  namespace: production
  labels:
    app: backup
    component: documentation
data:
  restore-postgres.sh: |
    #!/bin/bash
    # PostgreSQL Restore Procedure
    # Usage: ./restore-postgres.sh <backup-file> <database-name>
    
    BACKUP_FILE=$1
    DATABASE=$2
    
    if [ -z "$BACKUP_FILE" ] || [ -z "$DATABASE" ]; then
      echo "Usage: $0 <backup-file> <database-name>"
      exit 1
    fi
    
    echo "Restoring $DATABASE from $BACKUP_FILE"
    
    # Drop existing database (WARNING: DATA LOSS)
    psql -h $PGHOST -U $PGUSER -c "DROP DATABASE IF EXISTS $DATABASE;"
    
    # Create new database
    psql -h $PGHOST -U $PGUSER -c "CREATE DATABASE $DATABASE;"
    
    # Restore from backup
    gunzip -c $BACKUP_FILE | psql -h $PGHOST -U $PGUSER -d $DATABASE
    
    echo "Restore completed"
  
  restore-etcd.sh: |
    #!/bin/bash
    # etcd Restore Procedure
    # Usage: ./restore-etcd.sh <snapshot-file>
    
    SNAPSHOT_FILE=$1
    
    if [ -z "$SNAPSHOT_FILE" ]; then
      echo "Usage: $0 <snapshot-file>"
      exit 1
    fi
    
    echo "Restoring etcd from $SNAPSHOT_FILE"
    
    # Stop etcd cluster
    kubectl scale statefulset etcd --replicas=0 -n production
    
    # Restore snapshot
    etcdctl snapshot restore $SNAPSHOT_FILE \
      --data-dir=/var/lib/etcd \
      --initial-cluster=etcd-0=https://etcd-0.etcd:2380,etcd-1=https://etcd-1.etcd:2380,etcd-2=https://etcd-2.etcd:2380 \
      --initial-advertise-peer-urls=https://etcd-0.etcd:2380 \
      --name=etcd-0
    
    # Start etcd cluster
    kubectl scale statefulset etcd --replicas=3 -n production
    
    echo "Restore completed"

