---
# Backup Storage PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage-pvc
  namespace: production
  labels:
    app: backup
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 500Gi

---
# PostgreSQL Backup CronJob (Temporal)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-postgres-backup
  namespace: production
  labels:
    app: temporal
    component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: temporal
            component: backup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: postgres:15-alpine
            env:
            - name: PGHOST
              value: "temporal-postgresql"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres-secret
                  key: password
            - name: PGDATABASE
              value: "temporal"
            command:
            - /bin/sh
            - -c
            - |
              set -e
              BACKUP_FILE="/backups/temporal/backup-$(date +%Y%m%d-%H%M%S).sql.gz"
              mkdir -p /backups/temporal
              
              echo "Starting backup at $(date)"
              pg_dump -h $PGHOST -U $PGUSER $PGDATABASE | gzip > $BACKUP_FILE
              
              echo "Backup completed: $BACKUP_FILE"
              ls -lh $BACKUP_FILE
              
              # Cleanup old backups (keep 30 days)
              find /backups/temporal -name "backup-*.sql.gz" -mtime +30 -delete
              echo "Old backups cleaned up"
              
              # Verify backup
              if [ -f "$BACKUP_FILE" ] && [ -s "$BACKUP_FILE" ]; then
                echo "Backup verification: SUCCESS"
                exit 0
              else
                echo "Backup verification: FAILED"
                exit 1
              fi
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage-pvc

