apiVersion: v1
kind: Namespace
metadata:
  name: temporal-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal-system
data:
  development-sql.yaml: "system.forceSearchAttributesCacheRefreshOnRead:\n  - value:\
    \ true\n    constraints: {}\nhistory.maxAutoResetPoints:\n  - value: 20\n    constraints:\
    \ {}\nfrontend.defaultWorkflowTaskTimeout:\n  - value: \"10s\"\n    constraints:\
    \ {}\nfrontend.defaultWorkflowExecutionTimeout:\n  - value: \"24h\"\n    constraints:\
    \ {}\nsystem.defaultWorkflowRetentionPeriod:\n  - value: \"7d\"\n    constraints:\
    \ {}\nsystem.enableMetrics:\n  - value: true\n    constraints: {}\n"
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-postgresql-secret
  namespace: temporal-system
type: Opaque
stringData:
  POSTGRES_USER: temporal
  POSTGRES_PASSWORD: temporal_prod_password_change_me
  POSTGRES_DB: temporal
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgresql
  namespace: temporal-system
spec:
  selector:
    app: temporal-postgresql
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgresql
  namespace: temporal-system
spec:
  serviceName: temporal-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: temporal-postgresql
  template:
    metadata:
      labels:
        app: temporal-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: temporal-postgresql-secret
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 2000m
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - temporal
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - temporal
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - temporal-postgresql
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: temporal-postgresql
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: temporal-postgresql
      nodeSelector:
        workload-type: production
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal-system
spec:
  selector:
    app: temporal-server
    component: frontend
  ports:
  - name: grpc
    port: 7233
    targetPort: 7233
  - name: membership
    port: 6933
    targetPort: 6933
  type: ClusterIP
---
