apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: temporal-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-server
      component: frontend
  template:
    metadata:
      labels:
        app: temporal-server
        component: frontend
    spec:
      containers:
      - name: temporal-frontend
        image: temporalio/server:1.22.4
        args:
        - start
        - --service
        - frontend
        env:
        - name: DB
          value: postgresql12
        - name: DB_PORT
          value: '5432'
        - name: POSTGRES_SEEDS
          value: temporal-postgresql
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: temporal-postgresql-secret
              key: POSTGRES_USER
        - name: POSTGRES_PWD
          valueFrom:
            secretKeyRef:
              name: temporal-postgresql-secret
              key: POSTGRES_PASSWORD
        - name: DYNAMIC_CONFIG_FILE_PATH
          value: /etc/temporal/config/dynamicconfig/development-sql.yaml
        - name: SERVICES
          value: frontend
        - name: PROMETHEUS_ENDPOINT
          value: 0.0.0.0:9090
        ports:
        - containerPort: 7233
          name: grpc
        - containerPort: 6933
          name: membership
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/temporal/config/dynamicconfig
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 2000m
        livenessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 10
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: temporal-config
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - temporal-frontend
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: temporal-frontend
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: temporal-frontend
      nodeSelector:
        workload-type: production
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
