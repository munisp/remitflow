apiVersion: v1
kind: Namespace
metadata:
  name: permify-system
  labels:
    name: permify-system
    app.kubernetes.io/name: permify
    app.kubernetes.io/component: authorization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: permify-system
data:
  permify.yaml: "server:\n  http:\n    enabled: true\n    port: 3476\n  grpc:\n  \
    \  port: 3478\n\ndatabase:\n  engine: postgres\n  auto_migrate: true\n  max_open_connections:\
    \ 20\n  max_idle_connections: 5\n  max_connection_lifetime: 300s\n  max_connection_idle_time:\
    \ 60s\n\nlog:\n  level: info\n\nauthn:\n  enabled: true\n  method: preshared\n\
    \nprofiler:\n  enabled: true\n  port: 6060\n\nmeter:\n  enabled: true\n  exporter:\
    \ prometheus\n  endpoint: \":9090\"\n\ntracer:\n  enabled: true\n  exporter: otlp\n\
    \  insecure: true\n\nservice:\n  circuit_breaker: true\n  watch_enabled: true\n\
    \  schema_cache_enabled: true\n  permission_cache_enabled: true\n"
---
apiVersion: v1
kind: Secret
metadata:
  name: permify-secrets
  namespace: permify-system
type: Opaque
stringData:
  postgres-password: permify_secure_password_change_in_production
  api-key: permify_api_key_change_in_production
  database-uri: postgresql://permify:permify_secure_password_change_in_production@permify-postgres:5432/permify?sslmode=require
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: permify-postgres
  namespace: permify-system
  labels:
    app: permify-postgres
    component: database
spec:
  serviceName: permify-postgres
  replicas: 1
  selector:
    matchLabels:
      app: permify-postgres
  template:
    metadata:
      labels:
        app: permify-postgres
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: permify
        - name: POSTGRES_USER
          value: permify
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: postgres-password
        - name: POSTGRES_INITDB_ARGS
          value: -E UTF8
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 2Gi
            cpu: 1000m
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - permify
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - permify
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: init-scripts
        configMap:
          name: permify-init-scripts
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - permify-postgres
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: permify-postgres
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: permify-postgres
      nodeSelector:
        workload-type: production
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: permify-postgres
  namespace: permify-system
  labels:
    app: permify-postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: permify-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify-server
  namespace: permify-system
  labels:
    app: permify-server
    component: authorization
spec:
  replicas: 3
  selector:
    matchLabels:
      app: permify-server
  template:
    metadata:
      labels:
        app: permify-server
        component: authorization
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - permify-server
              topologyKey: kubernetes.io/hostname
      containers:
      - name: permify
        image: ghcr.io/permify/permify:latest
        env:
        - name: PERMIFY_SERVER_HTTP_ENABLED
          value: 'true'
        - name: PERMIFY_SERVER_HTTP_PORT
          value: '3476'
        - name: PERMIFY_SERVER_GRPC_PORT
          value: '3478'
        - name: PERMIFY_DATABASE_ENGINE
          value: postgres
        - name: PERMIFY_DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: database-uri
        - name: PERMIFY_DATABASE_AUTO_MIGRATE
          value: 'true'
        - name: PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS
          value: '20'
        - name: PERMIFY_DATABASE_MAX_IDLE_CONNECTIONS
          value: '5'
        - name: PERMIFY_DATABASE_MAX_CONNECTION_LIFETIME
          value: 300s
        - name: PERMIFY_DATABASE_MAX_CONNECTION_IDLE_TIME
          value: 60s
        - name: PERMIFY_LOG_LEVEL
          value: info
        - name: PERMIFY_AUTHN_ENABLED
          value: 'true'
        - name: PERMIFY_AUTHN_METHOD
          value: preshared
        - name: PERMIFY_AUTHN_PRESHARED_KEYS
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: api-key
        - name: PERMIFY_PROFILER_ENABLED
          value: 'true'
        - name: PERMIFY_PROFILER_PORT
          value: '6060'
        - name: PERMIFY_METER_ENABLED
          value: 'true'
        - name: PERMIFY_METER_EXPORTER
          value: prometheus
        - name: PERMIFY_METER_ENDPOINT
          value: :9090
        - name: PERMIFY_TRACER_ENABLED
          value: 'true'
        - name: PERMIFY_TRACER_EXPORTER
          value: otlp
        - name: PERMIFY_TRACER_INSECURE
          value: 'true'
        - name: PERMIFY_SERVICE_CIRCUIT_BREAKER
          value: 'true'
        - name: PERMIFY_SERVICE_WATCH_ENABLED
          value: 'true'
        - name: PERMIFY_SERVICE_SCHEMA_CACHE_ENABLED
          value: 'true'
        - name: PERMIFY_SERVICE_PERMISSION_CACHE_ENABLED
          value: 'true'
        ports:
        - containerPort: 3476
          name: http
          protocol: TCP
        - containerPort: 3478
          name: grpc
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 6060
          name: profiler
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/permify/config
          readOnly: true
        - name: schemas
          mountPath: /etc/permify/schemas
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3476
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3476
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: permify-config
      - name: schemas
        configMap:
          name: permify-schemas
      - name: tmp
        emptyDir: {}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: permify-server
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: permify-server
      nodeSelector:
        workload-type: production
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: permify-http
  namespace: permify-system
  labels:
    app: permify-server
    service: http
spec:
  type: ClusterIP
  ports:
  - port: 3476
    targetPort: 3476
    protocol: TCP
    name: http
  selector:
    app: permify-server
---
apiVersion: v1
kind: Service
metadata:
  name: permify-grpc
  namespace: permify-system
  labels:
    app: permify-server
    service: grpc
spec:
  type: ClusterIP
  ports:
  - port: 3478
    targetPort: 3478
    protocol: TCP
    name: grpc
  selector:
    app: permify-server
---
apiVersion: v1
kind: Service
metadata:
  name: permify-metrics
  namespace: permify-system
  labels:
    app: permify-server
    service: metrics
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: permify-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permify-server-hpa
  namespace: permify-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: permify-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-server-pdb
  namespace: permify-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: permify-server
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permify-network-policy
  namespace: permify-system
spec:
  podSelector:
    matchLabels:
      app: permify-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: remittance-platform
    ports:
    - protocol: TCP
      port: 3476
    - protocol: TCP
      port: 3478
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: permify-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-postgres-pdb
  labels:
    app: permify-postgres
    component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: permify-postgres
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permify-server-hpa
  labels:
    app: permify-server
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: permify-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-server-pdb
  labels:
    app: permify-server
    component: availability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: permify-server
