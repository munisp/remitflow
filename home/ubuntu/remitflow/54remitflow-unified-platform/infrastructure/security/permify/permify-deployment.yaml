apiVersion: v1
kind: Namespace
metadata:
  name: permify
  labels:
    name: permify
    component: authorization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: permify
data:
  config.yaml: |
    server:
      grpc:
        port: 3476
      http:
        enabled: true
        port: 3477
        cors_allowed_origins:
          - "*"
        cors_allowed_headers:
          - "*"
    
    logger:
      level: info
      output: stdout
    
    profiler:
      enabled: true
      port: 6060
    
    meter:
      enabled: true
      endpoint: http://prometheus-operator-kube-p-prometheus:9090
      insecure: true
    
    tracer:
      enabled: true
      exporter: jaeger
      endpoint: http://jaeger-collector:14268/api/traces
      insecure: true
    
    database:
      engine: postgres
      uri: postgres://permify:permify123@postgresql:5432/permify?sslmode=disable
      auto_migrate: true
      max_open_connections: 20
      max_idle_connections: 1
      max_lifetime_connections: 300s
      max_idle_time_connections: 60s
    
    cache:
      number_of_counters: 1000
      max_cost: 10MiB
    
    distributed:
      enabled: false
    
    authn:
      enabled: true
      method: preshared
      keys:
        - "remittance-auth-key-123"
    
    service:
      circuit_breaker: false
      watch:
        enabled: true
        snapshot_frequency: 5s
      schema:
        cache:
          number_of_counters: 1000
          max_cost: 10MiB
      permission:
        bulk_limit: 100
        concurrency_limit: 100
      data:
        cache:
          number_of_counters: 1000
          max_cost: 10MiB
  
  schema.perm: |
    entity user {}
    
    entity organization {
        relation admin @user
        relation member @user
        
        permission view = admin or member
        permission edit = admin
        permission delete = admin
    }
    
    entity bank {
        relation admin @user
        relation manager @user
        relation employee @user
        relation agent @user
        
        permission view = admin or manager or employee or agent
        permission manage_agents = admin or manager
        permission process_transactions = admin or manager or employee or agent
        permission view_reports = admin or manager
        permission manage_settings = admin
    }
    
    entity agent {
        relation owner @user
        relation supervisor @user
        relation bank @bank
        
        permission view = owner or supervisor or bank.admin or bank.manager
        permission edit = owner or supervisor or bank.admin or bank.manager
        permission activate = bank.admin or bank.manager
        permission deactivate = bank.admin or bank.manager
        permission view_transactions = owner or supervisor or bank.admin or bank.manager
        permission process_transactions = owner and bank.process_transactions
    }
    
    entity customer {
        relation owner @user
        relation agent @agent
        relation bank @bank
        
        permission view = owner or agent.owner or bank.admin or bank.manager or bank.employee
        permission edit = owner or agent.owner or bank.admin or bank.manager
        permission view_transactions = owner or agent.owner or bank.admin or bank.manager
        permission create_transactions = owner or agent.owner
    }
    
    entity transaction {
        relation initiator @user
        relation agent @agent
        relation customer @customer
        relation bank @bank
        
        permission view = initiator or agent.owner or customer.owner or bank.admin or bank.manager or bank.employee
        permission approve = agent.owner or bank.admin or bank.manager
        permission reject = agent.owner or bank.admin or bank.manager
        permission reverse = bank.admin or bank.manager
        permission audit = bank.admin or bank.manager
    }
    
    entity account {
        relation owner @user
        relation agent @agent
        relation bank @bank
        
        permission view = owner or agent.owner or bank.admin or bank.manager or bank.employee
        permission deposit = agent.owner or bank.admin or bank.manager or bank.employee
        permission withdraw = agent.owner or bank.admin or bank.manager or bank.employee
        permission transfer = owner or agent.owner or bank.admin or bank.manager
        permission freeze = bank.admin or bank.manager
        permission close = bank.admin or bank.manager
    }
    
    entity commission {
        relation agent @agent
        relation bank @bank
        
        permission view = agent.owner or bank.admin or bank.manager
        permission calculate = bank.admin or bank.manager
        permission pay = bank.admin or bank.manager
        permission audit = bank.admin or bank.manager
    }
    
    entity report {
        relation bank @bank
        relation agent @agent
        
        permission view = bank.admin or bank.manager or agent.owner
        permission generate = bank.admin or bank.manager
        permission export = bank.admin or bank.manager
        permission audit = bank.admin
    }
    
    entity audit_log {
        relation bank @bank
        
        permission view = bank.admin
        permission export = bank.admin
    }
    
    entity system_setting {
        relation bank @bank
        
        permission view = bank.admin or bank.manager
        permission edit = bank.admin
    }
    
    entity api_key {
        relation owner @user
        relation bank @bank
        
        permission view = owner or bank.admin
        permission create = bank.admin
        permission revoke = owner or bank.admin
        permission use = owner
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: permify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: permify
  template:
    metadata:
      labels:
        app: permify
    spec:
      containers:
      - name: permify
        image: ghcr.io/permify/permify:v0.6.9
        ports:
        - containerPort: 3476
          name: grpc
        - containerPort: 3477
          name: http
        - containerPort: 6060
          name: profiler
        args:
        - serve
        - --config=/etc/permify/config.yaml
        env:
        - name: PERMIFY_DATABASE_URI
          value: "postgres://permify:permify123@postgresql:5432/permify?sslmode=disable"
        - name: PERMIFY_AUTHN_ENABLED
          value: "true"
        - name: PERMIFY_AUTHN_METHOD
          value: "preshared"
        - name: PERMIFY_LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: config
          mountPath: /etc/permify
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3477
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3477
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: permify-config
---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: permify
spec:
  selector:
    app: permify
  ports:
  - name: grpc
    port: 3476
    targetPort: 3476
  - name: http
    port: 3477
    targetPort: 3477
  - name: profiler
    port: 6060
    targetPort: 6060
  type: ClusterIP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: permify-schema-setup
  namespace: permify
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: schema-setup
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          # Wait for Permify to be ready
          until curl -f http://permify:3477/healthz; do
            echo "Waiting for Permify to be ready..."
            sleep 10
          done
          
          # Upload schema
          curl -X POST \
            "http://permify:3477/v1/schemas/write" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer remittance-auth-key-123" \
            -d '{
              "tenant_id": "remittance",
              "schema": "entity user {}\n\nentity organization {\n    relation admin @user\n    relation member @user\n    \n    permission view = admin or member\n    permission edit = admin\n    permission delete = admin\n}\n\nentity bank {\n    relation admin @user\n    relation manager @user\n    relation employee @user\n    relation agent @user\n    \n    permission view = admin or manager or employee or agent\n    permission manage_agents = admin or manager\n    permission process_transactions = admin or manager or employee or agent\n    permission view_reports = admin or manager\n    permission manage_settings = admin\n}\n\nentity agent {\n    relation owner @user\n    relation supervisor @user\n    relation bank @bank\n    \n    permission view = owner or supervisor or bank.admin or bank.manager\n    permission edit = owner or supervisor or bank.admin or bank.manager\n    permission activate = bank.admin or bank.manager\n    permission deactivate = bank.admin or bank.manager\n    permission view_transactions = owner or supervisor or bank.admin or bank.manager\n    permission process_transactions = owner and bank.process_transactions\n}\n\nentity customer {\n    relation owner @user\n    relation agent @agent\n    relation bank @bank\n    \n    permission view = owner or agent.owner or bank.admin or bank.manager or bank.employee\n    permission edit = owner or agent.owner or bank.admin or bank.manager\n    permission view_transactions = owner or agent.owner or bank.admin or bank.manager\n    permission create_transactions = owner or agent.owner\n}\n\nentity transaction {\n    relation initiator @user\n    relation agent @agent\n    relation customer @customer\n    relation bank @bank\n    \n    permission view = initiator or agent.owner or customer.owner or bank.admin or bank.manager or bank.employee\n    permission approve = agent.owner or bank.admin or bank.manager\n    permission reject = agent.owner or bank.admin or bank.manager\n    permission reverse = bank.admin or bank.manager\n    permission audit = bank.admin or bank.manager\n}\n\nentity account {\n    relation owner @user\n    relation agent @agent\n    relation bank @bank\n    \n    permission view = owner or agent.owner or bank.admin or bank.manager or bank.employee\n    permission deposit = agent.owner or bank.admin or bank.manager or bank.employee\n    permission withdraw = agent.owner or bank.admin or bank.manager or bank.employee\n    permission transfer = owner or agent.owner or bank.admin or bank.manager\n    permission freeze = bank.admin or bank.manager\n    permission close = bank.admin or bank.manager\n}\n\nentity commission {\n    relation agent @agent\n    relation bank @bank\n    \n    permission view = agent.owner or bank.admin or bank.manager\n    permission calculate = bank.admin or bank.manager\n    permission pay = bank.admin or bank.manager\n    permission audit = bank.admin or bank.manager\n}\n\nentity report {\n    relation bank @bank\n    relation agent @agent\n    \n    permission view = bank.admin or bank.manager or agent.owner\n    permission generate = bank.admin or bank.manager\n    permission export = bank.admin or bank.manager\n    permission audit = bank.admin\n}\n\nentity audit_log {\n    relation bank @bank\n    \n    permission view = bank.admin\n    permission export = bank.admin\n}\n\nentity system_setting {\n    relation bank @bank\n    \n    permission view = bank.admin or bank.manager\n    permission edit = bank.admin\n}\n\nentity api_key {\n    relation owner @user\n    relation bank @bank\n    \n    permission view = owner or bank.admin\n    permission create = bank.admin\n    permission revoke = owner or bank.admin\n    permission use = owner\n}"
            }'
          
          echo "Permify schema uploaded successfully"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: permify-metrics
  namespace: permify
spec:
  selector:
    matchLabels:
      app: permify
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: permify-ingress
  namespace: permify
  annotations:
    kubernetes.io/ingress.class: "openappsec"
    openappsec.io/waf-enabled: "true"
    openappsec.io/api-protection: "true"
spec:
  tls:
  - hosts:
    - permify.remittance.local
    secretName: permify-tls
  rules:
  - host: permify.remittance.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: permify
            port:
              number: 3477
---
apiVersion: v1
kind: Secret
metadata:
  name: permify-tls
  namespace: permify
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t  # Base64 encoded private key

