# Wazuh SIEM Security Monitoring Deployment
# Comprehensive security monitoring for Remittance Platform

apiVersion: v1
kind: Namespace
metadata:
  name: wazuh-system
  labels:
    name: wazuh-system
    security.remittance.com/monitoring: "enabled"

---
# Wazuh Manager ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-config
  namespace: wazuh-system
data:
  ossec.conf: |
    <ossec_config>
      <global>
        <jsonout_output>yes</jsonout_output>
        <alerts_log>yes</alerts_log>
        <logall>no</logall>
        <logall_json>no</logall_json>
        <email_notification>yes</email_notification>
        <smtp_server>localhost</smtp_server>
        <email_from>wazuh@remittance.local</email_from>
        <email_to>security@remittance.local</email_to>
        <hostname>wazuh-manager</hostname>
        <email_maxperhour>12</email_maxperhour>
        <email_log_source>alerts.log</email_log_source>
        <agents_disconnection_time>10m</agents_disconnection_time>
        <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
      </global>

      <alerts>
        <log_alert_level>3</log_alert_level>
        <email_alert_level>12</email_alert_level>
      </alerts>

      <!-- Banking-specific rules -->
      <rules>
        <include>rules_config.xml</include>
        <include>pam_rules.xml</include>
        <include>sshd_rules.xml</include>
        <include>telnetd_rules.xml</include>
        <include>syslog_rules.xml</include>
        <include>arpwatch_rules.xml</include>
        <include>symantec-av_rules.xml</include>
        <include>symantec-ws_rules.xml</include>
        <include>pix_rules.xml</include>
        <include>named_rules.xml</include>
        <include>smbd_rules.xml</include>
        <include>vsftpd_rules.xml</include>
        <include>pure-ftpd_rules.xml</include>
        <include>proftpd_rules.xml</include>
        <include>ms_ftpd_rules.xml</include>
        <include>ftpd_rules.xml</include>
        <include>hordeimp_rules.xml</include>
        <include>roundcube_rules.xml</include>
        <include>wordpress_rules.xml</include>
        <include>cimserver_rules.xml</include>
        <include>vpopmail_rules.xml</include>
        <include>vmpop3d_rules.xml</include>
        <include>courier_rules.xml</include>
        <include>web_rules.xml</include>
        <include>web_appsec_rules.xml</include>
        <include>apache_rules.xml</include>
        <include>nginx_rules.xml</include>
        <include>php_rules.xml</include>
        <include>mysql_rules.xml</include>
        <include>postgresql_rules.xml</include>
        <include>ids_rules.xml</include>
        <include>squid_rules.xml</include>
        <include>firewall_rules.xml</include>
        <include>cisco-ios_rules.xml</include>
        <include>netscreenfw_rules.xml</include>
        <include>sonicwall_rules.xml</include>
        <include>postfix_rules.xml</include>
        <include>sendmail_rules.xml</include>
        <include>imapd_rules.xml</include>
        <include>mailscanner_rules.xml</include>
        <include>dovecot_rules.xml</include>
        <include>ms-exchange_rules.xml</include>
        <include>racoon_rules.xml</include>
        <include>vpn_concentrator_rules.xml</include>
        <include>spamd_rules.xml</include>
        <include>msauth_rules.xml</include>
        <include>mcafee_av_rules.xml</include>
        <include>trend-osce_rules.xml</include>
        <include>ms-se_rules.xml</include>
        <include>zeus_rules.xml</include>
        <include>solaris_bsm_rules.xml</include>
        <include>vmware_rules.xml</include>
        <include>ms_dhcp_rules.xml</include>
        <include>asterisk_rules.xml</include>
        <include>ossec_rules.xml</include>
        <include>attack_rules.xml</include>
        <include>local_rules.xml</include>
        <!-- Custom banking rules -->
        <include>banking_rules.xml</include>
        <include>fraud_detection_rules.xml</include>
        <include>compliance_rules.xml</include>
      </rules>

      <syscheck>
        <!-- Banking application file integrity monitoring -->
        <directories check_all="yes" realtime="yes">/opt/remittance</directories>
        <directories check_all="yes" realtime="yes">/etc/ssl</directories>
        <directories check_all="yes" realtime="yes">/etc/pki</directories>
        <directories check_all="yes" realtime="yes">/var/lib/postgresql</directories>
        <directories check_all="yes" realtime="yes">/var/lib/redis</directories>
        <directories check_all="yes" realtime="yes">/etc/nginx</directories>
        <directories check_all="yes" realtime="yes">/etc/apache2</directories>
        
        <!-- System directories -->
        <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
        <directories check_all="yes">/bin,/sbin,/boot</directories>
        
        <!-- Ignore some files -->
        <ignore>/etc/mtab</ignore>
        <ignore>/etc/hosts.deny</ignore>
        <ignore>/etc/mail/statistics</ignore>
        <ignore>/etc/random-seed</ignore>
        <ignore>/etc/random.seed</ignore>
        <ignore>/etc/adjtime</ignore>
        <ignore>/etc/httpd/logs</ignore>
        <ignore>/etc/utmpx</ignore>
        <ignore>/etc/wtmpx</ignore>
        <ignore>/etc/cups/certs</ignore>
        <ignore>/etc/dumpdates</ignore>
        <ignore>/etc/svc/volatile</ignore>
        
        <!-- Banking-specific ignores -->
        <ignore>/opt/remittance/logs</ignore>
        <ignore>/opt/remittance/tmp</ignore>
        <ignore>/var/lib/postgresql/*/pg_log</ignore>
        <ignore>/var/lib/redis/dump.rdb</ignore>
        
        <!-- Check the file, but never compute the diff -->
        <nodiff>/etc/ssl/private.key</nodiff>
        <nodiff>/opt/remittance/config/database.yml</nodiff>
        <nodiff>/opt/remittance/config/secrets.yml</nodiff>
        
        <skip_nfs>yes</skip_nfs>
        <skip_dev>yes</skip_dev>
        <skip_proc>yes</skip_proc>
        <skip_sys>yes</skip_sys>
        
        <!-- Nice value for Syscheck -->
        <process_priority>10</process_priority>
        
        <!-- Maximum output throughput -->
        <max_eps>100</max_eps>
        
        <!-- Database to save the file information -->
        <database>disk</database>
        
        <!-- Checking frequency -->
        <frequency>79200</frequency>
      </syscheck>

      <rootcheck>
        <disabled>no</disabled>
        <check_files>yes</check_files>
        <check_trojans>yes</check_trojans>
        <check_dev>yes</check_dev>
        <check_sys>yes</check_sys>
        <check_pids>yes</check_pids>
        <check_ports>yes</check_ports>
        <check_if>yes</check_if>
        
        <!-- Frequency that rootcheck is executed - every 22 hours -->
        <frequency>79200</frequency>
        
        <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
        <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
        
        <skip_nfs>yes</skip_nfs>
      </rootcheck>

      <wodle name="cis-cat">
        <disabled>yes</disabled>
        <timeout>1800</timeout>
        <interval>1d</interval>
        <scan-on-start>yes</scan-on-start>
        
        <java_path>wodles/java</java_path>
        <ciscat_path>wodles/ciscat</ciscat_path>
      </wodle>

      <wodle name="osquery">
        <disabled>yes</disabled>
        <run_daemon>yes</run_daemon>
        <log_path>/var/log/osquery/osqueryd.results.log</log_path>
        <config_path>/etc/osquery/osquery.conf</config_path>
        <add_labels>yes</add_labels>
      </wodle>

      <wodle name="syscollector">
        <disabled>no</disabled>
        <interval>1h</interval>
        <scan_on_start>yes</scan_on_start>
        <hardware>yes</hardware>
        <os>yes</os>
        <network>yes</network>
        <packages>yes</packages>
        <ports all="no">yes</ports>
        <processes>yes</processes>
        
        <!-- Database synchronization settings -->
        <synchronization>
          <max_eps>10</max_eps>
        </synchronization>
      </wodle>

      <wodle name="vulnerability-detector">
        <disabled>no</disabled>
        <interval>5m</interval>
        <ignore_time>6h</ignore_time>
        <run_on_start>yes</run_on_start>
        
        <!-- Ubuntu OS vulnerabilities -->
        <provider name="canonical">
          <enabled>yes</enabled>
          <os>trusty</os>
          <os>xenial</os>
          <os>bionic</os>
          <os>focal</os>
          <os>jammy</os>
          <update_interval>1h</update_interval>
        </provider>
        
        <!-- Debian OS vulnerabilities -->
        <provider name="debian">
          <enabled>yes</enabled>
          <os>wheezy</os>
          <os>jessie</os>
          <os>stretch</os>
          <os>buster</os>
          <os>bullseye</os>
          <update_interval>1h</update_interval>
        </provider>
        
        <!-- RedHat OS vulnerabilities -->
        <provider name="redhat">
          <enabled>yes</enabled>
          <os>5</os>
          <os>6</os>
          <os>7</os>
          <os>8</os>
          <os>9</os>
          <update_interval>1h</update_interval>
        </provider>
        
        <!-- Windows OS vulnerabilities -->
        <provider name="msu">
          <enabled>yes</enabled>
          <update_interval>1h</update_interval>
        </provider>
        
        <!-- Aggregate vulnerabilities -->
        <provider name="nvd">
          <enabled>yes</enabled>
          <update_interval>1h</update_interval>
        </provider>
      </wodle>

      <!-- Banking-specific monitoring -->
      <localfile>
        <log_format>json</log_format>
        <location>/opt/remittance/logs/application.log</location>
      </localfile>
      
      <localfile>
        <log_format>json</log_format>
        <location>/opt/remittance/logs/transaction.log</location>
      </localfile>
      
      <localfile>
        <log_format>json</log_format>
        <location>/opt/remittance/logs/fraud.log</location>
      </localfile>
      
      <localfile>
        <log_format>json</log_format>
        <location>/opt/remittance/logs/audit.log</location>
      </localfile>
      
      <!-- PostgreSQL logs -->
      <localfile>
        <log_format>postgresql_log</log_format>
        <location>/var/lib/postgresql/*/log/postgresql-*.log</location>
      </localfile>
      
      <!-- Nginx access logs -->
      <localfile>
        <log_format>nginx</log_format>
        <location>/var/log/nginx/access.log</location>
      </localfile>
      
      <!-- Nginx error logs -->
      <localfile>
        <log_format>nginx</log_format>
        <location>/var/log/nginx/error.log</location>
      </localfile>
      
      <!-- System logs -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/auth.log</location>
      </localfile>
      
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/syslog</location>
      </localfile>
      
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/dpkg.log</location>
      </localfile>
      
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/kern.log</location>
      </localfile>

      <remote>
        <connection>secure</connection>
        <port>1514</port>
        <protocol>tcp</protocol>
        <queue_size>131072</queue_size>
      </remote>

      <!-- Policy monitoring -->
      <rootcheck>
        <disabled>no</disabled>
        <check_files>yes</check_files>
        <check_trojans>yes</check_trojans>
        <check_dev>yes</check_dev>
        <check_sys>yes</check_sys>
        <check_pids>yes</check_pids>
        <check_ports>yes</check_ports>
        <check_if>yes</check_if>
        <frequency>43200</frequency>
        <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
        <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
        <skip_nfs>yes</skip_nfs>
      </rootcheck>

      <sca>
        <enabled>yes</enabled>
        <scan_on_start>yes</scan_on_start>
        <interval>12h</interval>
        <skip_nfs>yes</skip_nfs>
        
        <!-- Banking compliance policies -->
        <policies>
          <policy>cis_debian_linux_rcl.yml</policy>
          <policy>cis_ubuntu_linux_rcl.yml</policy>
          <policy>system_audit_rcl.yml</policy>
          <policy>win_audit_rcl.yml</policy>
          <policy>banking_compliance_rcl.yml</policy>
          <policy>pci_dss_rcl.yml</policy>
        </policies>
      </sca>

      <!-- Active response for banking security -->
      <active-response>
        <disabled>no</disabled>
        <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
        <ca_verification>yes</ca_verification>
      </active-response>

      <command>
        <name>disable-account</name>
        <executable>disable-account.sh</executable>
        <expect>user</expect>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <command>
        <name>restart-ossec</name>
        <executable>restart-ossec.sh</executable>
        <expect></expect>
      </command>

      <command>
        <name>firewall-drop</name>
        <executable>firewall-drop.sh</executable>
        <expect>srcip</expect>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <command>
        <name>host-deny</name>
        <executable>host-deny.sh</executable>
        <expect>srcip</expect>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <command>
        <name>route-null</name>
        <executable>route-null.sh</executable>
        <expect>srcip</expect>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <command>
        <name>win_route-null</name>
        <executable>route-null.cmd</executable>
        <expect>srcip</expect>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <command>
        <name>netsh</name>
        <executable>netsh.cmd</executable>
        <expect>srcip</expect>
        <timeout_allowed>yes</timeout_allowed>
      </command>

      <!-- Banking-specific active responses -->
      <active-response>
        <command>firewall-drop</command>
        <location>local</location>
        <level>6</level>
        <timeout>600</timeout>
      </active-response>

      <active-response>
        <command>host-deny</command>
        <location>local</location>
        <level>6</level>
        <timeout>600</timeout>
      </active-response>

      <!-- Fraud detection active response -->
      <active-response>
        <command>disable-account</command>
        <location>local</location>
        <rules_id>100001,100002,100003</rules_id>
        <timeout>0</timeout>
      </active-response>

      <!-- Global configuration -->
      <global>
        <white_list>127.0.0.1</white_list>
        <white_list>^localhost.localdomain$</white_list>
        <white_list>10.0.0.0/8</white_list>
        <white_list>172.16.0.0/12</white_list>
        <white_list>192.168.0.0/16</white_list>
      </global>

      <cluster>
        <name>wazuh</name>
        <node_name>wazuh-manager</node_name>
        <node_type>master</node_type>
        <key>c98b62a9b6169ac5f67dae55ae4a9088</key>
        <port>1516</port>
        <bind_addr>0.0.0.0</bind_addr>
        <nodes>
          <node>wazuh-manager</node>
        </nodes>
        <hidden>no</hidden>
        <disabled>no</disabled>
      </cluster>
    </ossec_config>

  banking_rules.xml: |
    <!-- Banking-specific security rules for Remittance Platform -->
    <group name="banking,">
      
      <!-- Transaction monitoring rules -->
      <rule id="100001" level="10">
        <if_sid>1002</if_sid>
        <match>high_value_transaction</match>
        <description>High value transaction detected</description>
        <group>banking,transaction,high_value</group>
      </rule>
      
      <rule id="100002" level="12">
        <if_sid>1002</if_sid>
        <match>suspicious_transaction</match>
        <description>Suspicious transaction pattern detected</description>
        <group>banking,transaction,suspicious</group>
      </rule>
      
      <rule id="100003" level="15">
        <if_sid>1002</if_sid>
        <match>fraud_detected</match>
        <description>Fraud detected in transaction</description>
        <group>banking,fraud,critical</group>
      </rule>
      
      <!-- Authentication monitoring -->
      <rule id="100004" level="8">
        <if_sid>5716</if_sid>
        <match>multiple_failed_login</match>
        <description>Multiple failed login attempts detected</description>
        <group>banking,authentication,brute_force</group>
      </rule>
      
      <rule id="100005" level="10">
        <if_sid>5716</if_sid>
        <match>admin_login_unusual_time</match>
        <description>Admin login at unusual time</description>
        <group>banking,authentication,unusual</group>
      </rule>
      
      <!-- Data access monitoring -->
      <rule id="100006" level="12">
        <if_sid>1002</if_sid>
        <match>unauthorized_data_access</match>
        <description>Unauthorized access to sensitive banking data</description>
        <group>banking,data_access,unauthorized</group>
      </rule>
      
      <rule id="100007" level="10">
        <if_sid>1002</if_sid>
        <match>bulk_data_export</match>
        <description>Bulk data export detected</description>
        <group>banking,data_access,bulk_export</group>
      </rule>
      
      <!-- System integrity monitoring -->
      <rule id="100008" level="12">
        <if_sid>550</if_sid>
        <match>/opt/remittance</match>
        <description>Banking application files modified</description>
        <group>banking,integrity,application</group>
      </rule>
      
      <rule id="100009" level="15">
        <if_sid>550</if_sid>
        <match>/etc/ssl|/etc/pki</match>
        <description>SSL/TLS certificates modified</description>
        <group>banking,integrity,certificates</group>
      </rule>
      
      <!-- Compliance monitoring -->
      <rule id="100010" level="8">
        <if_sid>1002</if_sid>
        <match>compliance_violation</match>
        <description>Banking compliance violation detected</description>
        <group>banking,compliance,violation</group>
      </rule>
      
      <rule id="100011" level="10">
        <if_sid>1002</if_sid>
        <match>audit_log_tampering</match>
        <description>Audit log tampering detected</description>
        <group>banking,compliance,audit_tampering</group>
      </rule>
      
      <!-- Nigerian banking specific rules -->
      <rule id="100012" level="10">
        <if_sid>1002</if_sid>
        <match>bvn_verification_failed</match>
        <description>BVN verification failed</description>
        <group>banking,nigeria,bvn,verification</group>
      </rule>
      
      <rule id="100013" level="8">
        <if_sid>1002</if_sid>
        <match>cbn_reporting_failure</match>
        <description>CBN reporting failure</description>
        <group>banking,nigeria,cbn,reporting</group>
      </rule>
      
      <!-- Agent network monitoring -->
      <rule id="100014" level="10">
        <if_sid>1002</if_sid>
        <match>agent_float_discrepancy</match>
        <description>Agent float discrepancy detected</description>
        <group>banking,agent,float,discrepancy</group>
      </rule>
      
      <rule id="100015" level="12">
        <if_sid>1002</if_sid>
        <match>agent_suspicious_activity</match>
        <description>Suspicious agent activity detected</description>
        <group>banking,agent,suspicious</group>
      </rule>
      
    </group>

---
# Wazuh Manager Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: wazuh-system
  labels:
    app: wazuh-manager
    component: security-monitoring
spec:
  serviceName: wazuh-manager-headless
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: wazuh-manager
        image: wazuh/wazuh-manager:4.7.0
        ports:
        - containerPort: 1514
          name: agents-events
          protocol: TCP
        - containerPort: 1515
          name: agents-auth
          protocol: TCP
        - containerPort: 1516
          name: cluster
          protocol: TCP
        - containerPort: 55000
          name: api
          protocol: TCP
        env:
        - name: WAZUH_MANAGER_SERVICE_NAME
          value: wazuh-manager
        - name: WAZUH_CLUSTER_KEY
          value: "c98b62a9b6169ac5f67dae55ae4a9088"
        - name: WAZUH_CLUSTER_NODE_NAME
          value: "wazuh-manager"
        - name: WAZUH_CLUSTER_NODE_TYPE
          value: "master"
        - name: WAZUH_CLUSTER_NODES
          value: "wazuh-manager"
        - name: WAZUH_CLUSTER_PORT
          value: "1516"
        volumeMounts:
        - name: wazuh-manager-config
          mountPath: /wazuh-config-mount/etc/ossec.conf
          subPath: ossec.conf
          readOnly: true
        - name: wazuh-manager-config
          mountPath: /wazuh-config-mount/etc/rules/banking_rules.xml
          subPath: banking_rules.xml
          readOnly: true
        - name: wazuh-manager-data
          mountPath: /var/ossec/data
        - name: wazuh-manager-logs
          mountPath: /var/ossec/logs
        - name: wazuh-manager-queue
          mountPath: /var/ossec/queue
        - name: wazuh-manager-var-multigroups
          mountPath: /var/ossec/var/multigroups
        - name: wazuh-manager-integrations
          mountPath: /var/ossec/integrations
        - name: wazuh-manager-active-response
          mountPath: /var/ossec/active-response/bin
        - name: wazuh-manager-agentless
          mountPath: /var/ossec/agentless
        - name: wazuh-manager-wodles
          mountPath: /var/ossec/wodles
        - name: filebeat-etc
          mountPath: /etc/filebeat
        - name: filebeat-var
          mountPath: /var/lib/filebeat
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /var/ossec/bin/wazuh-control
            - status
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /var/ossec/bin/wazuh-control
            - status
          initialDelaySeconds: 15
          periodSeconds: 15
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.5.0
        args: [
          "-c", "/etc/filebeat/filebeat.yml",
          "-e",
        ]
        env:
        - name: OPENSEARCH_HOST
          value: opensearch-es-http.elastic-system.svc.cluster.local
        - name: OPENSEARCH_PORT
          value: "9200"
        - name: OPENSEARCH_USERNAME
          value: elastic
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-es-elastic-user
              key: elastic
        - name: ELASTIC_CLOUD_ID
          value: ""
        - name: ELASTIC_CLOUD_AUTH
          value: ""
        volumeMounts:
        - name: filebeat-config
          mountPath: /etc/filebeat
        - name: wazuh-manager-logs
          mountPath: /var/ossec/logs
          readOnly: true
        - name: filebeat-var
          mountPath: /var/lib/filebeat
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: wazuh-manager-config
        configMap:
          name: wazuh-manager-config
      - name: filebeat-config
        configMap:
          name: filebeat-config
  volumeClaimTemplates:
  - metadata:
      name: wazuh-manager-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 50Gi
  - metadata:
      name: wazuh-manager-logs
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: wazuh-manager-queue
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: wazuh-manager-var-multigroups
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: wazuh-manager-integrations
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: wazuh-manager-active-response
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: wazuh-manager-agentless
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: wazuh-manager-wodles
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: filebeat-etc
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: filebeat-var
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 5Gi

