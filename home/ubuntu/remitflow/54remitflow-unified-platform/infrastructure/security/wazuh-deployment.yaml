  name: wazuh-manager
  namespace: wazuh-system
  labels:
    app: wazuh-manager
spec:
  type: ClusterIP
  ports:
  - port: 1514
    targetPort: 1514
    name: agents-events
    protocol: TCP
  - port: 1515
    targetPort: 1515
    name: agents-auth
    protocol: TCP
  - port: 1516
    targetPort: 1516
    name: cluster
    protocol: TCP
  - port: 55000
    targetPort: 55000
    name: api
    protocol: TCP
  selector:
    app: wazuh-manager

