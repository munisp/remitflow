---
# Filebeat ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: wazuh-system
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: log
      enabled: true
      paths:
        - /var/ossec/logs/alerts/alerts.json
      fields:
        logtype: wazuh-alerts
      fields_under_root: true
      json.keys_under_root: true
      json.add_error_key: true
      json.message_key: log
      
    - type: log
      enabled: true
      paths:
        - /var/ossec/logs/archives/archives.json
      fields:
        logtype: wazuh-archives
      fields_under_root: true
      json.keys_under_root: true
      json.add_error_key: true
      json.message_key: log

    output.opensearch:
      hosts: ["${OPENSEARCH_HOST}:${OPENSEARCH_PORT}"]
      username: "${OPENSEARCH_USERNAME}"
      password: "${OPENSEARCH_PASSWORD}"
      index: "wazuh-alerts-%{+yyyy.MM.dd}"
      template.name: "wazuh"
      template.pattern: "wazuh-alerts-*"
      template.settings:
        index.number_of_shards: 1
        index.number_of_replicas: 1
        index.refresh_interval: 5s
        index.codec: best_compression
        index.mapping.total_fields.limit: 10000

    setup.template.enabled: true
    setup.template.name: "wazuh"
    setup.template.pattern: "wazuh-alerts-*"
    setup.template.fields: "/etc/filebeat/fields.yml"
    setup.template.overwrite: true

    setup.ilm.enabled: true
    setup.ilm.rollover_alias: "wazuh-alerts"
    setup.ilm.pattern: "{now/d}-000001"
    setup.ilm.policy: "wazuh-policy"

    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat
      keepfiles: 7
      permissions: 0644

    processors:
    - add_host_metadata:
        when.not.contains.tags: forwarded
    - add_cloud_metadata: ~
    - add_docker_metadata: ~
    - add_kubernetes_metadata: ~

