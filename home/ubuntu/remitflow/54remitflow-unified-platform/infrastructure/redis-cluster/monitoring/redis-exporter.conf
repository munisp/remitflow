# Redis Exporter Configuration

# Redis connection
redis.addr=redis://localhost:6379
redis.password=remittance-redis-password

# Metrics
check-keys=*
check-single-keys=key1,key2
script=/path/to/redis-script.lua

# Export settings
namespace=redis
web.listen-address=:9121
web.telemetry-path=/metrics

# Logging
log.level=info
log.format=logfmt
