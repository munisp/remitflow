# Kafka 5/5 Bank-Grade Cluster Configuration
# High Availability, Performance, Security, Observability, Disaster Recovery
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
---
# Kafka Broker Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka
data:
  server.properties: |
    # Broker Configuration
    broker.id=${KAFKA_BROKER_ID}
    broker.rack=${KAFKA_BROKER_RACK}
    
    # Network
    listeners=INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
    advertised.listeners=INTERNAL://${POD_NAME}.kafka-headless.kafka.svc.cluster.local:9092,EXTERNAL://${EXTERNAL_HOST}:9093
    listener.security.protocol.map=INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:SASL_SSL
    inter.broker.listener.name=INTERNAL
    controller.listener.names=CONTROLLER
    
    # Replication - Bank Grade
    default.replication.factor=3
    min.insync.replicas=2
    unclean.leader.election.enable=false
    auto.create.topics.enable=false
    delete.topic.enable=true
    
    # Log Configuration
    num.partitions=12
    log.retention.hours=168
    log.retention.bytes=-1
    log.segment.bytes=1073741824
    log.cleanup.policy=delete
    
    # Message Size
    message.max.bytes=10485760
    replica.fetch.max.bytes=10485760
    
    # Security - SASL/SCRAM
    sasl.enabled.mechanisms=SCRAM-SHA-512
    sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
    
    # SSL/TLS
    ssl.keystore.location=/certs/kafka.keystore.jks
    ssl.keystore.password=${SSL_KEYSTORE_PASSWORD}
    ssl.key.password=${SSL_KEY_PASSWORD}
    ssl.truststore.location=/certs/kafka.truststore.jks
    ssl.truststore.password=${SSL_TRUSTSTORE_PASSWORD}
    ssl.client.auth=required
    ssl.endpoint.identification.algorithm=https
    
    # ACLs
    authorizer.class.name=kafka.security.authorizer.AclAuthorizer
    super.users=User:admin
    allow.everyone.if.no.acl.found=false
    
    # Performance Tuning
    num.network.threads=8
    num.io.threads=16
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    num.replica.fetchers=4
    replica.fetch.min.bytes=1
    replica.fetch.wait.max.ms=500
    
    # Compression
    compression.type=producer
    
    # Transactions
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    
    # Offsets
    offsets.topic.replication.factor=3
    offsets.topic.num.partitions=50
    
    # Group Coordinator
    group.initial.rebalance.delay.ms=3000
    
    # Metrics
    metric.reporters=io.confluent.metrics.reporter.ConfluentMetricsReporter
    confluent.metrics.reporter.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
    
  log4j.properties: |
    log4j.rootLogger=INFO, stdout
    log4j.appender.stdout=org.apache.log4j.ConsoleAppender
    log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
    log4j.appender.stdout.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c %x - %m%n
    log4j.logger.kafka=INFO
    log4j.logger.org.apache.kafka=INFO
    log4j.logger.kafka.authorizer.logger=INFO
---
# Kafka StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kafka
                topologyKey: topology.kubernetes.io/zone
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: internal
            - containerPort: 9093
              name: external
            - containerPort: 9094
              name: controller
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKER_RACK
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/zone']
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx4g -Xms4g"
            - name: KAFKA_JMX_PORT
              value: "9999"
            - name: KAFKA_JMX_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: kafka-secrets
          resources:
            requests:
              memory: "6Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: config
              mountPath: /etc/kafka/server.properties
              subPath: server.properties
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kafka-broker-api-versions --bootstrap-server localhost:9092 --command-config /etc/kafka/client.properties"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: jmx-exporter
          image: bitnami/jmx-exporter:0.19.0
          ports:
            - containerPort: 9308
              name: metrics
          args:
            - "9308"
            - /etc/jmx-exporter/kafka.yml
          volumeMounts:
            - name: jmx-config
              mountPath: /etc/jmx-exporter
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: kafka-config
        - name: certs
          secret:
            secretName: kafka-tls
        - name: jmx-config
          configMap:
            name: kafka-jmx-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 500Gi
---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
    - name: external
      port: 9093
      targetPort: 9093
---
# Client Service
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
---
# JMX Exporter ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jmx-config
  namespace: kafka
data:
  kafka.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          topic: "$4"
          partition: "$5"
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          broker: "$4:$5"
      - pattern: kafka.server<type=(.+), name=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
      - pattern: kafka.server<type=(.+), name=(.+)><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
      - pattern: kafka.controller<type=(.+), name=(.+)><>Value
        name: kafka_controller_$1_$2
        type: GAUGE
      - pattern: kafka.network<type=(.+), name=(.+), request=(.+)><>Count
        name: kafka_network_$1_$2_total
        type: COUNTER
        labels:
          request: "$3"
      - pattern: kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value
        name: kafka_log_$1_$2
        type: GAUGE
        labels:
          topic: "$3"
          partition: "$4"
---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-pdb
  namespace: kafka
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kafka
---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-network-policy
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kafka-access: "true"
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9094
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: zookeeper
      ports:
        - protocol: TCP
          port: 2181
---
# Kafka Topics for Remittance Platform
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics
  namespace: kafka
data:
  create-topics.sh: |
    #!/bin/bash
    set -e
    
    BOOTSTRAP_SERVER="kafka-0.kafka-headless.kafka.svc.cluster.local:9092"
    
    # Transaction Events
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic transactions.created --partitions 12 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic transactions.completed --partitions 12 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic transactions.failed --partitions 12 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    # Payment Events
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic payments.initiated --partitions 12 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic payments.settled --partitions 12 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    # KYC Events
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic kyc.verification.requested --partitions 6 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic kyc.verification.completed --partitions 6 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    # Notification Events
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic notifications.email --partitions 6 --replication-factor 3 \
      --config retention.ms=86400000 --config min.insync.replicas=2
    
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic notifications.sms --partitions 6 --replication-factor 3 \
      --config retention.ms=86400000 --config min.insync.replicas=2
    
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic notifications.push --partitions 6 --replication-factor 3 \
      --config retention.ms=86400000 --config min.insync.replicas=2
    
    # Audit Events (long retention)
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic audit.events --partitions 12 --replication-factor 3 \
      --config retention.ms=31536000000 --config min.insync.replicas=2
    
    # Mojaloop Events
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic mojaloop.transfers --partitions 12 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic mojaloop.callbacks --partitions 12 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    # TigerBeetle Sync Events
    kafka-topics --bootstrap-server $BOOTSTRAP_SERVER --create --if-not-exists \
      --topic tigerbeetle.sync --partitions 6 --replication-factor 3 \
      --config retention.ms=604800000 --config min.insync.replicas=2
    
    echo "All topics created successfully"
---
# Prometheus ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
# Kafka Consumer Lag Alert
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kafka-alerts
  namespace: kafka
spec:
  groups:
    - name: kafka
      rules:
        - alert: KafkaConsumerLagHigh
          expr: kafka_consumer_group_lag > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kafka consumer lag is high"
            description: "Consumer group {{ $labels.consumer_group }} has lag of {{ $value }} on topic {{ $labels.topic }}"
        - alert: KafkaConsumerLagCritical
          expr: kafka_consumer_group_lag > 100000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kafka consumer lag is critical"
            description: "Consumer group {{ $labels.consumer_group }} has lag of {{ $value }} on topic {{ $labels.topic }}"
        - alert: KafkaBrokerDown
          expr: kafka_server_replicamanager_leadercount == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Kafka broker is down"
            description: "Kafka broker {{ $labels.instance }} has no leader partitions"
        - alert: KafkaUnderReplicatedPartitions
          expr: kafka_server_replicamanager_underreplicatedpartitions > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kafka has under-replicated partitions"
            description: "Broker {{ $labels.instance }} has {{ $value }} under-replicated partitions"
