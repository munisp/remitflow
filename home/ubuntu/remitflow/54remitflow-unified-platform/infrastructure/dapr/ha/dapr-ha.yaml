apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config-ha
  namespace: default
spec:
  ha:
    enabled: true
    replicaCount: 3
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://jaeger-collector.observability.svc.cluster.local:9411/api/v2/spans"
  metric:
    enabled: true
