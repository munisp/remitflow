apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mojaloop-pubsub
  namespace: mojaloop
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka-0.kafka-headless.kafka.svc.cluster.local:9092,kafka-1.kafka-headless.kafka.svc.cluster.local:9092,kafka-2.kafka-headless.kafka.svc.cluster.local:9092"
    - name: consumerGroup
      value: "mojaloop-consumer-group"
    - name: authType
      value: "none"
    - name: maxMessageBytes
      value: "10485760"
    - name: consumeRetryInterval
      value: "1000ms"
    - name: version
      value: "2.8.0"
    - name: initialOffset
      value: "oldest"
    - name: disableTls
      value: "true"
---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: mojaloop-transfers-subscription
  namespace: mojaloop
spec:
  pubsubname: mojaloop-pubsub
  topic: mojaloop.transfers
  route: /events/transfers
  scopes:
    - central-ledger
    - transfer-service
    - settlement-service
    - notification-service
---
