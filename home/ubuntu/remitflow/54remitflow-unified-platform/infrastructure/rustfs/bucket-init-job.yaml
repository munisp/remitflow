apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: rustfs
  labels:
    app.kubernetes.io/name: rustfs-bucket-init
    app.kubernetes.io/component: initialization
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-bucket-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-rustfs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RustFS to be ready..."
              until wget -q -O- http://rustfs.rustfs.svc.cluster.local:9000/minio/health/ready; do
                echo "RustFS not ready yet, waiting..."
                sleep 5
              done
              echo "RustFS is ready!"
      containers:
        - name: bucket-init
          image: rustfs/rustfs:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "Configuring RustFS client..."
              mc alias set rustfs http://rustfs.rustfs.svc.cluster.local:9000 $RUSTFS_ROOT_USER $RUSTFS_ROOT_PASSWORD
              
              echo "Creating platform buckets..."
              
              # KYC Documents bucket
              mc mb --ignore-existing rustfs/kyc-documents
              mc version enable rustfs/kyc-documents
              
              # Property KYC Documents bucket
              mc mb --ignore-existing rustfs/property-kyc-documents
              mc version enable rustfs/property-kyc-documents
              
              # ML Models bucket
              mc mb --ignore-existing rustfs/ml-models
              mc version enable rustfs/ml-models
              
              # ML Artifacts bucket
              mc mb --ignore-existing rustfs/ml-artifacts
              
              # Lakehouse buckets
              mc mb --ignore-existing rustfs/lakehouse-bronze
              mc mb --ignore-existing rustfs/lakehouse-silver
              mc mb --ignore-existing rustfs/lakehouse-gold
              
              # Audit logs bucket
              mc mb --ignore-existing rustfs/audit-logs
              mc ilm rule add --expire-days 365 rustfs/audit-logs
              
              # Backups bucket
              mc mb --ignore-existing rustfs/backups
              mc ilm rule add --expire-days 90 rustfs/backups
              
              echo "Setting bucket policies..."
              
              # Set lifecycle policies for lakehouse
              mc ilm rule add --expire-days 90 rustfs/lakehouse-bronze
              mc ilm rule add --expire-days 365 rustfs/lakehouse-silver
              mc ilm rule add --expire-days 1825 rustfs/lakehouse-gold
              
              echo "All buckets initialized successfully!"
              
              # List all buckets
              echo "Current buckets:"
              mc ls rustfs/
          env:
            - name: RUSTFS_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ROOT_USER
            - name: RUSTFS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ROOT_PASSWORD
