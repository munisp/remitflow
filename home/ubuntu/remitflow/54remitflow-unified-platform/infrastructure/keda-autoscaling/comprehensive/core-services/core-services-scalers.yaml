apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tigerbeetle-ledger-scaler
  namespace: remittance-platform
  labels:
    app: tigerbeetle-ledger
    tier: core
    component: financial-ledger
spec:
  scaleTargetRef:
    name: tigerbeetle-ledger
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 3
  maxReplicaCount: 20
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 10
            periodSeconds: 60
          - type: Pods
            value: 1
            periodSeconds: 60
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 5
            periodSeconds: 15
          selectPolicy: Max
  triggers:
  # Transaction Volume (Primary Trigger)
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: tigerbeetle_transaction_rate
      threshold: "10000"
      query: rate(tigerbeetle_transactions_total[1m])
  
  # Account Creation Rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: tigerbeetle_account_creation_rate
      threshold: "100"
      query: rate(tigerbeetle_accounts_created_total[1m])
  
  # Balance Query Load
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: tigerbeetle_balance_queries_rate
      threshold: "5000"
      query: rate(tigerbeetle_balance_queries_total[1m])
  
  # Cross-Border Transfer Volume
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: tigerbeetle_crossborder_rate
      threshold: "500"
      query: rate(tigerbeetle_crossborder_transfers_total[1m])
  
  # CPU Utilization
  - type: cpu
    metadata:
      type: Utilization
      value: "60"
  
  # Memory Utilization
  - type: memory
    metadata:
      type: Utilization
      value: "70"
  
  # Custom Business Metric: Revenue Impact
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: revenue_impact_per_second
      threshold: "1000"
      query: rate(transaction_revenue_usd_total[1m])
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-gateway-scaler
  namespace: remittance-platform
  labels:
    app: api-gateway
    tier: core
    component: gateway
spec:
  scaleTargetRef:
    name: api-gateway
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 15
  triggers:
  # HTTP Request Rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: http_requests_per_second
      threshold: "1000"
      query: rate(http_requests_total{service="api-gateway"}[1m])
  
  # Response Time (Scale up if slow)
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: response_time_p95
      threshold: "0.5"
      query: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service="api-gateway"}[1m]))
  
  # Error Rate (Scale up if errors increase)
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: error_rate_percentage
      threshold: "5"
      query: rate(http_requests_total{service="api-gateway",status=~"5.."}[1m]) / rate(http_requests_total{service="api-gateway"}[1m]) * 100
  
  # Active Connections
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: active_connections
      threshold: "500"
      query: nginx_connections_active{service="api-gateway"}
  
  # CPU and Memory
  - type: cpu
    metadata:
      type: Utilization
      value: "70"
  - type: memory
    metadata:
      type: Utilization
      value: "80"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: user-management-scaler
  namespace: remittance-platform
  labels:
    app: user-management
    tier: core
    component: user-service
spec:
  scaleTargetRef:
    name: user-management
  pollingInterval: 30
  cooldownPeriod: 180
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
  # User Registration Rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: user_registration_rate
      threshold: "50"
      query: rate(user_registrations_total[1m])
  
  # KYC Processing Load
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: kyc_processing_rate
      threshold: "20"
      query: rate(kyc_verifications_total[1m])
  
  # Authentication Requests
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: auth_requests_rate
      threshold: "200"
      query: rate(auth_requests_total[1m])
  
  # Database Connection Pool Usage
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: db_connection_utilization
      threshold: "0.8"
      query: postgres_connections_active / postgres_connections_max
  
  - type: cpu
    metadata:
      type: Utilization
      value: "70"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaler
  namespace: remittance-platform
  labels:
    app: notification-service
    tier: core
    component: notifications
spec:
  scaleTargetRef:
    name: notification-service
  pollingInterval: 20
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 12
  triggers:
  # Message Queue Length (Primary Trigger)
  - type: redis
    metadata:
      address: redis:6379
      listName: notification_queue
      listLength: "100"
  
  # Email Send Rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: email_send_rate
      threshold: "500"
      query: rate(emails_sent_total[1m])
  
  # SMS Send Rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: sms_send_rate
      threshold: "200"
      query: rate(sms_sent_total[1m])
  
  # Push Notification Rate
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: push_notification_rate
      threshold: "1000"
      query: rate(push_notifications_sent_total[1m])
  
  # Failed Delivery Rate (Scale up to handle retries)
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: notification_failure_rate
      threshold: "10"
      query: rate(notification_failures_total[1m])
  
  - type: cpu
    metadata:
      type: Utilization
      value: "75"
