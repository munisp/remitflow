apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-config
  namespace: keda-system
data:
  # Global KEDA Configuration
  config.yaml: |
    operator:
      # Metrics server configuration
      metricsBindAddress: ":8080"
      healthProbeBindAddress: ":8081"
      
      # Scaling configuration
      scalingModifiers:
        # Global scaling behavior
        stabilizationWindowSeconds: 300
        scaleDownStabilizationWindowSeconds: 300
        scaleUpStabilizationWindowSeconds: 60
        
        # Rate limiting
        maxScaleUpRate: 100
        maxScaleDownRate: 50
        
        # Resource limits
        maxConcurrentReconciles: 50
        
      # Prometheus configuration
      prometheus:
        enabled: true
        port: 9090
        path: /metrics
        
      # Logging configuration
      logging:
        level: info
        format: json
        
    # Webhook configuration
    webhook:
      port: 9443
      certDir: /tmp/k8s-webhook-server/serving-certs
      
    # Metrics configuration
    metrics:
      # Custom metrics collection interval
      interval: 30s
      
      # Metrics retention
      retention: 24h
      
      # External metrics adapters
      adapters:
        prometheus:
          enabled: true
          url: http://prometheus:9090
          
        redis:
          enabled: true
          addresses:
            - redis:6379
            
        postgresql:
          enabled: true
          connectionString: "postgresql://user:password@postgres:5432/metrics"
---
apiVersion: v1
kind: Secret
metadata:
  name: keda-prometheus-config
  namespace: keda-system
type: Opaque
stringData:
  prometheus-url: "http://prometheus:9090"
  prometheus-auth-token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: keda-redis-config
  namespace: keda-system
type: Opaque
stringData:
  redis-address: "redis:6379"
  redis-password: ""
