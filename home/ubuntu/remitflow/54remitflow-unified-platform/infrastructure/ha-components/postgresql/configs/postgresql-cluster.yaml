apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-schema-setup
  namespace: postgres-system
  labels:
    app: postgres-schema-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: postgres-setup
        image: postgres:15.4
        command:
        - sh
        - -c
        - |
          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL to be ready..."
          while ! pg_isready -h postgres-service -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 10
          done
          
          # Run schema setup
          echo "Setting up banking schema..."
          psql -h postgres-service -U postgres -f /tmp/banking-schema.sql
          
          echo "PostgreSQL banking schema setup completed successfully!"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: postgres-password
        volumeMounts:
        - name: schema-files
          mountPath: /tmp/banking-schema.sql
          subPath: banking-schema.sql
      volumes:
      - name: schema-files
        configMap:
          name: postgres-config

