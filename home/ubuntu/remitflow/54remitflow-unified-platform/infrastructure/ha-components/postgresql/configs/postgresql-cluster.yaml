# PostgreSQL High-Availability Cluster Configuration for Remittance Platform
# Enterprise-grade PostgreSQL cluster optimized for Nigerian banking workloads

apiVersion: v1
kind: Namespace
metadata:
  name: postgres-system
  labels:
    name: postgres-system
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: postgres-system
  labels:
    app: postgresql
data:
  postgresql.conf: |
    # PostgreSQL Configuration for Remittance Platform
    
    # Connection Settings
    listen_addresses = '*'
    port = 5432
    max_connections = 500
    superuser_reserved_connections = 10
    
    # Memory Settings (optimized for banking workloads)
    shared_buffers = 2GB
    effective_cache_size = 6GB
    maintenance_work_mem = 512MB
    work_mem = 32MB
    wal_buffers = 64MB
    
    # Checkpoint Settings
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 15min
    max_wal_size = 4GB
    min_wal_size = 1GB
    
    # WAL Settings for Replication
    wal_level = replica
    max_wal_senders = 10
    max_replication_slots = 10
    hot_standby = on
    hot_standby_feedback = on
    
    # Archive Settings
    archive_mode = on
    archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
    archive_timeout = 300
    
    # Logging Settings (for banking compliance)
    logging_collector = on
    log_destination = 'stderr'
    log_directory = '/var/log/postgresql'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_truncate_on_rotation = on
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_statement = 'mod'
    log_min_duration_statement = 1000
    
    # Performance Settings
    random_page_cost = 1.1
    effective_io_concurrency = 200
    max_worker_processes = 8
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 4
    
    # Autovacuum Settings
    autovacuum = on
    autovacuum_max_workers = 4
    autovacuum_naptime = 30s
    autovacuum_vacuum_threshold = 100
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    
    # Lock Settings
    deadlock_timeout = 1s
    lock_timeout = 30s
    statement_timeout = 300s
    
    # Nigerian Banking Specific Settings
    timezone = 'Africa/Lagos'
    datestyle = 'iso, mdy'
    default_text_search_config = 'pg_catalog.english'
    
    # Security Settings
    ssl = on
    ssl_cert_file = '/etc/ssl/certs/server.crt'
    ssl_key_file = '/etc/ssl/private/server.key'
    ssl_ca_file = '/etc/ssl/certs/ca.crt'
    ssl_crl_file = '/etc/ssl/certs/server.crl'
    password_encryption = scram-sha-256
    
    # Replication Settings
    synchronous_standby_names = '*'
    synchronous_commit = on
    
    # Shared Preload Libraries
    shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_cron'
    
    # Extensions Settings
    auto_explain.log_min_duration = 5s
    auto_explain.log_analyze = on
    auto_explain.log_buffers = on
    auto_explain.log_timing = on
    auto_explain.log_triggers = on
    auto_explain.log_verbose = on
    auto_explain.log_nested_statements = on
    
    # pg_stat_statements Settings
    pg_stat_statements.max = 10000
    pg_stat_statements.track = all
    pg_stat_statements.track_utility = on
    pg_stat_statements.save = on
    
    # pg_cron Settings
    cron.database_name = 'banking'

  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # Local connections
    local   all             all                                     peer
    
    # IPv4 local connections
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             172.16.0.0/12           scram-sha-256
    host    all             all             192.168.0.0/16          scram-sha-256
    
    # IPv6 local connections
    host    all             all             ::1/128                 scram-sha-256
    
    # Kubernetes cluster connections
    host    all             all             0.0.0.0/0               scram-sha-256
    
    # Replication connections
    host    replication     replicator      10.0.0.0/8              scram-sha-256
    host    replication     replicator      172.16.0.0/12           scram-sha-256
    host    replication     replicator      192.168.0.0/16          scram-sha-256

  banking-schema.sql: |
    -- Banking Schema for Remittance Platform
    -- Comprehensive database schema for Nigerian banking operations
    
    -- Create banking database
    CREATE DATABASE banking WITH 
        ENCODING = 'UTF8'
        LC_COLLATE = 'en_US.UTF-8'
        LC_CTYPE = 'en_US.UTF-8'
        TEMPLATE = template0;
    
    \c banking;
    
    -- Enable required extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";
    CREATE EXTENSION IF NOT EXISTS "btree_gin";
    CREATE EXTENSION IF NOT EXISTS "btree_gist";
    CREATE EXTENSION IF NOT EXISTS "pg_cron";
    
    -- Create schemas
    CREATE SCHEMA IF NOT EXISTS banking;
    CREATE SCHEMA IF NOT EXISTS audit;
    CREATE SCHEMA IF NOT EXISTS reporting;
    CREATE SCHEMA IF NOT EXISTS compliance;
    
    -- Set search path
    SET search_path = banking, public;
    
    -- Create custom types
    CREATE TYPE account_status AS ENUM ('active', 'inactive', 'frozen', 'closed');
    CREATE TYPE transaction_status AS ENUM ('pending', 'processing', 'completed', 'failed', 'reversed');
    CREATE TYPE transaction_type AS ENUM ('deposit', 'withdrawal', 'transfer', 'payment', 'fee', 'interest', 'reversal');
    CREATE TYPE agent_status AS ENUM ('active', 'inactive', 'suspended', 'terminated');
    CREATE TYPE kyc_status AS ENUM ('pending', 'in_progress', 'approved', 'rejected', 'expired');
    CREATE TYPE loan_status AS ENUM ('applied', 'under_review', 'approved', 'disbursed', 'active', 'completed', 'defaulted', 'written_off');
    CREATE TYPE compliance_status AS ENUM ('compliant', 'non_compliant', 'under_review', 'remediated');
    
    -- Organizations table
    CREATE TABLE banking.organizations (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(255) NOT NULL,
        code VARCHAR(50) UNIQUE NOT NULL,
        registration_number VARCHAR(100),
        tax_id VARCHAR(50),
        address JSONB,
        contact_info JSONB,
        regulatory_licenses JSONB,
        status account_status DEFAULT 'active',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- Branches table
    CREATE TABLE banking.branches (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        organization_id UUID NOT NULL REFERENCES banking.organizations(id),
        name VARCHAR(255) NOT NULL,
        code VARCHAR(50) UNIQUE NOT NULL,
        branch_type VARCHAR(50) DEFAULT 'full_service',
        address JSONB NOT NULL,
        contact_info JSONB,
        operating_hours JSONB,
        services_offered TEXT[],
        manager_id UUID,
        status account_status DEFAULT 'active',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- Users table (employees, agents, customers)
    CREATE TABLE banking.users (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        username VARCHAR(100) UNIQUE NOT NULL,
        email VARCHAR(255) UNIQUE NOT NULL,
        phone VARCHAR(20),
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        middle_name VARCHAR(100),
        date_of_birth DATE,
        gender VARCHAR(10),
        nationality VARCHAR(50) DEFAULT 'Nigerian',
        address JSONB,
        identity_documents JSONB,
        bvn VARCHAR(11),
        nin VARCHAR(11),
        user_type VARCHAR(50) NOT NULL, -- employee, agent, customer
        organization_id UUID REFERENCES banking.organizations(id),
        branch_id UUID REFERENCES banking.branches(id),
        roles TEXT[],
        permissions JSONB,
        kyc_status kyc_status DEFAULT 'pending',
        kyc_documents JSONB,
        kyc_verified_at TIMESTAMP WITH TIME ZONE,
        kyc_verified_by UUID,
        status account_status DEFAULT 'active',
        last_login TIMESTAMP WITH TIME ZONE,
        password_hash VARCHAR(255),
        password_changed_at TIMESTAMP WITH TIME ZONE,
        failed_login_attempts INTEGER DEFAULT 0,
        locked_until TIMESTAMP WITH TIME ZONE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- Accounts table
    CREATE TABLE banking.accounts (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        account_number VARCHAR(20) UNIQUE NOT NULL,
        account_name VARCHAR(255) NOT NULL,
        account_type VARCHAR(50) NOT NULL, -- savings, current, fixed_deposit, loan
        currency VARCHAR(3) DEFAULT 'NGN',
        balance DECIMAL(20,2) DEFAULT 0.00,
        available_balance DECIMAL(20,2) DEFAULT 0.00,
        minimum_balance DECIMAL(20,2) DEFAULT 0.00,
        maximum_balance DECIMAL(20,2),
        daily_transaction_limit DECIMAL(20,2),
        monthly_transaction_limit DECIMAL(20,2),
        customer_id UUID NOT NULL REFERENCES banking.users(id),
        branch_id UUID NOT NULL REFERENCES banking.branches(id),
        product_code VARCHAR(50),
        interest_rate DECIMAL(5,4),
        maturity_date DATE,
        authorized_signatories UUID[],
        joint_account_holders UUID[],
        status account_status DEFAULT 'active',
        opened_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        closed_at TIMESTAMP WITH TIME ZONE,
        last_transaction_at TIMESTAMP WITH TIME ZONE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- Transactions table
    CREATE TABLE banking.transactions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        transaction_reference VARCHAR(100) UNIQUE NOT NULL,
        transaction_type transaction_type NOT NULL,
        amount DECIMAL(20,2) NOT NULL,
        currency VARCHAR(3) DEFAULT 'NGN',
        description TEXT,
        debit_account_id UUID REFERENCES banking.accounts(id),
        credit_account_id UUID REFERENCES banking.accounts(id),
        external_reference VARCHAR(100),
        channel VARCHAR(50), -- atm, pos, mobile, web, ussd, branch
        location JSONB,
        device_info JSONB,
        ip_address INET,
        user_agent TEXT,
        initiated_by UUID REFERENCES banking.users(id),
        processed_by UUID REFERENCES banking.users(id),
        approved_by UUID REFERENCES banking.users(id),
        branch_id UUID REFERENCES banking.branches(id),
        agent_id UUID REFERENCES banking.users(id),
        pos_terminal_id UUID,
        status transaction_status DEFAULT 'pending',
        failure_reason TEXT,
        fees DECIMAL(20,2) DEFAULT 0.00,
        charges JSONB,
        exchange_rate DECIMAL(10,6),
        value_date DATE,
        posting_date DATE,
        reversal_reference VARCHAR(100),
        parent_transaction_id UUID REFERENCES banking.transactions(id),
        fraud_score DECIMAL(5,4),
        fraud_indicators JSONB,
        compliance_flags TEXT[],
        regulatory_reporting JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        processed_at TIMESTAMP WITH TIME ZONE,
        completed_at TIMESTAMP WITH TIME ZONE
    );
    
    -- Agents table
    CREATE TABLE banking.agents (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID NOT NULL REFERENCES banking.users(id),
        agent_code VARCHAR(50) UNIQUE NOT NULL,
        business_name VARCHAR(255),
        business_registration VARCHAR(100),
        business_address JSONB,
        territory VARCHAR(100),
        supervisor_id UUID REFERENCES banking.users(id),
        territory_manager_id UUID REFERENCES banking.users(id),
        branch_id UUID NOT NULL REFERENCES banking.branches(id),
        commission_structure JSONB,
        float_limit DECIMAL(20,2),
        current_float DECIMAL(20,2) DEFAULT 0.00,
        daily_transaction_limit DECIMAL(20,2),
        monthly_transaction_limit DECIMAL(20,2),
        services_offered TEXT[],
        operating_hours JSONB,
        location JSONB,
        onboarding_date DATE,
        training_completed BOOLEAN DEFAULT FALSE,
        certification_expiry DATE,
        performance_metrics JSONB,
        status agent_status DEFAULT 'active',
        suspended_at TIMESTAMP WITH TIME ZONE,
        suspended_by UUID,
        suspension_reason TEXT,
        terminated_at TIMESTAMP WITH TIME ZONE,
        terminated_by UUID,
        termination_reason TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- POS Terminals table
    CREATE TABLE banking.pos_terminals (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        terminal_id VARCHAR(50) UNIQUE NOT NULL,
        serial_number VARCHAR(100) UNIQUE NOT NULL,
        model VARCHAR(100),
        manufacturer VARCHAR(100),
        agent_id UUID REFERENCES banking.agents(id),
        branch_id UUID REFERENCES banking.branches(id),
        location JSONB,
        configuration JSONB,
        last_heartbeat TIMESTAMP WITH TIME ZONE,
        software_version VARCHAR(50),
        hardware_version VARCHAR(50),
        encryption_keys JSONB,
        certificates JSONB,
        status account_status DEFAULT 'active',
        deployed_at TIMESTAMP WITH TIME ZONE,
        last_maintenance TIMESTAMP WITH TIME ZONE,
        next_maintenance DATE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- Loans table
    CREATE TABLE banking.loans (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        loan_number VARCHAR(50) UNIQUE NOT NULL,
        customer_id UUID NOT NULL REFERENCES banking.users(id),
        branch_id UUID NOT NULL REFERENCES banking.branches(id),
        loan_officer_id UUID REFERENCES banking.users(id),
        product_code VARCHAR(50),
        loan_type VARCHAR(50), -- personal, business, mortgage, agriculture
        principal_amount DECIMAL(20,2) NOT NULL,
        interest_rate DECIMAL(5,4) NOT NULL,
        term_months INTEGER NOT NULL,
        repayment_frequency VARCHAR(20) DEFAULT 'monthly', -- daily, weekly, monthly
        disbursement_account_id UUID REFERENCES banking.accounts(id),
        repayment_account_id UUID REFERENCES banking.accounts(id),
        collateral JSONB,
        guarantors JSONB,
        purpose TEXT,
        application_date DATE,
        approval_date DATE,
        disbursement_date DATE,
        maturity_date DATE,
        outstanding_balance DECIMAL(20,2),
        accrued_interest DECIMAL(20,2),
        penalty_amount DECIMAL(20,2),
        last_payment_date DATE,
        next_payment_date DATE,
        payment_amount DECIMAL(20,2),
        days_past_due INTEGER DEFAULT 0,
        classification VARCHAR(50) DEFAULT 'performing', -- performing, watch, substandard, doubtful, loss
        provision_amount DECIMAL(20,2),
        status loan_status DEFAULT 'applied',
        approved_by UUID REFERENCES banking.users(id),
        disbursed_by UUID REFERENCES banking.users(id),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- Compliance Records table
    CREATE TABLE compliance.compliance_records (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        record_type VARCHAR(100) NOT NULL, -- aml, kyc, ctr, str, regulatory_report
        entity_type VARCHAR(50) NOT NULL, -- customer, transaction, agent, account
        entity_id UUID NOT NULL,
        regulation VARCHAR(100), -- cbn_aml, ndpr, fatf, etc.
        requirement TEXT NOT NULL,
        status compliance_status DEFAULT 'under_review',
        findings JSONB,
        remediation_actions JSONB,
        evidence JSONB,
        risk_rating VARCHAR(20), -- low, medium, high, critical
        officer_id UUID REFERENCES banking.users(id),
        reviewer_id UUID REFERENCES banking.users(id),
        due_date DATE,
        completed_date DATE,
        next_review_date DATE,
        regulatory_submission JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_by UUID,
        updated_by UUID
    );
    
    -- Fraud Cases table
    CREATE TABLE banking.fraud_cases (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        case_number VARCHAR(50) UNIQUE NOT NULL,
        case_type VARCHAR(50) NOT NULL, -- transaction_fraud, identity_theft, account_takeover
        severity VARCHAR(20) DEFAULT 'medium', -- low, medium, high, critical
        amount_involved DECIMAL(20,2),
        currency VARCHAR(3) DEFAULT 'NGN',
        related_transactions UUID[],
        related_accounts UUID[],
        related_users UUID[],
        detection_method VARCHAR(100), -- rule_based, ml_model, manual_review, customer_report
        detection_timestamp TIMESTAMP WITH TIME ZONE,
        reported_by UUID REFERENCES banking.users(id),
        assigned_analyst UUID REFERENCES banking.users(id),
        assigned_investigator UUID REFERENCES banking.users(id),
        branch_id UUID REFERENCES banking.branches(id),
        description TEXT,
        investigation_notes JSONB,
        evidence JSONB,
        timeline JSONB,
        impact_assessment JSONB,
        recovery_amount DECIMAL(20,2),
        status VARCHAR(50) DEFAULT 'open', -- open, investigating, resolved, closed
        resolution TEXT,
        lessons_learned TEXT,
        preventive_measures JSONB,
        regulatory_notification JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        resolved_at TIMESTAMP WITH TIME ZONE,
        closed_at TIMESTAMP WITH TIME ZONE
    );
    
    -- Audit Logs table
    CREATE TABLE audit.audit_logs (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        table_name VARCHAR(100) NOT NULL,
        operation VARCHAR(10) NOT NULL, -- INSERT, UPDATE, DELETE
        record_id UUID NOT NULL,
        old_values JSONB,
        new_values JSONB,
        changed_fields TEXT[],
        user_id UUID REFERENCES banking.users(id),
        session_id VARCHAR(100),
        ip_address INET,
        user_agent TEXT,
        application VARCHAR(100),
        timestamp TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create indexes for performance
    
    -- Users indexes
    CREATE INDEX idx_users_username ON banking.users(username);
    CREATE INDEX idx_users_email ON banking.users(email);
    CREATE INDEX idx_users_phone ON banking.users(phone);
    CREATE INDEX idx_users_bvn ON banking.users(bvn);
    CREATE INDEX idx_users_nin ON banking.users(nin);
    CREATE INDEX idx_users_branch_id ON banking.users(branch_id);
    CREATE INDEX idx_users_organization_id ON banking.users(organization_id);
    CREATE INDEX idx_users_user_type ON banking.users(user_type);
    CREATE INDEX idx_users_status ON banking.users(status);
    CREATE INDEX idx_users_created_at ON banking.users(created_at);
    
    -- Accounts indexes
    CREATE INDEX idx_accounts_account_number ON banking.accounts(account_number);
    CREATE INDEX idx_accounts_customer_id ON banking.accounts(customer_id);
    CREATE INDEX idx_accounts_branch_id ON banking.accounts(branch_id);
    CREATE INDEX idx_accounts_account_type ON banking.accounts(account_type);
    CREATE INDEX idx_accounts_status ON banking.accounts(status);
    CREATE INDEX idx_accounts_created_at ON banking.accounts(created_at);
    
    -- Transactions indexes
    CREATE INDEX idx_transactions_reference ON banking.transactions(transaction_reference);
    CREATE INDEX idx_transactions_debit_account ON banking.transactions(debit_account_id);
    CREATE INDEX idx_transactions_credit_account ON banking.transactions(credit_account_id);
    CREATE INDEX idx_transactions_type ON banking.transactions(transaction_type);
    CREATE INDEX idx_transactions_status ON banking.transactions(status);
    CREATE INDEX idx_transactions_created_at ON banking.transactions(created_at);
    CREATE INDEX idx_transactions_processed_at ON banking.transactions(processed_at);
    CREATE INDEX idx_transactions_amount ON banking.transactions(amount);
    CREATE INDEX idx_transactions_branch_id ON banking.transactions(branch_id);
    CREATE INDEX idx_transactions_agent_id ON banking.transactions(agent_id);
    CREATE INDEX idx_transactions_channel ON banking.transactions(channel);
    CREATE INDEX idx_transactions_fraud_score ON banking.transactions(fraud_score);
    
    -- Composite indexes for common queries
    CREATE INDEX idx_transactions_account_date ON banking.transactions(debit_account_id, created_at);
    CREATE INDEX idx_transactions_account_status ON banking.transactions(debit_account_id, status);
    CREATE INDEX idx_transactions_branch_date ON banking.transactions(branch_id, created_at);
    CREATE INDEX idx_accounts_customer_type ON banking.accounts(customer_id, account_type);
    CREATE INDEX idx_users_branch_type ON banking.users(branch_id, user_type);
    
    -- GIN indexes for JSONB columns
    CREATE INDEX idx_users_address_gin ON banking.users USING GIN(address);
    CREATE INDEX idx_users_identity_documents_gin ON banking.users USING GIN(identity_documents);
    CREATE INDEX idx_transactions_device_info_gin ON banking.transactions USING GIN(device_info);
    CREATE INDEX idx_transactions_fraud_indicators_gin ON banking.transactions USING GIN(fraud_indicators);
    
    -- Full-text search indexes
    CREATE INDEX idx_users_search ON banking.users USING GIN(to_tsvector('english', first_name || ' ' || last_name || ' ' || COALESCE(email, '')));
    CREATE INDEX idx_accounts_search ON banking.accounts USING GIN(to_tsvector('english', account_name || ' ' || account_number));
    
    -- Create triggers for audit logging
    CREATE OR REPLACE FUNCTION audit.log_changes()
    RETURNS TRIGGER AS $$
    BEGIN
        IF TG_OP = 'INSERT' THEN
            INSERT INTO audit.audit_logs (table_name, operation, record_id, new_values, user_id)
            VALUES (TG_TABLE_NAME, TG_OP, NEW.id, to_jsonb(NEW), NEW.created_by);
            RETURN NEW;
        ELSIF TG_OP = 'UPDATE' THEN
            INSERT INTO audit.audit_logs (table_name, operation, record_id, old_values, new_values, user_id)
            VALUES (TG_TABLE_NAME, TG_OP, NEW.id, to_jsonb(OLD), to_jsonb(NEW), NEW.updated_by);
            RETURN NEW;
        ELSIF TG_OP = 'DELETE' THEN
            INSERT INTO audit.audit_logs (table_name, operation, record_id, old_values, user_id)
            VALUES (TG_TABLE_NAME, TG_OP, OLD.id, to_jsonb(OLD), OLD.updated_by);
            RETURN OLD;
        END IF;
        RETURN NULL;
    END;
    $$ LANGUAGE plpgsql;
    
    -- Create audit triggers for all main tables
    CREATE TRIGGER audit_organizations AFTER INSERT OR UPDATE OR DELETE ON banking.organizations
        FOR EACH ROW EXECUTE FUNCTION audit.log_changes();
    
    CREATE TRIGGER audit_branches AFTER INSERT OR UPDATE OR DELETE ON banking.branches
        FOR EACH ROW EXECUTE FUNCTION audit.log_changes();
    
    CREATE TRIGGER audit_users AFTER INSERT OR UPDATE OR DELETE ON banking.users
        FOR EACH ROW EXECUTE FUNCTION audit.log_changes();
    
    CREATE TRIGGER audit_accounts AFTER INSERT OR UPDATE OR DELETE ON banking.accounts
        FOR EACH ROW EXECUTE FUNCTION audit.log_changes();
    
    CREATE TRIGGER audit_transactions AFTER INSERT OR UPDATE OR DELETE ON banking.transactions
        FOR EACH ROW EXECUTE FUNCTION audit.log_changes();
    
    CREATE TRIGGER audit_agents AFTER INSERT OR UPDATE OR DELETE ON banking.agents
        FOR EACH ROW EXECUTE FUNCTION audit.log_changes();
    
    CREATE TRIGGER audit_loans AFTER INSERT OR UPDATE OR DELETE ON banking.loans
        FOR EACH ROW EXECUTE FUNCTION audit.log_changes();
    
    -- Create function to update timestamps
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    
    -- Create triggers to automatically update updated_at columns
    CREATE TRIGGER update_organizations_updated_at BEFORE UPDATE ON banking.organizations
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_branches_updated_at BEFORE UPDATE ON banking.branches
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_users_updated_at BEFORE UPDATE ON banking.users
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_accounts_updated_at BEFORE UPDATE ON banking.accounts
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_transactions_updated_at BEFORE UPDATE ON banking.transactions
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_agents_updated_at BEFORE UPDATE ON banking.agents
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_loans_updated_at BEFORE UPDATE ON banking.loans
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    -- Create views for reporting
    CREATE VIEW reporting.account_summary AS
    SELECT 
        a.id,
        a.account_number,
        a.account_name,
        a.account_type,
        a.balance,
        a.available_balance,
        a.status,
        u.first_name || ' ' || u.last_name AS customer_name,
        u.email AS customer_email,
        u.phone AS customer_phone,
        b.name AS branch_name,
        b.code AS branch_code,
        a.created_at,
        a.last_transaction_at
    FROM banking.accounts a
    JOIN banking.users u ON a.customer_id = u.id
    JOIN banking.branches b ON a.branch_id = b.id;
    
    CREATE VIEW reporting.transaction_summary AS
    SELECT 
        t.id,
        t.transaction_reference,
        t.transaction_type,
        t.amount,
        t.currency,
        t.description,
        t.status,
        t.channel,
        da.account_number AS debit_account,
        ca.account_number AS credit_account,
        u.first_name || ' ' || u.last_name AS initiated_by_name,
        b.name AS branch_name,
        t.created_at,
        t.processed_at,
        t.completed_at
    FROM banking.transactions t
    LEFT JOIN banking.accounts da ON t.debit_account_id = da.id
    LEFT JOIN banking.accounts ca ON t.credit_account_id = ca.id
    LEFT JOIN banking.users u ON t.initiated_by = u.id
    LEFT JOIN banking.branches b ON t.branch_id = b.id;
    
    -- Create materialized views for performance
    CREATE MATERIALIZED VIEW reporting.daily_transaction_summary AS
    SELECT 
        DATE(created_at) as transaction_date,
        branch_id,
        transaction_type,
        channel,
        COUNT(*) as transaction_count,
        SUM(amount) as total_amount,
        AVG(amount) as average_amount,
        COUNT(CASE WHEN status = 'completed' THEN 1 END) as successful_count,
        COUNT(CASE WHEN status = 'failed' THEN 1 END) as failed_count
    FROM banking.transactions
    WHERE created_at >= CURRENT_DATE - INTERVAL '90 days'
    GROUP BY DATE(created_at), branch_id, transaction_type, channel;
    
    CREATE UNIQUE INDEX idx_daily_summary_unique ON reporting.daily_transaction_summary 
        (transaction_date, branch_id, transaction_type, channel);
    
    -- Create function to refresh materialized views
    CREATE OR REPLACE FUNCTION reporting.refresh_daily_summary()
    RETURNS void AS $$
    BEGIN
        REFRESH MATERIALIZED VIEW CONCURRENTLY reporting.daily_transaction_summary;
    END;
    $$ LANGUAGE plpgsql;
    
    -- Schedule daily refresh of materialized views
    SELECT cron.schedule('refresh-daily-summary', '0 1 * * *', 'SELECT reporting.refresh_daily_summary();');
    
    -- Create database users and permissions
    CREATE USER keycloak_user WITH PASSWORD 'keycloak-db-password';
    CREATE DATABASE keycloak OWNER keycloak_user;
    
    CREATE USER permify_user WITH PASSWORD 'permify-db-password';
    CREATE DATABASE permify OWNER permify_user;
    
    CREATE USER temporal_user WITH PASSWORD 'temporal-db-password';
    CREATE DATABASE temporal OWNER temporal_user;
    
    CREATE USER dapr_user WITH PASSWORD 'dapr-db-password';
    CREATE DATABASE dapr OWNER dapr_user;
    
    -- Grant permissions
    GRANT CONNECT ON DATABASE banking TO keycloak_user, permify_user, temporal_user, dapr_user;
    GRANT USAGE ON SCHEMA banking TO keycloak_user, permify_user, temporal_user, dapr_user;
    GRANT SELECT ON ALL TABLES IN SCHEMA banking TO keycloak_user, permify_user, temporal_user, dapr_user;
    GRANT USAGE ON SCHEMA reporting TO keycloak_user, permify_user, temporal_user, dapr_user;
    GRANT SELECT ON ALL TABLES IN SCHEMA reporting TO keycloak_user, permify_user, temporal_user, dapr_user;

  patroni.yml: |
    # Patroni Configuration for PostgreSQL HA Cluster
    scope: postgres-cluster
    namespace: /postgres-cluster/
    name: postgres-{POD_NAME}
    
    restapi:
      listen: 0.0.0.0:8008
      connect_address: {POD_IP}:8008
      
    etcd:
      hosts: etcd-client.etcd-system.svc.cluster.local:2379
      
    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 30
        maximum_lag_on_failover: 1048576
        master_start_timeout: 300
        synchronous_mode: true
        synchronous_mode_strict: false
        synchronous_node_count: 1
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            max_connections: 500
            shared_buffers: 2GB
            effective_cache_size: 6GB
            maintenance_work_mem: 512MB
            checkpoint_completion_target: 0.9
            wal_buffers: 64MB
            default_statistics_target: 100
            random_page_cost: 1.1
            effective_io_concurrency: 200
            work_mem: 32MB
            min_wal_size: 1GB
            max_wal_size: 4GB
            max_worker_processes: 8
            max_parallel_workers_per_gather: 4
            max_parallel_workers: 8
            max_parallel_maintenance_workers: 4
            wal_level: replica
            hot_standby: "on"
            wal_keep_segments: 8
            max_wal_senders: 10
            max_replication_slots: 10
            wal_log_hints: "on"
            
      initdb:
      - encoding: UTF8
      - data-checksums
      
      pg_hba:
      - host replication replicator 127.0.0.1/32 md5
      - host replication replicator 10.0.0.0/8 md5
      - host replication replicator 172.16.0.0/12 md5
      - host replication replicator 192.168.0.0/16 md5
      - host all all 0.0.0.0/0 md5
      
      users:
        admin:
          password: admin-password-change-in-production
          options:
            - createrole
            - createdb
        replicator:
          password: replicator-password-change-in-production
          options:
            - replication
            
    postgresql:
      listen: 0.0.0.0:5432
      connect_address: {POD_IP}:5432
      data_dir: /var/lib/postgresql/data
      bin_dir: /usr/lib/postgresql/15/bin
      config_dir: /var/lib/postgresql/data
      pgpass: /tmp/pgpass
      authentication:
        replication:
          username: replicator
          password: replicator-password-change-in-production
        superuser:
          username: postgres
          password: postgres-password-change-in-production
        rewind:
          username: replicator
          password: replicator-password-change-in-production
      parameters:
        unix_socket_directories: '/var/run/postgresql'
        
    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false

