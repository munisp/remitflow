apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: postgres-system
data:
  queries.yaml: |
    banking_accounts_total:
      query: "SELECT account_type, status, COUNT(*) as count FROM banking.accounts GROUP BY account_type, status"
      metrics:
        - count:
            usage: "GAUGE"
            description: "Total number of banking accounts by type and status"
      labels:
        - account_type
        - status
    
    banking_transactions_total:
      query: "SELECT transaction_type, status, COUNT(*) as count FROM banking.transactions WHERE created_at >= NOW() - INTERVAL '24 hours' GROUP BY transaction_type, status"
      metrics:
        - count:
            usage: "GAUGE"
            description: "Total number of transactions in last 24 hours by type and status"
      labels:
        - transaction_type
        - status
    
    banking_transaction_volume:
      query: "SELECT transaction_type, SUM(amount) as volume FROM banking.transactions WHERE created_at >= NOW() - INTERVAL '24 hours' AND status = 'completed' GROUP BY transaction_type"
      metrics:
        - volume:
            usage: "GAUGE"
            description: "Total transaction volume in last 24 hours by type"
      labels:
        - transaction_type
    
    banking_agents_status:
      query: "SELECT status, COUNT(*) as count FROM banking.agents GROUP BY status"
      metrics:
        - count:
            usage: "GAUGE"
            description: "Total number of agents by status"
      labels:
        - status
    
    banking_fraud_cases:
      query: "SELECT status, severity, COUNT(*) as count FROM banking.fraud_cases WHERE created_at >= NOW() - INTERVAL '7 days' GROUP BY status, severity"
      metrics:
        - count:
            usage: "GAUGE"
            description: "Total number of fraud cases in last 7 days by status and severity"
      labels:
        - status
        - severity

