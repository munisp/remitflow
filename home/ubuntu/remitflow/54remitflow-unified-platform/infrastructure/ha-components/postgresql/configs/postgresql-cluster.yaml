---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: postgres-system
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: postgres:15.4
            command:
            - sh
            - -c
            - |
              # Create backup directory
              mkdir -p /backup/$(date +%Y-%m-%d)
              
              # Full database backup
              pg_dumpall -h postgres-service -U postgres > /backup/$(date +%Y-%m-%d)/full_backup.sql
              
              # Individual database backups
              pg_dump -h postgres-service -U postgres -d banking > /backup/$(date +%Y-%m-%d)/banking_backup.sql
              pg_dump -h postgres-service -U postgres -d keycloak > /backup/$(date +%Y-%m-%d)/keycloak_backup.sql
              pg_dump -h postgres-service -U postgres -d permify > /backup/$(date +%Y-%m-%d)/permify_backup.sql
              pg_dump -h postgres-service -U postgres -d temporal > /backup/$(date +%Y-%m-%d)/temporal_backup.sql
              
              # Compress backups
              cd /backup/$(date +%Y-%m-%d)
              gzip *.sql
              
              # Clean up old backups (keep 30 days)
              find /backup -type d -mtime +30 -exec rm -rf {} +
              
              echo "Backup completed successfully!"
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres-password
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: postgres-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 200Gi

