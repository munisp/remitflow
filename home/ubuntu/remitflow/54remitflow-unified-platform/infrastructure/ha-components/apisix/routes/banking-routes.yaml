  # Health Check Routes
  - id: "health-checks"
    name: "Service Health Checks"
    uri: "/health/*"
    methods: ["GET"]
    upstream:
      type: roundrobin
      nodes:
        "user-service.remittance.svc.cluster.local:8080": 1
        "transaction-service.remittance.svc.cluster.local:8080": 1
