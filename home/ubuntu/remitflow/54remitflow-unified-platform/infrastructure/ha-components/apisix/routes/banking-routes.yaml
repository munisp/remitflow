# APISIX Banking Routes Configuration
# Comprehensive routing for Remittance Platform services

# Remittance Platform Service Routes
routes:
  # Authentication Service Routes
  - id: "auth-login"
    name: "Authentication Login"
    uri: "/api/v1/auth/login"
    methods: ["POST"]
    upstream:
      type: roundrobin
      nodes:
        "user-service.remittance.svc.cluster.local:8080": 1
        "user-service-backup.remittance.svc.cluster.local:8080": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
        max_age: 86400
      limit-req:
        rate: 10
        burst: 20
        rejected_code: 429
      request-validation:
        body_schema:
          type: object
          properties:
            username:
              type: string
              minLength: 3
            password:
              type: string
              minLength: 6
          required: ["username", "password"]

  - id: "auth-register"
    name: "User Registration"
    uri: "/api/v1/auth/register"
    methods: ["POST"]
    upstream:
      type: roundrobin
      nodes:
        "user-service.remittance.svc.cluster.local:8080": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type"
      limit-req:
        rate: 5
        burst: 10
        rejected_code: 429

  # Transaction Service Routes
  - id: "transaction-create"
    name: "Create Transaction"
    uri: "/api/v1/transactions"
    methods: ["POST"]
    upstream:
      type: roundrobin
      nodes:
        "transaction-service.remittance.svc.cluster.local:8080": 1
        "transaction-service-backup.remittance.svc.cluster.local:8080": 1
    plugins:
      jwt-auth:
        header: "Authorization"
        query: "jwt"
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
      limit-req:
        rate: 100
        burst: 200
        rejected_code: 429
      request-validation:
        body_schema:
          type: object
          properties:
            amount:
              type: number
              minimum: 1
              maximum: 10000000
            currency:
              type: string
              enum: ["NGN"]
            recipient:
              type: string
              minLength: 10
          required: ["amount", "currency", "recipient"]
      prometheus:
        prefer_name: true

  - id: "transaction-status"
    name: "Transaction Status"
    uri: "/api/v1/transactions/*"
    methods: ["GET"]
    upstream:
      type: roundrobin
      nodes:
        "transaction-service.remittance.svc.cluster.local:8080": 1
    plugins:
      jwt-auth: {}
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Authorization"
      limit-req:
        rate: 200
        burst: 400
      proxy-cache:
        cache_zone: "disk_cache_one"
        cache_key: ["$host", "$request_uri"]
        cache_bypass: ["$arg_nocache"]
        cache_method: ["GET"]
        cache_http_status: [200, 301, 404]
        hide_cache_headers: true
        cache_control: false
        cache_ttl: 300

  # Account Service Routes
  - id: "account-balance"
    name: "Account Balance"
    uri: "/api/v1/accounts/*/balance"
    methods: ["GET"]
    upstream:
      type: roundrobin
      nodes:
        "account-services.remittance.svc.cluster.local:8080": 1
    plugins:
      jwt-auth: {}
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Authorization"
      limit-req:
        rate: 300
        burst: 600
      proxy-cache:
        cache_zone: "disk_cache_one"
        cache_key: ["$host", "$request_uri", "$http_authorization"]
        cache_ttl: 60

  - id: "account-create"
    name: "Create Account"
    uri: "/api/v1/accounts"
    methods: ["POST"]
    upstream:
      type: roundrobin
      nodes:
        "account-services.remittance.svc.cluster.local:8080": 1
    plugins:
      jwt-auth: {}
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
      limit-req:
        rate: 20
        burst: 40

  # Agent Management Routes
  - id: "agent-dashboard"
    name: "Agent Dashboard"
