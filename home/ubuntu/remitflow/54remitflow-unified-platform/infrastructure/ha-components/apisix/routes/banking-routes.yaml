  # Edge AI Services Routes
  - id: "ocr-services"
    name: "OCR Document Processing"
    uri: "/api/v1/ocr/*"
    methods: ["POST"]
    upstream:
      type: roundrobin
      nodes:
        "ocr-engines.remittance.svc.cluster.local:5000": 1
    plugins:
      jwt-auth: {}
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
      limit-req:
        rate: 50
        burst: 100
      request-validation:
        body_schema:
          type: object
          properties:
            image_data:
              type: string
            document_type:
              type: string
