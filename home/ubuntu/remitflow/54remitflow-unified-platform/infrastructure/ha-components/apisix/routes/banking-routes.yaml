        allow_methods: "GET,OPTIONS"
        allow_headers: "Authorization"
      limit-req:
        rate: 100
        burst: 200
      proxy-cache:
        cache_ttl: 30

  - id: "agent-network"
    name: "Agent Network Management"
    uri: "/api/v1/agents/*"
    methods: ["GET", "POST", "PUT", "DELETE"]
    upstream:
      type: roundrobin
      nodes:
        "agent-management.remittance.svc.cluster.local:8080": 1
    plugins:
      jwt-auth: {}
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization"
      limit-req:
