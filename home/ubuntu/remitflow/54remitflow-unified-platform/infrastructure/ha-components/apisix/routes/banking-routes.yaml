    methods: ["GET", "POST"]
    upstream:
      type: roundrobin
      nodes:
        "tigerbeetle-api.remittance.svc.cluster.local:8081": 1
    plugins:
      jwt-auth: {}
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
      limit-req:
        rate: 500
        burst: 1000

  - id: "accounting-transfers"
    name: "TigerBeetle Transfers"
    uri: "/api/v1/accounting/transfers/*"
    methods: ["GET", "POST"]
    upstream:
      type: roundrobin
      nodes:
        "tigerbeetle-api.remittance.svc.cluster.local:8081": 1
    plugins:
      jwt-auth: {}
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
      limit-req:
        rate: 1000
        burst: 2000
      prometheus:
