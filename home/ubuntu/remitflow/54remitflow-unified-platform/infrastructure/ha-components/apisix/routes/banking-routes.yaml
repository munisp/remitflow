  # Static Assets Routes
  - id: "frontend-assets"
    name: "Frontend Static Assets"
    uri: "/static/*"
    methods: ["GET"]
    upstream:
      type: roundrobin
      nodes:
        "agent-portal.remittance.svc.cluster.local:3000": 1
        "admin-dashboard.remittance.svc.cluster.local:3000": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,OPTIONS"
      proxy-cache:
        cache_ttl: 3600
      response-rewrite:
        headers:
          set:
            Cache-Control: "public, max-age=3600"
            X-Content-Type-Options: "nosniff"

# Global Plugins Configuration
global_plugins:
  prometheus:
    prefer_name: true
  
  cors:
    allow_origins: "*"
    allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
    allow_headers: "Content-Type,Authorization,X-Requested-With"
    max_age: 86400
  
  limit-req:
    rate: 1000
    burst: 2000
    rejected_code: 429
    rejected_msg: "Rate limit exceeded"
  
  response-rewrite:
    headers:
      set:
        X-Frame-Options: "DENY"
        X-Content-Type-Options: "nosniff"
        X-XSS-Protection: "1; mode=block"
        Strict-Transport-Security: "max-age=31536000; includeSubDomains"

# Upstream Configuration
upstreams:
  - id: "user-service-upstream"
    name: "User Service Cluster"
    type: roundrobin
    nodes:
      "user-service.remittance.svc.cluster.local:8080": 1
      "user-service-backup.remittance.svc.cluster.local:8080": 1
    health_checker:
      active:
        timeout: 5
        http_path: "/health"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          http_failures: 3
      passive:
        healthy:
          http_statuses: [200, 201, 202, 204, 301, 302]
          successes: 3
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 3

  - id: "transaction-service-upstream"
    name: "Transaction Service Cluster"
    type: roundrobin
    nodes:
      "transaction-service.remittance.svc.cluster.local:8080": 1
      "transaction-service-backup.remittance.svc.cluster.local:8080": 1
    health_checker:
      active:
        timeout: 5
        http_path: "/health"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 10
          http_failures: 3

  - id: "ml-services-upstream"
    name: "ML Services Cluster"
    type: roundrobin
    nodes:
      "fraud-detection.remittance.svc.cluster.local:5000": 1
      "customer-analytics.remittance.svc.cluster.local:5000": 1
    health_checker:
      active:
        timeout: 10
        http_path: "/health"
        healthy:
          interval: 15
          successes: 2
        unhealthy:
          interval: 15
          http_failures: 3

# Consumer Configuration for JWT Auth
consumers:
  - username: "remittance-frontend"
    plugins:
      jwt-auth:
        key: "remittance-jwt-key"
        secret: "remittance-jwt-secret"
        algorithm: "HS256"
        exp: 86400

  - username: "mobile-app"
    plugins:
      jwt-auth:
        key: "mobile-app-jwt-key"
        secret: "mobile-app-jwt-secret"
        algorithm: "HS256"
        exp: 86400

  - username: "admin-dashboard"
    plugins:
      jwt-auth:
        key: "admin-dashboard-jwt-key"
        secret: "admin-dashboard-jwt-secret"
        algorithm: "HS256"
        exp: 86400


