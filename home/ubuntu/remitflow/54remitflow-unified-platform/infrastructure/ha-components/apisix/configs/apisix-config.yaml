# APISIX API Gateway Configuration
# High-Availability API Gateway for Remittance Platform
# Optimized for Nigerian Banking Operations

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      - name: "admin"
        key: "edd1c9f034335f136f87ad84b625c8f1"
        role: admin
    enable_admin_cors: true
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    https_admin: false

apisix:
  node_listen:
    - 9080
    - "[::]:9080"
  enable_ipv6: true
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092

  # Nigerian Banking Network Optimizations
  proxy_cache:
    cache_ttl: 10s
    zones:
      - name: "disk_cache_one"
        memory_size: 50m
        disk_size: 1G
        disk_path: "/tmp/disk_cache_one"
        cache_levels: "1:2"

  # SSL Configuration for Banking Security
  ssl:
    enable: true
    listen:
      - port: 9443
        enable_http2: true
    ssl_protocols: "TLSv1.2 TLSv1.3"
    ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    ssl_trusted_certificate: "/usr/local/apisix/conf/cert/ca-bundle.crt"

  # Request/Response Limits for Banking APIs
  client_max_body_size: 10m
  client_body_buffer_size: 128k
  client_header_buffer_size: 64k
  large_client_header_buffers: 4 64k

  # Timeouts optimized for Nigerian network conditions
  keepalive_timeout: 60s
  client_header_timeout: 60s
  client_body_timeout: 60s
  send_timeout: 60s

  # Worker Configuration
  worker_processes: auto
  worker_connections: 10620

etcd:
  host:
    - "http://etcd-0.etcd-headless.remittance.svc.cluster.local:2379"
    - "http://etcd-1.etcd-headless.remittance.svc.cluster.local:2379"
    - "http://etcd-2.etcd-headless.remittance.svc.cluster.local:2379"
  prefix: "/apisix"
  timeout: 30
  startup_retry: 2
  resync_delay: 5
  health_check_timeout: 10
  user: ""
  password: ""
  tls:
    verify: false

# Plugin Configuration
plugins:
  # Core Plugins
  - real-ip
  - ai
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - ext-plugin-pre-req
  - fault-injection
  - mocking
  - serverless-pre-function
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - uri-blocker
  - request-validation
  - openid-connect
  - cas-auth
  - authz-casbin
  - authz-casdoor
  - wolf-rbac
  - ldap-auth
  - hmac-auth
  - basic-auth
  - jwt-auth
  - key-auth
  - consumer-restriction
  - serverless-post-function
  - ext-plugin-post-req
  - ext-plugin-post-resp
  - api-breaker
  - limit-req
  - limit-conn
  - limit-count
  - proxy-cache
  - body-transformer
  - proxy-mirror
  - proxy-rewrite
  - workflow
  - response-rewrite
  - degraphql
  - kafka-proxy
  - grpc-transcode
  - grpc-web
  - public-api
  - prometheus
  - datadog
  - echo
  - loggly
  - http-logger
  - splunk-hec-logging
  - skywalking-logger
  - google-cloud-logging
  - sls-logger
  - tcp-logger
  - kafka-logger
  - rocketmq-logger
  - syslog
  - udp-logger
  - file-logger
  - clickhouse-logger
  - tencent-cloud-cls
  - inspect
  - example-plugin

# Stream Proxy Configuration
stream_plugins:
  - ip-restriction
  - limit-conn
  - mqtt-proxy
  - syslog

# Discovery Configuration
discovery:
  kubernetes:
    service:
      schema: https
      host: ${KUBERNETES_SERVICE_HOST}
      port: ${KUBERNETES_SERVICE_PORT}
    client:
      token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    default_weight: 50
    namespace_selector:
      equal:
        - remittance
        - remittance-system
    label_selector:
      equal:
        app.kubernetes.io/part-of: remittance-network

# Wasm Configuration
wasm:
  plugins:
    - name: "wasm_log"
      priority: 7999
      file: "/usr/local/apisix/wasm/wasm_log.wasm"

# xRPC Configuration
xrpc:
  protocols:
    - name: pingpong

# Nginx Configuration
nginx_config:
  error_log: "/dev/stderr"
  error_log_level: "info"
  worker_processes: auto
  enable_cpu_affinity: true
  worker_rlimit_nofile: 20480
  worker_shutdown_timeout: 240s

  event:
    worker_connections: 10620
    use: epoll
    multi_accept: on
    accept_mutex_delay: 500ms

  http:
    access_log: "/dev/stdout"
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    send_timeout: 10s
    underscores_in_headers: "on"
    real_ip_header: "X-Real-IP"
    real_ip_recursive: "on"
    real_ip_from:
      - 127.0.0.1
      - 'unix:'

    # Gzip Configuration
    gzip: on
    gzip_vary: on
    gzip_min_length: 1024
    gzip_proxied: any
    gzip_comp_level: 6
    gzip_types:
      - text/plain
      - text/css
      - text/xml
      - text/javascript
      - application/json
      - application/javascript
      - application/xml+rss
      - application/atom+xml
      - image/svg+xml

    # Upstream Configuration
    upstream:
      keepalive: 320
      keepalive_requests: 1000
      keepalive_timeout: 60s

# Custom Lua Configuration
custom_lua_shared_dict:
  ipc_shared_dict: 100m
  discovery_shared_dict: 1m
  plugin_limit_req: 10m
  plugin_limit_count: 10m
  plugin_limit_conn: 10m
  internal_status: 10m
  upstream_healthcheck: 10m
  worker_events: 10m
  lrucache_lock: 10m
  balancer_ewma: 10m
  balancer_ewma_locks: 10m
  balancer_ewma_last_touched_at: 10m
  plugin_limit_count_redis_cluster_slot_lock: 1m
  tracing_buffer: 10m
  plugin_api_breaker: 10m
  etcd_cluster_health_check: 10m
  access_tokens: 1m
  ext_plugin: 1m
  tars: 1m
  cas_sessions: 10m

# Banking-Specific Configuration
banking:
  # Nigerian Banking Compliance
  compliance:
    enable_audit_logging: true
    audit_log_format: "json"
    audit_log_file: "/var/log/apisix/banking_audit.log"
    
  # Transaction Limits
  transaction_limits:
    max_amount: 10000000  # 10M NGN
    daily_limit: 50000000  # 50M NGN
    
  # Security Headers
  security_headers:
    x_frame_options: "DENY"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"
    strict_transport_security: "max-age=31536000; includeSubDomains"
    content_security_policy: "default-src 'self'"
    
  # Rate Limiting for Banking APIs
  rate_limiting:
    authentication: 100  # requests per minute
    transaction: 50      # requests per minute
    balance_inquiry: 200 # requests per minute
    general: 1000        # requests per minute

# Health Check Configuration
health_check:
  max_fails: 3
  fail_timeout: 30s
  check_timeout: 3s
  check_interval: 5s
  rise: 2
  fall: 3

# Monitoring Configuration
monitoring:
  prometheus:
    enable: true
    export_uri: "/apisix/prometheus/metrics"
    metric_prefix: "apisix_"
    enable_export_server: true
    export_addr:
      ip: "0.0.0.0"
      port: 9091

  # Grafana Dashboard Integration
  grafana:
    dashboard_url: "http://grafana.remittance.svc.cluster.local:3000"
    
  # Jaeger Tracing
  jaeger:
    endpoint: "http://jaeger-collector.remittance.svc.cluster.local:14268/api/traces"
    sample_ratio: 0.1

