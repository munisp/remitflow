apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse-system
  labels:
    name: lakehouse-system
    app.kubernetes.io/name: lakehouse
    app.kubernetes.io/component: analytics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lakehouse-config
  namespace: lakehouse-system
  labels:
    app: lakehouse
data:
  # Apache Iceberg + Trino Data Lakehouse Configuration
  # High-Availability setup for Remittance Platform Analytics
  
  trino-config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=false
    http-server.http.port=8080
    query.max-memory=50GB
    query.max-memory-per-node=10GB
    query.max-total-memory-per-node=12GB
    discovery.uri=http://trino-coordinator:8080
    
    # Nigerian banking workload optimizations
    query.max-stage-count=150
    query.max-execution-time=30m
    query.max-run-time=30m
    
    # Resource management
    query.low-memory-killer.delay=5m
    query.low-memory-killer.policy=total-reservation-on-blocked-nodes
    
    # Fault tolerance
    retry-policy=TASK
    task-retry-attempts-per-task=4
    retry-initial-delay=10s
    retry-max-delay=1m
    retry-delay-scale-factor=2.0
    
    # Security
    http-server.authentication.type=PASSWORD
    http-server.process-forwarded=true

  trino-worker-config.properties: |
    coordinator=false
    http-server.http.port=8080
    query.max-memory=50GB
    query.max-memory-per-node=10GB
    query.max-total-memory-per-node=12GB
    discovery.uri=http://trino-coordinator:8080
    
    # Worker-specific settings
    task.max-worker-threads=16
    task.min-drivers=32
    
    # Memory management
    memory.heap-headroom-per-node=4GB
    
    # Spill to disk for large queries
    spill-enabled=true
    spiller-spill-path=/tmp/trino/spill
    spiller-max-used-space-threshold=0.9
    spiller-threads=4

  iceberg-catalog.properties: |
    connector.name=iceberg
    iceberg.catalog.type=hive_metastore
    hive.metastore.uri=thrift://hive-metastore:9083
    iceberg.file-format=PARQUET
    iceberg.compression-codec=ZSTD
    
    # S3 storage configuration
    hive.s3.path-style-access=true
    hive.s3.endpoint=${S3_ENDPOINT}
    hive.s3.aws-access-key=${S3_ACCESS_KEY}
    hive.s3.aws-secret-key=${S3_SECRET_KEY}
    
    # Performance optimizations
    iceberg.max-partitions-per-writer=100
    iceberg.target-max-file-size=128MB
    iceberg.unique-table-location=true
    
    # Nigerian banking compliance - data retention
    iceberg.expire-snapshots.min-retention=168h
    iceberg.remove-orphan-files.min-retention=168h

  hive-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://hive-metastore:9083</value>
      </property>
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://remittance-lakehouse/warehouse</value>
      </property>
      <property>
        <name>fs.s3a.endpoint</name>
        <value>${S3_ENDPOINT}</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>${S3_ACCESS_KEY}</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>${S3_SECRET_KEY}</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
    </configuration>

---
# NOTE: Secrets are managed by External Secrets Operator
# See: infrastructure/ha-components/secret-management/kubernetes/platform-secrets.yaml
# The ExternalSecret 'lakehouse-secrets' in namespace 'lakehouse-system' will create
# a Kubernetes Secret with the following keys:
#   - s3-access-key: S3/MinIO access key
#   - s3-secret-key: S3/MinIO secret key
#   - s3-endpoint: S3/MinIO endpoint URL
#   - postgres-password: PostgreSQL password for Hive Metastore
#
# Required AWS Secrets Manager entries:
#   - remittance/lakehouse/s3 (with properties: access-key, secret-key, endpoint)
#   - remittance/lakehouse/database (with property: password)
#
# To deploy without External Secrets (development only), create a Secret manually:
# kubectl create secret generic lakehouse-secrets \
#   --namespace=lakehouse-system \
#   --from-literal=s3-access-key=your-access-key \
#   --from-literal=s3-secret-key=your-secret-key \
#   --from-literal=s3-endpoint=http://minio.minio-system.svc.cluster.local:9000 \
#   --from-literal=postgres-password=your-password
---
apiVersion: v1
kind: Service
metadata:
  name: trino-coordinator
  namespace: lakehouse-system
  labels:
    app: trino
    component: coordinator
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: trino
    component: coordinator

---
apiVersion: v1
kind: Service
metadata:
  name: trino-worker-headless
  namespace: lakehouse-system
  labels:
    app: trino
    component: worker
spec:
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: trino
    component: worker

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: lakehouse-system
  labels:
    app: trino
    component: coordinator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trino
      component: coordinator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: trino
        component: coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/v1/info"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - trino
              - key: component
                operator: In
                values:
                - coordinator
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: trino
        image: trinodb/trino:435
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-endpoint
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-secret-key
        volumeMounts:
        - name: trino-config
          mountPath: /etc/trino/config.properties
          subPath: trino-config.properties
        - name: trino-config
          mountPath: /etc/trino/catalog/iceberg.properties
          subPath: iceberg-catalog.properties
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
          limits:
            memory: "16Gi"
            cpu: "4"
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - "sleep 30"
      volumes:
      - name: trino-config
        configMap:
          name: lakehouse-config

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trino-worker
  namespace: lakehouse-system
  labels:
    app: trino
    component: worker
spec:
  serviceName: trino-worker-headless
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: trino
      component: worker
  template:
    metadata:
      labels:
        app: trino
        component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - trino
                - key: component
                  operator: In
                  values:
                  - worker
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: trino
        image: trinodb/trino:435
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-endpoint
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-secret-key
        volumeMounts:
        - name: trino-config
          mountPath: /etc/trino/config.properties
          subPath: trino-worker-config.properties
        - name: trino-config
          mountPath: /etc/trino/catalog/iceberg.properties
          subPath: iceberg-catalog.properties
        - name: spill-volume
          mountPath: /tmp/trino/spill
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
          limits:
            memory: "32Gi"
            cpu: "8"
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - "sleep 60"
      volumes:
      - name: trino-config
        configMap:
          name: lakehouse-config
  volumeClaimTemplates:
  - metadata:
      name: spill-volume
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: lakehouse-system
  labels:
    app: hive-metastore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hive-metastore
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hive-metastore
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
      - name: hive-metastore
        image: apache/hive:3.1.3
        command:
        - /opt/hive/bin/hive
        - --service
        - metastore
        ports:
        - containerPort: 9083
          name: thrift
        env:
        - name: SERVICE_NAME
          value: metastore
        - name: DB_DRIVER
          value: postgres
        - name: SERVICE_OPTS
          value: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgresql-ha.postgresql-system.svc.cluster.local:5432/hive_metastore -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=$(POSTGRES_PASSWORD)"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: postgres-password
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-endpoint
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: s3-secret-key
        volumeMounts:
        - name: hive-config
          mountPath: /opt/hive/conf/hive-site.xml
          subPath: hive-site.xml
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          tcpSocket:
            port: 9083
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9083
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: hive-config
        configMap:
          name: lakehouse-config

---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: lakehouse-system
  labels:
    app: hive-metastore
spec:
  type: ClusterIP
  ports:
  - name: thrift
    port: 9083
    targetPort: 9083
  selector:
    app: hive-metastore

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trino-coordinator-pdb
  namespace: lakehouse-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trino
      component: coordinator

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trino-worker-pdb
  namespace: lakehouse-system
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: trino
      component: worker

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hive-metastore-pdb
  namespace: lakehouse-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hive-metastore

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lakehouse-network-policy
  namespace: lakehouse-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: remittance-system
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9083
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: postgresql-system
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          name: minio-system
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9083
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trino-worker-hpa
  namespace: lakehouse-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: trino-worker
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 10
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trino-monitor
  namespace: lakehouse-system
  labels:
    app: trino
spec:
  selector:
    matchLabels:
      app: trino
  endpoints:
  - port: http
    interval: 15s
    path: /v1/info

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lakehouse-alerts
  namespace: lakehouse-system
  labels:
    app: lakehouse
spec:
  groups:
  - name: lakehouse.rules
    rules:
    - alert: TrinoCoordinatorDown
      expr: up{job="trino-coordinator"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Trino coordinator is down"
        description: "Trino coordinator {{ $labels.instance }} has been down for more than 1 minute."
    - alert: TrinoWorkerDown
      expr: count(up{job="trino-worker"} == 1) < 3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Trino workers below minimum"
        description: "Less than 3 Trino workers are available."
    - alert: TrinoQueryQueueHigh
      expr: trino_queued_queries > 50
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Trino query queue is high"
        description: "More than 50 queries are queued for more than 10 minutes."
    - alert: HiveMetastoreDown
      expr: up{job="hive-metastore"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Hive Metastore is down"
        description: "Hive Metastore {{ $labels.instance }} has been down for more than 1 minute."
    - alert: TrinoHighMemoryUsage
      expr: (container_memory_usage_bytes{container="trino"} / container_spec_memory_limit_bytes{container="trino"}) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Trino high memory usage"
        description: "Trino container memory usage is above 90%."
