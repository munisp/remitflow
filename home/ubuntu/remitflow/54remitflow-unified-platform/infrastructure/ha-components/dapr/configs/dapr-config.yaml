# Dapr Configuration for Remittance Platform
# High-Availability Distributed Application Runtime optimized for Nigerian banking microservices

apiVersion: v1
kind: Namespace
metadata:
  name: dapr-system
  labels:
    name: dapr-system
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: runtime
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-config
  namespace: dapr-system
  labels:
    app: dapr
data:
  config.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Configuration
    metadata:
      name: banking-config
      namespace: dapr-system
    spec:
      # Tracing configuration for banking compliance and monitoring
      tracing:
        samplingRate: "1"
        otel:
          endpointAddress: "http://jaeger-collector:14268/api/traces"
        zipkin:
          endpointAddress: "http://zipkin:9411/api/v2/spans"
      
      # Metrics configuration for performance monitoring
      metrics:
        enabled: true
        rules:
        - name: banking-transactions
          labels:
          - name: app_id
            regex:
              "transaction-service|payment-service|account-service": "banking-core"
          - name: operation
            regex:
              "transfer|deposit|withdrawal": "financial-operation"
        - name: fraud-detection
          labels:
          - name: app_id
            regex:
              "fraud-detection|risk-assessment": "security-service"
      
      # mTLS configuration for secure service-to-service communication
      mtls:
        enabled: true
        workloadCertTTL: "24h"
        allowedClockSkew: "15m"
        
      # Access control for banking services
      accessControl:
        defaultAction: "deny"
        trustDomain: "remittance.local"
        policies:
        - appId: "transaction-service"
          defaultAction: "allow"
          trustDomain: "remittance.local"
          namespace: "banking-services"
          operations:
          - name: "process-transaction"
            httpVerb: ["POST"]
            action: "allow"
          - name: "get-transaction-status"
            httpVerb: ["GET"]
            action: "allow"
        - appId: "fraud-detection"
          defaultAction: "allow"
          trustDomain: "remittance.local"
          namespace: "banking-services"
          operations:
          - name: "analyze-transaction"
            httpVerb: ["POST"]
            action: "allow"
          - name: "get-risk-score"
            httpVerb: ["GET"]
            action: "allow"
        - appId: "notification-service"
          defaultAction: "allow"
          trustDomain: "remittance.local"
          namespace: "banking-services"
          operations:
          - name: "send-notification"
            httpVerb: ["POST"]
            action: "allow"
        - appId: "customer-service"
          defaultAction: "allow"
          trustDomain: "remittance.local"
          namespace: "banking-services"
          operations:
          - name: "get-customer"
            httpVerb: ["GET"]
            action: "allow"
          - name: "update-customer"
            httpVerb: ["PUT", "PATCH"]
            action: "allow"
      
      # API configuration for Nigerian banking optimizations
      api:
        allowed:
        - name: "state"
          version: "v1"
          protocol: "http"
        - name: "pubsub"
          version: "v1"
          protocol: "http"
        - name: "bindings"
          version: "v1"
          protocol: "http"
        - name: "secrets"
          version: "v1"
          protocol: "http"
        - name: "actors"
          version: "v1"
          protocol: "http"
        - name: "configuration"
          version: "v1"
          protocol: "http"
        - name: "lock"
          version: "v1"
          protocol: "http"
        - name: "workflow"
          version: "v1beta1"
          protocol: "http"
      
      # Component configuration for banking services
      components:
        deny:
        - "bindings.cron"  # Disable cron bindings for security
        - "bindings.twitter"  # Disable social media bindings
      
      # Middleware configuration for banking security
      httpPipeline:
        handlers:
        - name: "oauth2"
          type: "middleware.http.oauth2"
        - name: "ratelimit"
          type: "middleware.http.ratelimit"
        - name: "cors"
          type: "middleware.http.cors"
      
      # Resiliency configuration for Nigerian network conditions
      resiliency:
        policies:
          retries:
            banking-retry:
              policy: "constant"
              duration: "5s"
              maxRetries: 3
          circuitBreakers:
            banking-cb:
              maxRequests: 1
              interval: "8s"
              timeout: "45s"
              trip: "consecutiveFailures >= 5"
          timeouts:
            banking-timeout:
              response: "60s"
        targets:
          apps:
            transaction-service:
              retry: "banking-retry"
              circuitBreaker: "banking-cb"
              timeout: "banking-timeout"
            fraud-detection:
              retry: "banking-retry"
              circuitBreaker: "banking-cb"
              timeout: "banking-timeout"
            notification-service:
              retry: "banking-retry"
              circuitBreaker: "banking-cb"
              timeout: "banking-timeout"
          components:
            statestore:
              retry: "banking-retry"
              circuitBreaker: "banking-cb"
              timeout: "banking-timeout"
            pubsub:
              retry: "banking-retry"
              circuitBreaker: "banking-cb"
              timeout: "banking-timeout"
      
      # Logging configuration for banking compliance
      logging:
        enabled: true
        obfuscateURLs: true
        omitHealthChecks: true
      
      # Features configuration
      features:
      - name: "ServiceInvocation"
        enabled: true
      - name: "StateManagement"
        enabled: true
      - name: "PubSub"
        enabled: true
      - name: "Bindings"
        enabled: true
      - name: "SecretStore"
        enabled: true
      - name: "Configuration"
        enabled: true
      - name: "DistributedLock"
        enabled: true
      - name: "Workflow"
        enabled: true
      - name: "ActorRuntime"
        enabled: true

  components.yaml: |
    # State Store Component - Redis Cluster for banking data
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: statestore
      namespace: dapr-system
    spec:
      type: state.redis
      version: v1
      metadata:
      - name: redisHost
        value: "redis-service.redis-system.svc.cluster.local:6379"
      - name: redisPassword
        secretKeyRef:
          name: dapr-secrets
          key: redis-password
      - name: enableTLS
        value: "true"
      - name: failover
        value: "true"
      - name: sentinelMasterName
        value: "banking-master"
      - name: maxRetries
        value: "3"
      - name: maxRetryBackoff
        value: "2s"
      - name: ttlInSeconds
        value: "3600"
      - name: queryIndexes
        value: |
          [
            {
              "name": "customer_id",
              "indexes": [{"key": "customer_id", "type": "TEXT"}]
            },
            {
              "name": "transaction_id", 
              "indexes": [{"key": "transaction_id", "type": "TEXT"}]
            },
            {
              "name": "account_number",
              "indexes": [{"key": "account_number", "type": "TEXT"}]
            }
          ]
      auth:
        secretStore: kubernetes
    ---
    # Pub/Sub Component - Kafka for banking events
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: pubsub
      namespace: dapr-system
    spec:
      type: pubsub.kafka
      version: v1
      metadata:
      - name: brokers
        value: "kafka-service.kafka-system.svc.cluster.local:9092"
      - name: authType
        value: "sasl_ssl"
      - name: saslUsername
        value: "banking-app"
      - name: saslPassword
        secretKeyRef:
          name: dapr-secrets
          key: kafka-password
      - name: maxMessageBytes
        value: "1048576"
      - name: version
        value: "2.8.0"
      - name: clientID
        value: "dapr-banking-client"
      - name: consumerGroup
        value: "dapr-banking-group"
      - name: disableTls
        value: "false"
      - name: skipVerify
        value: "false"
      - name: caCert
        secretKeyRef:
          name: dapr-secrets
          key: kafka-ca-cert
      - name: clientCert
        secretKeyRef:
          name: dapr-secrets
          key: kafka-client-cert
      - name: clientKey
        secretKeyRef:
          name: dapr-secrets
          key: kafka-client-key
      auth:
        secretStore: kubernetes
    ---
    # Secret Store Component - Kubernetes secrets
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: kubernetes
      namespace: dapr-system
    spec:
      type: secretstores.kubernetes
      version: v1
      metadata:
      - name: vaultKubernetesMountPath
        value: "kubernetes"
      - name: vaultServerURL
        value: "https://vault.vault-system.svc.cluster.local:8200"
      - name: vaultToken
        secretKeyRef:
          name: dapr-secrets
          key: vault-token
    ---
    # Configuration Store Component - Redis for app configuration
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: configstore
      namespace: dapr-system
    spec:
      type: configuration.redis
      version: v1
      metadata:
      - name: redisHost
        value: "redis-service.redis-system.svc.cluster.local:6379"
      - name: redisPassword
        secretKeyRef:
          name: dapr-secrets
          key: redis-password
      - name: enableTLS
        value: "true"
      - name: subscribeKeyPrefix
        value: "banking-config"
    ---
    # Lock Store Component - Redis for distributed locking
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: lockstore
      namespace: dapr-system
    spec:
      type: lock.redis
      version: v1
      metadata:
      - name: redisHost
        value: "redis-service.redis-system.svc.cluster.local:6379"
      - name: redisPassword
        secretKeyRef:
          name: dapr-secrets
          key: redis-password
      - name: enableTLS
        value: "true"
      - name: keyPrefix
        value: "banking-lock"
    ---
    # Binding Component - PostgreSQL for banking data persistence
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: postgres-binding
      namespace: dapr-system
    spec:
      type: bindings.postgresql
      version: v1
      metadata:
      - name: connectionString
        secretKeyRef:
          name: dapr-secrets
          key: postgres-connection-string
      - name: maxOpenConns
        value: "20"
      - name: maxIdleConns
        value: "10"
      - name: connMaxLifetime
        value: "300s"
    ---
    # Workflow Component - Temporal for banking workflows
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: workflow
      namespace: dapr-system
    spec:
      type: workflow.temporal
      version: v1
      metadata:
      - name: hostPort
        value: "temporal-frontend.temporal-system.svc.cluster.local:7233"
      - name: namespace
        value: "banking-workflows"
      - name: taskQueue
        value: "banking-task-queue"
      - name: clientCert
        secretKeyRef:
          name: dapr-secrets
          key: temporal-client-cert
      - name: clientKey
        secretKeyRef:
          name: dapr-secrets
          key: temporal-client-key

  middleware.yaml: |
    # OAuth2 Middleware for banking authentication
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: oauth2
      namespace: dapr-system
    spec:
      type: middleware.http.oauth2
      version: v1
      metadata:
      - name: clientId
        value: "banking-client"
      - name: clientSecret
        secretKeyRef:
          name: dapr-secrets
          key: oauth2-client-secret
      - name: scopes
        value: "banking:read,banking:write,banking:admin"
      - name: authURL
        value: "https://keycloak.keycloak-system.svc.cluster.local/auth/realms/banking/protocol/openid-connect/auth"
      - name: tokenURL
        value: "https://keycloak.keycloak-system.svc.cluster.local/auth/realms/banking/protocol/openid-connect/token"
      - name: redirectURL
        value: "https://banking.agent-network.local/callback"
      - name: authHeaderName
        value: "Authorization"
    ---
    # Rate Limiting Middleware for banking API protection
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: ratelimit
      namespace: dapr-system
    spec:
      type: middleware.http.ratelimit
      version: v1
      metadata:
      - name: maxRequestsPerSecond
        value: "100"
      - name: statusCode
        value: "429"
      - name: statusMessage
        value: "Rate limit exceeded for banking API"
    ---
    # CORS Middleware for banking web applications
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: cors
      namespace: dapr-system
    spec:
      type: middleware.http.cors
      version: v1
      metadata:
      - name: allowOrigins
        value: "https://banking.agent-network.local,https://admin.agent-network.local,https://agent.agent-network.local"
      - name: allowMethods
        value: "GET,POST,PUT,DELETE,OPTIONS"
      - name: allowHeaders
        value: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
      - name: exposeHeaders
        value: "Content-Length,Content-Range"
      - name: maxAge
        value: "86400"
      - name: allowCredentials
        value: "true"

---
