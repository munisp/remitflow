    app: dapr-placement

---
apiVersion: v1
kind: Service
metadata:
  name: dapr-sentry
  namespace: dapr-system
  labels:
    app: dapr-sentry
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 50001
    targetPort: 50001
  - name: metrics
    port: 9090
    targetPort: 9090
  selector:
    app: dapr-sentry

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-operator
  namespace: dapr-system
  labels:
    app: dapr-operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dapr-operator
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
  verbs: ["*"]
- apiGroups: ["dapr.io"]
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dapr-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dapr-operator
subjects:
- kind: ServiceAccount
  name: dapr-operator
  namespace: dapr-system

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dapr-operator-pdb
  namespace: dapr-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dapr-operator

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dapr-sentry-pdb
  namespace: dapr-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dapr-sentry

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dapr-placement-pdb
  namespace: dapr-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dapr-placement

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dapr-network-policy
  namespace: dapr-system
spec:
  podSelector:
    matchLabels:
      app: dapr-operator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: remittance-system
    - podSelector:
        matchLabels:
          app: dapr-sentry
    - podSelector:
        matchLabels:
          app: dapr-placement
    ports:
    - protocol: TCP
      port: 50001
    - protocol: TCP
      port: 50005
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: redis-system
    - namespaceSelector:
        matchLabels:
          name: kafka-system
    - namespaceSelector:
        matchLabels:
          name: temporal-system
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 7233
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

