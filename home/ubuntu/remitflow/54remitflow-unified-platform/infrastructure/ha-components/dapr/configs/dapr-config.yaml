---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-operator
  namespace: dapr-system
  labels:
    app: dapr-operator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dapr-operator
  template:
    metadata:
      labels:
        app: dapr-operator
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - dapr-operator
            topologyKey: kubernetes.io/hostname
      serviceAccountName: dapr-operator
      containers:
      - name: dapr-operator
        image: daprio/dapr:1.12.0
        command:
        - "/manager"
        args:
        - "--config=banking-config"
        - "--log-level=info"
        - "--log-as-json"
        - "--enable-metrics=true"
        - "--metrics-port=9090"
        - "--leader-election"
        ports:
        - containerPort: 9090
          name: metrics
        - containerPort: 8080
          name: health
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DAPR_TRUST_ANCHORS
          value: "/var/run/secrets/dapr.io/tls/ca.crt"
        - name: DAPR_CERT_CHAIN
          value: "/var/run/secrets/dapr.io/tls/tls.crt"
        - name: DAPR_CERT_KEY
          value: "/var/run/secrets/dapr.io/tls/tls.key"
        volumeMounts:
        - name: dapr-config
          mountPath: /etc/dapr
        - name: tls-certs
          mountPath: /var/run/secrets/dapr.io/tls
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: dapr-config
        configMap:
          name: dapr-config
      - name: tls-certs
        secret:
          secretName: dapr-secrets

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-sentry
  namespace: dapr-system
  labels:
    app: dapr-sentry
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dapr-sentry
  template:
    metadata:
      labels:
        app: dapr-sentry
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - dapr-sentry
            topologyKey: kubernetes.io/hostname
      serviceAccountName: dapr-operator
      containers:
      - name: dapr-sentry
        image: daprio/dapr:1.12.0
        command:
        - "/sentry"
        args:
        - "--config=banking-config"
        - "--log-level=info"
        - "--log-as-json"
        - "--enable-metrics=true"
        - "--metrics-port=9090"
        - "--trust-domain=remittance.local"
        ports:
        - containerPort: 50001
          name: grpc
        - containerPort: 9090
          name: metrics
        - containerPort: 8080
          name: health
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DAPR_TRUST_ANCHORS
          value: "/var/run/secrets/dapr.io/tls/ca.crt"
        - name: DAPR_CERT_CHAIN
          value: "/var/run/secrets/dapr.io/tls/tls.crt"
        - name: DAPR_CERT_KEY
          value: "/var/run/secrets/dapr.io/tls/tls.key"
        volumeMounts:
        - name: dapr-config
          mountPath: /etc/dapr
        - name: tls-certs
          mountPath: /var/run/secrets/dapr.io/tls
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /v1.0/healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1.0/healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: dapr-config
        configMap:
          name: dapr-config
      - name: tls-certs
        secret:
          secretName: dapr-secrets

