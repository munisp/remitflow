    - protocol: TCP
      port: 7234
    - protocol: TCP
      port: 7235
    - protocol: TCP
      port: 7239
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9091
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
  egress:
