  jwt-public-key: LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0=
  tls-cert: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
  tls-key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t
  ca-cert: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal-system
  labels:
    app: temporal-frontend
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 7233
    targetPort: 7233
  - name: membership
    port: 6933
    targetPort: 6933
  - name: metrics
    port: 9090
    targetPort: 9090
  selector:
    app: temporal-frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: temporal-system
  labels:
    app: temporal-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal-frontend
  template:
    metadata:
      labels:
        app: temporal-frontend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - temporal-frontend
            topologyKey: kubernetes.io/hostname
      containers:
      - name: temporal-frontend
        image: temporalio/server:1.22.0
        command:
        - temporal-server
        - --root-dir
        - /etc/temporal
        - --config
        - config.yaml
        - --env
        - production
        - start
        - --service
        - frontend
        ports:
        - containerPort: 7233
          name: grpc
        - containerPort: 6933
          name: membership
        - containerPort: 9090
          name: metrics
        - containerPort: 7936
          name: pprof
        env:
        - name: SERVICES
          value: "frontend"
        - name: TEMPORAL_CLI_ADDRESS
          value: "temporal-frontend:7233"
        - name: TEMPORAL_CLI_TLS_CA
          value: "/etc/temporal/tls/ca.crt"
        - name: TEMPORAL_CLI_TLS_CERT
          value: "/etc/temporal/tls/tls.crt"
        - name: TEMPORAL_CLI_TLS_KEY
          value: "/etc/temporal/tls/tls.key"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: temporal-secrets
              key: postgres-password
        volumeMounts:
        - name: temporal-config
          mountPath: /etc/temporal
        - name: tls-certs
          mountPath: /etc/temporal/tls
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: temporal-config
        configMap:
          name: temporal-config
      - name: tls-certs
        secret:
          secretName: temporal-secrets

