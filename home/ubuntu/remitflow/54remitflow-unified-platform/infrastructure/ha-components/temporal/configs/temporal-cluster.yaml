---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-schema-setup
  namespace: temporal-system
  labels:
    app: temporal-schema-setup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: temporal-schema-setup
        image: temporalio/admin-tools:1.22.0
        command:
        - sh
        - -c
        - |
          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL to be ready..."
          while ! pg_isready -h postgres-service.postgres-system.svc.cluster.local -p 5432 -U temporal_user; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          
          # Setup Temporal database schema
          echo "Setting up Temporal database schema..."
          temporal-sql-tool --plugin postgres --ep postgres-service.postgres-system.svc.cluster.local -p 5432 -u temporal_user -pw temporal_password --db temporal create-database
          temporal-sql-tool --plugin postgres --ep postgres-service.postgres-system.svc.cluster.local -p 5432 -u temporal_user -pw temporal_password --db temporal setup-schema -v 0.0
          temporal-sql-tool --plugin postgres --ep postgres-service.postgres-system.svc.cluster.local -p 5432 -u temporal_user -pw temporal_password --db temporal update-schema -d /etc/temporal/schema/postgresql/v96
          
          # Setup Temporal visibility database schema
          echo "Setting up Temporal visibility database schema..."
          temporal-sql-tool --plugin postgres --ep postgres-service.postgres-system.svc.cluster.local -p 5432 -u temporal_user -pw temporal_password --db temporal_visibility create-database
          temporal-sql-tool --plugin postgres --ep postgres-service.postgres-system.svc.cluster.local -p 5432 -u temporal_user -pw temporal_password --db temporal_visibility setup-schema -v 0.0
          temporal-sql-tool --plugin postgres --ep postgres-service.postgres-system.svc.cluster.local -p 5432 -u temporal_user -pw temporal_password --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v96/visibility
          
          # Create banking namespaces
          echo "Creating banking namespaces..."
          tctl --address temporal-frontend:7233 --tls_ca_path /etc/temporal/tls/ca.crt --tls_cert_path /etc/temporal/tls/tls.crt --tls_key_path /etc/temporal/tls/tls.key namespace register --namespace banking-transactions --description "Banking transaction workflows"
          tctl --address temporal-frontend:7233 --tls_ca_path /etc/temporal/tls/ca.crt --tls_cert_path /etc/temporal/tls/tls.crt --tls_key_path /etc/temporal/tls/tls.key namespace register --namespace banking-compliance --description "Banking compliance workflows"
          tctl --address temporal-frontend:7233 --tls_ca_path /etc/temporal/tls/ca.crt --tls_cert_path /etc/temporal/tls/tls.crt --tls_key_path /etc/temporal/tls/tls.key namespace register --namespace banking-analytics --description "Banking analytics workflows"
          
          echo "Temporal setup completed successfully!"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: temporal-secrets
              key: postgres-password
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/temporal/tls
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: temporal-secrets

