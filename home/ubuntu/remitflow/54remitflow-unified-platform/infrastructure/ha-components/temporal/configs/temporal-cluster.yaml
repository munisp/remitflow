# Temporal Workflow Orchestration Configuration for Remittance Platform
# High-Availability Temporal Cluster optimized for Nigerian banking workflows

apiVersion: v1
kind: Namespace
metadata:
  name: temporal-system
  labels:
    name: temporal-system
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal-system
  labels:
    app: temporal
data:
  config.yaml: |
    # Temporal Server Configuration for Remittance Platform
    
    # Global configuration
    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: "0.0.0.0"
      pprof:
        port: 7936
      metrics:
        prometheus:
          timerType: "histogram"
          listenAddress: "0.0.0.0:9090"
        tags:
          environment: "production"
          service: "temporal"
          region: "nigeria"
    
    # Persistence configuration for banking data durability
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4
      datastores:
        default:
          sql:
            pluginName: "postgres"
            databaseName: "temporal"
            connectAddr: "postgres-service.postgres-system.svc.cluster.local:5432"
            connectProtocol: "tcp"
            user: "temporal_user"
            password: "temporal_password"
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
            tls:
              enabled: true
              caFile: "/etc/temporal/tls/ca.crt"
              certFile: "/etc/temporal/tls/client.crt"
              keyFile: "/etc/temporal/tls/client.key"
              enableHostVerification: true
        visibility:
          sql:
            pluginName: "postgres"
            databaseName: "temporal_visibility"
            connectAddr: "postgres-service.postgres-system.svc.cluster.local:5432"
            connectProtocol: "tcp"
            user: "temporal_user"
            password: "temporal_password"
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: "1h"
            tls:
              enabled: true
              caFile: "/etc/temporal/tls/ca.crt"
              certFile: "/etc/temporal/tls/client.crt"
              keyFile: "/etc/temporal/tls/client.key"
              enableHostVerification: true
    
    # Services configuration for HA deployment
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnLocalHost: false
        metrics:
          prometheus:
            timerType: "histogram"
            listenAddress: "0.0.0.0:9090"
        pprof:
          port: 7936
      
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnLocalHost: false
        metrics:
          prometheus:
            timerType: "histogram"
            listenAddress: "0.0.0.0:9091"
        pprof:
          port: 7937
      
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnLocalHost: false
        metrics:
          prometheus:
            timerType: "histogram"
            listenAddress: "0.0.0.0:9092"
        pprof:
          port: 7938
      
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnLocalHost: false
        metrics:
          prometheus:
            timerType: "histogram"
            listenAddress: "0.0.0.0:9093"
        pprof:
          port: 7940
    
    # Cluster membership configuration
    clusterMetadata:
      enableGlobalNamespace: true
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          rpcAddress: "temporal-frontend:7233"
    
    # Dynamic configuration for banking workflows
    dynamicConfigClient:
      filepath: "/etc/temporal/dynamic_config.yaml"
      pollInterval: "10s"
    
    # Authorization configuration for banking security
    authorization:
      jwtKeyProvider:
        keySourceURIs:
        - "https://keycloak.keycloak-system.svc.cluster.local/auth/realms/banking/protocol/openid-connect/certs"
        refreshInterval: "1h"
      defaultAuthorizer:
        name: "default"
        config:
          adminRoles: ["temporal-admin", "banking-admin"]
          userRoles: ["temporal-user", "banking-user"]
      claimMapper:
        name: "default"
        config:
          roleKey: "roles"
          namespaceKey: "namespace"
    
    # TLS configuration for secure communication
    tls:
      internode:
        server:
          certFile: "/etc/temporal/tls/tls.crt"
          keyFile: "/etc/temporal/tls/tls.key"
          clientCaFiles: ["/etc/temporal/tls/ca.crt"]
          requireClientAuth: true
        client:
          certFile: "/etc/temporal/tls/tls.crt"
          keyFile: "/etc/temporal/tls/tls.key"
          caFile: "/etc/temporal/tls/ca.crt"
          enableHostVerification: true
      frontend:
        server:
          certFile: "/etc/temporal/tls/tls.crt"
          keyFile: "/etc/temporal/tls/tls.key"
          clientCaFiles: ["/etc/temporal/tls/ca.crt"]
          requireClientAuth: true
        client:
          certFile: "/etc/temporal/tls/tls.crt"
          keyFile: "/etc/temporal/tls/tls.key"
          caFile: "/etc/temporal/tls/ca.crt"
          enableHostVerification: true

  dynamic_config.yaml: |
    # Dynamic configuration for banking workflow optimizations
    
    # Frontend service limits
    frontend.rps: 2000
    frontend.globalRPS: 10000
    frontend.maxConcurrentLongRunningRequestsPerInstance: 1000
    frontend.maxConcurrentRequestsPerInstance: 2000
    
    # History service limits optimized for banking transactions
    history.rps: 3000
    history.globalRPS: 15000
    history.maxAutoResetPoints: 20
    history.defaultActivityRetryPolicy:
      InitialIntervalInSeconds: 1
      MaximumIntervalInSeconds: 100
      BackoffCoefficient: 2.0
      MaximumAttempts: 3
    history.defaultWorkflowRetryPolicy:
      InitialIntervalInSeconds: 1
      MaximumIntervalInSeconds: 100
      BackoffCoefficient: 2.0
      MaximumAttempts: 3
    
    # Matching service configuration for banking task queues
    matching.rps: 2000
    matching.globalRPS: 10000
    matching.numTaskqueueReadPartitions: 4
    matching.numTaskqueueWritePartitions: 4
    matching.forwarderMaxOutstandingPolls: 1
    matching.forwarderMaxOutstandingTasks: 1
    matching.forwarderMaxRatePerSecond: 10
    matching.forwarderMaxChildrenPerNode: 20
    
    # Worker service configuration
    worker.rps: 1000
    worker.globalRPS: 5000
    
    # System workflow configurations for banking operations
    system.enableEagerWorkflowStart: true
    system.enableCrossNamespaceCommands: false
    system.enableParentClosePolicy: true
    system.enableShadowWorkflow: false
    
    # Namespace-specific configurations for banking
    namespace.banking-transactions.retention: "30d"
    namespace.banking-transactions.historyArchivalState: "enabled"
    namespace.banking-transactions.visibilityArchivalState: "enabled"
    namespace.banking-transactions.badBinaries: {}
    
    namespace.banking-compliance.retention: "2555d"  # 7 years for compliance
    namespace.banking-compliance.historyArchivalState: "enabled"
    namespace.banking-compliance.visibilityArchivalState: "enabled"
    namespace.banking-compliance.badBinaries: {}
    
    namespace.banking-analytics.retention: "90d"
    namespace.banking-analytics.historyArchivalState: "enabled"
    namespace.banking-analytics.visibilityArchivalState: "enabled"
    namespace.banking-analytics.badBinaries: {}
    
    # Archival configuration for long-term storage
    archival.history.state: "enabled"
    archival.history.enableRead: true
    archival.history.provider:
      s3:
        region: "us-east-1"
        endpoint: "s3.amazonaws.com"
        bucket: "temporal-banking-history"
        keyPrefix: "temporal-history"
        credentialsProvider: "environment"
    
    archival.visibility.state: "enabled"
    archival.visibility.enableRead: true
    archival.visibility.provider:
      s3:
        region: "us-east-1"
        endpoint: "s3.amazonaws.com"
        bucket: "temporal-banking-visibility"
        keyPrefix: "temporal-visibility"
        credentialsProvider: "environment"

  banking_workflows.yaml: |
    # Banking-specific workflow configurations
    
    workflows:
      # Transaction processing workflow
      transaction_processing:
        taskQueue: "banking-transaction-queue"
        executionTimeout: "5m"
        runTimeout: "5m"
        taskTimeout: "30s"
        retryPolicy:
          initialInterval: "1s"
          backoffCoefficient: 2.0
          maximumInterval: "100s"
          maximumAttempts: 3
        activities:
          - name: "validate_transaction"
            scheduleToCloseTimeout: "30s"
            scheduleToStartTimeout: "10s"
            startToCloseTimeout: "20s"
            heartbeatTimeout: "5s"
          - name: "check_fraud"
            scheduleToCloseTimeout: "60s"
            scheduleToStartTimeout: "10s"
            startToCloseTimeout: "50s"
            heartbeatTimeout: "10s"
          - name: "process_payment"
            scheduleToCloseTimeout: "120s"
            scheduleToStartTimeout: "10s"
            startToCloseTimeout: "110s"
            heartbeatTimeout: "15s"
          - name: "send_notification"
            scheduleToCloseTimeout: "30s"
            scheduleToStartTimeout: "5s"
            startToCloseTimeout: "25s"
            heartbeatTimeout: "5s"
      
      # KYC verification workflow
      kyc_verification:
        taskQueue: "banking-kyc-queue"
        executionTimeout: "24h"
        runTimeout: "24h"
        taskTimeout: "5m"
        retryPolicy:
          initialInterval: "10s"
          backoffCoefficient: 2.0
          maximumInterval: "300s"
          maximumAttempts: 5
        activities:
          - name: "collect_documents"
            scheduleToCloseTimeout: "1h"
            scheduleToStartTimeout: "5m"
            startToCloseTimeout: "55m"
            heartbeatTimeout: "5m"
          - name: "verify_identity"
            scheduleToCloseTimeout: "30m"
            scheduleToStartTimeout: "5m"
            startToCloseTimeout: "25m"
            heartbeatTimeout: "2m"
          - name: "check_sanctions"
            scheduleToCloseTimeout: "15m"
            scheduleToStartTimeout: "2m"
            startToCloseTimeout: "13m"
            heartbeatTimeout: "1m"
          - name: "approve_customer"
            scheduleToCloseTimeout: "10m"
            scheduleToStartTimeout: "1m"
            startToCloseTimeout: "9m"
            heartbeatTimeout: "30s"
      
      # Loan processing workflow
      loan_processing:
        taskQueue: "banking-loan-queue"
        executionTimeout: "72h"
        runTimeout: "72h"
        taskTimeout: "10m"
        retryPolicy:
          initialInterval: "30s"
          backoffCoefficient: 2.0
          maximumInterval: "600s"
          maximumAttempts: 3
        activities:
          - name: "credit_check"
            scheduleToCloseTimeout: "2h"
            scheduleToStartTimeout: "10m"
            startToCloseTimeout: "110m"
            heartbeatTimeout: "10m"
          - name: "risk_assessment"
            scheduleToCloseTimeout: "1h"
            scheduleToStartTimeout: "5m"
            startToCloseTimeout: "55m"
            heartbeatTimeout: "5m"
          - name: "manual_review"
            scheduleToCloseTimeout: "48h"
            scheduleToStartTimeout: "1h"
            startToCloseTimeout: "47h"
            heartbeatTimeout: "1h"
          - name: "loan_approval"
            scheduleToCloseTimeout: "30m"
            scheduleToStartTimeout: "5m"
            startToCloseTimeout: "25m"
            heartbeatTimeout: "2m"
      
      # Compliance reporting workflow
      compliance_reporting:
        taskQueue: "banking-compliance-queue"
        executionTimeout: "12h"
        runTimeout: "12h"
        taskTimeout: "30m"
        retryPolicy:
          initialInterval: "1m"
          backoffCoefficient: 2.0
          maximumInterval: "10m"
          maximumAttempts: 5
        activities:
          - name: "collect_data"
            scheduleToCloseTimeout: "4h"
            scheduleToStartTimeout: "30m"
            startToCloseTimeout: "3h30m"
            heartbeatTimeout: "30m"
          - name: "generate_report"
            scheduleToCloseTimeout: "2h"
            scheduleToStartTimeout: "15m"
            startToCloseTimeout: "1h45m"
            heartbeatTimeout: "15m"
          - name: "validate_report"
            scheduleToCloseTimeout: "1h"
            scheduleToStartTimeout: "10m"
            startToCloseTimeout: "50m"
            heartbeatTimeout: "10m"
          - name: "submit_report"
            scheduleToCloseTimeout: "30m"
            scheduleToStartTimeout: "5m"
            startToCloseTimeout: "25m"
            heartbeatTimeout: "5m"

