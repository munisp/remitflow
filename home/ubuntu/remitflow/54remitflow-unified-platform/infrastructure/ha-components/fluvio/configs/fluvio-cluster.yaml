# Fluvio Streaming Platform Configuration for Remittance Platform
# High-Availability Real-time Data Streaming optimized for Nigerian banking workloads

apiVersion: v1
kind: Namespace
metadata:
  name: fluvio-system
  labels:
    name: fluvio-system
    app.kubernetes.io/name: fluvio
    app.kubernetes.io/component: streaming
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluvio-config
  namespace: fluvio-system
  labels:
    app: fluvio
data:
  fluvio.toml: |
    # Fluvio Configuration for Remittance Platform
    
    [cluster]
    # Cluster configuration for HA deployment
    name = "remittance-cluster"
    namespace = "fluvio-system"
    
    # Replication settings for banking data durability
    default_replication = 3
    min_in_sync_replicas = 2
    
    # Performance settings optimized for Nigerian banking
    max_partition_size = "1GB"
    segment_max_bytes = 104857600  # 100MB
    retention_time_seconds = 604800  # 7 days for transaction data
    
    # Compression for network efficiency
    compression_type = "lz4"
    
    [storage]
    # Storage configuration for banking compliance
    data_dir = "/var/lib/fluvio/data"
    log_dir = "/var/log/fluvio"
    
    # Retention policies for different data types
    [storage.retention]
    transactions = "7d"
    audit_logs = "365d"
    notifications = "30d"
    analytics = "90d"
    
    [security]
    # TLS configuration for secure banking communications
    tls_enabled = true
    tls_cert_path = "/etc/fluvio/tls/server.crt"
    tls_key_path = "/etc/fluvio/tls/server.key"
    tls_ca_path = "/etc/fluvio/tls/ca.crt"
    
    # Authentication and authorization
    auth_enabled = true
    auth_type = "oauth2"
    
    [monitoring]
    # Metrics and observability
    metrics_enabled = true
    metrics_port = 9998
    health_check_port = 8080
    
    # Prometheus integration
    prometheus_enabled = true
    prometheus_namespace = "fluvio"
    
    [networking]
    # Network configuration for Nigerian infrastructure
    public_endpoint = "fluvio-cluster.remittance.local"
    private_endpoint = "fluvio-cluster.fluvio-system.svc.cluster.local"
    
    # Connection settings optimized for varying network conditions
    connection_timeout_ms = 30000
    request_timeout_ms = 60000
    retry_attempts = 3
    retry_backoff_ms = 1000
    
    # Buffer settings for high throughput
    send_buffer_size = 1048576  # 1MB
    receive_buffer_size = 1048576  # 1MB
    
    [topics]
    # Pre-configured topics for banking operations
    
    [topics.banking_transactions]
    partitions = 12
    replication_factor = 3
    retention_time = "7d"
    compression_type = "lz4"
    max_message_size = 1048576
    
    [topics.audit_logs]
    partitions = 6
    replication_factor = 3
    retention_time = "365d"
    compression_type = "gzip"
    max_message_size = 524288
    
    [topics.fraud_alerts]
    partitions = 8
    replication_factor = 3
    retention_time = "30d"
    compression_type = "lz4"
    max_message_size = 262144
    
    [topics.customer_notifications]
    partitions = 6
    replication_factor = 3
    retention_time = "30d"
    compression_type = "lz4"
    max_message_size = 131072
    
    [topics.analytics_events]
    partitions = 8
    replication_factor = 3
    retention_time = "90d"
    compression_type = "gzip"
    max_message_size = 2097152
    
    [topics.system_metrics]
    partitions = 4
    replication_factor = 3
    retention_time = "30d"
    compression_type = "lz4"
    max_message_size = 65536

  smartmodules.toml: |
    # SmartModules configuration for real-time data processing
    
    [smartmodules.fraud_detection]
    name = "fraud-detection-filter"
    type = "filter"
    wasm_path = "/opt/fluvio/smartmodules/fraud_detection.wasm"
    
    # Configuration for fraud detection logic
    [smartmodules.fraud_detection.config]
    threshold_amount = 1000000  # 1M Naira
    velocity_check_window = 300  # 5 minutes
    max_transactions_per_window = 10
    suspicious_locations = ["unknown", "high-risk"]
    
    [smartmodules.transaction_enrichment]
    name = "transaction-enricher"
    type = "map"
    wasm_path = "/opt/fluvio/smartmodules/transaction_enrichment.wasm"
    
    # Configuration for transaction enrichment
    [smartmodules.transaction_enrichment.config]
    customer_service_url = "http://customer-service:8080"
    account_service_url = "http://account-service:8080"
    cache_ttl_seconds = 300
    
    [smartmodules.audit_formatter]
    name = "audit-formatter"
    type = "map"
    wasm_path = "/opt/fluvio/smartmodules/audit_formatter.wasm"
    
    # Configuration for audit log formatting
    [smartmodules.audit_formatter.config]
    format = "json"
    include_timestamp = true
    include_user_context = true
    include_request_id = true
    
    [smartmodules.notification_router]
    name = "notification-router"
    type = "filter"
    wasm_path = "/opt/fluvio/smartmodules/notification_router.wasm"
    
    # Configuration for notification routing
    [smartmodules.notification_router.config]
    sms_topics = ["urgent_alerts", "transaction_confirmations"]
    email_topics = ["statements", "marketing"]
    push_topics = ["real_time_alerts", "balance_updates"]

  connectors.toml: |
    # Connectors configuration for external system integration
    
    [connectors.postgres_sink]
    name = "postgres-transaction-sink"
    type = "postgres-sink"
    version = "0.3.0"
    
    # PostgreSQL connection for transaction persistence
    [connectors.postgres_sink.config]
    url = "postgresql://banking_user:${POSTGRES_PASSWORD}@postgres-service:5432/banking_db"
    table = "transactions"
    batch_size = 1000
    flush_interval_ms = 5000
    
    # SSL configuration
    ssl_mode = "require"
    ssl_cert = "/etc/fluvio/ssl/client.crt"
    ssl_key = "/etc/fluvio/ssl/client.key"
    ssl_ca = "/etc/fluvio/ssl/ca.crt"
    
    [connectors.opensearch_sink]
    name = "opensearch-analytics-sink"
    type = "opensearch-sink"
    version = "0.2.0"
    
    # OpenSearch connection for analytics
    [connectors.opensearch_sink.config]
    url = "https://opensearch-service:9200"
    index = "banking-analytics"
    batch_size = 500
    flush_interval_ms = 10000
    
    # Authentication
    username = "fluvio_user"
    password = "${OPENSEARCH_PASSWORD}"
    
    [connectors.redis_sink]
    name = "redis-cache-sink"
    type = "redis-sink"
    version = "0.1.0"
    
    # Redis connection for caching
    [connectors.redis_sink.config]
    url = "redis://redis-service:6379"
    password = "${REDIS_PASSWORD}"
    db = 0
    key_prefix = "fluvio:"
    ttl_seconds = 3600
    
    [connectors.webhook_sink]
    name = "webhook-notification-sink"
    type = "webhook-sink"
    version = "0.2.0"
    
    # Webhook for external notifications
    [connectors.webhook_sink.config]
    url = "https://notification-service:8080/webhooks/fluvio"
    method = "POST"
    headers = { "Content-Type" = "application/json", "Authorization" = "Bearer ${WEBHOOK_TOKEN}" }
    batch_size = 100
    flush_interval_ms = 2000
    retry_attempts = 3
    retry_backoff_ms = 1000

---
apiVersion: v1
kind: Secret
metadata:
  name: fluvio-secrets
  namespace: fluvio-system
type: Opaque
data:
  # Base64 encoded secrets
  postgres-password: YmFua2luZy1uZXR3b3JrLXBvc3RncmVzLXBhc3N3b3Jk
  opensearch-password: YmFua2luZy1uZXR3b3JrLWVsYXN0aWMtcGFzc3dvcmQ=
  redis-password: YmFua2luZy1uZXR3b3JrLXJlZGlzLXBhc3N3b3Jk
  webhook-token: YmFua2luZy1uZXR3b3JrLXdlYmhvb2stdG9rZW4=
  oauth-client-secret: YmFua2luZy1uZXR3b3JrLW9hdXRoLXNlY3JldA==

---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc
  namespace: fluvio-system
  labels:
    app: fluvio-sc
spec:
  type: ClusterIP
  ports:
  - name: public
    port: 9003
    targetPort: 9003
  - name: private
    port: 9004
    targetPort: 9004
  - name: metrics
    port: 9998
    targetPort: 9998
  - name: health
    port: 8080
    targetPort: 8080
  selector:
    app: fluvio-sc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-sc
  namespace: fluvio-system
  labels:
    app: fluvio-sc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fluvio-sc
  template:
    metadata:
      labels:
        app: fluvio-sc
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fluvio-sc
            topologyKey: kubernetes.io/hostname
      containers:
      - name: fluvio-sc
        image: infinyon/fluvio:0.10.15
        command:
        - /usr/local/bin/fluvio-sc
        - --config
        - /etc/fluvio/fluvio.toml
        ports:
        - containerPort: 9003
          name: public
        - containerPort: 9004
          name: private
        - containerPort: 9998
          name: metrics
        - containerPort: 8080
          name: health
        env:
        - name: FLUVIO_LOG
          value: "info"
        - name: RUST_LOG
          value: "fluvio=info"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluvio-secrets
              key: postgres-password
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluvio-secrets
              key: opensearch-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluvio-secrets
              key: redis-password
        - name: WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: fluvio-secrets
              key: webhook-token
        volumeMounts:
        - name: fluvio-config
          mountPath: /etc/fluvio
        - name: fluvio-data
          mountPath: /var/lib/fluvio
        - name: fluvio-logs
          mountPath: /var/log/fluvio
        - name: tls-certs
          mountPath: /etc/fluvio/tls
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: fluvio-config
        configMap:
          name: fluvio-config
      - name: tls-certs
        secret:
          secretName: fluvio-secrets
      - name: fluvio-logs
        emptyDir: {}
      - name: fluvio-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-spu
  namespace: fluvio-system
  labels:
    app: fluvio-spu
spec:
  clusterIP: None
  ports:
  - name: public
    port: 9005
    targetPort: 9005
  - name: private
    port: 9006
    targetPort: 9006
  - name: metrics
    port: 9999
    targetPort: 9999
  selector:
    app: fluvio-spu

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-spu
  namespace: fluvio-system
  labels:
    app: fluvio-spu
spec:
  serviceName: fluvio-spu
  replicas: 6
  selector:
    matchLabels:
      app: fluvio-spu
  template:
    metadata:
      labels:
        app: fluvio-spu
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fluvio-spu
            topologyKey: kubernetes.io/hostname
      containers:
      - name: fluvio-spu
        image: infinyon/fluvio:0.10.15
        command:
        - /usr/local/bin/fluvio-spu
        - --sc-addr
        - fluvio-sc:9004
        - --config
        - /etc/fluvio/fluvio.toml
        ports:
        - containerPort: 9005
          name: public
        - containerPort: 9006
          name: private
        - containerPort: 9999
          name: metrics
        env:
        - name: FLUVIO_LOG
          value: "info"
        - name: RUST_LOG
          value: "fluvio=info"
        - name: SPU_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['fluvio.io/spu-id']
        volumeMounts:
        - name: fluvio-config
          mountPath: /etc/fluvio
        - name: fluvio-data
          mountPath: /var/lib/fluvio
        - name: fluvio-logs
          mountPath: /var/log/fluvio
        - name: tls-certs
          mountPath: /etc/fluvio/tls
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9999
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      initContainers:
      - name: init-spu-id
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          SPU_ID=$(echo $HOSTNAME | sed 's/fluvio-spu-//')
          echo "Setting SPU ID to: $SPU_ID"
          kubectl annotate pod $HOSTNAME fluvio.io/spu-id=$SPU_ID --overwrite
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      volumes:
      - name: fluvio-config
        configMap:
          name: fluvio-config
      - name: tls-certs
        secret:
          secretName: fluvio-secrets
      - name: fluvio-logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: fluvio-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: fluvio-cluster-init
  namespace: fluvio-system
  labels:
    app: fluvio-cluster-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: fluvio-init
        image: infinyon/fluvio:0.10.15
        command:
        - sh
        - -c
        - |
          # Wait for Fluvio SC to be ready
          echo "Waiting for Fluvio SC to be ready..."
          while ! fluvio cluster status --sc fluvio-sc:9003; do
            echo "Waiting for Fluvio SC..."
            sleep 10
          done
          
          # Create banking topics
          echo "Creating banking topics..."
          
          fluvio topic create banking_transactions \
            --partitions 12 \
            --replication 3 \
            --retention-time 7d \
            --compression lz4
          
          fluvio topic create audit_logs \
            --partitions 6 \
            --replication 3 \
            --retention-time 365d \
            --compression gzip
          
          fluvio topic create fraud_alerts \
            --partitions 8 \
            --replication 3 \
            --retention-time 30d \
            --compression lz4
          
          fluvio topic create customer_notifications \
            --partitions 6 \
            --replication 3 \
            --retention-time 30d \
            --compression lz4
          
          fluvio topic create analytics_events \
            --partitions 8 \
            --replication 3 \
            --retention-time 90d \
            --compression gzip
          
          fluvio topic create system_metrics \
            --partitions 4 \
            --replication 3 \
            --retention-time 30d \
            --compression lz4
          
          # Deploy SmartModules
          echo "Deploying SmartModules..."
          fluvio smartmodule create fraud-detection-filter \
            --wasm-file /opt/fluvio/smartmodules/fraud_detection.wasm
          
          fluvio smartmodule create transaction-enricher \
            --wasm-file /opt/fluvio/smartmodules/transaction_enrichment.wasm
          
          fluvio smartmodule create audit-formatter \
            --wasm-file /opt/fluvio/smartmodules/audit_formatter.wasm
          
          fluvio smartmodule create notification-router \
            --wasm-file /opt/fluvio/smartmodules/notification_router.wasm
          
          # Deploy Connectors
          echo "Deploying Connectors..."
          fluvio connector create postgres-transaction-sink \
            --config /etc/fluvio/connectors.toml
          
          fluvio connector create opensearch-analytics-sink \
            --config /etc/fluvio/connectors.toml
          
          fluvio connector create redis-cache-sink \
            --config /etc/fluvio/connectors.toml
          
          fluvio connector create webhook-notification-sink \
            --config /etc/fluvio/connectors.toml
          
          echo "Fluvio cluster initialization completed successfully!"
        volumeMounts:
        - name: fluvio-config
          mountPath: /etc/fluvio
        - name: smartmodules
          mountPath: /opt/fluvio/smartmodules
      volumes:
      - name: fluvio-config
        configMap:
          name: fluvio-config
      - name: smartmodules
        configMap:
          name: fluvio-smartmodules

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-sc-pdb
  namespace: fluvio-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fluvio-sc

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-spu-pdb
  namespace: fluvio-system
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: fluvio-spu

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluvio-network-policy
  namespace: fluvio-system
spec:
  podSelector:
    matchLabels:
      app: fluvio-sc
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: remittance-system
    - podSelector:
        matchLabels:
          app: fluvio-spu
    ports:
    - protocol: TCP
      port: 9003
    - protocol: TCP
      port: 9004
    - protocol: TCP
      port: 9998
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: fluvio-spu
    ports:
    - protocol: TCP
      port: 9005
    - protocol: TCP
      port: 9006
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

