# mTLS Certificate Management for Remittance Platform
# Comprehensive certificate authority and certificate management system

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-system
  labels:
    name: cert-manager-system
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: certificate-management

---
# Root CA Secret - This would be created from external CA in production
apiVersion: v1
kind: Secret
metadata:
  name: banking-root-ca
  namespace: cert-manager-system
type: kubernetes.io/tls
data:
  # Base64 encoded root CA certificate and key
  # In production, these would be generated by a proper CA infrastructure
  tls.crt: 

