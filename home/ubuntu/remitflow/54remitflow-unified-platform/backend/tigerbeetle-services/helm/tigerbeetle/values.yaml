# Default values for tigerbeetle
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# TigerBeetle cluster configuration
cluster:
  replicas: 3
  image:
    repository: ghcr.io/tigerbeetle/tigerbeetle
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  persistence:
    enabled: true
    storageClass: "fast-ssd"
    size: 100Gi
    accessMode: ReadWriteOnce
  
  service:
    type: ClusterIP
    port: 3001

# Native Zig service configuration
native:
  enabled: true
  replicas: 3
  image:
    repository: remittance/tigerbeetle-native
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  service:
    type: ClusterIP
    port: 8094
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Primary Python service configuration
primary:
  enabled: true
  replicas: 3
  image:
    repository: remittance/tigerbeetle-primary
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  
  service:
    type: ClusterIP
    port: 8091
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Edge Go service configuration
edge:
  enabled: true
  replicas: 5
  image:
    repository: remittance/tigerbeetle-edge
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  
  service:
    type: LoadBalancer
    port: 80
    targetPort: 8092
  
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    scrapeInterval: 15s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Security configuration
security:
  networkPolicy:
    enabled: true
  podSecurityPolicy:
    enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

# External dependencies
redis:
  enabled: true
  host: redis
  port: 6379

postgresql:
  enabled: true
  host: postgresql
  port: 5432
  database: remittance

# Environment variables
env:
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"

# Secrets (override in production)
secrets:
  databaseUrl: "postgresql://user:password@postgresql:5432/remittance"
  redisUrl: "redis://redis:6379"

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: tigerbeetle.example.com
      paths:
        - path: /
          pathType: Prefix
          service: tigerbeetle-edge
  tls:
    - secretName: tigerbeetle-tls
      hosts:
        - tigerbeetle.example.com

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "tigerbeetle"

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8094"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - tigerbeetle
          topologyKey: kubernetes.io/hostname

