global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'remittance-platform'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # TigerBeetle Native Zig Service
  - job_name: 'tigerbeetle-native'
    static_configs:
      - targets: ['tigerbeetle-native:8094']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TigerBeetle Python Primary Service
  - job_name: 'tigerbeetle-primary'
    static_configs:
      - targets: ['tigerbeetle-primary:8091']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TigerBeetle Go Edge Service
  - job_name: 'tigerbeetle-edge'
    static_configs:
      - targets: ['tigerbeetle-edge:8092']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TigerBeetle Sync Manager
  - job_name: 'tigerbeetle-sync'
    static_configs:
      - targets: ['tigerbeetle-sync:8093']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TigerBeetle Cluster (custom exporter)
  - job_name: 'tigerbeetle-cluster'
    static_configs:
      - targets: ['tigerbeetle-exporter:9100']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # PostgreSQL Exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

