groups:
  - name: tigerbeetle_alerts
    interval: 30s
    rules:
      # High Error Rate
      - alert: TigerBeetleHighErrorRate
        expr: rate(tigerbeetle_operation_errors_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
          component: tigerbeetle
        annotations:
          summary: "High error rate detected in TigerBeetle"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

      # High Latency
      - alert: TigerBeetleHighLatency
        expr: histogram_quantile(0.99, rate(tigerbeetle_operation_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: tigerbeetle
        annotations:
          summary: "High latency detected in TigerBeetle"
          description: "P99 latency is {{ $value }}s for {{ $labels.operation }}"

      # Service Down
      - alert: TigerBeetleServiceDown
        expr: up{job=~"tigerbeetle.*"} == 0
        for: 1m
        labels:
          severity: critical
          component: tigerbeetle
        annotations:
          summary: "TigerBeetle service is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      # High Memory Usage
      - alert: TigerBeetleHighMemoryUsage
        expr: tigerbeetle_memory_usage_bytes / 1024 / 1024 / 1024 > 3
        for: 5m
        labels:
          severity: warning
          component: tigerbeetle
        annotations:
          summary: "High memory usage in TigerBeetle"
          description: "Memory usage is {{ $value }}GB for {{ $labels.service }}"

      # Low Throughput
      - alert: TigerBeetleLowThroughput
        expr: rate(tigerbeetle_transfers_created_total[5m]) < 1000
        for: 10m
        labels:
          severity: warning
          component: tigerbeetle
        annotations:
          summary: "Low throughput detected in TigerBeetle"
          description: "Transfer rate is {{ $value }}/s (expected > 1000/s)"

      # Pending Transfer Timeout
      - alert: TigerBeetlePendingTransferTimeout
        expr: increase(tigerbeetle_transfers_timeout_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: tigerbeetle
        annotations:
          summary: "High number of pending transfer timeouts"
          description: "{{ $value }} pending transfers timed out in the last 5 minutes"

      # Cluster Unhealthy
      - alert: TigerBeetleClusterUnhealthy
        expr: tigerbeetle_cluster_healthy == 0
        for: 1m
        labels:
          severity: critical
          component: tigerbeetle
        annotations:
          summary: "TigerBeetle cluster is unhealthy"
          description: "Cluster health check failed"

      # Replica Lag
      - alert: TigerBeetleReplicaLag
        expr: tigerbeetle_replica_lag_seconds > 10
        for: 5m
        labels:
          severity: warning
          component: tigerbeetle
        annotations:
          summary: "High replica lag in TigerBeetle cluster"
          description: "Replica lag is {{ $value }}s for replica {{ $labels.replica }}"

      # Disk Space Low
      - alert: TigerBeetleDiskSpaceLow
        expr: (tigerbeetle_disk_free_bytes / tigerbeetle_disk_total_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
          component: tigerbeetle
        annotations:
          summary: "Low disk space for TigerBeetle"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

      # Connection Pool Exhausted
      - alert: TigerBeetleConnectionPoolExhausted
        expr: tigerbeetle_connections_active / tigerbeetle_connections_max > 0.9
        for: 5m
        labels:
          severity: warning
          component: tigerbeetle
        annotations:
          summary: "Connection pool near exhaustion"
          description: "{{ $value | humanizePercentage }} of connections in use"

