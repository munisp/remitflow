version: '3.8'

services:
  # TigerBeetle Core Services
  tigerbeetle-zig:
    build:
      context: ../core
      dockerfile: Dockerfile.tigerbeetle-zig
    container_name: tigerbeetle-zig
    ports:
      - "3000:3000"
    environment:
      - TB_PORT=3000
      - TB_DATA_DIR=/data
      - TB_LOG_LEVEL=info
      - TB_CLUSTER_ID=1
      - TB_REPLICA_ID=1
    volumes:
      - tigerbeetle_data:/data
      - ./config/tigerbeetle-zig.conf:/etc/tigerbeetle/config.conf
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  tigerbeetle-edge:
    build:
      context: ../services
      dockerfile: Dockerfile.tigerbeetle-edge
    container_name: tigerbeetle-edge
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - TIGERBEETLE_ZIG_ENDPOINT=http://tigerbeetle-zig:3000
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgres://tigerbeetle:tigerbeetle123@postgres:5432/tigerbeetle_db
      - LOG_LEVEL=info
      - SYNC_INTERVAL=30
    depends_on:
      - tigerbeetle-zig
      - redis
      - postgres
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Core Platform Services
  api-gateway:
    build:
      context: ../services
      dockerfile: Dockerfile.api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TIGERBEETLE_ZIG_ENDPOINT=http://tigerbeetle-zig:3000
      - TIGERBEETLE_EDGE_ENDPOINT=http://tigerbeetle-edge:3001
      - PAYMENT_SERVICE_ENDPOINT=http://payment-service:8080
      - ACCOUNT_SERVICE_ENDPOINT=http://account-service:8081
      - TRANSACTION_SERVICE_ENDPOINT=http://transaction-service:8082
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - CIRCUIT_BREAKER_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=30s
      - CACHE_TTL=30s
    depends_on:
      - tigerbeetle-zig
      - tigerbeetle-edge
      - redis
      - payment-service
      - account-service
      - transaction-service
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  payment-service:
    build:
      context: ../services
      dockerfile: Dockerfile.payment-service
    container_name: payment-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TIGERBEETLE_ZIG_ENDPOINT=http://tigerbeetle-zig:3000
      - TIGERBEETLE_EDGE_ENDPOINT=http://tigerbeetle-edge:3001
      - POSTGRES_URL=postgres://tigerbeetle:tigerbeetle123@postgres:5432/tigerbeetle_db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - MAX_PAYMENT_AMOUNT=10000000
      - AGENT_COMMISSION_RATE=0.025
    depends_on:
      - tigerbeetle-zig
      - tigerbeetle-edge
      - postgres
      - redis
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  account-service:
    build:
      context: ../services
      dockerfile: Dockerfile.account-service
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - TIGERBEETLE_ZIG_ENDPOINT=http://tigerbeetle-zig:3000
      - TIGERBEETLE_EDGE_ENDPOINT=http://tigerbeetle-edge:3001
      - POSTGRES_URL=postgres://tigerbeetle:tigerbeetle123@postgres:5432/tigerbeetle_db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - ACCOUNT_CREATION_LIMIT=1000
      - BALANCE_CACHE_TTL=30s
    depends_on:
      - tigerbeetle-zig
      - tigerbeetle-edge
      - postgres
      - redis
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  transaction-service:
    build:
      context: ../services
      dockerfile: Dockerfile.transaction-service
    container_name: transaction-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - TIGERBEETLE_ZIG_ENDPOINT=http://tigerbeetle-zig:3000
      - TIGERBEETLE_EDGE_ENDPOINT=http://tigerbeetle-edge:3001
      - POSTGRES_URL=postgres://tigerbeetle:tigerbeetle123@postgres:5432/tigerbeetle_db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - BATCH_SIZE=1000
      - MAX_RETRIES=3
    depends_on:
      - tigerbeetle-zig
      - tigerbeetle-edge
      - postgres
      - redis
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Synchronization Service
  tigerbeetle-sync:
    build:
      context: ../python-services
      dockerfile: Dockerfile.sync-service
    container_name: tigerbeetle-sync
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - DATABASE_URL=postgresql://tigerbeetle:tigerbeetle123@postgres:5432/tigerbeetle_db
      - REDIS_URL=redis://redis:6379
      - TIGERBEETLE_ZIG_ENDPOINT=http://tigerbeetle-zig:3000
      - TIGERBEETLE_EDGE_ENDPOINT=http://tigerbeetle-edge:3001
      - SYNC_INTERVAL=30
      - BATCH_SIZE=1000
      - MAX_RETRIES=3
      - LOG_LEVEL=info
    depends_on:
      - tigerbeetle-zig
      - tigerbeetle-edge
      - postgres
      - redis
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tigerbeetle_db
      - POSTGRES_USER=tigerbeetle
      - POSTGRES_PASSWORD=tigerbeetle123
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigerbeetle -d tigerbeetle_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/etc/redis/redis.conf
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=tigerbeetle123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Load Balancer
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"  # HAProxy stats
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
      - ./ssl:/etc/ssl/certs
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8404/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Log Aggregation
  opensearch:
    image: opensearchproject/opensearch:8.8.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  logstash:
    image: docker.elastic.co/logstash/logstash:8.8.0
    container_name: logstash
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline
      - ./config/logstash/config:/usr/share/logstash/config
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    depends_on:
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:8.8.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
    networks:
      - tigerbeetle-network
    restart: unless-stopped
    depends_on:
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Testing and Development Tools
  load-tester:
    build:
      context: ../testing
      dockerfile: Dockerfile.load-tester
    container_name: load-tester
    environment:
      - TARGET_URL=http://api-gateway:8000
      - TEST_DURATION=300
      - CONCURRENT_USERS=100
      - RPS_TARGET=1000
    networks:
      - tigerbeetle-network
    profiles:
      - testing
    depends_on:
      - api-gateway

  db-migrator:
    build:
      context: ../migrations
      dockerfile: Dockerfile.migrator
    container_name: db-migrator
    environment:
      - DATABASE_URL=postgresql://tigerbeetle:tigerbeetle123@postgres:5432/tigerbeetle_db
    networks:
      - tigerbeetle-network
    profiles:
      - migration
    depends_on:
      - postgres

# Networks
networks:
  tigerbeetle-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  tigerbeetle_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  opensearch_data:
    driver: local

