# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mojaloop-hub-hpa
  namespace: payment-systems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mojaloop-hub
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: mojaloop_api_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mojaloop-config
  namespace: payment-systems
data:
  # Database configuration
  database.host: "postgres.payment-systems.svc.cluster.local"
  database.port: "5432"
  database.name: "mojaloop"
  
  # TigerBeetle configuration
  tigerbeetle.cluster.id: "1"
  tigerbeetle.replicas: "3"
  
  # Kafka configuration
  kafka.brokers: "kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092"
  kafka.topic.prefix: "mojaloop"
  kafka.consumer.group: "mojaloop-hub"
  
  # Temporal configuration
  temporal.host: "temporal-frontend.temporal:7233"
  temporal.namespace: "mojaloop"
  
  # Payment system integrations
  papss.api.url: "https://api.papss.com"
  pix.api.url: "https://api.pix.bcb.gov.br"
  cips.api.url: "https://api.cips.com.cn"
  upi.api.url: "https://api.npci.org.in/upi"
  
  # Application configuration
  log.level: "INFO"
  log.format: "json"
  
  # Performance tuning
  max.concurrent.requests: "10000"
  request.timeout.seconds: "30"
  connection.pool.size: "20"
  
  # Feature flags
  feature.cross.border.enabled: "true"
  feature.upi.enabled: "true"
  feature.papss.enabled: "true"
  feature.pix.enabled: "true"
  feature.cips.enabled: "true"
  
  # SLA configuration
  sla.transfer.latency.p95.ms: "500"
  sla.transfer.latency.p99.ms: "1000"
  sla.availability.target: "99.95"

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mojaloop-hub-netpol
  namespace: payment-systems
spec:
  podSelector:
    matchLabels:
      app: mojaloop-hub
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  # Allow from Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Allow from other payment systems
  - from:
    - podSelector:
        matchLabels:
          component: payment-system
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9000
  egress:
  # Allow to database
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow to TigerBeetle
  - to:
    - podSelector:
        matchLabels:
          app: tigerbeetle
    ports:
    - protocol: TCP
      port: 3000
  # Allow to Kafka
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow to Temporal
  - to:
    - namespaceSelector:
        matchLabels:
          name: temporal
    ports:
    - protocol: TCP
      port: 7233
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow external APIs (PAPSS, PIX, CIPS, UPI)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
# RBAC - ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mojaloop-hub
  namespace: payment-systems
  labels:
    app: mojaloop-hub

---
# RBAC - Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mojaloop-hub-role
  namespace: payment-systems
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]

---
# RBAC - RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mojaloop-hub-rolebinding
  namespace: payment-systems
subjects:
- kind: ServiceAccount
  name: mojaloop-hub
  namespace: payment-systems
roleRef:
  kind: Role
  name: mojaloop-hub-role
  apiGroup: rbac.authorization.k8s.io

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mojaloop-hub-pdb
  namespace: payment-systems
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mojaloop-hub
  unhealthyPodEvictionPolicy: AlwaysAllow

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mojaloop-hub-metrics
  namespace: payment-systems
  labels:
    app: mojaloop-hub
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: mojaloop-hub
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    scheme: http
    scrapeTimeout: 10s
  - port: metrics
    interval: 15s
    path: /metrics
    scheme: http
    scrapeTimeout: 10s
    targetPort: 9091
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace

---
# ServiceMonitor for UPI Integration
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: upi-integration-metrics
  namespace: payment-systems
  labels:
    app: upi-integration
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: upi-integration
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    scheme: http
    scrapeTimeout: 10s

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mojaloop-hub-ingress
  namespace: payment-systems
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  tls:
  - hosts:
    - mojaloop.payment-hub.com
    - api.mojaloop.payment-hub.com
    secretName: mojaloop-tls
  rules:
  - host: mojaloop.payment-hub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mojaloop-hub
            port:
              number: 8080
  - host: api.mojaloop.payment-hub.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: mojaloop-hub
            port:
              number: 8080
      - path: /upi
        pathType: Prefix
        backend:
          service:
            name: upi-integration
            port:
              number: 8082

---
# Secret (template - actual values should be managed securely)
apiVersion: v1
kind: Secret
metadata:
  name: mojaloop-secrets
  namespace: payment-systems
type: Opaque
stringData:
  database.url: "postgresql://mojaloop:password@postgres:5432/mojaloop"
  database.user: "mojaloop"
  database.password: "secure_password_here"
  
  upi.merchant.id: "MERCHANT_ID_HERE"
  upi.merchant.key: "MERCHANT_KEY_HERE"
  
  papss.api.key: "PAPSS_API_KEY_HERE"
  pix.api.key: "PIX_API_KEY_HERE"
  cips.api.key: "CIPS_API_KEY_HERE"
  
  jwt.secret: "JWT_SECRET_KEY_HERE"
  encryption.key: "ENCRYPTION_KEY_HERE"

