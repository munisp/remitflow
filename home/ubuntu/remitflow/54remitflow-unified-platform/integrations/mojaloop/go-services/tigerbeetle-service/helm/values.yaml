replicaCount: 3

image:
  repository: tigerbeetle/tigerbeetle
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 4000m
    memory: 8Gi
  limits:
    cpu: 16000m
    memory: 32Gi

persistence:
  enabled: true
  storageClass: fast-ssd
  size: 100Gi

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
