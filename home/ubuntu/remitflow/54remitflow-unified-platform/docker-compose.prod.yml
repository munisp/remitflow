version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# RemitFlow Production Docker Compose
# All secrets MUST be provided via .env file or Docker secrets.
# No default values are permitted for security-critical variables.
# Run: python3 backend/scripts/validate_env.py before deploying.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── HashiCorp Vault (Secrets Management) ──────────────────────────────────
  vault:
    image: hashicorp/vault:1.15
    container_name: remittance-vault-prod
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      VAULT_ADDR: "http://0.0.0.0:8200"
    command: vault server -config=/vault/config/vault.hcl
    volumes:
      - ./infrastructure/vault/vault-config.hcl:/vault/config/vault.hcl:ro
      - ./infrastructure/vault/policies:/vault/policies:ro
      - vault_data:/vault/data
    networks:
      - remittance-network-prod
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: remittance-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/backups:/backups
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - remittance-network-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PgBouncer (Connection Pooling) ────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: remittance-pgbouncer-prod
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 600
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - remittance-network-prod
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remittance-redis-prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    volumes:
      - redis_data_prod:/data
    networks:
      - remittance-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Database Migration (runs once before API starts) ──────────────────────
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remittance-migration-prod
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      sh -c "
        echo '[migration] Running database migrations...' &&
        cd /app/database &&
        alembic upgrade head &&
        echo '[migration] Migrations completed successfully.'
      "
    networks:
      - remittance-network-prod
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remittance-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      # Database (via PgBouncer)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT & Encryption
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # HashiCorp Vault
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}

      # Application
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: WARNING

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}

      # Third-party integrations
      WISE_API_KEY: ${WISE_API_KEY}
      REMITLY_API_KEY: ${REMITLY_API_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      FIREBASE_SERVER_KEY: ${FIREBASE_SERVER_KEY}
      CIRCLE_API_KEY: ${CIRCLE_API_KEY}
      INFURA_PROJECT_ID: ${INFURA_PROJECT_ID}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      AFRICAS_TALKING_API_KEY: ${AFRICAS_TALKING_API_KEY}
      AFRICAS_TALKING_USERNAME: ${AFRICAS_TALKING_USERNAME}
      INTERSWITCH_CLIENT_ID: ${INTERSWITCH_CLIENT_ID}
      NIBSS_API_KEY: ${NIBSS_API_KEY}

      # Webhook secrets
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      WISE_WEBHOOK_SECRET: ${WISE_WEBHOOK_SECRET}

      # Idempotency
      IDEMPOTENCY_KEY_TTL_SECONDS: ${IDEMPOTENCY_KEY_TTL_SECONDS:-86400}
    volumes:
      - api_logs_prod:/app/logs
    networks:
      - remittance-network-prod
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── PWA Frontend ──────────────────────────────────────────────────────────
  pwa:
    build:
      context: ./pwa
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.remitflow.com}
        VITE_APP_ENV: production
    container_name: remittance-pwa-prod
    restart: always
    networks:
      - remittance-network-prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Nginx Reverse Proxy with TLS ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: remittance-nginx-prod
    restart: always
    depends_on:
      - api
      - pwa
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - nginx_logs_prod:/var/log/nginx
    networks:
      - remittance-network-prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Certbot (TLS Certificate Renewal) ────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: remittance-certbot
    volumes:
      - ./docker/nginx/ssl:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - remittance-network-prod

  # ── Automated Database Backup ─────────────────────────────────────────────
  db-backup:
    image: postgres:15-alpine
    container_name: remittance-db-backup-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./middleware/postgresql/scripts/backup.sh:/backup.sh:ro
      - ./database/backups:/backups
    command: >
      sh -c "
        apk add --no-cache aws-cli &&
        echo '0 2 * * * /backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    networks:
      - remittance-network-prod
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: remittance-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - remittance-network-prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: remittance-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel
      GF_SERVER_ROOT_URL: https://grafana.remitflow.com
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.sendgrid.net:587
      GF_SMTP_USER: apikey
      GF_SMTP_PASSWORD: ${SENDGRID_API_KEY}
      GF_SMTP_FROM_ADDRESS: alerts@remitflow.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - remittance-network-prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Loki (Log Aggregation) ────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: remittance-loki-prod
    restart: always
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - remittance-network-prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Promtail (Log Shipper) ────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.0
    container_name: remittance-promtail-prod
    restart: always
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./docker/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - api_logs_prod:/var/log/api:ro
      - nginx_logs_prod:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - remittance-network-prod
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  api_logs_prod:
    driver: local
  nginx_logs_prod:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  vault_data:
    driver: local
  loki_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  remittance-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
