version: "3.9"

# RemitFlow v95 — Full Production Stack
# Includes: Node app, Go rate-limit sidecar, Rust audit service, Python compliance service,
#           Nginx gateway, PostgreSQL, Redis, Kafka, Zookeeper, Prometheus, Grafana

networks:
  remitflow-v95:
    driver: bridge

volumes:
  postgres_v95_data:
  redis_v95_data:
  kafka_v95_data:
  prometheus_v95_data:
  grafana_v95_data:

services:
  # ─── Core Application ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: remitflow-app:v95
    container_name: remitflow-app-v95
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://remitflow:remitflow@postgres:5432/remitflow}
      LOCAL_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://remitflow:remitflow@postgres:5432/remitflow}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      VITE_APP_ID: ${VITE_APP_ID:-remitflow-prod}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-https://api.manus.im}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-https://manus.im}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      REDIS_URL: redis://redis:6379
      GO_RATELIMIT_URL: http://go-ratelimit:8084
      RUST_AUDIT_URL: http://rust-audit:8082
      PYTHON_COMPLIANCE_URL: http://python-compliance:8083
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-ratelimit:
        condition: service_started
      rust-audit:
        condition: service_started
      python-compliance:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - remitflow-v95

  # ─── Go Rate-Limit Sidecar ──────────────────────────────────────────────────
  go-ratelimit:
    build:
      context: ./services/go-ratelimit-sidecar
      dockerfile: Dockerfile
    image: remitflow-go-ratelimit:v95
    container_name: remitflow-go-ratelimit-v95
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_MAX_REQUESTS: "60"
      STRICT_RATE_LIMIT_MAX_REQUESTS: "5"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v95

  # ─── Rust Audit Service ─────────────────────────────────────────────────────
  rust-audit:
    build:
      context: ./services/rust-audit-service
      dockerfile: Dockerfile
    image: remitflow-rust-audit:v95
    container_name: remitflow-rust-audit-v95
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: remitflow-audit-events
      BUFFER_SIZE: "1000"
      FLUSH_INTERVAL_MS: "5000"
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v95

  # ─── Python Compliance Service ──────────────────────────────────────────────
  python-compliance:
    build:
      context: ./services/python-compliance-service
      dockerfile: Dockerfile
    image: remitflow-python-compliance:v95
    container_name: remitflow-python-compliance-v95
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "8093:8093"  # metrics port
    environment:
      PORT: "8083"
      METRICS_PORT: "8093"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      AML_THRESHOLD_SCORE: "70"
      FRAUD_BLOCK_SCORE: "85"
      SANCTIONS_API_URL: ${SANCTIONS_API_URL:-https://api.ofac.treasury.gov}
    depends_on:
      - kafka
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - remitflow-v95

  # ─── Nginx Gateway ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: remitflow-nginx-v95
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/gateway-config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway-config/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - remitflow-v95

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: remitflow-postgres-v95
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: remitflow
      POSTGRES_USER: remitflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remitflow-dev-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_v95_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remitflow -d remitflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow-v95

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: remitflow-redis-v95
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_v95_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow-v95

  # ─── Zookeeper ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: remitflow-zookeeper-v95
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remitflow-v95

  # ─── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: remitflow-kafka-v95
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka_v95_data:/var/lib/kafka/data
    networks:
      - remitflow-v95

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: remitflow-prometheus-v95
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./k8s/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_v95_data:/prometheus
    networks:
      - remitflow-v95

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: remitflow-grafana-v95
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
    volumes:
      - grafana_v95_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - remitflow-v95

  # ─── Kafka UI ───────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: remitflow-kafka-ui-v95
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: remitflow-v95
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - remitflow-v95
