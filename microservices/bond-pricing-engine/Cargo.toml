[package]
name = "bond-pricing-engine"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "bond-pricing-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actix-web = "4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
