[package]
name = "credit-scoring-engine"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actix-web = "4"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "credit-scoring-engine"
path = "src/main.rs"
