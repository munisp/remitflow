[package]
name = "tx-processor"
version = "1.0.0"
edition = "2021"
description = "RemitFlow TX Processor — transaction state machine, idempotency, retry logic"

[[bin]]
name = "tx-processor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4"] }
dashmap = "5.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
anyhow = "1.0"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
