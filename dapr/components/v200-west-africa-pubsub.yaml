apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub-west-africa
  namespace: remitflow
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    # Kafka broker connection
    - name: brokers
      value: "kafka:9092"
    - name: consumerGroup
      value: "remitflow-west-africa"
    - name: authRequired
      value: "false"
    - name: initialOffset
      value: "newest"
    - name: maxMessageBytes
      value: "1048576"
    # Topics for West African XOF corridor
    # xof-transfers: All XOF corridor transfer events (Togo, Niger, Mali, Benin, Ghana)
    # west-africa-fx-rates: Real-time XOF/NGN FX rate updates from BCEAO
    # west-africa-compliance: ECOWAS/BCEAO compliance events and alerts
    # mojaloop-xof-events: Mojaloop settlement events for XOF corridor
    # west-africa-agent-events: Agent network cash-in/cash-out events
    - name: topics
      value: "xof-transfers,west-africa-fx-rates,west-africa-compliance,mojaloop-xof-events,west-africa-agent-events"
scopes:
  - go-xof-adapter
  - python-corridor-ml
  - python-lakehouse-corridors
  - python-sme-compliance
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: redis-state-west-africa
  namespace: remitflow
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis:6379"
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "false"
    - name: keyPrefix
      value: "west-africa"
    # Cache TTL for XOF FX rates: 60 seconds
    - name: ttlInSeconds
      value: "60"
scopes:
  - go-xof-adapter
  - python-corridor-ml
---
