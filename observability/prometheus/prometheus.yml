global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: remitflow-production
    env: production

# ─── Alerting ────────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ─── Rule Files ──────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ─── Scrape Configs ──────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # ── Go Microservices ──────────────────────────────────────────────────────

  - job_name: ngx-price-feed
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: [ngx-price-feed:8081]
        labels:
          service: ngx-price-feed
          language: go
          team: data-feeds

  - job_name: api-gateway
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: [api-gateway:8082]
        labels:
          service: api-gateway
          language: go
          team: platform

  - job_name: corridor-pricing
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: [corridor-pricing:8083]
        labels:
          service: corridor-pricing
          language: go
          team: pricing

  # ── Rust Microservices ────────────────────────────────────────────────────

  - job_name: fx-engine
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: [fx-engine:8084]
        labels:
          service: fx-engine
          language: rust
          team: fx

  - job_name: tx-processor
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: [tx-processor:8085]
        labels:
          service: tx-processor
          language: rust
          team: payments

  - job_name: compliance-engine
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: [compliance-engine:8086]
        labels:
          service: compliance-engine
          language: rust
          team: compliance

  # ── Python Microservices ──────────────────────────────────────────────────

  - job_name: fraud-detection
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: [fraud-detection:8087]
        labels:
          service: fraud-detection
          language: python
          team: risk

  - job_name: aml-compliance
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: [aml-compliance:8088]
        labels:
          service: aml-compliance
          language: python
          team: compliance

  - job_name: analytics-engine
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets: [analytics-engine:8089]
        labels:
          service: analytics-engine
          language: python
          team: analytics

  # ── Node.js App Server ────────────────────────────────────────────────────
  - job_name: remitflow-app
    scrape_interval: 15s
    metrics_path: /api/metrics
    static_configs:
      - targets: [app:3000]
        labels:
          service: remitflow-app
          language: nodejs
          team: platform
