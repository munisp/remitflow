groups:
  - name: remitflow.microservices
    interval: 30s
    rules:

      # ── Service Availability ───────────────────────────────────────────────
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "{{ $labels.service }} ({{ $labels.language }}) has been unreachable for >1 minute."

      # ── Fraud Detection ────────────────────────────────────────────────────
      - alert: HighFraudRate
        expr: |
          rate(fraud_detections_total{result="fraud"}[5m]) /
          rate(fraud_detections_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "Fraud rate exceeds 5%"
          description: "Fraud detection rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: FraudModelStale
        expr: |
          (time() - fraud_model_last_trained_timestamp) > 86400
        for: 0m
        labels:
          severity: warning
          team: risk
        annotations:
          summary: "Fraud model not retrained in 24h"
          description: "The fraud detection model was last trained {{ $value | humanizeDuration }} ago."

      # ── AML Compliance ─────────────────────────────────────────────────────
      - alert: AMLHighAlertVolume
        expr: aml_active_alerts > 100
        for: 5m
        labels:
          severity: warning
          team: compliance
        annotations:
          summary: "AML alert backlog exceeds 100"
          description: "There are {{ $value }} active AML alerts pending review."

      # ── FX Engine ─────────────────────────────────────────────────────────
      - alert: FXRateStaleness
        expr: |
          (time() - fx_last_update_timestamp) > 300
        for: 2m
        labels:
          severity: warning
          team: fx
        annotations:
          summary: "FX rates not updated in 5 minutes"
          description: "FX rates are {{ $value | humanizeDuration }} stale."

      # ── TX Processor ──────────────────────────────────────────────────────
      - alert: HighTransactionFailureRate
        expr: |
          rate(tx_state_transitions_total{to_state="failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Transaction failure rate is high"
          description: "More than 0.1 transactions/sec are failing."

      # ── API Gateway ───────────────────────────────────────────────────────
      - alert: APIGatewayHighLatency
        expr: |
          histogram_quantile(0.99,
            rate(ngx_http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "API Gateway p99 latency > 2s"
          description: "99th percentile latency is {{ $value }}s."

      - alert: APIGatewayHighErrorRate
        expr: |
          rate(ngx_http_requests_total{status=~"5.."}[5m]) /
          rate(ngx_http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API Gateway error rate > 1%"
          description: "Error rate is {{ $value | humanizePercentage }}."
