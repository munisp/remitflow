name: Solidity Contract Tests

# DISABLED: there is no contracts/ directory (and no foundry.toml) in this
# repository, so every job in this workflow would fail. Manual-trigger only
# until a Foundry project is added; delete this file if the smart-contract
# workstream is abandoned.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        working-directory: contracts
        run: forge build --sizes

      - name: Run tests
        working-directory: contracts
        run: forge test -vvv

      - name: Gas report
        working-directory: contracts
        run: forge test --gas-report

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Slither
        run: pip install slither-analyzer
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run Slither
        working-directory: contracts
        run: slither . --filter-paths "test|script" || true
