name: Deploy

# Build & push container images for every service, then deploy whichever ones
# already have a Helm chart under infrastructure/charts/. As of this workflow's
# introduction only `agent-service` has a materialized chart — the services in
# services/* need a chart provisioned via infrastructure/00_provision_chart.sh
# (see infrastructure/.env.example for required secrets) before this workflow
# will actually deploy them; until then this job builds+pushes their images
# but has nothing to `helm upgrade` yet.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: registry.digitalocean.com/talentgraph-auth

jobs:
  build-and-push:
    name: Build & push / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: bnpl-service, context: services/bnpl-service }
          - { name: cbdc-service, context: services/cbdc-service }
          - { name: direct-debit-service, context: services/direct-debit-service }
          - { name: travel-rule-service, context: services/travel-rule-service }
          - { name: rust-transaction-processor, context: services/rust-transaction-processor }
          - { name: pwa, context: uis/pwa }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ env.REGISTRY }}/54remit-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy existing charts
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl kubernetes cluster kubeconfig save "${{ secrets.DO_CLUSTER_NAME }}"
      - name: helm upgrade --install for every chart under infrastructure/charts
        working-directory: infrastructure
        run: |
          set -e
          NS=54remit
          for chart in charts/*/; do
            release="$(basename "$chart")"
            echo "Deploying chart: $release"
            helm upgrade --install "$release" "$chart" -n "$NS" --create-namespace \
              --set image.tag="${{ github.sha }}"
          done
