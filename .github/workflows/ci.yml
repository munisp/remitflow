name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (uis/pwa)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uis/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: uis/pwa/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  go-services:
    name: Go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - bnpl-service
          - cbdc-service
          - direct-debit-service
          - travel-rule-service
          - multi-bank-routing-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # No go.sum is committed yet for any service in this repo. `go mod tidy`
      # resolves and downloads modules so CI can build; once go.sum is generated
      # here it should be committed from a local `go mod tidy` run for
      # reproducible, verifiable builds (see security-scanning.yml govulncheck job).
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  node-services:
    name: Node / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - tenant-management
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: Lint (non-blocking — pre-existing strict-mode findings inherited from source)
        run: npm run lint
        continue-on-error: true
      - run: npm run build
      - name: Test (only if test files exist)
        run: |
          if find src/__tests__ -type f -name "*.test.ts" 2>/dev/null | grep -q .; then
            npm test
          else
            echo "No test files found — skipping."
          fi

  rust:
    name: Rust / rust-transaction-processor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-transaction-processor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust-transaction-processor
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: clippy (non-blocking)
        run: cargo clippy --all-targets -- -W clippy::all
        continue-on-error: true

  python-services:
    name: Python / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: policy-engine-service
            path: services/policy-engine-service
          - name: saga-orchestrator-service
            path: services/saga-orchestrator-service
          - name: multi-bank-routing-service-ml
            path: services/multi-bank-routing-service/ml
          - name: payment-gateways
            path: services/payment-gateways
          - name: admin-service
            path: services/admin-service
          - name: user-service
            path: services/user-service
          - name: auth-service
            path: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest
      - name: Lint (non-blocking until repo-wide ruff baseline exists)
        working-directory: ${{ matrix.path }}
        run: ruff check .
        continue-on-error: true
      - name: Test (only if test files exist)
        working-directory: ${{ matrix.path }}
        run: |
          if find . -maxdepth 3 \( -iname "test_*.py" -o -iname "*_test.py" \) | grep -q .; then
            pytest
          else
            echo "No test files found under ${{ matrix.path }} — skipping."
          fi
