name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # ─── Lint & Type Check ────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint client/src server --ext .ts,.tsx --max-warnings 0 || true
      - name: Secrets scanning
        run: |
          npx secretlint "**/*" || true

  # ─── Unit Tests ───────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: remitflow123
          POSTGRES_DB: remitflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCAL_DATABASE_URL: postgresql://remitflow:remitflow123@localhost:5432/remitflow_test
      JWT_SECRET: test-jwt-secret-minimum-32-chars-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Push schema to test DB
        run: npx drizzle-kit push
      - name: Run tests
        run: npx vitest run --reporter=verbose
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── Security Audit ───────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high || true
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # ─── Docker Build ─────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: remitflow:${{ github.sha }},remitflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Smoke Tests ──────────────────────────────────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: remitflow123
          POSTGRES_DB: remitflow_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCAL_DATABASE_URL: postgresql://remitflow:remitflow123@localhost:5432/remitflow_smoke
      JWT_SECRET: smoke-test-jwt-secret-minimum-32-chars
      NODE_ENV: test
      PORT: 3001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx drizzle-kit push
      - name: Start server in background
        run: |
          npm run build
          node dist/server/index.js &
          sleep 5
      - name: Run smoke tests
        run: node scripts/smoke-test.mjs http://localhost:3001

  # ─── v63: Build Go Transfer Engine ────────────────────────────────────────
  build-transfer-engine:
    name: Build Go Transfer Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: services/transfer-engine/go.sum
      - name: Build
        working-directory: services/transfer-engine
        run: go build -v ./...
      - name: Test
        working-directory: services/transfer-engine
        run: go test -v -race -timeout 60s ./...
      - name: Vet
        working-directory: services/transfer-engine
        run: go vet ./...
      - name: Docker build (transfer-engine)
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: services/transfer-engine
          push: false
          tags: remitflow/transfer-engine:${{ github.sha }},remitflow/transfer-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── v63: Build Python Analytics ──────────────────────────────────────────
  build-analytics:
    name: Build Python Analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/analytics/requirements.txt
      - name: Install dependencies
        working-directory: services/analytics
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        working-directory: services/analytics
        run: pip install ruff && ruff check . || true
      - name: Type check (mypy)
        working-directory: services/analytics
        run: pip install mypy && mypy app.py --ignore-missing-imports || true
      - name: Docker build (analytics)
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: services/analytics
          push: false
          tags: remitflow/analytics:${{ github.sha }},remitflow/analytics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── v63: Build Python PDF Receipt ────────────────────────────────────────
  build-pdf-receipt:
    name: Build Python PDF Receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/pdf-receipt/requirements.txt
      - name: Install dependencies
        working-directory: services/pdf-receipt
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        working-directory: services/pdf-receipt
        run: pip install ruff && ruff check . || true
      - name: Docker build (pdf-receipt)
        uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: services/pdf-receipt
          push: false
          tags: remitflow/pdf-receipt:${{ github.sha }},remitflow/pdf-receipt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── v63: Python Smoke Tests (all microservices) ──────────────────────────
  smoke-python:
    name: Python Smoke Tests
    runs-on: ubuntu-latest
    needs: [build-analytics, build-pdf-receipt, build-transfer-engine]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install smoke test dependencies
        working-directory: services/smoke-tests
        run: pip install -r requirements.txt
      - name: Run smoke tests (mock mode)
        working-directory: services/smoke-tests
        env:
          SMOKE_MOCK_MODE: "true"
          APP_URL: "http://localhost:3000"
          ANALYTICS_URL: "http://localhost:8098"
          PDF_RECEIPT_URL: "http://localhost:8099"
          TRANSFER_ENGINE_URL: "http://localhost:50051"
        run: python smoke_test.py --mock

  # ─── v63: Full Docker Compose Integration Test ────────────────────────────
  integration-compose:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: [build, build-transfer-engine, build-analytics, build-pdf-receipt]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build all images
        run: docker compose build --parallel
      - name: Start services
        run: |
          docker compose up -d db redis
          sleep 10
          docker compose up -d app transfer-engine analytics pdf-receipt
          sleep 15
      - name: Health check all services
        run: |
          curl -f http://localhost:3000/api/trpc/system.health?batch=1&input={} || exit 1
          curl -f http://localhost:8098/health || exit 1
          curl -f http://localhost:8099/health || exit 1
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=50
      - name: Tear down
        if: always()
        run: docker compose down -v

  # v89 Pipeline Services Smoke Test
  pipeline-smoke:
    name: Pipeline Services Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.pipelines.yml
        run: docker compose -f docker-compose.pipelines.yml config --quiet
      - name: Validate Airflow DAGs syntax
        run: |
          python3 -m py_compile airflow/dags/remitflow_daily_etl.py && \
          python3 -m py_compile airflow/dags/remitflow_fraud_model_retrain.py && \
          python3 -m py_compile airflow/dags/remitflow_compliance_report.py && \
          echo "All Airflow DAGs are syntactically valid"
