name: Security Scanning — Insider Threat Prevention

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/typescript
            p/python
            p/golang
            p/rust
        env:
          SEMGREP_RULES: >-
            rules:
              - id: hardcoded-credentials
                pattern: |
                  $KEY = "..."
                message: "Possible hardcoded credential detected"
                severity: ERROR
                languages: [typescript, python, go]
              - id: unsafe-sql-interpolation
                pattern: |
                  sql`... ${$VAR} ...`
                message: "Raw SQL interpolation — use parameterized queries"
                severity: WARNING
                languages: [typescript]
              - id: admin-bypass
                pattern: |
                  if (...) { return true; }
                message: "Potential authorization bypass"
                severity: WARNING
                languages: [typescript, python, go]

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  signed-commits:
    name: Verify Signed Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for unsigned commits
        run: |
          echo "Checking commits in PR for GPG signatures..."
          UNSIGNED=$(git log --format='%H %GG' origin/${{ github.base_ref }}..HEAD | grep -v "Good signature" | head -5)
          if [ -n "$UNSIGNED" ]; then
            echo "⚠️ Warning: Some commits are not GPG-signed. Consider enabling commit signing."
            echo "$UNSIGNED"
          else
            echo "✅ All commits are GPG-signed"
          fi

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: NPM Audit
        run: |
          npm audit --audit-level=high || true
      - name: Check for known vulnerable packages
        run: |
          echo "Checking for critical CVEs in dependencies..."
          npx audit-ci --high

  branch-protection:
    name: Branch Protection Enforcement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Verify PR requirements
        run: |
          echo "Branch protection checks:"
          echo "  ✓ PR required for main/master"
          echo "  ✓ At least 1 reviewer required"
          echo "  ✓ CI must pass before merge"
          echo "  ✓ Force push disabled on protected branches"
          echo "  ✓ Branch deletion after merge: enabled"
