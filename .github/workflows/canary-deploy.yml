name: Canary Deployment

on:
  workflow_dispatch:
    inputs:
      canary_percentage:
        description: "Traffic percentage for canary (1-50)"
        required: true
        default: "5"
        type: string
      promote_timeout:
        description: "Minutes to wait before auto-promote (0=manual)"
        required: true
        default: "30"
        type: string
      rollback_threshold:
        description: "Error rate % threshold to trigger rollback"
        required: true
        default: "5"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Build Canary Image ──────────────────────────────────────────────────────
  build-canary:
    name: Build Canary Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=canary-

      - name: Build and push canary image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy Canary (5% traffic) ─────────────────────────────────────────────
  deploy-canary:
    name: Deploy Canary (${{ inputs.canary_percentage }}% traffic)
    runs-on: ubuntu-latest
    needs: [build-canary]
    environment: canary
    steps:
      - uses: actions/checkout@v7

      - name: Deploy canary instance
        # HONEST STATUS: NOT IMPLEMENTED — this generates a canary-route.json
        # in the runner workspace but never applies it to APISIX/k8s (no
        # cluster credentials are configured). Informational only.
        continue-on-error: true
        run: |
          echo "::warning::Canary deploy is NOT IMPLEMENTED — no routing change is applied to APISIX/k8s"
          echo "Deploying canary with ${{ inputs.canary_percentage }}% traffic"
          echo "Image: ${{ needs.build-canary.outputs.image_tag }}"
          # Example: kubectl set image deployment/remitflow-canary ...
          # Example: Update APISIX upstream weight

          # Create canary routing rule (APISIX example)
          cat << 'EOF' > canary-route.json
          {
            "uri": "/*",
            "upstream": {
              "type": "roundrobin",
              "nodes": {
                "remitflow-stable:3000": ${{ 100 - inputs.canary_percentage }},
                "remitflow-canary:3000": ${{ inputs.canary_percentage }}
              }
            },
            "plugins": {
              "traffic-split": {
                "rules": [
                  {
                    "match": [
                      {
                        "vars": [["http_x-canary", "==", "true"]]
                      }
                    ],
                    "weighted_upstreams": [
                      {
                        "upstream": {
                          "name": "canary",
                          "type": "roundrobin",
                          "nodes": { "remitflow-canary:3000": 1 }
                        },
                        "weight": 100
                      }
                    ]
                  }
                ]
              }
            }
          }
          EOF
          echo "Canary route config generated"

      - name: Record deployment start
        run: |
          echo "CANARY_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "Canary deployed at $(date -u)"

  # ─── Monitor Canary Health ───────────────────────────────────────────────────
  # HONEST STATUS: NOT IMPLEMENTED. There is no Prometheus endpoint reachable
  # from GitHub-hosted runners and no cluster credentials wired up. The
  # previous version faked a 0% error rate when the (unreachable) Prometheus
  # query failed, which would always "pass" and auto-promote. This job now
  # does no monitoring and reports that explicitly.
  monitor-canary:
    name: Monitor Canary Health (NOT IMPLEMENTED)
    runs-on: ubuntu-latest
    needs: [deploy-canary]
    steps:
      - uses: actions/checkout@v7

      - name: Monitor error rates
        continue-on-error: true
        run: |
          echo "::warning::Canary monitoring is NOT IMPLEMENTED."
          echo "No reachable Prometheus/metrics endpoint is configured, so no"
          echo "error-rate data was collected. Do NOT treat this job's result"
          echo "as evidence of canary health."
          echo "Requested thresholds: rollback at ${{ inputs.rollback_threshold }}% error rate, promote after ${{ inputs.promote_timeout }}m"
          echo "CANARY_STATUS=unknown" >> $GITHUB_ENV

  # ─── Promote or Rollback ─────────────────────────────────────────────────────
  # HONEST STATUS: NOT IMPLEMENTED. These jobs only print messages — no
  # kubectl/APISIX/Argo Rollouts commands are executed. Traffic is never
  # actually shifted or rolled back by this workflow.
  promote:
    name: Promote Canary to Production (NOT IMPLEMENTED)
    runs-on: ubuntu-latest
    needs: [monitor-canary]
    if: success()
    environment: production
    steps:
      - name: Promote canary to stable
        continue-on-error: true
        run: |
          echo "::warning::Canary promotion is NOT IMPLEMENTED — no traffic change was made."
          echo "TODO: implement kubectl/APISIX/Argo Rollouts promotion with cluster credentials."

      - name: Clean up canary routing
        continue-on-error: true
        run: |
          echo "::warning::Canary routing cleanup is NOT IMPLEMENTED — nothing was removed."

  rollback:
    name: Rollback Canary (NOT IMPLEMENTED)
    runs-on: ubuntu-latest
    needs: [monitor-canary]
    if: failure()
    steps:
      - name: Rollback to stable
        continue-on-error: true
        run: |
          echo "::warning::Canary rollback is NOT IMPLEMENTED — no traffic change was made."
          echo "TODO: implement rollback via Argo Rollouts/APISIX with cluster credentials."

      - name: Notify team
        continue-on-error: true
        run: |
          echo "::warning::Canary rollback notification only — integrate Slack/PagerDuty here."
