name: Static Analysis & Orphan Detection

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 3am UTC

env:
  NODE_VERSION: "22"

jobs:
  # ─── Dead Code & Orphan Detection (knip) ─────────────────────────────────
  knip:
    name: Dead Code Analysis (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run knip (unused exports, deps, files)
        run: npx knip --no-exit-code | tee knip-report.txt
      - name: Check for critical orphans
        run: |
          # Fail if there are unused exports in server/routers (indicates orphan features)
          ORPHAN_COUNT=$(grep -c "Unused exports" knip-report.txt || echo "0")
          echo "Found $ORPHAN_COUNT categories with unused exports"
          # Upload report as artifact regardless
      - name: Upload knip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-report.txt

  # ─── Circular Dependencies ───────────────────────────────────────────────
  circular-deps:
    name: Circular Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Check circular dependencies
        run: npx madge --circular --extensions ts,tsx server/ client/src/ 2>/dev/null | tee circular-deps.txt || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circular-deps-report
          path: circular-deps.txt

  # ─── Orphan Feature Audit ────────────────────────────────────────────────
  orphan-audit:
    name: Orphan Feature Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run orphan audit script
        run: node scripts/audit-orphans.mjs | tee orphan-audit.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orphan-audit-report
          path: orphan-audit.txt

  # ─── Code Pattern Scan (Quick Wins) ──────────────────────────────────────
  pattern-scan:
    name: Anti-Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for anti-patterns
        run: |
          echo "=== Unbounded Maps (should use BoundedCache) ==="
          grep -rn "new Map()" server/ --include="*.ts" | grep -v "node_modules\|test\|boundedCache\|\.d\.ts" | tee -a pattern-scan.txt || true
          echo "" >> pattern-scan.txt

          echo "=== setTimeout simulations (should be async) ==="
          grep -rn "setTimeout" server/ --include="*.ts" | grep -iv "test\|node_modules\|\.d\.ts\|scheduler\|debounce\|throttle\|retry\|backoff\|grace" | tee -a pattern-scan.txt || true
          echo "" >> pattern-scan.txt

          echo "=== Hardcoded secrets ==="
          grep -rn "FLWSECK_\|sk_test_\|pk_test_\|SANDBOXDEMOKEY" server/ client/src/ --include="*.ts" --include="*.tsx" | grep -v "node_modules\|\.d\.ts\|test" | tee -a pattern-scan.txt || true
          echo "" >> pattern-scan.txt

          echo "=== TODO/FIXME/HACK markers ==="
          grep -rn "TODO\|FIXME\|HACK\|XXX" server/ --include="*.ts" | grep -v "node_modules\|\.d\.ts" | wc -l | xargs -I{} echo "Found {} TODO/FIXME/HACK markers" | tee -a pattern-scan.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-scan-report
          path: pattern-scan.txt

  # ─── Lighthouse CI (Frontend Performance) ────────────────────────────────
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
        continue-on-error: true
