name: Integration & E2E Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        type: choice
        options:
          - all
          - sandbox
          - e2e
          - migrations
  schedule:
    - cron: "0 3 * * *" # Nightly at 3am UTC

env:
  NODE_ENV: test

jobs:
  # ── Sandbox Provider Integration Tests ──────────────────────────────────────
  sandbox-tests:
    if: inputs.suite == 'all' || inputs.suite == 'sandbox' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run sandbox integration tests
        env:
          CIRCLE_API_KEY_SANDBOX: ${{ secrets.CIRCLE_API_KEY_SANDBOX }}
          ONFIDO_API_KEY_SANDBOX: ${{ secrets.ONFIDO_API_KEY_SANDBOX }}
          FLUTTERWAVE_SECRET_KEY_TEST: ${{ secrets.FLUTTERWAVE_SECRET_KEY_TEST }}
          SMILE_PARTNER_ID_SANDBOX: ${{ secrets.SMILE_PARTNER_ID_SANDBOX }}
        run: pnpm exec vitest run tests/integration/sandbox-providers.test.ts --reporter=verbose

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sandbox-test-results
          path: test-results/

  # ── Database Migration Tests ────────────────────────────────────────────────
  migration-tests:
    if: inputs.suite == 'all' || inputs.suite == 'migrations' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: remitflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run migrations up
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/remitflow_test
        run: pnpm exec tsx drizzle/migrate.ts up

      - name: Verify migration status
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/remitflow_test
        run: pnpm exec tsx drizzle/migrate.ts status

      - name: Run migrations down (rollback test)
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/remitflow_test
        run: pnpm exec tsx drizzle/migrate.ts down

      - name: Run migrations up again (idempotency)
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/remitflow_test
        run: pnpm exec tsx drizzle/migrate.ts up

  # ── E2E Playwright Tests ────────────────────────────────────────────────────
  e2e-tests:
    if: inputs.suite == 'all' || inputs.suite == 'e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm run dev &
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Wait for server
        run: pnpm exec wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: pnpm exec playwright test tests/e2e/ --project=chromium
        env:
          BASE_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/

  # ── Docker Build Verification ───────────────────────────────────────────────
  docker-builds:
    if: inputs.suite == 'all' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: api, file: Dockerfile }
          - { name: worker, file: Dockerfile.worker }
          - { name: production, file: Dockerfile.production }
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -f ${{ matrix.service.file }} -t remitflow/${{ matrix.service.name }}:test .

      - name: Verify image starts
        run: |
          docker run --rm -d --name test-${{ matrix.service.name }} \
            -e NODE_ENV=test \
            remitflow/${{ matrix.service.name }}:test
          sleep 5
          docker logs test-${{ matrix.service.name }} 2>&1 | head -20
          if ! docker ps --format '{{.Names}}' | grep -qx "test-${{ matrix.service.name }}"; then
            echo "::error::Container exited during boot — image is not runnable"
            exit 1
          fi
          docker stop test-${{ matrix.service.name }}
