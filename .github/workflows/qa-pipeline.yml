name: QA Pipeline — RemitFlow

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Nightly full QA run at 2am UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "QA suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit-tests
          - security
          - load-testing
          - chaos-engineering
          - disaster-recovery
          - compliance
          - canary

env:
  NODE_VERSION: "20"
  K6_VERSION: "0.49.0"
  BASE_URL: "http://localhost:3001"

jobs:
  # ─── Stage 1: Unit + Integration Tests ─────────────────────────────────────
  unit-tests:
    name: "Unit & Integration Tests"
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'unit-tests'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_test
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        run: pnpm exec vitest run --reporter=junit --outputFile=test-results/unit.xml
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_test
          REDIS_URL: redis://localhost:6379

      - name: Run production scenario tests
        run: pnpm exec vitest run server/production-scenarios.test.ts server/production-scenarios-expanded.test.ts server/qr-nfc-scenarios.test.ts --reporter=junit --outputFile=test-results/scenarios.xml
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_test
          REDIS_URL: redis://localhost:6379

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/

  # ─── Stage 2: Security Scanning ────────────────────────────────────────────
  security:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'security'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (fail on critical)
        run: |
          mkdir -p qa/security/results
          pnpm audit --audit-level=critical | tee qa/security/results/pnpm-audit.txt

      - name: OWASP API scan (NOT IMPLEMENTED — informational)
        # TODO: qa/security/owasp-api-scan.sh does not exist. Honest no-op
        # instead of a phantom-path failure; implement an OWASP ZAP API scan.
        continue-on-error: true
        run: |
          mkdir -p qa/security/results
          echo "::warning::OWASP API scan not implemented (qa/security/owasp-api-scan.sh missing)" | tee qa/security/results/owasp-api-scan.txt

      - name: Dependency audit script (NOT IMPLEMENTED — informational)
        # TODO: qa/security/dependency-audit.sh does not exist. Dependency
        # auditing is covered by the gating "Dependency audit" step above.
        continue-on-error: true
        run: |
          echo "::warning::qa/security/dependency-audit.sh is not implemented; pnpm audit step above is the gating control"

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: qa/security/results/

  # ─── Stage 2b: Smart Contract Audit ────────────────────────────────────────
  contract-audit:
    name: "Smart Contract Audit"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'security'
    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Slither
        run: pip install slither-analyzer solc-select

      - name: Select Solidity version
        run: |
          solc-select install 0.8.20
          solc-select use 0.8.20

      - name: Run Foundry tests
        run: |
          if [ -d "contracts" ]; then
            cd contracts
            forge build
            forge test --gas-report
          else
            echo "No contracts directory — skipping"
          fi

      - name: Run Slither (NOT IMPLEMENTED — informational)
        # TODO: qa/security/smart-contract-audit.sh does not exist and there
        # is no contracts/ directory — nothing to audit.
        continue-on-error: true
        run: |
          echo "::warning::Smart contract audit not implemented (no contracts/ directory; qa/security/smart-contract-audit.sh missing)"

      - name: Upload audit reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-audit-reports
          path: qa/security/results/

  # ─── Stage 3: Load Testing ─────────────────────────────────────────────────
  load-testing:
    name: "Load & Performance Testing"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'load-testing')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_load
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - name: Install dependencies & start server
        run: |
          pnpm install --frozen-lockfile
          pnpm run dev &
          sleep 10
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_load
          REDIS_URL: redis://localhost:6379

      # Repointed from nonexistent qa/load-testing/k6-transfer-load.js to the
      # real k6/transfer-load-test.js (smoke scenario = reduced CI load).
      - name: Run load test (reduced for CI)
        run: |
          mkdir -p k6/results
          k6 run k6/transfer-load-test.js \
            --env SCENARIO=smoke \
            --env BASE_URL=http://localhost:3001 \
            --out json=k6/results/load-test.json

      # Repointed from nonexistent qa/load-testing/k6-financial-reconciliation.js
      # to the real k6/regulated-flow-load-test.js. This controlled test
      # requires an approved token/tenant; skips with a warning when the
      # secrets are not configured rather than failing on missing approval.
      - name: Run regulated financial flow test
        env:
          REMITFLOW_LOAD_TEST_TOKEN: ${{ secrets.REMITFLOW_LOAD_TEST_TOKEN }}
          REMITFLOW_TEST_TENANT_ID: ${{ secrets.REMITFLOW_TEST_TENANT_ID }}
        run: |
          mkdir -p k6/results
          if [ -z "$REMITFLOW_LOAD_TEST_TOKEN" ] || [ -z "$REMITFLOW_TEST_TENANT_ID" ]; then
            echo "::warning::Skipping regulated-flow test — REMITFLOW_LOAD_TEST_TOKEN / REMITFLOW_TEST_TENANT_ID secrets not configured (controlled-test approval required)"
            exit 0
          fi
          k6 run k6/regulated-flow-load-test.js \
            --env SCENARIO=smoke \
            --env BASE_URL=http://localhost:3001 \
            --env REMITFLOW_CONTROLLED_TEST_APPROVED=true \
            --env REMITFLOW_TEST_TENANT_ID=$REMITFLOW_TEST_TENANT_ID \
            --env REMITFLOW_LOAD_TEST_TOKEN=$REMITFLOW_LOAD_TEST_TOKEN \
            --out json=k6/results/regulated-flow.json

      - name: Upload load test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test-results
          path: k6/results/

  # ─── Stage 4: Chaos Engineering ────────────────────────────────────────────
  chaos-engineering:
    name: "Chaos Engineering"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'chaos-engineering')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_chaos
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies & start server
        run: |
          pnpm install --frozen-lockfile
          pnpm run dev &
          sleep 10
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_chaos
          REDIS_URL: redis://localhost:6379

      - name: Run chaos tests (NOT IMPLEMENTED — informational)
        # TODO: qa/chaos-engineering/chaos-runner.sh does not exist. Honest
        # no-op instead of a phantom-path failure; implement chaos scenarios.
        continue-on-error: true
        run: |
          mkdir -p qa/chaos-engineering/results
          echo "::warning::Chaos engineering suite not implemented (qa/chaos-engineering/chaos-runner.sh missing)" | tee qa/chaos-engineering/results/chaos.txt

      - name: Upload chaos results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chaos-results
          path: qa/chaos-engineering/results/

  # ─── Stage 5: Disaster Recovery ────────────────────────────────────────────
  disaster-recovery:
    name: "Disaster Recovery"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'disaster-recovery')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_dr
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - name: Run DR tests (NOT IMPLEMENTED — informational)
        # TODO: qa/disaster-recovery/dr-test-suite.sh does not exist. Honest
        # no-op instead of a phantom-path failure; implement DR test suite.
        continue-on-error: true
        run: |
          mkdir -p qa/disaster-recovery/results
          echo "::warning::Disaster-recovery suite not implemented (qa/disaster-recovery/dr-test-suite.sh missing)" | tee qa/disaster-recovery/results/dr.txt
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_dr
          REDIS_URL: redis://localhost:6379

      - name: Upload DR results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dr-results
          path: qa/disaster-recovery/results/

  # ─── Stage 6: Regulatory Compliance ────────────────────────────────────────
  compliance:
    name: "Regulatory Compliance"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'compliance'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_compliance
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies & start server
        run: |
          pnpm install --frozen-lockfile
          pnpm run dev &
          sleep 10
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_compliance

      - name: Run compliance tests (NOT IMPLEMENTED — informational)
        # TODO: qa/regulatory-sandbox/compliance-test-suite.sh does not exist.
        # Honest no-op instead of a phantom-path failure. NOTE: the qa-summary
        # gate treats this stage as passing — it currently verifies nothing.
        continue-on-error: true
        run: |
          mkdir -p qa/regulatory-sandbox/results
          echo "::warning::Regulatory compliance suite not implemented (qa/regulatory-sandbox/compliance-test-suite.sh missing)" | tee qa/regulatory-sandbox/results/compliance.txt

      - name: Upload compliance reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compliance-reports
          path: qa/regulatory-sandbox/results/

  # ─── Final: QA Summary ─────────────────────────────────────────────────────
  qa-summary:
    name: "QA Summary & Gate"
    runs-on: ubuntu-latest
    needs: [unit-tests, security, contract-audit, load-testing, chaos-engineering, disaster-recovery, compliance]
    if: always()
    steps:
      - name: Check all stages
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  RemitFlow — QA Pipeline Summary                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Unit Tests:          ${{ needs.unit-tests.result }}"
          echo "  Security:            ${{ needs.security.result }}"
          echo "  Contract Audit:      ${{ needs.contract-audit.result }}"
          echo "  Load Testing:        ${{ needs.load-testing.result }}"
          echo "  Chaos Engineering:   ${{ needs.chaos-engineering.result }}"
          echo "  Disaster Recovery:   ${{ needs.disaster-recovery.result }}"
          echo "  Compliance:          ${{ needs.compliance.result }}"
          echo ""

          # Fail if critical stages failed
          if [ "${{ needs.unit-tests.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: Unit tests must pass"
            exit 1
          fi
          if [ "${{ needs.security.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: Security scanning must pass"
            exit 1
          fi
          if [ "${{ needs.compliance.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: Compliance checks must pass"
            exit 1
          fi

          echo "✓ QA Gate passed — ready for deployment"
