name: QA Pipeline — RemitFlow

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Nightly full QA run at 2am UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "QA suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit-tests
          - security
          - load-testing
          - chaos-engineering
          - disaster-recovery
          - compliance
          - canary

env:
  NODE_VERSION: "20"
  K6_VERSION: "0.49.0"
  BASE_URL: "http://localhost:3001"

jobs:
  # ─── Stage 1: Unit + Integration Tests ─────────────────────────────────────
  unit-tests:
    name: "Unit & Integration Tests"
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'unit-tests'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_test
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run --reporter=junit --outputFile=test-results/unit.xml
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_test
          REDIS_URL: redis://localhost:6379

      - name: Run production scenario tests
        run: npx vitest run server/production-scenarios.test.ts server/production-scenarios-expanded.test.ts server/qr-nfc-scenarios.test.ts --reporter=junit --outputFile=test-results/scenarios.xml
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_test
          REDIS_URL: redis://localhost:6379

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/

  # ─── Stage 2: Security Scanning ────────────────────────────────────────────
  security:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'security'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: |
          mkdir -p qa/security/results
          npm audit --audit-level=high --json > qa/security/results/npm-audit.json || true
          # Fail only on critical
          CRITICAL=$(cat qa/security/results/npm-audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))" 2>/dev/null || echo "0")
          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical npm vulnerabilities found"
            exit 1
          fi

      - name: OWASP API scan (dry run)
        run: |
          chmod +x qa/security/owasp-api-scan.sh
          # Start server in background for scanning
          npm run dev &
          sleep 10
          ./qa/security/owasp-api-scan.sh http://localhost:3001 || true
          kill %1 2>/dev/null || true

      - name: Dependency audit
        run: |
          chmod +x qa/security/dependency-audit.sh
          ./qa/security/dependency-audit.sh

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: qa/security/results/

  # ─── Stage 2b: Smart Contract Audit ────────────────────────────────────────
  contract-audit:
    name: "Smart Contract Audit"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'security'
    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Slither
        run: pip install slither-analyzer solc-select

      - name: Select Solidity version
        run: |
          solc-select install 0.8.20
          solc-select use 0.8.20

      - name: Run Foundry tests
        run: |
          if [ -d "contracts" ]; then
            cd contracts
            forge build
            forge test --gas-report
          else
            echo "No contracts directory — skipping"
          fi

      - name: Run Slither
        run: |
          chmod +x qa/security/smart-contract-audit.sh
          ./qa/security/smart-contract-audit.sh || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-audit-reports
          path: qa/security/results/

  # ─── Stage 3: Load Testing ─────────────────────────────────────────────────
  load-testing:
    name: "Load & Performance Testing"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'load-testing')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_load
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xzf -
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - name: Install dependencies & start server
        run: |
          npm ci
          npm run dev &
          sleep 10
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_load
          REDIS_URL: redis://localhost:6379

      - name: Run load test (reduced for CI)
        run: |
          k6 run qa/load-testing/k6-transfer-load.js \
            --env BASE_URL=http://localhost:3001 \
            --out json=qa/load-testing/results/load-test.json \
            --duration 2m \
            --vus 50
        continue-on-error: true

      - name: Run financial reconciliation test
        run: |
          k6 run qa/load-testing/k6-financial-reconciliation.js \
            --env BASE_URL=http://localhost:3001 \
            --out json=qa/load-testing/results/reconciliation.json

      - name: Upload load test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test-results
          path: qa/load-testing/results/

  # ─── Stage 4: Chaos Engineering ────────────────────────────────────────────
  chaos-engineering:
    name: "Chaos Engineering"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'chaos-engineering')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_chaos
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies & start server
        run: |
          npm ci
          npm run dev &
          sleep 10
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_chaos
          REDIS_URL: redis://localhost:6379

      - name: Run chaos tests
        run: |
          chmod +x qa/chaos-engineering/chaos-runner.sh
          ./qa/chaos-engineering/chaos-runner.sh all http://localhost:3001

      - name: Upload chaos results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chaos-results
          path: qa/chaos-engineering/results/

  # ─── Stage 5: Disaster Recovery ────────────────────────────────────────────
  disaster-recovery:
    name: "Disaster Recovery"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'disaster-recovery')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_dr
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7

      - name: Run DR tests
        run: |
          chmod +x qa/disaster-recovery/dr-test-suite.sh
          ./qa/disaster-recovery/dr-test-suite.sh all
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_dr
          REDIS_URL: redis://localhost:6379

      - name: Upload DR results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dr-results
          path: qa/disaster-recovery/results/

  # ─── Stage 6: Regulatory Compliance ────────────────────────────────────────
  compliance:
    name: "Regulatory Compliance"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'compliance'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remitflow_compliance
          POSTGRES_USER: remitflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies & start server
        run: |
          npm ci
          npm run dev &
          sleep 10
        env:
          DATABASE_URL: postgresql://remitflow:test_password@localhost:5432/remitflow_compliance

      - name: Run compliance tests
        run: |
          chmod +x qa/regulatory-sandbox/compliance-test-suite.sh
          ./qa/regulatory-sandbox/compliance-test-suite.sh all http://localhost:3001

      - name: Upload compliance reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compliance-reports
          path: qa/regulatory-sandbox/results/

  # ─── Final: QA Summary ─────────────────────────────────────────────────────
  qa-summary:
    name: "QA Summary & Gate"
    runs-on: ubuntu-latest
    needs: [unit-tests, security, contract-audit, load-testing, chaos-engineering, disaster-recovery, compliance]
    if: always()
    steps:
      - name: Check all stages
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  RemitFlow — QA Pipeline Summary                            ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Unit Tests:          ${{ needs.unit-tests.result }}"
          echo "  Security:            ${{ needs.security.result }}"
          echo "  Contract Audit:      ${{ needs.contract-audit.result }}"
          echo "  Load Testing:        ${{ needs.load-testing.result }}"
          echo "  Chaos Engineering:   ${{ needs.chaos-engineering.result }}"
          echo "  Disaster Recovery:   ${{ needs.disaster-recovery.result }}"
          echo "  Compliance:          ${{ needs.compliance.result }}"
          echo ""

          # Fail if critical stages failed
          if [ "${{ needs.unit-tests.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: Unit tests must pass"
            exit 1
          fi
          if [ "${{ needs.security.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: Security scanning must pass"
            exit 1
          fi
          if [ "${{ needs.compliance.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: Compliance checks must pass"
            exit 1
          fi

          echo "✓ QA Gate passed — ready for deployment"
